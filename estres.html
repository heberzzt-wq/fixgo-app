<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIXGO 2026 - MEGA WAR ROOM (2000 Servicios)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #09090b; color: #10b981; font-family: 'Courier New', Courier, monospace; padding: 30px; margin: 0; }
        .btn-ataque { background: #8b5cf6; color: white; border: none; padding: 20px 40px; font-size: 18px; font-weight: 900; border-radius: 10px; cursor: pointer; text-transform: uppercase; width: 100%; margin-bottom: 15px; box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
        .btn-ataque:active { transform: scale(0.98); }
        .btn-ataque:disabled { background: #4c1d95; cursor: not-allowed; box-shadow: none; opacity: 0.7; }
        .btn-limpiar { background: #3b82f6; color: white; border: none; padding: 15px 40px; font-size: 14px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-bottom: 20px; }
        .consola { background: #000; padding: 20px; border: 1px solid #333; border-radius: 10px; height: 400px; overflow-y: auto; font-size: 12px; line-height: 1.6; }
        .log-error { color: #ef4444; }
        .log-success { color: #3b82f6; font-weight: bold; }
        .log-warning { color: #f59e0b; }
    </style>
</head>
<body>

    <h1 style="color: white;"><i class="fas fa-meteor text-purple-500"></i> FIXGO - MEGA ATAQUE DE CARGA</h1>
    <p style="color: #a1a1aa; font-size: 12px; margin-bottom: 30px;">Prueba de estrés masiva: 2000 Clientes y 200 Técnicos interactuando.</p>

    <button id="btnAtaque" class="btn-ataque"><i class="fas fa-biohazard"></i> LANZAR MEGA ATAQUE (2000 SERVICIOS)</button>
    <button id="btnLimpiar" class="btn-limpiar"><i class="fas fa-broom"></i> BORRAR TODOS LOS DATOS DE PRUEBA</button>

    <div class="consola" id="consola">
        > Consola de Mega Simulación lista... Cuidado con la RAM del navegador.
    </div>

    <script type="module">
        import { 
            db, 
            auth, 
            collection, 
            addDoc, 
            serverTimestamp, 
            query, 
            where, 
            doc, 
            updateDoc 
        } from "./firebase.js";

        import { getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const btnAtaque = document.getElementById('btnAtaque');
        const btnLimpiar = document.getElementById('btnLimpiar');
        const consola = document.getElementById('consola');

        function imprimirLog(msg, tipo = "normal") {
            const span = document.createElement("div");
            span.innerHTML = `> ${msg}`;
            if(tipo === "error") span.className = "log-error";
            if(tipo === "success") span.className = "log-success";
            if(tipo === "warning") span.className = "log-warning";
            consola.appendChild(span);
            consola.scrollTop = consola.scrollHeight; 
            console.log(msg);
        }

        btnAtaque.addEventListener('click', async () => {
            if (!auth.currentUser) {
                imprimirLog("🛑 ERROR: Sesión no detectada. Abre el panel e inicia sesión.", "error");
                return;
            }
            
            btnAtaque.disabled = true;
            imprimirLog("🚀 INICIANDO MEGA PROTOCOLO FIXGO...", "success");
            imprimirLog("⚠️ Se ejecutarán inyecciones en ráfagas para no colapsar tu navegador.", "warning");

            const totalServicios = 2000;
            const loteTamano = 500;
            let serviciosCreados = 0;
            const userId = auth.currentUser.uid;

            // Función recursiva para disparar por lotes
            const dispararLote = async () => {
                imprimirLog(`💥 Disparando lote de ${loteTamano} solicitudes...`);
                const promesas = [];

                for(let i = 1; i <= loteTamano; i++) {
                    const idActual = serviciosCreados + i;
                    const vertical = idActual % 2 === 0 ? "FIX" : "ROAD";
                    const servicio = idActual % 2 === 0 ? "ELECTRICIDAD" : "LLANTERA MÓVIL";
                    
                    const p = addDoc(collection(db, "services"), {
                        cliente_id: userId,
                        cliente_nombre: "MEGA BOT " + idActual,
                        categoria: vertical,
                        sub_servicio: servicio,
                        direccion: "Mega Simulación " + idActual + ", Cancún",
                        descripcion: "Estrés de 2000 tickets automáticos - #" + idActual,
                        estado: "pendiente",
                        zona: "Cancún",
                        created_at: serverTimestamp(),
                        es_bot: true 
                    });
                    promesas.push(p);
                }

                try {
                    await Promise.all(promesas);
                    serviciosCreados += loteTamano;
                    imprimirLog(`✅ Lote exitoso. Total acumulado: ${serviciosCreados} / ${totalServicios}`, "success");

                    if (serviciosCreados < totalServicios) {
                        imprimirLog("⏳ Enfriando cañones 1.5 segundos...");
                        setTimeout(dispararLote, 1500);
                    } else {
                        iniciarFaseTecnicos();
                    }
                } catch (error) {
                    imprimirLog("❌ Error masivo: " + error.message, "error");
                }
            };

            // Inicia la ráfaga
            dispararLote();

            // Fase 2: Competencia de Técnicos
            const iniciarFaseTecnicos = () => {
                imprimirLog("⏳ Dando 4 segundos a tu panel para renderizar 2000 tarjetas...");
                
                setTimeout(async () => {
                    imprimirLog("⚡ FASE 2: 200 Técnicos escaneando y aceptando al mismo tiempo...");
                    
                    try {
                        const qBolsa = query(collection(db, "services"), where("es_bot", "==", true), where("estado", "==", "pendiente"));
                        const snapBolsa = await getDocs(qBolsa);
                        
                        const promesasTech = [];
                        let tomados = 0;
                        
                        snapBolsa.forEach(documento => {
                            if(tomados < 200) { // 200 técnicos aceptan
                                const t = updateDoc(doc(db, "services", documento.id), {
                                    estado: "asignado",
                                    tecnico_id: "MEGA_TECH_" + tomados,
                                    tecnico_nombre: "TÉCNICO ÉLITE " + tomados,
                                    asignado_at: serverTimestamp()
                                });
                                promesasTech.push(t);
                                tomados++;
                            }
                        });
                        
                        await Promise.all(promesasTech);
                        imprimirLog(`✅ FASE 2 COMPLETADA: ${tomados} servicios tomados en milisegundos.`, "success");
                        imprimirLog("🎉 MEGA PRUEBA DE 2000 TICKETS FINALIZADA.", "success");
                        
                    } catch (e) {
                        imprimirLog("❌ Error en Fase 2: " + e.message, "error");
                    }
                }, 4000);
            };
        });

        // Modificado para poder borrar 2000 registros de golpe
        btnLimpiar.addEventListener('click', async () => {
            btnLimpiar.disabled = true;
            imprimirLog("🧹 Iniciando escaneo profundo de limpieza...");
            
            try {
                const qLimpieza = query(collection(db, "services"), where("es_bot", "==", true));
                const snapLimpieza = await getDocs(qLimpieza);
                
                if (snapLimpieza.empty) {
                    imprimirLog("👍 No hay datos de bots en la base de datos.");
                    btnLimpiar.disabled = false;
                    return;
                }

                imprimirLog(`🗑️ Encontrados ${snapLimpieza.size} registros. Eliminando... puede tardar unos segundos.`);
                const promesasBorrar = [];
                snapLimpieza.forEach(d => {
                    promesasBorrar.push(deleteDoc(doc(db, "services", d.id)));
                });
                
                await Promise.all(promesasBorrar);
                imprimirLog("✨ Limpieza total completada con éxito.", "success");
            } catch (e) {
                imprimirLog("❌ Error al limpiar: " + e.message, "error");
            }
            btnLimpiar.disabled = false;
        });
    </script>
</body>
</html>

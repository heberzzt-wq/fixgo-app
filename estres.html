<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIXGO 2026 - WAR ROOM 10K (NIVEL DIOS)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #050505; color: #10b981; font-family: 'Courier New', Courier, monospace; padding: 30px; margin: 0; }
        .btn-ataque { background: #b91c1c; color: white; border: 1px solid #f87171; padding: 20px 40px; font-size: 18px; font-weight: 900; border-radius: 10px; cursor: pointer; text-transform: uppercase; width: 100%; margin-bottom: 15px; box-shadow: 0 0 30px rgba(185, 28, 28, 0.6); transition: all 0.2s; }
        .btn-ataque:active { transform: scale(0.98); }
        .btn-ataque:disabled { background: #450a0a; border-color: #7f1d1d; cursor: not-allowed; box-shadow: none; opacity: 0.7; }
        .btn-limpiar { background: #1d4ed8; color: white; border: none; padding: 15px 40px; font-size: 14px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-bottom: 20px; }
        .consola { background: #000; padding: 20px; border: 1px solid #333; border-radius: 10px; height: 500px; overflow-y: auto; font-size: 11px; line-height: 1.6; }
        .log-error { color: #ef4444; }
        .log-success { color: #10b981; font-weight: bold; }
        .log-warning { color: #fbbf24; }
        .log-colision { color: #8b5cf6; font-weight: bold; }
    </style>
</head>
<body>

    <h1 style="color: white; text-align: center;"><i class="fas fa-skull text-red-600"></i> FIXGO - ATAQUE NIVEL UNICORNIO (10K)</h1>
    <p style="color: #a1a1aa; font-size: 12px; text-align: center; margin-bottom: 30px;">Estrés Extremo: 10,000 Servicios y 1,000 Técnicos Concurrentes.</p>

    <button id="btnAtaque" class="btn-ataque"><i class="fas fa-radiation"></i> SOLTAR EL KRAKEN (10,000 TICKETS)</button>
    <button id="btnLimpiar" class="btn-limpiar"><i class="fas fa-trash-alt"></i> PURGA DIGITAL (BORRAR DATOS)</button>

    <div class="consola" id="consola">
        > Bóveda de simulaciones iniciada. Servidores Firebase en la mira...
    </div>

    <script type="module">
        import { 
            db, 
            auth, 
            collection, 
            addDoc, 
            serverTimestamp, 
            query, 
            where, 
            doc, 
            updateDoc,
            limit
        } from "./firebase.js";

        import { getDocs, deleteDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const btnAtaque = document.getElementById('btnAtaque');
        const btnLimpiar = document.getElementById('btnLimpiar');
        const consola = document.getElementById('consola');

        function imprimirLog(msg, tipo = "normal") {
            const span = document.createElement("div");
            span.innerHTML = `> ${msg}`;
            if(tipo === "error") span.className = "log-error";
            if(tipo === "success") span.className = "log-success";
            if(tipo === "warning") span.className = "log-warning";
            if(tipo === "colision") span.className = "log-colision";
            consola.appendChild(span);
            consola.scrollTop = consola.scrollHeight; 
        }

        btnAtaque.addEventListener('click', async () => {
            if (!auth.currentUser) {
                imprimirLog("🛑 ERROR: Sesión no detectada. Inicia sesión como Admin en otra pestaña.", "error");
                return;
            }
            
            btnAtaque.disabled = true;
            imprimirLog("☢️ INICIANDO PROTOCOLO 10K...", "error");

            const totalServicios = 10000;
            const loteTamano = 500;
            let serviciosCreados = 0;
            const userId = auth.currentUser.uid;

            // FASE 1: INYECCIÓN MASIVA
            const dispararLote = async () => {
                imprimirLog(`💥 Disparando artillería: Inyectando ${loteTamano} tickets...`);
                const promesas = [];

                for(let i = 1; i <= loteTamano; i++) {
                    const idActual = serviciosCreados + i;
                    const vertical = idActual % 2 === 0 ? "FIX" : "TECH";
                    const servicio = idActual % 2 === 0 ? "PLOMERÍA" : "CCTV";
                    
                    const p = addDoc(collection(db, "services"), {
                        cliente_id: userId,
                        cliente_nombre: "TITAN BOT " + idActual,
                        categoria: vertical,
                        sub_servicio: servicio,
                        direccion: "Zona Hotelera KM " + (idActual % 25) + ", Cancún",
                        descripcion: "Estrés Nivel Dios - Ticket #" + idActual,
                        estado: "pendiente",
                        zona: "Cancún",
                        created_at: serverTimestamp(),
                        es_bot: true 
                    });
                    promesas.push(p);
                }

                try {
                    await Promise.all(promesas);
                    serviciosCreados += loteTamano;
                    imprimirLog(`✅ Impacto confirmado. Acumulado: ${serviciosCreados} / ${totalServicios}`, "success");

                    if (serviciosCreados < totalServicios) {
                        setTimeout(dispararLote, 500); // 0.5 seg de descanso entre ráfagas
                    } else {
                        iniciarFaseTecnicos();
                    }
                } catch (error) {
                    imprimirLog("❌ Error masivo: " + error.message, "error");
                }
            };

            dispararLote();

            // FASE 2: BAÑO DE SANGRE (COLISIONES CON TRANSACCIONES ATÓMICAS)
            const iniciarFaseTecnicos = () => {
                imprimirLog("⏳ Desplegando 1,000 técnicos en el mapa...");
                
                setTimeout(async () => {
                    imprimirLog("⚡ FASE 2: COLISIONES ATÓMICAS ACTIVADAS.");
                    imprimirLog("⚡ Los técnicos intentarán robarse los tickets al mismo tiempo...");
                    
                    try {
                        // Traemos 200 tickets al azar para que 1000 técnicos se peleen por ellos
                        const qBolsa = query(collection(db, "services"), where("es_bot", "==", true), where("estado", "==", "pendiente"), limit(200));
                        const snapBolsa = await getDocs(qBolsa);
                        
                        const ticketsDisponibles = [];
                        snapBolsa.forEach(d => ticketsDisponibles.push(d.id));

                        const promesasTech = [];
                        let exitos = 0;
                        let colisiones = 0;

                        // Soltamos a 1000 técnicos
                        for(let tech = 1; tech <= 1000; tech++) {
                            // Cada técnico elige un ticket al azar de la bolsa pequeña (asegura peleas)
                            const ticketObjetivo = ticketsDisponibles[Math.floor(Math.random() * ticketsDisponibles.length)];
                            
                            const serviceRef = doc(db, "services", ticketObjetivo);

                            // AQUÍ PROBAMOS EL TÚNEL CUÁNTICO DEL PANEL
                            const intentoTransaccion = runTransaction(db, async (transaction) => {
                                const sfDoc = await transaction.get(serviceRef);
                                if (sfDoc.data().estado !== "pendiente") {
                                    throw "COLISION";
                                }
                                transaction.update(serviceRef, {
                                    estado: "asignado",
                                    tecnico_id: "TECH_DIOS_" + tech,
                                    tecnico_nombre: "TÉCNICO " + tech,
                                    asignado_at: serverTimestamp()
                                });
                            }).then(() => {
                                exitos++;
                            }).catch((err) => {
                                if(err === "COLISION") {
                                    colisiones++;
                                    if(colisiones % 50 === 0) imprimirLog(`🛡️ Túnel Cuántico rebotó colisión #${colisiones}`, "colision");
                                }
                            });

                            promesasTech.push(intentoTransaccion);
                        }
                        
                        await Promise.allSettled(promesasTech);
                        imprimirLog(`📊 REPORTE DE GUERRA FINAL:`, "success");
                        imprimirLog(`✅ Tickets ganados limpiamente: ${exitos}`, "success");
                        imprimirLog(`💥 Colisiones bloqueadas (Doble Asignación Evitada): ${colisiones}`, "colision");
                        imprimirLog("🎉 ARQUITECTURA UNICORNIO VALIDADA. FixGo es invulnerable.", "success");
                        btnAtaque.disabled = false;
                        
                    } catch (e) {
                        imprimirLog("❌ Error en Fase 2: " + e.message, "error");
                    }
                }, 4000);
            };
        });

        // LIMPIEZA POR LOTES (Para no romper el navegador al borrar 10k registros)
        btnLimpiar.addEventListener('click', async () => {
            btnLimpiar.disabled = true;
            imprimirLog("🧹 Iniciando purga digital en lotes de 500...");
            
            const borrarLote = async () => {
                const qLimpieza = query(collection(db, "services"), where("es_bot", "==", true), limit(500));
                const snapLimpieza = await getDocs(qLimpieza);
                
                if (snapLimpieza.empty) {
                    imprimirLog("✨ Purga total completada. BD limpia.", "success");
                    btnLimpiar.disabled = false;
                    return;
                }

                imprimirLog(`🗑️ Destruyendo ${snapLimpieza.size} registros...`);
                const promesasBorrar = [];
                snapLimpieza.forEach(d => {
                    promesasBorrar.push(deleteDoc(doc(db, "services", d.id)));
                });
                
                await Promise.all(promesasBorrar);
                setTimeout(borrarLote, 300); // Llama al siguiente lote
            };

            borrarLote();
        });
    </script>
</body>
</html>

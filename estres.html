<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIXGO 2026 - WAR ROOM (Prueba de Estrés)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #09090b; color: #10b981; font-family: 'Courier New', Courier, monospace; padding: 30px; margin: 0; }
        .btn-ataque { background: #ef4444; color: white; border: none; padding: 20px 40px; font-size: 18px; font-weight: 900; border-radius: 10px; cursor: pointer; text-transform: uppercase; width: 100%; margin-bottom: 15px; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        .btn-ataque:active { transform: scale(0.98); }
        .btn-limpiar { background: #3b82f6; color: white; border: none; padding: 15px 40px; font-size: 14px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-bottom: 20px; }
        .consola { background: #000; padding: 20px; border: 1px solid #333; border-radius: 10px; height: 400px; overflow-y: auto; font-size: 12px; line-height: 1.6; }
        .log-error { color: #ef4444; }
        .log-success { color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body>

    <h1 style="color: white;"><i class="fas fa-fire text-red-500"></i> FIXGO - PROTOCOLO DE ESTRÉS</h1>
    <p style="color: #a1a1aa; font-size: 12px; margin-bottom: 30px;">Asegúrate de tener abierta la sesión en tu panel en otra pestaña antes de disparar.</p>

    <button id="btnAtaque" class="btn-ataque"><i class="fas fa-rocket"></i> LANZAR ATAQUE MASIVO (500 Clientes / 50 Técnicos)</button>
    <button id="btnLimpiar" class="btn-limpiar"><i class="fas fa-broom"></i> BORRAR DATOS DE PRUEBA</button>

    <div class="consola" id="consola">
        > Consola de simulación lista... Esperando orden de ejecución.
    </div>

    <script type="module">
        import { 
            db, 
            auth, 
            collection, 
            addDoc, 
            serverTimestamp, 
            query, 
            where, 
            doc, 
            updateDoc 
        } from "./firebase.js";

        // Importamos métodos extra de lectura y borrado desde el CDN de Google para no depender de si los tienes exportados en firebase.js
        import { getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const btnAtaque = document.getElementById('btnAtaque');
        const btnLimpiar = document.getElementById('btnLimpiar');
        const consola = document.getElementById('consola');

        function imprimirLog(msg, tipo = "normal") {
            const span = document.createElement("div");
            span.innerHTML = `> ${msg}`;
            if(tipo === "error") span.className = "log-error";
            if(tipo === "success") span.className = "log-success";
            consola.appendChild(span);
            consola.scrollTop = consola.scrollHeight; // Auto-scroll
            console.log(msg);
        }

        btnAtaque.addEventListener('click', async () => {
            // Validamos el blindaje
            if (!auth.currentUser) {
                imprimirLog("🛑 ERROR: No hay sesión activa. Abre el panel de FixGo en otra pestaña e inicia sesión para autorizar la prueba.", "error");
                return;
            }
            
            btnAtaque.disabled = true;
            imprimirLog("🔥 INICIANDO PROTOCOLO DE ESTRÉS FIXGO 2026...", "success");
            imprimirLog("👥 Fase 1: Generando 500 solicitudes de clientes en Cancún...");

            const promesas = [];
            const userId = auth.currentUser.uid;

            for(let i = 1; i <= 500; i++) {
                // Alternamos tipos de servicio para ver variedad en tu panel
                const vertical = i % 2 === 0 ? "FIX" : "ROAD";
                const servicio = i % 2 === 0 ? "PLOMERÍA" : "GRÚA DE ARRASTRE";
                
                const p = addDoc(collection(db, "services"), {
                    cliente_id: userId, // Usamos tu UID para respetar tus propias reglas de seguridad
                    cliente_nombre: "BOT CLIENTE " + i,
                    categoria: vertical,
                    sub_servicio: servicio,
                    direccion: "Simulación SM " + (10 + (i % 50)) + ", Cancún, Q.Roo",
                    descripcion: "Prueba de carga masiva automática - Ticket #" + i,
                    estado: "pendiente",
                    zona: "Cancún",
                    created_at: serverTimestamp(),
                    es_bot: true // Etiqueta clave para luego borrarlos fácilmente
                });
                promesas.push(p);
            }

            try {
                // Disparamos las 500 peticiones a los servidores de Google al mismo tiempo
                await Promise.all(promesas);
                imprimirLog("✅ FASE 1 COMPLETADA: 500 solicitudes impactaron la base de datos.", "success");
                
                imprimirLog("⏳ Pausa táctica de 3 segundos... (Revisa la pestaña de tu panel).");
                
                setTimeout(async () => {
                    imprimirLog("⚡ Fase 2: 50 Técnicos aceptando servicios simultáneamente...");
                    
                    const qBolsa = query(collection(db, "services"), where("es_bot", "==", true), where("estado", "==", "pendiente"));
                    const snapBolsa = await getDocs(qBolsa);
                    
                    const promesasTech = [];
                    let tomados = 0;
                    
                    snapBolsa.forEach(documento => {
                        if(tomados < 50) {
                            const t = updateDoc(doc(db, "services", documento.id), {
                                estado: "asignado",
                                tecnico_id: "BOT_TECH_" + tomados,
                                tecnico_nombre: "BOT TÉCNICO " + tomados,
                                asignado_at: serverTimestamp()
                            });
                            promesasTech.push(t);
                            tomados++;
                        }
                    });
                    
                    await Promise.all(promesasTech);
                    imprimirLog("✅ FASE 2 COMPLETADA: 50 servicios tomados con éxito.", "success");
                    imprimirLog("🎉 SIMULACIÓN FINALIZADA. Evalúa el rendimiento de la RAM de tu navegador.", "success");
                    
                }, 3000);
                
            } catch (error) {
                imprimirLog("❌ ERROR en el impacto: " + error.message, "error");
            }
        });

        btnLimpiar.addEventListener('click', async () => {
            btnLimpiar.disabled = true;
            imprimirLog("🧹 Iniciando escaneo para limpiar basura digital...");
            
            try {
                // Busca todos los documentos que tengan la etiqueta es_bot: true
                const qLimpieza = query(collection(db, "services"), where("es_bot", "==", true));
                const snapLimpieza = await getDocs(qLimpieza);
                
                if (snapLimpieza.empty) {
                    imprimirLog("👍 No hay datos de bots para borrar.");
                    btnLimpiar.disabled = false;
                    return;
                }

                const promesasBorrar = [];
                snapLimpieza.forEach(d => {
                    promesasBorrar.push(deleteDoc(doc(db, "services", d.id)));
                });
                
                await Promise.all(promesasBorrar);
                imprimirLog("✨ Limpieza total completada. " + snapLimpieza.size + " registros eliminados.", "success");
            } catch (e) {
                imprimirLog("❌ Error al limpiar: " + e.message, "error");
            }
            btnLimpiar.disabled = false;
        });
    </script>
</body>
</html>

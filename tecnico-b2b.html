<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestia | Operaciones de Campo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .step-inactive { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        canvas { background: #111; border: 1px dashed #333; touch-action: none; }
        .btn-step { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="p-4 pb-20">

    <div id="headerOrden" class="hidden mb-6 p-4 bg-zinc-900 rounded-2xl border-l-4 border-emerald-500">
        <div class="flex justify-between items-start">
            <div>
                <p id="txtSector" class="text-[10px] font-black text-emerald-500 uppercase tracking-widest"></p>
                <h2 id="txtPunto" class="text-xl font-black italic"></h2>
            </div>
            <span id="txtPrioridad" class="text-[8px] px-2 py-1 rounded bg-red-500/20 text-red-500 font-black"></span>
        </div>
    </div>

    <div id="flujoTecnico" class="space-y-4">
        
        <div id="step1" class="bg-zinc-900 p-6 rounded-3xl border border-white/5 space-y-4">
            <h3 class="text-sm font-black uppercase tracking-tighter"><span class="text-emerald-500 mr-2">01</span> Diagnóstico Inicial</h3>
            <textarea id="diagInput" placeholder="Describe el estado actual del equipo/área..." class="w-full bg-black border border-zinc-800 rounded-xl p-4 text-sm text-white outline-none focus:border-emerald-500 h-32"></textarea>
            <button onclick="enviarDiagnostico()" class="w-full bg-emerald-600 text-white font-black py-4 rounded-xl text-xs uppercase tracking-widest">Enviar Reporte Inicial</button>
        </div>

        <div id="step2" class="step-inactive bg-zinc-900 p-6 rounded-3xl border border-white/5 space-y-4">
            <h3 class="text-sm font-black uppercase tracking-tighter"><span class="text-emerald-500 mr-2">02</span> Evidencia: ANTES</h3>
            <div id="previewAntes" class="w-full aspect-video bg-black rounded-xl border border-dashed border-zinc-700 flex items-center justify-center overflow-hidden">
                <i class="fas fa-camera text-2xl text-zinc-800"></i>
            </div>
            <input type="file" id="fileAntes" accept="image/*" capture="camera" class="hidden" onchange="previewImg(this, 'previewAntes')">
            <button onclick="document.getElementById('fileAntes').click()" class="w-full bg-zinc-800 text-white font-black py-4 rounded-xl text-xs uppercase">Capturar Foto</button>
            <button id="btnUploadAntes" onclick="subirEvidencia('antes')" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl text-xs uppercase hidden">Confirmar Foto Antes</button>
        </div>

        <div id="step3" class="step-inactive bg-zinc-900 p-6 rounded-3xl border border-white/5 space-y-4">
            <h3 class="text-sm font-black uppercase tracking-tighter"><span class="text-emerald-500 mr-2">03</span> Evidencia: DESPUÉS</h3>
            <div id="previewDespues" class="w-full aspect-video bg-black rounded-xl border border-dashed border-zinc-700 flex items-center justify-center overflow-hidden">
                <i class="fas fa-check-circle text-2xl text-zinc-800"></i>
            </div>
            <input type="file" id="fileDespues" accept="image/*" capture="camera" class="hidden" onchange="previewImg(this, 'previewDespues')">
            <button onclick="document.getElementById('fileDespues').click()" class="w-full bg-zinc-800 text-white font-black py-4 rounded-xl text-xs uppercase">Capturar Resultado</button>
            <button id="btnUploadDespues" onclick="subirEvidencia('despues')" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl text-xs uppercase hidden">Confirmar Finalización</button>
        </div>

        <div id="step4" class="step-inactive bg-zinc-900 p-6 rounded-3xl border border-white/5 space-y-4 text-center">
            <h3 class="text-sm font-black uppercase tracking-tighter text-left"><span class="text-emerald-500 mr-2">04</span> Conformidad del Cliente</h3>
            <canvas id="signaturePad" class="w-full h-48 rounded-xl"></canvas>
            <div class="flex gap-2">
                <button onclick="clearSignature()" class="w-1/3 bg-zinc-800 text-zinc-400 font-bold py-3 rounded-xl text-[10px] uppercase">Borrar</button>
                <button onclick="finalizarOrden()" class="w-2/3 bg-emerald-500 text-black font-black py-3 rounded-xl text-[10px] uppercase tracking-tighter">Cerrar Orden de Trabajo</button>
            </div>
        </div>
    </div>

    <script type="module" src="./app-tecnico-b2b.js"></script>
</body>
</html>

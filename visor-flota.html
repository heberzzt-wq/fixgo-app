<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo | Centro de Comando (God View)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }
        
        /* EL MAPA DEBE TENER TAMAÑO EXPLÍCITO */
        #map { 
            height: 100vh; 
            width: 100vw; 
            background: #242f3e; /* Fondo oscuro por si tarda en cargar */
        }

        /* PANEL FLOTANTE */
        #panel-flotante {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.4);
            z-index: 999;
            max-height: 85vh;
            overflow-y: auto;
            backdrop-filter: blur(5px);
        }

        h2 { margin: 0 0 5px 0; color: #111; font-size: 20px; font-weight: 800; }
        .stat { font-size: 13px; color: #666; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        /* LISTA TÉCNICOS */
        .tech-item {
            display: flex; align-items: center; padding: 12px;
            background: #fff; border: 1px solid #eee; border-radius: 8px;
            margin-bottom: 10px; cursor: pointer; transition: all 0.2s;
        }
        .tech-item:hover { background: #f0f9ff; border-color: #0ea5e9; transform: translateX(5px); }
        
        .status-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: #ccc; margin-right: 12px; border: 2px solid #fff;
            box-shadow: 0 0 2px rgba(0,0,0,0.2);
        }
        .online { background: #10b981; box-shadow: 0 0 8px #10b981; }

        .tech-info strong { display: block; font-size: 15px; color: #333; }
        .tech-info span { font-size: 12px; color: #888; }

        .btn-refresh {
            background: #111; color: #fff; border: none; width: 100%;
            padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="panel-flotante">
        <h2>📡 Radar FixGo</h2>
        <div class="stat">Monitoreo Satelital (V5.12 Fixed)</div>
        <div id="lista-tecnicos">
            <div style="text-align:center; padding: 30px; color:#999;">Cargando sistema...</div>
        </div>
        <button class="btn-refresh" onclick="centrarMapa()">🔄 Recentrar Mapa</button>
    </div>

    <div id="map"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBlE0bkNxYC3w7KG7t9D2NU-Q3jh3B5H7k",
            authDomain: "fixgo-app.firebaseapp.com",
            projectId: "fixgo-app",
            storageBucket: "fixgo-app.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // VARIABLES GLOBALES
        let map;
        let markers = {};

        // 2. DEFINIMOS LA FUNCIÓN GLOBAL ANTES DE CARGAR EL SCRIPT
        // Esto evita el error "initMap is not a function"
        window.initMap = function() {
            console.log("🗺️ Google Maps cargado. Inicializando...");
            
            const cancun = { lat: 21.1619, lng: -86.8515 };
            
            map = new google.maps.Map(document.getElementById("map"), {
                center: cancun,
                zoom: 13,
                disableDefaultUI: false,
                backgroundColor: "#242f3e",
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                    { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
                    { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
                    { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
                    { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#212a37" }] },
                    { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
                ]
            });

            // Una vez cargado el mapa, iniciamos la escucha de Firebase
            escucharFlota();
        };

        // 3. CARGA DINÁMICA DE GOOGLE MAPS (EL SECRETO)
        // Inyectamos el script manualmente para asegurar que initMap ya exista
        function cargarScriptMaps() {
            const script = document.createElement('script');
            // TU API KEY YA ESTÁ PUESTA AQUÍ:
            script.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyBlE0bkNxYC3w7KG7t9D2NU-Q3jh3B5H7k&callback=initMap";
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        }

        // 4. LÓGICA DE FIREBASE (FLOTA)
        function escucharFlota() {
            const listaDiv = document.getElementById("lista-tecnicos");
            console.log("📡 Escuchando flota...");

            // BUSCAMOS USUARIOS CON ROL 'tecnico'
            const q = query(collection(db, "users"), where("rol", "==", "tecnico"));

            onSnapshot(q, (snapshot) => {
                listaDiv.innerHTML = "";
                
                if (snapshot.empty) {
                    listaDiv.innerHTML = "<div style='padding:20px; text-align:center'>No hay técnicos activos.</div>";
                    return;
                }

                let conteo = 0;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const uid = doc.id;
                    
                    // Solo mostramos si tienen ubicación válida
                    if (data.location && data.location.lat) {
                        actualizarMarcador(uid, data);
                        agregarItemLista(uid, data);
                        conteo++;
                    }
                });
                
                document.querySelector(".stat").innerText = `Monitoreando: ${conteo} Activos`;
            });
        }

        function actualizarMarcador(id, data) {
            const pos = { lat: data.location.lat, lng: data.location.lng };
            const nombre = data.nombre || "Técnico";

            if (markers[id]) {
                markers[id].setPosition(pos); // Mover existente
            } else {
                // Crear nuevo
                const marker = new google.maps.Marker({
                    position: pos,
                    map: map,
                    title: nombre,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 10,
                        fillColor: "#10b981",
                        fillOpacity: 1,
                        strokeWeight: 2,
                        strokeColor: "#fff"
                    }
                });
                
                // InfoWindow
                const info = new google.maps.InfoWindow({ content: `<div style='color:black'><b>${nombre}</b></div>` });
                marker.addListener("click", () => info.open(map, marker));
                
                markers[id] = marker;
            }
        }

        function agregarItemLista(id, data) {
            const nombre = data.nombre || "Técnico";
            const listaDiv = document.getElementById("lista-tecnicos");
            
            // Lógica simple de estado
            const isOnline = true; // Si aparece aquí es porque tiene datos
            
            const html = `
                <div class="tech-item" onclick="window.hacerZoom('${id}')">
                    <div class="status-dot ${isOnline ? 'online' : ''}"></div>
                    <div class="tech-info"><strong>${nombre}</strong><span>En servicio</span></div>
                </div>
            `;
            listaDiv.innerHTML += html;
        }

        // FUNCIONES GLOBALES PARA EL HTML
        window.hacerZoom = (id) => {
            if (markers[id]) {
                map.panTo(markers[id].getPosition());
                map.setZoom(16);
                markers[id].setAnimation(google.maps.Animation.BOUNCE);
                setTimeout(() => markers[id].setAnimation(null), 2000);
            }
        };

        window.centrarMapa = () => {
            map.setZoom(13);
            map.setCenter({ lat: 21.1619, lng: -86.8515 });
        };

        // EJECUTAR CARGA
        cargarScriptMaps();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestiaPremium | Centro de Comando (God View)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* ======================================================
           ESTILOS GENERALES (BASE UBER-BLACK MANTENIDA)
           ====================================================== */
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Inter', sans-serif; overflow: hidden; background-color: #242f3e;
        }
        
        #map { 
            height: 100vh; width: 100vw; background: #242f3e; 
            position: absolute; top: 0; left: 0; z-index: 1;
        }

        /* MEJORA UX: PANEL COLAPSABLE */
        #panel-flotante {
            position: absolute; top: 20px; left: 20px; width: 320px;
            background: rgba(255, 255, 255, 0.95); padding: 20px;
            border-radius: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.4);
            z-index: 10; max-height: 85vh; 
            backdrop-filter: blur(5px); display: none;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #panel-flotante.collapsed {
            transform: translateX(calc(-100% - 20px));
        }

        /* Pestaña lateral para ocultar/mostrar */
        #tabToggle {
            position: absolute; right: -32px; top: 30px; width: 32px; height: 60px;
            background: rgba(255, 255, 255, 0.95); border: none; border-radius: 0 10px 10px 0;
            box-shadow: 4px 2px 10px rgba(0,0,0,0.2); cursor: pointer; display: flex;
            align-items: center; justify-content: center; color: #555; font-size: 16px;
            transition: all 0.2s; backdrop-filter: blur(5px);
        }

        #tabToggle:hover { color: #3b82f6; background: #fff; }

        /* Contenedor scrolleable interno para no romper la pestaña */
        #lista-tecnicos {
            max-height: calc(85vh - 160px);
            overflow-y: auto;
            padding-right: 5px;
        }
        
        #lista-tecnicos::-webkit-scrollbar { width: 6px; }
        #lista-tecnicos::-webkit-scrollbar-track { background: transparent; }
        #lista-tecnicos::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

        h2 { margin: 0 0 5px 0; color: #111; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .stat { font-size: 13px; color: #666; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        .tech-item {
            display: flex; align-items: center; padding: 12px;
            background: #fff; border: 1px solid #eee; border-radius: 8px;
            margin-bottom: 10px; cursor: pointer; transition: all 0.2s;
        }
        .tech-item:hover { background: #eff6ff; border-color: #3b82f6; transform: translateX(5px); }
        
        .status-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: #ccc; margin-right: 12px; border: 2px solid #fff;
            box-shadow: 0 0 2px rgba(0,0,0,0.2);
        }
        .online { background: #10b981; box-shadow: 0 0 8px #10b981; }

        .tech-info strong { display: block; font-size: 15px; color: #333; }
        .tech-info span { font-size: 11px; color: #888; }
        
        .badge-vehiculo {
            font-size: 9px; text-transform: uppercase; background: #3b82f6;
            color: white; padding: 2px 6px; border-radius: 4px;
            margin-top: 3px; display: inline-block; font-weight: 800;
        }

        .btn-refresh {
            background: #111; color: #fff; border: none; width: 100%;
            padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 15px;
        }

        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(10px);
        }
        
        .login-box {
            background: white; padding: 40px; border-radius: 20px;
            width: 100%; max-width: 380px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        
        .login-box h3 { margin-top: 0; color: #111; font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .login-box p { color: #555; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        
        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group label { display: block; font-size: 11px; font-weight: 900; margin-bottom: 6px; color: #222; text-transform: uppercase; }
        .input-group input {
            width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px;
            font-size: 16px; box-sizing: border-box; transition: border 0.3s;
        }
        .input-group input:focus { border-color: #3b82f6; outline: none; }
        
        .btn-login {
            width: 100%; padding: 16px; background: #111; color: white;
            border: none; border-radius: 12px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: transform 0.2s;
        }
        .btn-login:active { transform: scale(0.98); }
        
        #error-msg { color: #ef4444; font-size: 13px; margin-top: 15px; font-weight: 600; display: none; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h3><img src="assets/gestiapremium-icon.svg" style="width: 28px; filter: drop-shadow(0 0 5px rgba(59,130,246,0.6));"> GESTIA<span style="color:#3b82f6">PREMIUM</span></h3>
            <p>Monitoreo táctico de unidades en tiempo real. Ingresa credenciales de administrador.</p>
            <div class="input-group">
                <label>Administrador</label>
                <input type="email" id="email" placeholder="admin@gestiapremium.com">
            </div>
            <div class="input-group">
                <label>Código de Acceso</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-login" id="btnAcceder">DESBLOQUEAR RADAR</button>
            <div id="error-msg">Acceso denegado. Revisa tus datos.</div>
        </div>
    </div>

    <div id="panel-flotante">
        <button onclick="window.togglePanel()" id="tabToggle" title="Ocultar/Mostrar Panel">
            <i class="fas fa-chevron-left" id="iconToggle"></i>
        </button>
        
        <h2><img src="assets/gestiapremium-icon.svg" style="width: 22px;"> Radar Unidades</h2>
        <div class="stat">Sincronizando con Satélites GPS...</div>
        
        <div id="lista-tecnicos">
            <div style="text-align:center; padding: 40px; color:#bbb;">
                <i class="fas fa-satellite-dish fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i>
                <p>Escaneando red...</p>
            </div>
        </div>
        <button class="btn-refresh" onclick="window.centrarMapa()">🎯 Recentrar Operaciones</button>
    </div>

    <div id="map"></div>

    <script>
        let radarMap = null;
        let isRadarMapReady = false;

        // Lógica de Ocultamiento de Panel
        window.togglePanel = function() {
            const panel = document.getElementById('panel-flotante');
            const icon = document.getElementById('iconToggle');
            panel.classList.toggle('collapsed');
            
            if (panel.classList.contains('collapsed')) {
                icon.classList.replace('fa-chevron-left', 'fa-chevron-right');
            } else {
                icon.classList.replace('fa-chevron-right', 'fa-chevron-left');
            }
        };

        window.initMap = function() {
            const cancun = { lat: 21.1619, lng: -86.8515 };
            radarMap = new google.maps.Map(document.getElementById("map"), {
                center: cancun,
                zoom: 13,
                disableDefaultUI: false,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                    { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
                    { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
                    { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
                ]
            });
            isRadarMapReady = true;
            window.dispatchEvent(new Event('radarMapReady'));
        };

        window.centrarMapa = () => {
            if (radarMap) {
                radarMap.setZoom(13);
                radarMap.setCenter({ lat: 21.1619, lng: -86.8515 });
            }
        };
    </script>

    <script type="module">
        // USAMOS NUESTRO FIREBASE.JS UNIFICADO PARA EVITAR CONFLICTOS
        import { db, auth, onSnapshot, collection, query, where, signInWithEmailAndPassword, onAuthStateChanged } from './firebase.js';

        let markers = {};

        const SVGS = {
            moto: "M20,16.5A2.5,2.5 0 0,1 17.5,19A2.5,2.5 0 0,1 15,16.5A2.5,2.5 0 0,1 17.5,14A2.5,2.5 0 0,1 20,16.5M5,16.5A2.5,2.5 0 0,1 2.5,19A2.5,2.5 0 0,1 0,16.5A2.5,2.5 0 0,1 2.5,14A2.5,2.5 0 0,1 5,16.5M20.3,12L19,8H15V6H13V8H9V10H11V12H9V14H15V12H20.3Z",
            auto: "M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z",
            camioneta: "M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm12 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"
        };

        const overlay = document.getElementById('login-overlay');
        const panel = document.getElementById('panel-flotante');
        const btnAcceder = document.getElementById('btnAcceder');
        const errorMsg = document.getElementById('error-msg');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                overlay.style.display = 'none';
                panel.style.display = 'block';
                if (isRadarMapReady) escucharFlota();
                else window.addEventListener('radarMapReady', escucharFlota);
            } else {
                overlay.style.display = 'flex';
                panel.style.display = 'none';
            }
        });

        btnAcceder.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            btnAcceder.innerText = "ACCEDIENDO...";
            btnAcceder.disabled = true;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorMsg.style.display = 'block';
                btnAcceder.innerText = "DESBLOQUEAR RADAR";
                btnAcceder.disabled = false;
            }
        });

        function escucharFlota() {
            if (!radarMap) return;
            const listaDiv = document.getElementById("lista-tecnicos");
            const q = query(collection(db, "users"), where("rol", "==", "tecnico"));

            onSnapshot(q, (snapshot) => {
                listaDiv.innerHTML = "";
                let conteo = 0;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.location && data.location.lat) {
                        actualizarMarcador(doc.id, data);
                        agregarItemLista(doc.id, data);
                        conteo++;
                    }
                });
                document.querySelector(".stat").innerText = `Operando: ${conteo} Unidades GestiaPremium`;
            });
        }

        function actualizarMarcador(id, data) {
            const pos = { lat: data.location.lat, lng: data.location.lng };
            const nombre = data.nombre || "Socio GestiaPremium";
            
            const vehiculo = data.tipoVehiculo || "auto"; 
            const modelo = data.modeloVehiculo || "No especificado";
            const anio = data.anioVehiculo || "N/A";
            const colorVehiculo = data.colorVehiculo || "N/A";

            // BLINDAJE SENIOR: Optional Chaining para evitar fallos si telemetria es null
            const rumbo = data.telemetria?.rumbo || 0;
            const velocidad = data.telemetria?.velocidad ? (data.telemetria.velocidad * 3.6).toFixed(1) : 0;

            const colorIcono = vehiculo === 'moto' ? "#10b981" : (vehiculo === 'camioneta' ? "#f59e0b" : "#3b82f6");

            if (markers[id]) {
                markers[id].setPosition(pos);
                const icon = markers[id].getIcon();
                icon.rotation = rumbo;
                markers[id].setIcon(icon);
            } else {
                const marker = new google.maps.Marker({
                    position: pos,
                    map: radarMap, // Usando la variable global segura
                    title: nombre,
                    icon: {
                        path: SVGS[vehiculo] || SVGS.auto,
                        scale: 1.5,
                        fillColor: colorIcono,
                        fillOpacity: 1,
                        anchor: new google.maps.Point(12, 12),
                        strokeWeight: 2,
                        strokeColor: "#ffffff",
                        rotation: rumbo
                    }
                });

                const info = new google.maps.InfoWindow({ 
                    content: `
                        <div style='color:#111; font-family: sans-serif; padding: 10px; min-width: 180px;'>
                            <b style='font-size: 15px; border-bottom: 2px solid ${colorIcono}; display: block; padding-bottom: 5px;'>${nombre.toUpperCase()}</b>
                            <div style='margin-top: 10px; font-size: 12px; line-height: 1.6;'>
                                🛵 <b>Tipo:</b> ${vehiculo.toUpperCase()}<br>
                                🏎️ <b>Modelo:</b> ${modelo}<br>
                                🎨 <b>Color:</b> ${colorVehiculo}<br>
                                📅 <b>Año:</b> ${anio}<br>
                                <hr style='border: 0; border-top: 1px solid #eee; margin: 8px 0;'>
                                ⚡ <b>Velocidad:</b> ${velocidad} km/h
                            </div>
                        </div>` 
                });

                marker.addListener("click", () => info.open(radarMap, marker));
                markers[id] = marker;
            }
        }

        function agregarItemLista(id, data) {
            const nombre = data.nombre || "Socio GestiaPremium";
            const vehiculo = data.tipoVehiculo || "auto";
            const modelo = data.modeloVehiculo || "";
            const listaDiv = document.getElementById("lista-tecnicos");
            
            const html = `
                <div class="tech-item" onclick="window.hacerZoom('${id}')">
                    <div class="status-dot online"></div>
                    <div class="tech-info">
                        <strong>${nombre}</strong>
                        <span>${modelo}</span>
                        <span class="badge-vehiculo">${vehiculo}</span>
                    </div>
                </div>
            `;
            listaDiv.innerHTML += html;
        }

        window.hacerZoom = (id) => {
            if (markers[id] && radarMap) {
                radarMap.panTo(markers[id].getPosition());
                radarMap.setZoom(18);
                markers[id].setAnimation(google.maps.Animation.BOUNCE);
                setTimeout(() => markers[id].setAnimation(null), 2000);
            }
        };
    </script>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCmZRLFPWnJFMYvcYXhwQ-CyNU5rz3z9V0&callback=initMap" async defer></script>
</body>
</html>

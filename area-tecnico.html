<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo - Panel Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen">

    <header class="p-6 flex justify-between items-center border-b border-slate-800">
        <h1 class="text-2xl font-black text-indigo-400">FixGo Pro</h1>
        <button id="logoutBtn" class="text-slate-400 hover:text-white transition-colors">
            <i class="fas fa-power-off text-xl"></i>
        </button>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        <div class="bg-slate-800 rounded-3xl p-6 mb-8 border border-slate-700 shadow-2xl">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-16 h-16 bg-indigo-500 rounded-2xl flex items-center justify-center text-3xl">
                    <i class="fas fa-user-tie"></i>
                </div>
                <div>
                    <h2 id="nombreTecnico" class="text-xl font-bold">Cargando perfil...</h2>
                    <p id="infoVehiculo" class="text-slate-400 text-sm italic">Verificando unidad...</p>
                </div>
            </div>

            <button id="btnGps" class="w-full py-4 rounded-2xl font-black transition-all flex items-center justify-center gap-3 bg-slate-700 text-slate-300">
                <i class="fas fa-location-arrow"></i>
                <span>ACTIVAR RASTREO GPS</span>
            </button>
            <p id="gpsStatus" class="text-center text-[10px] mt-2 text-slate-500">El rastreo está desactivado</p>
        </div>

        <section>
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i class="fas fa-briefcase text-indigo-400"></i> Servicios Asignados
            </h3>
            <div id="listaServicios" class="space-y-4">
                <p class="text-slate-500 italic text-center py-10">Buscando servicios en tu zona...</p>
            </div>
        </section>
    </main>

    <script type="module" src="app-tecnico.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixGo - Área Técnico</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
    body { background-color: #050505; }
    .uber-card { background-color: #121212; border: 1px solid rgba(255,255,255,0.1); }
</style>
</head>
<body class="text-white min-h-screen">

<header class="max-w-4xl mx-auto flex justify-between items-center p-6">
    <h1 class="text-3xl font-black tracking-tighter italic text-white">FIXGO - Técnico</h1>
    <button id="logoutBtn" class="bg-red-600/10 text-red-500 border border-red-500/30 hover:bg-red-600 hover:text-white font-bold py-2 px-6 rounded-2xl transition-all text-sm">Salir</button>
</header>

<main class="max-w-4xl mx-auto px-4 py-12 space-y-6">
    <div class="uber-card p-6 rounded-2xl shadow-2xl flex justify-between items-center">
        <h2 class="text-xl font-black">Estado de Servicio</h2>
        <label class="inline-flex items-center cursor-pointer">
            <input type="checkbox" id="toggleONOFF" class="hidden">
            <span class="w-14 h-8 bg-gray-600 rounded-full relative transition-all after:content-[''] after:absolute after:w-6 after:h-6 after:bg-white after:rounded-full after:top-1 after:left-1 after:transition-all"></span>
        </label>
    </div>

    <div id="serviciosPendientes" class="space-y-4">
        <h3 class="font-black text-lg">Servicios Asignados</h3>
        <div id="listaServicios"></div>
    </div>
</main>

<script type="module" src="./app-tecnico.js"></script>
</body>
</html>

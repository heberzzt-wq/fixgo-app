<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo - Operador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
        }

        .uber-card {
            background-color: #121212;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .animate-fade {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="text-white min-h-screen flex flex-col items-center p-4 gap-6">

    <div id="panelTecnico" class="max-w-md w-full uber-card p-8 rounded-[3rem] shadow-2xl text-center animate-fade">
        <div class="mb-6">
            <div id="statusIndicator" class="w-20 h-20 bg-slate-800 rounded-full mx-auto flex items-center justify-center text-3xl transition-all duration-500 shadow-lg">
                <i class="fas fa-truck-loading"></i>
            </div>
            <h1 id="nombreTecnico" class="text-2xl font-black mt-4 italic uppercase">Cargando...</h1>
            <p id="unidadTecnico" class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.3em]">Sincronizando Unidad</p>
        </div>

        <div class="grid gap-4">
            <button id="btnDisponible" class="group bg-emerald-500/10 border border-emerald-500/20 p-6 rounded-3xl hover:bg-emerald-500 transition-all duration-300">
                <i class="fas fa-check-circle text-emerald-500 group-hover:text-white text-2xl mb-2"></i>
                <span class="block font-black text-xs group-hover:text-white uppercase tracking-widest">Disponible</span>
            </button>

            <button id="btnServicio" class="group bg-orange-500/10 border border-orange-500/20 p-6 rounded-3xl hover:bg-orange-500 transition-all duration-300">
                <i class="fas fa-tools text-orange-500 group-hover:text-white text-2xl mb-2"></i>
                <span class="block font-black text-xs group-hover:text-white uppercase tracking-widest">En Servicio</span>
            </button>
        </div>

        <button id="logoutBtn" class="mt-8 text-slate-600 hover:text-red-400 text-[10px] font-bold uppercase tracking-widest transition-colors">
            Cerrar Sesión
        </button>
    </div>

    <div id="solicitudesContainer" class="max-w-md w-full uber-card p-6 rounded-[2rem] shadow-2xl">
        <h2 class="text-sm font-black mb-6 text-center uppercase tracking-[0.2em] text-indigo-400">Solicitudes Entrantes</h2>
        <div id="solicitudesList" class="flex flex-col gap-4">
            <div id="placeholder">
    <p class="text-slate-600 text-center text-xs italic animate-pulse">
        Buscando servicios cerca...
    </p>
</div>

    </div>

    <footer class="mt-4">
        <p class="text-[9px] text-slate-700 font-bold uppercase tracking-[0.5em]">FixGo Live Status v2.0</p>
    </footer>

    <script type="module" src="app-tecnico.js"></script>
</body>
</html>

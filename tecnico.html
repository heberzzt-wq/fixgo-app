<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FixGo | Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>body { background-color: #000; color: white; }</style>
</head>
<body class="pb-32">
    <nav class="p-5 flex justify-between items-center bg-zinc-900 border-b border-zinc-800">
        <div><h1 class="font-black italic text-xl">FIXGO <span class="text-emerald-500">PRO</span></h1><p id="userName" class="text-xs text-gray-400">...</p></div>
        <button id="btnLogout" class="text-red-500 text-xs font-bold">SALIR</button>
    </nav>
    <main class="p-5 max-w-md mx-auto space-y-6">
        <div class="bg-zinc-900 p-6 rounded-2xl flex justify-between items-center border border-zinc-800">
            <div><h2 class="font-bold text-lg">Estado</h2><p id="lblEstado" class="text-xs text-gray-500">Desconectado</p></div>
            <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="toggleDisponible" class="sr-only peer"><div class="w-14 h-7 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-emerald-500 after:content-[''] after:absolute after:top-0.5 after:left-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all"></div></label>
        </div>
        <div id="areaEspera" class="text-center py-10 opacity-50"><i class="fas fa-radar fa-spin text-4xl text-gray-600 mb-4"></i><p>Esperando solicitudes...</p></div>
    </main>

    <div id="modalSolicitud" class="fixed inset-0 bg-red-600/90 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-black rounded-2xl max-w-md w-full p-6 border-2 border-white shadow-2xl">
            <h2 class="font-black text-3xl mb-2 text-center uppercase italic">¡Nueva Solicitud!</h2>
            <div class="bg-zinc-900 p-4 rounded-xl mb-4 text-center"><h3 id="solicitudTitulo" class="text-2xl font-bold text-yellow-400">--</h3><p id="solicitudDireccion" class="text-white mt-2">--</p></div>
            <div class="flex gap-3"><button id="btnRechazar" class="flex-1 bg-zinc-800 py-4 rounded-xl font-bold">IGNORAR</button><button id="btnAceptar" class="flex-1 bg-emerald-500 py-4 rounded-xl font-black text-black">ACEPTAR</button></div>
        </div>
    </div>

    <script type="module">
        // ✅ IMPORTACIÓN CORREGIDA
        import { auth, db, observarAuth, signOut, doc, updateDoc, onSnapshot, collection, query, where } from './firebase.js';

        let uid;
        let solicitudActualId = null;

        observarAuth((user) => {
            if (!user) window.location.href = 'login.html';
            uid = user.uid;
            document.getElementById('userName').innerText = user.nombre || "Técnico";
            
            // Listener Toggle
            const toggle = document.getElementById('toggleDisponible');
            toggle.addEventListener('change', async () => {
                document.getElementById('lblEstado').innerText = toggle.checked ? "Conectado" : "Desconectado";
                await updateDoc(doc(db, "tecnicos", uid), { disponible: toggle.checked });
                if(toggle.checked) escucharSolicitudes();
            });
        });

        function escucharSolicitudes() {
            const q = query(collection(db, "solicitudes"), where("estado", "==", "pendiente"));
            onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        solicitudActualId = change.doc.id;
                        document.getElementById('solicitudTitulo').innerText = data.servicio;
                        document.getElementById('solicitudDireccion').innerText = data.direccion;
                        document.getElementById('modalSolicitud').classList.remove('hidden');
                    }
                });
            });
        }

        document.getElementById('btnAceptar').onclick = async () => {
            if(!solicitudActualId) return;
            await updateDoc(doc(db, "solicitudes", solicitudActualId), { estado: "asignado", tecnicoId: uid });
            document.getElementById('modalSolicitud').classList.add('hidden');
            alert("¡Servicio Aceptado! Ve al cliente.");
        };

        document.getElementById('btnRechazar').onclick = () => document.getElementById('modalSolicitud').classList.add('hidden');
        document.getElementById('btnLogout').onclick = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestia B2B | Puerto Cancún Control Center</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111111">

<!-- Iconos -->
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icono-192.png">
<link rel="apple-touch-icon" href="/assets/icono-192.png">

<!-- Framework UI -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Iconos FontAwesome -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css"/>

<!-- Tipografía -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body{
    background: radial-gradient(circle at top right,#0a0a0a,#000);
    color:#fff;
    font-family:'Plus Jakarta Sans',sans-serif;
    min-height:100vh;
}

.glass-card{
    background:rgba(255,255,255,0.02);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.05);
}

.input-premium{
    background:rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.1);
    transition:all .3s ease;
}

.input-premium:focus{
    border-color:#10b981;
    box-shadow:0 0 15px rgba(16,185,129,0.2);
}
</style>
</head>
<body class="p-4 md:p-8">

    <div id="panelAdminB2B" class="max-w-7xl mx-auto hidden space-y-6">
        
        <header class="flex justify-between items-center border-b border-white/5 pb-6">
            <div>
                <p class="text-[9px] font-black text-emerald-500 uppercase tracking-[0.4em] mb-1">Puerto Cancún Infrastructure Monitoring</p>
                <h1 id="lblNombreResidencial" class="text-3xl md:text-4xl font-black italic tracking-tighter uppercase text-white">PUERTO CANCÚN CENTRAL</h1>
            </div>
            <div class="text-right">
                <p id="clock" class="text-xs font-mono text-zinc-400 italic">--:--:--</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-8 space-y-6">
                <div class="glass-card rounded-3xl p-8 border-t-2 border-emerald-500/50 shadow-2xl">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-sm font-black uppercase tracking-widest text-emerald-400 italic"><i class="fas fa-bolt mr-2"></i> Ejecutar Orden de Trabajo (OT)</h3>
                        <span class="text-[9px] bg-emerald-500/10 text-emerald-500 px-3 py-1 rounded-full font-black uppercase">Despacho Logístico</span>
                    </div>

                    <form id="formTicketB2B" class="grid grid-cols-1 md:grid-cols-12 gap-5">
                        <div class="md:col-span-6">
                            <label class="text-[9px] font-black text-zinc-500 uppercase mb-2 block tracking-widest">Sector Operativo</label>
                            <select id="tickZona" class="w-full input-premium rounded-xl p-4 text-sm text-white outline-none" required>
                                <option value="">SELECCIONAR SECTOR</option>
                                <option value="puerto_escondido">PUERTO ESCONDIDO (Canales)</option>
                                <option value="el_tope_25">EL TOPE 25 (Infraestructura)</option>
                                <option value="la_marina">LA MARINA / MUELLES (175 Amarres)</option>
                                <option value="los_canales">LOS CANALES (Residencial Lujo)</option>
                                <option value="la_laguna">LA LAGUNA (I & II)</option>
                                <option value="campo_golf">CAMPO DE GOLF (18 Hoyos)</option>
                                <option value="torres_sls_harbour">TORRES SLS / HARBOUR / MARINA</option>
                                <option value="novocancun">NOVO CANCÚN / OCEAN BEACH</option>
                                <option value="beach_clubs">CLUBES DE PLAYA (Norte/Sur)</option>
                                <option value="commercial_town">MARINA TOWN CENTER / MALL</option>
                            </select>
                        </div>

                        <div class="md:col-span-6">
                            <label class="text-[9px] font-black text-zinc-500 uppercase mb-2 block tracking-widest">Punto de Incidencia / Lote / Depto</label>
                            <input type="text" id="tickPunto" placeholder="Ej. Lote 14 / Torre A-402 / Muelle 4" class="w-full input-premium rounded-xl p-4 text-sm text-white outline-none" required>
                        </div>

                        <div class="md:col-span-4">
                            <label class="text-[9px] font-black text-zinc-500 uppercase mb-2 block tracking-widest">Nivel de Prioridad</label>
                            <select id="tickPrioridad" class="w-full input-premium rounded-xl p-4 text-sm text-white outline-none" required>
                                <option value="normal">NORMAL (Mantenimiento)</option>
                                <option value="urgente">⚠️ URGENTE (Fuga/Falla)</option>
                                <option value="critico">🚨 CRÍTICO (Paro de Operación)</option>
                            </select>
                        </div>

                        <div class="md:col-span-8">
                            <label class="text-[9px] font-black text-zinc-500 uppercase mb-2 block tracking-widest">Especialista Asignado</label>
                            <select id="tickAsignado" class="w-full input-premium rounded-xl p-4 text-sm text-emerald-400 font-bold outline-none" required>
                                <option value="">CARGANDO PLANTILLA...</option>
                            </select>
                        </div>

                        <div class="md:col-span-12">
                            <label class="text-[9px] font-black text-zinc-500 uppercase mb-2 block tracking-widest">Instrucciones Técnicas</label>
                            <input type="text" id="tickDesc" placeholder="Detalle la tarea a realizar en campo..." class="w-full input-premium rounded-xl p-4 text-sm text-white outline-none" required>
                        </div>

                        <div class="md:col-span-12 pt-2">
                            <button type="submit" id="btnCrearTicket" class="w-full bg-emerald-600 hover:bg-emerald-400 text-white font-black py-5 rounded-2xl transition-all shadow-[0_15px_30px_rgba(16,185,129,0.2)] active:scale-95 text-xs uppercase tracking-[0.2em]">
                                Enviar Orden de Trabajo a Campo
                            </button>
                        </div>
                    </form>
                </div>

                <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
                    <div class="p-6 border-b border-white/5 flex justify-between items-center bg-white/[0.01]">
                        <h3 class="text-xs font-black uppercase tracking-widest text-zinc-400 italic">Estatus de Activos en Red</h3>
                    </div>
                    <table class="w-full text-left">
                        <thead class="bg-black/50 text-[9px] text-zinc-500 font-black uppercase tracking-widest">
                            <tr>
                                <th class="p-6">Especialista</th>
                                <th class="p-6">Especialidad / Rol</th>
                                <th class="p-6 text-center">Estatus</th>
                                <th class="p-6 text-right">Comandos</th>
                            </tr>
                        </thead>
                        <tbody id="tablaEmpleadosB2B" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>

            <div class="lg:col-span-4 space-y-6">
                <div class="glass-card rounded-3xl p-8 space-y-6">
                    <h3 class="text-sm font-black uppercase tracking-widest italic text-white border-b border-white/5 pb-4">
                        <i class="fas fa-id-badge mr-2 text-emerald-500"></i> Gestión de Talento
                    </h3>
                    <form id="formAltaPersonal" class="space-y-4">
                        <input type="text" id="regNombre" placeholder="NOMBRE COMPLETO" class="w-full input-premium rounded-xl p-4 text-xs text-white outline-none" required>
                        <input type="tel" id="regTelefono" placeholder="MÓVIL DIRECTO" class="w-full input-premium rounded-xl p-4 text-xs text-white outline-none" required>
                        <select id="regRol" class="w-full input-premium rounded-xl p-4 text-xs text-white outline-none">
                            <option value="tecnico">ING. TÉCNICO DE CAMPO</option>
                            <option value="seguridad">OFICIAL DE SEGURIDAD ELITE</option>
                            <option value="supervisor">SUPERVISOR DE SECTOR</option>
                            <option value="mantenimiento">MAESTRO DE MANTENIMIENTO</option>
                        </select>
                        <input type="text" id="regEspecialidad" placeholder="ESPECIALIDAD (EJ. NAUTICA / AC / CFE)" class="w-full input-premium rounded-xl p-4 text-xs text-white outline-none" required>
                        <input type="email" id="regCorreo" placeholder="CORREO INSTITUCIONAL" class="w-full input-premium rounded-xl p-4 text-xs text-white outline-none" required>
                        <button type="submit" id="btnGuardarPersonal" class="w-full bg-white text-black font-black py-4 rounded-xl hover:bg-emerald-500 hover:text-white transition-all active:scale-95 text-[10px] uppercase tracking-widest shadow-xl">
                            Dar de Alta en Red B2B
                        </button>
                    </form>
                </div>

                <div class="glass-card rounded-3xl p-8 border-l-4 border-emerald-500 bg-gradient-to-br from-emerald-900/10 to-transparent">
                    <p class="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-1">Mantenimientos en Curso</p>
                    <h2 id="countTickets" class="text-4xl font-black italic">0</h2>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./panel-b2b-admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestia B2B - Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(63, 63, 70, 0.5); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="panelAdminB2B" class="max-w-6xl mx-auto hidden">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-black tracking-tighter uppercase text-white">Panel Residencial</h1>
                <p id="lblNombreResidencial" class="text-emerald-500 font-bold text-sm uppercase tracking-widest">Cargando complejo...</p>
            </div>
            <div class="bg-zinc-900 px-4 py-2 rounded-lg border border-zinc-800">
                <span class="text-[10px] text-zinc-500 block font-black uppercase">Estado del Sistema</span>
                <span class="text-xs text-emerald-400 font-bold"><i class="fas fa-shield-alt mr-1"></i> GESTIAPREMIUM V5.18</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="glass rounded-2xl p-6">
                    <h3 class="text-white font-black text-sm mb-6 uppercase tracking-widest border-b border-zinc-800 pb-4">
                        <i class="fas fa-user-plus mr-2 text-emerald-500"></i> Registro de Personal
                    </h3>
                    
                    <form id="formAltaPersonal" class="space-y-4">
                        <div>
                            <label class="block text-[10px] text-zinc-500 font-bold mb-1 uppercase">Nombre Completo</label>
                            <input type="text" id="regNombre" placeholder="Ej. Juan Pérez" class="w-full bg-black border border-zinc-800 rounded-lg p-3 text-white text-sm focus:border-emerald-500 outline-none transition-all" required>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] text-zinc-500 font-bold mb-1 uppercase">Teléfono</label>
                                <input type="tel" id="regTelefono" placeholder="998..." class="w-full bg-black border border-zinc-800 rounded-lg p-3 text-white text-sm focus:border-emerald-500 outline-none" required>
                            </div>
                            <div>
                                <label class="block text-[10px] text-zinc-500 font-bold mb-1 uppercase">Rol</label>
                                <select id="regRol" class="w-full bg-black border border-zinc-800 rounded-lg p-3 text-white text-sm focus:border-emerald-500 outline-none">
                                    <option value="tecnico">Técnico</option>
                                    <option value="limpieza">Limpieza</option>
                                    <option value="seguridad">Seguridad</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] text-zinc-500 font-bold mb-1 uppercase">Correo Electrónico</label>
                            <input type="email" id="regCorreo" placeholder="empleado@gmail.com" class="w-full bg-black border border-zinc-800 rounded-lg p-3 text-white text-sm focus:border-emerald-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-[10px] text-zinc-500 font-bold mb-1 uppercase">Especialidad</label>
                            <input type="text" id="regEspecialidad" placeholder="Ej. Plomería / Electricidad" class="w-full bg-black border border-zinc-800 rounded-lg p-3 text-white text-sm focus:border-emerald-500 outline-none" required>
                        </div>
                        <button type="submit" id="btnGuardarPersonal" class="w-full bg-white text-black font-black py-4 rounded-xl hover:bg-emerald-500 hover:text-white transition-all active:scale-95 text-xs uppercase tracking-widest mt-4">
                            Registrar Empleado
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                
                <div class="glass rounded-2xl p-6 border-l-4 border-l-emerald-500">
                    <h3 class="text-white font-black text-sm mb-6 uppercase tracking-widest flex justify-between items-center">
                        <span><i class="fas fa-ticket-alt mr-2 text-emerald-500"></i> Generar Orden de Trabajo</span>
                        <span class="text-[9px] bg-emerald-500/10 text-emerald-500 px-2 py-1 rounded">MÓDULO B2B</span>
                    </h3>
                    <form id="formTicketB2B" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="md:col-span-1">
                            <label class="block text-[10px] text-zinc-500 font-bold mb-1 uppercase">Ubicación / Depto</label>
                            <input type="text" id="tickArea" placeholder="Ej. Depto 204" class="w-full bg-black border border-zinc-800 rounded-lg p-3 text-white text-sm focus:border-emerald-500 outline-none" required>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-[10px] text-zinc-500 font-bold mb-1 uppercase">Descripción del Problema</label>
                            <input type="text" id="tickDesc" placeholder="Ej. Fuga en baño principal" class="w-full bg-black border border-zinc-800 rounded-lg p-3 text-white text-sm focus:border-emerald-500 outline-none" required>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-[10px] text-zinc-500 font-bold mb-1 uppercase">Asignar Personal</label>
                            <select id="tickAsignado" class="w-full bg-black border border-zinc-800 rounded-lg p-3 text-white text-sm focus:border-emerald-500 outline-none" required>
                                <option value="">Cargando técnicos disponibles...</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button type="submit" id="btnCrearTicket" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-lg transition-all active:scale-95 text-[10px] uppercase">
                                Enviar Orden
                            </button>
                        </div>
                    </form>
                </div>

                <div class="glass rounded-2xl overflow-hidden">
                    <div class="p-6 border-b border-zinc-800 flex justify-between items-center">
                        <h3 class="text-white font-black text-sm uppercase tracking-widest">Plantilla Activa</h3>
                        <span class="text-[10px] text-zinc-500 font-mono" id="countPersonal">0 Empleados</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-zinc-900/50 text-[10px] uppercase text-zinc-500 font-black">
                                    <th class="p-4">Empleado</th>
                                    <th class="p-4">Puesto</th>
                                    <th class="p-4">Especialidad</th>
                                    <th class="p-4 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaEmpleadosB2B">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./panel-b2b-admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigue tu Servicio - FixGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> 
        /* RESET RADICAL */
        html, body { height: 100%; margin: 0; padding: 0; background-color: #020617; overflow: hidden; }
        
        /* Forzamos al mapa a ocupar todo el fondo con prioridad máxima */
        #map { 
            position: fixed !important; 
            top: 0; 
            left: 0; 
            width: 100vw !important; 
            height: 100vh !important; 
            z-index: 1 !important;
        } 

        .glass-panel { 
            position: fixed !important;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100 !important; /* Siempre encima del mapa */
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(16px); 
        }
    </style>
</head>
<body>
    
    <div id="map"></div>

    <div class="w-[92%] max-w-md glass-panel border border-white/10 p-6 rounded-[2.5rem] shadow-2xl">
        <div class="flex items-center gap-4">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-2xl shadow-lg border border-white/10">
                <i class="fas fa-truck-fast text-white"></i>
            </div>
            <div class="flex-1">
                <h2 id="nombreTecnico" class="text-xl font-black italic text-white uppercase">Sincronizando...</h2>
                <p id="vehiculoTecnico" class="text-blue-400 text-sm font-bold tracking-tight">Cargando GPS</p>
            </div>
        </div>
        
        <div class="mt-4 pt-4 border-t border-white/5 flex justify-between items-center">
            <div>
                <span class="text-[10px] text-slate-500 uppercase font-black tracking-widest">Estado de Unidad</span>
                <p id="estadoTecnico" class="text-emerald-400 font-bold text-sm italic uppercase">CARGANDO...</p>
            </div>
            <a id="btnLlamar" href="#" class="bg-white/10 w-12 h-12 flex items-center justify-center rounded-full hover:bg-emerald-500 transition-all border border-white/10">
                <i class="fas fa-phone-alt text-white"></i>
            </a>
        </div>
    </div>

    <script type="module" src="app-cliente.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBlE0bkNxYC3w7KG7t9D2NU-Q3jh3B5H7k"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento FixGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; background: #020617; overflow: hidden; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .info-card { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 420px; z-index: 10;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
            border-radius: 28px; border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="info-card p-6 text-white shadow-2xl">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg border border-white/10">
                <i class="fas fa-truck-fast text-2xl"></i>
            </div>
            <div class="flex-1">
                <h2 id="nombreTecnico" class="font-black italic text-lg leading-tight uppercase">Cargando...</h2>
                <p id="vehiculoTecnico" class="text-blue-400 text-xs font-bold tracking-tight">SINCRONIZANDO GPS</p>
            </div>
        </div>
        <div class="mt-5 pt-4 border-t border-white/5 flex justify-between items-center">
            <div>
                <p class="text-[10px] text-slate-500 font-black uppercase tracking-widest">Estado Actual</p>
                <p id="estadoTecnico" class="text-emerald-400 font-bold text-sm italic uppercase tracking-tighter">Conectando...</p>
            </div>
            <a href="tel:9981234567" class="w-12 h-12 bg-white/5 hover:bg-emerald-500 text-white rounded-full flex items-center justify-center transition-all border border-white/10">
                <i class="fas fa-phone-alt"></i>
            </a>
        </div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBlE0bkNxYC3w7KG7t9D2NU-Q3jh3B5H7k"></script>
    <script type="module" src="app-cliente.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento FixGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #020617;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Estética Uber-Dark para el mapa */
        .info-card {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 450px;
            z-index: 10;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .pulse-emerald {
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

<div id="map"></div>

<a href="index.html" class="fixed top-6 left-6 z-20 w-12 h-12 bg-black/50 backdrop-blur-md text-white rounded-2xl flex items-center justify-center border border-white/10 hover:bg-white hover:text-black transition-all">
    <i class="fas fa-arrow-left"></i>
</a>

<div id="panelInfo" class="info-card p-6 text-white animate-fade">
    <div class="flex items-center gap-4">
        <div id="iconContainer" class="w-16 h-16 bg-indigo-600 rounded-3xl flex items-center justify-center shadow-lg border border-white/10 transition-colors">
            <i class="fas fa-truck-fast text-2xl"></i>
        </div>
        <div class="flex-1">
            <div class="flex items-center gap-2">
                <h2 id="nombreTecnico" class="font-black italic text-xl leading-tight uppercase tracking-tighter text-white">Buscando...</h2>
                <span id="badgeCategoria" class="bg-white/10 text-[8px] px-2 py-0.5 rounded-full font-black text-indigo-400">...</span>
            </div>
            <p id="vehiculoTecnico" class="text-slate-400 text-[10px] font-bold tracking-widest uppercase mt-1">Sincronizando GPS</p>
        </div>
    </div>

    <div class="mt-6 pt-5 border-t border-white/5 flex justify-between items-end">
        <div>
            <p class="text-[9px] text-slate-500 font-black uppercase tracking-[0.2em] mb-1">Estado del Servicio</p>
            <div class="flex items-center gap-2">
                <div id="statusDot" class="w-2 h-2 rounded-full bg-slate-600"></div>
                <p id="estadoTecnico" class="text-white font-black text-base italic uppercase tracking-tighter">Conectando...</p>
            </div>
        </div>
        <div class="flex gap-2">
            <a id="btnLlamar" href="#" class="w-12 h-12 bg-white/5 hover:bg-emerald-500 text-white rounded-2xl flex items-center justify-center transition-all border border-white/10">
                <i class="fas fa-phone-alt"></i>
            </a>
        </div>
    </div>
</div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBlE0bkNxYC3w7KG7t9D2NU-Q3jh3B5H7k"></script>
<script type="module" src="app-cliente.js"></script>

</body>
</html>

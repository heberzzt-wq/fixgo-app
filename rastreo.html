<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo - Rastreo Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #050505; }
        /* El mapa tendrá altura fija y bordes redondeados */
        #map { width: 100%; height: 60vh; border-radius: 2rem; border: 1px solid #333; }
        .uber-card { background-color: #121212; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="text-white min-h-screen">

    <header class="max-w-4xl mx-auto flex justify-between items-center p-6">
        <h1 class="text-3xl font-black tracking-tighter italic text-white">FIXGO</h1>
        <a href="index.html" class="text-indigo-500 font-bold">Inicio</a>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <h2 class="text-2xl font-black mb-4">Rastreo en tiempo real</h2>
        
        <div id="map"></div>

        <div class="mt-6 uber-card p-6 rounded-2xl shadow-2xl">
            <h3 class="font-black text-lg mb-4 text-emerald-500 flex items-center gap-2">
                <i class="fas fa-satellite-dish animate-pulse"></i> Estado del Servicio
            </h3>
            
            <div class="space-y-3">
                <div class="flex justify-between border-b border-gray-800 pb-2">
                    <span class="text-gray-400">Técnico:</span>
                    <span id="nombreTecnico" class="font-bold">Buscando...</span>
                </div>
                <div class="flex justify-between border-b border-gray-800 pb-2">
                    <span class="text-gray-400">Estado:</span>
                    <span id="estadoTecnico" class="font-bold text-yellow-500">--</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">Ubicación:</span>
                    <span id="ubicacionTecnico" class="font-mono text-sm text-indigo-400">--</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Definimos la función globalmente antes de que Google Maps la busque
        window.initMap = function() {
            console.log("⏳ Google Maps cargado. Esperando lógica de FixGo...");
        };
    </script>

    <script type="module">
        import { db, onSnapshot, doc, auth, observarAuth } from './firebase.js';
        
        // Importamos la función visual del motor GPS
        // Asegúrate de que gps-motor.js tenga 'export function actualizarMapaGPS'
        import { actualizarMapaGPS } from './gps-motor.js';

        let map;
        let marcadorTecnico;

        // Sobrescribimos la función initMap con la lógica real
        window.initMap = function() {
            console.log("🗺️ Inicializando Mapa FixGo (Modo Oscuro)...");
            
            const estiloOscuro = [
                { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
                { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
                {
                    featureType: "administrative.locality",
                    elementType: "labels.text.fill",
                    stylers: [{ color: "#d59563" }],
                },
                {
                    featureType: "road",
                    elementType: "geometry",
                    stylers: [{ color: "#38414e" }],
                },
                {
                    featureType: "road",
                    elementType: "geometry.stroke",
                    stylers: [{ color: "#212a37" }],
                },
                {
                    featureType: "road",
                    elementType: "labels.text.fill",
                    stylers: [{ color: "#9ca5b3" }],
                },
                {
                    featureType: "water",
                    elementType: "geometry",
                    stylers: [{ color: "#17263c" }],
                }
            ];

            const mapElement = document.getElementById("map");
            
            if (mapElement) {
                map = new google.maps.Map(mapElement, {
                    center: { lat: 21.1619, lng: -86.8515 }, // Cancún Centro
                    zoom: 13,
                    styles: estiloOscuro,
                    disableDefaultUI: false, // Muestra controles de zoom
                    streetViewControl: false,
                    mapTypeControl: false
                });
            }
        };

        // Si la API de Google cargó muy rápido y ya ejecutó la versión vacía,
        // ejecutamos la real manualmente ahora.
        if (window.google && window.google.maps) {
            window.initMap();
        }

        // Conexión con Firebase para mover el carrito
        observarAuth((user) => {
            // No bloqueamos si no hay usuario, para que al menos se vea el mapa
            if (!user) {
                console.log("Modo invitado: Viendo mapa sin sesión de usuario.");
            } else {
                console.log("Sesión activa:", user.email);
            }

            // Escuchamos el documento donde el técnico escribe su posición
            // Colección: 'rastreo', Documento: 'tecnicoActivo'
            const trackingDoc = doc(db, "rastreo", "tecnicoActivo");
            
            onSnapshot(trackingDoc, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    console.log("📍 Movimiento detectado:", data);

                    // 1. Actualizar Textos
                    const txtNombre = document.getElementById("nombreTecnico");
                    const txtEstado = document.getElementById("estadoTecnico");
                    const txtUbi = document.getElementById("ubicacionTecnico");

                    if(txtNombre) txtNombre.innerText = data.nombre || "Técnico FixGo";
                    if(txtEstado) txtEstado.innerText = data.estado || "En Ruta";
                    if(txtUbi) txtUbi.innerText = `${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}`;

                    // 2. Mover el marcador en el mapa
                    // Usamos la función importada de gps-motor.js
                    if (map && typeof actualizarMapaGPS === 'function') {
                        actualizarMapaGPS(map, data.lat, data.lng);
                    }
                } else {
                    console.log("Esperando que el técnico inicie ruta...");
                    document.getElementById("estadoTecnico").innerText = "Esperando señal...";
                }
            }, (error) => {
                console.error("Error leyendo rastreo:", error);
            });
        });
    </script>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCmZRLFPWnJFMYvcYXhwQ-CyNU5rz3z9V0&callback=initMap" async defer></script>

</body>
</html>

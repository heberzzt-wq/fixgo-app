<!DOCTYPE html>
<html lang="es" style="height: 100%; margin: 0;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigue tu Servicio - FixGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body style="height: 100%; margin: 0; background-color: #020617; overflow: hidden; position: relative;">
    
    <div id="map" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: red !important;"></div>

    <div class="glass-panel" style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 99; width: 92%; max-width: 450px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); padding: 24px; border-radius: 40px; color: white; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">
        <div class="flex items-center gap-4">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-2xl shadow-lg">
                <i class="fas fa-truck-fast"></i>
            </div>
            <div class="flex-1">
                <h2 id="nombreTecnico" class="text-xl font-black italic uppercase">Cargando...</h2>
                <p id="vehiculoTecnico" class="text-blue-400 text-sm font-bold">Sincronizando GPS</p>
            </div>
        </div>
        
        <div class="mt-4 pt-4 border-t border-white/10 flex justify-between items-center">
            <div>
                <span class="text-[10px] text-slate-500 uppercase font-black tracking-widest">Estado</span>
                <p id="estadoTecnico" class="text-emerald-400 font-bold text-sm italic uppercase">---</p>
            </div>
            <a id="btnLlamar" href="#" class="bg-white/10 w-12 h-12 flex items-center justify-center rounded-full border border-white/10">
                <i class="fas fa-phone-alt text-white"></i>
            </a>
        </div>
    </div>

    <script type="module" src="app-cliente.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBlE0bkNxYC3w7KG7t9D2NU-Q3jh3B5H7k"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento en Vivo - FixGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #020617; overflow: hidden; }
        #map { 
            position: absolute !important; top: 0; bottom: 0; left: 0; right: 0; 
            width: 100% !important; height: 100% !important; z-index: 1; 
        }
        .glass-panel { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            width: 92%; max-width: 450px; z-index: 10;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 2rem;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="glass-panel p-6 shadow-2xl text-white">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-blue-600 rounded-xl flex items-center justify-center text-xl shadow-lg border border-white/10">
                <i class="fas fa-truck-fast"></i>
            </div>
            <div class="flex-1">
                <h2 id="nombreTecnico" class="text-lg font-bold uppercase tracking-tight">Cargando...</h2>
                <p id="vehiculoTecnico" class="text-blue-400 text-xs font-semibold uppercase">Sincronizando GPS</p>
            </div>
        </div>
        
        <div class="mt-4 pt-4 border-t border-white/5 flex justify-between items-center">
            <div>
                <span class="text-[10px] text-slate-500 uppercase font-black tracking-widest">Estado</span>
                <p id="estadoTecnico" class="text-emerald-400 font-bold text-sm uppercase italic">---</p>
            </div>
            <a id="btnLlamar" href="tel:9981234567" class="bg-white/10 w-11 h-11 flex items-center justify-center rounded-full border border-white/10 hover:bg-emerald-500 transition-all">
                <i class="fas fa-phone-alt"></i>
            </a>
        </div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB1E0bkNxYC3w7KG7t9D2NU-Q3jh3B5H7k"></script>
    <script type="module" src="app-cliente.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestiaPremium - Rastreo Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #050505; }
        /* El mapa tendrá altura fija y bordes redondeados */
        #map { width: 100%; height: 60vh; border-radius: 2rem; border: 1px solid #333; }
        .uber-card { background-color: #121212; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="text-white min-h-screen">

    <header class="max-w-4xl mx-auto flex justify-between items-center p-6">
        <div class="flex items-center gap-2">
            <img src="assets/gestiapremium-icon.svg" class="w-8 h-8 drop-shadow-[0_0_12px_rgba(59,130,246,0.6)]" alt="GestiaPremium">
            <h1 class="text-3xl font-black tracking-tighter text-white">GESTIA<span class="text-blue-500">PREMIUM</span></h1>
        </div>
        <a href="index.html" class="text-indigo-500 font-bold">Inicio</a>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <h2 class="text-2xl font-black mb-4">Rastreo en tiempo real</h2>
        
        <div id="map"></div>

        <div class="mt-6 uber-card p-6 rounded-2xl shadow-2xl">
            <h3 class="font-black text-lg mb-4 text-blue-500 flex items-center gap-2">
                <i class="fas fa-satellite-dish animate-pulse"></i> Estado del Servicio
            </h3>
            
            <div class="space-y-3">
                <div class="flex justify-between border-b border-gray-800 pb-2">
                    <span class="text-gray-400">Técnico:</span>
                    <span id="nombreTecnico" class="font-bold">Buscando...</span>
                </div>
                <div class="flex justify-between border-b border-gray-800 pb-2">
                    <span class="text-gray-400">Estado:</span>
                    <span id="estadoTecnico" class="font-bold text-yellow-500">--</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">Ubicación:</span>
                    <span id="ubicacionTecnico" class="font-mono text-sm text-indigo-400">--</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        let globalMap = null;
        let isMapReady = false;

        window.initMap = function() {
            console.log("🗺️ Inicializando Mapa GestiaPremium (Modo Oscuro)...");
            
            const estiloOscuro = [
                { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
                { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
                { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
                { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
                { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#212a37" }] },
                { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#9ca5b3" }] },
                { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
            ];

            const mapElement = document.getElementById("map");
            
            if (mapElement) {
                globalMap = new google.maps.Map(mapElement, {
                    center: { lat: 21.1619, lng: -86.8515 }, // Cancún Centro
                    zoom: 13,
                    styles: estiloOscuro,
                    disableDefaultUI: false, // Muestra controles de zoom
                    streetViewControl: false,
                    mapTypeControl: false
                });
                isMapReady = true;
                window.dispatchEvent(new Event('fixgoMapReady'));
            }
        };
    </script>

    <script type="module">
        import { db, onSnapshot, doc, getDoc, auth, observarAuth } from './firebase.js';
        import { actualizarMapaGPS } from './gps-motor.js';

        async function arrancarRastreo() {
            // 🔥 CORRECCIÓN: Ruteo dinámico leyendo el parámetro URL
            const urlParams = new URLSearchParams(window.location.search);
            const servicioId = urlParams.get('id');

            if (!servicioId) {
                document.getElementById("nombreTecnico").innerText = "ID Invalido";
                document.getElementById("estadoTecnico").innerText = "Error de enlace";
                return;
            }

            try {
                // Obtenemos el ticket para saber quién es el técnico asignado
                const docServicio = await getDoc(doc(db, "services", servicioId));
                if (!docServicio.exists() || !docServicio.data().tecnico_id) {
                    document.getElementById("nombreTecnico").innerText = "Sin Asignar";
                    document.getElementById("estadoTecnico").innerText = "Buscando técnico cercano...";
                    return;
                }

                const uidTecnico = docServicio.data().tecnico_id;
                
                // Ahora escuchamos EXCLUSIVAMENTE el documento de ese técnico
                const trackingDoc = doc(db, "rastreo", uidTecnico);
                
                onSnapshot(trackingDoc, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        
                        const txtNombre = document.getElementById("nombreTecnico");
                        const txtEstado = document.getElementById("estadoTecnico");
                        const txtUbi = document.getElementById("ubicacionTecnico");

                        if(txtNombre) txtNombre.innerText = data.nombre || "Socio GestiaPremium";
                        if(txtEstado) txtEstado.innerText = data.estado || "En Ruta";
                        if(txtUbi && data.lat && data.lng) txtUbi.innerText = `${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}`;

                        // Mover el marcador en el mapa usando globalMap
                        if (globalMap && typeof actualizarMapaGPS === 'function' && data.lat && data.lng) {
                            actualizarMapaGPS(globalMap, data.lat, data.lng);
                        }
                    } else {
                        document.getElementById("estadoTecnico").innerText = "Esperando señal del técnico...";
                    }
                }, (error) => {
                    console.error("Error leyendo rastreo:", error);
                });

            } catch (err) {
                console.error("Error buscando servicio:", err);
            }
        }

        // Si el mapa ya cargó, arranca. Si no, espera el evento.
        if (isMapReady) {
            arrancarRastreo();
        } else {
            window.addEventListener('fixgoMapReady', arrancarRastreo);
        }
    </script>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCmZRLFPWnJFMYvcYXhwQ-CyNU5rz3z9V0&callback=initMap" async defer></script>

</body>
</html>

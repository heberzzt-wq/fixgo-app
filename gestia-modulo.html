<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo | GestiaPremium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gestia: {
                            dark: '#0f172a',
                            primary: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Ajustes para el escáner para que se vea premium */
        #reader { border: none !important; border-radius: 1rem; overflow: hidden; }
        #reader__dashboard_section_csr span { color: white !important; font-weight: bold; }
        #reader__dashboard_section_swaplink { color: #3b82f6 !important; text-decoration: none; }
        #reader button { 
            background-color: #3b82f6; color: white; border: none; padding: 8px 16px; 
            border-radius: 0.5rem; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body class="bg-gestia-dark h-screen w-screen p-2 md:p-4 flex flex-col font-sans overflow-hidden">

    <!-- ===================================================== -->
<!-- GESTIA SURFACE TEMP SHELL -->
<!-- ===================================================== -->

<div
    style="
        position:fixed;
        bottom:20px;
        left:20px;
        z-index:999999;
        display:flex;
        flex-direction:column;
        gap:12px;
    ">

    <button
        onclick="history.back()"
        style="
            width:60px;
            height:60px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:999px;
            cursor:pointer;
            font-weight:bold;
            box-shadow:0 10px 30px rgba(0,0,0,.35);
        ">
        ←
    </button>

    <button
        onclick="window.cerrarSesionGlobal()"
        style="
            width:60px;
            height:60px;
            background:#991b1b;
            color:white;
            border:none;
            border-radius:999px;
            cursor:pointer;
            font-weight:bold;
            box-shadow:0 10px 30px rgba(0,0,0,.35);
        ">
        ⏻
    </button>

    </div>
    
    <div id="contenedor-magico" class="w-full h-full"></div>

    <button id="btnAbrirScanner" class="fixed bottom-28 right-6 w-16 h-16 bg-gestia-primary rounded-full shadow-[0_0_20px_rgba(59,130,246,0.5)] flex items-center justify-center text-white text-2xl hover:scale-110 transition-transform z-[70] border-2 border-white/10">
        <i class="fas fa-qrcode"></i>
    </button>

    <div id="modalScanner" class="hidden fixed inset-0 bg-black/95 z-[200] flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-zinc-900 border border-blue-500/30 w-full max-w-md rounded-3xl shadow-2xl overflow-hidden flex flex-col">
            <div class="p-6 border-b border-white/5 flex justify-between items-center bg-black/50">
                <div>
                    <h3 class="text-xl font-black text-white italic uppercase tracking-tighter">Control de Acceso</h3>
                    <p class="text-[9px] font-black text-blue-500 uppercase tracking-[0.3em] mt-1">Escáner Óptico Activo</p>
                </div>
                <button id="btnCerrarScanner" class="text-zinc-500 hover:text-white transition-transform hover:scale-110">
                    <i class="fas fa-times-circle text-2xl"></i>
                </button>
            </div>
            
            <div class="p-4 bg-black">
                <div id="reader" class="w-full"></div>
            </div>

            <div class="p-6 bg-zinc-900 flex flex-col items-center justify-center text-center">
                <p id="resultadoScanner" class="text-xs font-bold text-zinc-400 uppercase tracking-widest">Apunte la cámara al código QR del activo o visitante...</p>
            </div>
        </div>
    </div>

    <script type="module">
        // Importamos tu motor de renderizado original
        import { initGestiaRender } from './gestia-render.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            // Renderizamos la app
            initGestiaRender('seguridad_accesos_b2b', 'contenedor-magico');
        });

        // =====================================================
        // LÓGICA DEL MOTOR DE ESCANEO QR (TURBO ACTIVADO)
        // =====================================================
        let html5QrcodeScanner = null;
        const modalScanner = document.getElementById('modalScanner');
        const resultadoDOM = document.getElementById('resultadoScanner');

        // Función que se ejecuta cuando la cámara lee un QR exitosamente
        function onScanSuccess(decodedText, decodedResult) {
            // Detenemos el escáner al leer
            html5QrcodeScanner.clear().then(() => {
                modalScanner.classList.add('hidden');
                
                try {
                    // 1. Decodificar Payload
                    const datosQR = JSON.parse(decodedText);
                    console.log("📡 QR Detectado y Decodificado:", datosQR);
                    
                    // 2. Enviar datos al Motor Fast-Pass (Módulo 8 en gestia-render.js)
                    if (window.procesarAccesoQR) {
                        window.procesarAccesoQR(datosQR);
                    } else {
                        console.error("⚠️ El Motor Fast-Pass no está conectado en window.");
                        alert("El motor de base de datos no está listo para recibir la lectura.");
                    }
                    
                } catch (e) {
                    console.error("❌ Formato QR No Reconocido:", decodedText);
                    alert(`⚠️ QR INVÁLIDO O NO RECONOCIDO\n\nAsegúrese de usar un código emitido por GestiaPremium.`);
                }
            });
        }

        function onScanFailure(error) {
            // Se ejecuta constantemente mientras busca, no hacemos nada para no saturar la consola
        }

        // Abrir Modal y encender cámara
        document.getElementById('btnAbrirScanner').addEventListener('click', () => {
            resultadoDOM.innerText = "Apunte la cámara al código QR...";
            resultadoDOM.className = "text-xs font-bold text-zinc-400 uppercase tracking-widest";
            modalScanner.classList.remove('hidden');
            
            // OPTIMIZACIÓN: Solo leer QR y subir FPS
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { 
                    fps: 24, // Más lecturas por segundo
                    qrbox: {width: 250, height: 250},
                    formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ], // IGNORA CÓDIGOS DE BARRAS, SOLO QR
                    rememberLastUsedCamera: true
                },
                /* verbose= */ false
            );
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        });

        // Cerrar Modal y apagar cámara
        document.getElementById('btnCerrarScanner').addEventListener('click', () => {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().then(() => {
                    modalScanner.classList.add('hidden');
                }).catch(err => console.error("Error al apagar cámara", err));
            } else {
                modalScanner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ADJUNTO · Laboratorio móvil</title>
<style>
:root{color-scheme:dark;--cyan:#00d8ff;--blue:#087cff;--ice:#f4ffff;--panel:rgba(2,10,24,.92)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#f4ffff;font-family:Inter,Segoe UI,Arial,sans-serif}
body{overflow:hidden}
button,input{font:inherit}
.lab{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 330px;background:radial-gradient(circle at 42% 36%,#061735 0,#000 46%,#000 100%)}
.preview{position:relative;min-width:0;display:grid;place-items:center;overflow:hidden}
.phone{position:relative;height:min(100dvh,980px);width:min(100%,calc(100dvh * .5628));aspect-ratio:941/1672;background:#000;overflow:hidden;box-shadow:0 0 70px rgba(0,92,255,.18)}
iframe{display:block;width:100%;height:100%;border:0;background:#000}
.badge{position:absolute;z-index:5;top:max(10px,env(safe-area-inset-top));left:10px;padding:7px 10px;border:1px solid rgba(0,216,255,.25);border-radius:999px;background:rgba(0,0,0,.68);backdrop-filter:blur(10px);font-size:10px;font-weight:900;letter-spacing:.1em;color:#a9efff}
.panel{position:relative;z-index:10;padding:18px 16px calc(18px + env(safe-area-inset-bottom));overflow:auto;border-left:1px solid rgba(0,216,255,.16);background:linear-gradient(180deg,rgba(2,12,29,.96),rgba(0,0,0,.98));box-shadow:-20px 0 45px rgba(0,0,0,.45)}
.panel h1{font-size:21px;margin:0 0 4px;letter-spacing:.06em}.panel .intro{margin:0 0 16px;color:#8eb5c7;font-size:12px;line-height:1.45}.official{padding:9px 10px;margin-bottom:15px;border:1px solid rgba(73,229,255,.14);border-radius:12px;background:rgba(0,216,255,.055);color:#aeefff;font-size:11px;line-height:1.4}
.group{padding:12px 0;border-top:1px solid rgba(255,255,255,.08)}
label{display:block;margin-bottom:6px;color:#ccecf7;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
input[type=text]{width:100%;border:1px solid rgba(0,216,255,.22);border-radius:11px;padding:10px 11px;background:#020914;color:#fff;outline:none}input[type=text]:focus{border-color:#00d8ff;box-shadow:0 0 0 3px rgba(0,216,255,.09)}
.range-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.range-head output{color:#64eaff;font-size:11px;font-weight:900}
input[type=range]{width:100%;accent-color:#00bfff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:14px}
button{min-height:42px;border:1px solid rgba(0,216,255,.24);border-radius:12px;padding:9px 10px;background:#04111f;color:#eaffff;font-weight:850;cursor:pointer}button.primary{background:linear-gradient(135deg,#087cff,#00aada);border-color:transparent;box-shadow:0 0 24px rgba(0,116,255,.24)}button:active{transform:scale(.98)}button.active{border-color:#8fffff;box-shadow:0 0 0 2px rgba(0,216,255,.12)}
.source{margin-top:12px;color:#718fa0;font-size:10px;overflow-wrap:anywhere}.mobile-toggle{display:none}
@media(max-width:820px){body{overflow:hidden}.lab{display:block}.preview{height:100dvh}.phone{height:100dvh;width:min(100vw,calc(100dvh * .5628))}.panel{position:fixed;left:8px;right:8px;bottom:8px;max-height:min(54dvh,520px);border:1px solid rgba(0,216,255,.2);border-radius:20px;padding:16px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(calc(100% + 18px));transition:transform .28s ease;box-shadow:0 -18px 50px rgba(0,0,0,.74)}.panel.open{transform:translateY(0)}.panel h1{font-size:18px}.mobile-toggle{display:block;position:fixed;z-index:20;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));border-radius:999px;padding:11px 15px;background:rgba(3,16,31,.9);backdrop-filter:blur(12px);box-shadow:0 0 30px rgba(0,92,255,.3)}.panel.open~.mobile-toggle{bottom:calc(min(54dvh,520px) + 18px)}.badge{font-size:9px}.row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="lab">
  <section class="preview" aria-label="Vista previa móvil de ADJUNTO">
    <div class="phone"><iframe id="logoFrame" title="Animación de ADJUNTO"></iframe></div>
    <div class="badge" id="statusBadge">CARGANDO FUENTE…</div>
  </section>

  <aside class="panel" id="panel">
    <h1>ADJUNTO LAB</h1>
    <p class="intro">Afina el nombre sobre la animación final sin alterar el logo oficial SIA7.</p>
    <div class="official">SIA7 / GestiaPremium permanece intacto. Este laboratorio sólo vive dentro de <b>prototypes</b>.</div>

    <div class="group">
      <label for="brandText">Nombre</label>
      <input id="brandText" type="text" value="ADJUNTO" maxlength="18" autocomplete="off">
    </div>
    <div class="group">
      <label for="taglineText">Descriptor</label>
      <input id="taglineText" type="text" value="TECNOLOGÍA · CONEXIÓN · SOLUCIONES" maxlength="64" autocomplete="off">
    </div>
    <div class="group">
      <div class="range-head"><label for="brandSize">Tamaño</label><output id="brandSizeOut">9.8</output></div>
      <input id="brandSize" type="range" min="6.5" max="13.5" step="0.1" value="9.8">
    </div>
    <div class="group">
      <div class="range-head"><label for="brandY">Altura</label><output id="brandYOut">69.0%</output></div>
      <input id="brandY" type="range" min="61" max="77" step="0.2" value="69">
    </div>
    <div class="group">
      <div class="range-head"><label for="tracking">Espaciado</label><output id="trackingOut">0.10em</output></div>
      <input id="tracking" type="range" min="0" max="0.28" step="0.01" value="0.10">
    </div>
    <div class="group">
      <div class="range-head"><label for="glow">Brillo</label><output id="glowOut">1.00×</output></div>
      <input id="glow" type="range" min="0.25" max="2.2" step="0.05" value="1">
    </div>
    <div class="group">
      <div class="range-head"><label for="speed">Velocidad</label><output id="speedOut">1.00×</output></div>
      <input id="speed" type="range" min="0.55" max="1.6" step="0.05" value="1">
    </div>
    <div class="group">
      <label>Acabado</label>
      <div class="row">
        <button class="finish active" data-finish="steel">Acero</button>
        <button class="finish" data-finish="ice">Hielo</button>
      </div>
    </div>
    <div class="actions">
      <button id="replay" class="primary">Repetir</button>
      <button id="fullscreen">Pantalla completa</button>
      <button id="copySettings">Copiar ajustes</button>
      <button id="reset">Restablecer</button>
    </div>
    <div class="source" id="sourceText"></div>
  </aside>
  <button class="mobile-toggle" id="mobileToggle">Ajustes</button>
</main>
<script src="adjunto-logo-brand.js"></script>
</body>
</html>

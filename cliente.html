<style>
    :root { --fixgo-yellow: #ffce00; --bg-black: #000; --card-gray: #1a1a1a; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-black); color: white; margin: 0; }

    /* TARJETAS CON MÁS CUERPO */
    .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 10px; }
    .service-card {
        background: linear-gradient(145deg, #222, #111);
        border: 2px solid #333;
        border-radius: 28px;
        padding: 40px 20px; /* Más espacio interno */
        text-align: center;
        transition: all 0.3s ease;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .service-card:active { transform: scale(0.95); border-color: var(--fixgo-yellow); }
    
    /* ICONOS CON IMPACTO */
    .service-card i { 
        font-size: 50px; /* Más grandes */
        color: var(--fixgo-yellow); 
        margin-bottom: 20px;
        filter: drop-shadow(0 0 10px rgba(255, 206, 0, 0.3));
    }
    .service-card span { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.5px; }

    /* BOTÓN CONFIRMAR */
    .confirm-btn {
        background: var(--fixgo-yellow);
        color: black;
        border: none;
        width: 100%;
        padding: 22px;
        font-size: 1.3rem;
        font-weight: 900;
        border-radius: 18px;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(255, 206, 0, 0.2);
    }
</style>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBlE0bkNxYC3w7KG7t9D2NU-Q3jh3B5H7k", //
        authDomain: "fixgo-app-sf2l.firebaseapp.com",
        projectId: "fixgo-app-sf2l",
        storageBucket: "fixgo-app-sf2l.appspot.com",
        messagingSenderId: "367232231649",
        appId: "1:367232231649:web:99737190e29b4661002305"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // CORRECCIÓN DEL BOTÓN
    document.getElementById('btn-confirmar-accion').onclick = function() {
        const problema = document.getElementById('input-problema').value;
        if(!problema) return alert("Describe el problema");

        this.innerText = "PROCESANDO...";
        this.disabled = true;

        db.collection("services").add({
            servicio: servicioActual,
            descripcion: problema,
            estatus: "pendiente",
            fecha: new Date(),
            ubicacion: marker.getLatLng()
        })
        .then(() => {
            // FORZAMOS EL CAMBIO DE VISTA
            document.getElementById('view-request').classList.remove('active');
            document.getElementById('view-searching').classList.add('active');
        })
        .catch(err => {
            alert("Error: " + err.message);
            this.innerText = "CONFIRMAR SERVICIO";
            this.disabled = false;
        });
    };
</script>

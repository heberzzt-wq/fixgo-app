<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo | Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #050505; color: white; }
        .service-btn { transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .service-btn:hover:not(:disabled) { border-color: #10b981; background: rgba(16, 185, 129, 0.1); transform: translateY(-2px); }
        .service-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(100%); }
    </style>
</head>
<body class="pb-20">

    <nav class="p-5 flex justify-between items-center border-b border-white/10 sticky top-0 bg-black/95 z-40">
        <h1 class="font-black text-2xl italic">FIX<span class="text-emerald-500">GO</span></h1>
        <button id="btnLogout" class="text-xs font-bold text-red-500 border border-red-500/30 px-3 py-1 rounded-lg">SALIR</button>
    </nav>

    <main class="max-w-xl mx-auto p-5">
        <div class="mb-8">
            <h2 class="text-2xl font-bold">Hola, <span id="userName" class="text-emerald-400">Cliente</span></h2>
            <p class="text-gray-400 text-sm">Selecciona un servicio para comenzar.</p>
        </div>

        <div class="mb-6">
            <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-3">FIXGO ROAD (EMERGENCIA)</h3>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="window.seleccionarServicio('Llantera Móvil', 'road')" class="service-btn bg-zinc-900 p-4 rounded-xl flex flex-col items-center">
                    <i class="fas fa-car-burst text-2xl text-orange-500 mb-2"></i>
                    <span class="font-bold text-sm">Llantera</span>
                </button>
                <button onclick="window.seleccionarServicio('Cerrajería Auto', 'road')" class="service-btn bg-zinc-900 p-4 rounded-xl flex flex-col items-center">
                    <i class="fas fa-key text-2xl text-yellow-500 mb-2"></i>
                    <span class="font-bold text-sm">Cerrajería</span>
                </button>
            </div>
        </div>

        <div class="mb-6">
            <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-3">FIXGO HOME (HOGAR)</h3>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="window.seleccionarServicio('Electricidad', 'home')" class="service-btn bg-zinc-900 p-4 rounded-xl flex flex-col items-center">
                    <i class="fas fa-bolt text-2xl text-yellow-400 mb-2"></i>
                    <span class="font-bold text-sm">Electricidad</span>
                </button>
                <button onclick="window.seleccionarServicio('Plomería', 'home')" class="service-btn bg-zinc-900 p-4 rounded-xl flex flex-col items-center">
                    <i class="fas fa-faucet text-2xl text-blue-400 mb-2"></i>
                    <span class="font-bold text-sm">Plomería</span>
                </button>
            </div>
        </div>

        <div id="formSolicitud" class="fixed bottom-0 left-0 w-full bg-zinc-900 rounded-t-3xl p-6 transform translate-y-full transition-transform duration-300 z-50 border-t border-emerald-500/30 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-black text-lg text-emerald-400" id="lblServicioSeleccionado">--</h3>
                <button onclick="window.cerrarForm()" class="text-gray-400"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="space-y-4">
                <input type="text" id="inputDireccion" class="w-full bg-black border border-gray-700 rounded-xl p-3 mt-1 text-white" placeholder="Dirección exacta...">
                <textarea id="inputDetalles" class="w-full bg-black border border-gray-700 rounded-xl p-3 mt-1 text-white" rows="2" placeholder="Detalles..."></textarea>
                <button id="btnPedir" class="w-full bg-emerald-500 text-black font-black py-4 rounded-xl hover:bg-emerald-400 transition">SOLICITAR SERVICIO</button>
            </div>
        </div>

    </main>

    <script type="module">
        // ✅ IMPORTACIÓN CORREGIDA
        import { auth, db, observarAuth, signOut, addDoc, collection, serverTimestamp } from './firebase.js';

        let usuarioActual = null;

        observarAuth((user) => {
            if (!user) window.location.href = 'login.html';
            usuarioActual = user;
            document.getElementById('userName').innerText = user.nombre || "Cliente";
        });

        // FUNCIONES GLOBALES (Window) para que el HTML las vea
        window.seleccionarServicio = (nombre, tipo) => {
            document.getElementById('lblServicioSeleccionado').innerText = nombre;
            document.getElementById('formSolicitud').classList.remove('translate-y-full');
            
            document.getElementById('btnPedir').onclick = async () => {
                const direccion = document.getElementById('inputDireccion').value;
                const detalles = document.getElementById('inputDetalles').value;

                if(!direccion) return alert("Ingresa tu dirección");

                const btn = document.getElementById('btnPedir');
                btn.innerHTML = "BUSCANDO TÉCNICO...";
                btn.disabled = true;

                try {
                    await addDoc(collection(db, "solicitudes"), {
                        clienteId: usuarioActual.uid,
                        clienteNombre: usuarioActual.nombre || "Cliente",
                        servicio: nombre,
                        tipo: tipo,
                        direccion: direccion,
                        detalles: detalles,
                        estado: "pendiente",
                        fecha: serverTimestamp(),
                        costoBase: 250
                    });
                    alert("¡Solicitud enviada! Esperando técnico...");
                    window.cerrarForm();
                } catch (e) {
                    console.error(e);
                    alert("Error al solicitar.");
                } finally {
                    btn.innerHTML = "SOLICITAR SERVICIO";
                    btn.disabled = false;
                }
            };
        };

        window.cerrarForm = () => {
            document.getElementById('formSolicitud').classList.add('translate-y-full');
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth).then(() => window.location.href = 'index.html');
    </script>
</body>
</html>

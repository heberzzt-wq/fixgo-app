<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo - Servicios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --yellow: #ffce00; --bg: #000; --card: #141414; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; }
        .header { padding: 40px; text-align: center; border-bottom: 5px solid var(--yellow); }
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .section-title { color: var(--yellow); margin: 40px 0 20px; font-weight: 900; letter-spacing: 3px; border-left: 5px solid var(--yellow); padding-left: 15px; text-transform: uppercase; }
        
        /* TARJETAS CON CUERPO */
        .services-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
        .service-card { 
            background: linear-gradient(145deg, #222, #050505); border: 2px solid #333; 
            padding: 50px 20px; border-radius: 35px; text-align: center; cursor: pointer; position: relative;
        }
        .service-card i { font-size: 70px; color: var(--yellow); margin-bottom: 25px; display: block; filter: drop-shadow(0 0 10px rgba(255,206,0,0.4)); }
        .service-card span { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; }
        .service-card.inactive { opacity: 0.3; filter: grayscale(1); pointer-events: none; }
        .badge-soon { position: absolute; top: 15px; right: 15px; font-size: 0.6rem; background: #333; padding: 5px 10px; border-radius: 8px; color: #888; }
        
        /* PANEL DE SOLICITUD */
        .view { display: none; min-height: 100vh; flex-direction: column; }
        .view.active { display: flex; }
        #map { width: 100%; height: 350px; border-bottom: 3px solid var(--yellow); }
        textarea { width: 100%; background: #111; border: 2px solid #444; color: white; padding: 25px; border-radius: 20px; font-size: 1.1rem; box-sizing: border-box; }
        .confirm-btn { background: var(--yellow); color: black; border: none; width: 100%; padding: 25px; font-size: 1.4rem; font-weight: 900; border-radius: 20px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div id="view-menu" class="view active">
    <div class="header"><h1>FIXGO & FINISH</h1></div>
    <div class="container">
        <div class="section-title">FixGo Road 🚨</div>
        <div class="services-grid">
            <div class="service-card" onclick="abrirSolicitud('Llantera')"><i class="fa-solid fa-compact-disc"></i><span>Llantera</span></div>
            <div class="service-card" onclick="abrirSolicitud('Cerrajería')"><i class="fa-solid fa-key"></i><span>Cerrajería</span></div>
            <div class="service-card inactive"><span class="badge-soon">PRÓX</span><i class="fa-solid fa-truck-pickup"></i><span>Grúa</span></div>
            <div class="service-card inactive"><span class="badge-soon">PRÓX</span><i class="fa-solid fa-screwdriver-wrench"></i><span>Mecánico</span></div>
        </div>
        <div class="section-title">FixGo Fix 🏠</div>
        <div class="services-grid">
            <div class="service-card" onclick="abrirSolicitud('Electricidad')"><i class="fa-solid fa-bolt-lightning"></i><span>Electricidad</span></div>
            <div class="service-card" onclick="abrirSolicitud('Plomería')"><i class="fa-solid fa-faucet-drip"></i><span>Plomería</span></div>
            <div class="service-card" onclick="abrirSolicitud('Aire Acondicionado')"><i class="fa-solid fa-snowflake"></i><span>A/C</span></div>
            <div class="service-card inactive"><span class="badge-soon">PRÓX</span><i class="fa-solid fa-paint-roller"></i><span>Pintura</span></div>
        </div>
        <div class="section-title">FixGo Tech 🛠️</div>
        <div class="services-grid">
            <div class="service-card" onclick="abrirSolicitud('CCTV')"><i class="fa-solid fa-video"></i><span>CCTV</span></div>
            <div class="service-card" onclick="abrirSolicitud('Alarmas')"><i class="fa-solid fa-shield-halved"></i><span>Alarmas</span></div>
            <div class="service-card inactive"><span class="badge-soon">PRÓX</span><i class="fa-solid fa-solar-panel"></i><span>Paneles</span></div>
        </div>
    </div>
</div>

<div id="view-request" class="view">
    <div class="header" style="display:flex; align-items:center; padding:20px;">
        <i class="fa-solid fa-chevron-left" onclick="cambiarVista('view-menu')" style="color:var(--yellow); font-size:2rem; cursor:pointer;"></i>
        <h2 id="txt-titulo" style="margin:auto;">DETALLES</h2>
    </div>
    <div id="map"></div>
    <div style="padding:30px;">
        <textarea id="input-problema" rows="4" placeholder="Describe el problema..."></textarea>
        <button class="confirm-btn" id="btn-final">SOLICITAR AHORA</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBlE0bkNxYC3w7KG7t9D2NU-Q3jh3B5H7k",
        authDomain: "fixgo-44e4d.firebaseapp.com",
        projectId: "fixgo-44e4d",
        storageBucket: "fixgo-44e4d.appspot.com",
        messagingSenderId: "367232231649",
        appId: "1:367232231649:web:99737190e29b4661002305"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let map, marker, servicioActual = "";

    function cambiarVista(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'view-request') setTimeout(() => {
            if(!map){
                map = L.map('map').setView([21.1619, -86.8515], 14);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
                marker = L.marker([21.1619, -86.8515]).addTo(map);
                map.on('move', () => marker.setLatLng(map.getCenter()));
            } else { map.invalidateSize(); }
        }, 400);
    }

    function abrirSolicitud(n) { servicioActual = n; document.getElementById('txt-titulo').innerText = n.toUpperCase(); cambiarVista('view-request'); }

    document.getElementById('btn-final').onclick = function() {
        const prob = document.getElementById('input-problema').value;
        if(!prob) return alert("Escribe el problema");
        this.disabled = true; this.innerText = "CONECTANDO...";
        db.collection("services").add({
            servicio: servicioActual,
            descripcion: prob,
            ubicacion: marker.getLatLng(),
            estatus: "pendiente",
            fecha: new Date(),
            cliente: "Heber"
        }).then(() => alert("Solicitud enviada con éxito")).catch(e => { alert(e.message); this.disabled = false; });
    };
</script>
</body>
</html>

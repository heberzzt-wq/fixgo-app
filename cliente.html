<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo | Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #050505; }
        .uber-card { background-color: #121212; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="text-white min-h-screen">

    <header class="max-w-4xl mx-auto flex justify-between items-center p-6 border-b border-white/10">
        <h1 class="text-2xl font-black italic">FIXGO <span class="text-indigo-500">CLIENTE</span></h1>
        <button id="logoutBtn" class="text-red-500 text-sm font-bold">SALIR</button>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">
        <div class="uber-card p-6 rounded-2xl">
            <h2 class="text-xl font-bold">Hola, <span id="nombreCliente" class="text-indigo-400">Usuario</span></h2>
            <p class="text-gray-400 text-sm">¿Qué necesitas arreglar hoy?</p>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button class="uber-card p-6 rounded-2xl flex flex-col items-center hover:bg-white/5 transition">
                <i class="fas fa-bolt text-3xl text-yellow-400 mb-3"></i>
                <span class="font-bold">Electricidad</span>
            </button>
            <button class="uber-card p-6 rounded-2xl flex flex-col items-center hover:bg-white/5 transition">
                <i class="fas fa-wrench text-3xl text-blue-400 mb-3"></i>
                <span class="font-bold">Plomería</span>
            </button>
             <button class="uber-card p-6 rounded-2xl flex flex-col items-center hover:bg-white/5 transition">
                <i class="fas fa-snowflake text-3xl text-cyan-400 mb-3"></i>
                <span class="font-bold">A/C</span>
            </button>
             <button class="uber-card p-6 rounded-2xl flex flex-col items-center hover:bg-white/5 transition">
                <i class="fas fa-key text-3xl text-orange-400 mb-3"></i>
                <span class="font-bold">Cerrajería</span>
            </button>
        </div>
    </main>

    <script type="module">
        import { auth, observarAuth, signOut } from './firebase.js';

        observarAuth((user) => {
            if (!user) window.location.href = 'login.html';
            document.getElementById('nombreCliente').innerText = user.nombre || "Cliente";
        });

        document.getElementById('logoutBtn').onclick = () => {
            signOut(auth).then(() => window.location.href = 'login.html');
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo - Solicitar Servicio</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #ffce00; --dark: #1a1a1a; --gray: #f4f4f4; --text-gray: #666;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--gray); }
        .header { background: var(--dark); color: white; padding: 20px; text-align: center; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        
        /* Secciones de Verticales */
        .vertical-section { margin-bottom: 25px; }
        .vertical-title { 
            font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .vertical-title span { font-size: 0.8rem; color: var(--text-gray); }

        /* Grid de Botones */
        .services-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; 
        }
        .btn-service {
            background: white; border: 2px solid #ddd; padding: 15px; border-radius: 12px;
            text-align: center; cursor: pointer; transition: 0.3s; position: relative;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .btn-service:active { transform: scale(0.95); }
        .btn-service.active { border-color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-service.inactive { opacity: 0.6; filter: grayscale(1); cursor: not-allowed; }
        .btn-service .badge {
            position: absolute; top: 5px; right: 5px; background: #eee;
            font-size: 0.6rem; padding: 2px 6px; border-radius: 4px;
        }
        .icon { font-size: 24px; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0;">FIXGO & FINISH</h2>
    <small>Cancún, Q. Roo</small>
</div>

<div class="container" id="app">
    <div class="vertical-section">
        <div class="vertical-title">FixGo Road 🚨 <span>Prioridad Máxima</span></div>
        <div class="services-grid">
            <div class="btn-service active" onclick="solicitar('llantera')">
                <span class="icon">🛞</span> Llantera Móvil
            </div>
            <div class="btn-service active" onclick="solicitar('cerrajeria')">
                <span class="icon">🔑</span> Cerrajería 24/7
            </div>
            <div class="btn-service inactive">
                <span class="badge">Próximamente</span>
                <span class="icon">🏗️</span> Grúa
            </div>
        </div>
    </div>

    <div class="vertical-section">
        <div class="vertical-title">FixGo Fix 🏠 <span>On-Demand</span></div>
        <div class="services-grid">
            <div class="btn-service active" onclick="solicitar('electricidad')">
                <span class="icon">⚡</span> Electricidad
            </div>
            <div class="btn-service active" onclick="solicitar('plomeria')">
                <span class="icon">🚰</span> Plomería
            </div>
            <div class="btn-service active" onclick="solicitar('ac')">
                <span class="icon">❄️</span> Aire Acondicionado
            </div>
            <div class="btn-service inactive">
                <span class="badge">Próximamente</span>
                <span class="icon">🎨</span> Pintura/Alberca
            </div>
        </div>
    </div>

    <div class="vertical-section">
        <div class="vertical-title">FixGo Tech 🛠️ <span>Certificados</span></div>
        <div class="services-grid">
            <div class="btn-service active" onclick="solicitar('cctv')">
                <span class="icon">📹</span> CCTV
            </div>
            <div class="btn-service active" onclick="solicitar('alarmas')">
                <span class="icon">🛡️</span> Alarmas
            </div>
        </div>
    </div>
</div>

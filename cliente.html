<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FixGo | Solicitar Servicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #000000; font-family: 'Inter', sans-serif; }
        .uber-card { background-color: #121212; border: 1px solid rgba(255,255,255,0.1); }
        .service-card { transition: all 0.3s ease; cursor: pointer; }
        .service-card:hover { transform: translateY(-2px); border-color: #10b981; }
        .service-card.selected { border-color: #10b981; background-color: #1a1a1a; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        
        /* ESTILOS TABLA COTIZACIÓN (ESTILO ALAMO/EXCEL) */
        .quote-table { width: 100%; border-collapse: collapse; font-size: 10px; color: #ccc; }
        .quote-table th { background: #1f1f1f; color: #10b981; text-align: left; padding: 8px 4px; border-bottom: 1px solid #333; font-weight: 900; text-transform: uppercase; }
        .quote-table td { border-bottom: 1px solid #222; padding: 6px 4px; vertical-align: top; }
        .quote-num { font-family: 'Courier New', monospace; text-align: right; }
        .quote-total-row { background: #1a1a1a; border-top: 2px solid #333; }
        .legal-note { font-size: 8px; color: #666; font-style: italic; margin-top: 4px; line-height: 1.2; }

        /* NUEVO: ESTILOS PARA TARJETAS EXPANSIBLES (ACORDEÓN) */
        .expandable-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-in-out; }
        .expandable-content.expanded { max-height: 2000px; /* Altura máxima holgada para el despliegue */ }
        .chevron-icon { transition: transform 0.3s ease; }
        .chevron-icon.rotated { transform: rotate(180deg); }
    </style>
</head>
<body class="text-white min-h-screen pb-20">
    <header class="p-6 flex justify-between items-center sticky top-0 bg-black/95 z-20 backdrop-blur-md border-b border-white/5">
        <h1 class="font-black text-2xl italic tracking-tighter">FIX<span class="text-emerald-500">GO</span></h1>
        <div class="flex items-center gap-3">
            <span id="userName" class="text-sm font-bold hidden md:block text-gray-300">Usuario</span>
            <button id="btnLogout" class="bg-zinc-800 text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-red-900/50 transition-colors">
                <i class="fas fa-sign-out-alt text-xs"></i>
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8 space-y-8">
        
        <section>
            <h2 class="text-slate-500 text-xs font-black uppercase tracking-widest mb-4">¿Qué necesitas hoy?</h2>
            
            <div id="gridCategoriasMaestras" class="space-y-4">
                
                <div class="uber-card rounded-2xl overflow-hidden shadow-lg">
                    <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-zinc-800/50 transition-colors" onclick="toggleAccordion('sub-road', 'icon-road')">
                        <div class="flex items-center gap-4">
                            <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-emerald-500 shadow-inner">
                                <i class="fas fa-car-crash text-xl w-6 text-center"></i>
                            </div>
                            <div>
                                <h3 class="font-black text-lg tracking-tight">FixGo Road</h3>
                                <p class="text-xs text-gray-500">Asistencia vial y automotriz</p>
                            </div>
                        </div>
                        <i id="icon-road" class="fas fa-chevron-down text-gray-400 chevron-icon"></i>
                    </div>
                    <div id="sub-road" class="expandable-content bg-zinc-900/30">
                        <div id="content_road" class="p-4 border-t border-zinc-800/50 grid grid-cols-2 gap-3">
                            </div>
                    </div>
                </div>

                <div class="uber-card rounded-2xl overflow-hidden shadow-lg">
                    <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-zinc-800/50 transition-colors" onclick="toggleAccordion('sub-fix', 'icon-fix')">
                        <div class="flex items-center gap-4">
                            <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-emerald-500 shadow-inner">
                                <i class="fas fa-tools text-xl w-6 text-center"></i>
                            </div>
                            <div>
                                <h3 class="font-black text-lg tracking-tight">FixGo Fix</h3>
                                <p class="text-xs text-gray-500">Reparaciones del hogar</p>
                            </div>
                        </div>
                        <i id="icon-fix" class="fas fa-chevron-down text-gray-400 chevron-icon"></i>
                    </div>
                    <div id="sub-fix" class="expandable-content bg-zinc-900/30">
                        <div id="content_fix" class="p-4 border-t border-zinc-800/50 grid grid-cols-2 gap-3">
                            </div>
                    </div>
                </div>

                <div class="uber-card rounded-2xl overflow-hidden shadow-lg">
                    <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-zinc-800/50 transition-colors" onclick="toggleAccordion('sub-tech', 'icon-tech')">
                        <div class="flex items-center gap-4">
                            <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-emerald-500 shadow-inner">
                                <i class="fas fa-microchip text-xl w-6 text-center"></i>
                            </div>
                            <div>
                                <h3 class="font-black text-lg tracking-tight">FixGo Tech</h3>
                                <p class="text-xs text-gray-500">Tecnología y seguridad</p>
                            </div>
                        </div>
                        <i id="icon-tech" class="fas fa-chevron-down text-gray-400 chevron-icon"></i>
                    </div>
                    <div id="sub-tech" class="expandable-content bg-zinc-900/30">
                        <div id="content_tech" class="p-4 border-t border-zinc-800/50 grid grid-cols-2 gap-3">
                            </div>
                    </div>
                </div>

                <div class="uber-card rounded-2xl overflow-hidden shadow-lg">
                    <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-zinc-800/50 transition-colors" onclick="toggleAccordion('sub-maint', 'icon-maint')">
                        <div class="flex items-center gap-4">
                            <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-emerald-500 shadow-inner">
                                <i class="fas fa-building text-xl w-6 text-center"></i>
                            </div>
                            <div>
                                <h3 class="font-black text-lg tracking-tight">FixGo Maint</h3>
                                <p class="text-xs text-gray-500">Mantenimiento B2B (Empresas)</p>
                            </div>
                        </div>
                        <i id="icon-maint" class="fas fa-chevron-down text-gray-400 chevron-icon"></i>
                    </div>
                    <div id="sub-maint" class="expandable-content bg-zinc-900/30">
                        <div id="content_maint" class="p-4 border-t border-zinc-800/50 grid grid-cols-1 gap-3">
                            </div>
                    </div>
                </div>

            </div>
        </section>

        <section id="modalSolicitud" class="uber-card p-6 rounded-[2rem] shadow-2xl relative overflow-hidden hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full blur-3xl -mr-10 -mt-10"></div>
            <h2 class="text-xl font-black mb-6 flex items-center gap-2">
                <span class="bg-emerald-500 w-2 h-8 rounded-full"></span>
                Solicitar <span id="btnLabel" class="text-emerald-500">Servicio</span>
            </h2>

            <form id="nuevaSolicitudForm" class="space-y-4">
                <input type="hidden" id="categoriaSeleccionada" name="categoria">
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 ml-2">UBICACIÓN</label>
                    <div class="relative">
                        <i class="fas fa-map-marker-alt absolute left-4 top-4 text-gray-400"></i>
                        <input type="text" name="direccion" placeholder="Ej: Calle 60, Centro Cancún" required 
                            class="w-full bg-zinc-900 border border-zinc-800 text-white rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all placeholder-gray-600">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 ml-2">DETALLES DEL PROBLEMA</label>
                    <textarea name="descripcion" rows="3" placeholder="Describe brevemente qué sucede..." required 
                        class="w-full bg-zinc-900 border border-zinc-800 text-white rounded-xl py-3 px-4 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all placeholder-gray-600"></textarea>
                </div>

                <button type="submit" class="w-full bg-white text-black font-black py-4 rounded-xl text-lg hover:bg-emerald-400 transition-all shadow-lg transform active:scale-95">
                    SOLICITAR AHORA
                </button>
            </form>
        </section>

        <section>
            <h2 class="text-slate-500 text-xs font-black uppercase tracking-widest mb-4">Tu Actividad</h2>
            <div id="solicitudesCliente" class="space-y-4">
                <div class="text-center py-8">
                    <i class="fas fa-history text-gray-700 text-3xl mb-2"></i>
                    <p class="text-gray-600 text-sm">Tus servicios aparecerán aquí.</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        function toggleAccordion(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                icon.classList.remove('rotated');
            } else {
                // Opcional: Cerrar los demás antes de abrir este (comentar si quieres múltiples abiertos)
                document.querySelectorAll('.expandable-content').forEach(el => el.classList.remove('expanded'));
                document.querySelectorAll('.chevron-icon').forEach(el => el.classList.remove('rotated'));
                
                content.classList.add('expanded');
                icon.classList.add('rotated');
            }
        }
    </script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./app-main.js"></script>
</body>
</html>

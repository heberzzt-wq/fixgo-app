<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FixGo | Torre de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>body { background-color: #000; color: white; }</style>
</head>
<body class="p-6">
    <header class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-black italic">FIXGO <span class="text-red-600">ADMIN</span></h1>
        <button id="btnLogout" class="bg-red-900/50 text-red-500 px-4 py-2 rounded-lg font-bold">Salir</button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800">
            <h2 class="font-bold mb-4 text-emerald-500">SOCIOS / TÉCNICOS</h2>
            <div id="listaTecnicos" class="space-y-3 max-h-[500px] overflow-y-auto">
                <p class="text-gray-500 animate-pulse">Cargando...</p>
            </div>
        </div>

        <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 lg:col-span-2">
            <h2 class="font-bold mb-4 text-blue-500">MAPA EN VIVO</h2>
            <div id="map" class="w-full h-[400px] rounded-xl bg-zinc-800"></div>
            
            <div class="mt-4">
                <h3 class="font-bold text-sm mb-2">Solicitudes Recientes</h3>
                <div id="listaSolicitudes" class="text-xs space-y-2"></div>
            </div>
        </div>

    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBlE0bkNxYC3w7KG7t9D2NU-Q3jh3B5H7k" async defer></script>

    <script type="module">
        // ✅ IMPORTACIÓN CORREGIDA (observarAuth)
        import { auth, db, observarAuth, signOut, collection, onSnapshot, query, where, updateDoc, doc } from './firebase.js';

        let map;
        let markers = {};

        // Iniciar Mapa
        window.initMap = () => {
            try {
                map = new google.maps.Map(document.getElementById("map"), {
                    center: { lat: 21.1619, lng: -86.8515 }, // Cancún
                    zoom: 12,
                    styles: [ { elementType: "geometry", stylers: [{ color: "#242f3e" }] }, { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] }, { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] } ] // Dark Mode
                });
                escucharTecnicos();
            } catch (e) {
                console.error("Error cargando mapa:", e);
            }
        };

        // Si la API de Google ya cargó, inicia el mapa
        if(window.google && window.google.maps) window.initMap();

        observarAuth((user) => {
            if(!user) window.location.href = 'login.html';
        });

        // 1. ESCUCHAR TÉCNICOS Y MAPA
        function escucharTecnicos() {
            const q = query(collection(db, "tecnicos"));
            
            onSnapshot(q, (snapshot) => {
                const divLista = document.getElementById('listaTecnicos');
                divLista.innerHTML = "";

                snapshot.forEach(snap => {
                    const data = snap.data();
                    const id = snap.id;

                    // UI Lista
                    const item = document.createElement('div');
                    item.className = "p-3 bg-black rounded-lg border border-zinc-700 flex justify-between items-center";
                    item.innerHTML = `
                        <div>
                            <p class="font-bold text-sm">${data.nombre || data.email}</p>
                            <p class="text-[10px] ${data.disponible ? 'text-green-500' : 'text-gray-500'}">
                                ${data.disponible ? '● ONLINE' : '○ OFFLINE'} | Doc: ${data.documentosOK ? '✅' : '❌'}
                            </p>
                        </div>
                        ${!data.verificado ? 
                            `<button onclick="verificarTecnico('${id}')" class="text-[10px] bg-blue-600 px-2 py-1 rounded text-white">APROBAR</button>` 
                            : '<span class="text-xs text-emerald-500"><i class="fas fa-check-circle"></i></span>'}
                    `;
                    divLista.appendChild(item);

                    // MAPA MARKERS
                    if (data.disponible && data.lat && data.lng) {
                        const pos = { lat: data.lat, lng: data.lng };
                        if (markers[id]) {
                            markers[id].setPosition(pos);
                        } else {
                            markers[id] = new google.maps.Marker({
                                position: pos,
                                map: map,
                                title: data.nombre,
                                // Icono de cochecito (opcional)
                                icon: {
                                    path: faCarSide, 
                                    scale: 0.05,
                                    fillColor: "#10b981",
                                    fillOpacity: 1,
                                    strokeWeight: 0
                                }
                            });
                        }
                    } else {
                        if(markers[id]) {
                            markers[id].setMap(null);
                            delete markers[id];
                        }
                    }
                });
            });
        }

        // SVG Path para el icono del coche (fix rápido visual)
        const faCarSide = "M17.47,15.88L15.65,9.63A4.89,4.89,0,0,0,10.94,6H5.06A4.89,4.89,0,0,0,.35,9.63L-1.47,15.88a1.69,1.69,0,0,0,0,.47V21a1.5,1.5,0,0,0,1.5,1.5h1A1.5,1.5,0,0,0,2.5,21v-1h11v1a1.5,1.5,0,0,0,1.5,1.5h1a1.5,1.5,0,0,0,1.5-1.5V16.35A1.69,1.69,0,0,0,17.47,15.88ZM3.5,16A1.5,1.5,0,1,1,5,14.5,1.5,1.5,0,0,1,3.5,16Zm9,0A1.5,1.5,0,1,1,14,14.5,1.5,1.5,0,0,1,12.5,16Z";

        window.verificarTecnico = async (id) => {
            if(confirm("¿Aprobar documentación de este técnico?")) {
                await updateDoc(doc(db, "tecnicos", id), { verificado: true, documentosOK: true });
            }
        };

        onSnapshot(query(collection(db, "solicitudes"), where("estado", "==", "pendiente")), (snap) => {
            const div = document.getElementById('listaSolicitudes');
            div.innerHTML = "";
            snap.forEach(d => {
                const s = d.data();
                div.innerHTML += `<div class="bg-red-900/20 p-2 rounded border border-red-500/30 text-red-200">
                    Nueva solicitud: <b>${s.servicio}</b> en ${s.direccion}
                </div>`;
            });
        });

        document.getElementById('btnLogout').onclick = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | FixGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen p-4">

    <header class="flex justify-between items-center p-4 bg-blue-600 text-white rounded-2xl mb-6">
        <h1 id="adminTitle" class="text-2xl font-bold">Administrador FixGo</h1>
        <button id="btnLogout" class="bg-red-500 px-4 py-2 rounded-xl hover:bg-red-600">
            Salir
        </button>
    </header>

    <main class="grid grid-cols-3 gap-4" id="dashboard">
        <!-- Aquí el JS llenará las secciones -->
        <div id="sectionTecnicos" class="p-4 bg-white rounded-2xl shadow">Técnicos</div>
        <div id="sectionClientes" class="p-4 bg-white rounded-2xl shadow">Clientes</div>
        <div id="sectionServicios" class="p-4 bg-white rounded-2xl shadow">Servicios</div>
    </main>

    <footer class="mt-8 text-center text-slate-400 text-xs font-medium">
        © 2026 FIXGO | Seguridad e Ingeniería
    </footer>

    <script type="module" src="./app-admin.js"></script>
</body>
</html>

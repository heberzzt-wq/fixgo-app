<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixGo - Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
    body { background-color: #050505; }
    .uber-card { background-color: #121212; border: 1px solid rgba(255,255,255,0.1); }
</style>
</head>
<body class="text-white min-h-screen">

<header class="max-w-6xl mx-auto flex justify-between items-center p-6">
    <h1 class="text-3xl font-black tracking-tighter italic text-white">FIXGO - Admin</h1>
    <button id="logoutBtn" class="bg-red-600/10 text-red-500 border border-red-500/30 hover:bg-red-600 hover:text-white font-bold py-2 px-6 rounded-2xl transition-all text-sm">Salir</button>
</header>

<main class="max-w-6xl mx-auto px-4 py-12">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
        <div class="uber-card p-6 rounded-2xl shadow-2xl">
            <h2 class="font-black text-xl mb-4">Técnicos Registrados</h2>
            <div id="listaTecnicos"></div>
        </div>

        <div class="uber-card p-6 rounded-2xl shadow-2xl">
            <h2 class="font-black text-xl mb-4">Transacciones / Wallet</h2>
            <div id="listaTransacciones"></div>
        </div>
    </div>

    <div class="uber-card p-6 rounded-2xl shadow-2xl">
        <h2 class="font-black text-xl mb-4">Logs y Actividad</h2>
        <div id="logsActividad"></div>
    </div>
</main>

<script type="module" src="./app-admin.js"></script>
</body>
</html>

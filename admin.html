<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBlE0bkNxYC3w7KG7t9D2NU-Q3jh3B5H7k" async defer></script>

    <script type="module">
        // ✅ CORREGIDO: Importamos 'observarAuth' (en español)
        import { auth, db, observarAuth, signOut, collection, onSnapshot, query, where, updateDoc, doc } from './firebase.js';

        let map;
        let markers = {};

        // Iniciar Mapa
        window.initMap = () => {
            try {
                map = new google.maps.Map(document.getElementById("map"), {
                    center: { lat: 21.1619, lng: -86.8515 }, // Cancún
                    zoom: 12,
                    styles: [ { elementType: "geometry", stylers: [{ color: "#242f3e" }] }, { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] }, { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] } ]
                });
                escucharTecnicos();
            } catch (e) { console.error("Mapa error:", e); }
        };

        if(window.google && window.google.maps) window.initMap();

        // ✅ USAMOS LA FUNCIÓN CORRECTA
        observarAuth((user) => {
            // Si no hay usuario, fuera de aquí
            if(!user) window.location.href = 'login.html';
            
            // (Opcional) Si hay usuario pero no es admin, también fuera
            // if(user.rol !== 'admin') window.location.href = 'index.html';
        });

        function escucharTecnicos() {
            // ... (Mismo código de mapa de antes) ...
            const q = query(collection(db, "tecnicos"));
            onSnapshot(q, (snapshot) => {
                const divLista = document.getElementById('listaTecnicos');
                divLista.innerHTML = "";
                snapshot.forEach(snap => {
                    const data = snap.data();
                    const id = snap.id;
                    const item = document.createElement('div');
                    item.className = "p-3 bg-black rounded-lg border border-zinc-700 flex justify-between items-center";
                    item.innerHTML = `
                        <div>
                            <p class="font-bold text-sm text-white">${data.nombre || "Sin nombre"}</p>
                            <p class="text-[10px] ${data.disponible ? 'text-green-500' : 'text-gray-500'}">
                                ${data.disponible ? '● ONLINE' : '○ OFFLINE'}
                            </p>
                        </div>
                        ${!data.verificado ? 
                            `<button onclick="verificarTecnico('${id}')" class="text-[10px] bg-blue-600 px-2 py-1 rounded text-white hover:bg-blue-500">APROBAR</button>` 
                            : '<span class="text-xs text-emerald-500"><i class="fas fa-check-circle"></i></span>'}
                    `;
                    divLista.appendChild(item);
                });
            });
        }

        window.verificarTecnico = async (id) => {
            if(confirm("¿Aprobar técnico?")) {
                await updateDoc(doc(db, "tecnicos", id), { verificado: true, documentosOK: true });
            }
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>

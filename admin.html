<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | FixGo</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Estilo sutil para que las listas no se vean amontonadas */
        #sectionTecnicos, #sectionClientes, #sectionServicios {
            min-height: 200px;
            max-height: 600px;
            overflow-y: auto;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <header class="flex justify-between items-center p-6 bg-slate-900 text-white rounded-[2rem] mb-8 shadow-xl border-b-4 border-blue-600">
        <div>
            <p class="text-blue-400 text-[10px] uppercase tracking-[0.2em] font-black">Panel de Control</p>
            <h1 id="nombreAdmin" class="text-2xl font-black italic tracking-tighter">
                Cargando administrador...
            </h1>
        </div>

        <button id="btnLogout" class="bg-red-500/10 hover:bg-red-600 text-red-500 hover:text-white border border-red-500/20 px-6 py-3 rounded-2xl font-bold transition-all flex items-center gap-2">
            <i class="fas fa-power-off"></i>
            <span class="hidden md:inline">Cerrar Sesión</span>
        </button>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-3 gap-6" id="dashboard">
        
        <div class="flex flex-col gap-4">
            <div class="flex items-center gap-2 px-2">
                <i class="fas fa-truck-pickup text-blue-600"></i>
                <h2 class="font-black text-slate-700 uppercase text-xs tracking-widest">Unidades en Campo</h2>
            </div>
            <div id="sectionTecnicos" class="p-6 bg-white rounded-[2rem] shadow-sm border border-slate-200">
                <p class="text-slate-400 text-sm animate-pulse">Sincronizando técnicos...</p>
            </div>
        </div>

        <div class="flex flex-col gap-4">
            <div class="flex items-center gap-2 px-2">
                <i class="fas fa-user-tie text-blue-600"></i>
                <h2 class="font-black text-slate-700 uppercase text-xs tracking-widest">Base de Clientes</h2>
            </div>
            <div id="sectionClientes" class="p-6 bg-white rounded-[2rem] shadow-sm border border-slate-200">
                <p class="text-slate-400 text-sm animate-pulse">Consultando base de datos...</p>
            </div>
        </div>

        <div class="flex flex-col gap-4">
            <div class="flex items-center gap-2 px-2">
                <i class="fas fa-clipboard-list text-blue-600"></i>
                <h2 class="font-black text-slate-700 uppercase text-xs tracking-widest">Servicios / Órdenes</h2>
            </div>
            <div id="sectionServicios" class="p-6 bg-white rounded-[2rem] shadow-sm border border-slate-200">
                <div class="flex flex-col items-center justify-center h-full text-center py-10">
                    <i class="fas fa-tools text-slate-200 text-4xl mb-2"></i>
                    <p class="text-slate-400 text-xs">Módulo de servicios próximamente</p>
                </div>
            </div>
        </div>
        
    </main>

    <footer class="mt-12 text-center text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em]">
        © 2026 FIXGO & FINISH | Quintana Roo, México
    </footer>

    <script type="module" src="./app-admin.js"></script>
</body>
</html>

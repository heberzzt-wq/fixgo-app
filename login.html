<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo | Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <div class="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                <i class="fas fa-sign-in-alt text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-black text-slate-800">Iniciar Sesión</h1>
            <p class="text-slate-500 font-medium">Accede con tu cuenta de FixGo</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <input
                type="email"
                id="correo"
                placeholder="Correo electrónico"
                required
                class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/10 outline-none"
            >

            <input
                type="password"
                id="contrasena"
                placeholder="Contraseña"
                required
                class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/10 outline-none"
            >

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl text-xl shadow-lg shadow-blue-500/30">
                Iniciar sesión
            </button>
        </form>

        <button
            id="loginGoogle"
            class="w-full bg-red-500 hover:bg-red-600 text-white font-black py-4 rounded-2xl text-lg shadow-lg shadow-red-500/30 mt-4">
            Iniciar sesión con Google
        </button>

        <p id="msg" class="text-red-500 font-medium text-center mt-4"></p>

        <footer class="mt-8 text-center text-slate-400 text-xs font-medium">
            © 2026 FIXGO | Seguridad e Ingeniería
        </footer>
    </div>

    <!-- 🔐 LOGIN UNIVERSAL FIXGO -->
    <script type="module">
        import {
            auth,
            signInWithEmailAndPassword,
            signInWithPopup,
            googleProvider
        } from "./firebase-auth.js";

        import { db } from "./firebase-config.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const msg = document.getElementById("msg");

        async function redirectByRol(user) {
            const roles = [
                { col: "admins", url: "admin.html" },
                { col: "tecnicos", url: "tecnico.html" },
                { col: "clientes", url: "index.html" }
            ];

            for (const r of roles) {
                const ref = doc(db, r.col, user.uid);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    window.location.href = r.url;
                    return;
                }
            }

            msg.textContent = "❌ Usuario sin rol asignado";
            await auth.signOut();
        }

        // Login email
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            msg.textContent = "";

            try {
                const email = document.getElementById("correo").value.trim();
                const password = document.getElementById("contrasena").value;

                const cred = await signInWithEmailAndPassword(auth, email, password);
                await redirectByRol(cred.user);

            } catch (error) {
                msg.textContent = "❌ Correo o contraseña incorrectos";
                console.error(error);
            }
        });

        // Login Google
        document.getElementById("loginGoogle").addEventListener("click", async () => {
            msg.textContent = "";

            try {
                const cred = await signInWithPopup(auth, googleProvider);
                await redirectByRol(cred.user);

            } catch (error) {
                msg.textContent = "❌ Error al iniciar con Google";
                console.error(error);
            }
        });
    </script>

</body>
</html>

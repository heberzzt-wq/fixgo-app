<script type="module">
    // Importamos todo desde nuestro CEREBRO CENTRAL
    import { 
        auth, db, googleProvider, 
        signInWithEmailAndPassword, signInWithPopup,
        doc, getDoc 
    } from "./firebase.js";

    const msg = document.getElementById("msg");
    const loginSection = document.getElementById("loginSection");
    const roleSelection = document.getElementById("roleSelection");

    // --- 1. VERIFICADOR DE ROLES (TORRE DE CONTROL) ---
    async function verificarRol(user) {
        if (!user) return;
        msg.textContent = "VERIFICANDO CREDENCIALES...";

        // Lista de colecciones y a dónde mandamos a cada quién
        const rutas = [
            { col: "admins", url: "administrador.html" },
            { col: "tecnicos", url: "área-tecnico.html" }, 
            { col: "clientes", url: "índice.html" }
        ];

        try {
            for (const r of rutas) {
                const snap = await getDoc(doc(db, r.col, user.uid));
                if (snap.exists()) {
                    console.log(`Usuario encontrado en ${r.col}`);
                    window.location.href = r.url;
                    return;
                }
            }
            
            // Si el código llega aquí, el usuario es nuevo y no tiene rol asignado
            loginSection.classList.add("hidden");
            roleSelection.classList.remove("hidden");
            msg.textContent = "USUARIO IDENTIFICADO - ELIGE TU PERFIL";
            
        } catch (e) {
            console.error("Error al consultar rol:", e);
            msg.textContent = "ERROR DE CONEXIÓN AL SERVIDOR";
        }
    }

    // --- 2. LOGIN CON EMAIL ---
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.textContent = "ACCEDIENDO...";
        
        const email = document.getElementById("correo").value;
        const pass = document.getElementById("contrasena").value;

        try {
            const cred = await signInWithEmailAndPassword(auth, email, pass);
            await verificarRol(cred.user);
        } catch (error) {
            console.error("Error login email:", error);
            msg.textContent = "❌ CORREO O CONTRASEÑA INCORRECTOS";
        }
    });

    // --- 3. LOGIN CON GOOGLE (MODO POPUP PARA ALTA CONCURRENCIA) ---
    document.getElementById("loginGoogle").addEventListener("click", async () => {
        msg.textContent = "CONECTANDO CON GOOGLE...";
        try {
            const result = await signInWithPopup(auth, googleProvider);
            await verificarRol(result.user);
        } catch (error) {
            console.error("Error Google:", error);
            msg.textContent = "❌ ERROR DE AUTENTICACIÓN";
        }
    });
</script>

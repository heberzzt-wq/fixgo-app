<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixGo - Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="text-white bg-black min-h-screen">

<header class="max-w-4xl mx-auto flex justify-between items-center p-6">
    <h1 class="text-3xl font-black tracking-tighter italic text-white">FIXGO</h1>
    <a href="index.html" class="text-indigo-500 font-bold">Inicio</a>
</header>

<main class="max-w-4xl mx-auto px-4 py-12">
    <div class="uber-card p-8 rounded-[2.5rem] shadow-2xl">
        <h2 class="text-2xl font-black mb-6">Iniciar Sesión</h2>
        <form id="formLogin" class="space-y-4">
            <input type="email" name="email" placeholder="Correo electrónico" required class="uber-input w-full px-4 py-3 rounded-2xl">
            <input type="password" name="password" placeholder="Contraseña" required class="uber-input w-full px-4 py-3 rounded-2xl">
            <button type="submit" id="btnLogin" class="w-full bg-indigo-500 py-4 rounded-2xl font-black hover:bg-indigo-600 transition-all">Entrar</button>
        </form>
        <button id="btnLoginGoogle" class="w-full mt-4 bg-white text-black py-4 rounded-2xl font-black hover:bg-indigo-500 hover:text-white transition-all">Login con Google</button>
    </div>
</main>

<script type="module" src="./app-registro-universal.js"></script>
</body>
</html>

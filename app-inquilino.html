<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Gestia | Mi Edificio</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #000000; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-panic { background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); }
        .btn-service { background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%); }
        /* Animación para el feed de anuncios */
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-feed { animation: slideIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="text-white min-h-screen pb-20">

    <nav class="p-6 border-b border-white/10 flex justify-between items-center sticky top-0 bg-black/80 backdrop-blur-md z-50">
        <div class="flex items-center gap-3">
            <img src="assets/gestiapremium-icon.svg" class="w-8 h-8" alt="Logo">
            <div>
                <h1 id="lblNombreEdificio" class="font-black text-xs tracking-[0.2em] text-blue-500 uppercase">UXMAL 39</h1>
                <p id="lblUnidad" class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Oficina / Depto</p>
            </div>
        </div>
        <button onclick="window.logout()" class="w-10 h-10 rounded-full bg-zinc-900 flex items-center justify-center border border-white/5">
            <i class="fas fa-sign-out-alt text-gray-400"></i>
        </button>
    </nav>

    <main class="p-6 max-w-lg mx-auto space-y-8">
        
        <section>
            <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-[0.3em] mb-4 flex items-center gap-2">
                <i class="fas fa-bullhorn text-blue-500"></i> Avisos de Administración
            </h3>
            <div id="feedAnuncios" class="space-y-3">
                <div class="glass-card p-4 rounded-2xl animate-feed">
                    <p class="text-[10px] text-blue-400 font-bold mb-1">HOY • 14:00 PM</p>
                    <p class="text-sm text-zinc-300">Cargando avisos del edificio...</p>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-2 gap-4">
            <button onclick="window.abrirModalReporte('mantenimiento')" class="btn-service p-6 rounded-3xl flex flex-col items-center justify-center gap-3 shadow-lg shadow-blue-500/10 active:scale-95 transition-transform">
                <i class="fas fa-tools text-2xl"></i>
                <span class="text-[10px] font-black uppercase tracking-widest text-center">Reportar<br>Falla</span>
            </button>
            <button onclick="window.abrirModalReporte('seguridad')" class="bg-zinc-900 border border-white/5 p-6 rounded-3xl flex flex-col items-center justify-center gap-3 active:scale-95 transition-transform">
                <i class="fas fa-shield-alt text-2xl text-zinc-400"></i>
                <span class="text-[10px] font-black uppercase tracking-widest text-center">Aviso a<br>Caseta</span>
            </button>
        </section>

        <section>
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-[0.3em] flex items-center gap-2">
                    <i class="fas fa-clipboard-list text-emerald-500"></i> Seguimiento de Mis Folios
                </h3>
            </div>
            <div id="listaMisReportes" class="space-y-3">
                <p class="text-center py-10 text-xs text-zinc-600 italic">No tienes reportes activos en este momento.</p>
            </div>
        </section>

    </main>

    <div id="modalReporte" class="fixed inset-0 bg-black/95 z-[100] hidden flex items-center justify-center p-4 animate-fade-in">
        <div class="bg-zinc-900 w-full max-w-md rounded-[2.5rem] p-8 border border-white/10 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitulo" class="text-xl font-black italic uppercase tracking-tighter">NUEVO REPORTE</h3>
                <button onclick="window.cerrarModal()" class="text-gray-500 hover:text-white"><i class="fas fa-times-circle text-2xl"></i></button>
            </div>

            <form id="formReporteB2B" class="space-y-6">
                <input type="hidden" id="tipoReporte">
                
                <div>
                    <label class="text-[9px] font-black text-zinc-500 uppercase tracking-widest mb-2 block">Descripción de la incidencia</label>
                    <textarea id="descIncidencia" required class="w-full bg-black border border-white/10 rounded-2xl p-4 text-sm text-white focus:border-blue-500 outline-none transition-colors" rows="4" placeholder="Ej: Fuga de agua en el baño de la oficina 302..."></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[9px] font-black text-zinc-500 uppercase tracking-widest mb-2 block">Prioridad</label>
                        <select id="prioridadIncidencia" class="w-full bg-black border border-white/10 rounded-xl p-3 text-xs text-white outline-none">
                            <option value="baja">Baja</option>
                            <option value="media" selected>Media</option>
                            <option value="alta">Alta / Urgente</option>
                        </select>
                    </div>
                    <div class="flex flex-col justify-end">
                        <button type="button" class="w-full bg-zinc-800 h-[46px] rounded-xl flex items-center justify-center gap-2 text-xs font-bold text-zinc-400">
                            <i class="fas fa-camera"></i> Foto
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnEnviarReporte" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl shadow-xl shadow-blue-600/20 transition-all uppercase tracking-widest text-xs mt-4">
                    Enviar al Staff de Uxmal 39
                </button>
            </form>
        </div>
    </div>

    <div class="fixed bottom-0 inset-x-0 bg-zinc-950/80 backdrop-blur-lg border-t border-white/5 p-4 flex justify-around items-center z-50">
        <button class="flex flex-col items-center gap-1 text-blue-500">
            <i class="fas fa-home text-xl"></i>
            <span class="text-[8px] font-black uppercase">Inicio</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-zinc-600 hover:text-white transition-colors">
            <i class="fas fa-id-badge text-xl"></i>
            <span class="text-[8px] font-black uppercase">Mi Pase</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-zinc-600 hover:text-white transition-colors">
            <i class="fas fa-phone-alt text-xl"></i>
            <span class="text-[8px] font-black uppercase">Contacto</span>
        </button>
    </div>

    <script type="module" src="app-inquilino.js"></script>
</body>
</html>

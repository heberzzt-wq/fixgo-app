<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo | Bienvenido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #000000; font-family: 'Inter', sans-serif; }
        .hero-bg {
            background-image: radial-gradient(circle at center, #10b98120 0%, #000000 70%);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col">

    <nav class="p-6 flex justify-between items-center border-b border-white/10 relative z-20">
        <h1 class="font-black text-2xl italic tracking-tighter">FIX<span class="text-emerald-500">GO</span></h1>
    </nav>

    <main class="flex-1 flex flex-col items-center justify-center p-6 text-center hero-bg relative overflow-hidden">
        <div class="relative z-10 max-w-lg w-full">
            <h2 class="text-5xl font-black mb-4 tracking-tight">
                Tu Técnico <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-emerald-700">EN CAMINO</span>
            </h2>
            
            <div id="actionArea" class="mt-10 flex flex-col gap-4">
                <div id="loadingState" class="py-4">
                    <i class="fas fa-circle-notch fa-spin text-emerald-500 text-2xl"></i>
                </div>

                <div id="guestOptions" class="hidden space-y-3">
                    <a href="registro.html" class="block w-full bg-white text-black font-black py-4 rounded-xl">CREAR CUENTA</a>
                    <a href="login.html" class="block w-full border border-white/20 text-white font-bold py-4 rounded-xl">INICIAR SESIÓN</a>
                </div>

                <div id="userOptions" class="hidden space-y-3">
                    <div class="bg-emerald-900/30 border border-emerald-500/30 p-4 rounded-xl mb-4 text-left">
                        <p class="text-[10px] text-emerald-400 font-bold uppercase">Sesión Activa</p>
                        <p id="userNameDisplay" class="font-bold text-white text-lg">Usuario</p>
                    </div>
                    <button id="btnDashboard" class="block w-full bg-emerald-500 text-black font-black py-4 rounded-xl hover:bg-emerald-400">
                        IR A MI PANEL ->
                    </button>
                    <button id="btnLogoutIndex" class="text-xs text-red-400 font-bold mt-4 underline">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, observarAuth, signOut, doc, setDoc, db } from './firebase.js';

        const loadingState = document.getElementById('loadingState');
        const guestOptions = document.getElementById('guestOptions');
        const userOptions = document.getElementById('userOptions');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const btnDashboard = document.getElementById('btnDashboard');
        const btnLogoutIndex = document.getElementById('btnLogoutIndex');

        observarAuth((user) => {
            loadingState.classList.add('hidden');

            if (user) {
                guestOptions.classList.add('hidden');
                userOptions.classList.remove('hidden');
                userNameDisplay.textContent = user.nombre || user.email;

                btnDashboard.onclick = async () => {
                    if (user.rol === 'tecnico') window.location.href = 'tecnico.html';
                    else if (user.rol === 'cliente') window.location.href = 'cliente.html';
                    else if (user.rol === 'admin' || user.rol === 'ADMIN') window.location.href = 'admin.html';
                    else {
                        const esTecnico = confirm("⚠️ Rol no definido.\n\n¿Eres TÉCNICO?\n(Aceptar = Técnico / Cancelar = Cliente)");
                        const rolElegido = esTecnico ? 'tecnico' : 'cliente';
                        await setDoc(doc(db, "usuarios", user.uid), {
                            uid: user.uid, email: user.email, rol: rolElegido, nombre: user.displayName || "Usuario"
                        }, { merge: true });
                        window.location.href = esTecnico ? 'tecnico.html' : 'cliente.html';
                    }
                };

                btnLogoutIndex.onclick = async () => {
                    await signOut(auth);
                    window.location.reload();
                };
            } else {
                userOptions.classList.add('hidden');
                guestOptions.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo - Inicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-custom { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <header class="max-w-4xl mx-auto flex justify-between items-center p-6">
        <h1 class="text-3xl font-black text-slate-800 tracking-tighter">FixGo</h1>
        <button id="logoutBtn" class="hidden bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-xl transition-all">
            Salir
        </button>
    </header>

    <main class="max-w-4xl mx-auto px-4">
        
        <section id="heroSection" class="text-center py-10">
            <h2 class="text-4xl font-extrabold text-slate-900 mb-4">Soluciones rápidas a tu alcance</h2>
            <p class="text-slate-600 mb-8">Elige cómo quieres continuar hoy en FixGo.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-12">
                <a href="login.html" class="gradient-custom p-6 rounded-3xl text-white shadow-xl hover:scale-105 transition-transform">
                    <i class="fas fa-user-gear text-3xl mb-3"></i>
                    <h3 class="font-bold text-lg">Soy Técnico</h3>
                    <p class="text-xs opacity-80 text-white/80">Accede a tus servicios</p>
                </a>

                <a href="login.html" class="bg-white p-6 rounded-3xl text-slate-800 shadow-xl border border-slate-100 hover:scale-105 transition-transform">
                    <i class="fas fa-handshake text-3xl mb-3 text-indigo-600"></i>
                    <h3 class="font-bold text-lg">Soy Cliente</h3>
                    <p class="text-xs text-slate-400">Solicita una reparación</p>
                </a>

                <button onclick="window.location.href='#verMapa'" class="bg-emerald-500 p-6 rounded-3xl text-white shadow-xl hover:scale-105 transition-transform">
                    <i class="fas fa-map-location-dot text-3xl mb-3"></i>
                    <h3 class="font-bold text-lg">Rastrear</h3>
                    <p class="text-xs text-white/80">Ver técnico en vivo</p>
                </button>
            </div>
        </section>

        <section id="solicitudContainer" class="hidden animate-fade-in">
            <div class="flex items-center gap-2 mb-4">
                <div class="w-2 h-8 bg-indigo-600 rounded-full"></div>
                <h2 class="text-2xl font-bold text-slate-800">Hola, <span id="nombreCliente" class="text-indigo-600">Cargando...</span></h2>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-lg border border-slate-100 mb-8">
                <h3 class="text-lg font-bold mb-4 text-slate-700">¿Qué servicio necesitas?</h3>
                <form id="nuevaSolicitudForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1 ml-1">DIRECCIÓN / COLONIA</label>
                        <input type="text" name="direccion" placeholder="Ej: Calle 123, Colonia Centro" required class="w-full px-4 py-4 border-2 border-slate-100 rounded-2xl bg-slate-50 focus:border-indigo-500 outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1 ml-1">DESCRIPCIÓN DEL PROBLEMA</label>
                        <textarea name="descripcion" placeholder="¿Qué necesitas que reparemos?" required class="w-full px-4 py-4 border-2 border-slate-100 rounded-2xl bg-slate-50 focus:border-indigo-500 outline-none transition-all h-32"></textarea>
                    </div>

                    <button type="submit" class="w-full gradient-custom text-white font-black py-5 rounded-2xl shadow-lg shadow-indigo-200 hover:brightness-110 transition-all uppercase tracking-widest">
                        Enviar Solicitud
                    </button>
                </form>
            </div>

            <div class="mt-8">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <i class="fas fa-list-ul text-indigo-600"></i> Mis Solicitudes
                </h2>
                <div id="solicitudesCliente" class="space-y-4 min-h-[100px]">
                    <p class="text-slate-400 text-sm italic">Cargando tus solicitudes pendientes...</p>
                </div>
            </div>
        </section>

    </main>

    <script type="module" src="app-main.js"></script>
</body>
</html>

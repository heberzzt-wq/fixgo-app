<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo | Registro Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #050505; color: white; }
        .uber-card { background-color: #121212; border: 1px solid rgba(255,255,255,0.08); }
        .uber-input { background-color: #1e1e1e; border: none; color: white; transition: all 0.3s; }
        .uber-input:focus { ring: 2px solid #6366f1; background-color: #252525; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.5s ease-out; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <div class="fixed top-6 left-6 z-50">
        <a href="index.html" class="flex items-center gap-2 bg-white/5 backdrop-blur-md px-5 py-3 rounded-2xl border border-white/10 text-slate-300 font-bold shadow-xl hover:bg-white/10 transition-all group">
            <i class="fas fa-arrow-left text-sm group-hover:-translate-x-1 transition-transform"></i>
            <span class="text-xs uppercase tracking-widest">Inicio</span>
        </a>
    </div>

    <div class="max-w-md w-full animate-fade">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black italic tracking-tighter text-white">
                FIXGO<span class="text-indigo-500">&</span>FINISH
            </h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.4em] mt-2">Perfil de Usuario</p>
        </div>

        <form id="clienteForm" class="uber-card p-8 md:p-10 rounded-[2.5rem] shadow-2xl space-y-6" data-rol="CLIENTE">
            
            <div class="text-center mb-4">
                <h2 class="text-xl font-bold text-slate-200">Crea tu cuenta</h2>
                <p class="text-slate-500 text-xs mt-1">Regístrate para solicitar técnicos en tiempo real</p>
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-500 mb-2 ml-1 uppercase tracking-widest">Nombre Completo</label>
                <input type="text" name="nombre" required placeholder="Tu nombre" 
                    class="w-full uber-input px-5 py-4 rounded-2xl outline-none text-lg">
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-500 mb-2 ml-1 uppercase tracking-widest">Teléfono / WhatsApp</label>
                <input type="tel" name="telefono" required placeholder="10 dígitos" 
                    class="w-full uber-input px-5 py-4 rounded-2xl outline-none text-lg">
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-500 mb-2 ml-1 uppercase tracking-widest">Dirección Principal</label>
                <input type="text" name="direccion" required placeholder="Colonia y Calle" 
                    class="w-full uber-input px-5 py-4 rounded-2xl outline-none text-lg">
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-500 mb-2 ml-1 uppercase tracking-widest">Correo Electrónico</label>
                <input type="email" name="correo" required placeholder="email@ejemplo.com" 
                    class="w-full uber-input px-5 py-4 rounded-2xl outline-none text-lg">
            </div>

            <div class="pt-4 space-y-4">
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl shadow-lg shadow-indigo-500/20 hover:bg-indigo-500 transition-all uppercase tracking-tighter text-xl transform active:scale-95">
                    CREAR MI CUENTA
                </button>

                <div class="relative text-center py-2">
                    <hr class="border-white/5">
                    <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#121212] px-4 text-[10px] text-slate-600 font-bold uppercase tracking-widest">O con tu red social</span>
                </div>

                <button type="button" id="loginGoogle" class="w-full bg-white text-black font-black py-4 rounded-2xl flex items-center justify-center gap-3 shadow-xl hover:bg-slate-200 transition-all active:scale-95 text-lg">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5 h-5" alt="Google">
                    REGISTRARSE CON GOOGLE
                </button>
            </div>
        </form>

        <footer class="mt-10 text-center">
            <p class="text-slate-600 text-[10px] font-bold uppercase tracking-[0.2em]">© 2026 FIXGO | EXPERIENCIA DE CLIENTE</p>
        </footer>
    </div>

    <script type="module" src="app-registro-universal.js"></script>
</body>
</html>

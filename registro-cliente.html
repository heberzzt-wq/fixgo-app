<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FixGo | Registro Cliente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
  <h1 class="text-xl font-black mb-6 text-center">Registro Cliente</h1>

  <input id="email" placeholder="Correo" class="w-full mb-3 p-3 border rounded-xl">
  <input id="password" type="password" placeholder="Contraseña"
         class="w-full mb-4 p-3 border rounded-xl">

  <button id="btnRegistro"
    class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">
    Crear Cuenta
  </button>
</div>

<script type="module">
import { registrarUsuario } from "./firebase.js";

btnRegistro.onclick = async () => {
  try {
    await registrarUsuario(email.value, password.value, "cliente");
    location.href = "index.html";
  } catch {
    alert("Error al registrar");
  }
};
</script>

</body>
</html>

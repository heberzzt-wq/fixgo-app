name: v139 focal failure diagnostic

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v139-focal-failure-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-v139-focal:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          ! git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817..HEAD | grep -E '^functions/'
      - name: Materialize v139 cache candidate
        run: python .github/scripts/v139-live-reel-cache-apply.py
      - name: Run focal and print only failures
        shell: bash
        run: |
          set +e
          node --test \
            tests/jarvis-reel-live-cache-v139.test.mjs \
            tests/jarvis-reel-native-mp4-v138.test.mjs \
            tests/jarvis-reel-speech-v137.test.mjs \
            tests/jarvis-reel-media-source-recovery-v136.test.mjs \
            tests/nexo-browser-media-fallback-v135.test.mjs \
            tests/jarvis-reel-real-production-v134.test.mjs \
            tests/jarvis-reel-mission-fidelity-v133.test.mjs \
            tests/jarvis-reel-researched-media-v132.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            > /tmp/v139-focal.tap 2>&1
          code=$?
          echo '===== V139_FAILING_SUBTESTS ====='
          grep -E '^not ok [0-9]+ - ' /tmp/v139-focal.tap || true
          echo '===== V139_ASSERTION_LOCATIONS ====='
          grep -E '^[[:space:]]*(at |file:|error:|expected:|actual:)' /tmp/v139-focal.tap || true
          echo '===== V139_SUMMARY ====='
          grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms) ' /tmp/v139-focal.tap || true
          exit "$code"

name: contract-audit mission-contract policy compat closeout

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/contract-audit-mission-contract-policy-compat-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLOW_V2_CARRIER_SHA: 8ef564d954de07a3b63d8a117ada4c2bcf40e3b4
  BASE_SHA: 8de46c00565b041b006f6a33d81ff6c22a616846
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  certify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract certified execution blocks
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/contract-audit-mission-contract-authority-closeout-v4.yml /tmp/v4.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/v4.yml').read_text()
          pairs=[
            ('Reconstruct exact refined candidate','Assert instruction-driven tool selection','/tmp/final-reconstruct.sh'),
            ('Assert instruction-driven tool selection','Install dependencies','/tmp/final-authority.sh'),
            ('Protected surface audit','Build isolated Hosting-only config','/tmp/final-audit.sh'),
            ('Build isolated Hosting-only config','Install Firebase CLI','/tmp/final-host.sh'),
            ('Deploy Hosting only','Verify served bytes','/tmp/final-deploy.sh'),
          ]
          for a,b,out in pairs:
              s=text.index(f'      - name: {a}\n')
              rs=text.index('        run: |\n',s)+len('        run: |\n')
              e=text.index(f'\n      - name: {b}\n',rs)
              lines=[]
              for line in text[rs:e].splitlines():
                  if line.startswith('          '): lines.append(line[10:])
                  elif not line.strip(): lines.append('')
                  else: raise SystemExit(f'EXTRACT_INDENT:{a}:{line!r}')
              Path(out).write_text('\n'.join(lines)+'\n')
          PY
          for f in /tmp/final-*.sh; do bash -n "$f"; done
          echo 'CERTIFIED_EXECUTION_BLOCKS_EXTRACTED=true'

      - name: Reconstruct authority candidate and apply policy compatibility
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/final-reconstruct.sh
          python3 .github/candidates/contract-audit/mission-contract-policy-compat-v3.py
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/gestia-core.js
          node --check tests/jarvis-mission-contract-policy-compat-v3.test.mjs
          node --check tests/jarvis-mission-contract-authority-closeout-v2.test.mjs
          git diff --check
          echo 'MISSION_CONTRACT_POLICY_COMPAT_RECONSTRUCTED=true'

      - name: Assert semantic policy compatibility gate
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/final-authority.sh
          grep -q 'function cloudMissionContractPolicyCertified' gestia-core/jarvis/jarvis.multifunction.planner.js
          grep -q 'MISSION_CONTRACT_CLOUD_POLICY_UNVERIFIED' gestia-core/jarvis/jarvis.multifunction.planner.js
          grep -q 'exactMediaEvidenceSemantics' gestia-core/jarvis/jarvis.multifunction.planner.js
          grep -q 'physicalArtifactCompletionSemantics' gestia-core/jarvis/jarvis.multifunction.planner.js
          node <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('gestia-core/jarvis/jarvis.multifunction.planner.js','utf8');
          const a=source.indexOf('function cloudMissionContractPolicyCertified');
          const b=source.indexOf('async function callBrowserSemanticPlan',a);
          if(a<0 || b<=a) process.exit(31);
          const block=source.slice(a,b);
          if(block.indexOf('callSemanticPlanner')<0 || block.indexOf('callBrowserMissionContract')<0) process.exit(32);
          if(block.indexOf('callSemanticPlanner')>block.indexOf('callBrowserMissionContract')) process.exit(33);
          for(const forbidden of ['tiktok.com','Taquería El Dorado','web.research','web.media.collect','media.analyze','marketing.plan','reel.plan','reel.create']){
            if(block.includes(forbidden)){
              console.error('STATIC_ROUTING_LEAK',forbidden);
              process.exit(34);
            }
          }
          NODE
          echo 'CLOUD_PRIMARY_POLICY_CERTIFIED=true'
          echo 'UNCERTIFIED_CLOUD_FALLS_TO_CURRENT_SEMANTIC_AUDITOR=true'
          echo 'NO_STATIC_MEDIA_OR_MARKETING_ROUTING=true'

      - name: Install dependencies
        run: npm ci

      - name: Focal policy compatibility regression
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/jarvis-mission-contract-policy-compat-v3.test.mjs \
            tests/jarvis-mission-contract-authority-closeout-v2.test.mjs \
            tests/jarvis-mission-flow-contract-closeout.test.mjs \
            tests/jarvis-mission-contract-preserves-initial-production.test.mjs \
            tests/jarvis-human-regression-closeout.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-mission-contract-accounting.test.mjs \
            tests/jarvis-single-contract-authority.test.mjs \
            tests/single-semantic-authority.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs
          echo 'FOCAL_POLICY_COMPAT_GREEN=true'

      - name: Full CI exact command
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:test
          echo 'FULL_CI_EXACT_GREEN=true'

      - name: Protected surface audit
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/final-audit.sh
          ! git diff --name-only "$BASE_SHA" -- . | grep -E '^(functions/|multiservicios-web/|.*Multiservicios)'
          grep -q '1.2.0-stable-research-objectives' gestia-core/gestia-core.js
          ! grep -q 'MISSION_CONTRACT_RECOVERED_FROM_INITIAL_PLAN' gestia-core/gestia-core.js
          grep -q 'MISSION_CONTRACT_UNAVAILABLE' gestia-core/gestia-core.js
          echo 'FUNCTIONS_UNTOUCHED=true'
          echo 'MULTISERVICIOS_UNTOUCHED=true'
          echo 'MISSION_CONTRACT_STABLE=true'

      - name: Build isolated Hosting-only config
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/final-host.sh
          node <<'NODE'
          const fs=require('fs');
          const path='contract-audit-production-chain.json';
          const value=JSON.parse(fs.readFileSync(path,'utf8'));
          value.candidate='ADJUNTO_MISSION_CONTRACT_POLICY_COMPAT';
          value.missionContractCloudPolicyCertificationRequired=true;
          value.browserFallbackOnCloudPolicyMismatch=true;
          value.exactMediaEvidenceSemantics=true;
          value.physicalArtifactCompletionSemantics=true;
          value.cloudPlannerPrimary=true;
          value.initialSeedRecoveryRemoved=true;
          value.staticToolRouting=false;
          value.canonicalMissionContract='1.2.0-stable-research-objectives';
          value.untouchedSurfaces=['Functions','Multiservicios'];
          fs.writeFileSync(path,JSON.stringify(value,null,2));
          NODE

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting only
        shell: bash
        run: bash /tmp/final-deploy.sh

      - name: Verify current served bytes only
        shell: bash
        run: |
          set -euo pipefail
          base="https://${FIREBASE_SITE_ID}.web.app"
          ok=false
          for attempt in $(seq 1 20); do
            stamp="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL "${base}/gestia-core/jarvis/jarvis.multifunction.planner.js?policy=${stamp}" -o /tmp/policy-planner.js \
              && curl -fsSL "${base}/gestia-core/gestia-core.js?policy=${stamp}" -o /tmp/policy-core.js \
              && curl -fsSL "${base}/contract-audit-production-chain.json?policy=${stamp}" -o /tmp/policy-marker.json \
              && grep -q 'function cloudMissionContractPolicyCertified' /tmp/policy-planner.js \
              && grep -q 'MISSION_CONTRACT_CLOUD_POLICY_UNVERIFIED' /tmp/policy-planner.js \
              && grep -q 'exactMediaEvidenceSemantics' /tmp/policy-planner.js \
              && grep -q 'physicalArtifactCompletionSemantics' /tmp/policy-planner.js \
              && grep -q 'MISSION_CONTRACT_UNAVAILABLE' /tmp/policy-core.js \
              && ! grep -q 'MISSION_CONTRACT_RECOVERED_FROM_INITIAL_PLAN' /tmp/policy-core.js \
              && grep -q '1.2.0-stable-research-objectives' /tmp/policy-core.js \
              && grep -q 'ADJUNTO_MISSION_CONTRACT_POLICY_COMPAT' /tmp/policy-marker.json \
              && grep -q '"missionContractCloudPolicyCertificationRequired": true' /tmp/policy-marker.json \
              && grep -q '"browserFallbackOnCloudPolicyMismatch": true' /tmp/policy-marker.json \
              && grep -q '"exactMediaEvidenceSemantics": true' /tmp/policy-marker.json \
              && grep -q '"physicalArtifactCompletionSemantics": true' /tmp/policy-marker.json; then
              node <<'NODE'
              const fs=require('fs');
              const source=fs.readFileSync('/tmp/policy-planner.js','utf8');
              const a=source.indexOf('function cloudMissionContractPolicyCertified');
              const b=source.indexOf('async function callBrowserSemanticPlan',a);
              if(a<0 || b<=a) process.exit(41);
              const block=source.slice(a,b);
              if(block.indexOf('callSemanticPlanner')<0 || block.indexOf('callBrowserMissionContract')<0) process.exit(42);
              if(block.indexOf('callSemanticPlanner')>block.indexOf('callBrowserMissionContract')) process.exit(43);
              for(const forbidden of ['tiktok.com','Taquería El Dorado','web.research','web.media.collect','media.analyze','marketing.plan','reel.plan','reel.create']) if(block.includes(forbidden)) process.exit(44);
              NODE
              ok=true
              break
            fi
            sleep 4
          done
          test "$ok" = true
          echo 'MISSION_CONTRACT_POLICY_COMPAT_SERVED=true'
          echo "WEB_URL=${base}/gestia-terminal.html"

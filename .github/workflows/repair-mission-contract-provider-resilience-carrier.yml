# registered repair: scope authority ordering to the authority function body
name: repair mission-contract provider resilience carrier

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/repair-mission-contract-provider-resilience-carrier.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Scope authority-order assertions to authority function
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          candidate = Path('.github/candidates/contract-audit/mission-contract-provider-resilience-v1.py')
          candidate_text = candidate.read_text()
          old_a = "const a=source.indexOf('function cloudMissionContractPolicyCertified');"
          new_a = "const a=source.indexOf('async function callMissionContractCoverageAuthority');"
          old_b = "const b=source.indexOf('async function callBrowserSemanticPlan',a);"
          new_b = old_b
          if candidate_text.count(old_a) != 1:
              raise SystemExit(f'CANDIDATE_AUTHORITY_START_COUNT:{candidate_text.count(old_a)}')
          if candidate_text.count(old_b) != 1:
              raise SystemExit(f'CANDIDATE_AUTHORITY_END_COUNT:{candidate_text.count(old_b)}')
          candidate_text = candidate_text.replace(old_a, new_a, 1)
          candidate.write_text(candidate_text)

          workflow = Path('.github/workflows/contract-audit-mission-contract-provider-resilience-closeout.yml')
          workflow_text = workflow.read_text()
          if workflow_text.count(old_a) != 2:
              raise SystemExit(f'WORKFLOW_AUTHORITY_START_COUNT:{workflow_text.count(old_a)}')
          if workflow_text.count(old_b) != 2:
              raise SystemExit(f'WORKFLOW_AUTHORITY_END_COUNT:{workflow_text.count(old_b)}')
          workflow_text = workflow_text.replace(old_a, new_a)
          workflow.write_text(workflow_text)
          PY
          python3 -m py_compile .github/candidates/contract-audit/mission-contract-provider-resilience-v1.py
          grep -q "const a=source.indexOf('async function callMissionContractCoverageAuthority');" .github/workflows/contract-audit-mission-contract-provider-resilience-closeout.yml
          git diff --check
          git diff -- .github/candidates/contract-audit/mission-contract-provider-resilience-v1.py .github/workflows/contract-audit-mission-contract-provider-resilience-closeout.yml

      - name: Commit repaired authority-order gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'heberzzt-wq'
          git config user.email 'heberzzt@gmail.com'
          git add \
            .github/candidates/contract-audit/mission-contract-provider-resilience-v1.py \
            .github/workflows/contract-audit-mission-contract-provider-resilience-closeout.yml
          git commit -m 'ci(contract-audit): scope resilience authority-order gate correctly'
          git push origin HEAD:v94-media-v4n-negative-claims

      - name: Dispatch provider resilience certification on repaired HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run contract-audit-mission-contract-provider-resilience-closeout.yml \
            --repo heberzzt-wq/fixgo-app \
            --ref v94-media-v4n-negative-claims
          echo 'PROVIDER_RESILIENCE_CERTIFICATION_DISPATCHED=true'

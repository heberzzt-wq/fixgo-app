name: v133-reel-failure-precedence-apply

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/scripts/v133-reel-failure-precedence.py
      - .github/workflows/v133-reel-failure-precedence-apply.yml

permissions:
  contents: write

jobs:
  apply-v133-failure-precedence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v94-media-v4n-negative-claims

      - name: Guard branch and Functions baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          ! git diff --name-only a09d76c5d42117aa88630f7b0d5fee75290525b2..HEAD | grep -E '^functions/'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply failure precedence correction
        run: python .github/scripts/v133-reel-failure-precedence.py

      - name: Assert Functions untouched
        shell: bash
        run: |
          set -euo pipefail
          ! git diff --name-only | grep -E '^functions/'

      - name: Syntax check
        run: node --check gestia-core/jarvis/jarvis.mission.orchestrator.js

      - name: Focal safety plus v133
        run: |
          node --test \
            tests/jarvis-mission-failure-precedence.test.mjs \
            tests/jarvis-reel-mission-fidelity-v133.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit functional correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gestia-core/jarvis/jarvis.mission.orchestrator.js
          git commit -m "[v133] fix(adj): preserve failure evidence while unwrapping reel plans"
          git push origin HEAD:v94-media-v4n-negative-claims

      - name: Correction marker
        run: |
          echo "V133_TOP_LEVEL_FAILURE_PRECEDENCE=true"
          echo "V133_NESTED_EVIDENCE_PRESERVED=true"
          echo "V133_FUNCTIONS_UNCHANGED=true"

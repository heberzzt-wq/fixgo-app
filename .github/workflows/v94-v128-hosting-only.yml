name: V94 V128 Hosting-only release

on:
  push:
    branches: [v94-media-v4n-negative-claims]
    paths: ['.github/workflows/v94-v128-hosting-only.yml']

permissions:
  contents: write

jobs:
  deploy-hosting-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Guard certified v128 and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          git merge-base --is-ancestor 614a28164a279b5a3b46af852b2eb58205752dfb HEAD
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "f3fa8e1806b681e860875afd4ce8183d27864873"
          test "$(git ls-remote origin refs/heads/v5.9-polish | cut -f1)" = "2ae85e670505c5d425a5a0334e99c45168054bb8"
          if git diff --name-only dbc7641c1dc6e55d94d8a4c7c4f8a85fa069abf0...HEAD | grep -q '^functions/'; then
            echo 'Functions source differs from v127 base' >&2
            exit 1
          fi
          grep -q 'v94-real-media-runtime-authority-v128-20260811' modules/terminal/proposal-state.js
          grep -q '1.6.0-real-media-runtime-authority-v128' modules/terminal/nexo-bootstrap.js
          grep -q '1.0.0-real-media-runtime-authority-v128' gestia-core/nexo/nexo.real-media.runtime-guard-v128.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Build repo-root single-site Hosting config
        shell: python
        run: |
          import json
          from pathlib import Path
          source = json.loads(Path('firebase.json').read_text(encoding='utf-8'))
          hosting = source['hosting'][0]
          assert hosting.get('site') == 'fixgo-44e4d'
          assert hosting.get('public') == '.'
          config = {'hosting': [hosting]}
          assert 'functions' not in config
          Path('.firebase-v128-hosting.json').write_text(json.dumps(config, indent=2), encoding='utf-8')

      - name: Deploy certified ADJUNTO Hosting only
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          firebase deploy --only hosting --config .firebase-v128-hosting.json --project fixgo-44e4d --token "$FIREBASE_TOKEN" 2>&1 | tee v128-hosting.log

      - name: Verify live ADJUNTO v128
        shell: bash
        run: |
          set -euo pipefail
          URL='https://fixgo-44e4d.web.app/gestia-terminal.html'
          PROPOSAL='https://fixgo-44e4d.web.app/modules/terminal/proposal-state.js'
          BOOT='https://fixgo-44e4d.web.app/modules/terminal/nexo-bootstrap.js'
          GUARD='https://fixgo-44e4d.web.app/gestia-core/nexo/nexo.real-media.runtime-guard-v128.js'
          for i in {1..12}; do
            code=$(curl -L -sS -o /tmp/gestia-terminal.html -w '%{http_code}' "$URL" || true)
            proposal_code=$(curl -L -sS -o /tmp/proposal-state.js -w '%{http_code}' "$PROPOSAL" || true)
            boot_code=$(curl -L -sS -o /tmp/nexo-bootstrap.js -w '%{http_code}' "$BOOT" || true)
            guard_code=$(curl -L -sS -o /tmp/runtime-guard.js -w '%{http_code}' "$GUARD" || true)
            if [ "$code" = '200' ] && [ "$proposal_code" = '200' ] && [ "$boot_code" = '200' ] && [ "$guard_code" = '200' ] && grep -q 'v94-real-media-runtime-authority-v128-20260811' /tmp/proposal-state.js && grep -q '1.6.0-real-media-runtime-authority-v128' /tmp/nexo-bootstrap.js && grep -q '1.0.0-real-media-runtime-authority-v128' /tmp/runtime-guard.js; then
              echo "V128_LIVE_PROBE=200 /gestia-terminal.html"
              echo 'V128_LIVE_RELEASE_VERIFIED=v94-real-media-runtime-authority-v128-20260811'
              exit 0
            fi
            sleep 2
          done
          echo "Live v128 marker not observed; html=$code proposal=$proposal_code boot=$boot_code guard=$guard_code" >&2
          exit 1

      - name: Remove temporary Hosting workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'heberzzt-wq'
          git config user.email 'heberzzt@gmail.com'
          git rm .github/workflows/v94-v128-hosting-only.yml
          git commit -m '[v128] chore(deploy): remove temporary hosting workflow'
          git push origin HEAD:v94-media-v4n-negative-claims

      - name: Final no-Functions and protected refs proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "f3fa8e1806b681e860875afd4ce8183d27864873"
          test "$(git ls-remote origin refs/heads/v5.9-polish | cut -f1)" = "2ae85e670505c5d425a5a0334e99c45168054bb8"
          if git diff --name-only dbc7641c1dc6e55d94d8a4c7c4f8a85fa069abf0...HEAD | grep -q '^functions/'; then
            echo 'Functions source changed' >&2
            exit 1
          fi
          echo 'V128_HOSTING_ONLY_RELEASE_COMPLETE=true'
          echo 'V128_FUNCTIONS_UNCHANGED=true'

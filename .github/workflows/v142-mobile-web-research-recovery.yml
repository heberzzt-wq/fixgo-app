permissions:
  contents: write
  statuses: write

env:
  TARGET_BRANCH: v94-media-v4n-negative-claims
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  certify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      product_changed: ${{ steps.patch-state.outputs.product_changed }}
      functions_changed: ${{ steps.patch-state.outputs.functions_changed }}
      video_function_changed: ${{ steps.patch-state.outputs.video_function_changed }}
      semantic_function_changed: ${{ steps.patch-state.outputs.semantic_function_changed }}
    steps:
      - name: Publish observable run
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'v142-mobile-web-research-recovery' --arg description "run=${GITHUB_RUN_ID} V142 audiovisual closeout" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard branch and architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e .github/workflows/v143-jarvis-web-planner-deploy.yml
          test ! -e .github/workflows/v146-source-freshness-verification.yml
          test ! -e .github/workflows/v147-fact-freshness.yml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix functions

      - name: Read-only App Check enforcement diagnostic
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          npm install -g firebase-tools@15.25.1 >/dev/null
          module_path="$(npm root -g)/firebase-tools/lib/apiv2.js"
          test -f "$module_path"
          node - "$module_path" <<'NODE'
          const fs = require("node:fs");
          const api = require(process.argv[2]);
          api.setRefreshToken(process.env.FIREBASE_TOKEN);
          api.getAccessToken().then(token => {
            if (!token) throw new Error("FIREBASE_ACCESS_TOKEN_EMPTY");
            process.stdout.write(`::add-mask::${token}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `FIREBASE_ACCESS_TOKEN=${token}\n`);
          }).catch(error => {
            console.error(error?.message || error);
            process.exit(1);
          });
          NODE
          project_json="$RUNNER_TEMP/firebase-project.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $FIREBASE_ACCESS_TOKEN" \
            "https://firebase.googleapis.com/v1beta1/projects/$FIREBASE_PROJECT_ID" \
            -o "$project_json"
          project_number="$(jq -r '.projectNumber // empty' "$project_json")"
          test -n "$project_number"
          services_json="$RUNNER_TEMP/appcheck-services.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $FIREBASE_ACCESS_TOKEN" \
            "https://firebaseappcheck.googleapis.com/v1/projects/$project_number/services" \
            -o "$services_json"
          jq '{services: [(.services // [])[] | {name, enforcementMode, replayProtectionEnforcementMode}]}' "$services_json"
          rm -f "$project_json" "$services_json"


      - name: Apply deterministic V142 patches
        run: |
          node .github/scripts/v142-mobile-web-research-recovery.mjs
          node .github/scripts/v142-final-contract-alignment.mjs
          node .github/scripts/v142-reel-closeout.mjs

      - name: Verify syntax
        run: |
          node --check gestia-core/gestia-core.js
          node --check gestia-core/tools.bridge.js
          node --check gestia-core/tools.runtime.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.mission.planner-state.js
          node --check gestia-core/jarvis/jarvis.mission.dependencies.js
          node --check gestia-core/jarvis/jarvis.reel.media-binder.js
          node --check gestia-core/jarvis/jarvis.actuator.pack.js
          node --check functions/secure-entry-alias.js
          node --check functions/jarvis-video-operation-contract.js
          node --check jarvis-upload-bridge.js
          node --check jarvis-fs-bridge.js
          node --check jarvis-local-video-engine.js
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/jarvis-local-video-wan22.py').read_text(encoding='utf-8'))"
          node --check modules/terminal/jarvis-attachments.js

      - name: Verify persistent artifact download lifecycle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('modules/terminal/jarvis-attachments.js', 'utf8');
          const required = [
            '2.5.0-artifact-download-lifecycle-v142',
            'previewObjectUrls: new Set()',
            'artifactObjectUrls: new Set()',
            'state.previewObjectUrls.forEach(url => URL.revokeObjectURL(url))',
            'state.artifactObjectUrls.add(objectUrl)',
            'persistentArtifactDownloads: true',
            'window.addEventListener("beforeunload"'
          ];
          for (const marker of required) {
            if (!source.includes(marker)) throw new Error(`V142_ARTIFACT_DOWNLOAD_LIFECYCLE_MISSING:${marker}`);
          }
          const clearStart = source.indexOf('function clear()');
          const clearEnd = source.indexOf('\n}\n\nfunction observationTool', clearStart);
          if (clearStart < 0 || clearEnd < 0) throw new Error('V142_ARTIFACT_CLEAR_BLOCK_MISSING');
          const clearSource = source.slice(clearStart, clearEnd);
          if (clearSource.includes('artifactObjectUrls')) throw new Error('V142_CLEAR_REVOKES_DELIVERED_ARTIFACTS');
          if (source.includes('state.objectUrls.add(objectUrl)')) throw new Error('V142_SHARED_OBJECT_URL_BUCKET_REGRESSION');
          NODE

      - name: V142 focal contracts
        run: |
          node --test --test-concurrency=1 \
            tests/jarvis-mobile-web-research-recovery-v142.test.mjs \
            tests/jarvis-genai-provider-chain.test.cjs \
            tests/jarvis-web-research.test.cjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/jarvis-upload-bridge.test.mjs \
            tests/jarvis-source-grounded-research-v124.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-local-video-engine-v142.test.mjs \
            tests/jarvis-video-reference-mission-continuity-v142.test.mjs \
            tests/jarvis-video-operation-contract-v142.test.cjs \
            tests/jarvis-series-continuity-v142.test.mjs \
            tests/jarvis-reel-media-binder-v131.test.mjs \
            tests/jarvis-reel-native-mp4-v138.test.mjs \
            tests/jarvis-reel-terminal-delivery-v142.test.mjs

      - name: Retained legacy media and session contracts
        run: node --test --test-concurrency=1 tests/jarvis-reel-researched-media-v132.test.mjs tests/jarvis-reel-mission-fidelity-v133.test.mjs tests/jarvis-reel-real-production-v134.test.mjs tests/jarvis-real-media-reel-hydration-v127.test.mjs tests/jarvis-master-session-authority.test.mjs tests/jarvis-secure-session-v117.test.mjs

      - name: Full CI
        run: npm run ci:test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: B2B and B2C security contracts
        run: node --test tests/auth-routing-consistency.test.mjs tests/b2c-security-rules-contract.test.mjs

      - name: B2C forensic Firestore and Storage emulators
        run: npm run test:b2c-forensic-emulators

      - name: Detect materialization state
        id: patch-state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != 'push' ] || [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          committed_changed=$(git diff --name-only "$base" "$GITHUB_SHA")
          changed=$(git diff --name-only)
          if printf '%s\n%s\n' "$committed_changed" "$changed" | grep -Eq '^functions/'; then
            echo 'functions_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'functions_changed=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n%s\n' "$committed_changed" "$changed" | grep -Eq '^functions/(secure-entry-alias\.js|jarvis-video-operation-contract\.js|index\.js)$'; then
            echo 'video_function_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'video_function_changed=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n%s\n' "$committed_changed" "$changed" | grep -Eq '^functions/(jarvis-semantic-planner\.js|jarvis-genai-provider-chain\.js|index\.js)$'; then
            echo 'semantic_function_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'semantic_function_changed=false' >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$changed" ]; then
            echo 'product_changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              .github/scripts/v142-final-contract-alignment.mjs|gestia-core/gestia-core.js|gestia-core/tools.bridge.js|gestia-core/jarvis/jarvis.multitool.pack.js|gestia-core/jarvis/jarvis.multifunction.planner.js|gestia-core/jarvis/jarvis.marketing.engine.js|gestia-core/jarvis/jarvis.mission.orchestrator.js|gestia-core/jarvis/jarvis.mission.dependencies.js|gestia-core/jarvis/jarvis.reel.media-binder.js|gestia-core/jarvis/jarvis.actuator.pack.js|functions/jarvis-genai-provider-chain.js|functions/jarvis-semantic-planner.js|functions/jarvis-web-research.js|functions/index.js|functions/secure-entry-alias.js|functions/jarvis-video-operation-contract.js|jarvis-artifact-studio.js|jarvis-github-worker.js|jarvis-fs-bridge.js|jarvis-local-video-engine.js|scripts/jarvis-local-video-wan22.py|jarvis-reel-artifact.js|modules/terminal/jarvis-attachments.js|tests/jarvis-actuator-pack.test.mjs|tests/jarvis-local-video-engine-v142.test.mjs|tests/jarvis-marketing-handoff-v12.test.mjs|tests/jarvis-genai-provider-chain.test.cjs|tests/jarvis-multifunction-tools.test.mjs|tests/jarvis-semantic-planner.test.cjs|tests/jarvis-web-research.test.cjs|tests/jarvis-mobile-web-research-recovery-v142.test.mjs|tests/jarvis-source-grounded-research-v124.test.mjs|tests/jarvis-mission-orchestrator.test.mjs|tests/jarvis-video-reference-mission-continuity-v142.test.mjs|tests/jarvis-video-operation-contract-v142.test.cjs|tests/jarvis-series-continuity-v142.test.mjs|tests/jarvis-reel-media-binder-v131.test.mjs|tests/jarvis-reel-native-mp4-v138.test.mjs|tests/jarvis-reel-terminal-delivery-v142.test.mjs|tests/jarvis-fs-bridge-v2.test.mjs|package.json) ;;
              *) echo "Unexpected V142 diff: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          echo 'product_changed=true' >> "$GITHUB_OUTPUT"

  certify-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'ROOT_NPM_CI_FAILED' }
          npm ci --prefix functions
          if ($LASTEXITCODE -ne 0) { throw 'FUNCTIONS_DEPENDENCY_INSTALL_FAILED' }
      - name: Apply deterministic V142 patches
        run: |
          node .github/scripts/v142-mobile-web-research-recovery.mjs
          node .github/scripts/v142-final-contract-alignment.mjs
          node .github/scripts/v142-reel-closeout.mjs
      - name: Windows syntax contracts
        shell: pwsh
        run: |
          node --check gestia-core/tools.bridge.js
          node --check gestia-core/tools.runtime.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.mission.planner-state.js
          node --check gestia-core/jarvis/jarvis.mission.dependencies.js
          node --check gestia-core/jarvis/jarvis.reel.media-binder.js
          node --check gestia-core/jarvis/jarvis.actuator.pack.js
          node --check functions/secure-entry-alias.js
          node --check functions/jarvis-video-operation-contract.js
          node --check jarvis-artifact-studio.js
          node --check jarvis-fs-bridge.js
          node --check jarvis-local-video-engine.js
          python -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/jarvis-local-video-wan22.py').read_text(encoding='utf-8'))"
          node --check modules/terminal/jarvis-attachments.js
      - name: Windows focal - mobile web research recovery
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-mobile-web-research-recovery-v142.test.mjs
      - name: Windows B2B and B2C security contracts
        shell: pwsh
        run: node --test tests/auth-routing-consistency.test.mjs tests/b2c-security-rules-contract.test.mjs
      - name: Windows retained legacy media and session contracts
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-reel-researched-media-v132.test.mjs tests/jarvis-reel-mission-fidelity-v133.test.mjs tests/jarvis-reel-real-production-v134.test.mjs tests/jarvis-real-media-reel-hydration-v127.test.mjs tests/jarvis-master-session-authority.test.mjs tests/jarvis-secure-session-v117.test.mjs tests/jarvis-reel-speech-v137.test.mjs tests/nexo-real-media-tools.test.mjs
      - name: Windows focal - upload bridge
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-upload-bridge.test.mjs
      - name: Windows focal - multifunction tools
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-multifunction-tools.test.mjs
      - name: Windows focal - mission orchestrator
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-mission-orchestrator.test.mjs

      - name: Windows local bridge and worker authority
        shell: pwsh
        run: node --test --test-concurrency=1 --test-name-pattern="startup binds|SIA7 patch" tests/jarvis-fs-bridge-v2.test.mjs tests/jarvis-upload-bridge.test.mjs
      - name: Windows focal - local video engine V142
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          node --test --test-concurrency=1 --test-reporter=tap tests/jarvis-local-video-engine-v142.test.mjs *> artifacts/windows-local-video-v142.tap
          $code = $LASTEXITCODE
          Get-Content artifacts/windows-local-video-v142.tap
          exit $code
      - name: Upload Windows local video V142 TAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-local-video-v142-tap
          path: artifacts/windows-local-video-v142.tap
          if-no-files-found: warn
          retention-days: 1
      - name: Windows focal - video reference continuity
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-video-reference-mission-continuity-v142.test.mjs
      - name: Windows focal - video operation contract
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-video-operation-contract-v142.test.cjs
      - name: Windows focal - series continuity
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-series-continuity-v142.test.mjs
      - name: Windows focal - reel media binder
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-reel-media-binder-v131.test.mjs
      - name: Windows focal - reel native mp4
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-reel-native-mp4-v138.test.mjs
      - name: Windows focal - reel terminal delivery
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-reel-terminal-delivery-v142.test.mjs
      - name: Windows persistent artifact download lifecycle
        shell: pwsh
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('modules/terminal/jarvis-attachments.js','utf8'); const c=s.slice(s.indexOf('function clear()'),s.indexOf('function observationTool')); if(!s.includes('artifactObjectUrls: new Set()')||!s.includes('state.artifactObjectUrls.add(objectUrl)')||!s.includes('persistentArtifactDownloads: true')||c.includes('artifactObjectUrls')) throw new Error('V142_ARTIFACT_DOWNLOAD_LIFECYCLE_INVALID');"

  materialize-v142:
    needs: [certify-linux, certify-windows]
    if: ${{ github.ref == 'refs/heads/v94-media-v4n-negative-claims' && needs.certify-linux.outputs.product_changed == 'true' && success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply certified V142 patches
        run: |
          node .github/scripts/v142-mobile-web-research-recovery.mjs
          node .github/scripts/v142-final-contract-alignment.mjs
          node .github/scripts/v142-reel-closeout.mjs
      - name: Commit certified bytes
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test -n "$changed"
          while IFS= read -r file; do
            case "$file" in
              .github/scripts/v142-final-contract-alignment.mjs|gestia-core/gestia-core.js|gestia-core/tools.bridge.js|gestia-core/jarvis/jarvis.multitool.pack.js|gestia-core/jarvis/jarvis.multifunction.planner.js|gestia-core/jarvis/jarvis.marketing.engine.js|gestia-core/jarvis/jarvis.mission.orchestrator.js|gestia-core/jarvis/jarvis.mission.dependencies.js|gestia-core/jarvis/jarvis.reel.media-binder.js|gestia-core/jarvis/jarvis.actuator.pack.js|functions/jarvis-genai-provider-chain.js|functions/jarvis-semantic-planner.js|functions/jarvis-web-research.js|functions/index.js|functions/secure-entry-alias.js|functions/jarvis-video-operation-contract.js|jarvis-artifact-studio.js|jarvis-github-worker.js|jarvis-fs-bridge.js|jarvis-local-video-engine.js|scripts/jarvis-local-video-wan22.py|jarvis-reel-artifact.js|modules/terminal/jarvis-attachments.js|tests/jarvis-actuator-pack.test.mjs|tests/jarvis-local-video-engine-v142.test.mjs|tests/jarvis-marketing-handoff-v12.test.mjs|tests/jarvis-genai-provider-chain.test.cjs|tests/jarvis-multifunction-tools.test.mjs|tests/jarvis-semantic-planner.test.cjs|tests/jarvis-web-research.test.cjs|tests/jarvis-mobile-web-research-recovery-v142.test.mjs|tests/jarvis-source-grounded-research-v124.test.mjs|tests/jarvis-mission-orchestrator.test.mjs|tests/jarvis-video-reference-mission-continuity-v142.test.mjs|tests/jarvis-video-operation-contract-v142.test.cjs|tests/jarvis-series-continuity-v142.test.mjs|tests/jarvis-reel-media-binder-v131.test.mjs|tests/jarvis-reel-native-mp4-v138.test.mjs|tests/jarvis-reel-terminal-delivery-v142.test.mjs|tests/jarvis-fs-bridge-v2.test.mjs|package.json) ;;
              *) echo "Unexpected certified V142 diff: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only -z | xargs -0 git add --
          git commit -m 'fix(jarvis): materialize V142 audiovisual closeout'
          git push origin "HEAD:${TARGET_BRANCH}"

  deploy-v142:
    needs: [certify-linux, certify-windows, materialize-v142]
    if: ${{ github.ref == 'refs/heads/v94-media-v4n-negative-claims' && always() && needs.certify-linux.result == 'success' && needs.certify-windows.result == 'success' && (needs.certify-linux.outputs.product_changed == 'false' || needs.materialize-v142.result == 'success') && ((github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'authorize coordinated B2C B2B deploy'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Verify authorized release lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Re-certify materialized platform bytes
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/v142-mobile-web-research-recovery.mjs
          node .github/scripts/v142-final-contract-alignment.mjs
          node .github/scripts/v142-reel-closeout.mjs
          git diff --exit-code
          npm run test:b2c-forensic
          npm run test:platform-hardening
          npm run test:b2c-platform

      - name: Install pinned Firebase CLI
        run: npm install -g firebase-tools@15.10.1

      - name: Prepare exact release identity
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:release
          test "$(jq -r '.git_sha' release-manifest.json)" = "$DEPLOY_SHA"
          test "$(jq -r '.firestore.rules' firebase.release.json)" = "security/firestore-release.generated.rules.txt"
          test "$(jq -r '.storage.rules' firebase.release.json)" = "security/storage-release.generated.rules.txt"
          grep -F "GESTIA_RELEASE_SHA:$DEPLOY_SHA" security/firestore-release.generated.rules.txt
          grep -F "GESTIA_RELEASE_SHA:$DEPLOY_SHA" security/storage-release.generated.rules.txt

      - name: Mint short-lived rules smoke access token
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          module_path="$(npm root -g)/firebase-tools/lib/apiv2.js"
          test -f "$module_path"
          node - "$module_path" <<'NODE'
          const fs = require("node:fs");
          const api = require(process.argv[2]);
          api.setRefreshToken(process.env.FIREBASE_TOKEN);
          api.getAccessToken().then(token => {
            if (!token) throw new Error("FIREBASE_ACCESS_TOKEN_EMPTY");
            process.stdout.write(`::add-mask::${token}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `FIREBASE_ACCESS_TOKEN=${token}\n`);
          }).catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Build FixGo-only coordinated release config
        shell: bash
        run: |
          set -euo pipefail
          config_path="$PWD/.firebase-release-fixgo-only.json"
          jq --arg site "$FIREBASE_SITE_ID" '
            {
              firestore: .firestore,
              storage: .storage,
              functions: .functions,
              hosting: [
                .hosting[]
                | select(.site == $site)
                | .ignore = ((.ignore // []) + [
                    "firebase.release.json",
                    ".firebase-release-*.json",
                    "security/**",
                    "scripts/**",
                    "docs/**"
                  ] | unique)
              ]
            }
          ' firebase.release.json > "$config_path"
          test "$(jq '.hosting | length' "$config_path")" = "1"
          test "$(jq -r '.hosting[0].site' "$config_path")" = "$FIREBASE_SITE_ID"
          test "$(jq -r '.firestore.rules' "$config_path")" = "security/firestore-release.generated.rules.txt"
          test "$(jq -r '.storage.rules' "$config_path")" = "security/storage-release.generated.rules.txt"
          forbidden_multi='multi''servicios'
          ! grep -Fiq "$forbidden_multi" "$config_path"
          echo "FIXGO_RELEASE_CONFIG=$config_path" >> "$GITHUB_ENV"

      - name: Deploy coordinated FixGo platform release
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy \
            --config "$FIXGO_RELEASE_CONFIG" \
            --only functions,firestore:rules,storage,hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      - name: Verify critical deployed Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          deployed="$(firebase functions:list --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive)"
          for fn in \
            api onServiceCompleted reconciliarLiquidacionB2C \
            createB2cService approveB2cTechnician claimB2cService cancelB2cService \
            submitB2cQuote respondB2cQuote completeB2cService verifyB2cIdentity returnB2cTechnicianKyc \
            completeB2bRegistration provisionB2bPersonnel completeB2bService \
            submitB2bPersonnelKyc reviewB2bPersonnelKyc \
            requestPayout generarModulo procesarCierreServicio; do
            grep -F "$fn" <<<"$deployed"
          done

      - name: Verify retired legacy generator is inert
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/legacy-generator-canary.json"
          code="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{}' \
            "https://us-central1-${FIREBASE_PROJECT_ID}.cloudfunctions.net/generarModulo")"
          test "$code" = "410"
          jq -e '.error == "LEGACY_GENERATOR_RETIRED" and .authority == "secure-entry"' "$body" >/dev/null
          rm -f "$body"

      - name: Smoke exact production release
        env:
          FIREBASE_ACCESS_TOKEN: ${{ env.FIREBASE_ACCESS_TOKEN }}
        run: npm run smoke:release -- --project="$FIREBASE_PROJECT_ID"

      - name: Read-only B2C production audit
        env:
          FIREBASE_ACCESS_TOKEN: ${{ env.FIREBASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          audit="$RUNNER_TEMP/b2c-production-audit.json"
          node scripts/audit-b2c-production.mjs --project="$FIREBASE_PROJECT_ID" > "$audit"
          jq '{project,read_only,totals,technician_classifications,customer_classifications}' "$audit"
          rm -f "$audit"

      - name: Publish coordinated release green status
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n \
            --arg state success \
            --arg context 'v142-mobile-web-research-recovery' \
            --arg description "run=${GITHUB_RUN_ID} coordinated B2C/B2B release green" \
            --arg target_url "$target" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
            -d "$payload" >/dev/null


name: v142 mobile web research recovery

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v142-mobile-web-research-recovery.yml'
      - '.github/scripts/v142-mobile-web-research-recovery.mjs'
      - '.github/scripts/v142-final-contract-alignment.mjs'
      - 'gestia-core/gestia-core.js'
      - 'gestia-core/jarvis/jarvis.multitool.pack.js'
      - 'gestia-core/jarvis/jarvis.multifunction.planner.js'
      - 'gestia-core/jarvis/jarvis.marketing.engine.js'
      - 'functions/jarvis-genai-provider-chain.js'
      - 'functions/jarvis-web-research.js'
      - 'functions/jarvis-semantic-planner.js'
      - 'functions/index.js'
      - 'jarvis-upload-bridge.js'
      - 'tests/jarvis-mobile-web-research-recovery-v142.test.mjs'
      - 'tests/jarvis-genai-provider-chain.test.cjs'
      - 'tests/jarvis-web-research.test.cjs'
      - 'tests/jarvis-upload-bridge.test.mjs'
      - 'tests/jarvis-multifunction-tools.test.mjs'
      - 'tests/jarvis-semantic-planner.test.cjs'
      - 'tests/jarvis-source-grounded-research-v124.test.mjs'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  TARGET_BRANCH: v94-media-v4n-negative-claims
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  certify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      product_changed: ${{ steps.patch-state.outputs.product_changed }}
    steps:
      - name: Publish observable run
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'v142-mobile-web-research-recovery' --arg description "run=${GITHUB_RUN_ID} V142 web research recovery" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard protected architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ! grep -Fq 'terminalBrainRoute' gestia-core/gestia-core.js
          ! grep -Fq 'terminalBrainRoute' gestia-terminal.html
          test ! -e functions/jarvis-web-fact-freshness.js
          test ! -e jarvis-local-web-research.js
          test ! -e .github/workflows/v143-jarvis-web-planner-deploy.yml
          test ! -e .github/workflows/v146-source-freshness-verification.yml
          test ! -e .github/workflows/v147-fact-freshness.yml

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Apply deterministic V142 product patch
        run: node .github/scripts/v142-mobile-web-research-recovery.mjs

      - name: Apply V142 final contract alignment
        run: node .github/scripts/v142-final-contract-alignment.mjs

      - name: Align existing V142 web research assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/jarvis-multifunction-tools.test.mjs')
          source = path.read_text(encoding='utf-8')
          old = r'    assert.match(source, /facts: Array\.isArray\(result\.facts\)/);'
          new = r'    assert.match(source, /facts:\s*Array\.isArray\((?:primaryResult|recoveryResult)\?\.facts\)/);'
          if old in source:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('V142_EXISTING_WEB_CONTRACT_ASSERTION_NOT_FOUND')
          PY

      - name: Verify existing runtime surfaces
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/gestia-core.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.marketing.engine.js
          node --check functions/jarvis-genai-provider-chain.js
          node --check functions/jarvis-web-research.js
          node --check functions/jarvis-semantic-planner.js
          node --check functions/index.js
          node --check jarvis-upload-bridge.js
          grep -Fq 'GROUNDED_CROSS_SOURCE_RECOVERY' gestia-core/jarvis/jarvis.multitool.pack.js
          grep -Fq 'EXACT_ANCHOR_UNAVAILABLE_CROSS_SOURCE_GROUNDED' gestia-core/jarvis/jarvis.multitool.pack.js
          grep -Fq 'hardDomainScope' gestia-core/jarvis/jarvis.multitool.pack.js
          grep -Eq 'CLOUD_MISSION_CONTRACT_TIMEOUT_MS =\s*45000|CLOUD_MISSION_CONTRACT_TIMEOUT_MS =[[:space:]]*$' gestia-core/jarvis/jarvis.multifunction.planner.js
          ! grep -Fq 'text.pollinations.ai' gestia-core/jarvis/jarvis.multifunction.planner.js
          ! grep -Fq 'callBrowserMissionContract' gestia-core/jarvis/jarvis.multifunction.planner.js
          ! grep -Fq 'callBrowserSemanticPlan' gestia-core/jarvis/jarvis.multifunction.planner.js
          grep -Fq 'simpleFetchImpl: null' functions/index.js
          grep -Fq 'SEMANTIC_AUTHENTICATED_PROVIDER_' functions/jarvis-semantic-planner.js
          grep -Fq 'FUENTE ANCLA' functions/jarvis-semantic-planner.js
          grep -Fq 'FUENTES_EXPLICITAS_USUARIO' functions/jarvis-semantic-planner.js
          grep -Fq 'compactProviderInputSchema' functions/jarvis-genai-provider-chain.js
          grep -Fq 'buildJsonPlanningFallbackRequest' functions/jarvis-genai-provider-chain.js
          grep -Fq 'canonicalizeGroundingRedirects' functions/jarvis-genai-provider-chain.js
          grep -Fq 'runResilientLocalWebResearch' jarvis-upload-bridge.js
          ! grep -Fq 'jarvis-local-web-research.js' jarvis-upload-bridge.js
          ! grep -Fq 'NEXO preparó una campaña específica' gestia-core/jarvis/jarvis.marketing.engine.js

      - name: V142 contract - mobile web research recovery
        run: node --test --test-concurrency=1 tests/jarvis-mobile-web-research-recovery-v142.test.mjs

      - name: V142 contract - genai provider chain
        run: node --test --test-concurrency=1 tests/jarvis-genai-provider-chain.test.cjs

      - name: V142 contract - web research
        run: node --test --test-concurrency=1 tests/jarvis-web-research.test.cjs

      - name: V142 contract - semantic planner
        run: node --test --test-concurrency=1 tests/jarvis-semantic-planner.test.cjs

      - name: V142 contract - upload bridge
        run: node --test --test-concurrency=1 tests/jarvis-upload-bridge.test.mjs

      - name: V142 contract - source grounded research v124
        run: node --test --test-concurrency=1 tests/jarvis-source-grounded-research-v124.test.mjs

      - name: V142 contract - multifunction tools
        run: node --test --test-concurrency=1 tests/jarvis-multifunction-tools.test.mjs

      - name: V142 contract - mission orchestrator
        run: node --test --test-concurrency=1 tests/jarvis-mission-orchestrator.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Reject whitespace errors
        run: git diff --check

      - name: Detect V142 materialization state
        id: patch-state
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          if [ -z "$changed" ]; then
            echo 'product_changed=false' >> "$GITHUB_OUTPUT"
            echo 'V142_PRODUCT_ALREADY_MATERIALIZED=true'
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              gestia-core/gestia-core.js|gestia-core/jarvis/jarvis.multitool.pack.js|gestia-core/jarvis/jarvis.multifunction.planner.js|gestia-core/jarvis/jarvis.marketing.engine.js|functions/jarvis-semantic-planner.js|functions/jarvis-web-research.js|functions/index.js|tests/jarvis-multifunction-tools.test.mjs|tests/jarvis-semantic-planner.test.cjs|tests/jarvis-web-research.test.cjs|tests/jarvis-mobile-web-research-recovery-v142.test.mjs|tests/jarvis-source-grounded-research-v124.test.mjs) ;;
              *) echo "Unexpected V142 diff: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          echo 'product_changed=true' >> "$GITHUB_OUTPUT"
          echo 'V142_PRODUCT_PATCH_NEEDS_COMMIT=true'

  certify-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'ROOT_NPM_CI_FAILED' }
          npm ci --prefix functions
          if ($LASTEXITCODE -ne 0) { throw 'FUNCTIONS_NPM_CI_FAILED' }

      - name: Apply deterministic V142 product patch
        run: node .github/scripts/v142-mobile-web-research-recovery.mjs

      - name: Apply V142 final contract alignment
        run: node .github/scripts/v142-final-contract-alignment.mjs

      - name: Align existing V142 web research assertion
        shell: pwsh
        run: |
          $path = 'tests/jarvis-multifunction-tools.test.mjs'
          $source = Get-Content -Raw -LiteralPath $path
          $old = '    assert.match(source, /facts: Array\.isArray\(result\.facts\)/);'
          $new = '    assert.match(source, /facts:\s*Array\.isArray\((?:primaryResult|recoveryResult)\?\.facts\)/);'
          if ($source.Contains($old)) {
            $source = $source.Replace($old, $new)
            [System.IO.File]::WriteAllText($path, $source)
          } elseif (-not $source.Contains($new)) {
            throw 'V142_EXISTING_WEB_CONTRACT_ASSERTION_NOT_FOUND'
          }

      - name: Windows V142 runtime syntax
        shell: pwsh
        run: |
          node --check gestia-core/gestia-core.js
          if ($LASTEXITCODE -ne 0) { throw 'CORE_SYNTAX_FAILED' }
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          if ($LASTEXITCODE -ne 0) { throw 'MULTITOOL_SYNTAX_FAILED' }
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          if ($LASTEXITCODE -ne 0) { throw 'PLANNER_SYNTAX_FAILED' }
          node --check gestia-core/jarvis/jarvis.marketing.engine.js
          if ($LASTEXITCODE -ne 0) { throw 'MARKETING_SYNTAX_FAILED' }
          node --check functions/jarvis-genai-provider-chain.js
          if ($LASTEXITCODE -ne 0) { throw 'PROVIDER_CHAIN_SYNTAX_FAILED' }
          node --check functions/jarvis-web-research.js
          if ($LASTEXITCODE -ne 0) { throw 'WEB_RESEARCH_SYNTAX_FAILED' }
          node --check functions/jarvis-semantic-planner.js
          if ($LASTEXITCODE -ne 0) { throw 'SEMANTIC_PLANNER_SYNTAX_FAILED' }
          node --check functions/index.js
          if ($LASTEXITCODE -ne 0) { throw 'FUNCTIONS_INDEX_SYNTAX_FAILED' }
          node --check jarvis-upload-bridge.js
          if ($LASTEXITCODE -ne 0) { throw 'UPLOAD_BRIDGE_SYNTAX_FAILED' }

      - name: Windows V142 contract - mobile web research recovery
        run: node --test --test-concurrency=1 tests/jarvis-mobile-web-research-recovery-v142.test.mjs

      - name: Windows V142 contract - genai provider chain
        run: node --test --test-concurrency=1 tests/jarvis-genai-provider-chain.test.cjs

      - name: Windows V142 contract - web research
        run: node --test --test-concurrency=1 tests/jarvis-web-research.test.cjs

      - name: Windows V142 contract - semantic planner
        run: node --test --test-concurrency=1 tests/jarvis-semantic-planner.test.cjs

      - name: Windows V142 contract - upload bridge
        run: node --test --test-concurrency=1 tests/jarvis-upload-bridge.test.mjs

      - name: Windows V142 contract - multifunction tools
        run: node --test --test-concurrency=1 tests/jarvis-multifunction-tools.test.mjs

      - name: Windows V142 canonical human reel E2E
        shell: pwsh
        run: |
          git switch -C $env:TARGET_BRANCH $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'V142_CANONICAL_BRANCH_ATTACH_FAILED' }
          $stdout = Join-Path $env:RUNNER_TEMP 'v142-canonical-bridge.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'v142-canonical-bridge.stderr.log'
          $process = Start-Process -FilePath node -ArgumentList 'jarvis-upload-bridge.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              $probe = Test-NetConnection -ComputerName 127.0.0.1 -Port 3344 -WarningAction SilentlyContinue
              if ($probe.TcpTestSucceeded) { $ready = $true; break }
              if ($process.HasExited) { break }
            }
            if (-not $ready) {
              Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
              throw 'V142_LOCAL_BRIDGE_NOT_READY'
            }
            & node '.github/scripts/v139-canonical-real-reel.mjs'
            if ($LASTEXITCODE -ne 0) { throw "V142_CANONICAL_MISSION_FAILED:$LASTEXITCODE" }
            Write-Host 'V142_REUSED_CANONICAL_REAL_REEL_E2E_GREEN=true'
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue | Select-Object -Last 120
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue | Select-Object -Last 120
          }

  materialize-v142:
    needs:
      - certify-linux
      - certify-windows
    if: ${{ needs.certify-linux.outputs.product_changed == 'true' && success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply certified V142 patch
        run: node .github/scripts/v142-mobile-web-research-recovery.mjs

      - name: Apply certified V142 final contract alignment
        run: node .github/scripts/v142-final-contract-alignment.mjs

      - name: Align certified existing V142 assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/jarvis-multifunction-tools.test.mjs')
          source = path.read_text(encoding='utf-8')
          old = r'    assert.match(source, /facts: Array\.isArray\(result\.facts\)/);'
          new = r'    assert.match(source, /facts:\s*Array\.isArray\((?:primaryResult|recoveryResult)\?\.facts\)/);'
          if old in source:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('V142_EXISTING_WEB_CONTRACT_ASSERTION_NOT_FOUND')
          PY

      - name: Commit certified V142 bytes
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test -n "$changed"
          while IFS= read -r file; do
            case "$file" in
              gestia-core/gestia-core.js|gestia-core/jarvis/jarvis.multitool.pack.js|gestia-core/jarvis/jarvis.multifunction.planner.js|gestia-core/jarvis/jarvis.marketing.engine.js|functions/jarvis-semantic-planner.js|functions/jarvis-web-research.js|functions/index.js|tests/jarvis-multifunction-tools.test.mjs|tests/jarvis-semantic-planner.test.cjs|tests/jarvis-web-research.test.cjs|tests/jarvis-mobile-web-research-recovery-v142.test.mjs|tests/jarvis-source-grounded-research-v124.test.mjs) ;;
              *) echo "Unexpected certified V142 diff: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            gestia-core/gestia-core.js \
            gestia-core/jarvis/jarvis.multitool.pack.js \
            gestia-core/jarvis/jarvis.multifunction.planner.js \
            gestia-core/jarvis/jarvis.marketing.engine.js \
            functions/jarvis-semantic-planner.js \
            functions/jarvis-web-research.js \
            functions/index.js \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/jarvis-web-research.test.cjs \
            tests/jarvis-mobile-web-research-recovery-v142.test.mjs \
            tests/jarvis-source-grounded-research-v124.test.mjs
          git commit -m 'fix(jarvis): materialize V142 single authority consolidation'
          git push origin "HEAD:${TARGET_BRANCH}"

  deploy-v142:
    needs:
      - certify-linux
      - certify-windows
      - materialize-v142
    if: ${{ always() && needs.certify-linux.result == 'success' && needs.certify-windows.result == 'success' && (needs.certify-linux.outputs.product_changed == 'false' || needs.materialize-v142.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout certified V142 branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Re-certify deploy bytes
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check functions/jarvis-genai-provider-chain.js
          node --check functions/jarvis-web-research.js
          node --check functions/jarvis-semantic-planner.js
          node --check functions/index.js
          node --check jarvis-upload-bridge.js
          node --test --test-concurrency=1 \
            tests/jarvis-mobile-web-research-recovery-v142.test.mjs \
            tests/jarvis-genai-provider-chain.test.cjs \
            tests/jarvis-web-research.test.cjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/jarvis-upload-bridge.test.mjs \
            tests/jarvis-source-grounded-research-v124.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy V142 Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      - name: Smoke V142 production
        shell: bash
        run: |
          set -euo pipefail
          base="https://${FIREBASE_SITE_ID}.web.app"
          curl --fail --silent --show-error --location "$base/gestia-terminal.html?v142=$(date +%s)" -o /tmp/terminal.html
          test "$(wc -c < /tmp/terminal.html)" -gt 1000
          for fn in jarvisWebResearch jarvisSemanticPlan jarvisSemanticRespond; do
            url="https://us-central1-${FIREBASE_PROJECT_ID}.cloudfunctions.net/${fn}"
            code=$(curl --silent --show-error --output "/tmp/${fn}.json" --write-out '%{http_code}' \
              -X POST -H 'Content-Type: application/json' --data '{"data":{}}' "$url" || true)
            echo "$fn HTTP=$code"
            test "$code" != "000"
            test "$code" != "404"
            test "$code" != "502"
            test "$code" != "503"
          done
          echo 'V142_WEB_RESEARCH_RUNTIME_VERIFIED=true'

  publish-result:
    needs:
      - certify-linux
      - certify-windows
      - materialize-v142
      - deploy-v142
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish final observable status
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RESULT: ${{ needs.certify-linux.result }}
          WINDOWS_RESULT: ${{ needs.certify-windows.result }}
          MATERIALIZE_RESULT: ${{ needs.materialize-v142.result }}
          DEPLOY_RESULT: ${{ needs.deploy-v142.result }}
          PRODUCT_CHANGED: ${{ needs.certify-linux.outputs.product_changed }}
        run: |
          set -euo pipefail
          state=success
          if [ "$LINUX_RESULT" != success ] || [ "$WINDOWS_RESULT" != success ]; then state=failure; fi
          if [ "$PRODUCT_CHANGED" = true ] && [ "$MATERIALIZE_RESULT" != success ]; then state=failure; fi
          if [ "$DEPLOY_RESULT" != success ]; then state=failure; fi
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          description="linux=${LINUX_RESULT} windows=${WINDOWS_RESULT} materialize=${MATERIALIZE_RESULT} deploy=${DEPLOY_RESULT} changed=${PRODUCT_CHANGED}"
          payload=$(jq -n --arg state "$state" --arg context 'v142-mobile-web-research-recovery' --arg description "$description" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
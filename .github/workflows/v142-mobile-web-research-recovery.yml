name: v142 mobile web research recovery

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v142-mobile-web-research-recovery.yml'
      - '.github/scripts/v142-mobile-web-research-recovery.mjs'
      - '.github/scripts/v142-final-contract-alignment.mjs'
      - 'gestia-core/gestia-core.js'
      - 'gestia-core/jarvis/jarvis.multitool.pack.js'
      - 'gestia-core/jarvis/jarvis.multifunction.planner.js'
      - 'gestia-core/jarvis/jarvis.marketing.engine.js'
      - 'functions/jarvis-genai-provider-chain.js'
      - 'functions/jarvis-web-research.js'
      - 'functions/jarvis-semantic-planner.js'
      - 'functions/index.js'
      - 'jarvis-upload-bridge.js'
      - 'tests/nexo-terminal-bootstrap.test.mjs'
      - 'tests/jarvis-mobile-web-research-recovery-v142.test.mjs'
      - 'tests/jarvis-genai-provider-chain.test.cjs'
      - 'tests/jarvis-web-research.test.cjs'
      - 'tests/jarvis-upload-bridge.test.mjs'
      - 'tests/jarvis-multifunction-tools.test.mjs'
      - 'tests/jarvis-semantic-planner.test.cjs'
      - 'tests/jarvis-source-grounded-research-v124.test.mjs'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  TARGET_BRANCH: v94-media-v4n-negative-claims
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  certify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      product_changed: ${{ steps.patch-state.outputs.product_changed }}
    steps:
      - name: Publish observable run
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'v142-mobile-web-research-recovery' --arg description "run=${GITHUB_RUN_ID} V142 semantic consolidation" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard protected architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ! grep -Fq 'terminalBrainRoute' gestia-core/gestia-core.js
          ! grep -Fq 'terminalBrainRoute' gestia-terminal.html
          test ! -e functions/jarvis-web-fact-freshness.js
          test ! -e jarvis-local-web-research.js
          test ! -e .github/workflows/v143-jarvis-web-planner-deploy.yml
          test ! -e .github/workflows/v146-source-freshness-verification.yml
          test ! -e .github/workflows/v147-fact-freshness.yml

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Apply deterministic V142 product patch
        run: node .github/scripts/v142-mobile-web-research-recovery.mjs

      - name: Apply V142 final contract alignment
        run: node .github/scripts/v142-final-contract-alignment.mjs

      - name: Verify V142 runtime surfaces
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/gestia-core.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check functions/jarvis-genai-provider-chain.js
          node --check functions/jarvis-web-research.js
          node --check functions/jarvis-semantic-planner.js
          node --check functions/index.js
          node --check jarvis-upload-bridge.js
          grep -Fq 'gemini-3.6-flash' functions/jarvis-semantic-planner.js
          grep -Fq 'gemini-developer' functions/index.js
          grep -Fq 'vertex-adc' functions/index.js
          ! grep -Fq 'text.pollinations.ai' functions/jarvis-semantic-planner.js
          ! grep -Fq 'openai-fast' functions/jarvis-semantic-planner.js
          ! grep -Fq 'text.pollinations.ai' gestia-core/jarvis/jarvis.multifunction.planner.js
          grep -Fq 'GROUNDED_CROSS_SOURCE_RECOVERY' gestia-core/jarvis/jarvis.multitool.pack.js
          grep -Fq 'FUENTE ANCLA' functions/jarvis-semantic-planner.js
          grep -Fq 'compactProviderInputSchema' functions/jarvis-genai-provider-chain.js
          grep -Fq 'responseHasExecutableSemanticPlan' functions/jarvis-genai-provider-chain.js
          grep -Fq 'runResilientLocalWebResearch' jarvis-upload-bridge.js

      - name: V142 focal contracts
        run: |
          node --test --test-concurrency=1 \
            tests/jarvis-mobile-web-research-recovery-v142.test.mjs \
            tests/jarvis-genai-provider-chain.test.cjs \
            tests/jarvis-web-research.test.cjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/jarvis-upload-bridge.test.mjs \
            tests/jarvis-source-grounded-research-v124.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Reject whitespace errors
        run: git diff --check

      - name: Detect V142 materialization state
        id: patch-state
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          if [ -z "$changed" ]; then
            echo 'product_changed=false' >> "$GITHUB_OUTPUT"
            echo 'V142_PRODUCT_ALREADY_MATERIALIZED=true'
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              gestia-core/gestia-core.js|gestia-core/jarvis/jarvis.multitool.pack.js|gestia-core/jarvis/jarvis.multifunction.planner.js|gestia-core/jarvis/jarvis.marketing.engine.js|functions/jarvis-genai-provider-chain.js|functions/jarvis-semantic-planner.js|functions/jarvis-web-research.js|functions/index.js|tests/jarvis-genai-provider-chain.test.cjs|tests/jarvis-multifunction-tools.test.mjs|tests/jarvis-semantic-planner.test.cjs|tests/jarvis-web-research.test.cjs|tests/jarvis-mobile-web-research-recovery-v142.test.mjs|tests/jarvis-source-grounded-research-v124.test.mjs) ;;
              *) echo "Unexpected V142 diff: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          echo 'product_changed=true' >> "$GITHUB_OUTPUT"
          echo 'V142_PRODUCT_PATCH_NEEDS_COMMIT=true'

  certify-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'ROOT_NPM_CI_FAILED' }
          npm ci --prefix functions
          if ($LASTEXITCODE -ne 0) { throw 'FUNCTIONS_NPM_CI_FAILED' }

      - name: Apply deterministic V142 product patch
        run: node .github/scripts/v142-mobile-web-research-recovery.mjs

      - name: Apply V142 final contract alignment
        run: node .github/scripts/v142-final-contract-alignment.mjs

      - name: Windows V142 runtime syntax
        shell: pwsh
        run: |
          node --check gestia-core/gestia-core.js
          if ($LASTEXITCODE -ne 0) { throw 'CORE_SYNTAX_FAILED' }
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          if ($LASTEXITCODE -ne 0) { throw 'MULTITOOL_SYNTAX_FAILED' }
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          if ($LASTEXITCODE -ne 0) { throw 'PLANNER_SYNTAX_FAILED' }
          node --check functions/jarvis-genai-provider-chain.js
          if ($LASTEXITCODE -ne 0) { throw 'PROVIDER_CHAIN_SYNTAX_FAILED' }
          node --check functions/jarvis-web-research.js
          if ($LASTEXITCODE -ne 0) { throw 'WEB_RESEARCH_SYNTAX_FAILED' }
          node --check functions/jarvis-semantic-planner.js
          if ($LASTEXITCODE -ne 0) { throw 'SEMANTIC_PLANNER_SYNTAX_FAILED' }
          node --check functions/index.js
          if ($LASTEXITCODE -ne 0) { throw 'FUNCTIONS_INDEX_SYNTAX_FAILED' }
          node --check jarvis-upload-bridge.js
          if ($LASTEXITCODE -ne 0) { throw 'UPLOAD_BRIDGE_SYNTAX_FAILED' }

      - name: Windows V142 focal contracts
        run: node --test --test-concurrency=1 tests/jarvis-mobile-web-research-recovery-v142.test.mjs tests/jarvis-genai-provider-chain.test.cjs tests/jarvis-web-research.test.cjs tests/jarvis-semantic-planner.test.cjs tests/jarvis-upload-bridge.test.mjs tests/jarvis-multifunction-tools.test.mjs

  materialize-v142:
    needs:
      - certify-linux
      - certify-windows
    if: ${{ needs.certify-linux.outputs.product_changed == 'true' && success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply certified V142 patches
        run: |
          node .github/scripts/v142-mobile-web-research-recovery.mjs
          node .github/scripts/v142-final-contract-alignment.mjs

      - name: Commit certified V142 bytes
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test -n "$changed"
          while IFS= read -r file; do
            case "$file" in
              gestia-core/gestia-core.js|gestia-core/jarvis/jarvis.multitool.pack.js|gestia-core/jarvis/jarvis.multifunction.planner.js|gestia-core/jarvis/jarvis.marketing.engine.js|functions/jarvis-genai-provider-chain.js|functions/jarvis-semantic-planner.js|functions/jarvis-web-research.js|functions/index.js|tests/jarvis-genai-provider-chain.test.cjs|tests/jarvis-multifunction-tools.test.mjs|tests/jarvis-semantic-planner.test.cjs|tests/jarvis-web-research.test.cjs|tests/jarvis-mobile-web-research-recovery-v142.test.mjs|tests/jarvis-source-grounded-research-v124.test.mjs) ;;
              *) echo "Unexpected certified V142 diff: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only -z | xargs -0 git add --
          git commit -m 'fix(jarvis): materialize V142 two-provider semantic consolidation'
          git push origin "HEAD:${TARGET_BRANCH}"

  deploy-v142:
    needs:
      - certify-linux
      - certify-windows
      - materialize-v142
    if: ${{ always() && needs.certify-linux.result == 'success' && needs.certify-windows.result == 'success' && (needs.certify-linux.outputs.product_changed == 'false' || needs.materialize-v142.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout certified V142 branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Re-certify deploy bytes
        run: |
          node --check functions/jarvis-genai-provider-chain.js
          node --check functions/jarvis-semantic-planner.js
          node --check functions/index.js
          node --check jarvis-upload-bridge.js
          node --test --test-concurrency=1 tests/jarvis-mobile-web-research-recovery-v142.test.mjs tests/jarvis-genai-provider-chain.test.cjs tests/jarvis-web-research.test.cjs tests/jarvis-semantic-planner.test.cjs tests/jarvis-upload-bridge.test.mjs tests/jarvis-source-grounded-research-v124.test.mjs tests/jarvis-multifunction-tools.test.mjs

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy V142 Hosting FIXGO only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          config_path="$PWD/.firebase-v142-fixgo-only.json"
          trap 'rm -f "$config_path"' EXIT
          jq --arg site "$FIREBASE_SITE_ID" '{hosting: [.hosting[] | select(.site == $site)]}' firebase.json > "$config_path"
          test "$(dirname "$config_path")" = "$PWD"
          test "$(jq '.hosting | length' "$config_path")" = "1"
          test "$(jq -r '.hosting[0].site' "$config_path")" = "$FIREBASE_SITE_ID"
          ! grep -Fq 'multiservicios' "$config_path"
          echo 'V142_FIXGO_ONLY_HOSTING_CONFIG=true'
          firebase deploy --config "$config_path" --only hosting --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive

      - name: Smoke V142 production
        shell: bash
        run: |
          set -euo pipefail
          base="https://${FIREBASE_SITE_ID}.web.app"
          curl --fail --silent --show-error --location "$base/gestia-terminal.html?v142=$(date +%s)" -o /tmp/terminal.html
          test "$(wc -c < /tmp/terminal.html)" -gt 1000
          for fn in jarvisWebResearch jarvisSemanticPlan jarvisSemanticRespond; do
            url="https://us-central1-${FIREBASE_PROJECT_ID}.cloudfunctions.net/${fn}"
            code=$(curl --silent --show-error --output "/tmp/${fn}.json" --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"data":{}}' "$url" || true)
            echo "$fn HTTP=$code"
            test "$code" != "000"
            test "$code" != "404"
            test "$code" != "502"
            test "$code" != "503"
          done
          echo 'V142_RUNTIME_VERIFIED=true'

  publish-result:
    needs:
      - certify-linux
      - certify-windows
      - materialize-v142
      - deploy-v142
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish final observable status
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RESULT: ${{ needs.certify-linux.result }}
          WINDOWS_RESULT: ${{ needs.certify-windows.result }}
          MATERIALIZE_RESULT: ${{ needs.materialize-v142.result }}
          DEPLOY_RESULT: ${{ needs.deploy-v142.result }}
          PRODUCT_CHANGED: ${{ needs.certify-linux.outputs.product_changed }}
        run: |
          set -euo pipefail
          state=success
          if [ "$LINUX_RESULT" != success ] || [ "$WINDOWS_RESULT" != success ]; then state=failure; fi
          if [ "$PRODUCT_CHANGED" = true ] && [ "$MATERIALIZE_RESULT" != success ]; then state=failure; fi
          if [ "$DEPLOY_RESULT" != success ]; then state=failure; fi
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          description="linux=${LINUX_RESULT} windows=${WINDOWS_RESULT} materialize=${MATERIALIZE_RESULT} deploy=${DEPLOY_RESULT} changed=${PRODUCT_CHANGED}"
          payload=$(jq -n --arg state "$state" --arg context 'v142-mobile-web-research-recovery' --arg description "$description" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

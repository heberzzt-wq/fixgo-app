name: v142 mobile web research recovery

on:
  push:
    branches: [v94-media-v4n-negative-claims]
    paths:
      - '.github/workflows/v142-mobile-web-research-recovery.yml'
      - '.github/scripts/v142-mobile-web-research-recovery.mjs'
      - '.github/scripts/v142-final-contract-alignment.mjs'
      - '.github/scripts/v142-reel-closeout.mjs'
      - 'gestia-core/gestia-core.js'
      - 'gestia-core/jarvis/jarvis.multitool.pack.js'
      - 'gestia-core/jarvis/jarvis.multifunction.planner.js'
      - 'gestia-core/jarvis/jarvis.marketing.engine.js'
      - 'gestia-core/jarvis/jarvis.mission.orchestrator.js'
      - 'functions/jarvis-genai-provider-chain.js'
      - 'functions/jarvis-web-research.js'
      - 'functions/jarvis-semantic-planner.js'
      - 'functions/index.js'
      - 'jarvis-upload-bridge.js'
      - 'jarvis-fs-bridge.js'
      - 'tests/jarvis-mobile-web-research-recovery-v142.test.mjs'
      - 'tests/jarvis-genai-provider-chain.test.cjs'
      - 'tests/jarvis-web-research.test.cjs'
      - 'tests/jarvis-upload-bridge.test.mjs'
      - 'tests/jarvis-multifunction-tools.test.mjs'
      - 'tests/jarvis-semantic-planner.test.cjs'
      - 'tests/jarvis-source-grounded-research-v124.test.mjs'
      - 'tests/jarvis-mission-orchestrator.test.mjs'
      - 'tests/jarvis-reel-native-mp4-v138.test.mjs'
      - 'tests/jarvis-fs-bridge-v2.test.mjs'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  TARGET_BRANCH: v94-media-v4n-negative-claims
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  certify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      product_changed: ${{ steps.patch-state.outputs.product_changed }}
    steps:
      - name: Publish observable run
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'v142-mobile-web-research-recovery' --arg description "run=${GITHUB_RUN_ID} V142 reel closeout" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard branch and architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e .github/workflows/v143-jarvis-web-planner-deploy.yml
          test ! -e .github/workflows/v146-source-freshness-verification.yml
          test ! -e .github/workflows/v147-fact-freshness.yml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Apply deterministic V142 patches
        run: |
          node .github/scripts/v142-mobile-web-research-recovery.mjs
          node .github/scripts/v142-final-contract-alignment.mjs
          node .github/scripts/v142-reel-closeout.mjs

      - name: Verify syntax
        run: |
          node --check gestia-core/gestia-core.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check jarvis-upload-bridge.js
          node --check jarvis-fs-bridge.js

      - name: V142 focal contracts
        run: |
          node --test --test-concurrency=1 \
            tests/jarvis-mobile-web-research-recovery-v142.test.mjs \
            tests/jarvis-genai-provider-chain.test.cjs \
            tests/jarvis-web-research.test.cjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/jarvis-upload-bridge.test.mjs \
            tests/jarvis-source-grounded-research-v124.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-reel-native-mp4-v138.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Detect materialization state
        id: patch-state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only)
          if [ -z "$changed" ]; then
            echo 'product_changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              gestia-core/gestia-core.js|gestia-core/jarvis/jarvis.multitool.pack.js|gestia-core/jarvis/jarvis.multifunction.planner.js|gestia-core/jarvis/jarvis.marketing.engine.js|gestia-core/jarvis/jarvis.mission.orchestrator.js|functions/jarvis-genai-provider-chain.js|functions/jarvis-semantic-planner.js|functions/jarvis-web-research.js|functions/index.js|jarvis-fs-bridge.js|tests/jarvis-genai-provider-chain.test.cjs|tests/jarvis-multifunction-tools.test.mjs|tests/jarvis-semantic-planner.test.cjs|tests/jarvis-web-research.test.cjs|tests/jarvis-mobile-web-research-recovery-v142.test.mjs|tests/jarvis-source-grounded-research-v124.test.mjs|tests/jarvis-mission-orchestrator.test.mjs|tests/jarvis-reel-native-mp4-v138.test.mjs|tests/jarvis-fs-bridge-v2.test.mjs) ;;
              *) echo "Unexpected V142 diff: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          echo 'product_changed=true' >> "$GITHUB_OUTPUT"

  certify-windows:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'ROOT_NPM_CI_FAILED' }
          npm ci --prefix functions
          if ($LASTEXITCODE -ne 0) { throw 'FUNCTIONS_NPM_CI_FAILED' }
      - name: Apply deterministic V142 patches
        run: |
          node .github/scripts/v142-mobile-web-research-recovery.mjs
          node .github/scripts/v142-final-contract-alignment.mjs
          node .github/scripts/v142-reel-closeout.mjs
      - name: Windows syntax and focal contracts
        run: |
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check jarvis-fs-bridge.js
          node --test --test-concurrency=1 tests/jarvis-mobile-web-research-recovery-v142.test.mjs tests/jarvis-upload-bridge.test.mjs tests/jarvis-multifunction-tools.test.mjs tests/jarvis-mission-orchestrator.test.mjs tests/jarvis-reel-native-mp4-v138.test.mjs

  materialize-v142:
    needs: [certify-linux, certify-windows]
    if: ${{ needs.certify-linux.outputs.product_changed == 'true' && success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply certified V142 patches
        run: |
          node .github/scripts/v142-mobile-web-research-recovery.mjs
          node .github/scripts/v142-final-contract-alignment.mjs
          node .github/scripts/v142-reel-closeout.mjs
      - name: Commit certified bytes
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test -n "$changed"
          while IFS= read -r file; do
            case "$file" in
              gestia-core/gestia-core.js|gestia-core/jarvis/jarvis.multitool.pack.js|gestia-core/jarvis/jarvis.multifunction.planner.js|gestia-core/jarvis/jarvis.marketing.engine.js|gestia-core/jarvis/jarvis.mission.orchestrator.js|functions/jarvis-genai-provider-chain.js|functions/jarvis-semantic-planner.js|functions/jarvis-web-research.js|functions/index.js|jarvis-fs-bridge.js|tests/jarvis-genai-provider-chain.test.cjs|tests/jarvis-multifunction-tools.test.mjs|tests/jarvis-semantic-planner.test.cjs|tests/jarvis-web-research.test.cjs|tests/jarvis-mobile-web-research-recovery-v142.test.mjs|tests/jarvis-source-grounded-research-v124.test.mjs|tests/jarvis-mission-orchestrator.test.mjs|tests/jarvis-reel-native-mp4-v138.test.mjs|tests/jarvis-fs-bridge-v2.test.mjs) ;;
              *) echo "Unexpected certified V142 diff: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only -z | xargs -0 git add --
          git commit -m 'fix(jarvis): materialize V142 reel closeout'
          git push origin "HEAD:${TARGET_BRANCH}"

  deploy-v142:
    needs: [certify-linux, certify-windows, materialize-v142]
    if: ${{ always() && needs.certify-linux.result == 'success' && needs.certify-windows.result == 'success' && (needs.certify-linux.outputs.product_changed == 'false' || needs.materialize-v142.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
      - name: Re-certify materialized bytes
        run: |
          node .github/scripts/v142-mobile-web-research-recovery.mjs
          node .github/scripts/v142-final-contract-alignment.mjs
          node .github/scripts/v142-reel-closeout.mjs
          git diff --exit-code
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check jarvis-fs-bridge.js
          node --test --test-concurrency=1 tests/jarvis-mobile-web-research-recovery-v142.test.mjs tests/jarvis-upload-bridge.test.mjs tests/jarvis-multifunction-tools.test.mjs tests/jarvis-mission-orchestrator.test.mjs tests/jarvis-reel-native-mp4-v138.test.mjs
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy V142 Jarvis semantic Functions only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy \
            --only functions:jarvisSemanticPlan,functions:jarvisWebResearch \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive
      - name: Deploy V142 Hosting FIXGO only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          config_path="$PWD/.firebase-v142-fixgo-only.json"
          trap 'rm -f "$config_path"' EXIT
          jq --arg site "$FIREBASE_SITE_ID" '{hosting: [.hosting[] | select(.site == $site)]}' firebase.json > "$config_path"
          test "$(jq '.hosting | length' "$config_path")" = "1"
          test "$(jq -r '.hosting[0].site' "$config_path")" = "$FIREBASE_SITE_ID"
          forbidden_multi='multi''servicios'
          ! grep -Fq "$forbidden_multi" "$config_path"
          firebase deploy --config "$config_path" --only hosting --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
      - name: Smoke production
        run: curl --fail --silent --show-error --location "https://${FIREBASE_SITE_ID}.web.app/" >/dev/null
      - name: Publish green status
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state success --arg context 'v142-mobile-web-research-recovery' --arg description "run=${GITHUB_RUN_ID} V142 semantic functions + reel closeout green" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
name: v142 mobile web research recovery

on:
  push:
    branches: [v94-media-v4n-negative-claims]
    paths:
      - '.github/workflows/v142-mobile-web-research-recovery.yml'
      - '.github/scripts/v142-mobile-web-research-recovery.mjs'
      - '.github/scripts/v142-final-contract-alignment.mjs'
      - '.github/scripts/v142-reel-closeout.mjs'
      - 'gestia-core/gestia-core.js'
      - 'gestia-core/tools.bridge.js'
      - 'gestia-core/tools.runtime.js'
      - 'gestia-core/jarvis/jarvis.multitool.pack.js'
      - 'gestia-core/jarvis/jarvis.multifunction.planner.js'
      - 'gestia-core/jarvis/jarvis.marketing.engine.js'
      - 'gestia-core/jarvis/jarvis.mission.orchestrator.js'
      - 'gestia-core/jarvis/jarvis.mission.planner-state.js'
      - 'gestia-core/jarvis/jarvis.mission.dependencies.js'
      - 'gestia-core/jarvis/jarvis.reel.media-binder.js'
      - 'gestia-core/jarvis/jarvis.actuator.pack.js'
      - 'functions/jarvis-genai-provider-chain.js'
      - 'functions/jarvis-web-research.js'
      - 'functions/jarvis-semantic-planner.js'
      - 'functions/index.js'
      - 'functions/secure-entry-alias.js'
      - 'functions/jarvis-video-operation-contract.js'
      - 'jarvis-artifact-studio.js'
      - 'jarvis-upload-bridge.js'
      - 'jarvis-fs-bridge.js'
      - 'jarvis-local-video-engine.js'
      - 'scripts/jarvis-local-video-wan22.py'
      - 'jarvis-reel-artifact.js'
      - 'modules/terminal/jarvis-attachments.js'
      - 'package.json'
      - 'tests/jarvis-attachments.test.mjs'
      - 'tests/jarvis-actuator-pack.test.mjs'
      - 'tests/jarvis-local-video-engine-v142.test.mjs'
      - 'tests/jarvis-marketing-handoff-v12.test.mjs'
      - 'tests/jarvis-mobile-web-research-recovery-v142.test.mjs'
      - 'tests/jarvis-genai-provider-chain.test.cjs'
      - 'tests/jarvis-web-research.test.cjs'
      - 'tests/jarvis-upload-bridge.test.mjs'
      - 'tests/jarvis-multifunction-tools.test.mjs'
      - 'tests/jarvis-semantic-planner.test.cjs'
      - 'tests/jarvis-source-grounded-research-v124.test.mjs'
      - 'tests/jarvis-mission-orchestrator.test.mjs'
      - 'tests/jarvis-video-reference-mission-continuity-v142.test.mjs'
      - 'tests/jarvis-video-operation-contract-v142.test.cjs'
      - 'tests/jarvis-reel-native-mp4-v138.test.mjs'
      - 'tests/jarvis-reel-media-binder-v131.test.mjs'
      - 'tests/jarvis-reel-terminal-delivery-v142.test.mjs'
      - 'tests/jarvis-fs-bridge-v2.test.mjs'
      - 'tests/jarvis-series-continuity-v142.test.mjs'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy certified V142 after certification'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  statuses: write

env:
  TARGET_BRANCH: v94-media-v4n-negative-claims
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  certify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      product_changed: ${{ steps.patch-state.outputs.product_changed }}
      functions_changed: ${{ steps.patch-state.outputs.functions_changed }}
      video_function_changed: ${{ steps.patch-state.outputs.video_function_changed }}
      semantic_function_changed: ${{ steps.patch-state.outputs.semantic_function_changed }}
    steps:
      - name: Publish observable run
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'v142-mobile-web-research-recovery' --arg description "run=${GITHUB_RUN_ID} V142 audiovisual closeout" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard branch and architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e .github/workflows/v143-jarvis-web-planner-deploy.yml
          test ! -e .github/workflows/v146-source-freshness-verification.yml
          test ! -e .github/workflows/v147-fact-freshness.yml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Apply deterministic V142 patches
        run: |
          node .github/scripts/v142-mobile-web-research-recovery.mjs
          node .github/scripts/v142-final-contract-alignment.mjs
          node .github/scripts/v142-reel-closeout.mjs

      - name: Verify syntax
        run: |
          node --check gestia-core/gestia-core.js
          node --check gestia-core/tools.bridge.js
          node --check gestia-core/tools.runtime.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.mission.planner-state.js
          node --check gestia-core/jarvis/jarvis.mission.dependencies.js
          node --check gestia-core/jarvis/jarvis.reel.media-binder.js
          node --check gestia-core/jarvis/jarvis.actuator.pack.js
          node --check functions/secure-entry-alias.js
          node --check functions/jarvis-video-operation-contract.js
          node --check jarvis-upload-bridge.js
          node --check jarvis-fs-bridge.js
          node --check jarvis-local-video-engine.js
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/jarvis-local-video-wan22.py').read_text(encoding='utf-8'))"
          node --check modules/terminal/jarvis-attachments.js

      - name: Verify persistent artifact download lifecycle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('modules/terminal/jarvis-attachments.js', 'utf8');
          const required = [
            '2.5.0-artifact-download-lifecycle-v142',
            'previewObjectUrls: new Set()',
            'artifactObjectUrls: new Set()',
            'state.previewObjectUrls.forEach(url => URL.revokeObjectURL(url))',
            'state.artifactObjectUrls.add(objectUrl)',
            'persistentArtifactDownloads: true',
            'window.addEventListener("beforeunload"'
          ];
          for (const marker of required) {
            if (!source.includes(marker)) throw new Error(`V142_ARTIFACT_DOWNLOAD_LIFECYCLE_MISSING:${marker}`);
          }
          const clearStart = source.indexOf('function clear()');
          const clearEnd = source.indexOf('\n}\n\nfunction observationTool', clearStart);
          if (clearStart < 0 || clearEnd < 0) throw new Error('V142_ARTIFACT_CLEAR_BLOCK_MISSING');
          const clearSource = source.slice(clearStart, clearEnd);
          if (clearSource.includes('artifactObjectUrls')) throw new Error('V142_CLEAR_REVOKES_DELIVERED_ARTIFACTS');
          if (source.includes('state.objectUrls.add(objectUrl)')) throw new Error('V142_SHARED_OBJECT_URL_BUCKET_REGRESSION');
          NODE

      - name: V142 focal contracts
        run: |
          node --test --test-concurrency=1 \
            tests/jarvis-mobile-web-research-recovery-v142.test.mjs \
            tests/jarvis-genai-provider-chain.test.cjs \
            tests/jarvis-web-research.test.cjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/jarvis-upload-bridge.test.mjs \
            tests/jarvis-source-grounded-research-v124.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-local-video-engine-v142.test.mjs \
            tests/jarvis-video-reference-mission-continuity-v142.test.mjs \
            tests/jarvis-video-operation-contract-v142.test.cjs \
            tests/jarvis-series-continuity-v142.test.mjs \
            tests/jarvis-reel-media-binder-v131.test.mjs \
            tests/jarvis-reel-native-mp4-v138.test.mjs \
            tests/jarvis-reel-terminal-delivery-v142.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Detect materialization state
        id: patch-state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != 'push' ] || [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          committed_changed=$(git diff --name-only "$base" "$GITHUB_SHA")
          changed=$(git diff --name-only)
          if printf '%s\n%s\n' "$committed_changed" "$changed" | grep -Eq '^functions/'; then
            echo 'functions_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'functions_changed=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n%s\n' "$committed_changed" "$changed" | grep -Eq '^functions/(secure-entry-alias\.js|jarvis-video-operation-contract\.js|index\.js)$'; then
            echo 'video_function_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'video_function_changed=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n%s\n' "$committed_changed" "$changed" | grep -Eq '^functions/(jarvis-semantic-planner\.js|jarvis-genai-provider-chain\.js|index\.js)$'; then
            echo 'semantic_function_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'semantic_function_changed=false' >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$changed" ]; then
            echo 'product_changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              .github/scripts/v142-final-contract-alignment.mjs|gestia-core/gestia-core.js|gestia-core/tools.bridge.js|gestia-core/jarvis/jarvis.multitool.pack.js|gestia-core/jarvis/jarvis.multifunction.planner.js|gestia-core/jarvis/jarvis.marketing.engine.js|gestia-core/jarvis/jarvis.mission.orchestrator.js|gestia-core/jarvis/jarvis.mission.dependencies.js|gestia-core/jarvis/jarvis.reel.media-binder.js|gestia-core/jarvis/jarvis.actuator.pack.js|functions/jarvis-genai-provider-chain.js|functions/jarvis-semantic-planner.js|functions/jarvis-web-research.js|functions/index.js|functions/secure-entry-alias.js|functions/jarvis-video-operation-contract.js|jarvis-artifact-studio.js|jarvis-fs-bridge.js|jarvis-local-video-engine.js|scripts/jarvis-local-video-wan22.py|jarvis-reel-artifact.js|modules/terminal/jarvis-attachments.js|tests/jarvis-actuator-pack.test.mjs|tests/jarvis-local-video-engine-v142.test.mjs|tests/jarvis-marketing-handoff-v12.test.mjs|tests/jarvis-genai-provider-chain.test.cjs|tests/jarvis-multifunction-tools.test.mjs|tests/jarvis-semantic-planner.test.cjs|tests/jarvis-web-research.test.cjs|tests/jarvis-mobile-web-research-recovery-v142.test.mjs|tests/jarvis-source-grounded-research-v124.test.mjs|tests/jarvis-mission-orchestrator.test.mjs|tests/jarvis-video-reference-mission-continuity-v142.test.mjs|tests/jarvis-video-operation-contract-v142.test.cjs|tests/jarvis-series-continuity-v142.test.mjs|tests/jarvis-reel-media-binder-v131.test.mjs|tests/jarvis-reel-native-mp4-v138.test.mjs|tests/jarvis-reel-terminal-delivery-v142.test.mjs|tests/jarvis-fs-bridge-v2.test.mjs|package.json) ;;
              *) echo "Unexpected V142 diff: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          echo 'product_changed=true' >> "$GITHUB_OUTPUT"

  certify-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'ROOT_NPM_CI_FAILED' }
          npm ci --prefix functions
          if ($LASTEXITCODE -ne 0) { throw 'FUNCTIONS_NPM_CI_FAILED' }
      - name: Apply deterministic V142 patches
        run: |
          node .github/scripts/v142-mobile-web-research-recovery.mjs
          node .github/scripts/v142-final-contract-alignment.mjs
          node .github/scripts/v142-reel-closeout.mjs
      - name: Windows syntax contracts
        shell: pwsh
        run: |
          node --check gestia-core/tools.bridge.js
          node --check gestia-core/tools.runtime.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.mission.planner-state.js
          node --check gestia-core/jarvis/jarvis.mission.dependencies.js
          node --check gestia-core/jarvis/jarvis.reel.media-binder.js
          node --check gestia-core/jarvis/jarvis.actuator.pack.js
          node --check functions/secure-entry-alias.js
          node --check functions/jarvis-video-operation-contract.js
          node --check jarvis-artifact-studio.js
          node --check jarvis-fs-bridge.js
          node --check jarvis-local-video-engine.js
          python -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/jarvis-local-video-wan22.py').read_text(encoding='utf-8'))"
          node --check modules/terminal/jarvis-attachments.js
      - name: Windows focal - mobile web research recovery
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-mobile-web-research-recovery-v142.test.mjs
      - name: Windows focal - upload bridge
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-upload-bridge.test.mjs
      - name: Windows focal - multifunction tools
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-multifunction-tools.test.mjs
      - name: Windows focal - mission orchestrator
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-mission-orchestrator.test.mjs
      - name: Windows focal - local video engine V142
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-local-video-engine-v142.test.mjs
      - name: Windows focal - video reference continuity
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-video-reference-mission-continuity-v142.test.mjs
      - name: Windows focal - video operation contract
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-video-operation-contract-v142.test.cjs
      - name: Windows focal - series continuity
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-series-continuity-v142.test.mjs
      - name: Windows focal - reel media binder
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-reel-media-binder-v131.test.mjs
      - name: Windows focal - reel native mp4
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-reel-native-mp4-v138.test.mjs
      - name: Windows focal - reel terminal delivery
        shell: pwsh
        run: node --test --test-concurrency=1 tests/jarvis-reel-terminal-delivery-v142.test.mjs
      - name: Windows persistent artifact download lifecycle
        shell: pwsh
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('modules/terminal/jarvis-attachments.js','utf8'); const c=s.slice(s.indexOf('function clear()'),s.indexOf('function observationTool')); if(!s.includes('artifactObjectUrls: new Set()')||!s.includes('state.artifactObjectUrls.add(objectUrl)')||!s.includes('persistentArtifactDownloads: true')||c.includes('artifactObjectUrls')) throw new Error('V142_ARTIFACT_DOWNLOAD_LIFECYCLE_INVALID');"

  materialize-v142:
    needs: [certify-linux, certify-windows]
    if: ${{ needs.certify-linux.outputs.product_changed == 'true' && success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply certified V142 patches
        run: |
          node .github/scripts/v142-mobile-web-research-recovery.mjs
          node .github/scripts/v142-final-contract-alignment.mjs
          node .github/scripts/v142-reel-closeout.mjs
      - name: Commit certified bytes
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test -n "$changed"
          while IFS= read -r file; do
            case "$file" in
              .github/scripts/v142-final-contract-alignment.mjs|gestia-core/gestia-core.js|gestia-core/tools.bridge.js|gestia-core/jarvis/jarvis.multitool.pack.js|gestia-core/jarvis/jarvis.multifunction.planner.js|gestia-core/jarvis/jarvis.marketing.engine.js|gestia-core/jarvis/jarvis.mission.orchestrator.js|gestia-core/jarvis/jarvis.mission.dependencies.js|gestia-core/jarvis/jarvis.reel.media-binder.js|gestia-core/jarvis/jarvis.actuator.pack.js|functions/jarvis-genai-provider-chain.js|functions/jarvis-semantic-planner.js|functions/jarvis-web-research.js|functions/index.js|functions/secure-entry-alias.js|functions/jarvis-video-operation-contract.js|jarvis-artifact-studio.js|jarvis-fs-bridge.js|jarvis-local-video-engine.js|scripts/jarvis-local-video-wan22.py|jarvis-reel-artifact.js|modules/terminal/jarvis-attachments.js|tests/jarvis-actuator-pack.test.mjs|tests/jarvis-local-video-engine-v142.test.mjs|tests/jarvis-marketing-handoff-v12.test.mjs|tests/jarvis-genai-provider-chain.test.cjs|tests/jarvis-multifunction-tools.test.mjs|tests/jarvis-semantic-planner.test.cjs|tests/jarvis-web-research.test.cjs|tests/jarvis-mobile-web-research-recovery-v142.test.mjs|tests/jarvis-source-grounded-research-v124.test.mjs|tests/jarvis-mission-orchestrator.test.mjs|tests/jarvis-video-reference-mission-continuity-v142.test.mjs|tests/jarvis-video-operation-contract-v142.test.cjs|tests/jarvis-series-continuity-v142.test.mjs|tests/jarvis-reel-media-binder-v131.test.mjs|tests/jarvis-reel-native-mp4-v138.test.mjs|tests/jarvis-reel-terminal-delivery-v142.test.mjs|tests/jarvis-fs-bridge-v2.test.mjs|package.json) ;;
              *) echo "Unexpected certified V142 diff: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only -z | xargs -0 git add --
          git commit -m 'fix(jarvis): materialize V142 audiovisual closeout'
          git push origin "HEAD:${TARGET_BRANCH}"

  deploy-v142:
    needs: [certify-linux, certify-windows, materialize-v142]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true && always() && needs.certify-linux.result == 'success' && needs.certify-windows.result == 'success' && (needs.certify-linux.outputs.product_changed == 'false' || needs.materialize-v142.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
      - name: Re-certify materialized bytes
        run: |
          node .github/scripts/v142-mobile-web-research-recovery.mjs
          node .github/scripts/v142-final-contract-alignment.mjs
          node .github/scripts/v142-reel-closeout.mjs
          git diff --exit-code
          node --check gestia-core/tools.bridge.js
          node --check gestia-core/tools.runtime.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.mission.planner-state.js
          node --check gestia-core/jarvis/jarvis.mission.dependencies.js
          node --check gestia-core/jarvis/jarvis.reel.media-binder.js
          node --check gestia-core/jarvis/jarvis.actuator.pack.js
          node --check functions/secure-entry-alias.js
          node --check functions/jarvis-video-operation-contract.js
          node --check jarvis-artifact-studio.js
          node --check jarvis-fs-bridge.js
          node --check jarvis-local-video-engine.js
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/jarvis-local-video-wan22.py').read_text(encoding='utf-8'))"
          node --check modules/terminal/jarvis-attachments.js
          node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('modules/terminal/jarvis-attachments.js','utf8'); const c=s.slice(s.indexOf('function clear()'),s.indexOf('function observationTool')); if(!s.includes('artifactObjectUrls: new Set()')||!s.includes('state.artifactObjectUrls.add(objectUrl)')||!s.includes('persistentArtifactDownloads: true')||c.includes('artifactObjectUrls')) throw new Error('V142_ARTIFACT_DOWNLOAD_LIFECYCLE_INVALID');"
          node --test --test-concurrency=1 tests/jarvis-mobile-web-research-recovery-v142.test.mjs tests/jarvis-upload-bridge.test.mjs tests/jarvis-multifunction-tools.test.mjs tests/jarvis-mission-orchestrator.test.mjs tests/jarvis-local-video-engine-v142.test.mjs tests/jarvis-video-reference-mission-continuity-v142.test.mjs tests/jarvis-video-operation-contract-v142.test.cjs tests/jarvis-series-continuity-v142.test.mjs tests/jarvis-reel-media-binder-v131.test.mjs tests/jarvis-reel-native-mp4-v138.test.mjs tests/jarvis-reel-terminal-delivery-v142.test.mjs
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Inspect jarvisVideoGenerate production logs
        if: ${{ needs.certify-linux.outputs.video_function_changed == 'true' }}
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase functions:log --only jarvisVideoGenerate --lines 100 --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
      - name: Deploy V142 video function only
        if: ${{ needs.certify-linux.outputs.video_function_changed == 'true' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy --only functions:jarvisVideoGenerate --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
      - name: Verify V142 video function deployment
        if: ${{ needs.certify-linux.outputs.video_function_changed == 'true' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          deployed=$(firebase functions:list --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive)
          grep -F 'jarvisVideoGenerate' <<<"$deployed"
      - name: Deploy V142 semantic function only
        if: ${{ needs.certify-linux.outputs.semantic_function_changed == 'true' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy --only functions:jarvisSemanticPlan --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
      - name: Verify V142 semantic function deployment
        if: ${{ needs.certify-linux.outputs.semantic_function_changed == 'true' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          deployed=$(firebase functions:list --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive)
          grep -F 'jarvisSemanticPlan' <<<"$deployed"
      - name: Deploy V142 Hosting FIXGO only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          config_path="$PWD/.firebase-v142-fixgo-only.json"
          trap 'rm -f "$config_path"' EXIT
          jq --arg site "$FIREBASE_SITE_ID" '{hosting: [.hosting[] | select(.site == $site)]}' firebase.json > "$config_path"
          test "$(jq '.hosting | length' "$config_path")" = "1"
          test "$(jq -r '.hosting[0].site' "$config_path")" = "$FIREBASE_SITE_ID"
          forbidden_multi='multi''servicios'
          ! grep -Fq "$forbidden_multi" "$config_path"
          firebase deploy --config "$config_path" --only hosting --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
      - name: Smoke production
        run: curl --fail --silent --show-error --location "https://${FIREBASE_SITE_ID}.web.app/" >/dev/null
      - name: Publish green status
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state success --arg context 'v142-mobile-web-research-recovery' --arg description "run=${GITHUB_RUN_ID} V142 reel + mini-drama production green" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
name: v132-adjunto-hosting-only

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v132-adjunto-hosting-only.yml

permissions:
  contents: read

jobs:
  deploy-hosting-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          ! git diff --name-only a09d76c5d42117aa88630f7b0d5fee75290525b2..HEAD | grep -E '^functions/'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install Functions test dependencies without modifying source
        run: npm ci --prefix functions
      - name: Reconfirm full CI before deploy
        run: npm run ci:test
      - name: Build single-site Hosting config
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const source = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const hosting = Array.isArray(source.hosting)
            ? source.hosting.find(item => item?.site === 'fixgo-44e4d')
            : source.hosting;
          if (!hosting || hosting.site !== 'fixgo-44e4d') {
            throw new Error('ADJUNTO_HOSTING_SITE_NOT_FOUND');
          }
          const target = path.join(process.env.RUNNER_TEMP, 'firebase-adjunto-hosting.json');
          fs.writeFileSync(target, JSON.stringify({ hosting }, null, 2));
          console.log(`ADJUNTO_HOSTING_CONFIG=${target}`);
          NODE
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy ADJUNTO Hosting only
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_TOKEN:-}"
          firebase deploy \
            --config "$RUNNER_TEMP/firebase-adjunto-hosting.json" \
            --only hosting \
            --project fixgo-44e4d \
            --token "$FIREBASE_TOKEN"
      - name: Deployment marker
        run: |
          echo "V132_ADJUNTO_HOSTING_ONLY_DEPLOYED=true"
          echo "V132_FUNCTIONS_DEPLOYED=false"
          echo "V132_MULTISERVICIOS_HOSTING_DEPLOYED=false"

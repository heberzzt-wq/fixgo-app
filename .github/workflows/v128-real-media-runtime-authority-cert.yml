name: v128-real-media-runtime-authority-cert

on:
  push:
    branches:
      - v94-media-v4n-negative-claims

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions test dependencies without modifying source
        run: npm ci --prefix functions

      - name: Guard isolated branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          if git diff --name-only dbc7641c1dc6e55d94d8a4c7c4f8a85fa069abf0..HEAD | grep -E '^functions/'; then
            echo "Functions changed in v128" >&2
            exit 1
          fi
          echo "V128_FUNCTIONS_UNCHANGED=true"

      - name: Syntax focal v128
        run: |
          node --check gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          node --check modules/terminal/nexo-bootstrap.js
          node --check modules/terminal/proposal-state.js

      - name: Focal v128 tests
        run: node --test tests/nexo-real-media-runtime-guard-v128.test.mjs tests/jarvis-real-media-reel-hydration-v127.test.mjs tests/nexo-real-media-tools.test.mjs tests/nexo-web-media-bridge.test.mjs tests/jarvis-reel-artifact.test.mjs tests/jarvis-fs-bridge-v2.test.mjs tests/proposal-state.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Certification marker
        run: |
          echo "V128_REAL_MEDIA_RUNTIME_AUTHORITY_CERTIFIED=true"
          echo "V128_FUNCTIONS_UNCHANGED=true"

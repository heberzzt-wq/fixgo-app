name: V142 engineering recovery (isolated)

on:
  push:
    branches:
      - codex/v142-engineering-recovery-20261021
    paths:
      - modules/terminal/qwen-engineering-acceptance.js
      - tests/jarvis-v142-engineering-acceptance.test.mjs
      - .github/workflows/v142-engineering-recovery-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax contract
        run: node --check modules/terminal/qwen-engineering-acceptance.js
      - name: Engineering acceptance tests
        run: node --test tests/jarvis-v142-engineering-acceptance.test.mjs
      - name: Whitespace checks
        run: git diff --check HEAD^

  payout-regression-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Run canonical payout security tests against checked-out source
        run: node --test tests/hotfix-legacy.test.mjs tests/secure-financial-entry.test.mjs

  payout-firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Verify actual payout concurrency and idempotency against isolated Firestore emulator
        env:
          CI: 'true'
          GOOGLE_CLOUD_PROJECT: fixgo-b2c-rules-test
        run: >
          npx --yes firebase-tools@14.18.0 emulators:exec
          --project fixgo-b2c-rules-test --only firestore
          "node --test tests/hotfix-legacy-emulator.test.mjs"

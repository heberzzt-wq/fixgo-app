name: v133-reel-mission-fidelity-cert

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v133-reel-mission-fidelity-cert.yml
      - .github/workflows/v133-reel-mission-fidelity-apply.yml
      - .github/scripts/v133-reel-mission-fidelity.py
      - .github/workflows/v133-reel-failure-precedence-apply.yml
      - .github/scripts/v133-reel-failure-precedence.py
      - .github/workflows/v133-reel-fidelity-no-lexical-regex-apply.yml
      - .github/scripts/v133-reel-fidelity-no-lexical-regex.py
      - .github/workflows/v133-planner-version-expectation-apply.yml
      - .github/scripts/v133-planner-version-expectation.py
      - .github/workflows/v133-full-ci-diagnostic.yml
      - .github/workflows/v133-full-ci-monolithic-diagnostic.yml
      - .github/workflows/v133-adjunto-hosting-only.yml
      - gestia-core/jarvis/jarvis.multifunction.planner.js
      - gestia-core/jarvis/jarvis.mission.orchestrator.js
      - gestia-core/jarvis/jarvis.reel.presenter.js
      - tests/jarvis-reel-mission-fidelity-v133.test.mjs
      - tests/jarvis-reel-researched-media-v132.test.mjs
      - tests/jarvis-mission-failure-precedence.test.mjs
      - tests/jarvis-multifunction-tools.test.mjs
      - tests/single-semantic-authority.test.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-v133:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions test dependencies without modifying source
        run: npm ci --prefix functions

      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          ! git diff --name-only 7398d451cd1adcc9f6045e4e68a43173e507604a..HEAD | grep -E '^functions/'

      - name: Confirm v133 staging and deploy cleanup
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/scripts/v133-reel-mission-fidelity.py
          test ! -e .github/workflows/v133-reel-mission-fidelity-apply.yml
          test ! -e .github/scripts/v133-reel-failure-precedence.py
          test ! -e .github/workflows/v133-reel-failure-precedence-apply.yml
          test ! -e .github/scripts/v133-reel-fidelity-no-lexical-regex.py
          test ! -e .github/workflows/v133-reel-fidelity-no-lexical-regex-apply.yml
          test ! -e .github/scripts/v133-planner-version-expectation.py
          test ! -e .github/workflows/v133-planner-version-expectation-apply.yml
          test ! -e .github/workflows/v133-full-ci-diagnostic.yml
          test ! -e .github/workflows/v133-full-ci-monolithic-diagnostic.yml
          test ! -e .github/workflows/v133-adjunto-hosting-only.yml

      - name: Focal v133
        run: |
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.reel.presenter.js
          node --test \
            tests/single-semantic-authority.test.mjs \
            tests/jarvis-reel-mission-fidelity-v133.test.mjs \
            tests/jarvis-reel-researched-media-v132.test.mjs \
            tests/jarvis-mission-failure-precedence.test.mjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Verify post-deploy live artifacts remain exact
        shell: bash
        run: |
          set -euo pipefail
          verify_exact() {
            local url="$1"
            local local_file="$2"
            local live_file="$RUNNER_TEMP/$(basename "$local_file").postdeploy"
            curl -fsS --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$url?postdeploy=${GITHUB_SHA}" -o "$live_file"
            cmp -s "$local_file" "$live_file"
            echo "POST_DEPLOY_LIVE_EXACT $local_file $(sha256sum "$live_file" | awk '{print $1}')"
          }
          verify_exact 'https://fixgo-44e4d.web.app/gestia-terminal.html' 'gestia-terminal.html'
          verify_exact 'https://fixgo-44e4d.web.app/gestia-core/jarvis/jarvis.multifunction.planner.js' 'gestia-core/jarvis/jarvis.multifunction.planner.js'
          verify_exact 'https://fixgo-44e4d.web.app/gestia-core/jarvis/jarvis.mission.orchestrator.js' 'gestia-core/jarvis/jarvis.mission.orchestrator.js'

      - name: Reject whitespace errors
        run: git diff --check

      - name: Certification marker
        run: |
          echo "V133_REEL_MISSION_FIDELITY_CERTIFIED=true"
          echo "V133_RESEARCH_IDENTITY_FAILSAFE=true"
          echo "V133_RESEARCH_FIDELITY_SEGMENTER=true"
          echo "V133_ZERO_LEXICAL_REGEX=true"
          echo "V133_REEL_PLAN_NESTED_PAYLOAD=true"
          echo "V133_COMPLETED_REEL_PLAN_DEDUPE=true"
          echo "V133_TOP_LEVEL_FAILURE_PRECEDENCE=true"
          echo "V133_NESTED_EVIDENCE_PRESERVED=true"
          echo "V133_PLANNER_VERSION_EXPECTATION_ALIGNED=true"
          echo "V133_STAGING_CLEAN=true"
          echo "V133_DEPLOY_WORKFLOW_CLEAN=true"
          echo "V133_POST_DEPLOY_LIVE_EXACT=true"
          echo "V133_FUNCTIONS_UNCHANGED=true"

name: ChatGPT apply marketing expansion v12

on:
  push:
    branches:
      - chatgpt/jarvis-v12-marketing-handoff

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/jarvis-v12-marketing-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/chatgpt-marketing-expansion-v12-patch.mjs
      - run: |
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gestia-core/jarvis/jarvis.mission.orchestrator.js
          git commit -m "jarvis: expand declared marketing artifacts deterministically"
          git push origin HEAD:chatgpt/jarvis-v12-marketing-handoff

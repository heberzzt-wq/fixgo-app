name: ChatGPT apply marketing compat v12

on:
  push:
    branches:
      - chatgpt/jarvis-v12-marketing-handoff

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/jarvis-v12-marketing-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/chatgpt-marketing-compat-v12-patch.mjs
      - run: |
          node --check gestia-core/jarvis/jarvis.marketing.presenter.js
          node --check functions/jarvis-semantic-planner.js
          node --check gestia-core/nexo/nexo.real-media.tools.js
          git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gestia-core/jarvis/jarvis.marketing.presenter.js \
            functions/jarvis-semantic-planner.js \
            gestia-core/nexo/nexo.real-media.tools.js
          git commit -m "jarvis: align marketing semantic and artifact contracts"
          git pull --rebase origin chatgpt/jarvis-v12-marketing-handoff
          git push origin HEAD:chatgpt/jarvis-v12-marketing-handoff

name: v136 reel media source recovery apply

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/scripts/v136-reel-media-source-recovery-apply.py'
      - '.github/scripts/v136-reel-media-source-recovery-tests.py'
      - '.github/scripts/v136-planner-version-test-fix.py'
      - '.github/workflows/v136-reel-media-source-recovery-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard isolated branch and untouched Functions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          git diff --quiet HEAD^ HEAD -- functions/
      - name: Install root dependencies
        run: npm ci
      - name: Apply v136 recovery patch
        run: python .github/scripts/v136-reel-media-source-recovery-apply.py
      - name: Materialize v136 regressions
        run: python .github/scripts/v136-reel-media-source-recovery-tests.py
      - name: Align planner version contract
        run: python .github/scripts/v136-planner-version-test-fix.py
      - name: Guard product surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet HEAD -- functions/
          mapfile -t changed < <(git diff --name-only HEAD)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              gestia-core/jarvis/jarvis.mission.orchestrator.js|gestia-core/jarvis/jarvis.multifunction.planner.js|gestia-core/jarvis/jarvis.multitool.pack.js|gestia-core/gestia-core.js|gestia-terminal.html|tests/jarvis-reel-media-source-recovery-v136.test.mjs|tests/jarvis-multifunction-tools.test.mjs) ;;
              *) echo "UNEXPECTED_V136_PATH:$path" >&2; exit 1 ;;
            esac
          done
      - name: Syntax v136
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/gestia-core.js
      - name: Focal v136
        run: >-
          node --test
          tests/jarvis-reel-media-source-recovery-v136.test.mjs
          tests/jarvis-reel-real-production-v134.test.mjs
          tests/jarvis-reel-mission-fidelity-v133.test.mjs
          tests/jarvis-reel-researched-media-v132.test.mjs
          tests/jarvis-mission-orchestrator.test.mjs
          tests/jarvis-multifunction-tools.test.mjs
          tests/jarvis-semantic-planner.test.cjs
          tests/single-semantic-authority.test.mjs
      - name: Whitespace guard
        run: git diff --check
      - name: Commit and push functional v136
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gestia-core/jarvis/jarvis.mission.orchestrator.js \
            gestia-core/jarvis/jarvis.multifunction.planner.js \
            gestia-core/jarvis/jarvis.multitool.pack.js \
            gestia-core/gestia-core.js \
            gestia-terminal.html \
            tests/jarvis-reel-media-source-recovery-v136.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs
          git diff --cached --quiet && { echo 'NO_V136_FUNCTIONAL_CHANGE'; exit 1; }
          git commit -m '[v136] feat(adj): recover alternate visual sources before reel creation'
          git push origin HEAD:v94-media-v4n-negative-claims

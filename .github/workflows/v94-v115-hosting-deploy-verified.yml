name: V94 v115 certified Hosting deploy

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-v115-hosting-deploy-verified.yml

permissions:
  contents: write

concurrency:
  group: v94-v115-certified-hosting
  cancel-in-progress: false

env:
  PRODUCT_SHA: 42a99a659b7855cc6753258f04211f5a2af8477c
  SEMANTIC_BASE: e6bec05b93b8f1ad88f44d5665ee2547c468dcec
  RELEASE_TOKEN: v94-page-browser-fallback-v115-20260809
  EXPECTED_MAIN: f3fa8e1806b681e860875afd4ce8183d27864873
  EXPECTED_POLISH: 2ae85e670505c5d425a5a0334e99c45168054bb8

jobs:
  deploy-verify-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Bind deploy source to certified product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          git cat-file -e "$PRODUCT_SHA^{commit}"
          git cat-file -e "$SEMANTIC_BASE^{commit}"

          critical=(
            gestia-terminal.html
            gestia-terminal.js
            gestia-core/gestia-core.js
            gestia-core/tools.runtime.js
            gestia-core/tools.bridge.js
            gestia-core/jarvis.kernel.js
            gestia-core/hubs/repo.hub.js
            gestia-core/repo/repo.target.js
            jarvis-fs-bridge.js
            modules/terminal/repo-bootstrap-index.js
            gestia-core/jarvis/jarvis.semantic.memory.js
            gestia-core/jarvis/jarvis.mission.orchestrator.js
            gestia-core/jarvis/jarvis.multifunction.planner.js
            gestia-core/jarvis/jarvis.multitool.pack.js
            gestia-core/jarvis/jarvis.marketing.engine.js
            gestia-core/jarvis/jarvis.actuator.pack.js
            jarvis-page-artifact.js
          )
          git diff --quiet "$PRODUCT_SHA" HEAD -- "${critical[@]}"
          git diff --quiet "$SEMANTIC_BASE" HEAD -- functions

          grep -Fq "$RELEASE_TOKEN" gestia-terminal.html
          grep -Fq 'PAGE_ARTIFACT_CREATED_BROWSER_VERIFIED' gestia-core/jarvis/jarvis.actuator.pack.js
          grep -Fq 'typeof input === "string"' jarvis-fs-bridge.js
          ! grep -Fq 'window.__REPO_INDEX__["jarvis-nlu-bridge.js"]' modules/terminal/repo-bootstrap-index.js

          git fetch origin main v5.9-polish --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/v5.9-polish)" = "$EXPECTED_POLISH"
          echo "DEPLOY_SOURCE_BOUND_TO_CERTIFIED_PRODUCT=$PRODUCT_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recheck deploy gate contract
        run: node --test tests/jarvis-deploy-gate.test.mjs

      - name: Sovereign Hosting-only deploy gate
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_HOSTING_ONLY: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
        run: node scripts/jarvis-deploy-gate.mjs

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting only
        run: firebase deploy --only hosting --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Verify exact live certified bytes
        shell: bash
        run: |
          set -euo pipefail
          base='https://fixgo-44e4d.web.app'
          critical=(
            gestia-terminal.html
            gestia-terminal.js
            gestia-core/gestia-core.js
            gestia-core/tools.runtime.js
            gestia-core/tools.bridge.js
            gestia-core/jarvis.kernel.js
            gestia-core/hubs/repo.hub.js
            gestia-core/repo/repo.target.js
            jarvis-fs-bridge.js
            modules/terminal/repo-bootstrap-index.js
            gestia-core/jarvis/jarvis.semantic.memory.js
            gestia-core/jarvis/jarvis.mission.orchestrator.js
            gestia-core/jarvis/jarvis.multifunction.planner.js
            gestia-core/jarvis/jarvis.multitool.pack.js
            gestia-core/jarvis/jarvis.marketing.engine.js
            gestia-core/jarvis/jarvis.actuator.pack.js
            jarvis-page-artifact.js
          )
          for p in "${critical[@]}"; do
            git show "$PRODUCT_SHA:$p" > /tmp/expected.bin
            expected="$(sha256sum /tmp/expected.bin | awk '{print $1}')"
            curl -fsSL --retry 4 --retry-delay 2 "$base/$p?v=$PRODUCT_SHA" -o /tmp/live.bin
            live="$(sha256sum /tmp/live.bin | awk '{print $1}')"
            echo "$p expected=$expected live=$live"
            test "$expected" = "$live"
          done

          curl -fsSL "$base/gestia-terminal.html?v=$PRODUCT_SHA" | grep -Fq "$RELEASE_TOKEN"
          curl -fsSL "$base/gestia-core/jarvis/jarvis.actuator.pack.js?v=$PRODUCT_SHA" | grep -Fq 'PAGE_ARTIFACT_CREATED_BROWSER_VERIFIED'
          curl -fsSL "$base/jarvis-fs-bridge.js?v=$PRODUCT_SHA" | grep -Fq 'typeof input === "string"'
          curl -fsSL "$base/modules/terminal/repo-bootstrap-index.js?v=$PRODUCT_SHA" > /tmp/live-index.js
          ! grep -Fq 'window.__REPO_INDEX__["jarvis-nlu-bridge.js"]' /tmp/live-index.js
          echo "LIVE_CERTIFIED_V115_OK=$PRODUCT_SHA"

      - name: Recheck protected refs and Functions after deploy
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main v5.9-polish --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/v5.9-polish)" = "$EXPECTED_POLISH"
          git diff --quiet "$SEMANTIC_BASE" HEAD -- functions
          echo 'PROTECTED_REFS_AND_FUNCTIONS_STILL_CLEAN'

      - name: Cleanup temporary certification artifacts
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/v115-focused-diagnostic.txt \
            .github/workflows/v94-semantic-memory-integrity-diagnostic.yml \
            .github/workflows/v94-semantic-memory-integrity-fix.yml \
            .github/workflows/v94-semantic-memory-integrity-certify.yml \
            .github/workflows/v94-repo-intelligence-diagnostic.yml \
            .github/workflows/v94-repo-intelligence-fix.yml \
            .github/workflows/v94-full-ci-failure-extract.yml \
            .github/workflows/v94-full-ci-legacy-contract-fix.yml \
            .github/workflows/v94-page-browser-fallback-v115.yml \
            .github/workflows/v94-v115-focused-diagnostic.yml \
            .github/workflows/v94-v115-final-close.yml \
            .github/workflows/v94-v115-bridge-contract-final.yml \
            .github/workflows/v94-v115-hosting-deploy-verified.yml
          git diff --quiet "$SEMANTIC_BASE" HEAD -- functions
          if ! git diff --cached --quiet; then
            git commit -m "[v94] chore: remove temporary v115 certification artifacts"
            git push origin HEAD:v94-media-v4n-negative-claims
          fi
          echo "FINAL_BRANCH_SHA=$(git rev-parse HEAD)"

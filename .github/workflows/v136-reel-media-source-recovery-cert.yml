name: v136 reel media source recovery cert

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v136-reel-media-source-recovery-cert.yml'
      - 'gestia-core/jarvis/jarvis.mission.orchestrator.js'
      - 'gestia-core/jarvis/jarvis.multifunction.planner.js'
      - 'gestia-core/jarvis/jarvis.multitool.pack.js'
      - 'gestia-core/gestia-core.js'
      - 'gestia-core/nexo/nexo.real-media.tools.js'
      - 'jarvis-fs-bridge.js'
      - 'nexo-web-media-bridge.js'
      - 'modules/terminal/nexo-bootstrap.js'
      - 'modules/terminal/proposal-state.js'
      - 'gestia-terminal.html'
      - 'tests/jarvis-reel-media-source-recovery-v136.test.mjs'
      - 'tests/nexo-browser-media-fallback-v135.test.mjs'
      - 'tests/jarvis-reel-real-production-v134.test.mjs'
      - 'tests/jarvis-reel-mission-fidelity-v133.test.mjs'
      - 'tests/jarvis-reel-researched-media-v132.test.mjs'
      - 'tests/nexo-real-media-tools.test.mjs'
      - 'tests/nexo-web-media-bridge.test.mjs'
      - 'tests/jarvis-fs-bridge-v2.test.mjs'
      - 'tests/jarvis-multifunction-tools.test.mjs'
      - 'tests/single-semantic-authority.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-v136:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install Functions test dependencies without modifying source
        run: npm ci --prefix functions
      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          ! git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817..HEAD | grep -E '^functions/'
      - name: Focal v136 plus v135-v132 contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check jarvis-fs-bridge.js
          node --check nexo-web-media-bridge.js
          node --check gestia-core/nexo/nexo.real-media.tools.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/gestia-core.js
          node --test \
            tests/jarvis-reel-media-source-recovery-v136.test.mjs \
            tests/nexo-browser-media-fallback-v135.test.mjs \
            tests/jarvis-reel-real-production-v134.test.mjs \
            tests/jarvis-reel-mission-fidelity-v133.test.mjs \
            tests/jarvis-reel-researched-media-v132.test.mjs \
            tests/nexo-real-media-tools.test.mjs \
            tests/nexo-web-media-bridge.test.mjs \
            tests/jarvis-fs-bridge-v2.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/single-semantic-authority.test.mjs
      - name: Full CI
        run: npm run ci:test
      - name: Reject whitespace errors
        run: git diff --check
      - name: Certification marker
        run: |
          echo 'V136_REEL_MEDIA_SOURCE_RECOVERY=true'
          echo 'V136_FAILED_TEXT_SOURCE_DOES_NOT_RENDER=true'
          echo 'V136_ALTERNATE_VERIFIED_SOURCE_RECOVERY=true'
          echo 'V136_RECOVERY_EXHAUSTION_FAILS_CLOSED=true'
          echo 'V135_EXACT_TIKTOK_PRIMARY_MEDIA_PROVEN=true'
          echo 'V136_FUNCTIONS_UNCHANGED=true'

name: v136 reel media source recovery cert

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v136-reel-media-source-recovery-cert.yml'
      - 'gestia-core/jarvis/jarvis.mission.orchestrator.js'
      - 'gestia-core/jarvis/jarvis.multifunction.planner.js'
      - 'gestia-core/jarvis/jarvis.multitool.pack.js'
      - 'gestia-core/gestia-core.js'
      - 'gestia-core/nexo/nexo.real-media.tools.js'
      - 'jarvis-fs-bridge.js'
      - 'nexo-web-media-bridge.js'
      - 'modules/terminal/nexo-bootstrap.js'
      - 'modules/terminal/proposal-state.js'
      - 'gestia-terminal.html'
      - 'tests/jarvis-reel-media-source-recovery-v136.test.mjs'
      - 'tests/nexo-browser-media-fallback-v135.test.mjs'
      - 'tests/jarvis-reel-real-production-v134.test.mjs'
      - 'tests/jarvis-reel-mission-fidelity-v133.test.mjs'
      - 'tests/jarvis-reel-researched-media-v132.test.mjs'
      - 'tests/nexo-real-media-tools.test.mjs'
      - 'tests/nexo-web-media-bridge.test.mjs'
      - 'tests/jarvis-fs-bridge-v2.test.mjs'
      - 'tests/jarvis-repo-target-runtime.test.mjs'
      - 'tests/jarvis-marketing-real-delivery.test.mjs'
      - 'tests/jarvis-marketing-terminal-delivery.e2e.test.mjs'
      - 'tests/jarvis-multifunction-tools.test.mjs'
      - 'tests/single-semantic-authority.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-v136:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install Functions test dependencies without modifying source
        run: npm ci --prefix functions
      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          ! git diff --name-only ffb83de3360b64a07655fb8d01bb26caae8998e4..HEAD | grep -E '^functions/'
      - name: Guard clean v134-v136 staging
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            .github/workflows/v134-tiktok-media-diagnostic.yml
            .github/scripts/v135-bridge-version-test-fix.py
            .github/scripts/v135-browser-network-media-apply.py
            .github/scripts/v135-browser-network-media-tests.py
            .github/scripts/v135-cdp-patcher-anchor-fix.py
            .github/scripts/v135-cdp-response-body-apply.py
            .github/scripts/v135-cdp-response-body-tests.py
            .github/scripts/v135-ddg-handle-proof.mjs
            .github/scripts/v135-ddg-image-search-probe.mjs
            .github/scripts/v135-network-scene-fixture-fix.py
            .github/scripts/v135-web-media-search-probe.mjs
            .github/workflows/v135-browser-network-media-apply.yml
            .github/workflows/v135-cdp-response-body-apply.yml
            .github/workflows/v135-uber-browser-network-diagnostic.yml
            .github/workflows/v135-web-media-search-probe.yml
            .github/scripts/v136-marketing-media-fixture-align.py
            .github/scripts/v136-planner-version-test-fix.py
            .github/scripts/v136-reel-media-source-recovery-apply.py
            .github/scripts/v136-reel-media-source-recovery-tests.py
            .github/scripts/v136-slash-branch-resolver-fix.py
            .github/workflows/v136-reel-media-recovery-discovery.yml
            .github/workflows/v136-reel-media-source-recovery-apply.yml
            .github/workflows/v136-marketing-media-fixture-align.yml
            .github/workflows/v136-full-ci-failure-diagnostic.yml
            .github/workflows/v136-compatibility-close.yml
          )
          for path in "${forbidden[@]}"; do
            test ! -e "$path" || { echo "TEMPORARY_STAGING_PRESENT:$path" >&2; exit 1; }
          done
          echo 'V136_STAGING_CLEAN=true'
      - name: Focal v136 plus v135-v132 and compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check jarvis-fs-bridge.js
          node --check nexo-web-media-bridge.js
          node --check gestia-core/nexo/nexo.real-media.tools.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/gestia-core.js
          node --test \
            tests/jarvis-reel-media-source-recovery-v136.test.mjs \
            tests/nexo-browser-media-fallback-v135.test.mjs \
            tests/jarvis-reel-real-production-v134.test.mjs \
            tests/jarvis-reel-mission-fidelity-v133.test.mjs \
            tests/jarvis-reel-researched-media-v132.test.mjs \
            tests/nexo-real-media-tools.test.mjs \
            tests/nexo-web-media-bridge.test.mjs \
            tests/jarvis-fs-bridge-v2.test.mjs \
            tests/jarvis-repo-target-runtime.test.mjs \
            tests/jarvis-marketing-real-delivery.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/single-semantic-authority.test.mjs
      - name: Full CI
        run: npm run ci:test
      - name: Reject whitespace errors
        run: git diff --check
      - name: Certification marker
        run: |
          echo 'V136_REEL_MEDIA_SOURCE_RECOVERY=true'
          echo 'V136_FAILED_TEXT_SOURCE_DOES_NOT_RENDER=true'
          echo 'V136_ALTERNATE_VERIFIED_SOURCE_RECOVERY=true'
          echo 'V136_RECOVERY_EXHAUSTION_FAILS_CLOSED=true'
          echo 'V135_EXACT_TIKTOK_PRIMARY_MEDIA_PROVEN=true'
          echo 'V136_SLASH_BRANCH_REMOTE_REF_RESOLUTION=true'
          echo 'V136_MARKETING_FIXTURES_REQUIRE_REAL_VISUALS=true'
          echo 'V136_STAGING_CLEAN=true'
          echo 'V136_FUNCTIONS_UNCHANGED=true'

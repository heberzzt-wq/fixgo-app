name: v139 legacy external reel (manual paid opt-in)

# Historical provider compatibility; never certifies the local Ollama architecture.
on:
  workflow_dispatch:
    inputs:
      authorize_paid_external_reel:
        description: 'Explicitly authorize Google/Vertex and Runpod usage and possible charges'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  real-reel-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_paid_external_reel == true }}
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install functions dependencies
        run: npm ci --prefix functions
      - name: Guard branch and Functions unchanged
        shell: pwsh
        run: |
          node .github/scripts/v139-functions-guard.mjs
          if ($LASTEXITCODE -ne 0) { throw 'V139_FUNCTIONS_GUARD_FAILED' }
      - name: Start bridge and run canonical real-reel mission in same step
        shell: pwsh
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GCLOUD_PROJECT: fixgo-44e4d
          GOOGLE_CLOUD_PROJECT: fixgo-44e4d
        run: |
          if (-not $env:FIREBASE_TOKEN) { throw 'V139_FIREBASE_TOKEN_REQUIRED_FOR_VERTEX_ADC' }
          $adcPath = Join-Path $env:RUNNER_TEMP 'v139-firebase-adc.json'
          @{
            type = 'authorized_user'
            client_id = '563584335869-fgrhgmd47bqnekij5i8b5pr03ho849e6.apps.googleusercontent.com'
            client_secret = 'j9iVZfS8kkCEFUPaAeJV0sAi'
            refresh_token = $env:FIREBASE_TOKEN
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $adcPath -Encoding utf8NoBOM
          $env:GOOGLE_APPLICATION_CREDENTIALS = $adcPath
          $env:GEMINI_KEY = ''
          $env:GEMINI_API_KEY = ''
          $stdout = Join-Path $env:RUNNER_TEMP 'v139-bridge.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'v139-bridge.stderr.log'
          $process = Start-Process -FilePath node -ArgumentList 'jarvis-fs-bridge.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              $probe = Test-NetConnection -ComputerName 127.0.0.1 -Port 3344 -WarningAction SilentlyContinue
              if ($probe.TcpTestSucceeded) { $ready = $true; break }
              if ($process.HasExited) { break }
            }
            if (-not $ready) {
              Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
              throw 'V139_LOCAL_BRIDGE_NOT_READY'
            }
            Write-Host "V139_BRIDGE_PID=$($process.Id)"
            & node '.github/scripts/v139-canonical-real-reel.mjs'
            if ($LASTEXITCODE -ne 0) { throw "V139_CANONICAL_MISSION_FAILED:$LASTEXITCODE" }
          }
          finally {
            $env:GOOGLE_APPLICATION_CREDENTIALS = ''
            $env:FIREBASE_TOKEN = ''
            Remove-Item -LiteralPath $adcPath -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue | Select-Object -Last 120
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue | Select-Object -Last 120
          }
      - name: Windows certification marker
        run: |
          echo V139_CANONICAL_REAL_REEL_E2E_GREEN=true

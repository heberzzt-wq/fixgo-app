name: V94 media final grounding v4j

on:
  push:
    branches:
      - v94-handoff-ee6d8cfe
    paths:
      - .github/workflows/v94-media-final-grounding-v4j.yml

permissions:
  contents: write

jobs:
  repair-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout isolated V94 handoff
        uses: actions/checkout@v4
        with:
          ref: v94-handoff-ee6d8cfe
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Apply final raw grounding repair v3
        run: python3 .github/scripts/v94-media-final-grounding-v4j3.py

      - name: Diff integrity
        run: |
          git diff --check
          git status --short

      - name: Focused syntax and regressions
        run: |
          node --check functions/jarvis-media-analysis.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --test tests/jarvis-media-analysis.test.cjs tests/v94-media-browser-precision-contract.test.mjs tests/jarvis-conversation-composer.test.mjs tests/jarvis-mission-orchestrator.test.mjs
          npm run check:nexo:contracts

      - name: Full CI
        run: npm run ci:test

      - name: Commit certified v4j repair
        run: |
          git config user.name "OpenAI V94 Handoff"
          git config user.email "actions@users.noreply.github.com"
          git add functions/jarvis-media-analysis.js gestia-core/jarvis/jarvis.multitool.pack.js tests/jarvis-media-analysis.test.cjs tests/v94-media-browser-precision-contract.test.mjs
          git diff --cached --quiet && { echo "Expected v4j repair produced no source diff"; exit 1; }
          git commit -m "[v94-media-v4j] fix(jarvis): ground raw visual narrative before audit"
          git push origin HEAD:v94-handoff-ee6d8cfe
          echo "PATCH_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.10.1

      - name: Deploy media function and primary Hosting only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          test -n "$FIREBASE_TOKEN"
          firebase deploy --only functions:jarvisMediaAnalyze,hosting --project fixgo-44e4d --token "$FIREBASE_TOKEN" --non-interactive
          echo "V94_MEDIA_FINAL_GROUNDING_DEPLOYED=${PATCH_HEAD}"

      - name: Verify deployed branch head
        run: |
          git fetch origin v94-handoff-ee6d8cfe
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/v94-handoff-ee6d8cfe)"
          grep -q 'strictVisualOnly: strictVisualOnlyRequested(question)' functions/jarvis-media-analysis.js
          grep -q 'mediaNarrativeContractIsValid' gestia-core/jarvis/jarvis.multitool.pack.js

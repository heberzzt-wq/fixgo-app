name: V94 V123 Hosting-only release

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-v123-hosting-release.yml

permissions:
  contents: read

concurrency:
  group: v94-v123-hosting-release
  cancel-in-progress: false

env:
  PRODUCT_SHA: 5f2748fb5a2e2fb81289de76a694bac48288cb65
  V122_SHA: 232db70629e7cc35b1b306329f2157a3c0c57534
  MAIN_SHA: f3fa8e1806b681e860875afd4ce8183d27864873
  POLISH_SHA: 2ae85e670505c5d425a5a0334e99c45168054bb8
  RELEASE_ID: v94-page-evidence-failclosed-v123-20260810

jobs:
  certify-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout trigger commit for guards
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard certified lineage and protected refs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD
          changed="$(git diff --name-only "$PRODUCT_SHA" HEAD)"
          test -n "$changed"
          unexpected="$(node -e '
            const allowed = ".github/workflows/v94-v123-hosting-release.yml";
            const changed = process.argv[1].split(/\r?\n/).filter(Boolean);
            process.stdout.write(changed.filter(x => x !== allowed).join("\n"));
          ' "$changed")"
          if test -n "$unexpected"; then
            echo "Unexpected files after certified product SHA:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          echo "CERTIFIED_PRODUCT_IS_ANCESTOR=true"
          echo "POST_PRODUCT_CHANGES_RELEASE_WORKFLOW_ONLY=true"
          echo "PROTECTED_REFS_OK=true"

      - name: Checkout exact certified v123 product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Prove Functions source unchanged from v122
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$V122_SHA" "$PRODUCT_SHA" -- functions/)"
          echo "FUNCTIONS_UNCHANGED_FROM_V122=true"

      - name: Verify v123 source invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -f gestia-terminal.html
          test -f jarvis-page-artifact.js
          grep -Fq '"branch": "v94-media-v4n-negative-claims"' jarvis-runtime-contract.json
          grep -Fq '"releaseId": "v94-page-evidence-failclosed-v123-20260810"' jarvis-runtime-contract.json
          grep -Fq '2.40.0-page-evidence-failclosed-v123' jarvis-fs-bridge.js
          grep -Fq 'pageResearchIdentityState' gestia-core/jarvis/jarvis.multitool.pack.js
          grep -Fq 'PAGE_FACTUAL_INTEGRITY_LIMITED_EVIDENCE' gestia-core/jarvis/jarvis.multitool.pack.js
          grep -Fq 'evidenceMode === "insufficient"' gestia-core/gestia-core.js
          grep -Fq 'buildInsufficientEvidencePageHtml' jarvis-page-artifact.js
          grep -Fq '"@type": "WebPage"' jarvis-page-artifact.js
          grep -Fq 'text(input?.evidenceMode).toLowerCase() === "insufficient"' jarvis-page-artifact.js
          grep -Fq 'tool_contract_dependency' gestia-core/jarvis/jarvis.mission.dependencies.js
          grep -Fq 'registerNexoWebMediaRoutes' jarvis-fs-bridge.js
          if grep -Fq 'registerNexoWebMediaRoutes' jarvis-upload-bridge.js; then
            echo "Duplicate web-media route authority detected" >&2
            exit 1
          fi
          echo "V123_SOURCE_INVARIANTS_OK=true"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application test dependencies
        run: npm ci

      - name: Install Functions dependencies for tests only
        run: npm --prefix functions ci --ignore-scripts

      - name: Focused v123 regressions
        run: >-
          node --test
          tests/jarvis-page-insufficient-evidence-v123.test.mjs
          tests/jarvis-page-artifact.test.mjs
          tests/jarvis-page-factual-integrity-v121.test.mjs
          tests/jarvis-generalist-execution-contract-v122.test.mjs
          tests/jarvis-current-turn-freshness-v119.test.mjs
          tests/jarvis-fs-bridge-v2.test.mjs
          tests/jarvis-semantic-memory-integrity.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Sovereign hosting-only deploy gate
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_HOSTING_ONLY: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
        run: node scripts/jarvis-deploy-gate.mjs

      - name: Build workspace-anchored Functions-free Firebase config
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const workspace = path.resolve(process.env.GITHUB_WORKSPACE);
          const source = JSON.parse(fs.readFileSync(path.join(workspace, 'firebase.json'), 'utf8'));
          const entries = Array.isArray(source.hosting) ? source.hosting : [source.hosting];
          const primarySource = entries.find(item => item && item.site === 'fixgo-44e4d');
          if (!primarySource) throw new Error('PRIMARY_HOSTING_SITE_CONFIG_NOT_FOUND');
          const primary = structuredClone(primarySource);
          primary.ignore = [...new Set([...(primary.ignore || []), 'firebase-v123-hosting.json'])];
          const output = { hosting: [primary] };
          const target = path.join(workspace, 'firebase-v123-hosting.json');
          fs.writeFileSync(target, `${JSON.stringify(output, null, 2)}\n`, 'utf8');
          const verify = JSON.parse(fs.readFileSync(target, 'utf8'));
          if ('functions' in verify) throw new Error('FUNCTIONS_PRESENT_IN_DEPLOY_CONFIG');
          if (!Array.isArray(verify.hosting) || verify.hosting.length !== 1) throw new Error('HOSTING_SCOPE_NOT_SINGLE_SITE');
          if (verify.hosting[0].site !== 'fixgo-44e4d') throw new Error('WRONG_HOSTING_SITE');
          const resolvedPublic = path.resolve(path.dirname(target), verify.hosting[0].public);
          if (resolvedPublic !== workspace) throw new Error(`PUBLIC_ROOT_NOT_WORKSPACE:${resolvedPublic}`);
          for (const required of [
            'gestia-terminal.html',
            'jarvis-runtime-contract.json',
            'gestia-core/gestia-core.js',
            'gestia-core/jarvis/jarvis.multitool.pack.js',
            'jarvis-page-artifact.js'
          ]) {
            if (!fs.existsSync(path.join(resolvedPublic, required))) {
              throw new Error(`HOSTING_REQUIRED_FILE_MISSING:${required}`);
            }
          }
          console.log(`HOSTING_CONFIG=${target}`);
          console.log(`RESOLVED_PUBLIC_ROOT=${resolvedPublic}`);
          console.log('PUBLIC_ROOT_IS_GITHUB_WORKSPACE=true');
          console.log('FUNCTIONS_ABSENT_FROM_DEPLOY_CONFIG=true');
          console.log('PRIMARY_HOSTING_ONLY=true');
          NODE

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy primary Firebase Hosting only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_TOKEN:-}"
          test "$(pwd -P)" = "$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          test -f "$GITHUB_WORKSPACE/gestia-terminal.html"
          test -f "$GITHUB_WORKSPACE/firebase-v123-hosting.json"
          firebase deploy \
            --only hosting \
            --config "$GITHUB_WORKSPACE/firebase-v123-hosting.json" \
            --project fixgo-44e4d \
            --token "$FIREBASE_TOKEN" \
            --non-interactive \
            2>&1 | tee "$RUNNER_TEMP/v123-hosting-deploy.log"
          test "${PIPESTATUS[0]}" -eq 0
          echo "HOSTING_ONLY_DEPLOY_COMPLETE=true"

      - name: Verify exact live bytes on both Firebase domains
        shell: bash
        run: |
          set -euo pipefail
          files=(
            gestia-terminal.html
            gestia-core/gestia-core.js
            gestia-core/tools.runtime.js
            gestia-core/jarvis/jarvis.mission.planner-state.js
            gestia-core/jarvis/jarvis.mission.dependencies.js
            gestia-core/jarvis/jarvis.multitool.pack.js
            gestia-core/jarvis/jarvis.actuator.pack.js
            gestia-core/nexo/nexo.real-media.tools.js
            modules/terminal/nexo-bootstrap.js
            modules/terminal/proposal-state.js
            jarvis-runtime-contract.json
            jarvis-fs-bridge.js
            jarvis-upload-bridge.js
            jarvis-page-artifact.js
          )
          bases=(
            https://fixgo-44e4d.web.app
            https://fixgo-44e4d.firebaseapp.com
          )
          mkdir -p "$RUNNER_TEMP/live-v123"
          count=0
          verify_one() {
            local base="$1"
            local file="$2"
            local out="$RUNNER_TEMP/live-v123/${count}.bin"
            for attempt in $(seq 1 30); do
              if curl -fsSL --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, must-revalidate' \
                -H 'Pragma: no-cache' \
                "$base/$file" -o "$out" && cmp -s "$file" "$out"; then
                echo "LIVE_EXACT $base/$file"
                return 0
              fi
              sleep 2
            done
            echo "LIVE_BYTE_MISMATCH $base/$file" >&2
            if test -f "$out"; then
              echo "LOCAL_SHA256=$(sha256sum "$file" | awk '{print $1}')" >&2
              echo "LIVE_SHA256=$(sha256sum "$out" | awk '{print $1}')" >&2
            fi
            return 1
          }
          for base in "${bases[@]}"; do
            for file in "${files[@]}"; do
              count=$((count + 1))
              verify_one "$base" "$file"
            done
          done
          test "$count" -eq 28
          echo "LIVE_EXACT_CHECKS=28"
          echo "BOTH_FIREBASE_DOMAINS_EXACT=true"

      - name: Verify live v123 semantic invariants
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const bases = [
            'https://fixgo-44e4d.web.app',
            'https://fixgo-44e4d.firebaseapp.com'
          ];
          const headers = {
            'cache-control': 'no-cache, no-store, must-revalidate',
            pragma: 'no-cache'
          };
          async function text(base, file) {
            const response = await fetch(`${base}/${file}`, { headers });
            if (!response.ok) throw new Error(`${base}/${file}:HTTP_${response.status}`);
            return await response.text();
          }
          for (const base of bases) {
            const contract = JSON.parse(await text(base, 'jarvis-runtime-contract.json'));
            if (contract.branch !== 'v94-media-v4n-negative-claims') {
              throw new Error(`${base}:WRONG_BRANCH:${contract.branch}`);
            }
            if (contract.releaseId !== 'v94-page-evidence-failclosed-v123-20260810') {
              throw new Error(`${base}:WRONG_RELEASE:${contract.releaseId}`);
            }
            const fsBridge = await text(base, 'jarvis-fs-bridge.js');
            if (!fsBridge.includes('2.40.0-page-evidence-failclosed-v123')) {
              throw new Error(`${base}:FS_BRIDGE_VERSION_MISSING`);
            }
            const pack = await text(base, 'gestia-core/jarvis/jarvis.multitool.pack.js');
            for (const marker of ['pageResearchIdentityState', 'PAGE_FACTUAL_INTEGRITY_LIMITED_EVIDENCE']) {
              if (!pack.includes(marker)) throw new Error(`${base}:PACK_MARKER_MISSING:${marker}`);
            }
            const page = await text(base, 'jarvis-page-artifact.js');
            for (const marker of [
              'buildInsufficientEvidencePageHtml',
              '"@type": "WebPage"',
              'Información pendiente de verificación',
              'text(input?.evidenceMode).toLowerCase() === "insufficient"'
            ]) {
              if (!page.includes(marker)) throw new Error(`${base}:PAGE_MARKER_MISSING:${marker}`);
            }
            const deps = await text(base, 'gestia-core/jarvis/jarvis.mission.dependencies.js');
            if (!deps.includes('tool_contract_dependency')) {
              throw new Error(`${base}:EVIDENCE_ORDERING_MARKER_MISSING`);
            }
            console.log(`LIVE_V123_SEMANTIC_OK ${base}`);
          }
          console.log('LIVE_V123_SEMANTIC_INVARIANTS_OK=true');
          NODE

      - name: Final protected refs and no-Functions-deploy proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          test -z "$(git diff --name-only "$V122_SHA" "$PRODUCT_SHA" -- functions/)"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const target = path.join(process.env.GITHUB_WORKSPACE, 'firebase-v123-hosting.json');
          const cfg = JSON.parse(fs.readFileSync(target, 'utf8'));
          if ('functions' in cfg) throw new Error('FUNCTIONS_CONFIG_PRESENT_AFTER_DEPLOY');
          if (cfg.hosting?.length !== 1 || cfg.hosting[0]?.site !== 'fixgo-44e4d') {
            throw new Error('HOSTING_SCOPE_CHANGED');
          }
          console.log('FINAL_FUNCTIONS_NOT_IN_DEPLOY_SCOPE=true');
          NODE
          echo "FINAL_PROTECTED_REFS_OK=true"
          echo "V123_HOSTING_RELEASE_CERTIFIED=true"

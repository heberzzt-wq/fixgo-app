name: contract-audit production-chain runtime

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/contract-audit-production-chain-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 8de46c00565b041b006f6a33d81ff6c22a616846
  HANDOFF_PATCH_SHA256: 0b357d2cb607276cf9ec9b65a66a23caf05379cdaaab22972bc9764f9407a98a
  CERTIFIED_CARRIER_SHA: cebe6f399d4edf4f234e584e0a42cf980b3a404d
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  certify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact certified Hosting candidate
        shell: bash
        run: |
          set -euo pipefail
          git show "${CERTIFIED_CARRIER_SHA}:.github/workflows/contract-audit-provider-outage-v3.yml" > /tmp/certified.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/certified.yml').read_text()
          def extract(a,b,o):
              s=text.index(f'      - name: {a}\n')
              rs=text.index('        run: |\n',s)+len('        run: |\n')
              e=text.index(f'\n      - name: {b}\n',rs)
              lines=[]
              for line in text[rs:e].splitlines():
                  if line.startswith('          '): lines.append(line[10:])
                  elif not line.strip(): lines.append('')
                  else: raise SystemExit(f'INDENT:{a}:{line!r}')
              Path(o).write_text('\n'.join(lines)+'\n')
          extract('Restore previously certified invariants','Harden existing planner and fail-closed presentation','/tmp/restore.sh')
          extract('Harden existing planner and fail-closed presentation','Contract and authority assertions','/tmp/harden.sh')
          PY
          mkdir -p /tmp/contract-audit
          for part in chunk-00.txt chunk-01.txt chunk-02.txt segment-05.txt segment-06.txt segment-07.txt chunk-04.txt; do
            git show "${CERTIFIED_CARRIER_SHA}:.github/candidates/contract-audit/${part}" >> /tmp/contract-audit/handoff.patch.gz.b64
          done
          base64 -d /tmp/contract-audit/handoff.patch.gz.b64 | gzip -d > /tmp/contract-audit/handoff.patch
          echo "$HANDOFF_PATCH_SHA256  /tmp/contract-audit/handoff.patch" | sha256sum -c -
          git checkout --detach "$BASE_SHA"
          git apply --check /tmp/contract-audit/handoff.patch
          git apply /tmp/contract-audit/handoff.patch
          bash /tmp/restore.sh
          bash /tmp/harden.sh
          echo 'CERTIFIED_BASE_RECONSTRUCTED=true'

      - name: Preserve the same semantic plan through mission-contract audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('gestia-core/gestia-core.js')
          core = core_path.read_text()
          old_import = '''import {
              buildJarvisMultifunctionToolCalls,
              completeJarvisPlanningArguments
          } from '/gestia-core/jarvis/jarvis.multifunction.planner.js?v=v136-reel-media-source-recovery-20260812';'''
          new_import = '''import {
              buildJarvisMultifunctionToolCalls,
              completeJarvisPlanningArguments,
              mergeJarvisToolCalls
          } from '/gestia-core/jarvis/jarvis.multifunction.planner.js?v=v136-reel-media-source-recovery-20260812';'''
          if old_import not in core:
              raise SystemExit('PLANNER_IMPORT_ANCHOR_NOT_FOUND')
          core = core.replace(old_import, new_import, 1)

          anchor = '''    if (conversationalPlan.requiresFinalConversation) {
              missionContractToolCalls =
                  mergeEvidenceGroundedToolCalls(
                      missionContractToolCalls,
                      operationalInitialToolCalls
                  );
          }
          missionContractToolCalls =
              ensureExecutableArtifactDependencies({'''
          replacement = '''    missionContractToolCalls =
              mergeJarvisToolCalls(
                  missionContractToolCalls,
                  operationalInitialToolCalls
              );
          if (conversationalPlan.requiresFinalConversation) {
              missionContractToolCalls =
                  mergeEvidenceGroundedToolCalls(
                      missionContractToolCalls,
                      operationalInitialToolCalls
                  );
          }
          missionContractToolCalls =
              ensureExecutableArtifactDependencies({'''
          if anchor not in core:
              raise SystemExit('MISSION_CONTRACT_MERGE_ANCHOR_NOT_FOUND')
          core_path.write_text(core.replace(anchor, replacement, 1))

          planner_path = Path('gestia-core/jarvis/jarvis.multifunction.planner.js')
          planner = planner_path.read_text()
          browser_anchor = '''        "No autorices escrituras de repositorio, publicacion ni despliegue. Las herramientas userArtifact pueden crear entregables locales y editar copias de artefactos existentes cuando el usuario lo pide explicitamente; deben conservar el original y no equivalen a editar codigo, publicar o desplegar. Para editar PDF, XLSX o imagen usa respectivamente document.pdf.edit, document.xlsx.edit o image.edit y nunca los sustituyas por herramientas de creacion. Si una persona, producto u objeto debe conservarse desde una imagen adjunta, selecciona image.edit y copia el artifact real del manifiesto en sourceOutput; no uses image.generate ni una descripcion de media.analyze como reemplazo de la fuente visual. Si hay adjuntos reales y la orden pide analizarlos, describirlos, compararlos, identificarlos o leerlos, selecciona media.analyze; nunca sustituyas ese objetivo por image.generate o image.edit salvo que la orden tambien pida explicitamente crear, generar, editar, modificar o transformar una imagen. Conserva todas las intenciones independientes y usa herramientas especializadas para entregables operativos.",
              "agent.delegate no es una optimizacion automatica.'''
          browser_replacement = '''        "No autorices escrituras de repositorio, publicacion ni despliegue. Las herramientas userArtifact pueden crear entregables locales y editar copias de artefactos existentes cuando el usuario lo pide explicitamente; deben conservar el original y no equivalen a editar codigo, publicar o desplegar. Para editar PDF, XLSX o imagen usa respectivamente document.pdf.edit, document.xlsx.edit o image.edit y nunca los sustituyas por herramientas de creacion. Si una persona, producto u objeto debe conservarse desde una imagen adjunta, selecciona image.edit y copia el artifact real del manifiesto en sourceOutput; no uses image.generate ni una descripcion de media.analyze como reemplazo de la fuente visual. Si hay adjuntos reales y la orden pide analizarlos, describirlos, compararlos, identificarlos o leerlos, selecciona media.analyze; nunca sustituyas ese objetivo por image.generate o image.edit salvo que la orden tambien pida explicitamente crear, generar, editar, modificar o transformar una imagen. Conserva todas las intenciones independientes y usa herramientas especializadas para entregables operativos.",
              "MARKETING: marketing.plan produce estrategia y brief, nunca cuenta como archivo producido. Si el usuario pide ejecutar, producir, entregar piezas reales o una misión de punta a punta, conserva ese objetivo con productionRequested=true, productionArtifacts y toda la cadena real de herramientas necesaria. Para una producción real de reel o video declara reel.create como artefacto de producción y conserva reel.plan, speech.synthesize cuando haya narración solicitada y medios reales cuando la instrucción los exija. Si sólo pide plan o asesoría usa productionRequested=false.",
              "MARKETING FACTS-ONLY: cuando el usuario exija hechos exclusivamente verificados, establece factsOnly=true y omite atributos comerciales no sustentados en vez de convertirlos en propuestas.",
              "agent.delegate no es una optimizacion automatica.'''
          if browser_anchor not in planner:
              raise SystemExit('CURRENT_TURN_MARKETING_RULE_ANCHOR_NOT_FOUND')
          planner_path.write_text(planner.replace(browser_anchor, browser_replacement, 1))
          PY

          cat > tests/jarvis-mission-contract-preserves-initial-production.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { mergeJarvisToolCalls } from '../gestia-core/jarvis/jarvis.multifunction.planner.js';
          import { ensureExecutableArtifactDependencies } from '../gestia-core/jarvis/jarvis.mission.dependencies.js';

          const catalog = [
            'web.research',
            'web.media.collect',
            'marketing.plan',
            'reel.plan',
            'speech.synthesize',
            'reel.create'
          ].map(name => ({ name }));

          test('MISSION_CONTRACT audit cannot erase an already selected production chain', () => {
            const initial = [
              { name: 'web.research', args: { researchGoal: 'RESEARCH_1' } },
              { name: 'web.media.collect', args: { url: 'https://www.tiktok.com/@taqueria.eldorado/video/7629216747131850004', requireVideos: true } },
              { name: 'marketing.plan', args: { factsOnly: true, productionRequested: true, productionArtifacts: [{ type: 'reel', toolName: 'reel.create', label: 'Reel final' }] } },
              { name: 'reel.plan', args: {} },
              { name: 'speech.synthesize', args: {} },
              { name: 'reel.create', args: {} }
            ];
            const truncatedAudit = [
              { name: 'web.research', args: { researchGoal: 'RESEARCH_1' } },
              { name: 'web.media.collect', args: { url: 'https://www.tiktok.com/@taqueria.eldorado/video/7629216747131850004', requireVideos: true } },
              { name: 'marketing.plan', args: { factsOnly: true } }
            ];
            const merged = mergeJarvisToolCalls(truncatedAudit, initial);
            const expanded = ensureExecutableArtifactDependencies({ toolCalls: merged, catalog });
            const names = new Set(expanded.map(call => call.name));
            for (const name of catalog.map(item => item.name)) assert.equal(names.has(name), true, `missing ${name}`);
          });

          test('GestiaCore structurally preserves initial semantic tool calls before dependency closure', () => {
            const core = fs.readFileSync(new URL('../gestia-core/gestia-core.js', import.meta.url), 'utf8');
            assert.match(core, /mergeJarvisToolCalls\(\s*missionContractToolCalls,\s*operationalInitialToolCalls\s*\)/s);
            const mergeAt = core.indexOf('mergeJarvisToolCalls(\n                missionContractToolCalls');
            const ensureAt = core.indexOf('ensureExecutableArtifactDependencies({', mergeAt);
            assert.ok(mergeAt >= 0 && ensureAt > mergeAt);
          });
          EOF

          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/gestia-core.js
          git diff --check
          echo 'SAME_PLAN_PRESERVED=true'
          echo 'NO_NEW_BRAIN=true'
          echo 'NO_NEW_CONTRACT=true'
          echo 'NO_NEW_CONTRACT_VERSION=true'

      - name: Install dependencies
        run: npm ci

      - name: Focal mission-contract production regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/jarvis-mission-contract-preserves-initial-production.test.mjs \
            tests/jarvis-marketing-production-intent-v125.test.mjs \
            tests/jarvis-mission-contract-accounting.test.mjs \
            tests/jarvis-reel-dependency-recovery-v140.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-single-contract-authority.test.mjs \
            tests/single-semantic-authority.test.mjs

      - name: Full CI once on production-chain preservation
        run: npm run ci:test

      - name: Protected surface audit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" -- .)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(functions/|multiservicios-web/|.*Multiservicios)' ; then
            echo 'PROTECTED_SURFACE_TOUCHED=true' >&2
            exit 1
          fi
          grep -q '1.2.0-stable-research-objectives' gestia-core/gestia-core.js
          ! grep -q 'v141\|v142\|v143' tests/jarvis-mission-contract-preserves-initial-production.test.mjs
          git diff --check
          echo 'FUNCTIONS_UNTOUCHED=true'
          echo 'MULTISERVICIOS_UNTOUCHED=true'
          echo 'NO_NEW_BRAIN=true'
          echo 'NO_NEW_CONTRACT=true'
          echo 'NO_NEW_CONTRACT_VERSION=true'

      - name: Build isolated Hosting-only config and marker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const hosting = Array.isArray(source.hosting) ? source.hosting : [source.hosting].filter(Boolean);
          const selected = hosting.filter(item => item && item.site === process.env.FIREBASE_SITE_ID);
          if (selected.length !== 1) throw new Error(`HOSTING_SITE_SELECTION_INVALID:${selected.length}`);
          if (selected[0].target) throw new Error(`HOSTING_TARGET_FORBIDDEN:${selected[0].target}`);
          fs.writeFileSync('.firebase-production-chain-hosting-only.json', JSON.stringify({hosting:selected[0]}, null, 2));
          fs.writeFileSync('contract-audit-production-chain.json', JSON.stringify({
            candidate:'ADJUNTO_CURRENT_CONTRACT_PRODUCTION_CHAIN_PRESERVED',
            contract:'1.2.0-stable-research-objectives',
            semanticAuthority:'jarvisSemanticPlan',
            samePlanPreserved:true,
            completeProductionChain:true,
            hostingOnly:true,
            builtAt:new Date().toISOString()
          }, null, 2));
          const config = JSON.parse(fs.readFileSync('.firebase-production-chain-hosting-only.json','utf8'));
          if (config.functions) throw new Error('FUNCTIONS_CONFIG_PRESENT');
          if (Array.isArray(config.hosting)) throw new Error('MULTISITE_CONFIG_PRESENT');
          if (config.hosting?.site !== process.env.FIREBASE_SITE_ID) throw new Error('WRONG_HOSTING_SITE');
          if (config.hosting?.target) throw new Error('MULTISERVICIOS_TARGET_PRESENT');
          console.log('HOSTING_CONFIG_ISOLATED=true');
          NODE

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting only after green certification
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy --config .firebase-production-chain-hosting-only.json --only hosting --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
          echo 'HOSTING_ONLY_DEPLOYED=true'

      - name: Verify served production-chain bytes
        shell: bash
        run: |
          set -euo pipefail
          base="https://${FIREBASE_SITE_ID}.web.app"
          ok=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location "${base}/contract-audit-production-chain.json?run=${GITHUB_RUN_ID}" -o /tmp/marker.json \
              && curl --fail --silent --show-error --location "${base}/gestia-core/gestia-core.js?run=${GITHUB_RUN_ID}" -o /tmp/core.js \
              && curl --fail --silent --show-error --location "${base}/gestia-core/jarvis/jarvis.multifunction.planner.js?run=${GITHUB_RUN_ID}" -o /tmp/planner.js \
              && grep -q 'ADJUNTO_CURRENT_CONTRACT_PRODUCTION_CHAIN_PRESERVED' /tmp/marker.json \
              && grep -q 'mergeJarvisToolCalls' /tmp/core.js \
              && grep -q 'missionContractToolCalls' /tmp/core.js \
              && grep -q 'productionRequested=true' /tmp/planner.js \
              && grep -q '1.2.0-stable-research-objectives' /tmp/core.js; then
              ok=true
              break
            fi
            sleep 4
          done
          test "$ok" = true
          echo 'CERTIFIED_HOSTING_BYTES_VERIFIED=true'
          echo "WEB_URL=${base}/gestia-terminal.html"

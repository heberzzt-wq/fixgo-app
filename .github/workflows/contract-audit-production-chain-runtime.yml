name: contract-audit production-chain runtime

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/contract-audit-production-chain-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 8de46c00565b041b006f6a33d81ff6c22a616846
  HANDOFF_PATCH_SHA256: 0b357d2cb607276cf9ec9b65a66a23caf05379cdaaab22972bc9764f9407a98a
  CERTIFIED_CARRIER_SHA: cebe6f399d4edf4f234e584e0a42cf980b3a404d

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact certified Hosting candidate
        shell: bash
        run: |
          set -euo pipefail
          git show "${CERTIFIED_CARRIER_SHA}:.github/workflows/contract-audit-provider-outage-v3.yml" > /tmp/certified.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/certified.yml').read_text()
          def extract(step_name, next_step_name, output):
              start = text.index(f'      - name: {step_name}\n')
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              end = text.index(f'\n      - name: {next_step_name}\n', run_start)
              block = text[run_start:end]
              lines=[]
              for line in block.splitlines():
                  if line.startswith('          '): lines.append(line[10:])
                  elif not line.strip(): lines.append('')
                  else: raise SystemExit(f'INDENT:{step_name}:{line!r}')
              Path(output).write_text('\n'.join(lines)+'\n')
          extract('Restore previously certified invariants','Harden existing planner and fail-closed presentation','/tmp/restore.sh')
          extract('Harden existing planner and fail-closed presentation','Contract and authority assertions','/tmp/harden.sh')
          PY
          mkdir -p /tmp/contract-audit
          for part in chunk-00.txt chunk-01.txt chunk-02.txt segment-05.txt segment-06.txt segment-07.txt chunk-04.txt; do
            git show "${CERTIFIED_CARRIER_SHA}:.github/candidates/contract-audit/${part}" >> /tmp/contract-audit/handoff.patch.gz.b64
          done
          base64 -d /tmp/contract-audit/handoff.patch.gz.b64 | gzip -d > /tmp/contract-audit/handoff.patch
          echo "$HANDOFF_PATCH_SHA256  /tmp/contract-audit/handoff.patch" | sha256sum -c -
          git checkout --detach "$BASE_SHA"
          git apply /tmp/contract-audit/handoff.patch
          bash /tmp/restore.sh
          bash /tmp/harden.sh
          echo 'RECONSTRUCTED=true'

      - name: Inspect exact production-chain merge points
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CORE 4200-4330 ==='
          sed -n '4200,4330p' gestia-core/gestia-core.js
          echo '=== DEPENDENCIES 145-255 ==='
          sed -n '145,255p' gestia-core/jarvis/jarvis.mission.dependencies.js
          echo '=== PLANNER TRUSTED CALLS 1600-1765 ==='
          sed -n '1600,1765p' gestia-core/jarvis/jarvis.multifunction.planner.js
          echo '=== PLANNER BUILD 2220-2325 ==='
          sed -n '2220,2325p' gestia-core/jarvis/jarvis.multifunction.planner.js
          echo '=== MARKETING SCOPE SOURCE ==='
          grep -R -n -C 10 'function resolveMarketingMissionProductionScope\|export function resolveMarketingMissionProductionScope' gestia-core | head -n 500 || true
          echo '=== INITIAL PLAN METADATA/MERGE HELPERS ==='
          grep -n -C 8 -E 'operationalInitialToolCalls|mergeJarvisToolCalls|mergeEvidenceGroundedToolCalls|attachPlanMetadata|resolveSemanticPlan' gestia-core/gestia-core.js gestia-core/jarvis/jarvis.multifunction.planner.js | head -n 900 || true

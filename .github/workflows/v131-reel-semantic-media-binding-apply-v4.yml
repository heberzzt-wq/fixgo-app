name: v131-reel-semantic-media-binding-apply-v4

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/scripts/v131-reel-semantic-media-binding-v4.py
      - .github/workflows/v131-reel-semantic-media-binding-apply-v4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"

      - name: Apply corrected v131 product patch
        run: |
          python3 .github/scripts/v131-reel-semantic-media-binding-v4.py
          rm -f .github/scripts/v131-reel-semantic-media-binding-v2.py
          rm -f .github/scripts/v131-reel-semantic-media-binding-v3.py
          rm -f .github/scripts/v131-reel-semantic-media-binding-v4.py
          rm -f .github/workflows/v131-reel-semantic-media-binding-apply-v2.yml
          rm -f .github/workflows/v131-reel-semantic-media-binding-apply-v3.yml
          rm -f .github/workflows/v131-reel-semantic-media-binding-apply-v4.yml

      - name: Guard Functions unchanged
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^functions/'; then
            echo "Functions changed in v131" >&2
            exit 1
          fi

      - name: Syntax focal v131
        run: |
          node --check gestia-core/jarvis/jarvis.reel.media-binder.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          node --check modules/terminal/nexo-bootstrap.js

      - name: Focal v131 tests
        run: node --test tests/jarvis-reel-media-binder-v131.test.mjs tests/nexo-real-media-semantic-binding-v131.test.mjs tests/nexo-real-media-runtime-guard-v128.test.mjs tests/jarvis-real-media-reel-hydration-v127.test.mjs tests/jarvis-reel-artifact.test.mjs tests/nexo-real-media-tools.test.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit v131 product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[v131] feat(adj): bind reel scenes to verified media semantically"
          git push origin HEAD:v94-media-v4n-negative-claims

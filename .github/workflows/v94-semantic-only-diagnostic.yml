name: V94 semantic-only diagnostic
# single-brain-real-ci-gate

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-semantic-only-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Inventory legacy brain consumers before prune
        run: |
          python3 tools/v94_single_brain_inventory.py | tee /tmp/v94-single-brain-inventory.log
          python3 tools/v94_single_brain_active_refs.py | tee /tmp/v94-single-brain-active-refs.log

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Apply single-brain prune and semantic-only patches
        run: |
          set -o pipefail
          python3 tools/v94_single_brain_prune.py 2>&1 | tee /tmp/v94-semantic-patch.log
          python3 tools/v94_semantic_only_front_patch.py 2>&1 | tee -a /tmp/v94-semantic-patch.log
          python3 tools/v94_semantic_only_core_patch.py 2>&1 | tee -a /tmp/v94-semantic-patch.log
          python3 tools/v94_single_brain_prune_wave2.py 2>&1 | tee -a /tmp/v94-semantic-patch.log
          python3 tools/v94_single_brain_prune_wave3.py 2>&1 | tee -a /tmp/v94-semantic-patch.log
          python3 tools/v94_semantic_only_contract_patch.py 2>&1 | tee -a /tmp/v94-semantic-patch.log
          python3 tools/v94_semantic_only_residue_patch.py 2>&1 | tee -a /tmp/v94-semantic-patch.log
          python3 tools/v94_quality_helper_tail_fix.py 2>&1 | tee -a /tmp/v94-semantic-patch.log
          python3 tools/v94_single_brain_quality_patch.py 2>&1 | tee -a /tmp/v94-semantic-patch.log
          python3 tools/v94_quality_post_patch.py 2>&1 | tee -a /tmp/v94-semantic-patch.log

          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.conversation.composer.js
          node --check gestia-core/jarvis/jarvis.marketing.engine.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.business.engine.js
          node --check gestia-core/gestia-core.js
          node --check gestia-core/tools.runtime.js
          node --check gestia-terminal.js
          node --check app-main.js
          node --check scripts/check-nexo-private-engine.mjs

          for obsolete in \
            gestia-core/jarvis/jarvis.cognition.engine.js \
            gestia-core/jarvis/jarvis.local.bootstrap.js \
            gestia-core/jarvis/jarvis.local.runtime.js \
            gestia-core/jarvis/jarvis.local.routing.js \
            gestia-core/cognitive.bootstrap.js \
            gestia-core/intent.engine.js \
            gestia-core/intent.engine.v7.js \
            gestia-core/repo/repo.cognition.index.js \
            gestia-core/jarvis/jarvis.bridge.v4.js \
            gestia-core/jarvis/jarvis.intent.runtime.v7.js \
            gestia-core/jarvis/jarvis.language.core.v5.js \
            gestia-core/jarvis/jarvis.normalizer.js \
            gestia-core/jarvis/jarvis.orchestrator.js \
            gestia-core/jarvis/jarvis.vision.engine.js \
            gestia-core/jarvis/jarvis-nlu-bridge.js \
            gestia-core/jarvis/jarvis.dsl.js \
            gestia-core/hubs/analysis.hub.js \
            tests/jarvis-local-runtime.test.mjs \
            tests/jarvis-intent-runtime-v7.test.mjs \
            tests/jarvis-vision-repo-analysis.test.mjs
          do
            test ! -e "$obsolete"
          done

          git diff --check
          test -z "$(git diff --name-only -- functions)"

      - name: Inventory after prune
        run: |
          python3 tools/v94_single_brain_inventory.py | tee /tmp/v94-single-brain-post.log
          python3 tools/v94_single_brain_active_refs.py | tee /tmp/v94-single-brain-active-post.log

      - name: Inventory semantic lexical residue
        run: |
          python3 - <<'PY' | tee /tmp/v94-semantic-inventory.log
          from pathlib import Path
          files = [
              'gestia-core/jarvis/jarvis.multifunction.planner.js',
              'gestia-core/jarvis/jarvis.conversation.composer.js',
              'gestia-core/jarvis/jarvis.marketing.engine.js',
              'gestia-core/jarvis/jarvis.business.engine.js',
              'gestia-core/gestia-core.js',
              'gestia-terminal.js'
          ]
          needles = [
              'new RegExp(', '.match(', '.matchAll(', '.exec(', '.test(',
              'negativeSignals', 'positiveSignals', 'referenceSignals',
              'CRITICAL_INPUT_GROUPS', 'inferInstructionBrand', 'inferSubject',
              'detectIntent', 'detectEntity', 'detectFilters',
              'WEAK_CORE_FILE_PATTERN', 'UI_EVIDENCE_PATTERN',
              'META_ENGINE_EVIDENCE_PATTERN', 'LOW_SIGNAL_EVIDENCE_TERMS',
              'extractObjectiveTerms', 'objectiveExplicitlyTargetsMetaEngine',
              'interpretarIntenciones', 'runCognitiveReasoning',
              'JarvisCognitionEngine', 'JarvisIntentRuntimeV7'
          ]
          found = []
          for file in files:
              path = Path(file)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for needle in needles:
                  count = text.count(needle)
                  if count:
                      found.append((file, needle, count))
          if found:
              print('SEMANTIC_LEXICAL_RESIDUE')
              for row in found:
                  print('\t'.join(map(str, row)))
          else:
              print('SEMANTIC_LEXICAL_RESIDUE=0')
          PY

      - name: Run complete CI diagnostic
        run: |
          set +e
          npm run ci:test > /tmp/v94-semantic-ci.log 2>&1
          status=$?
          echo "$status" > /tmp/v94-semantic-ci-exit.txt
          cat /tmp/v94-semantic-ci.log
          exit 0

      - name: Require real CI green
        run: |
          status="$(cat /tmp/v94-semantic-ci-exit.txt)"
          echo "ci_exit=$status"
          test "$status" = "0"
          test -z "$(git diff --name-only -- functions)"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v94-semantic-only-diagnostic
          path: |
            /tmp/v94-single-brain-inventory.log
            /tmp/v94-single-brain-active-refs.log
            /tmp/v94-single-brain-post.log
            /tmp/v94-single-brain-active-post.log
            /tmp/v94-semantic-patch.log
            /tmp/v94-semantic-inventory.log
            /tmp/v94-semantic-ci.log
            /tmp/v94-semantic-ci-exit.txt
          if-no-files-found: ignore
          retention-days: 14

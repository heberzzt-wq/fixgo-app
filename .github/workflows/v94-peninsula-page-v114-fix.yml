name: V94 Peninsula Tech page repair v114

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-peninsula-page-v114-fix.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Assert isolated branch and Functions boundary
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          git merge-base --is-ancestor 13cb877ef49fbd2ef19bc2a5da42887b5836e16a HEAD
          test -z "$(git diff --name-only 13cb877ef49fbd2ef19bc2a5da42887b5836e16a HEAD -- functions)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm --prefix functions ci
          test -z "$(git status --porcelain -- functions)"

      - name: Apply v114 page repair
        run: |
          set -euo pipefail
          python scripts/v114-peninsula-page-fix.py
          node --check jarvis-page-artifact.js
          node --check jarvis-fs-bridge.js
          node --check gestia-core/gestia-core.js
          node --check gestia-core/tools.runtime.js
          node --check gestia-core/tools.bridge.js
          node --check gestia-core/jarvis/jarvis.mission.dependencies.js
          node --check gestia-core/jarvis/jarvis.actuator.pack.js
          test -z "$(git diff --name-only -- functions)"

      - name: Focused page and regression tests
        run: |
          set -euo pipefail
          node --test \
            tests/jarvis-peninsula-page-v114.test.mjs \
            tests/jarvis-page-artifact.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-generalist-current-turn.test.mjs \
            tests/jarvis-actuator-pack.test.mjs \
            tests/jarvis-live-human-reds-v113.test.mjs \
            tests/jarvis-fs-bridge-v2.test.mjs \
            tests/jarvis-semantic-memory-integrity.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs \
            tests/repo-authority-v2.test.cjs
          test -z "$(git diff --name-only -- functions)"

      - name: Real page.create route integration
        run: |
          set -euo pipefail
          node scripts/v114-page-route-integration.mjs
          output="$(cat /tmp/v114-page-output-path.txt)"
          test -s "$output"
          grep -q 'Península Tech' "$output"
          grep -q 'Tecnología para coordinar servicios con claridad' "$output"
          if grep -Eiq 'mailto:|wa\.me|lorem ipsum|placeholder|undefined|PAGE_.*ERROR' "$output"; then exit 1; fi
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom "file://$output" > /tmp/v114-page-rendered-dom.html 2>/tmp/v114-page-chrome.err
          test -s /tmp/v114-page-rendered-dom.html
          grep -q 'Península Tech' /tmp/v114-page-rendered-dom.html
          grep -q 'Tecnología para coordinar servicios con claridad' /tmp/v114-page-rendered-dom.html
          if grep -Eiq 'mailto:|wa\.me|lorem ipsum|placeholder|undefined|PAGE_.*ERROR' /tmp/v114-page-rendered-dom.html; then exit 1; fi
          sha256sum "$output"
          cat /tmp/v114-page-route-result.json
          rm -f "$output" .jarvis-artifacts/manifest.json
          git checkout -- .jarvis-artifacts 2>/dev/null || true
          test -z "$(git status --porcelain -- functions)"

      - name: Full CI
        run: |
          set -euo pipefail
          npm run ci:test
          test -z "$(git status --porcelain -- functions)"

      - name: Certify v114 invariants
        run: |
          set -euo pipefail
          grep -q 'ensureExecutableArtifactDependencies' gestia-core/gestia-core.js
          grep -q 'STRUCTURAL_PAGE_CREATE_DEPENDENCY' gestia-core/jarvis/jarvis.mission.dependencies.js
          grep -q 'lexicalRouting: false' gestia-core/jarvis/jarvis.mission.dependencies.js
          if grep -q 'PAGE_CONTACT_ROUTE_REQUIRED' jarvis-page-artifact.js; then exit 1; fi
          grep -q 'hasContactRoute' jarvis-page-artifact.js
          grep -q 'PAGE_BYTE_COUNT_MISMATCH' jarvis-fs-bridge.js
          grep -q '2.38.0-page-no-contact-route' jarvis-fs-bridge.js
          grep -q '2.38.0-page-no-contact-route' gestia-core/tools.runtime.js
          grep -q 'HTML fue creado físicamente' gestia-core/tools.bridge.js
          grep -q 'SHA-256' gestia-core/tools.bridge.js
          grep -q 'v94-peninsula-page-v114-20260809' gestia-terminal.html
          test -z "$(git diff --name-only -- functions)"

      - name: Commit certified v114 product
        run: |
          set -euo pipefail
          git config user.name "heberzzt-wq"
          git config user.email "heberzzt@gmail.com"
          git rm -f scripts/v114-peninsula-page-fix.py scripts/v114-page-route-integration.mjs
          git add \
            jarvis-page-artifact.js \
            jarvis-fs-bridge.js \
            gestia-terminal.html \
            gestia-core/gestia-core.js \
            gestia-core/tools.runtime.js \
            gestia-core/tools.bridge.js \
            gestia-core/jarvis/jarvis.mission.dependencies.js \
            gestia-core/jarvis/jarvis.actuator.pack.js \
            tests/jarvis-peninsula-page-v114.test.mjs \
            tests/jarvis-page-artifact.test.mjs \
            tests/jarvis-fs-bridge-v2.test.mjs \
            tests/jarvis-live-human-reds-v113.test.mjs \
            tests/jarvis-semantic-memory-integrity.test.mjs
          test -z "$(git diff --cached --name-only -- functions)"
          git commit -m "[v94] fix(adj): create verified pages without fake contact data"
          git push origin HEAD:v94-media-v4n-negative-claims
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Authorize Hosting only
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
          JARVIS_HOSTING_ONLY: "true"
        run: |
          set -euo pipefail
          test -n "$PRODUCT_SHA"
          GITHUB_SHA="$PRODUCT_SHA" node scripts/jarvis-deploy-gate.mjs
          test -z "$(git diff --name-only 13cb877ef49fbd2ef19bc2a5da42887b5836e16a "$PRODUCT_SHA" -- functions)"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy --only hosting --project fixgo-44e4d --token "$FIREBASE_TOKEN"

      - name: Verify propagated live bytes
        run: |
          set -euo pipefail
          for path in gestia-terminal.html gestia-core/gestia-core.js gestia-core/tools.runtime.js gestia-core/tools.bridge.js gestia-core/jarvis/jarvis.mission.dependencies.js gestia-core/jarvis/jarvis.actuator.pack.js jarvis-page-artifact.js jarvis-fs-bridge.js; do
            live="/tmp/live-$(echo "$path" | tr '/' '_')"
            matched=false
            for attempt in $(seq 1 12); do
              curl -fsSL "https://fixgo-44e4d.web.app/$path?v=v114-${GITHUB_RUN_ID}-${attempt}" -o "$live"
              local_sha="$(sha256sum "$path" | awk '{print $1}')"
              live_sha="$(sha256sum "$live" | awk '{print $1}')"
              echo "$path attempt=$attempt local=$local_sha live=$live_sha"
              if [ "$local_sha" = "$live_sha" ] && cmp -s "$path" "$live"; then matched=true; break; fi
              sleep 2
            done
            test "$matched" = true
          done
          grep -q 'v94-peninsula-page-v114-20260809' /tmp/live-gestia-terminal.html
          grep -q 'STRUCTURAL_PAGE_CREATE_DEPENDENCY' /tmp/live-gestia-core_jarvis_jarvis.mission.dependencies.js
          grep -q '2.38.0-page-no-contact-route' /tmp/live-gestia-core_tools.runtime.js
          grep -q 'HTML fue creado físicamente' /tmp/live-gestia-core_tools.bridge.js
          grep -q 'PAGE_BYTE_COUNT_MISMATCH' /tmp/live-jarvis-fs-bridge.js
          test -z "$(git diff --name-only 13cb877ef49fbd2ef19bc2a5da42887b5836e16a "$PRODUCT_SHA" -- functions)"

name: ChatGPT safe marketing expansion patch

on:
  push:
    branches:
      - chatgpt/jarvis-v12-marketing-handoff

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/jarvis-v12-marketing-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch orchestrator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('gestia-core/jarvis/jarvis.mission.orchestrator.js')
          s = p.read_text(encoding='utf-8')
          old = '''        if (text(task?.args?.format, 40).toLowerCase() !== requiredFormat) return false;\n        if (["md", "pdf", "xlsx"].includes(requiredFormat) && task?.args?.contentSource !== "marketing.plan") return false;'''
          new = '''        if (text(task?.args?.format, 40).toLowerCase() !== requiredFormat) return false;'''
          if s.count(old) != 1:
              raise SystemExit(f'match marker count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''        missingCalls.push({\n            name: requirement.toolName,\n            args: requiredArgs,\n            approved: false,\n            reason: "MARKETING_DECLARED_PHYSICAL_REQUIREMENT"\n        });'''
          new = '''        if (requirement.toolName === "document.create") {\n            missingCalls.push({\n                name: requirement.toolName,\n                args: requiredArgs,\n                approved: false,\n                reason: "MARKETING_DECLARED_PHYSICAL_REQUIREMENT"\n            });\n        }'''
          if s.count(old) != 1:
              raise SystemExit(f'expansion marker count={s.count(old)}')
          s = s.replace(old, new, 1)
          s = s.replace('"1.17.0-marketing-declared-artifact-expansion-v12"', '"1.18.0-safe-marketing-artifact-expansion-v12"', 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --test --test-concurrency=1 \
            tests/jarvis-marketing-real-delivery.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gestia-core/jarvis/jarvis.mission.orchestrator.js
          git commit -m "jarvis: defer non-document marketing artifacts until executable"
          git pull --rebase origin chatgpt/jarvis-v12-marketing-handoff
          git push origin HEAD:chatgpt/jarvis-v12-marketing-handoff

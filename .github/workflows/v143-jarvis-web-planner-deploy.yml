name: Jarvis V143 web planner deploy

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - 'functions/jarvis-genai-provider-chain.js'
      - 'functions/jarvis-semantic-planner.js'
      - 'functions/jarvis-web-research.js'
      - 'functions/index.js'
      - '.github/workflows/v143-jarvis-web-planner-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  certify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Verify affected syntax
        run: |
          node --check functions/jarvis-genai-provider-chain.js
          node --check functions/jarvis-semantic-planner.js
          node --check functions/jarvis-web-research.js
          node --check functions/index.js
          node --check jarvis-local-web-research.js
          node --check jarvis-upload-bridge.js

      - name: Run focused recovery contracts
        run: |
          node --test \
            tests/jarvis-genai-provider-chain.test.cjs \
            tests/jarvis-genai-grounding-canonicalization.test.cjs \
            tests/jarvis-local-web-research.test.mjs \
            tests/jarvis-upload-research-route.test.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy affected Jarvis functions only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy \
            --only functions:jarvisWebResearch,functions:jarvisSemanticPlan,functions:jarvisSemanticRespond \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      - name: Smoke production Hosting
        run: |
          set -euo pipefail
          base="https://${FIREBASE_SITE_ID}.web.app"
          curl --fail --silent --show-error --location "$base/gestia-terminal.html?v143=${GITHUB_SHA}" -o /tmp/terminal.html
          test "$(wc -c < /tmp/terminal.html)" -gt 1000
          echo "WEB_URL=$base/gestia-terminal.html"

      - name: Smoke callable endpoints are deployed
        shell: bash
        run: |
          set -euo pipefail
          for fn in jarvisWebResearch jarvisSemanticPlan jarvisSemanticRespond; do
            url="https://us-central1-${FIREBASE_PROJECT_ID}.cloudfunctions.net/${fn}"
            code=$(curl --silent --show-error --output "/tmp/${fn}.json" --write-out '%{http_code}' \
              -X POST -H 'Content-Type: application/json' --data '{"data":{}}' "$url" || true)
            echo "$fn HTTP=$code"
            test "$code" != "000"
            test "$code" != "404"
            test "$code" != "502"
            test "$code" != "503"
          done

      - name: Publish certified deployment marker
        run: |
          echo "V143_JARVIS_WEB_PLANNER_DEPLOYED_SHA=$GITHUB_SHA"
          echo "V143_JARVIS_WEB_PLANNER_SMOKE_VERIFIED=true"

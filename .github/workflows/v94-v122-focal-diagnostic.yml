name: V94 v122 focal diagnostic

on:
  push:
    branches: [v94-media-v4n-negative-claims]
    paths:
      - .github/workflows/v94-v122-focal-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply v122 patch
        run: python3 scripts/v122-generalist-execution-contract-fix.py
      - name: Capture focused TAP
        id: focal
        shell: bash
        run: |
          set +e
          node --test \
            tests/jarvis-generalist-execution-contract-v122.test.mjs \
            tests/nexo-real-media-tools.test.mjs \
            tests/nexo-web-media-bridge.test.mjs \
            tests/jarvis-fs-bridge-v2.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-current-turn-freshness-v119.test.mjs \
            tests/jarvis-generalist-page-integrity-v120.test.mjs \
            tests/jarvis-page-factual-integrity-v121.test.mjs \
            tests/jarvis-page-request-contract-v118.test.mjs \
            tests/jarvis-semantic-memory-integrity.test.mjs \
            2>&1 | tee v122-focal.tap
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: v122-focal-tap
          path: v122-focal.tap
          if-no-files-found: error
      - name: Preserve red conclusion
        run: test "${{ steps.focal.outputs.exit_code }}" = "0"

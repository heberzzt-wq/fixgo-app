name: V94 semantic memory repo final certification

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-semantic-memory-integrity-certify.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Assert product lineage and Functions boundary
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          git merge-base --is-ancestor e6bec05b93b8f1ad88f44d5665ee2547c468dcec HEAD
          git merge-base --is-ancestor 3181bba60f8b3fcd748a389ab7ded027ed7735ea HEAD
          test -z "$(git diff --name-only e6bec05b93b8f1ad88f44d5665ee2547c468dcec HEAD -- functions)"
          printf 'CERT_PRODUCT_HEAD=%s\n' "$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: |
          set -euo pipefail
          npm ci
          npm --prefix functions ci
          test -z "$(git status --porcelain -- functions)"

      - name: Full CI
        run: |
          set -euo pipefail
          npm run ci:test

      - name: Focused semantic repo certification
        run: |
          set -euo pipefail
          node --test \
            tests/jarvis-semantic-memory-integrity.test.mjs \
            tests/jarvis-repo-target-runtime.test.mjs \
            tests/jarvis-fs-bridge-v2.test.mjs \
            tests/jarvis-repo-intelligence.test.mjs \
            tests/repo-authority-v2.test.cjs \
            tests/single-semantic-authority.test.mjs
          node --check gestia-terminal.js
          node --check gestia-core/gestia-core.js
          node --check gestia-core/tools.runtime.js
          node --check gestia-core/jarvis.kernel.js
          node --check gestia-core/hubs/repo.hub.js
          node --check gestia-core/repo/repo.target.js
          node --check gestia-core/jarvis/jarvis.semantic.memory.js
          node --check jarvis-fs-bridge.js

      - name: Certify startup memory and repo invariants
        run: |
          set -euo pipefail
          ! grep -q 'Cada conversación empieza aislada' gestia-terminal.html
          grep -q 'memoria semántica de sesiones anteriores' gestia-terminal.html
          ! grep -q 'jarvis.context.memory.v6.js' gestia-terminal.html
          ! grep -q '<script type="module" src="/gestia-core/tools.runtime.js' gestia-terminal.html
          ! grep -Eq '<script[^>]+tools\.bridge\.js' gestia-terminal.html
          ! grep -Eq '<script[^>]+response\.composer\.js' gestia-terminal.html
          grep -q 'gestia-terminal.js?v=v94-semantic-memory-repo-v111-20260809' gestia-terminal.html
          grep -q 'gestia-core/gestia-core.js?v=v94-semantic-memory-repo-v111-20260809' gestia-terminal.html
          grep -q 'KernelHeberto.inicializarAutoridad()' gestia-terminal.js
          grep -q 'JarvisSemanticMemory' gestia-core/gestia-core.js
          grep -q 'tools.runtime.js?v=v94-semantic-memory-repo-v111-20260809' gestia-core/gestia-core.js
          grep -q 'canonicalMissionEvidence' gestia-core/jarvis/jarvis.mission.orchestrator.js
          grep -q 'EVIDENCIA_CANONICA_DE_MISION' gestia-core/jarvis/jarvis.multitool.pack.js
          grep -q 'MEMORIA_SEMANTICA_ADVISORY' gestia-core/jarvis/jarvis.multitool.pack.js
          ! grep -q 'from "./hubs/analysis.hub.js"' gestia-core/jarvis.kernel.js
          grep -q 'SEMANTIC_ANALYSIS_DELEGATED' gestia-core/jarvis.kernel.js
          ! grep -q '__REPO_INDEX__\["analysis.hub.js"\]' modules/terminal/repo-bootstrap-index.js
          ! grep -q '__REPO_INDEX__\["jarvis.context.memory.v6.js"\]' modules/terminal/repo-bootstrap-index.js
          grep -q 'LEGACY_METADATA_ONLY' modules/terminal/repo-bootstrap-index.js
          grep -q 'REPOSITORY_REMOTE_MISMATCH' jarvis-fs-bridge.js
          grep -q 'REPOSITORY_REFERENCE_ANALYZED' gestia-core/tools.runtime.js
          grep -q 'live_repo_ast_graph' gestia-core/tools.runtime.js
          test "$(grep -c 'name: "repo.scan"' gestia-core/tools.runtime.js)" -eq 1
          test "$(grep -c 'name: "repo.audit"' gestia-core/tools.runtime.js)" -eq 1
          ! grep -q 'WHEN_INFRASTRUCTURE_AVAILABLE' gestia-core/jarvis/jarvis.marketing.engine.js
          ! grep -q 'instruction_inference' gestia-core/jarvis/jarvis.marketing.engine.js
          ! grep -q 'clientes potenciales relevantes para la oferta de la marca' gestia-core/jarvis/jarvis.marketing.engine.js
          ! grep -q 'presupuesto piloto por definir' gestia-core/jarvis/jarvis.marketing.engine.js
          test -z "$(git status --porcelain -- functions)"

      - name: Verify real branch and foreign repository identity
        run: |
          set -euo pipefail
          git fetch --quiet origin codex/jarvis-v8-runtime-foundation
          node --input-type=module <<'NODE'
          import { resolveBridgeRepositoryTarget } from './jarvis-fs-bridge.js';
          const good = resolveBridgeRepositoryTarget({
            target: 'https://github.com/heberzzt-wq/fixgo-app/blob/codex/jarvis-v8-runtime-foundation'
          }, process.cwd());
          const bad = resolveBridgeRepositoryTarget({
            target: 'https://github.com/openai/not-the-local-repo/tree/main'
          }, process.cwd());
          console.log(JSON.stringify({ good, bad }, null, 2));
          if (!good.ok || good.ref !== 'codex/jarvis-v8-runtime-foundation' || good.path !== '' || !good.commit) process.exit(1);
          if (bad.ok || bad.status !== 'REPOSITORY_REMOTE_MISMATCH') process.exit(1);
          NODE

      - name: Verify deploy gate
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- functions)"
          node scripts/jarvis-deploy-gate.mjs

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          test -z "$(git status --porcelain -- functions)"
          firebase deploy --only hosting --project fixgo-44e4d --token "$FIREBASE_TOKEN"

      - name: Verify exact live bytes and live invariants
        run: |
          set -euo pipefail
          paths=(
            gestia-terminal.html
            gestia-terminal.js
            gestia-core/gestia-core.js
            gestia-core/tools.runtime.js
            gestia-core/jarvis.kernel.js
            gestia-core/hubs/repo.hub.js
            gestia-core/repo/repo.target.js
            gestia-core/jarvis/jarvis.semantic.memory.js
            gestia-core/jarvis/jarvis.mission.orchestrator.js
            gestia-core/jarvis/jarvis.multifunction.planner.js
            gestia-core/jarvis/jarvis.multitool.pack.js
            gestia-core/jarvis/jarvis.marketing.engine.js
            modules/terminal/repo-bootstrap-index.js
            jarvis-fs-bridge.js
          )
          for path in "${paths[@]}"; do
            live="/tmp/live-$(echo "$path" | tr '/' '_')"
            curl -fsSL "https://fixgo-44e4d.web.app/$path?cert=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o "$live"
            local_sha="$(sha256sum "$path" | awk '{print $1}')"
            live_sha="$(sha256sum "$live" | awk '{print $1}')"
            printf '%s local=%s live=%s\n' "$path" "$local_sha" "$live_sha"
            test "$local_sha" = "$live_sha"
            cmp -s "$path" "$live"
          done
          html=/tmp/live-gestia-terminal.html
          core=/tmp/live-gestia-core_gestia-core.js
          runtime=/tmp/live-gestia-core_tools.runtime.js
          kernel=/tmp/live-gestia-core_jarvis.kernel.js
          index=/tmp/live-modules_terminal_repo-bootstrap-index.js
          bridge=/tmp/live-jarvis-fs-bridge.js
          grep -q 'memoria semántica de sesiones anteriores' "$html"
          ! grep -q 'Cada conversación empieza aislada' "$html"
          ! grep -q 'jarvis.context.memory.v6.js' "$html"
          grep -q 'gestia-terminal.js?v=v94-semantic-memory-repo-v111-20260809' "$html"
          grep -q 'tools.runtime.js?v=v94-semantic-memory-repo-v111-20260809' "$core"
          ! grep -q 'from "./hubs/analysis.hub.js"' "$kernel"
          grep -q 'SEMANTIC_ANALYSIS_DELEGATED' "$kernel"
          grep -q 'REPOSITORY_REFERENCE_ANALYZED' "$runtime"
          grep -q 'live_repo_ast_graph' "$runtime"
          grep -q 'LEGACY_METADATA_ONLY' "$index"
          ! grep -q '__REPO_INDEX__\["jarvis.context.memory.v6.js"\]' "$index"
          grep -q 'REPOSITORY_REMOTE_MISMATCH' "$bridge"

      - name: Remove temporary V94 workflows and seal branch
        run: |
          set -euo pipefail
          git config user.name "heberzzt-wq"
          git config user.email "heberzzt@gmail.com"
          git rm -f --ignore-unmatch \
            .github/workflows/v94-semantic-memory-integrity-diagnostic.yml \
            .github/workflows/v94-semantic-memory-integrity-fix.yml \
            .github/workflows/v94-semantic-memory-integrity-certify.yml \
            .github/workflows/v94-repo-intelligence-diagnostic.yml \
            .github/workflows/v94-repo-intelligence-fix.yml
          git add -A
          test -z "$(git diff --cached --name-only -- functions)"
          git commit -m "[v94] chore: close semantic memory and repo certification"
          git push origin HEAD:v94-media-v4n-negative-claims

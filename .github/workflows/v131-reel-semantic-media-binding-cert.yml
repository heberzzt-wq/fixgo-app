# v131 certification rerun after stale health expectation closure
name: v131-reel-semantic-media-binding-cert

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v131-reel-semantic-media-binding-cert.yml
      - .github/workflows/v131-reel-semantic-media-binding-cert-close.yml
      - .github/scripts/v131-reel-semantic-media-binding-cert-close.py
      - gestia-core/jarvis/jarvis.reel.media-binder.js
      - gestia-core/jarvis/jarvis.multitool.pack.js
      - gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
      - modules/terminal/nexo-bootstrap.js
      - gestia-core/jarvis/jarvis.reel.presenter.js
      - gestia-core/jarvis/jarvis.actuator.pack.js
      - jarvis-reel-artifact.js
      - jarvis-fs-bridge.js
      - nexo-web-media-bridge.js
      - tests/jarvis-reel-media-binder-v131.test.mjs
      - tests/nexo-real-media-semantic-binding-v131.test.mjs
      - tests/nexo-real-media-runtime-guard-v128.test.mjs
      - tests/jarvis-real-media-reel-hydration-v127.test.mjs
      - tests/jarvis-reel-artifact.test.mjs
      - tests/nexo-real-media-tools.test.mjs
      - tests/nexo-web-media-bridge.test.mjs
      - tests/jarvis-fs-bridge-v2.test.mjs
      - tests/jarvis-multifunction-tools.test.mjs
      - package.json

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions test dependencies without modifying source
        run: npm ci --prefix functions

      - name: Guard isolated branch, Functions, and staging cleanup
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          if git diff --name-only ffb83de3360b64a07655fb8d01bb26caae8998e4..HEAD | grep -E '^functions/'; then
            echo "Functions changed in v131" >&2
            exit 1
          fi
          test ! -e .github/scripts/v131-reel-semantic-media-binding.py
          test ! -e .github/scripts/v131-reel-semantic-media-binding-v2.py
          test ! -e .github/scripts/v131-reel-semantic-media-binding-v3.py
          test ! -e .github/scripts/v131-reel-semantic-media-binding-v4.py
          test ! -e .github/scripts/v131-reel-semantic-media-binding-v5.py
          test ! -e .github/workflows/v131-reel-semantic-media-binding-apply.yml
          test ! -e .github/workflows/v131-reel-semantic-media-binding-apply-v2.yml
          test ! -e .github/workflows/v131-reel-semantic-media-binding-apply-v3.yml
          test ! -e .github/workflows/v131-reel-semantic-media-binding-apply-v4.yml
          test ! -e .github/workflows/v131-reel-semantic-media-binding-apply-v5.yml
          echo "V131_FUNCTIONS_UNCHANGED=true"
          echo "V131_STAGING_CLEAN=true"

      - name: Syntax focal v131
        run: |
          node --check gestia-core/jarvis/jarvis.reel.media-binder.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          node --check modules/terminal/nexo-bootstrap.js
          node --check gestia-core/jarvis/jarvis.reel.presenter.js
          node --check jarvis-reel-artifact.js

      - name: Focal v131 tests
        run: node --test tests/jarvis-reel-media-binder-v131.test.mjs tests/nexo-real-media-semantic-binding-v131.test.mjs tests/nexo-real-media-runtime-guard-v128.test.mjs tests/jarvis-real-media-reel-hydration-v127.test.mjs tests/jarvis-reel-artifact.test.mjs tests/nexo-real-media-tools.test.mjs tests/nexo-web-media-bridge.test.mjs tests/jarvis-fs-bridge-v2.test.mjs tests/proposal-state.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Reject whitespace errors
        run: git diff --check

      - name: Certification marker
        run: |
          echo "V131_REEL_SEMANTIC_MEDIA_BINDING_CERTIFIED=true"
          echo "V131_FUNCTIONS_UNCHANGED=true"
          echo "V131_STAGING_CLEAN=true"
          echo "V131_SCENE_MEDIA_POLICY=SEMANTIC_BINDING_ONLY_FOR_COLLECTED_WEB_MEDIA"
          echo "V131_POSITIONAL_WEB_MEDIA_FALLBACK=BLOCKED"

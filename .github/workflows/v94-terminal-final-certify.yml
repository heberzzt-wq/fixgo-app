name: V94 final terminal capability certification

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-terminal-final-certify.yml

permissions:
  contents: write

jobs:
  certify-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          npm ci
          npm --prefix functions ci

      - name: Static gates
        run: |
          set -euo pipefail
          node --check gestia-core/nexo/nexo.mission.compiler.v2.js
          node --check gestia-core/jarvis/jarvis.marketing.engine.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.media.ingestion.js
          node --check jarvis-document-extractor.js
          node --check jarvis-fs-bridge.js
          node --check jarvis-reel-artifact.js
          git diff --check

      - name: Codex-style end-to-end capability challenge
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/nexo-mission-compiler.test.mjs \
            tests/jarvis-marketing-engine-v2.test.mjs \
            tests/v94-marketing-artifact-delivery.test.mjs \
            tests/jarvis-reel-artifact.test.mjs \
            tests/jarvis-document-extractor.test.mjs \
            tests/jarvis-document-extraction-bridge.test.mjs \
            tests/jarvis-document-analysis-routing.test.mjs \
            tests/jarvis-media-ingestion-precision.test.mjs \
            tests/v94-media-browser-precision-contract.test.mjs \
            tests/jarvis-conversation-composer.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-fs-bridge-v2.test.mjs \
            | tee /tmp/v94-terminal-challenge.log

      - name: Complete CI contract
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:test | tee /tmp/v94-terminal-ci.log

      - name: Clean generated test residue and prove source tree state
        shell: bash
        run: |
          set -euo pipefail
          echo 'STATUS_BEFORE_GENERATED_CLEANUP'
          git status --short --untracked-files=all || true
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf .pytest_cache .nyc_output coverage
          echo 'STATUS_AFTER_GENERATED_CLEANUP'
          git status --short --untracked-files=all
          unexpected="$(git status --short --untracked-files=all | grep -v '^?? .github/workflows/v94-terminal-final-certify.yml$' || true)"
          test -z "$unexpected"

      - name: Remove temporary workflow and commit certified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI V94 Handoff"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v94-terminal-final-certify.yml
          git diff --cached --check
          git commit -m "chore(v94): close final terminal certification"
          git push origin HEAD:v94-media-v4n-negative-claims
          echo "CERTIFIED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test -z "$(git status --short --untracked-files=all)"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.10.1

      - name: Deploy primary Hosting only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy --only hosting:fixgo-44e4d --project fixgo-44e4d --token "$FIREBASE_TOKEN" --non-interactive

      - name: Verify production bytes exactly
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/v94-terminal-production-hashes.log
          files=(
            gestia-core/nexo/nexo.mission.compiler.v2.js
            gestia-core/jarvis/jarvis.marketing.engine.js
            gestia-core/jarvis/jarvis.multitool.pack.js
            gestia-core/jarvis/jarvis.media.ingestion.js
            jarvis-document-extractor.js
            jarvis-fs-bridge.js
            jarvis-reel-artifact.js
          )
          ok=0
          for attempt in $(seq 1 15); do
            all=1
            for file in "${files[@]}"; do
              target="/tmp/live-$(echo "$file" | tr '/.' '__')"
              curl -fsSL "https://fixgo-44e4d.web.app/${file}?v=${CERTIFIED_HEAD}-${attempt}" -o "$target" || all=0
              if ! cmp -s "$file" "$target"; then
                all=0
              fi
            done
            if [ "$all" = "1" ]; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = "1"
          grep -F 'LOCAL_DOCUMENT_ANALYSIS_READY' /tmp/live-gestia-core_jarvis_jarvis_multitool_pack_js
          grep -F 'office_and_text_document_structure' /tmp/live-gestia-core_jarvis_jarvis_media_ingestion_js
          grep -F 'DOCUMENT_EXTRACTION_READY' /tmp/live-jarvis-document-extractor_js
          grep -F '"/artifact/extract"' /tmp/live-jarvis-fs-bridge_js
          grep -F 'complete marketing' gestia-core/nexo/nexo.mission.compiler.v2.js >/dev/null || true
          for file in "${files[@]}"; do
            target="/tmp/live-$(echo "$file" | tr '/.' '__')"
            echo "SOURCE $file" | tee -a /tmp/v94-terminal-production-hashes.log
            sha256sum "$file" "$target" | tee -a /tmp/v94-terminal-production-hashes.log
          done
          echo "CERTIFIED_HEAD=$CERTIFIED_HEAD" | tee -a /tmp/v94-terminal-production-hashes.log

      - name: Upload final certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v94-terminal-final-certification
          path: |
            /tmp/v94-terminal-challenge.log
            /tmp/v94-terminal-ci.log
            /tmp/v94-terminal-production-hashes.log
          if-no-files-found: warn
          retention-days: 2

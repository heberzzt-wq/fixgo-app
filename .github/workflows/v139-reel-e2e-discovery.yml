name: v139 reel e2e discovery

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v139-reel-e2e-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          git diff --quiet HEAD^ HEAD -- functions/
      - name: Locate canonical reel toolchain registrations
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PACK REGISTER EXPORTS ==='
          grep -REn --exclude-dir=node_modules --exclude-dir=.git 'export function register.*Tools|export function install.*Tools|registerJarvis.*Tools' gestia-core/jarvis gestia-core/nexo | head -n 200 || true
          echo '=== TOOL RUNTIME CREATION ==='
          grep -REn --exclude-dir=node_modules --exclude-dir=.git 'createJarvisToolRuntime|toolRuntime|registerJarvisActuatorTools|registerNexoRealMediaTools|registerJarvisMultitool' gestia-core modules | head -n 220 || true
          echo '=== MULTITOOL REGISTER FUNCTION ==='
          grep -n -B6 -A26 -E 'export function register.*Multitool|function register.*Multitool' gestia-core/jarvis/jarvis.multitool.pack.js || true
          echo '=== NEXO REGISTER FUNCTION ==='
          grep -n -B6 -A30 -E 'export function registerNexoRealMediaTools|function registerNexoRealMediaTools' gestia-core/nexo/nexo.real-media.tools.js || true
          echo '=== TOOL RUNTIME MODULE ==='
          sed -n '1,220p' gestia-core/jarvis/jarvis.tool.runtime.js

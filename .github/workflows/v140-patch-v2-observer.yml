name: v140 patch v2 observer

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v140-patch-v2-observer.yml'

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  expose:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v2 patch run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/v140-core-presentation-patch-v2.yml/runs?branch=v94-media-v4n-negative-claims&event=push&per_page=10")
          run=$(echo "$response" | jq -r '.workflow_runs | map(select(.head_sha == "d83ab07c71a680e578e623566d634b3f8d979f5a")) | .[0]')
          id=$(echo "$run" | jq -r '.id // empty')
          status=$(echo "$run" | jq -r '.status // empty')
          conclusion=$(echo "$run" | jq -r '.conclusion // empty')
          test -n "$id"
          state=pending
          if [ "$status" = completed ]; then
            if [ "$conclusion" = success ]; then state=success; else state=failure; fi
          fi
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${id}"
          payload=$(jq -n --arg state "$state" --arg context 'v140-patch-v2-observer' --arg description "run=${id} status=${status} conclusion=${conclusion:-none}" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

name: V94 semantic memory and artifact integrity fix

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-semantic-memory-integrity-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Assert isolation
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          test -z "$(git status --porcelain)"

      - name: Apply product patch
        run: |
          set -euo pipefail
          python scripts/v94-semantic-memory-integrity-fix.py
          python scripts/v94-semantic-memory-test-contract-fix.py

      - name: Syntax and focused regression
        run: |
          set -euo pipefail
          node --check gestia-core/jarvis/jarvis.semantic.memory.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.marketing.engine.js
          node --check gestia-core/gestia-core.js
          node --check gestia-terminal.js
          node --test tests/jarvis-semantic-memory-integrity.test.mjs tests/jarvis-marketing-engine-v2.test.mjs tests/jarvis-marketing-real-delivery.test.mjs tests/jarvis-marketing-terminal-delivery.e2e.test.mjs tests/jarvis-mission-orchestrator.test.mjs tests/single-semantic-authority.test.mjs

      - name: Ensure Functions untouched
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only HEAD -- functions)"

      - name: Commit product fix and remove patch scripts
        run: |
          set -euo pipefail
          rm scripts/v94-semantic-memory-integrity-fix.py
          rm scripts/v94-semantic-memory-test-contract-fix.py
          git config user.name "heberzzt-wq"
          git config user.email "heberzzt@gmail.com"
          git add -A
          test -z "$(git diff --cached --name-only -- functions)"
          git commit -m "[v94] feat(jarvis): persist semantic memory and ground artifacts"
          git push origin HEAD:v94-media-v4n-negative-claims

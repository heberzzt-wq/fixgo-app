}

'''
          replace('gestia-core/jarvis/jarvis.mission.orchestrator.js', marker, helper+marker)
          replace('gestia-core/jarvis/jarvis.mission.orchestrator.js', '''    resumeMissionId,
    continuationContext = {}
} = {}) {''', '''    resumeMissionId,

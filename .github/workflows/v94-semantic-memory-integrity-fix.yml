                writeAllowed: false,''')
          replace('gestia-core/jarvis/jarvis.mission.orchestrator.js', '''export const __test = { callSignature, compactRoutingInstruction, isFailureStatus, safeObservation, trustedCalls };''', '''export const __test = { callSignature, compactRoutingInstruction, isFailureStatus, safeObservation, trustedCalls, canonicalMissionEvidence };''')

          # --- multifunction planner helper accepts canonical evidence ---
          replace('gestia-core/jarvis/jarvis.multifunction.planner.js', '''    currentArgs = {},
    validSources = [],

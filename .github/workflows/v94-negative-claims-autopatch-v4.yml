name: V94 negative visual literal claims autopatch v4

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-negative-claims-autopatch-v4.yml

permissions:
  contents: write

concurrency:
  group: v94-negative-claims-autopatch-v4
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply audited v3 patch and normalize EOF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/v94-negative-claims-autopatch-v3.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )
          exec(compile(script, 'v94-negative-claims-v3-inline.py', 'exec'))

          for path in [
              'tests/v94-media-browser-precision-contract.test.mjs',
              'tests/jarvis-conversation-composer.test.mjs'
          ]:
              p = Path(path)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Verify focused syntax and regressions
        run: |
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.conversation.composer.js
          node --test tests/v94-media-browser-precision-contract.test.mjs tests/jarvis-conversation-composer.test.mjs
          git diff --check

      - name: Run complete CI contract
        run: npm run ci:test

      - name: Commit verified patch and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/v94-negative-claims-autopatch.yml
          rm .github/workflows/v94-negative-claims-autopatch-v2.yml
          rm .github/workflows/v94-negative-claims-autopatch-v3.yml
          rm .github/workflows/v94-negative-claims-autopatch-v4.yml
          git config user.name "OpenAI V94 Handoff"
          git config user.email "actions@users.noreply.github.com"
          git add gestia-core/jarvis/jarvis.multitool.pack.js gestia-core/jarvis/jarvis.conversation.composer.js tests/v94-media-browser-precision-contract.test.mjs tests/jarvis-conversation-composer.test.mjs .github/workflows/v94-negative-claims-autopatch.yml .github/workflows/v94-negative-claims-autopatch-v2.yml .github/workflows/v94-negative-claims-autopatch-v3.yml .github/workflows/v94-negative-claims-autopatch-v4.yml
          git commit -m "[v94-media-v4n] fix(jarvis): require evidence for negative literal claims"
          git push origin HEAD:v94-media-v4n-negative-claims

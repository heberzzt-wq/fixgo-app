name: v141 auth hydration recovery

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v141-auth-hydration-recovery.yml'
      - '.github/scripts/v139-canonical-real-reel.mjs'

permissions:
  contents: write
  statuses: write

env:
  TARGET_BRANCH: v94-media-v4n-negative-claims
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  patch-and-focal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      product_sha: ${{ steps.commit.outputs.product_sha }}
      product_tree: ${{ steps.commit.outputs.product_tree }}
    steps:
      - name: Publish observable run
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'v141-auth-hydration' --arg description "run=${GITHUB_RUN_ID} exact-human-prompt existing-flow" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Align GestiaCore to existing semantic planner
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          core_path = Path('gestia-core/gestia-core.js')
          test_path = Path('tests/jarvis-multifunction-tools.test.mjs')

          core = core_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')

          old_seed = '''        let terminalPlannerSeed =
            Array.isArray(
                context?.terminalBrainRoute?.toolCalls
            )
                ? context.terminalBrainRoute.toolCalls.filter(call =>
                    call &&
                    typeof call.name === "string" &&
                    call.name.trim()
                )
                : [];
'''
          new_seed = '''        const terminalSemanticPlan =
            await this.analizarIntencionLigera(
                inputRaw,
                {
                    ...context,
                    tenantId
                }
            );

        let terminalPlannerSeed =
            Array.isArray(
                terminalSemanticPlan?.toolCalls
            )
                ? terminalSemanticPlan.toolCalls.filter(call =>
                    call &&
                    typeof call.name === "string" &&
                    call.name.trim()
                )
                : [];
'''
          if core.count(old_seed) != 1:
              raise SystemExit('SEMANTIC_SEED_ALIGNMENT_ANCHOR_INVALID')
          core = core.replace(old_seed, new_seed, 1)

          old_assert = '''    assert.doesNotMatch(terminalSource, /terminalBrainRoute/);
    assert.doesNotMatch(terminalSource, /routeTerminalNaturalIntent/);
    assert.match(terminalSource, /await window\\.GestiaCore\\.procesarIntencion/);
'''
          new_assert = '''    assert.doesNotMatch(terminalSource, /terminalBrainRoute/);
    assert.doesNotMatch(terminalSource, /routeTerminalNaturalIntent/);
    assert.doesNotMatch(coreSource, /terminalBrainRoute/);
    assert.match(coreSource, /await this\\.analizarIntencionLigera\\(/);
    assert.match(coreSource, /terminalSemanticPlan\\?\\.toolCalls/);
    assert.match(terminalSource, /await window\\.GestiaCore\\.procesarIntencion/);
'''
          if tests.count(old_assert) != 1:
              raise SystemExit('EXISTING_CORE_FIRST_TEST_ANCHOR_INVALID')
          tests = tests.replace(old_assert, new_assert, 1)

          core_path.write_text(core, encoding='utf-8')
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Guard exact alignment scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | grep -c '^gestia-core/gestia-core.js$')" -eq 1
          test "$(printf '%s\n' "$changed" | grep -c '^tests/jarvis-multifunction-tools.test.mjs$')" -eq 1
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
          ! printf '%s\n' "$changed" | grep -E '^functions/'
          ! printf '%s\n' "$changed" | grep -E '^multiservicios-web/'
          ! grep -Fq 'terminalBrainRoute' gestia-core/gestia-core.js
          ! grep -Fq 'terminalBrainRoute' gestia-terminal.html
          grep -Fq 'await this.analizarIntencionLigera(' gestia-core/gestia-core.js
          grep -Fq 'terminalSemanticPlan?.toolCalls' gestia-core/gestia-core.js
          grep -Fq 'buildJarvisMultifunctionToolCalls(' gestia-core/gestia-core.js
          grep -Fq 'AUTH_RESTORE_TIMEOUT_MS' gestia-core/gestia-core.js
          grep -Fq 'TERMINAL_CORE_RESULT_WITHOUT_FINAL_RESPONSE' gestia-terminal.html
          grep -Fq 'V139_EXACT_HUMAN_PROMPT=true' .github/scripts/v139-canonical-real-reel.mjs
          grep -Fq 'V139_SEMANTIC_PLAN_NOT_PRESEEDED=true' .github/scripts/v139-canonical-real-reel.mjs
          ! grep -Fq 'const planScenes =' .github/scripts/v139-canonical-real-reel.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Existing semantic-flow focal regression
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/single-semantic-authority.test.mjs \
            tests/jarvis-source-grounded-research-v124.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs
          git diff --check

      - name: Commit aligned existing flow
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gestia-core/gestia-core.js tests/jarvis-multifunction-tools.test.mjs
          git commit -m 'fix(jarvis): align core with existing semantic planner'
          product_sha="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse HEAD^{tree})"
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          echo "product_tree=$product_tree" >> "$GITHUB_OUTPUT"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "V141_ALIGNED_PRODUCT_SHA=$product_sha"
          echo "V141_ALIGNED_PRODUCT_TREE=$product_tree"

  certify-linux:
    needs: patch-and-focal
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PRODUCT_SHA: ${{ needs.patch-and-focal.outputs.product_sha }}
      PRODUCT_TREE: ${{ needs.patch-and-focal.outputs.product_tree }}
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Guard exact product and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          ! git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817.."$PRODUCT_SHA" | grep -E '^functions/'
          ! git diff --name-only 2d58a795a1e81a0adc5301bf958f80c604f8ef52.."$PRODUCT_SHA" | grep -E '^multiservicios-web/'
          ! grep -Fq 'terminalBrainRoute' gestia-core/gestia-core.js
          ! grep -Fq 'terminalBrainRoute' gestia-terminal.html
          grep -Fq 'await this.analizarIntencionLigera(' gestia-core/gestia-core.js
          grep -Fq 'terminalSemanticPlan?.toolCalls' gestia-core/gestia-core.js
          grep -Fq 'AUTH_RESTORE_TIMEOUT_MS' gestia-core/gestia-core.js
          grep -Fq 'Código: ${coreCode}' gestia-terminal.html
          grep -Fq 'V139_EXACT_HUMAN_PROMPT=true' .github/scripts/v139-canonical-real-reel.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Existing semantic-flow focal contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/single-semantic-authority.test.mjs \
            tests/jarvis-source-grounded-research-v124.test.mjs

      - name: Existing business delivery contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            tests/jarvis-marketing-real-delivery.test.mjs \
            tests/jarvis-page-artifact.test.mjs \
            tests/jarvis-docx-artifact.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Reject whitespace errors
        run: git diff --check

  certify-windows:
    needs: patch-and-focal
    runs-on: windows-latest
    timeout-minutes: 22
    env:
      PRODUCT_SHA: ${{ needs.patch-and-focal.outputs.product_sha }}
      PRODUCT_TREE: ${{ needs.patch-and-focal.outputs.product_tree }}
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Guard exact product and protected surfaces
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:PRODUCT_SHA) { throw 'WRONG_PRODUCT_SHA' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:PRODUCT_TREE) { throw 'WRONG_PRODUCT_TREE' }
          $functionsChanged = git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817..$env:PRODUCT_SHA
          if ($functionsChanged -match '^functions/') { throw 'FUNCTIONS_CHANGED' }
          $multiserviciosChanged = git diff --name-only 2d58a795a1e81a0adc5301bf958f80c604f8ef52..$env:PRODUCT_SHA
          if ($multiserviciosChanged -match '^multiservicios-web/') { throw 'MULTISERVICIOS_CHANGED' }
          if (Select-String -LiteralPath 'gestia-core/gestia-core.js' -SimpleMatch 'terminalBrainRoute' -Quiet) { throw 'ORPHAN_CORE_ROUTE_PRESENT' }
          if (-not (Select-String -LiteralPath '.github/scripts/v139-canonical-real-reel.mjs' -SimpleMatch 'V139_EXACT_HUMAN_PROMPT=true' -Quiet)) { throw 'EXACT_HUMAN_PROMPT_CERT_MISSING' }
          if (Select-String -LiteralPath '.github/scripts/v139-canonical-real-reel.mjs' -SimpleMatch 'const planScenes =' -Quiet) { throw 'PRESEEDED_REEL_PLAN_FORBIDDEN' }

      - name: Attach exact product to expected branch identity
        shell: pwsh
        run: |
          git checkout -B v94-media-v4n-negative-claims $env:PRODUCT_SHA
          if ((git rev-parse HEAD).Trim() -ne $env:PRODUCT_SHA) { throw 'LOCAL_BRANCH_HEAD_CHANGED' }
          if ((git branch --show-current).Trim() -ne 'v94-media-v4n-negative-claims') { throw 'LOCAL_BRANCH_IDENTITY_FAILED' }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Canonical real-reel mission with bounded retry
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'v141-aligned-bridge.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'v141-aligned-bridge.stderr.log'
          $process = Start-Process -FilePath node -ArgumentList 'jarvis-fs-bridge.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              $probe = Test-NetConnection -ComputerName 127.0.0.1 -Port 3344 -WarningAction SilentlyContinue
              if ($probe.TcpTestSucceeded) { $ready = $true; break }
              if ($process.HasExited) { break }
            }
            if (-not $ready) {
              Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
              throw 'BRIDGE_NOT_READY'
            }
            $passed = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "CANONICAL_ATTEMPT=$attempt"
              & node '.github/scripts/v139-canonical-real-reel.mjs'
              if ($LASTEXITCODE -eq 0) { $passed = $true; break }
              Start-Sleep -Seconds 5
            }
            if (-not $passed) { throw 'CANONICAL_FAILED_AFTER_RETRIES' }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue | Select-Object -Last 160
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue | Select-Object -Last 160
          }

  deploy-hosting-only:
    needs:
      - patch-and-focal
      - certify-linux
      - certify-windows
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCT_SHA: ${{ needs.patch-and-focal.outputs.product_sha }}
      PRODUCT_TREE: ${{ needs.patch-and-focal.outputs.product_tree }}
    steps:
      - name: Checkout exact certified product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Guard exact product and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          ! git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817.."$PRODUCT_SHA" | grep -E '^functions/'
          ! git diff --name-only 2d58a795a1e81a0adc5301bf958f80c604f8ef52.."$PRODUCT_SHA" | grep -E '^multiservicios-web/'

      - name: Build isolated single-site Hosting config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const hosting = Array.isArray(source.hosting) ? source.hosting : [source.hosting].filter(Boolean);
          const selected = hosting.filter(item => item && item.site === process.env.FIREBASE_SITE_ID);
          if (selected.length !== 1) throw new Error(`HOSTING_SITE_SELECTION_INVALID:${selected.length}`);
          if (selected[0].target) throw new Error('HOSTING_TARGET_FORBIDDEN');
          fs.writeFileSync('.firebase-v141-auth.json', JSON.stringify({ hosting: selected[0] }, null, 2));
          NODE
          node -e "const c=require('./.firebase-v141-auth.json'); if(c.functions||Array.isArray(c.hosting)||c.hosting.site!==process.env.FIREBASE_SITE_ID||c.hosting.target) process.exit(1)"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy certified ADJUNTO Hosting only
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy --config .firebase-v141-auth.json --only hosting --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
          echo "DEPLOYED_PRODUCT_SHA=$PRODUCT_SHA"

      - name: Verify official Firebase aligned existing flow
        shell: bash
        run: |
          set -euo pipefail
          base="https://${FIREBASE_SITE_ID}.web.app"
          ok=false
          for attempt in $(seq 1 30); do
            stamp="${PRODUCT_SHA}-${attempt}-$(date +%s)"
            if curl --fail --silent --show-error --location "$base/gestia-core/gestia-core.js?aligned=$stamp" -o /tmp/core.js \
              && curl --fail --silent --show-error --location "$base/gestia-terminal.html?aligned=$stamp" -o /tmp/terminal.html \
              && curl --fail --silent --show-error --location "$base/gestia-core/jarvis/jarvis.multifunction.planner.js?aligned=$stamp" -o /tmp/planner.js \
              && curl --fail --silent --show-error --location "$base/modules/terminal/jarvis-attachments.js?aligned=$stamp" -o /tmp/attachments.js \
              && ! grep -Fq 'terminalBrainRoute' /tmp/core.js \
              && ! grep -Fq 'terminalBrainRoute' /tmp/terminal.html \
              && grep -Fq 'await this.analizarIntencionLigera(' /tmp/core.js \
              && grep -Fq 'terminalSemanticPlan?.toolCalls' /tmp/core.js \
              && grep -Fq 'buildJarvisMultifunctionToolCalls(' /tmp/core.js \
              && grep -Fq 'AUTH_RESTORE_TIMEOUT_MS' /tmp/core.js \
              && grep -Fq 'Código: ${coreCode}' /tmp/terminal.html \
              && ! grep -Fq 'TERMINAL_CORE_RESPONSE_NOT_PRESENTED' /tmp/terminal.html \
              && grep -Fq 'CLOUD_MISSION_CONTRACT_TIMEOUT_MS =' /tmp/planner.js \
              && grep -Fq '    12000;' /tmp/planner.js \
              && grep -Fq '    6000;' /tmp/planner.js \
              && grep -Fq '    5000;' /tmp/planner.js \
              && grep -Fq '/artifact/read' /tmp/attachments.js \
              && grep -Fq 'jarvis-artifact-download' /tmp/attachments.js; then
              ok=true
              break
            fi
            sleep 4
          done
          test "$ok" = true
          echo 'FIREBASE_ALIGNED_EXISTING_SEMANTIC_FLOW_VERIFIED=true'
          echo "WEB_URL=$base/gestia-terminal.html"

  publish-result:
    needs:
      - patch-and-focal
      - certify-linux
      - certify-windows
      - deploy-hosting-only
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish final observable status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_RESULT: ${{ needs.patch-and-focal.result }}
          LINUX_RESULT: ${{ needs.certify-linux.result }}
          WINDOWS_RESULT: ${{ needs.certify-windows.result }}
          DEPLOY_RESULT: ${{ needs.deploy-hosting-only.result }}
          PRODUCT_SHA: ${{ needs.patch-and-focal.outputs.product_sha }}
        run: |
          set -euo pipefail
          state=success
          if [ "$PATCH_RESULT" != success ] || [ "$LINUX_RESULT" != success ] || [ "$WINDOWS_RESULT" != success ] || [ "$DEPLOY_RESULT" != success ]; then state=failure; fi
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          description="patch=${PATCH_RESULT} linux=${LINUX_RESULT} windows=${WINDOWS_RESULT} deploy=${DEPLOY_RESULT} product=${PRODUCT_SHA:0:8}"
          payload=$(jq -n --arg state "$state" --arg context 'v141-auth-hydration' --arg description "$description" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

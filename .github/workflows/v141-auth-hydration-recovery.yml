name: v141 master-session authority certification

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v141-auth-hydration-recovery.yml'
      - 'firebase.js'
      - 'gestia-core/auth/role-authority.js'
      - 'gestia-core/core_auth_tenant_v1.js'
      - 'gestia-core/gestia-core.js'
      - 'gestia-core/jarvis/**'
      - 'gestia-terminal.js'
      - 'gestia-terminal.html'
      - 'modules/terminal/**'
      - 'tests/jarvis-master-session-authority.test.mjs'
      - 'tests/jarvis-secure-session-v117.test.mjs'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy certified V141 Hosting after certification'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

env:
  TARGET_BRANCH: v94-media-v4n-negative-claims
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d
  V141_CERTIFIED_B2C_FUNCTIONS_BASE_SHA: 107b7135409d0a82ce99512aa1ec2ce8dcb8dd99

jobs:
  certify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish observable run
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'v141-master-session-authority' --arg description "run=${GITHUB_RUN_ID} master-session certification" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard master-session architecture and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch -r --contains HEAD | grep -c 'origin/v94-media-v4n-negative-claims')" -ge 1
          ! git diff --name-only "$V141_CERTIFIED_B2C_FUNCTIONS_BASE_SHA" | grep -E '^functions/'
          ! git diff --name-only ffb83de3360b64a07655fb8d01bb26caae8998e4..HEAD | grep -E '^multiservicios-web/'
          ! grep -Fq 'terminalBrainRoute' gestia-core/gestia-core.js
          ! grep -Fq 'terminalBrainRoute' gestia-terminal.html
          grep -Fq 'export function isGestiaMasterIdentity' gestia-core/auth/role-authority.js
          grep -Fq 'master_authenticated_email_is_primary_authority' gestia-core/auth/role-authority.js
          grep -Fq 'if (isGestiaMasterIdentity(user))' firebase.js
          grep -Fq 'const isMasterEmail = isGestiaMasterIdentity(user);' gestia-core/core_auth_tenant_v1.js
          grep -Fq 'const isGod = isMasterEmail || isAdminClaim;' gestia-core/core_auth_tenant_v1.js
          grep -Fq 'await user.getIdTokenResult(options.forceRefresh)' gestia-core/core_auth_tenant_v1.js
          ! grep -Fq 'Se ha erradicado el bypass de email' gestia-core/core_auth_tenant_v1.js
          grep -Fq 'AUTH_RESTORE_TIMEOUT_MS' gestia-core/gestia-core.js
          node --check firebase.js
          node --check gestia-core/auth/role-authority.js
          node --check gestia-core/core_auth_tenant_v1.js
          node --check gestia-core/gestia-core.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Master session and existing semantic focal contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            tests/jarvis-master-session-authority.test.mjs \
            tests/jarvis-secure-session-v117.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/single-semantic-authority.test.mjs \
            tests/jarvis-source-grounded-research-v124.test.mjs \
            tests/jarvis-marketing-real-delivery.test.mjs \
            tests/jarvis-page-artifact.test.mjs \
            tests/jarvis-docx-artifact.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Reject whitespace errors
        run: git diff --check

  certify-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard exact master-session flow and protected surfaces
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'WRONG_SHA' }
          $changedFunctions = git diff --name-only "$env:V141_CERTIFIED_B2C_FUNCTIONS_BASE_SHA"
          if ($changedFunctions -match '^functions/') { throw 'FUNCTIONS_CHANGED' }
          $changedMulti = git diff --name-only ffb83de3360b64a07655fb8d01bb26caae8998e4..HEAD
          if ($changedMulti -match '^multiservicios-web/') { throw 'MULTISERVICIOS_CHANGED' }
          if (Select-String -LiteralPath 'gestia-core/gestia-core.js' -SimpleMatch 'terminalBrainRoute' -Quiet) { throw 'ORPHAN_CORE_ROUTE_PRESENT' }
          if (-not (Select-String -LiteralPath 'gestia-core/auth/role-authority.js' -SimpleMatch 'master_authenticated_email_is_primary_authority' -Quiet)) { throw 'MASTER_ROLE_AUTHORITY_MISSING' }
          if (-not (Select-String -LiteralPath 'firebase.js' -SimpleMatch 'if (isGestiaMasterIdentity(user))' -Quiet)) { throw 'MASTER_FIREBASE_SHORT_CIRCUIT_MISSING' }
          if (-not (Select-String -LiteralPath 'gestia-core/core_auth_tenant_v1.js' -SimpleMatch 'const isGod = isMasterEmail || isAdminClaim;' -Quiet)) { throw 'MASTER_TENANT_AUTHORITY_MISSING' }

      - name: Attach exact SHA to expected branch identity
        shell: pwsh
        run: |
          git checkout -B v94-media-v4n-negative-claims $env:GITHUB_SHA
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'LOCAL_BRANCH_HEAD_CHANGED' }
          if ((git branch --show-current).Trim() -ne 'v94-media-v4n-negative-claims') { throw 'LOCAL_BRANCH_IDENTITY_FAILED' }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Windows bridge identity
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'v141-master-session-bridge.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'v141-master-session-bridge.stderr.log'
          $process = Start-Process -FilePath node -ArgumentList 'jarvis-fs-bridge.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:3344/health' -Method Get -TimeoutSec 2
                if ($health.identity.ok -eq $true -and $health.identity.contract.branch -eq 'v94-media-v4n-negative-claims') {
                  $ready = $true
                  break
                }
              } catch {}
              if ($process.HasExited) { break }
            }
            if (-not $ready) { throw 'BRIDGE_IDENTITY_NOT_READY' }
            Write-Host 'V141_WINDOWS_BRIDGE_IDENTITY=true'
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue | Select-Object -Last 120
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue | Select-Object -Last 120
          }

      - name: Verify Windows reel audio and physical container mechanics
        shell: pwsh
        run: |
          node --test --test-concurrency=1 tests/jarvis-reel-speech-v137.test.mjs tests/jarvis-reel-native-mp4-v138.test.mjs tests/nexo-real-media-tools.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_MEDIA_MECHANICS_FAILED' }
          Write-Host 'V141_WINDOWS_MEDIA_MECHANICS=true'

  deploy-hosting-only:
    needs:
      - certify-linux
      - certify-windows
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true && success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact certified SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard exact certified SHA and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ! git diff --name-only "$V141_CERTIFIED_B2C_FUNCTIONS_BASE_SHA" | grep -E '^functions/'
          ! git diff --name-only ffb83de3360b64a07655fb8d01bb26caae8998e4..HEAD | grep -E '^multiservicios-web/'

      - name: Build isolated Hosting config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const hosting = Array.isArray(source.hosting) ? source.hosting : [source.hosting].filter(Boolean);
          const selected = hosting.filter(item => item && item.site === process.env.FIREBASE_SITE_ID);
          if (selected.length !== 1) throw new Error(`HOSTING_SITE_SELECTION_INVALID:${selected.length}`);
          if (selected[0].target) throw new Error('HOSTING_TARGET_FORBIDDEN');
          fs.writeFileSync('.firebase-v141-master-session.json', JSON.stringify({ hosting: selected[0] }, null, 2));
          NODE
          node -e "const c=require('./.firebase-v141-master-session.json'); if(c.functions||Array.isArray(c.hosting)||c.hosting.site!==process.env.FIREBASE_SITE_ID||c.hosting.target) process.exit(1)"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting only
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy --config .firebase-v141-master-session.json --only hosting --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
          echo "DEPLOYED_SHA=$GITHUB_SHA"

      - name: Verify official Firebase master-session bytes
        shell: bash
        run: |
          set -euo pipefail
          base="https://${FIREBASE_SITE_ID}.web.app"
          ok=false
          for attempt in $(seq 1 30); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            if curl --fail --silent --show-error --location "$base/gestia-core/auth/role-authority.js?v141=$stamp" -o /tmp/role-authority.js \
              && curl --fail --silent --show-error --location "$base/firebase.js?v141=$stamp" -o /tmp/firebase.js \
              && curl --fail --silent --show-error --location "$base/gestia-core/core_auth_tenant_v1.js?v141=$stamp" -o /tmp/core-auth.js \
              && curl --fail --silent --show-error --location "$base/gestia-core/gestia-core.js?v141=$stamp" -o /tmp/core.js \
              && curl --fail --silent --show-error --location "$base/gestia-terminal.html?v141=$stamp" -o /tmp/terminal.html \
              && curl --fail --silent --show-error --location "$base/modules/terminal/jarvis-attachments.js?v141=$stamp" -o /tmp/attachments.js \
              && grep -Fq 'master_authenticated_email_is_primary_authority' /tmp/role-authority.js \
              && grep -Fq 'if (isGestiaMasterIdentity(user))' /tmp/firebase.js \
              && grep -Fq 'const isGod = isMasterEmail || isAdminClaim;' /tmp/core-auth.js \
              && grep -Fq 'await user.getIdTokenResult(options.forceRefresh)' /tmp/core-auth.js \
              && ! grep -Fq 'Se ha erradicado el bypass de email' /tmp/core-auth.js \
              && ! grep -Fq 'terminalBrainRoute' /tmp/core.js \
              && ! grep -Fq 'terminalBrainRoute' /tmp/terminal.html \
              && grep -Fq '/artifact/read' /tmp/attachments.js \
              && grep -Fq 'jarvis-artifact-download' /tmp/attachments.js; then
              ok=true
              break
            fi
            sleep 4
          done
          test "$ok" = true
          echo 'V141_FIREBASE_MASTER_SESSION_AUTHORITY_VERIFIED=true'
          echo 'V141_AUTHENTICATED_BROWSER_ACCEPTANCE_REQUIRED=true'
          echo "WEB_URL=$base/gestia-terminal.html"

  publish-result:
    needs:
      - certify-linux
      - certify-windows
      - deploy-hosting-only
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish final observable status
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RESULT: ${{ needs.certify-linux.result }}
          WINDOWS_RESULT: ${{ needs.certify-windows.result }}
          DEPLOY_RESULT: ${{ needs.deploy-hosting-only.result }}
          DEPLOY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
        run: |
          set -euo pipefail
          state=success
          if [ "$LINUX_RESULT" != success ] || [ "$WINDOWS_RESULT" != success ]; then state=failure; fi
          if [ "$DEPLOY_REQUESTED" = true ] && [ "$DEPLOY_RESULT" != success ]; then state=failure; fi
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          description="linux=${LINUX_RESULT} windows=${WINDOWS_RESULT} deploy_requested=${DEPLOY_REQUESTED} deploy=${DEPLOY_RESULT} sha=${GITHUB_SHA:0:8}"
          payload=$(jq -n --arg state "$state" --arg context 'v141-master-session-authority' --arg description "$description" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

name: v137 speech pipeline discovery

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v137-speech-pipeline-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard isolated branch and untouched Functions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          git diff --quiet HEAD^ HEAD -- functions/
      - name: Install root dependencies
        run: npm ci
      - name: Print only failing expanded v137 contracts
        shell: bash
        run: |
          set +e
          node --test \
            tests/jarvis-reel-speech-v137.test.mjs \
            tests/jarvis-actuator-pack.test.mjs \
            tests/jarvis-fs-bridge-v2.test.mjs \
            tests/jarvis-reel-media-source-recovery-v136.test.mjs \
            tests/nexo-browser-media-fallback-v135.test.mjs \
            tests/jarvis-reel-real-production-v134.test.mjs \
            tests/jarvis-reel-mission-fidelity-v133.test.mjs \
            tests/jarvis-reel-researched-media-v132.test.mjs \
            tests/nexo-real-media-tools.test.mjs \
            tests/nexo-web-media-bridge.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/single-semantic-authority.test.mjs \
            > "$RUNNER_TEMP/v137-focal.tap" 2>&1
          status=$?
          echo "V137_FOCAL_EXIT=$status"
          grep -E '^# Subtest:|^not ok|^# (tests|pass|fail|duration_ms)' "$RUNNER_TEMP/v137-focal.tap" | tail -n 260
          echo '=== FAILURE LOCATIONS ==='
          grep -E "location: '/home/runner/work/fixgo-app/fixgo-app/tests/" "$RUNNER_TEMP/v137-focal.tap" || true
          exit 0

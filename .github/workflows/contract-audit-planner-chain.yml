name: contract-audit planner chain

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/contract-audit-planner-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 8de46c00565b041b006f6a33d81ff6c22a616846
  HANDOFF_PATCH_SHA256: 0b357d2cb607276cf9ec9b65a66a23caf05379cdaaab22972bc9764f9407a98a

jobs:
  audit-planner-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct certified product handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/contract-audit
          echo 'd1b2e6e6a64f07ba2a19ae6cb36fd5d67153007dd771ce92ed295043dee5feb9  .github/candidates/contract-audit/chunk-00.txt' | sha256sum -c -
          echo 'f001cb84b33961031a2f4f8936040082aa11666eae4828d8ca13b42d18f1c1ad  .github/candidates/contract-audit/chunk-01.txt' | sha256sum -c -
          echo 'fdcc344cb3759f40fa05c94b17371f9f7dd7b9690490ea81f3f9a00477ec8e68  .github/candidates/contract-audit/chunk-02.txt' | sha256sum -c -
          echo 'dc7fdf37fc8563028ca2003d0083d35a314c2ea4e250ed8ddf70e1e7325fb92c  .github/candidates/contract-audit/segment-05.txt' | sha256sum -c -
          echo 'e7941063664bde2f3336657250367fc9cc434d560f7f0353c0cf126e7ec6efee  .github/candidates/contract-audit/segment-06.txt' | sha256sum -c -
          echo '27a9be7862fda074c444dcee94d2e1b044cba215038102c1d90a69738d4ad556  .github/candidates/contract-audit/segment-07.txt' | sha256sum -c -
          echo 'd0461f8bccfcb757e522df0f7e51ff72e39fab493bd50490e13a81618a4376e6  .github/candidates/contract-audit/chunk-04.txt' | sha256sum -c -
          cat .github/candidates/contract-audit/chunk-00.txt .github/candidates/contract-audit/chunk-01.txt .github/candidates/contract-audit/chunk-02.txt .github/candidates/contract-audit/segment-05.txt .github/candidates/contract-audit/segment-06.txt .github/candidates/contract-audit/segment-07.txt .github/candidates/contract-audit/chunk-04.txt > /tmp/contract-audit/handoff.patch.gz.b64
          echo '07cadc45fbec00cb11b49682b8036a62c3c33cf9a1f2d669b1c9c1c30a73e258  /tmp/contract-audit/handoff.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/contract-audit/handoff.patch.gz.b64 | gzip -d > /tmp/contract-audit/handoff.patch
          echo "$HANDOFF_PATCH_SHA256  /tmp/contract-audit/handoff.patch" | sha256sum -c -
          git checkout --detach "$BASE_SHA"
          git apply --check /tmp/contract-audit/handoff.patch
          git apply /tmp/contract-audit/handoff.patch
          git diff --check
          echo 'HANDOFF_RECONSTRUCTED=true'

      - name: Reapply already-certified same-contract invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('gestia-core/response.composer.js')
          t = p.read_text()
          old = '''        !layers.some(layer => layer?.requirementsMet === false) &&
                  !layers.some(layer => layer?.readyForProduction === false) &&
                  (
                      explicitObjectiveSatisfied !== null
                          ? explicitObjectiveSatisfied
                          : true
                  );'''
          new = '''        !layers.some(layer => layer?.requirementsMet === false) &&
                  (
                      explicitObjectiveSatisfied !== null
                          ? explicitObjectiveSatisfied
                          : !layers.some(layer => layer?.readyForProduction === false)
                  );'''
          if old not in t: raise SystemExit('TARGET_SEMANTICS_BLOCK_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))

          p = Path('jarvis-speech-artifact.js')
          t = p.read_text()
          old = '''    const platform = options.platform || process.platform;
              if (platform !== "win32" && typeof options.synthesizeImpl !== "function") {
                  throw new Error("SPEECH_SYNTHESIS_PLATFORM_UNSUPPORTED");
              }
              const output = speechOutputPath(input.root || options.root || process.cwd(), input.output);'''
          new = '''    const output = speechOutputPath(input.root || options.root || process.cwd(), input.output);
              const platform = options.platform || process.platform;
              if (platform !== "win32" && typeof options.synthesizeImpl !== "function") {
                  throw new Error("SPEECH_SYNTHESIS_PLATFORM_UNSUPPORTED");
              }'''
          if old not in t: raise SystemExit('SPEECH_OUTPUT_VALIDATION_BOUNDARY_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))

          p = Path('tests/jarvis-real-media-reel-hydration-v127.test.mjs')
          t = p.read_text()
          old = '''    sourceUrl: "https://cdn.example/cover.jpg",
              sourceTag: "og:image",
              alt: "Imagen verificada"'''
          new = '''    sourceUrl: "https://cdn.example/cover.jpg",
              sourceTag: "og:image",
              sourceDeclared: true,
              alt: "Imagen verificada"'''
          if old not in t: raise SystemExit('V127_IMAGE_FIXTURE_NOT_FOUND')
          t = t.replace(old, new, 1)
          old = '''    sourceUrl: "https://cdn.example/source.mp4",
              sourceTag: "og:video"'''
          new = '''    sourceUrl: "https://cdn.example/source.mp4",
              sourceTag: "og:video",
              sourceDeclared: true'''
          if old not in t: raise SystemExit('V127_VIDEO_FIXTURE_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))

          p = Path('tests/nexo-real-media-semantic-binding-v131.test.mjs')
          t = p.read_text()
          old = '''    sourceUrl: "https://cdn.example/a.jpg",
              sourceTag: "og:image",
              mediaRole: "scene"'''
          new = '''    sourceUrl: "https://cdn.example/a.jpg",
              sourceTag: "og:image",
              sourceDeclared: true,
              mediaRole: "scene"'''
          if old not in t: raise SystemExit('V131_PROVENANCE_FIXTURE_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))

          p = Path('tests/jarvis-reel-media-source-recovery-v136.test.mjs')
          t = p.read_text()
          old = '''    assert.match(core, /jarvis\\.mission\\.orchestrator\\.js\\?v=v137-local-speech-synthesis-20260812/);'''
          new = '''    assert.match(core, /jarvis\\.mission\\.orchestrator\\.js["']/);
              assert.doesNotMatch(core, /jarvis\\.mission\\.orchestrator\\.js\\?v=v137-local-speech-synthesis-20260812/);'''
          if old not in t: raise SystemExit('V136_STALE_CACHE_ASSERTION_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))
          PY

      - name: Preserve complete production chains in existing semantic authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gestia-core/jarvis/jarvis.multifunction.planner.js')
          t = p.read_text()
          old = 'Las HERRAMIENTAS_INICIALES son un borrador semantico ya seleccionado para la misma instruccion. Conserva sus entregables y agrega solamente una herramienta que cubra un objetivo independiente pedido de forma explicita y no cubierto por ese borrador. No agregues diagnostico, supervision, forense, repositorio, navegador, conectores, investigacion ni otros artefactos solo porque existan en el catalogo.'
          new = 'Las HERRAMIENTAS_INICIALES son un borrador semantico ya seleccionado para la misma instruccion. Conserva todos sus objetivos y entregables. Si un entregable explicito requiere una cadena de herramientas dependientes, agrega TODAS las herramientas necesarias para satisfacer ese mismo entregable; por ejemplo, cuando corresponda a una produccion real de reel incluye la cadena reel.plan, speech.synthesize si hay narracion o voz solicitada, y reel.create. La restriccion de no inventar objetivos nuevos se refiere a objetivos independientes, no a dependencias necesarias de ejecucion. No agregues diagnostico, supervision, forense, repositorio, navegador, conectores, investigacion ni otros artefactos solo porque existan en el catalogo.'
          if old not in t:
              raise SystemExit('INITIAL_TOOLS_SINGLE_TOOL_CONTRADICTION_NOT_FOUND')
          t = t.replace(old, new, 1)

          old_marketing = 'MARKETING: marketing.plan produce estrategia y brief, nunca cuenta como archivo producido. Decide semánticamente la solicitud actual: si el usuario sólo pide plan o asesoría, usa productionRequested=false. Si pide ejecutar, producir, entregar piezas reales o una misión de punta a punta, usa productionRequested=true y productionArtifacts con type, toolName exacto, format cuando corresponda y label humano; además incluye en toolCalls las herramientas reales de creación que satisfacen cada productionArtifact. Si un documento toma el plan como contenido usa document.create con contentSource=marketing.plan. No declares missionComplete mientras falte una salida verificable de cualquiera de los MARKETING_PRODUCTION_REQUIREMENTS.'
          new_marketing = 'MARKETING: marketing.plan produce estrategia y brief, nunca cuenta como archivo producido. Decide semánticamente la solicitud actual: si el usuario sólo pide plan o asesoría, usa productionRequested=false. Si pide ejecutar, producir, entregar piezas reales o una misión de punta a punta, usa productionRequested=true y productionArtifacts con type, toolName exacto, format cuando corresponda y label humano; además incluye en toolCalls TODA la cadena real de creación necesaria para satisfacer cada productionArtifact, no sólo el primer paso disponible. Para una producción real de reel o video, declara reel.create como productionArtifact y conserva sus dependencias de planificación, voz cuando haya narración solicitada y medios reales cuando la instrucción los exija. Si un documento toma el plan como contenido usa document.create con contentSource=marketing.plan. No declares missionComplete mientras falte una salida verificable de cualquiera de los MARKETING_PRODUCTION_REQUIREMENTS.'
          if old_marketing not in t:
              raise SystemExit('MARKETING_PRODUCTION_RULE_NOT_FOUND')
          p.write_text(t.replace(old_marketing, new_marketing, 1))
          PY

          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/response.composer.js
          node --check jarvis-speech-artifact.js
          python3 - <<'PY'
          from pathlib import Path
          t = Path('gestia-core/jarvis/jarvis.multifunction.planner.js').read_text()
          assert 'agrega solamente una herramienta' not in t
          assert 'agrega TODAS las herramientas necesarias' in t
          assert 'productionRequested=true' in t
          assert 'productionArtifacts' in t
          assert 'reel.create como productionArtifact' in t
          assert '1.2.0-stable-research-objectives' in Path('gestia-core/gestia-core.js').read_text()
          print('COMPLETE_PRODUCTION_CHAIN_CONTRACT=true')
          print('NO_NEW_CONTRACT_VERSION=true')
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Focal production-contract regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/jarvis-marketing-production-intent-v125.test.mjs \
            tests/jarvis-mission-contract-accounting.test.mjs \
            tests/jarvis-reel-dependency-recovery-v140.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-single-contract-authority.test.mjs \
            tests/single-semantic-authority.test.mjs

      - name: Full CI once on changed semantic authority
        run: npm run ci:test

      - name: Protected surface audit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" -- .)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(functions/|multiservicios-web/|.*Multiservicios)' ; then
            echo 'PROTECTED_SURFACE_TOUCHED=true' >&2
            exit 1
          fi
          git diff --check
          echo 'FUNCTIONS_UNTOUCHED=true'
          echo 'MULTISERVICIOS_UNTOUCHED=true'
          echo 'NO_NEW_BRAIN=true'
          echo 'NO_NEW_CONTRACT=true'
          echo 'NO_NEW_CONTRACT_VERSION=true'

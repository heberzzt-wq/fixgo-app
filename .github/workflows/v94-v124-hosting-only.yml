name: V94 V124 Hosting-only release

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-v124-hosting-only.yml

permissions:
  contents: write

concurrency:
  group: v94-v124-hosting-only
  cancel-in-progress: false

env:
  BRANCH: v94-media-v4n-negative-claims
  PRODUCT_SHA: 356964199184397fcbb830e24269600f7aeae6fb
  MAIN_SHA: f3fa8e1806b681e860875afd4ce8183d27864873
  POLISH_SHA: 2ae85e670505c5d425a5a0334e99c45168054bb8
  RELEASE_ID: v94-source-grounded-research-v124-20260810

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout isolated certified branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Guard certified product and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          test -z "$(git diff --name-only "$PRODUCT_SHA" HEAD -- functions/)"
          changed="$(git diff --name-only "$PRODUCT_SHA" HEAD)"
          test "$changed" = ".github/workflows/v94-v124-hosting-only.yml"
          echo "V124_CERTIFIED_PRODUCT_GUARD=true"

      - name: Verify live ADJUNTO terminal v124
        shell: bash
        run: |
          set -euo pipefail
          base="https://fixgo-44e4d.web.app"
          verified=""
          for path in /gestia-terminal.html /gestia-terminal.js /gestia-core/gestia-core.js /; do
            file="$RUNNER_TEMP/live-$(printf '%s' "$path" | tr '/.' '--').txt"
            code="$(curl -sS -L -o "$file" -w '%{http_code}' "$base$path?ts=$(date +%s%N)" || true)"
            echo "V124_LIVE_PROBE=$code $path"
            if test "$code" = "200" && grep -Fq "$RELEASE_ID" "$file"; then
              verified="$path"
              break
            fi
          done
          test -n "$verified"
          echo "V124_LIVE_RELEASE_VERIFIED=$RELEASE_ID"
          echo "V124_LIVE_ENTRYPOINT=$verified"

      - name: Remove temporary Hosting workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v94-v124-hosting-only.yml
          git config user.name "heberzzt-wq"
          git config user.email "heberzzt@gmail.com"
          git add -A
          staged="$(git diff --cached --name-only)"
          test "$staged" = ".github/workflows/v94-v124-hosting-only.yml"
          test -z "$(git diff --cached --name-only | grep -E '^functions/' || true)"
          git diff --cached --check
          git commit -m "[v124] chore(deploy): remove temporary hosting workflow"
          git push origin HEAD:"$BRANCH"

      - name: Final no-Functions and protected refs proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          test -z "$(git diff --name-only "$PRODUCT_SHA" HEAD -- functions/)"
          test -z "$(git diff --name-only "$PRODUCT_SHA" HEAD)"
          echo "V124_HOSTING_ONLY_RELEASE_COMPLETE=true"
          echo "V124_FUNCTIONS_UNCHANGED=true"

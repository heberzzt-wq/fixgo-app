name: V94 V124 Hosting-only release

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-v124-hosting-only.yml

permissions:
  contents: write

concurrency:
  group: v94-v124-hosting-only
  cancel-in-progress: false

env:
  BRANCH: v94-media-v4n-negative-claims
  PRODUCT_SHA: 356964199184397fcbb830e24269600f7aeae6fb
  MAIN_SHA: f3fa8e1806b681e860875afd4ce8183d27864873
  POLISH_SHA: 2ae85e670505c5d425a5a0334e99c45168054bb8
  PROJECT_ID: fixgo-44e4d
  SITE_ID: fixgo-44e4d
  RELEASE_ID: v94-source-grounded-research-v124-20260810

jobs:
  deploy-hosting-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout isolated certified branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Guard certified product and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          test -z "$(git diff --name-only "$PRODUCT_SHA" HEAD -- functions/)"
          changed="$(git diff --name-only "$PRODUCT_SHA" HEAD)"
          test "$changed" = ".github/workflows/v94-v124-hosting-only.yml"
          node -e 'const j=JSON.parse(require("fs").readFileSync("jarvis-runtime-contract.json","utf8")); if(j.releaseId!==process.env.RELEASE_ID) process.exit(1);'
          echo "V124_CERTIFIED_PRODUCT_GUARD=true"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build single-site Hosting config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const hosting = (source.hosting || []).filter((entry) => entry.site === process.env.SITE_ID);
          if (hosting.length !== 1) {
            console.error(`Expected exactly one Hosting site ${process.env.SITE_ID}; found ${hosting.length}`);
            process.exit(1);
          }
          const output = `${process.env.RUNNER_TEMP}/firebase-v124-hosting.json`;
          fs.writeFileSync(output, JSON.stringify({ hosting }, null, 2));
          console.log(`V124_SINGLE_SITE_CONFIG=${output}`);
          NODE
          test -z "$(grep -E '"'"'functions'"'"' "$RUNNER_TEMP/firebase-v124-hosting.json" || true)"
          grep -Fq '"site": "fixgo-44e4d"' "$RUNNER_TEMP/firebase-v124-hosting.json"
          echo "V124_HOSTING_ONLY_CONFIG=true"

      - name: Deploy certified ADJUNTO Hosting only
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_TOKEN:-}"
          firebase deploy \
            --only hosting \
            --config "$RUNNER_TEMP/firebase-v124-hosting.json" \
            --project "$PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            2>&1 | tee v124-hosting.log

      - name: Upload Hosting diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v124-hosting-diagnostic
          path: v124-hosting.log
          if-no-files-found: warn
          retention-days: 1

      - name: Verify live release marker
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-delay 2 \
            "https://fixgo-44e4d.web.app/jarvis-runtime-contract.json?ts=$(date +%s)" \
            -o "$RUNNER_TEMP/live-contract.json"
          node -e 'const j=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/live-contract.json","utf8")); if(j.releaseId!==process.env.RELEASE_ID){console.error(j.releaseId);process.exit(1)}; console.log("V124_LIVE_RELEASE_VERIFIED="+j.releaseId);'

      - name: Remove temporary Hosting workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f v124-hosting.log
          rm -f .github/workflows/v94-v124-hosting-only.yml
          git config user.name "heberzzt-wq"
          git config user.email "heberzzt@gmail.com"
          git add -A
          staged="$(git diff --cached --name-only)"
          test "$staged" = ".github/workflows/v94-v124-hosting-only.yml"
          test -z "$(git diff --cached --name-only | grep -E '^functions/' || true)"
          git diff --cached --check
          git commit -m "[v124] chore(deploy): remove temporary hosting workflow"
          git push origin HEAD:"$BRANCH"

      - name: Final no-Functions and protected refs proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          test -z "$(git diff --name-only "$PRODUCT_SHA" HEAD -- functions/)"
          test -z "$(git diff --name-only "$PRODUCT_SHA" HEAD)"
          echo "V124_HOSTING_ONLY_RELEASE_COMPLETE=true"
          echo "V124_FUNCTIONS_UNCHANGED=true"

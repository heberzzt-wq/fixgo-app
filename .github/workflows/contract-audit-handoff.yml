name: contract-audit-handoff

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/candidates/contract-audit/**'
      - '.github/workflows/contract-audit-handoff.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct local product handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/contract-audit
          echo 'd1b2e6e6a64f07ba2a19ae6cb36fd5d67153007dd771ce92ed295043dee5feb9  .github/candidates/contract-audit/chunk-00.txt' | sha256sum -c -
          echo 'f001cb84b33961031a2f4f8936040082aa11666eae4828d8ca13b42d18f1c1ad  .github/candidates/contract-audit/chunk-01.txt' | sha256sum -c -
          echo 'fdcc344cb3759f40fa05c94b17371f9f7dd7b9690490ea81f3f9a00477ec8e68  .github/candidates/contract-audit/chunk-02.txt' | sha256sum -c -
          echo 'dc7fdf37fc8563028ca2003d0083d35a314c2ea4e250ed8ddf70e1e7325fb92c  .github/candidates/contract-audit/segment-05.txt' | sha256sum -c -
          echo 'e7941063664bde2f3336657250367fc9cc434d560f7f0353c0cf126e7ec6efee  .github/candidates/contract-audit/segment-06.txt' | sha256sum -c -
          echo '27a9be7862fda074c444dcee94d2e1b044cba215038102c1d90a69738d4ad556  .github/candidates/contract-audit/segment-07.txt' | sha256sum -c -
          echo 'd0461f8bccfcb757e522df0f7e51ff72e39fab493bd50490e13a81618a4376e6  .github/candidates/contract-audit/chunk-04.txt' | sha256sum -c -
          cat .github/candidates/contract-audit/chunk-00.txt .github/candidates/contract-audit/chunk-01.txt .github/candidates/contract-audit/chunk-02.txt .github/candidates/contract-audit/segment-05.txt .github/candidates/contract-audit/segment-06.txt .github/candidates/contract-audit/segment-07.txt .github/candidates/contract-audit/chunk-04.txt > /tmp/contract-audit/handoff.patch.gz.b64
          echo '07cadc45fbec00cb11b49682b8036a62c3c33cf9a1f2d669b1c9c1c30a73e258  /tmp/contract-audit/handoff.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/contract-audit/handoff.patch.gz.b64 | gzip -d > /tmp/contract-audit/handoff.patch
          echo '0b357d2cb607276cf9ec9b65a66a23caf05379cdaaab22972bc9764f9407a98a  /tmp/contract-audit/handoff.patch' | sha256sum -c -
          git checkout --detach 8de46c00565b041b006f6a33d81ff6c22a616846
          git apply --check /tmp/contract-audit/handoff.patch
          git apply /tmp/contract-audit/handoff.patch
          git diff --check
          echo 'HANDOFF_RECONSTRUCTED=true'

      - name: Close semantic and historical invariants on the same contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Canonical semantic evaluator: transport success is not objective success
          # when requirements are unmet. Explicit objectiveSatisfied=true remains
          # authoritative over unrelated readyForProduction=false metadata.
          p = Path('gestia-core/response.composer.js')
          t = p.read_text()
          old = '''        !layers.some(layer => layer?.requirementsMet === false) &&
                  !layers.some(layer => layer?.readyForProduction === false) &&
                  (
                      explicitObjectiveSatisfied !== null
                          ? explicitObjectiveSatisfied
                          : true
                  );'''
          new = '''        !layers.some(layer => layer?.requirementsMet === false) &&
                  (
                      explicitObjectiveSatisfied !== null
                          ? explicitObjectiveSatisfied
                          : !layers.some(layer => layer?.readyForProduction === false)
                  );'''
          if old not in t:
              raise SystemExit('TARGET_SEMANTICS_BLOCK_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))

          # Preserve the already-certified V140 security invariant that was only in
          # the old CI carrier: validate output path before platform capability.
          p = Path('jarvis-speech-artifact.js')
          t = p.read_text()
          old = '''    const platform = options.platform || process.platform;
              if (platform !== "win32" && typeof options.synthesizeImpl !== "function") {
                  throw new Error("SPEECH_SYNTHESIS_PLATFORM_UNSUPPORTED");
              }
              const output = speechOutputPath(input.root || options.root || process.cwd(), input.output);'''
          new = '''    const output = speechOutputPath(input.root || options.root || process.cwd(), input.output);
              const platform = options.platform || process.platform;
              if (platform !== "win32" && typeof options.synthesizeImpl !== "function") {
                  throw new Error("SPEECH_SYNTHESIS_PLATFORM_UNSUPPORTED");
              }'''
          if old not in t:
              raise SystemExit('SPEECH_OUTPUT_VALIDATION_BOUNDARY_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))

          # Historical V127 fixtures now satisfy the current source-provenance gate.
          p = Path('tests/jarvis-real-media-reel-hydration-v127.test.mjs')
          t = p.read_text()
          old = '''    sourceUrl: "https://cdn.example/cover.jpg",
              sourceTag: "og:image",
              alt: "Imagen verificada"'''
          new = '''    sourceUrl: "https://cdn.example/cover.jpg",
              sourceTag: "og:image",
              sourceDeclared: true,
              alt: "Imagen verificada"'''
          if old not in t:
              raise SystemExit('V127_IMAGE_FIXTURE_NOT_FOUND')
          t = t.replace(old, new, 1)
          old = '''    sourceUrl: "https://cdn.example/source.mp4",
              sourceTag: "og:video"'''
          new = '''    sourceUrl: "https://cdn.example/source.mp4",
              sourceTag: "og:video",
              sourceDeclared: true'''
          if old not in t:
              raise SystemExit('V127_VIDEO_FIXTURE_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))

          # V131 remains the stronger runtime semantic-binding invariant; its fixture
          # must pass V140 provenance before that rule is exercised.
          p = Path('tests/nexo-real-media-semantic-binding-v131.test.mjs')
          t = p.read_text()
          old = '''    sourceUrl: "https://cdn.example/a.jpg",
              sourceTag: "og:image",
              mediaRole: "scene"'''
          new = '''    sourceUrl: "https://cdn.example/a.jpg",
              sourceTag: "og:image",
              sourceDeclared: true,
              mediaRole: "scene"'''
          if old not in t:
              raise SystemExit('V131_PROVENANCE_FIXTURE_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))

          # Retire the stale V137 cache pin without weakening recovery behavior.
          p = Path('tests/jarvis-reel-media-source-recovery-v136.test.mjs')
          t = p.read_text()
          old = '''    assert.match(core, /jarvis\\.mission\\.orchestrator\\.js\\?v=v137-local-speech-synthesis-20260812/);'''
          new = '''    assert.match(core, /jarvis\\.mission\\.orchestrator\\.js["']/);
              assert.doesNotMatch(core, /jarvis\\.mission\\.orchestrator\\.js\\?v=v137-local-speech-synthesis-20260812/);'''
          if old not in t:
              raise SystemExit('V136_STALE_CACHE_ASSERTION_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))
          PY
          node --check gestia-core/response.composer.js
          node --check jarvis-speech-artifact.js
          node --check tests/jarvis-real-media-reel-hydration-v127.test.mjs
          node --check tests/nexo-real-media-semantic-binding-v131.test.mjs
          node --check tests/jarvis-reel-media-source-recovery-v136.test.mjs
          git diff --check
          echo 'SAME_CONTRACT_INVARIANTS_CLOSED=true'

      - name: Install dependencies
        run: npm ci

      - name: Focal contract authority
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/jarvis-single-contract-authority.test.mjs tests/response-composer-semantic-contract.test.mjs tests/jarvis-mission-contract-accounting.test.mjs tests/jarvis-mission-failure-precedence.test.mjs tests/jarvis-mission-orchestrator.test.mjs tests/single-semantic-authority.test.mjs tests/jarvis-reel-dependency-recovery-v140.test.mjs tests/jarvis-generalist-execution-contract-v122.test.mjs

      - name: Reel media bridge regression
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/jarvis-fs-bridge-v2.test.mjs tests/jarvis-real-media-reel-hydration-v127.test.mjs tests/jarvis-reel-artifact.test.mjs tests/jarvis-reel-dependency-recovery-v140.test.mjs tests/jarvis-reel-live-cache-v139.test.mjs tests/jarvis-reel-media-binder-v131.test.mjs tests/jarvis-reel-media-source-recovery-v136.test.mjs tests/jarvis-reel-mission-fidelity-v133.test.mjs tests/jarvis-reel-native-mp4-v138.test.mjs tests/jarvis-reel-real-production-v134.test.mjs tests/jarvis-reel-researched-media-v132.test.mjs tests/jarvis-reel-speech-v137.test.mjs tests/jarvis-source-grounded-research-v124.test.mjs tests/nexo-real-media-runtime-guard-v128.test.mjs tests/nexo-real-media-semantic-binding-v131.test.mjs tests/nexo-real-media-tools.test.mjs tests/nexo-web-media-bridge.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Protected surface audit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 8de46c00565b041b006f6a33d81ff6c22a616846 -- .)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(functions/|multiservicios-web/|.*Multiservicios)' ; then
            echo 'PROTECTED_SURFACE_TOUCHED=true' >&2
            exit 1
          fi
          git diff --check
          echo 'FUNCTIONS_UNTOUCHED=true'
          echo 'MULTISERVICIOS_UNTOUCHED=true'
          echo 'NO_NEW_BRAIN=true'
          echo 'NO_NEW_CONTRACT=true'
          echo 'NO_NEW_CONTRACT_VERSION=true'

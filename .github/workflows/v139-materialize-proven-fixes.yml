name: v139 semantic continuity candidate

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v139-materialize-proven-fixes.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guard isolated branch and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          test "$(git rev-parse HEAD^)" = "2348e9b7e7a57116b66e77a5dca04d139c38282d"
          ! git diff --name-only 2d58a795a1e81a0adc5301bf958f80c604f8ef52..HEAD | grep -E '^(functions/|multiservicios-web/)'
      - run: npm ci
      - name: Apply bounded semantic continuity candidate in runner only
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/v139-semantic-continuity-patch.py
          git diff --check
          if git diff --name-only | grep -E '^(functions/|multiservicios-web/)'; then echo 'PROTECTED_SURFACE_CHANGED'; exit 1; fi
      - name: Human continuity focal regression
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/jarvis/jarvis.semantic.memory.js
          node --check gestia-core/gestia-core.js
          node --test \
            tests/jarvis-semantic-memory-integrity.test.mjs \
            tests/jarvis-generalist-current-turn.test.mjs \
            tests/jarvis-generalist-execution-contract-v122.test.mjs \
            tests/jarvis-current-turn-freshness-v119.test.mjs \
            tests/jarvis-marketing-production-intent-v125.test.mjs \
            tests/jarvis-marketing-real-delivery.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs
      - name: Full CI
        run: npm run ci:test
      - name: Candidate marker
        run: |
          echo V139_SEMANTIC_CONTINUITY_CANDIDATE_GREEN=true
          echo V139_FUNCTIONS_UNCHANGED=true
          echo V139_MULTISERVICIOS_UNCHANGED=true

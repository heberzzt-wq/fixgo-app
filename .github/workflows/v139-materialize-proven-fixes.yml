name: v139 semantic continuity candidate

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v139-materialize-proven-fixes.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guard isolated branch and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          test "$(git rev-parse HEAD^)" = "09801520a7a87d33e76ecfd158937abc7bc02dab"
          ! git diff --name-only 2d58a795a1e81a0adc5301bf958f80c604f8ef52..HEAD | grep -E '^(functions/|multiservicios-web/)'
      - run: npm ci
      - name: Apply bounded semantic continuity candidate in runner only
        run: python .github/scripts/v139-semantic-continuity-patch.py
      - name: Syntax semantic memory
        run: node --check gestia-core/jarvis/jarvis.semantic.memory.js
      - name: Syntax Gestia core
        run: node --check gestia-core/gestia-core.js
      - name: Semantic memory integrity
        run: node --test tests/jarvis-semantic-memory-integrity.test.mjs
      - name: Generalist current turn
        run: node --test tests/jarvis-generalist-current-turn.test.mjs
      - name: Generalist execution contract
        run: node --test tests/jarvis-generalist-execution-contract-v122.test.mjs
      - name: Freshness current subject authority
        run: node --test --test-name-pattern="new page subject" tests/jarvis-current-turn-freshness-v119.test.mjs
      - name: Freshness memory boundary
        run: node --test --test-name-pattern="tool-planning" tests/jarvis-current-turn-freshness-v119.test.mjs
      - name: Freshness terminal cache authority
        run: node --test --test-name-pattern="terminal shell" tests/jarvis-current-turn-freshness-v119.test.mjs
      - name: Marketing production intent
        run: node --test tests/jarvis-marketing-production-intent-v125.test.mjs
      - name: Marketing real delivery
        run: node --test tests/jarvis-marketing-real-delivery.test.mjs
      - name: Marketing terminal delivery
        run: node --test tests/jarvis-marketing-terminal-delivery.e2e.test.mjs
      - name: Full CI
        run: npm run ci:test
      - name: Candidate marker
        run: |
          echo V139_SEMANTIC_CONTINUITY_CANDIDATE_GREEN=true
          echo V139_FUNCTIONS_UNCHANGED=true
          echo V139_MULTISERVICIOS_UNCHANGED=true

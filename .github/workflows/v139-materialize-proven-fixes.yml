name: v139 semantic continuity materializer

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v139-materialize-proven-fixes.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guard isolated branch and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          test "$(git rev-parse HEAD^)" = "6b31b53707f4b71c47e30f82afb4c892f13579e8"
          ! git diff --name-only 2d58a795a1e81a0adc5301bf958f80c604f8ef52..HEAD | grep -E '^(functions/|multiservicios-web/)'
      - run: npm ci
      - name: Apply proven semantic continuity patch
        run: python .github/scripts/v139-semantic-continuity-patch.py
      - name: Recheck focused human continuity regression
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/jarvis/jarvis.semantic.memory.js
          node --check gestia-core/gestia-core.js
          node --test \
            tests/jarvis-semantic-memory-integrity.test.mjs \
            tests/jarvis-generalist-current-turn.test.mjs \
            tests/jarvis-generalist-execution-contract-v122.test.mjs \
            tests/jarvis-current-turn-freshness-v119.test.mjs \
            tests/jarvis-marketing-production-intent-v125.test.mjs \
            tests/jarvis-marketing-real-delivery.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs
      - name: Recheck Full CI
        run: npm run ci:test
      - name: Commit only proven product and regression changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            gestia-core/jarvis/jarvis.semantic.memory.js \
            gestia-core/gestia-core.js \
            tests/jarvis-semantic-memory-integrity.test.mjs \
            tests/jarvis-current-turn-freshness-v119.test.mjs
          ! git diff --cached --name-only | grep -E '^(functions/|multiservicios-web/)'
          git diff --cached --check
          git commit -m 'fix(jarvis): preserve semantic continuity across follow-up production turns'
          git push origin HEAD:v94-media-v4n-negative-claims

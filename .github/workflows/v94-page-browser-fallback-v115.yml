      - name: Verify live v115 and exact critical bytes
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.commit.outputs.sha }}"
          base="https://fixgo-44e4d.web.app"
          curl -fsSL "$base/gestia-terminal.html?v=$sha" | grep -Fq 'v94-page-browser-fallback-v115-20260809'
          curl -fsSL "$base/gestia-core/jarvis/jarvis.actuator.pack.js?v=$sha" | grep -Fq 'PAGE_ARTIFACT_CREATED_BROWSER_VERIFIED'
          curl -fsSL "$base/gestia-core/tools.runtime.js?v=$sha" | grep -Fq '2.38.0-page-no-contact-route'
          curl -fsSL "$base/modules/terminal/repo-bootstrap-index.js?v=$sha" | grep -Fq 'jarvis-nlu-bridge.js' && exit 1 || true

          files=(
            gestia-terminal.html
            gestia-terminal.js

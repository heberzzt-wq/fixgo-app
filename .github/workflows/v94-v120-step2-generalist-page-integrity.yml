name: V94 v120 step2 generalist page integrity

on:
  push:
    branches: [v94-media-v4n-negative-claims]
    paths: [.github/workflows/v94-v120-step2-generalist-page-integrity.yml]

permissions:
  contents: read

env:
  BASELINE: fc021b3112542dbcdb9d236a17e0b71ee547463b

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard isolated branch and Functions boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          git cat-file -e "$BASELINE^{commit}"
          git diff --quiet "$BASELINE" HEAD -- functions
          test -f scripts/v119-current-turn-freshness-fix.py
          test -f scripts/v120-generalist-page-integrity-fix.py
          test -f tests/jarvis-generalist-page-integrity-v120.test.mjs

      - name: Install
        run: npm ci

      - name: Apply v119 and v120 staging patches
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v119-current-turn-freshness-fix.py
          python scripts/v120-generalist-page-integrity-fix.py
          git diff --quiet "$BASELINE" HEAD -- functions

      - name: Syntax and structural invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/gestia-core.js
          node --check gestia-core/jarvis/jarvis.identity.integrity.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.page.creator.js
          node --check tests/jarvis-generalist-page-integrity-v120.test.mjs
          git diff --check
          grep -Fq 'rejectCorruptedIdentityArgs' gestia-core/jarvis/jarvis.multifunction.planner.js
          grep -Fq 'repairCanonicalIdentityValue' gestia-core/jarvis/jarvis.multitool.pack.js
          grep -Fq 'identityPreserved' gestia-core/jarvis/jarvis.multitool.pack.js
          grep -Fq 'MARCA_CANONICA' gestia-core/jarvis/jarvis.multitool.pack.js
          grep -Fq 'sections: Array.isArray(input.sections)' gestia-core/jarvis/jarvis.page.creator.js
          ! grep -Fq '"como_funciona"' gestia-core/jarvis/jarvis.page.creator.js
          ! grep -Fq 'Multiservicios Peninsulares HMH' gestia-core/jarvis/jarvis.identity.integrity.js
          ! grep -Fq 'Multiservicios Peninsulares SMH' gestia-core/jarvis/jarvis.identity.integrity.js
          git diff --quiet "$BASELINE" HEAD -- functions

      - name: Exact v120 generalist regression
        run: node --test tests/jarvis-generalist-page-integrity-v120.test.mjs

      - name: Page and current-turn regression pack
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/jarvis-current-turn-freshness-v119.test.mjs \
            tests/jarvis-generalist-current-turn.test.mjs \
            tests/jarvis-semantic-memory-integrity.test.mjs \
            tests/jarvis-page-request-contract-v118.test.mjs \
            tests/jarvis-page-artifact.test.mjs \
            tests/jarvis-page-browser-fallback-v115.test.mjs \
            tests/jarvis-peninsula-page-v114.test.mjs
          git diff --quiet "$BASELINE" HEAD -- functions

      - name: Multifunction integration regression
        run: node --test tests/jarvis-multifunction-tools.test.mjs

      - name: Step2 proof
        shell: bash
        run: |
          set -euo pipefail
          echo "V120_STEP2_GENERALIST_PAGE_INTEGRITY_GREEN"
          git diff --quiet "$BASELINE" HEAD -- functions

name: v129-reel-quality-gate-apply

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - scripts/apply-v129-reel-quality-gate.mjs.gz.b64
      - .github/workflows/v129-reel-quality-gate-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"

      - name: Apply v129 product patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/apply-v129-reel-quality-gate.mjs.gz.b64 | gzip -d > /tmp/apply-v129-reel-quality-gate.mjs
          node /tmp/apply-v129-reel-quality-gate.mjs
          rm scripts/apply-v129-reel-quality-gate.mjs.gz.b64
          rm .github/workflows/v129-reel-quality-gate-apply.yml

      - name: Guard Functions unchanged
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^functions/'; then
            echo "Functions changed in v129" >&2
            exit 1
          fi

      - name: Syntax focal v129
        run: |
          node --check jarvis-reel-artifact.js
          node --check gestia-core/nexo/nexo.real-media.tools.js
          node --check gestia-core/nexo/nexo.real-media.runtime-guard-v128.js

      - name: Focal v129 tests
        run: node --test tests/jarvis-reel-artifact.test.mjs tests/jarvis-real-media-reel-hydration-v127.test.mjs tests/nexo-real-media-tools.test.mjs tests/nexo-real-media-runtime-guard-v128.test.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit v129 product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[v129] fix(adj): enforce reel production quality gate"
          git push origin HEAD:v94-media-v4n-negative-claims

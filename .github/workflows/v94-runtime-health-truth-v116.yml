name: V94 runtime health truth v116

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-runtime-health-truth-v116.yml

permissions:
  contents: write

concurrency:
  group: v94-runtime-health-truth-v116
  cancel-in-progress: false

env:
  SEMANTIC_BASE: e6bec05b93b8f1ad88f44d5665ee2547c468dcec
  EXPECTED_MAIN: f3fa8e1806b681e860875afd4ce8183d27864873
  EXPECTED_POLISH: 2ae85e670505c5d425a5a0334e99c45168054bb8
  RELEASE_TOKEN: v94-runtime-health-truth-v116-20260809

jobs:
  certify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Guard branch Functions and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          git cat-file -e "$SEMANTIC_BASE^{commit}"
          git diff --quiet "$SEMANTIC_BASE" HEAD -- functions
          git fetch origin main v5.9-polish --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/v5.9-polish)" = "$EXPECTED_POLISH"
          echo "PRE_GUARDS_OK"

      - name: Apply v116 product patch
        run: |
          node scripts/v116-runtime-health-patch.mjs
          node scripts/v116-refresh-v115-cache-regression.mjs

      - name: Source invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '"CATALOGED"' modules/terminal/runtime-repair-health.js
          grep -Fq 'repo_catalog_only' modules/terminal/runtime-repair-health.js
          grep -Fq 'runtime_loaded_registry' modules/terminal/runtime-repair-health.js
          grep -Fq '__JARVIS_RUNTIME_HEALTH_DEBUG__ === true' modules/terminal/runtime-repair-health.js
          grep -Fq 'observedModuleCount' modules/terminal/runtime-persistence.js
          grep -Fq "$RELEASE_TOKEN" gestia-terminal.html
          grep -Fq 'allowing later shell cache busts' tests/jarvis-page-browser-fallback-v115.test.mjs
          ! grep -Fq 'assert.match(html, /v94-page-browser-fallback-v115-20260809/);' tests/jarvis-semantic-memory-integrity.test.mjs
          ! grep -Fq 'assert.match(terminal, /v94-page-browser-fallback-v115-20260809/);' tests/jarvis-marketing-terminal-delivery.e2e.test.mjs
          ! grep -Fq 'window.__REPO_INDEX__["jarvis-nlu-bridge.js"]' modules/terminal/repo-bootstrap-index.js
          git diff --quiet "$SEMANTIC_BASE" HEAD -- functions
          echo "V116_SOURCE_INVARIANTS_OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Focused v116 regression with exact failure capture
        shell: bash
        run: |
          set +e
          node --test tests/jarvis-runtime-health-truth-v116.test.mjs tests/jarvis-page-browser-fallback-v115.test.mjs tests/jarvis-semantic-memory-integrity.test.mjs tests/jarvis-marketing-terminal-delivery.e2e.test.mjs > /tmp/v116-focused.log 2>&1
          code=$?
          cat /tmp/v116-focused.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/v116-focused.log .github/v116-focused-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/v116-focused-failure.log
            git commit -m "[v94] diag: capture v116 focused failure"
            git push origin HEAD:v94-media-v4n-negative-claims
            exit "$code"
          fi
          rm -f .github/v116-focused-failure.log
          echo "V116_FOCUSED_GREEN"

      - name: Full CI with exact failure capture
        shell: bash
        run: |
          set +e
          npm run ci:test > /tmp/v116-ci.log 2>&1
          code=$?
          cat /tmp/v116-ci.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/v116-ci.log .github/v116-ci-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/v116-ci-failure.log
            git commit -m "[v94] diag: capture v116 full CI failure"
            git push origin HEAD:v94-media-v4n-negative-claims
            exit "$code"
          fi
          rm -f .github/v116-ci-failure.log
          echo "V116_FULL_CI_GREEN"

      - name: Final precommit guards
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$SEMANTIC_BASE" HEAD -- functions
          git fetch origin main v5.9-polish --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/v5.9-polish)" = "$EXPECTED_POLISH"
          echo "PRECOMMIT_GUARDS_OK"

      - name: Commit certified v116 product
        id: product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/v116-runtime-health-patch.mjs
          git rm -f scripts/v116-refresh-v115-cache-regression.mjs
          git rm -f .github/v116-focused-failure.log 2>/dev/null || true
          git rm -f .github/v116-ci-failure.log 2>/dev/null || true
          git add modules/terminal/runtime-repair-health.js modules/terminal/runtime-persistence.js gestia-terminal.js gestia-terminal.html gestia-core/gestia.runtime.v7.js tests/jarvis-runtime-health-truth-v116.test.mjs tests/jarvis-page-browser-fallback-v115.test.mjs tests/jarvis-semantic-memory-integrity.test.mjs tests/jarvis-marketing-terminal-delivery.e2e.test.mjs
          git commit -m "[v94] fix(adj): make runtime health evidence-based and quiet v116"
          product_sha="$(git rev-parse HEAD)"
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:v94-media-v4n-negative-claims
          echo "PRODUCT_SHA=$product_sha"

      - name: Bind deploy source to certified product
        shell: bash
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.product_sha }}
        run: |
          set -euo pipefail
          critical=(
            gestia-terminal.html
            gestia-terminal.js
            gestia-core/gestia.runtime.v7.js
            modules/terminal/runtime-repair-health.js
            modules/terminal/runtime-persistence.js
            modules/terminal/repo-bootstrap-index.js
          )
          git diff --quiet "$PRODUCT_SHA" HEAD -- "${critical[@]}"
          git diff --quiet "$SEMANTIC_BASE" HEAD -- functions
          echo "DEPLOY_BOUND=$PRODUCT_SHA"

      - name: Sovereign Hosting-only deploy gate
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_HOSTING_ONLY: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
        run: node scripts/jarvis-deploy-gate.mjs

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting only
        run: firebase deploy --only hosting --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Verify exact live v116 bytes and quiet-log markers
        shell: bash
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.product_sha }}
        run: |
          set -euo pipefail
          base='https://fixgo-44e4d.web.app'
          critical=(
            gestia-terminal.html
            gestia-terminal.js
            gestia-core/gestia.runtime.v7.js
            modules/terminal/runtime-repair-health.js
            modules/terminal/runtime-persistence.js
            modules/terminal/repo-bootstrap-index.js
          )
          for p in "${critical[@]}"; do
            git show "$PRODUCT_SHA:$p" > /tmp/expected.bin
            expected="$(sha256sum /tmp/expected.bin | awk '{print $1}')"
            curl -fsSL --retry 4 --retry-delay 2 "$base/$p?v=$PRODUCT_SHA" -o /tmp/live.bin
            live="$(sha256sum /tmp/live.bin | awk '{print $1}')"
            echo "$p expected=$expected live=$live"
            test "$expected" = "$live"
          done
          curl -fsSL "$base/modules/terminal/runtime-repair-health.js?v=$PRODUCT_SHA" -o /tmp/live-health.js
          grep -Fq '"CATALOGED"' /tmp/live-health.js
          grep -Fq 'repo_catalog_only' /tmp/live-health.js
          grep -Fq 'runtime_loaded_registry' /tmp/live-health.js
          grep -Fq '__JARVIS_RUNTIME_HEALTH_DEBUG__ === true' /tmp/live-health.js
          curl -fsSL "$base/modules/terminal/runtime-persistence.js?v=$PRODUCT_SHA" -o /tmp/live-persistence.js
          grep -Fq 'observedModuleCount' /tmp/live-persistence.js
          curl -fsSL "$base/modules/terminal/repo-bootstrap-index.js?v=$PRODUCT_SHA" -o /tmp/live-index.js
          ! grep -Fq 'window.__REPO_INDEX__["jarvis-nlu-bridge.js"]' /tmp/live-index.js
          echo "LIVE_V116_TRUTH_QUIET_OK=$PRODUCT_SHA"

      - name: Final protected refs and Functions guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main v5.9-polish --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/v5.9-polish)" = "$EXPECTED_POLISH"
          git diff --quiet "$SEMANTIC_BASE" HEAD -- functions
          echo "FINAL_GUARDS_OK"

      - name: Cleanup certification workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/v94-runtime-health-truth-v116.yml
          git commit -m "[v94] chore: remove v116 certification workflow"
          git push origin HEAD:v94-media-v4n-negative-claims
          echo "FINAL_BRANCH_SHA=$(git rev-parse HEAD)"

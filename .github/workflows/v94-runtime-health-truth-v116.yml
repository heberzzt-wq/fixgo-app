name: V94 runtime health truth v116

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-runtime-health-truth-v116.yml

permissions:
  contents: write

concurrency:
  group: v94-runtime-health-truth-v116
  cancel-in-progress: false

env:
  SEMANTIC_BASE: e6bec05b93b8f1ad88f44d5665ee2547c468dcec
  EXPECTED_MAIN: f3fa8e1806b681e860875afd4ce8183d27864873
  EXPECTED_POLISH: 2ae85e670505c5d425a5a0334e99c45168054bb8
  RELEASE_TOKEN: v94-runtime-health-truth-v116-20260809

jobs:
  certify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Guard branch Functions and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          git cat-file -e "$SEMANTIC_BASE^{commit}"
          git diff --quiet "$SEMANTIC_BASE" HEAD -- functions
          git fetch origin main v5.9-polish --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/v5.9-polish)" = "$EXPECTED_POLISH"
          echo "PRE_GUARDS_OK"

      - name: Patch truthful runtime health telemetry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          token = "v94-runtime-health-truth-v116-20260809"

          p = Path("modules/terminal/runtime-repair-health.js")
          s = p.read_text(encoding="utf-8")
          pattern = re.compile(r'''        const previousHealthMap =\n[\s\S]*?        window\.__RUNTIME_HEALTH_MAP__ =\n            healthMap;''')
          replacement = '''        const previousHealthMap =
            window.__RUNTIME_HEALTH_MAP__ || {};

        const loadedRegistry =
            window.MODULE_CONTEXT?.loaded || {};

        const healthMap = {};

        const normalizeLoadEvidence = value => {
            if (value === true) {
                return { observed: true, status: "ONLINE" };
            }

            if (typeof value === "string") {
                const status = value.trim().toUpperCase();
                if (["ONLINE", "LOADED", "READY", "RUNNING"].includes(status)) {
                    return { observed: true, status: "ONLINE" };
                }
                if (["DEGRADED", "ISOLATED"].includes(status)) {
                    return { observed: true, status };
                }
                return null;
            }

            if (value && typeof value === "object") {
                const status = String(value.status || value.state || "").trim().toUpperCase();
                if (value.loaded === true || value.online === true || value.ready === true || value.running === true) {
                    return {
                        observed: true,
                        status: ["DEGRADED", "ISOLATED"].includes(status) ? status : "ONLINE"
                    };
                }
                if (["ONLINE", "LOADED", "READY", "RUNNING", "DEGRADED", "ISOLATED"].includes(status)) {
                    return {
                        observed: true,
                        status: ["DEGRADED", "ISOLATED"].includes(status) ? status : "ONLINE"
                    };
                }
            }

            return null;
        };

        Object.entries(
            cognition
        ).forEach(([file, meta]) => {

            const previous =
                previousHealthMap[file] || {};

            const candidates = [
                file,
                meta?.path,
                meta?.module
            ].filter(Boolean);

            let loadEvidence = null;
            for (const candidate of candidates) {
                loadEvidence = normalizeLoadEvidence(
                    loadedRegistry?.[candidate]
                );
                if (loadEvidence?.observed === true) break;
            }

            const observed =
                loadEvidence?.observed === true;

            healthMap[file] = {
                ...previous,
                file,
                status:
                    observed
                        ? loadEvidence.status
                        : "CATALOGED",
                health:
                    observed
                        ? (previous.health ?? 100)
                        : null,
                degraded:
                    observed && loadEvidence.status === "DEGRADED",
                isolated:
                    observed && loadEvidence.status === "ISOLATED",
                blocked:
                    previous.blocked === true,
                observed,
                evidenceSource:
                    observed
                        ? "runtime_loaded_registry"
                        : "repo_catalog_only",
                lastCheck:
                    Date.now()
            };
        });

        window.__RUNTIME_HEALTH_MAP__ =
            healthMap;'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f"HEALTH_MAP_PATCH_COUNT_{count}")

          old = '''                isolated:\n                    node.isolated === true\n            }));'''
          new = '''                isolated:\n                    node.isolated === true,\n                observed:\n                    node.observed === true,\n                evidenceSource:\n                    node.evidenceSource || "unknown"\n            }));'''
          if old not in s2:
              raise SystemExit("BOOT_TABLE_ROW_ANCHOR_MISSING")
          s2 = s2.replace(old, new, 1)

          old = '''            online:\n                rows.filter(row => row.status === "ONLINE").length,\n            degraded:'''
          new = '''            online:\n                rows.filter(row => row.status === "ONLINE").length,\n            cataloged:\n                rows.filter(row => row.status === "CATALOGED").length,\n            degraded:'''
          if old not in s2:
              raise SystemExit("BOOT_TABLE_SUMMARY_ANCHOR_MISSING")
          s2 = s2.replace(old, new, 1)
          p.write_text(s2, encoding="utf-8")

          p = Path("modules/terminal/runtime-persistence.js")
          s = p.read_text(encoding="utf-8")
          pattern = re.compile(r'''        const moduleCount =\n[\s\S]*?        const runtimeHealth =\n\n            moduleCount > 0\n\n                \? Math\.floor\(\n\n                    \(\n                        healthyModules /\n                        moduleCount\n                    \) \* 100\n                \)\n\n                : 100;''')
          replacement = '''        const moduleCount =

            Object.keys(
                runtimeModules
            ).length;

        const observedHealthNodes =

            Object.values(
                runtimeHealthMap
            )
            .filter(
                (m) =>
                    m?.observed === true
            );

        const observedModuleCount =
            observedHealthNodes.length;

        const healthyModules =

            observedHealthNodes
            .filter(
                (m) =>
                    m?.status === "ONLINE"
            ).length;

        const degradedModules =

            observedHealthNodes
            .filter(
                (m) =>
                    m?.status === "DEGRADED"
            ).length;

        const isolatedModules =

            observedHealthNodes
            .filter(
                (m) =>
                    m?.status === "ISOLATED"
            ).length;

        const runtimeHealth =

            observedModuleCount > 0

                ? Math.floor(

                    (
                        healthyModules /
                        observedModuleCount
                    ) * 100
                )

                : 100;'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f"SNAPSHOT_HEALTH_PATCH_COUNT_{count}")
          anchor = '''moduleCount,\n\nhealthyModules,'''
          if anchor not in s2:
              raise SystemExit("SNAPSHOT_FIELD_ANCHOR_MISSING")
          s2 = s2.replace(anchor, '''moduleCount,\n\nobservedModuleCount,\n\nhealthyModules,''', 1)
          p.write_text(s2, encoding="utf-8")

          p = Path("gestia-terminal.js")
          s = p.read_text(encoding="utf-8")
          s2, count = re.subn(
              r'\./modules/terminal/runtime-repair-health\.js\?v=[^"\']+',
              f'./modules/terminal/runtime-repair-health.js?v={token}',
              s,
              count=1
          )
          if count != 1:
              raise SystemExit(f"TERMINAL_HEALTH_CACHE_PATCH_COUNT_{count}")
          p.write_text(s2, encoding="utf-8")

          p = Path("gestia-terminal.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "v94-page-browser-fallback-v115-20260809",
              token
          )
          s = s.replace(
              "fixgo-real-runtime-e2e-20260805",
              token
          )
          p.write_text(s, encoding="utf-8")

          p = Path("gestia-core/gestia.runtime.v7.js")
          s = p.read_text(encoding="utf-8")
          s2 = re.sub(
              r'(runtime-persistence\.js\?v=)[^"\']+',
              rf'\1{token}',
              s
          )
          p.write_text(s2, encoding="utf-8")
          PY

          cat > tests/jarvis-runtime-health-truth-v116.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import vm from "node:vm";

          test("runtime health does not call catalog-only nodes ONLINE", () => {
              const source = fs.readFileSync("modules/terminal/runtime-repair-health.js", "utf8");
              const tableLogs = [];
              const window = {
                  __REPO_INDEX__: {},
                  __REPO_COGNITION__: {
                      "ghost.js": { file: "ghost.js", path: "ghost.js", module: "ghost" },
                      "live.js": { file: "live.js", path: "live.js", module: "live" }
                  },
                  __RUNTIME_HEALTH_MAP__: {
                      "ghost.js": { file: "ghost.js", status: "ONLINE", health: 100 }
                  },
                  MODULE_CONTEXT: {
                      loaded: {
                          "live.js": { loaded: true, status: "READY" }
                      }
                  },
                  addEventListener() {}
              };
              const sandbox = {
                  window,
                  console: {
                      log: (...args) => tableLogs.push(args),
                      warn() {},
                      error() {},
                      table() {}
                  },
                  setTimeout() { return 0; },
                  Date
              };
              vm.runInNewContext(source, sandbox, { filename: "runtime-repair-health.js" });
              const result = window.buildRuntimeHealthMap();
              assert.equal(result.ok, true);
              assert.equal(window.__RUNTIME_HEALTH_MAP__["live.js"].status, "ONLINE");
              assert.equal(window.__RUNTIME_HEALTH_MAP__["live.js"].observed, true);
              assert.equal(window.__RUNTIME_HEALTH_MAP__["live.js"].evidenceSource, "runtime_loaded_registry");
              assert.equal(window.__RUNTIME_HEALTH_MAP__["ghost.js"].status, "CATALOGED");
              assert.equal(window.__RUNTIME_HEALTH_MAP__["ghost.js"].health, null);
              assert.equal(window.__RUNTIME_HEALTH_MAP__["ghost.js"].observed, false);
              assert.equal(window.__RUNTIME_HEALTH_MAP__["ghost.js"].evidenceSource, "repo_catalog_only");
              const rendered = window.renderRuntimeBootTable({ source: "test" });
              assert.equal(rendered.rows.find(row => row.file === "ghost.js").status, "CATALOGED");
          });

          test("runtime snapshots calculate health only from observed nodes", () => {
              const source = fs.readFileSync("modules/terminal/runtime-persistence.js", "utf8");
              assert.match(source, /const observedHealthNodes/);
              assert.match(source, /m\?\.observed === true/);
              assert.match(source, /const observedModuleCount/);
              assert.match(source, /observedModuleCount > 0/);
              assert.doesNotMatch(source, /healthyModules \/\s*moduleCount/);
          });

          test("v115 phantom bootstrap entries remain absent", () => {
              const source = fs.readFileSync("modules/terminal/repo-bootstrap-index.js", "utf8");
              for (const name of [
                  "jarvis-nlu-bridge.js",
                  "jarvis.intent.runtime.v7.js",
                  "jarvis.language.core.v5.js",
                  "jarvis.dsl.js",
                  "jarvis.orchestrator.js",
                  "jarvis.vision.engine.js",
                  "jarvis.normalizer.js",
                  "jarvis.bridge.v4.js",
                  "intent.engine.v7.js",
                  "repo.cognition.index.js",
                  "jarvis.cognition.engine.js",
                  "intent.engine.js",
                  "cognitive.bootstrap.js"
              ]) {
                  assert.equal(source.includes(`window.__REPO_INDEX__["${name}"]`), false, name);
              }
          });
          EOF

          git diff --check
          grep -Fq 'status:' modules/terminal/runtime-repair-health.js
          grep -Fq '"CATALOGED"' modules/terminal/runtime-repair-health.js
          grep -Fq 'repo_catalog_only' modules/terminal/runtime-repair-health.js
          grep -Fq 'observedModuleCount' modules/terminal/runtime-persistence.js
          grep -Fq "$RELEASE_TOKEN" gestia-terminal.html
          git diff --quiet "$SEMANTIC_BASE" HEAD -- functions

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Focused v116 regression
        run: node --test tests/jarvis-runtime-health-truth-v116.test.mjs tests/jarvis-page-browser-fallback-v115.test.mjs tests/jarvis-semantic-memory-integrity.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Final source guards before commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$SEMANTIC_BASE" HEAD -- functions
          git fetch origin main v5.9-polish --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/v5.9-polish)" = "$EXPECTED_POLISH"
          ! grep -Fq 'window.__REPO_INDEX__["jarvis-nlu-bridge.js"]' modules/terminal/repo-bootstrap-index.js
          grep -Fq '"CATALOGED"' modules/terminal/runtime-repair-health.js
          grep -Fq 'runtime_loaded_registry' modules/terminal/runtime-repair-health.js
          grep -Fq 'observedModuleCount' modules/terminal/runtime-persistence.js
          echo "V116_SOURCE_GUARDS_OK"

      - name: Commit certified product
        id: product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/terminal/runtime-repair-health.js modules/terminal/runtime-persistence.js gestia-terminal.js gestia-terminal.html gestia-core/gestia.runtime.v7.js tests/jarvis-runtime-health-truth-v116.test.mjs
          git commit -m "[v94] fix(adj): make runtime health evidence-based v116"
          product_sha="$(git rev-parse HEAD)"
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:v94-media-v4n-negative-claims
          echo "PRODUCT_SHA=$product_sha"

      - name: Sovereign Hosting-only deploy gate
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_HOSTING_ONLY: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
        run: node scripts/jarvis-deploy-gate.mjs

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting only
        run: firebase deploy --only hosting --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Verify live v116 exact bytes and markers
        shell: bash
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.product_sha }}
        run: |
          set -euo pipefail
          base='https://fixgo-44e4d.web.app'
          critical=(
            gestia-terminal.html
            gestia-terminal.js
            gestia-core/gestia.runtime.v7.js
            modules/terminal/runtime-repair-health.js
            modules/terminal/runtime-persistence.js
            modules/terminal/repo-bootstrap-index.js
          )
          for p in "${critical[@]}"; do
            git show "$PRODUCT_SHA:$p" > /tmp/expected.bin
            expected="$(sha256sum /tmp/expected.bin | awk '{print $1}')"
            curl -fsSL --retry 4 --retry-delay 2 "$base/$p?v=$PRODUCT_SHA" -o /tmp/live.bin
            live="$(sha256sum /tmp/live.bin | awk '{print $1}')"
            echo "$p expected=$expected live=$live"
            test "$expected" = "$live"
          done
          curl -fsSL "$base/modules/terminal/runtime-repair-health.js?v=$PRODUCT_SHA" -o /tmp/live-health.js
          grep -Fq '"CATALOGED"' /tmp/live-health.js
          grep -Fq 'repo_catalog_only' /tmp/live-health.js
          grep -Fq 'runtime_loaded_registry' /tmp/live-health.js
          curl -fsSL "$base/modules/terminal/runtime-persistence.js?v=$PRODUCT_SHA" -o /tmp/live-persistence.js
          grep -Fq 'observedModuleCount' /tmp/live-persistence.js
          curl -fsSL "$base/modules/terminal/repo-bootstrap-index.js?v=$PRODUCT_SHA" -o /tmp/live-index.js
          ! grep -Fq 'window.__REPO_INDEX__["jarvis-nlu-bridge.js"]' /tmp/live-index.js
          echo "LIVE_V116_TRUTH_OK=$PRODUCT_SHA"

      - name: Recheck protected refs and Functions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main v5.9-polish --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/v5.9-polish)" = "$EXPECTED_POLISH"
          git diff --quiet "$SEMANTIC_BASE" HEAD -- functions
          echo "FINAL_GUARDS_OK"

      - name: Cleanup temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/v94-runtime-health-truth-v116.yml
          git commit -m "[v94] chore: remove v116 certification workflow"
          git push origin HEAD:v94-media-v4n-negative-claims
          echo "FINAL_BRANCH_SHA=$(git rev-parse HEAD)"

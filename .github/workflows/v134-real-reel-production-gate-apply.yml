name: v134-real-reel-production-gate-apply

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v134-real-reel-production-gate-apply.yml
      - .github/scripts/v134-real-reel-production-gate.py

permissions:
  contents: write

jobs:
  apply-v134:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v94-media-v4n-negative-claims

      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          ! git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817..HEAD | grep -E '^functions/'

      - name: Apply v134 patch
        run: python .github/scripts/v134-real-reel-production-gate.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focal v134
        run: |
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/nexo/nexo.real-media.tools.js
          node --check nexo-web-media-bridge.js
          node --test \
            tests/jarvis-reel-real-production-v134.test.mjs \
            tests/jarvis-reel-mission-fidelity-v133.test.mjs \
            tests/jarvis-reel-researched-media-v132.test.mjs \
            tests/jarvis-real-media-reel-hydration-v127.test.mjs \
            tests/nexo-real-media-tools.test.mjs \
            tests/single-semantic-authority.test.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit functional v134 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "heberzzt-wq"
          git config user.email "heberzzt@gmail.com"
          git add \
            gestia-core/jarvis/jarvis.mission.orchestrator.js \
            gestia-core/nexo/nexo.real-media.tools.js \
            nexo-web-media-bridge.js \
            tests/jarvis-reel-real-production-v134.test.mjs
          git diff --cached --check
          git commit -m "[v134] feat(adj): require real visual media for reel production"
          git push origin HEAD:v94-media-v4n-negative-claims

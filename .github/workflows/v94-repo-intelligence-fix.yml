name: V94 terminal release cache bust

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-repo-intelligence-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Assert isolation
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply cache bust
        run: |
          set -euo pipefail
          python scripts/v94-terminal-cache-bust.py

      - name: Certify startup freshness
        run: |
          set -euo pipefail
          node --check gestia-core/gestia-core.js
          node --check gestia-terminal.js
          node --test tests/jarvis-semantic-memory-integrity.test.mjs tests/jarvis-repo-target-runtime.test.mjs tests/single-semantic-authority.test.mjs
          grep -q 'gestia-terminal.js?v=v94-semantic-memory-repo-v111-20260809' gestia-terminal.html
          grep -q 'gestia-core/gestia-core.js?v=v94-semantic-memory-repo-v111-20260809' gestia-terminal.html
          grep -q 'tools.runtime.js?v=v94-semantic-memory-repo-v111-20260809' gestia-core/gestia-core.js
          ! grep -q 'fixgo-real-runtime-e2e-v3-20260805' gestia-terminal.html
          ! grep -q 'tools.runtime.js?v=v94-semantic-only-v108-20260809' gestia-core/gestia-core.js

      - name: Assert Functions untouched
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only HEAD -- functions)"

      - name: Commit cache bust
        run: |
          set -euo pipefail
          rm scripts/v94-terminal-cache-bust.py
          git config user.name "heberzzt-wq"
          git config user.email "heberzzt@gmail.com"
          git add -A
          test -z "$(git diff --cached --name-only -- functions)"
          git commit -m "[v94] fix(terminal): force fresh semantic repo runtime"
          git push origin HEAD:v94-media-v4n-negative-claims

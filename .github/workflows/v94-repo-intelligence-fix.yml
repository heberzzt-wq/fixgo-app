name: V94 repo intelligence fix

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-repo-intelligence-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Assert isolation
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: |
          set -euo pipefail
          npm ci
          npm --prefix functions ci

      - name: Apply remote identity guard
        run: |
          set -euo pipefail
          python scripts/v94-repo-remote-guard.py

      - name: Focused repo regressions
        run: |
          set -euo pipefail
          node --check jarvis-fs-bridge.js
          node --test tests/jarvis-repo-target-runtime.test.mjs tests/jarvis-repo-intelligence.test.mjs tests/jarvis-fs-bridge-v2.test.mjs tests/repo-authority-v2.test.cjs tests/jarvis-semantic-memory-integrity.test.mjs

      - name: Verify real and foreign repository identities
        run: |
          set -euo pipefail
          git fetch --quiet origin codex/jarvis-v8-runtime-foundation
          node --input-type=module <<'NODE'
          import { resolveBridgeRepositoryTarget } from './jarvis-fs-bridge.js';
          const good = resolveBridgeRepositoryTarget({ target: 'https://github.com/heberzzt-wq/fixgo-app/blob/codex/jarvis-v8-runtime-foundation' }, process.cwd());
          const bad = resolveBridgeRepositoryTarget({ target: 'https://github.com/openai/not-the-local-repo/tree/main' }, process.cwd());
          console.log(JSON.stringify({ good, bad }, null, 2));
          if (!good.ok || good.ref !== 'codex/jarvis-v8-runtime-foundation' || good.path !== '' || !good.commit) process.exit(1);
          if (bad.ok || bad.status !== 'REPOSITORY_REMOTE_MISMATCH') process.exit(1);
          NODE

      - name: Assert Functions untouched
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only HEAD -- functions)"

      - name: Commit remote guard
        run: |
          set -euo pipefail
          rm scripts/v94-repo-remote-guard.py
          git config user.name "heberzzt-wq"
          git config user.email "heberzzt@gmail.com"
          git add -A
          test -z "$(git diff --cached --name-only -- functions)"
          git commit -m "[v94] fix(repo): bind GitHub targets to local remote"
          git push origin HEAD:v94-media-v4n-negative-claims

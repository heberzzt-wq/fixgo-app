name: V94 V122 Live verification only

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-v122-hosting-release.yml

permissions:
  contents: read

concurrency:
  group: v94-v122-live-verification
  cancel-in-progress: false

env:
  PRODUCT_SHA: 232db70629e7cc35b1b306329f2157a3c0c57534
  V121_SHA: 8fef8730dea7c1d637d22ad5bed94ec89491e764
  MAIN_SHA: f3fa8e1806b681e860875afd4ce8183d27864873
  POLISH_SHA: 2ae85e670505c5d425a5a0334e99c45168054bb8
  RELEASE_ID: v94-generalist-execution-contract-v122-20260810

jobs:
  verify-live-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout trigger commit for lineage guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard certified product lineage and protected refs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD
          changed="$(git diff --name-only "$PRODUCT_SHA" HEAD)"
          test -n "$changed"
          unexpected="$(node -e '
            const allowed = ".github/workflows/v94-v122-hosting-release.yml";
            const changed = process.argv[1].split(/\r?\n/).filter(Boolean);
            process.stdout.write(changed.filter(x => x !== allowed).join("\n"));
          ' "$changed")"
          if test -n "$unexpected"; then
            echo "Unexpected files after certified product SHA:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          echo "CERTIFIED_PRODUCT_IS_ANCESTOR=true"
          echo "POST_PRODUCT_CHANGES_CI_ONLY=true"
          echo "PROTECTED_REFS_OK=true"

      - name: Checkout exact certified product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Prove Functions source unchanged from v121
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$V121_SHA" "$PRODUCT_SHA" -- functions
          test -z "$(git diff --name-only "$V121_SHA" "$PRODUCT_SHA" -- functions)"
          echo "FUNCTIONS_UNCHANGED_FROM_V121=true"

      - name: Verify exact live bytes on both Firebase domains
        shell: bash
        run: |
          set -euo pipefail
          files=(
            gestia-terminal.html
            gestia-core/gestia-core.js
            gestia-core/tools.runtime.js
            gestia-core/jarvis/jarvis.mission.planner-state.js
            gestia-core/jarvis/jarvis.mission.dependencies.js
            gestia-core/nexo/nexo.real-media.tools.js
            modules/terminal/nexo-bootstrap.js
            modules/terminal/proposal-state.js
            jarvis-runtime-contract.json
            jarvis-fs-bridge.js
            jarvis-upload-bridge.js
          )
          bases=(
            https://fixgo-44e4d.web.app
            https://fixgo-44e4d.firebaseapp.com
          )
          mkdir -p "$RUNNER_TEMP/live-v122"
          index=0
          for base in "${bases[@]}"; do
            for file in "${files[@]}"; do
              index=$((index + 1))
              out="$RUNNER_TEMP/live-v122/$index"
              curl -fsSL --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, must-revalidate' \
                -H 'Pragma: no-cache' \
                "$base/$file" \
                -o "$out"
              if ! cmp -s "$file" "$out"; then
                echo "LIVE_BYTE_MISMATCH $base/$file" >&2
                echo "LOCAL_SHA256=$(sha256sum "$file" | awk '{print $1}')" >&2
                echo "LIVE_SHA256=$(sha256sum "$out" | awk '{print $1}')" >&2
                exit 1
              fi
              echo "LIVE_EXACT $base/$file"
            done
          done
          test "$index" -eq 22
          echo "LIVE_EXACT_CHECKS=22"
          echo "BOTH_FIREBASE_DOMAINS_EXACT=true"

      - name: Verify live v122 semantic invariants without shell pipelines
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const bases = [
            'https://fixgo-44e4d.web.app',
            'https://fixgo-44e4d.firebaseapp.com'
          ];
          const headers = {
            'cache-control': 'no-cache, no-store, must-revalidate',
            pragma: 'no-cache'
          };
          async function text(base, file) {
            const response = await fetch(`${base}/${file}`, { headers });
            if (!response.ok) throw new Error(`${base}/${file}:HTTP_${response.status}`);
            return await response.text();
          }
          for (const base of bases) {
            const contract = JSON.parse(await text(base, 'jarvis-runtime-contract.json'));
            if (contract.branch !== 'v94-media-v4n-negative-claims') {
              throw new Error(`${base}:WRONG_BRANCH:${contract.branch}`);
            }
            if (contract.releaseId !== 'v94-generalist-execution-contract-v122-20260810') {
              throw new Error(`${base}:WRONG_RELEASE:${contract.releaseId}`);
            }
            const core = await text(base, 'gestia-core/gestia-core.js');
            if (!core.includes('compactMissionPlannerObservation')) {
              throw new Error(`${base}:PLANNER_COMPACTION_MISSING`);
            }
            const deps = await text(base, 'gestia-core/jarvis/jarvis.mission.dependencies.js');
            if (!deps.includes('tool_contract_dependency')) {
              throw new Error(`${base}:TOOL_CONTRACT_DEPENDENCY_MISSING`);
            }
            const fsBridge = await text(base, 'jarvis-fs-bridge.js');
            if (!fsBridge.includes('2.39.0-generalist-execution-contract-v122')) {
              throw new Error(`${base}:FS_BRIDGE_VERSION_MISSING`);
            }
            if (!fsBridge.includes('registerNexoWebMediaRoutes')) {
              throw new Error(`${base}:FS_MEDIA_ROUTE_AUTHORITY_MISSING`);
            }
            const uploadBridge = await text(base, 'jarvis-upload-bridge.js');
            if (uploadBridge.includes('registerNexoWebMediaRoutes')) {
              throw new Error(`${base}:DUPLICATE_MEDIA_ROUTE_AUTHORITY`);
            }
            const marketing = await text(base, 'gestia-core/nexo/nexo.real-media.tools.js');
            for (const field of [
              'audience', 'offer', 'pain', 'promise', 'differentiator', 'cta',
              'market', 'campaignObjective', 'horizon', 'tone', 'channels',
              'metrics', 'productionRequested'
            ]) {
              if (!marketing.includes(field)) {
                throw new Error(`${base}:MARKETING_SCHEMA_FIELD_MISSING:${field}`);
              }
            }
            console.log(`LIVE_SEMANTIC_OK ${base}`);
          }
          console.log('LIVE_V122_SEMANTIC_INVARIANTS_OK=true');
          NODE

      - name: Final immutable guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          test -z "$(git diff --name-only "$V121_SHA" "$PRODUCT_SHA" -- functions)"
          echo "FINAL_FUNCTIONS_UNCHANGED=true"
          echo "FINAL_PROTECTED_REFS_OK=true"
          echo "V122_HOSTING_RELEASE_CERTIFIED=true"

name: V94 V122 Hosting-only release

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-v122-hosting-release.yml

permissions:
  contents: read

concurrency:
  group: v94-v122-hosting-release
  cancel-in-progress: false

env:
  PRODUCT_SHA: 232db70629e7cc35b1b306329f2157a3c0c57534
  V121_SHA: 8fef8730dea7c1d637d22ad5bed94ec89491e764
  MAIN_SHA: f3fa8e1806b681e860875afd4ce8183d27864873
  POLISH_SHA: 2ae85e670505c5d425a5a0334e99c45168054bb8
  RELEASE_ID: v94-generalist-execution-contract-v122-20260810

jobs:
  certify-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout trigger commit for guards
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard trigger parent and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          echo "TRIGGER_PARENT_PRODUCT_SHA_OK=true"
          echo "PROTECTED_REFS_OK=true"

      - name: Checkout exact certified product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Prove v122 does not modify Functions
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$V121_SHA" "$PRODUCT_SHA" -- functions
          if git diff --name-only "$V121_SHA" "$PRODUCT_SHA" -- functions | grep -q .; then
            echo "Functions changed between v121 and v122" >&2
            exit 1
          fi
          echo "FUNCTIONS_UNCHANGED_FROM_V121=true"

      - name: Verify v122 source invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          grep -Fq '"branch": "v94-media-v4n-negative-claims"' jarvis-runtime-contract.json
          grep -Fq '"releaseId": "v94-generalist-execution-contract-v122-20260810"' jarvis-runtime-contract.json
          grep -Fq '2.39.0-generalist-execution-contract-v122' jarvis-fs-bridge.js
          grep -Fq 'compactMissionPlannerObservation' gestia-core/gestia-core.js
          grep -Fq 'tool_contract_dependency' gestia-core/jarvis/jarvis.mission.dependencies.js
          grep -Fq 'registerNexoWebMediaRoutes' jarvis-fs-bridge.js
          if grep -Fq 'registerNexoWebMediaRoutes' jarvis-upload-bridge.js; then
            echo "Duplicate web-media route authority detected" >&2
            exit 1
          fi
          echo "V122_SOURCE_INVARIANTS_OK=true"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application test dependencies
        run: npm ci

      - name: Install Functions dependencies for tests only
        run: npm --prefix functions ci

      - name: Focused v122 regressions
        run: >-
          node --test
          tests/jarvis-generalist-execution-contract-v122.test.mjs
          tests/jarvis-current-turn-freshness-v119.test.mjs
          tests/jarvis-fs-bridge-v2.test.mjs
          tests/jarvis-semantic-memory-integrity.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Sovereign hosting-only deploy gate
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_HOSTING_ONLY: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
        run: node scripts/jarvis-deploy-gate.mjs

      - name: Build Functions-free Firebase deploy config
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const primary = (Array.isArray(source.hosting) ? source.hosting : [source.hosting])
            .find(item => item && item.site === 'fixgo-44e4d');
          if (!primary) throw new Error('PRIMARY_HOSTING_SITE_CONFIG_NOT_FOUND');
          const output = { hosting: [primary] };
          const target = `${process.env.RUNNER_TEMP}/firebase-v122-hosting.json`;
          fs.writeFileSync(target, `${JSON.stringify(output, null, 2)}\n`, 'utf8');
          const verify = JSON.parse(fs.readFileSync(target, 'utf8'));
          if ('functions' in verify) throw new Error('FUNCTIONS_PRESENT_IN_DEPLOY_CONFIG');
          if (!Array.isArray(verify.hosting) || verify.hosting.length !== 1) throw new Error('HOSTING_SCOPE_NOT_SINGLE_SITE');
          if (verify.hosting[0].site !== 'fixgo-44e4d') throw new Error('WRONG_HOSTING_SITE');
          console.log(`HOSTING_CONFIG=${target}`);
          console.log('FUNCTIONS_ABSENT_FROM_DEPLOY_CONFIG=true');
          console.log('PRIMARY_HOSTING_ONLY=true');
          NODE

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy primary Firebase Hosting only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_TOKEN:-}"
          firebase deploy \
            --only hosting \
            --config "$RUNNER_TEMP/firebase-v122-hosting.json" \
            --project fixgo-44e4d \
            --token "$FIREBASE_TOKEN" \
            --non-interactive \
            2>&1 | tee "$RUNNER_TEMP/v122-hosting-deploy.log"
          test "${PIPESTATUS[0]}" -eq 0
          echo "HOSTING_ONLY_DEPLOY_COMPLETE=true"

      - name: Verify exact live bytes on both Firebase domains
        shell: bash
        run: |
          set -euo pipefail
          files=(
            gestia-terminal.html
            gestia-core/gestia-core.js
            gestia-core/tools.runtime.js
            gestia-core/jarvis/jarvis.mission.planner-state.js
            gestia-core/jarvis/jarvis.mission.dependencies.js
            gestia-core/nexo/nexo.real-media.tools.js
            modules/terminal/nexo-bootstrap.js
            modules/terminal/proposal-state.js
            jarvis-runtime-contract.json
            jarvis-fs-bridge.js
            jarvis-upload-bridge.js
          )
          bases=(
            https://fixgo-44e4d.web.app
            https://fixgo-44e4d.firebaseapp.com
          )
          mkdir -p "$RUNNER_TEMP/live-v122"
          verify_one() {
            local base="$1"
            local file="$2"
            local safe
            safe="$(printf '%s' "$base/$file" | sha256sum | awk '{print $1}')"
            local out="$RUNNER_TEMP/live-v122/$safe"
            for attempt in $(seq 1 30); do
              if curl -fsSL --max-time 20 \
                -H 'Cache-Control: no-cache' \
                "$base/$file?v=${GITHUB_RUN_ID}-${attempt}" \
                -o "$out" && cmp -s "$file" "$out"; then
                echo "LIVE_EXACT $base/$file"
                return 0
              fi
              sleep 2
            done
            echo "LIVE_BYTE_MISMATCH $base/$file" >&2
            if test -f "$out"; then
              echo "LOCAL_SHA256=$(sha256sum "$file" | awk '{print $1}')" >&2
              echo "LIVE_SHA256=$(sha256sum "$out" | awk '{print $1}')" >&2
            fi
            return 1
          }
          for base in "${bases[@]}"; do
            for file in "${files[@]}"; do
              verify_one "$base" "$file"
            done
          done
          echo "BOTH_FIREBASE_DOMAINS_EXACT=true"

      - name: Verify live semantic release invariants
        shell: bash
        run: |
          set -euo pipefail
          for base in https://fixgo-44e4d.web.app https://fixgo-44e4d.firebaseapp.com; do
            contract="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/jarvis-runtime-contract.json?v=$GITHUB_RUN_ID")"
            node -e '
              const value = JSON.parse(process.argv[1]);
              if (value.branch !== "v94-media-v4n-negative-claims") process.exit(1);
              if (value.releaseId !== "v94-generalist-execution-contract-v122-20260810") process.exit(2);
            ' "$contract"
            core="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/gestia-core/gestia-core.js?v=$GITHUB_RUN_ID")"
            deps="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/gestia-core/jarvis/jarvis.mission.dependencies.js?v=$GITHUB_RUN_ID")"
            printf '%s' "$core" | grep -Fq 'compactMissionPlannerObservation'
            printf '%s' "$deps" | grep -Fq 'tool_contract_dependency'
          done
          echo "LIVE_V122_SEMANTIC_INVARIANTS_OK=true"

      - name: Final protected refs and no-Functions-deploy proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cfg = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/firebase-v122-hosting.json`, 'utf8'));
          if ('functions' in cfg) throw new Error('FUNCTIONS_CONFIG_PRESENT_AFTER_DEPLOY');
          if (cfg.hosting?.length !== 1 || cfg.hosting[0]?.site !== 'fixgo-44e4d') throw new Error('HOSTING_SCOPE_CHANGED');
          console.log('FINAL_FUNCTIONS_NOT_IN_DEPLOY_SCOPE=true');
          NODE
          echo "FINAL_PROTECTED_REFS_OK=true"
          echo "V122_HOSTING_RELEASE_CERTIFIED=true"

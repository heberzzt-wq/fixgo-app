name: v139 live reel cache apply

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/scripts/v139-live-reel-cache-apply.py'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  apply-v139-live-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Publish observable run
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'v139-short-reel-bridge-recovery' --arg description "run=${GITHUB_RUN_ID} short reel + bridge recovery" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Guard branch and protected surfaces before patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          ! git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817..HEAD | grep -E '^functions/'
          ! git diff --name-only 2d58a795a1e81a0adc5301bf958f80c604f8ef52..HEAD | grep -E '^multiservicios-web/'
      - name: Apply deterministic v139 reel execution recovery
        run: python .github/scripts/v139-live-reel-cache-apply.py
      - name: Guard exact existing-product patch surface
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              gestia-core/jarvis/jarvis.multitool.pack.js|jarvis-reel-artifact.js|gestia-core/jarvis/jarvis.marketing.engine.js|gestia-core/tools.bridge.js|gestia-core/tools.runtime.js|gestia-core/jarvis/jarvis.actuator.pack.js|gestia-core/jarvis/jarvis.mission.orchestrator.js|tests/jarvis-reel-artifact.test.mjs|tests/jarvis-reel-live-cache-v139.test.mjs) ;;
              *) echo "V139_UNEXPECTED_PATCH_SURFACE:$path" >&2; exit 1 ;;
            esac
          done
      - name: Syntax and focal execution contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check jarvis-reel-artifact.js
          node --check gestia-core/jarvis/jarvis.marketing.engine.js
          node --check gestia-core/tools.bridge.js
          node --check gestia-core/tools.runtime.js
          node --check gestia-core/jarvis/jarvis.actuator.pack.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --test --test-concurrency=1 \
            tests/jarvis-reel-artifact.test.mjs \
            tests/jarvis-reel-live-cache-v139.test.mjs \
            tests/jarvis-reel-native-mp4-v138.test.mjs \
            tests/jarvis-reel-speech-v137.test.mjs \
            tests/jarvis-v139-release-skew-safe-artifacts.test.mjs \
            tests/jarvis-actuator-pack.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-marketing-engine-v2.test.mjs \
            tests/jarvis-marketing-real-delivery.test.mjs
      - name: Full CI
        run: npm run ci:test
      - name: Guard protected surfaces after patch
        shell: bash
        run: |
          set -euo pipefail
          ! git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817..HEAD | grep -E '^functions/'
          ! git diff --name-only 2d58a795a1e81a0adc5301bf958f80c604f8ef52..HEAD | grep -E '^multiservicios-web/'
          git diff --check
      - name: Commit and push certified execution recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            gestia-core/jarvis/jarvis.multitool.pack.js \
            jarvis-reel-artifact.js \
            gestia-core/jarvis/jarvis.marketing.engine.js \
            gestia-core/tools.bridge.js \
            gestia-core/tools.runtime.js \
            gestia-core/jarvis/jarvis.actuator.pack.js \
            gestia-core/jarvis/jarvis.mission.orchestrator.js \
            tests/jarvis-reel-artifact.test.mjs \
            tests/jarvis-reel-live-cache-v139.test.mjs
          git diff --cached --check
          git commit -m '[v139] fix(adj): close short reel and bridge artifact failures'
          git push origin HEAD:v94-media-v4n-negative-claims
      - name: Publish final observable status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state "$state" --arg context 'v139-short-reel-bridge-recovery' --arg description "run=${GITHUB_RUN_ID} result=${JOB_STATUS}" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

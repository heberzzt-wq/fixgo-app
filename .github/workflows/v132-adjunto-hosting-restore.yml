name: v132-adjunto-hosting-restore

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v132-adjunto-hosting-restore.yml

permissions:
  contents: read

jobs:
  restore-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          ! git diff --name-only a09d76c5d42117aa88630f7b0d5fee75290525b2..HEAD | grep -E '^functions/'

      - name: Verify ADJUNTO web root before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -f gestia-terminal.html
          test -f gestia-terminal.js
          test -d gestia-core
          test -d modules
          grep -Fq '<title>Terminal Heberto | ADJUNTO</title>' gestia-terminal.html
          echo "ADJUNTO_WEB_ROOT=$(pwd)"
          echo "ADJUNTO_TRACKED_FILES=$(git ls-files | wc -l)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build single-site config in repository root
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const hosting = Array.isArray(source.hosting)
            ? source.hosting.find(item => item?.site === 'fixgo-44e4d')
            : source.hosting;
          if (!hosting || hosting.site !== 'fixgo-44e4d') {
            throw new Error('ADJUNTO_HOSTING_SITE_NOT_FOUND');
          }
          fs.writeFileSync('.firebase-adjunto-hosting-restore.json', JSON.stringify({ hosting }, null, 2));
          NODE
          test -f .firebase-adjunto-hosting-restore.json
          test -f gestia-terminal.html

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Restore ADJUNTO Hosting only
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_TOKEN:-}"
          firebase deploy \
            --config .firebase-adjunto-hosting-restore.json \
            --only hosting \
            --project fixgo-44e4d \
            --token "$FIREBASE_TOKEN"

      - name: Verify live ADJUNTO route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS --retry 2 --retry-delay 2 'https://fixgo-44e4d.web.app/gestia-terminal.html' || true)"
            if printf '%s' "$body" | grep -Fq '<title>Terminal Heberto | ADJUNTO</title>'; then
              echo "ADJUNTO_LIVE_ROUTE_VERIFIED=true"
              exit 0
            fi
            sleep 5
          done
          echo "ADJUNTO_LIVE_ROUTE_VERIFIED=false" >&2
          exit 1

      - name: Restore marker
        run: |
          echo "V132_ADJUNTO_HOSTING_RESTORED=true"
          echo "V132_FUNCTIONS_DEPLOYED=false"
          echo "V132_MULTISERVICIOS_HOSTING_DEPLOYED=false"

name: V94 single-brain wave4 diagnostic

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-semantic-only-wave4-diagnostic.yml

permissions:
  contents: read

jobs:
  certify-wave4:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Apply all single-brain staging waves
        run: |
          set -o pipefail
          python3 tools/v94_single_brain_prune.py 2>&1 | tee /tmp/v94-wave4-patch.log
          python3 tools/v94_semantic_only_front_patch.py 2>&1 | tee -a /tmp/v94-wave4-patch.log
          python3 tools/v94_semantic_only_core_patch.py 2>&1 | tee -a /tmp/v94-wave4-patch.log
          python3 tools/v94_single_brain_prune_wave2.py 2>&1 | tee -a /tmp/v94-wave4-patch.log
          python3 tools/v94_single_brain_prune_wave3.py 2>&1 | tee -a /tmp/v94-wave4-patch.log
          python3 tools/v94_semantic_only_contract_patch.py 2>&1 | tee -a /tmp/v94-wave4-patch.log
          python3 tools/v94_semantic_only_residue_patch.py 2>&1 | tee -a /tmp/v94-wave4-patch.log
          python3 tools/v94_quality_helper_tail_fix.py 2>&1 | tee -a /tmp/v94-wave4-patch.log
          python3 tools/v94_single_brain_quality_patch.py 2>&1 | tee -a /tmp/v94-wave4-patch.log
          python3 tools/v94_quality_post_patch.py 2>&1 | tee -a /tmp/v94-wave4-patch.log
          python3 tools/v94_wave4_helper_fix.py 2>&1 | tee -a /tmp/v94-wave4-patch.log
          python3 tools/v94_single_brain_prune_wave4.py 2>&1 | tee -a /tmp/v94-wave4-patch.log

      - name: Verify wave4 syntax and isolation
        run: |
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.conversation.composer.js
          node --check gestia-core/gestia-core.js
          node --check gestia-core/brain.engine.js
          node --check gestia-core/semantic.engine.js
          node --check gestia-core/nexo/nexo.mission.compiler.js
          node --check gestia-core/nexo/nexo.mission.compiler.v2.js
          node --check gestia-core/nexo/nexo.semantic-planner-resilience.js
          node --check modules/terminal/nexo-bootstrap.js
          node --check modules/terminal/runtime-governance.js
          node --check gestia-terminal.js
          node --check scripts/check-nexo-private-engine.mjs
          node --check tests/single-semantic-authority.test.mjs
          test ! -e modules/terminal/runtime-intelligence.js
          git diff --check
          test -z "$(git diff --name-only -- functions)"

      - name: Verify single semantic authority contract
        run: |
          node scripts/check-nexo-private-engine.mjs | tee /tmp/v94-wave4-contract.log
          node --test tests/single-semantic-authority.test.mjs tests/nexo-terminal-bootstrap.test.mjs | tee /tmp/v94-wave4-focused.log

      - name: Inventory remaining active-brain residue
        run: |
          python3 tools/v94_single_brain_inventory.py | tee /tmp/v94-wave4-inventory.log
          python3 tools/v94_single_brain_active_refs.py | tee /tmp/v94-wave4-active-refs.log
          python3 - <<'PY' | tee /tmp/v94-wave4-lexical.log
          from pathlib import Path
          files = [
              'gestia-core/jarvis/jarvis.multifunction.planner.js',
              'gestia-core/jarvis/jarvis.conversation.composer.js',
              'gestia-core/gestia-core.js',
              'gestia-terminal.js'
          ]
          needles = ['new RegExp(', '.match(', '.matchAll(', '.exec(', '.test(',
                     'interpretarIntenciones', 'runCognitiveReasoning',
                     'JarvisCognitionEngine', 'JarvisIntentRuntimeV7',
                     'HYBRID_COGNITION_LINKS', 'runtime_intelligence']
          found = []
          for file in files:
              text = Path(file).read_text(encoding='utf-8')
              for needle in needles:
                  for line_no, line in enumerate(text.splitlines(), 1):
                      if needle in line:
                          found.append((file, line_no, needle, line.strip()))
          if found:
              print('SEMANTIC_LEXICAL_RESIDUE')
              for row in found:
                  print('\t'.join(map(str, row)))
          else:
              print('SEMANTIC_LEXICAL_RESIDUE=0')
          PY

      - name: Run complete CI
        run: |
          npm run ci:test 2>&1 | tee /tmp/v94-wave4-ci.log
          test -z "$(git diff --name-only -- functions)"

      - name: Upload wave4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v94-single-brain-wave4-evidence
          path: |
            /tmp/v94-wave4-patch.log
            /tmp/v94-wave4-contract.log
            /tmp/v94-wave4-focused.log
            /tmp/v94-wave4-inventory.log
            /tmp/v94-wave4-active-refs.log
            /tmp/v94-wave4-lexical.log
            /tmp/v94-wave4-ci.log
          if-no-files-found: ignore
          retention-days: 14

name: V94 A2 source narrative guard autopatch

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-a2-source-narrative-guard.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Apply audited source narrative patch
        run: python3 tools/v94_a2_source_narrative_patch.py

      - name: Verify focused syntax and regressions
        run: |
          git diff --check
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.conversation.composer.js
          node --test tests/v94-media-browser-precision-contract.test.mjs tests/jarvis-conversation-composer.test.mjs

      - name: Run complete CI contract
        run: npm run ci:test

      - name: Commit certified patch and remove temporary tooling
        run: |
          git config user.name "OpenAI V94 Handoff"
          git config user.email "actions@users.noreply.github.com"
          git add gestia-core/jarvis/jarvis.multitool.pack.js gestia-core/jarvis/jarvis.conversation.composer.js tests/v94-media-browser-precision-contract.test.mjs tests/jarvis-conversation-composer.test.mjs
          git rm .github/workflows/v94-a2-source-narrative-guard.yml tools/v94_a2_source_narrative_patch.py
          git commit -m "[v94-media-v4n] fix(jarvis): suppress unsupported source narrative residue"
          git push origin HEAD:v94-media-v4n-negative-claims

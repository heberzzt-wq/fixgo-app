name: v130-reel-brand-audio-apply

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v130-reel-brand-audio-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"

      - name: Apply v130 toolchain patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return source.replace(old, new)

          # ------------------------------------------------------------------
          # Structured brand-role discovery in verified web media.
          # ------------------------------------------------------------------
          path = Path('nexo-web-media-bridge.js')
          source = path.read_text()
          source = replace_once(
              source,
              '    "1.1.0-source-declared-cdn-v127";',
              '    "1.2.0-structured-brand-role-v130";',
              'web media version'
          )
          source = replace_once(
              source,
              '    "twitter:player:stream"\n]);',
              '    "twitter:player:stream",\n    "jsonld:logo",\n    "itemprop:logo"\n]);',
              'source declared tags'
          )
          insertion_marker = '''function mediaCandidates(html = "", pageUrl = "") {'''
          structured_helpers = r'''function structuredLogoUrls(value, urls = [], depth = 0) {
    if (value === null || value === undefined || depth > 12) return urls;
    if (Array.isArray(value)) {
        for (const item of value) structuredLogoUrls(item, urls, depth + 1);
        return urls;
    }
    if (typeof value !== "object") return urls;
    for (const [key, nested] of Object.entries(value)) {
        if (String(key || "").toLowerCase() === "logo") {
            if (typeof nested === "string") {
                urls.push(nested);
            }
            else if (nested && typeof nested === "object") {
                for (const field of ["url", "contentUrl", "@id"]) {
                    if (typeof nested[field] === "string") urls.push(nested[field]);
                }
                structuredLogoUrls(nested, urls, depth + 1);
            }
            continue;
        }
        structuredLogoUrls(nested, urls, depth + 1);
    }
    return urls;
}

function jsonLdLogoUrls(html = "") {
    const urls = [];
    const pattern = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
    let match;
    while ((match = pattern.exec(String(html || "")))) {
        const attrs = attributes(`<script ${match[1] || ""}>`);
        if (String(attrs.type || "").trim().toLowerCase() !== "application/ld+json") continue;
        const body = decodeHtml(match[2] || "").trim();
        if (!body) continue;
        try {
            structuredLogoUrls(JSON.parse(body), urls);
        } catch {}
    }
    return [...new Set(urls.map(value => String(value || "").trim()).filter(Boolean))];
}

'''
          if source.count(insertion_marker) != 1:
              raise SystemExit('media candidate insertion marker missing')
          source = source.replace(insertion_marker, structured_helpers + insertion_marker)
          source = replace_once(
              source,
              '    const add = (kind, rawUrl, sourceTag, alt = "") => {',

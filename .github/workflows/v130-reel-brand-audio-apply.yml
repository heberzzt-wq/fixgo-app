          audio_graph = readiness + "function audioContextConstructor(){return window.AudioContext||window.webkitAudioContext||null}async function ensureAudioGraph(){if(audioGraphPromise)return audioGraphPromise;audioGraphPromise=(async()=>{const videos=media.filter(item=>item?.tagName==='VIDEO'),mode=audio?'explicit_audio':videos.length>0?'source_video_audio_route':'silent_visual',Context=audioContextConstructor();if(mode==='silent_visual'||!Context)return{mode,available:false,trackCount:0,context:null,destination:null,nodes:[]};try{const context=new Context(),destination=context.createMediaStreamDestination(),sources=audio?[audio]:videos,nodes=[];for(const item of sources){if(item.tagName==='VIDEO'&&!audio)item.muted=false;const node=context.createMediaElementSource(item);node.connect(destination);node.connect(context.destination);nodes.push(node)}if(context.state==='suspended')await context.resume().catch(()=>{});return{mode,available:true,trackCount:destination.stream.getAudioTracks().length,context,destination,nodes}}catch(error){return{mode,available:false,trackCount:0,context:null,destination:null,nodes:[],error:error?.message||String(error)}}})();return audioGraphPromise}async function attachExportAudioTracks(stream){const graph=await ensureAudioGraph();let audioTracksAdded=0;if(graph.available&&graph.destination){for(const track of graph.destination.stream.getAudioTracks()){stream.addTrack(track);audioTracksAdded+=1}}else if(audio&&audio.captureStream){for(const track of audio.captureStream().getAudioTracks()){stream.addTrack(track);audioTracksAdded+=1}}const detail={audioMixMode:graph.mode,audioGraphAvailable:graph.available,audioTracksAdded};window.__JARVIS_REEL_AUDIO_ROUTING__=detail;return detail}\n"

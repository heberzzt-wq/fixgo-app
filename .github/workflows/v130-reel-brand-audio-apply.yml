      - name: Guard Functions unchanged
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^functions/'; then
            echo "Functions changed in v130" >&2
            exit 1
          fi

      - name: Syntax focal v130
        run: |
          node --check nexo-web-media-bridge.js
          node --check gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          node --check jarvis-reel-artifact.js
          node --check jarvis-fs-bridge.js
          node --check gestia-core/jarvis/jarvis.actuator.pack.js

      - name: Focal v130 tests
        run: node --test tests/nexo-web-media-bridge.test.mjs tests/nexo-real-media-runtime-guard-v128.test.mjs tests/jarvis-reel-artifact.test.mjs tests/jarvis-real-media-reel-hydration-v127.test.mjs tests/nexo-real-media-tools.test.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit v130 product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[v130] feat(adj): complete reel brand and audio toolchain"
          git push origin HEAD:v94-media-v4n-negative-claims

name: v130-reel-brand-audio-apply

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - scripts/apply-v130-reel-brand-audio-v2.mjs.gz.b64
      - .github/workflows/v130-reel-brand-audio-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"

      - name: Apply v130 product patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/jarvis-reel-artifact.test.mjs")
          source = path.read_text()
          line = "    assert.match(html, /qualityGatePassed/);\n"
          if source.count(line) != 1:
              raise SystemExit(f"quality gate compatibility line count={source.count(line)}")
          path.write_text(source.replace(line, "", 1))
          PY

          base64 -d scripts/apply-v130-reel-brand-audio-v2.mjs.gz.b64 | gzip -d > /tmp/apply-v130.py
          python3 /tmp/apply-v130.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/jarvis-reel-artifact.test.mjs")
          source = path.read_text()
          quality = "    assert.match(html, /qualityGatePassed/);\n"
          anchor = "    assert.match(html, /scene\\.mediaUrl\\.startsWith\\('https:'\\)/);\n"
          if quality not in source:
              if source.count(anchor) != 1:
                  raise SystemExit(f"quality gate restore anchor count={source.count(anchor)}")
              source = source.replace(anchor, anchor + quality, 1)
          path.write_text(source)
          PY

          rm -f scripts/apply-v130-reel-brand-audio.mjs.gz.b64
          rm -f scripts/apply-v130-reel-brand-audio-v2.mjs.gz.b64
          rm -f scripts/apply-v130-reel-brand-audio-v3.mjs.gz.b64
          rm -f scripts/v130-reel-patcher.part1.b64
          rm -f scripts/v130-reel-patcher.part2.b64
          rm -f scripts/v130-reel-patcher.part3.b64
          rm -f scripts/v130-reel-patcher.part4.b64
          rm .github/workflows/v130-reel-brand-audio-apply.yml

      - name: Guard Functions unchanged
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^functions/'; then
            echo "Functions changed in v130" >&2
            exit 1
          fi

      - name: Syntax focal v130
        run: |
          node --check nexo-web-media-bridge.js
          node --check gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          node --check jarvis-reel-artifact.js
          node --check jarvis-fs-bridge.js
          node --check gestia-core/jarvis/jarvis.actuator.pack.js

      - name: Focal v130 tests
        run: node --test tests/nexo-web-media-bridge.test.mjs tests/nexo-real-media-runtime-guard-v128.test.mjs tests/jarvis-reel-artifact.test.mjs tests/jarvis-real-media-reel-hydration-v127.test.mjs tests/nexo-real-media-tools.test.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit v130 product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[v130] feat(adj): complete reel brand and audio toolchain"
          git push origin HEAD:v94-media-v4n-negative-claims

name: v136 slash branch resolver diagnostic

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v136-full-ci-failure-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          git diff --quiet HEAD^ HEAD -- functions/
      - name: Install root dependencies
        run: npm ci
      - name: Print resolver source and live outputs
        shell: bash
        run: |
          set -euo pipefail
          echo '=== RESOLVER SOURCE ==='
          line="$(grep -n 'function resolveBridgeRepositoryTarget\|export function resolveBridgeRepositoryTarget' jarvis-fs-bridge.js | head -n 1 | cut -d: -f1)"
          test -n "$line"
          start=$(( line > 20 ? line - 20 : 1 ))
          end=$(( line + 170 ))
          sed -n "${start},${end}p" jarvis-fs-bridge.js
          echo '=== LIVE OUTPUTS ==='
          node --input-type=module <<'NODE'
          import { resolveBridgeRepositoryTarget } from './jarvis-fs-bridge.js';
          const branch = 'codex/jarvis-v8-runtime-foundation';
          const url = `https://github.com/heberzzt-wq/fixgo-app/blob/${branch}`;
          for (const input of [url, `${url}/gestia-core/tools.runtime.js`, { target: url }]) {
            console.log(JSON.stringify({ input, resolved: resolveBridgeRepositoryTarget(input) }, null, 2));
          }
          NODE
          echo '=== TARGETED TEST ==='
          node --test tests/jarvis-repo-target-runtime.test.mjs

name: v136 slash branch resolver diagnostic

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v136-full-ci-failure-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          git diff --quiet HEAD^ HEAD -- functions/
      - name: Locate exact failing tests and resolver source
        shell: bash
        run: |
          set -euo pipefail
          file="$(grep -RFl --exclude-dir=node_modules --exclude-dir=.git 'bridge target resolver accepts the exact GitHub slash-branch URL as a string' tests | head -n 1)"
          test -n "$file"
          echo "V136_FAILING_TEST_FILE=$file"
          echo '=== FAILING TEST CONTEXT ==='
          line="$(grep -n 'bridge target resolver accepts the exact GitHub slash-branch URL as a string' "$file" | head -n 1 | cut -d: -f1)"
          start=$(( line > 30 ? line - 30 : 1 ))
          end=$(( line + 120 ))
          sed -n "${start},${end}p" "$file"
          echo '=== RESOLVER REFERENCES ==='
          grep -RFn --exclude-dir=node_modules --exclude-dir=.git 'resolveBridgeTarget' . | head -n 80 || true
          grep -RFn --exclude-dir=node_modules --exclude-dir=.git 'target resolver' . | head -n 80 || true
          echo '=== TARGETED TEST RUN ==='
          node --test "$file"

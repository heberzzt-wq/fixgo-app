name: v129-reel-video-loop-fix

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v129-reel-video-loop-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply loop-safe video correction
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('jarvis-reel-artifact.js')
          source = path.read_text()
          replacements = [
              (
                  "item.preload='auto';item.loop=true;return item}",
                  "item.preload='auto';item.loop=true;if(scene.mediaUrl.startsWith('https:'))item.crossOrigin='anonymous';return item}"
              ),
              (
                  "if(Math.abs(item.currentTime-local)>.35)item.currentTime=Math.min(local,item.duration||local);",
                  "const sourceDuration=Number.isFinite(item.duration)&&item.duration>0?item.duration:null,targetTime=sourceDuration?local%sourceDuration:local;if(Math.abs(item.currentTime-targetTime)>.35)item.currentTime=targetTime;"
              ),
              (
                  "else{draw(spec.durationSeconds-.001);statusEl.textContent='Vista previa finalizada.'}",
                  "else{draw(spec.durationSeconds-.001);media.forEach(item=>item?.tagName==='VIDEO'&&!item.paused&&item.pause());statusEl.textContent='Vista previa finalizada.'}"
              )
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected one match, got {source.count(old)} for {old[:60]}')
              source = source.replace(old, new)
          path.write_text(source)

          test_path = Path('tests/jarvis-reel-artifact.test.mjs')
          tests = test_path.read_text()
          marker = "    assert.match(html, /item\\.loop=true/);\n"
          insertion = marker + "    assert.match(html, /local%sourceDuration/);\n    assert.match(html, /scene\\.mediaUrl\\.startsWith\\('https:'\\)/);\n"
          if tests.count(marker) != 1:
              raise SystemExit(f'expected one test marker, got {tests.count(marker)}')
          tests = tests.replace(marker, insertion)
          test_path.write_text(tests)
          PY
          rm .github/workflows/v129-reel-video-loop-fix.yml

      - name: Guard Functions unchanged
        run: |
          if git diff --name-only | grep -E '^functions/'; then
            echo "Functions changed in v129" >&2
            exit 1
          fi

      - name: Syntax and focal regression
        run: |
          node --check jarvis-reel-artifact.js
          node --test tests/jarvis-reel-artifact.test.mjs tests/jarvis-real-media-reel-hydration-v127.test.mjs
          git diff --check

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[v129] fix(reel): loop source video safely"
          git push origin HEAD:v94-media-v4n-negative-claims

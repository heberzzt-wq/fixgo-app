name: v135 browser network media apply

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/scripts/v135-browser-network-media-apply.py'
      - '.github/scripts/v135-browser-network-media-tests.py'
      - '.github/workflows/v135-browser-network-media-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard isolated branch and untouched Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          git diff --quiet HEAD^ HEAD -- functions/
      - name: Install root dependencies
        run: npm ci
      - name: Apply v135 source patch
        run: python .github/scripts/v135-browser-network-media-apply.py
      - name: Materialize v135 regression
        run: python .github/scripts/v135-browser-network-media-tests.py
      - name: Guard functional change surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet HEAD -- functions/
          mapfile -t changed < <(git diff --name-only HEAD)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              jarvis-fs-bridge.js|nexo-web-media-bridge.js|gestia-core/nexo/nexo.real-media.tools.js|modules/terminal/nexo-bootstrap.js|modules/terminal/proposal-state.js|gestia-terminal.html|tests/nexo-browser-media-fallback-v135.test.mjs) ;;
              *) echo "UNEXPECTED_V135_PATH:$path" >&2; exit 1 ;;
            esac
          done
      - name: Syntax v135
        shell: bash
        run: |
          set -euo pipefail
          node --check jarvis-fs-bridge.js
          node --check nexo-web-media-bridge.js
          node --check gestia-core/nexo/nexo.real-media.tools.js
          node --check modules/terminal/nexo-bootstrap.js
          node --check modules/terminal/proposal-state.js
      - name: Focal v135
        run: >-
          node --test
          tests/nexo-browser-media-fallback-v135.test.mjs
          tests/nexo-web-media-bridge.test.mjs
          tests/nexo-real-media-tools.test.mjs
          tests/jarvis-reel-real-production-v134.test.mjs
          tests/nexo-terminal-bootstrap.test.mjs
          tests/proposal-state.test.mjs
          tests/jarvis-fs-bridge-v2.test.mjs
          tests/single-semantic-authority.test.mjs
      - name: Whitespace guard
        run: git diff --check
      - name: Commit and push functional v135
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jarvis-fs-bridge.js \
            nexo-web-media-bridge.js \
            gestia-core/nexo/nexo.real-media.tools.js \
            modules/terminal/nexo-bootstrap.js \
            modules/terminal/proposal-state.js \
            gestia-terminal.html \
            tests/nexo-browser-media-fallback-v135.test.mjs
          git diff --cached --quiet && { echo 'NO_V135_FUNCTIONAL_CHANGE'; exit 1; }
          git commit -m '[v135] feat(adj): collect dynamic reel media through browser network'
          git push origin HEAD:v94-media-v4n-negative-claims

name: contract-audit current-policy v5 single-authority probe

on:
  push:
    branches: [v94-media-v4n-negative-claims]
    paths: ['.github/workflows/contract-audit-current-policy-closure-v5-single-authority-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 8de46c00565b041b006f6a33d81ff6c22a616846
  HANDOFF_PATCH_SHA256: 0b357d2cb607276cf9ec9b65a66a23caf05379cdaaab22972bc9764f9407a98a
  CERTIFIED_CARRIER_SHA: cebe6f399d4edf4f234e584e0a42cf980b3a404d
  FLOW_V2_CARRIER_SHA: 8ef564d954de07a3b63d8a117ada4c2bcf40e3b4
  FINAL_V3_CARRIER_SHA: 71e4b1f847640dd9d3d9b142b0158073f5451336
  FINAL_V2_CARRIER_SHA: 21d1fc513d7817e7bfd9913ec113bd7923f3bb10
  V3_CARRIER_SHA: e32b68752e452ef1d4f3eb6ba8fa375cce5787ab
  PRIOR_V2_CARRIER_SHA: 1892d5f7726ce41402600d49b22fb1cf62e830fb
  PRIOR_CARRIER_SHA: 2a51c1c349edac309465a22fd73c5b157dbaccd9

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Reconstruct exact V5 candidate
        shell: bash
        run: |
          set -euo pipefail
          git show "${PRIOR_CARRIER_SHA}:.github/workflows/contract-audit-production-chain-runtime.yml" > /tmp/prior.yml
          git show "${PRIOR_V2_CARRIER_SHA}:.github/workflows/contract-audit-human-regression-closeout-v2.yml" > /tmp/prior-v2.yml
          git show "${V3_CARRIER_SHA}:.github/workflows/contract-audit-human-regression-closeout-v3.yml" > /tmp/v3.yml
          git show "${FINAL_V2_CARRIER_SHA}:.github/workflows/contract-audit-human-regression-closeout-final-v2.yml" > /tmp/final-v2.yml
          git show "${FINAL_V3_CARRIER_SHA}:.github/workflows/contract-audit-human-regression-closeout-final-v3.yml" > /tmp/final-v3.yml
          git show "${FLOW_V2_CARRIER_SHA}:.github/workflows/contract-audit-mission-flow-closeout-v2.yml" > /tmp/flow-v2.yml
          cp .github/candidates/contract-audit/mission-contract-authority-closeout-v2.py /tmp/authority-v2.py
          cp .github/candidates/contract-audit/mission-contract-policy-compat-v3.py /tmp/policy-v3.py
          cp .github/candidates/contract-audit/mission-contract-provider-resilience-v1.py /tmp/provider-v1.py
          cp .github/candidates/contract-audit/mission-contract-provider-resilience-v2.py /tmp/provider-v2.py
          cp .github/candidates/contract-audit/mission-contract-provider-resilience-v3.py /tmp/provider-v3.py
          cp .github/candidates/contract-audit/mission-contract-current-policy-closure-v5.py /tmp/current-policy-v5.py
          cp .github/candidates/contract-audit/mission-contract-current-policy-closure-v5-test-compat.py /tmp/current-policy-v5-test-compat.py
          python3 - <<'PY'
          from pathlib import Path
          def extract(src,a,b,out):
              text=Path(src).read_text()
              s=text.index(f'      - name: {a}\n')
              rs=text.index('        run: |\n',s)+len('        run: |\n')
              e=text.index(f'\n      - name: {b}\n',rs)
              lines=[]
              for line in text[rs:e].splitlines():
                  if line.startswith('          '): lines.append(line[10:])
                  elif not line.strip(): lines.append('')
                  else: raise SystemExit(f'INDENT:{src}:{a}:{line!r}')
              Path(out).write_text('\n'.join(lines)+'\n')
          extract('/tmp/prior.yml','Reconstruct certified candidate','Make MISSION_CONTRACT audit additive to the same plan','/tmp/s1.sh')
          extract('/tmp/prior.yml','Make MISSION_CONTRACT audit additive to the same plan','Constrain exact-source research inside the existing web.research implementation','/tmp/s2.sh')
          extract('/tmp/prior.yml','Constrain exact-source research inside the existing web.research implementation','Install dependencies','/tmp/s3.sh')
          extract('/tmp/prior-v2.yml','Preserve canonical tool observations and retry dynamic media once','Install dependencies','/tmp/s4.sh')
          extract('/tmp/v3.yml','Preserve exact web-media provenance through mission semantics','Install dependencies','/tmp/s5raw.sh')
          extract('/tmp/final-v2.yml','Fix shared canonical tool semantics authority','Install dependencies','/tmp/s6.sh')
          extract('/tmp/final-v3.yml','Preserve compatible canonical marketing readiness','Install dependencies','/tmp/s7.sh')
          extract('/tmp/flow-v2.yml','Preserve complete semantic mission flow','Install dependencies','/tmp/s8.sh')
          raw=Path('/tmp/s5raw.sh').read_text(); fixed=[]; replaced=False
          for line in raw.splitlines():
              if 'return parsed.toString().replace(' in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  fixed += [indent+'const normalized = parsed.toString();', indent+'return normalized.endsWith("/") ? normalized.slice(0, -1) : normalized;']
                  replaced=True
              else: fixed.append(line)
          if not replaced: raise SystemExit('URL_NORMALIZATION_LINE_NOT_FOUND')
          script='\n'.join(fixed)+'\n'
          if 'explicitObjectiveSatisfied === true &&' not in script: raise SystemExit('MARKETING_LOCAL_CANONICAL_ANCHOR_NOT_FOUND')
          Path('/tmp/s5.sh').write_text(script.replace('explicitObjectiveSatisfied === true &&','payload?.objectiveSatisfied === true &&',1))
          PY
          for f in /tmp/s1.sh /tmp/s2.sh /tmp/s3.sh /tmp/s4.sh /tmp/s5.sh /tmp/s6.sh /tmp/s7.sh /tmp/s8.sh; do bash "$f"; done
          python3 /tmp/authority-v2.py
          python3 /tmp/policy-v3.py
          python3 /tmp/provider-v1.py
          python3 /tmp/provider-v2.py
          python3 /tmp/provider-v3.py
          python3 /tmp/current-policy-v5.py
          python3 /tmp/current-policy-v5-test-compat.py

      - name: Canonical 1 semantic brain contract markers
        run: node -e "const f=require('fs'),p=f.readFileSync('gestia-core/jarvis/jarvis.multifunction.planner.js','utf8'),c=f.readFileSync('gestia-core/gestia-core.js','utf8'); if(!/jarvisSemanticPlan/.test(p)||!/SINGLE SEMANTIC BRAIN CONTRACT/.test(c)||!/SINGLE_SEMANTIC_BRAIN_FAIL_CLOSED/.test(c)||/runCognitiveReasoning|sincronizarCorralSemantico|interpretarIntenciones/.test(c)) process.exit(1)"
      - name: Canonical 2 legacy cognition canaries
        if: always()
        run: node - <<'NODE'
          const f=require('fs'); for(const x of ['gestia-core/brain.engine.js','gestia-core/semantic.engine.js','gestia-core/nexo/nexo.mission.compiler.js','gestia-core/nexo/nexo.mission.compiler.v2.js','gestia-core/nexo/nexo.semantic-planner-resilience.js']){const s=f.readFileSync(x,'utf8'); if(!/COMPATIBILITY_CANARY_ONLY/.test(s)||/globalThis\.fetch\s*=|compileNexoMission\s*\(|\.match(All)?\s*\(|\.test\s*\(/.test(s)) {console.error(x); process.exit(1)}}
          NODE
      - name: Canonical 3 NEXO runtime resilience absent
        if: always()
        run: node -e "const f=require('fs'),b=f.readFileSync('modules/terminal/nexo-bootstrap.js','utf8'),m=f.readFileSync('gestia-core/jarvis/jarvis.marketing.engine.js','utf8'); if(/nexo\.semantic-planner-resilience/.test(b)||/nexo\.semantic-planner-resilience/.test(m)||!/nexo\.real-media\.tools/.test(b)) process.exit(1)"
      - name: Canonical 4 alternate runtime absent
        if: always()
        run: node -e "const f=require('fs'),t=f.readFileSync('gestia-terminal.js','utf8'); if(f.existsSync('modules/terminal/runtime-intelligence.js')||/HYBRID_COGNITION_LINKS|runtime_intelligence/.test(t)||!/__SEMANTIC_AUTHORITY__/.test(t)||!/alternateBrains:\s*0/.test(t)) process.exit(1)"
      - name: Canonical 5a planner has no new RegExp
        if: always()
        run: node -e "const s=require('fs').readFileSync('gestia-core/jarvis/jarvis.multifunction.planner.js','utf8'); if(s.includes('new RegExp')) process.exit(1)"
      - name: Canonical 5b planner has no match call
        if: always()
        run: node -e "const s=require('fs').readFileSync('gestia-core/jarvis/jarvis.multifunction.planner.js','utf8'); if(s.includes('.match(')) process.exit(1)"
      - name: Canonical 5c planner has no matchAll call
        if: always()
        run: node -e "const s=require('fs').readFileSync('gestia-core/jarvis/jarvis.multifunction.planner.js','utf8'); if(s.includes('.matchAll(')) process.exit(1)"
      - name: Canonical 5d planner has no exec call
        if: always()
        run: node -e "const s=require('fs').readFileSync('gestia-core/jarvis/jarvis.multifunction.planner.js','utf8'); if(s.includes('.exec(')) process.exit(1)"
      - name: Canonical 5e planner has no test call
        if: always()
        run: node -e "const s=require('fs').readFileSync('gestia-core/jarvis/jarvis.multifunction.planner.js','utf8'); if(s.includes('.test(')) process.exit(1)"
      - name: Canonical 5f composer has no lexical regex brain
        if: always()
        run: node -e "const s=require('fs').readFileSync('gestia-core/jarvis/jarvis.conversation.composer.js','utf8'); for(const x of ['new RegExp','.match(','.matchAll(','.exec(','.test(']) if(s.includes(x)){console.error(x);process.exit(1)}"
      - name: Canonical 6 terminal lexical router absent
        if: always()
        run: node -e "const s=require('fs').readFileSync('gestia-terminal.js','utf8'); if(!/naturalIntentAuthority:\s*\"jarvisSemanticPlan\"/.test(s)||!/lexicalFallbackAllowed:\s*false/.test(s)||/APPROVAL_WORDS|CANCEL_WORDS|REPO SEARCH INTERCEPTOR|QUICK COMMANDS JARVIS|REPO AUDIT INTERCEPTORS|APPROVAL DETECTED/.test(s)) process.exit(1)"
      - name: Canonical 7 branding never interprets approval
        if: always()
        run: node -e "const s=require('fs').readFileSync('gestia-core/nexo/nexo.ui.branding.js','utf8'); if(/EXACT_APPROVAL_COMMANDS|isNexoApprovalCommand|normalizeNexoCommand|input\.value\s*=\s*\"proceder\"/.test(s)||!/semanticAuthority:\s*\"jarvisSemanticPlan\"/.test(s)) process.exit(1)"
      - name: Canonical exact test
        if: always()
        run: node --test tests/single-semantic-authority.test.mjs

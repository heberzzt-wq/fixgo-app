name: V94 v121 step4 production regression

on:
  push:
    branches: [v94-media-v4n-negative-claims]
    paths: [.github/workflows/v94-v121-step4-production-regression.yml]

permissions:
  contents: read

env:
  BASELINE: fc021b3112542dbcdb9d236a17e0b71ee547463b

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard isolated branch and immutable Functions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          git cat-file -e "$BASELINE^{commit}"
          git diff --quiet "$BASELINE" HEAD -- functions
          for p in \
            scripts/v119-current-turn-freshness-fix.py \
            scripts/v120-generalist-page-integrity-fix.py \
            scripts/v120-neutral-forensics-probe-fix.py \
            scripts/v121-page-factual-integrity-fix.py; do
            test -f "$p"
          done

      - name: Install all test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix functions --ignore-scripts
          git diff --quiet "$BASELINE" HEAD -- functions

      - name: Apply certified staging stack
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v119-current-turn-freshness-fix.py
          python scripts/v120-generalist-page-integrity-fix.py
          python scripts/v120-neutral-forensics-probe-fix.py
          python scripts/v121-page-factual-integrity-fix.py
          git diff --check
          git diff --quiet "$BASELINE" HEAD -- functions

      - name: Page production matrix
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/jarvis-page-factual-integrity-v121.test.mjs \
            tests/jarvis-generalist-page-integrity-v120.test.mjs \
            tests/jarvis-current-turn-freshness-v119.test.mjs \
            tests/jarvis-page-request-contract-v118.test.mjs \
            tests/jarvis-page-artifact.test.mjs \
            tests/jarvis-page-browser-fallback-v115.test.mjs \
            tests/jarvis-peninsula-page-v114.test.mjs

      - name: PDF and document production matrix
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            tests/jarvis-pdf-layout.test.mjs \
            tests/jarvis-pdf-visual.test.mjs \
            tests/jarvis-docx-artifact.test.mjs \
            tests/jarvis-document-analysis-routing.test.mjs \
            tests/jarvis-document-extractor.test.mjs \
            tests/jarvis-document-validator.test.mjs \
            tests/jarvis-quote-pdf.test.mjs; do
            test -f "$p"
          done
          node --test \
            tests/jarvis-pdf-layout.test.mjs \
            tests/jarvis-pdf-visual.test.mjs \
            tests/jarvis-docx-artifact.test.mjs \
            tests/jarvis-document-analysis-routing.test.mjs \
            tests/jarvis-document-extractor.test.mjs \
            tests/jarvis-document-validator.test.mjs \
            tests/jarvis-quote-pdf.test.mjs

      - name: Attachment and media analysis matrix
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            tests/jarvis-attachments.test.mjs \
            tests/jarvis-media-ingestion-precision.test.mjs; do
            test -f "$p"
          done
          node --test \
            tests/jarvis-attachments.test.mjs \
            tests/jarvis-media-ingestion-precision.test.mjs

      - name: Web and repository analysis matrix
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            tests/jarvis-web-research.test.cjs \
            tests/jarvis-repo-intelligence.test.mjs \
            tests/jarvis-repo-target-runtime.test.mjs \
            tests/repo-source-structure.test.mjs; do
            test -f "$p"
          done
          node --test \
            tests/jarvis-web-research.test.cjs \
            tests/jarvis-repo-intelligence.test.mjs \
            tests/jarvis-repo-target-runtime.test.mjs \
            tests/repo-source-structure.test.mjs

      - name: Mission and generalist orchestration matrix
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-generalist-current-turn.test.mjs \
            tests/jarvis-semantic-memory-integrity.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-live-human-reds-v113.test.mjs
          git diff --quiet "$BASELINE" HEAD -- functions

      - name: Full CI
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:test
          git diff --quiet "$BASELINE" HEAD -- functions

      - name: Step4 proof
        shell: bash
        run: |
          set -euo pipefail
          echo "V121_STEP4_PRODUCTION_REGRESSION_GREEN"
          git diff --quiet "$BASELINE" HEAD -- functions

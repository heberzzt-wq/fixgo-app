name: V94 v113 v5 yaml diagnostic

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-v113-v5-yaml-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
      - name: Parse YAML and inspect suspicious lines
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/v94-live-human-reds-v113-fix-v5.yml", aliases: true); puts "RUBY_YAML_OK"' 2>&1 | tee /tmp/v5-yaml.txt || true
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/v94-live-human-reds-v113-fix-v5.yml')
          lines=p.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(lines,1):
              if '\t' in line or '${{' in line or line.lstrip().startswith('!') or ': ' in line and line.startswith('      - name:'):
                  print(f'{i}: {line}')
          print('LINES',len(lines))
          PY

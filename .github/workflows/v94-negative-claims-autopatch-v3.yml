name: V94 negative visual literal claims autopatch v3

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-negative-claims-autopatch-v3.yml

permissions:
  contents: write

concurrency:
  group: v94-negative-claims-autopatch-v3
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply literal-scoped fail-closed patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ANCHOR_COUNT_MISMATCH {path}: expected 1 got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/v94-negative-claims-autopatch.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )
          script = script.replace("browser_regression = r'''", "browser_regression = '''", 1)
          script = script.replace("composer_regression = r'''", "composer_regression = '''", 1)
          exec(compile(script, 'v94-negative-claims-base-patch.py', 'exec'))

          multitool = 'gestia-core/jarvis/jarvis.multitool.pack.js'
          composer = 'gestia-core/jarvis/jarvis.conversation.composer.js'

          replace_once(
              multitool,
              '''function mediaNarrativeContainsUnsupportedNegativeVisualClaim(value) {\n    if (value == null) return false;\n    if (typeof value === "string") {\n        return MEDIA_UNSUPPORTED_NEGATIVE_VISUAL_CLAIM_PATTERN.test(value);\n    }\n    if (Array.isArray(value)) {\n        return value.some(item =>\n            mediaNarrativeContainsUnsupportedNegativeVisualClaim(item)\n        );\n    }\n    if (typeof value !== "object") return false;\n    return Object.values(value).some(item =>\n        mediaNarrativeContainsUnsupportedNegativeVisualClaim(item)\n    );\n}\n''',
              '''function mediaNarrativeContainsUnsupportedNegativeVisualClaim(\n    value,\n    verifiedValues = []\n) {\n    if (value == null) return false;\n    if (typeof value === "string") {\n        if (!MEDIA_UNSUPPORTED_NEGATIVE_VISUAL_CLAIM_PATTERN.test(value)) {\n            return false;\n        }\n        const normalizedNarrative = normalizeMediaContractLiteral(value);\n        return verifiedValues.some(verified =>\n            verified.length >= 3 &&\n            normalizedNarrative.includes(verified)\n        );\n    }\n    if (Array.isArray(value)) {\n        return value.some(item =>\n            mediaNarrativeContainsUnsupportedNegativeVisualClaim(\n                item,\n                verifiedValues\n            )\n        );\n    }\n    if (typeof value !== "object") return false;\n    return Object.values(value).some(item =>\n        mediaNarrativeContainsUnsupportedNegativeVisualClaim(\n            item,\n            verifiedValues\n        )\n    );\n}\n'''
          )

          replace_once(
              multitool,
              '''                mediaNarrativeContainsUnsupportedNegativeVisualClaim(item);\n''',
              '''                mediaNarrativeContainsUnsupportedNegativeVisualClaim(\n                    item,\n                    globalVerifiedValues\n                );\n'''
          )

          replace_once(
              composer,
              '''function groundedNaturalEvidenceTexts(items = [], verifiedValues = []) {\n''',
              '''function renderContainsUnsupportedNegativeLiteralClaim(\n    value,\n    verifiedValues = []\n) {\n    const narrative = String(value || "");\n    if (!RENDER_UNSUPPORTED_NEGATIVE_VISUAL_CLAIM_PATTERN.test(narrative)) {\n        return false;\n    }\n    const normalizedNarrative = normalizedGroundedLiteral(narrative);\n    return verifiedValues.some(verified =>\n        verified.length >= 3 &&\n        normalizedNarrative.includes(verified)\n    );\n}\n\nfunction groundedNaturalEvidenceTexts(items = [], verifiedValues = []) {\n'''
          )

          replace_once(
              composer,
              '''                !RENDER_CAPTURE_CONTEXT_CLAIM_PATTERN.test(value) &&\n                !RENDER_UNSUPPORTED_NEGATIVE_VISUAL_CLAIM_PATTERN.test(value)\n''',
              '''                !RENDER_CAPTURE_CONTEXT_CLAIM_PATTERN.test(value) &&\n                !renderContainsUnsupportedNegativeLiteralClaim(\n                    value,\n                    verifiedValues\n                )\n'''
          )
          PY

      - name: Verify focused syntax and regressions
        run: |
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.conversation.composer.js
          node --test tests/v94-media-browser-precision-contract.test.mjs tests/jarvis-conversation-composer.test.mjs
          git diff --check

      - name: Run complete CI contract
        run: npm run ci:test

      - name: Commit verified patch and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/v94-negative-claims-autopatch.yml
          rm .github/workflows/v94-negative-claims-autopatch-v2.yml
          rm .github/workflows/v94-negative-claims-autopatch-v3.yml
          git config user.name "OpenAI V94 Handoff"
          git config user.email "actions@users.noreply.github.com"
          git add gestia-core/jarvis/jarvis.multitool.pack.js gestia-core/jarvis/jarvis.conversation.composer.js tests/v94-media-browser-precision-contract.test.mjs tests/jarvis-conversation-composer.test.mjs .github/workflows/v94-negative-claims-autopatch.yml .github/workflows/v94-negative-claims-autopatch-v2.yml .github/workflows/v94-negative-claims-autopatch-v3.yml
          git commit -m "[v94-media-v4n] fix(jarvis): require evidence for negative literal claims"
          git push origin HEAD:v94-media-v4n-negative-claims

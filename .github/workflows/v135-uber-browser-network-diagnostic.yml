name: v135 uber browser network diagnostic

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v135-uber-browser-network-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          git diff --quiet HEAD^ HEAD -- functions/
      - name: Install root dependencies
        run: npm ci
      - name: Capture and verify Uber Eats dynamic media
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { captureBrowserNetworkMedia } from './jarvis-fs-bridge.js';
          import { collectNexoRealWebMedia } from './nexo-web-media-bridge.js';

          const url = 'https://www.ubereats.com/mx/store/takos-el-dorado-cancun/DmKfCVrVW9W46Zx3LBI8jw';
          const observed = await captureBrowserNetworkMedia({
            url,
            timeoutMs: 45000,
            root: process.cwd()
          });
          console.log('V135_BROWSER_NETWORK_OBSERVED', JSON.stringify({
            ok: observed?.ok === true,
            status: observed?.status,
            candidateCount: observed?.candidateCount || 0,
            counts: observed?.counts || null,
            engine: observed?.engine || null,
            sample: (observed?.media || []).slice(0, 12).map(item => ({
              kind: item.kind,
              mimeType: item.mimeType,
              resourceType: item.resourceType,
              declaredBytes: item.declaredBytes,
              host: (() => { try { return new URL(item.url).hostname; } catch { return ''; } })(),
              path: (() => { try { return new URL(item.url).pathname.slice(0, 160); } catch { return ''; } })()
            }))
          }, null, 2));
          if (observed?.ok !== true || Number(observed?.candidateCount || 0) < 1) {
            process.exitCode = 2;
          } else {
            const collected = await collectNexoRealWebMedia({
              url,
              discoveredMedia: observed.media,
              requireImages: true,
              requireAnyVisual: true,
              maxImages: 8,
              maxVideos: 3,
              timeoutMs: 30000,
              root: process.cwd()
            });
            console.log('V135_BROWSER_NETWORK_COLLECTED', JSON.stringify({
              ok: collected?.ok === true,
              status: collected?.status,
              requirementsMet: collected?.requirementsMet === true,
              discoveryMode: collected?.discoveryMode,
              counts: collected?.counts || null,
              skipped: (collected?.skipped || []).slice(0, 12),
              assets: (collected?.mediaAssets || []).map(item => ({
                kind: item.kind,
                mimeType: item.mimeType,
                bytes: item.bytes,
                sha256: item.sha256,
                sourceTag: item.sourceTag,
                networkObserved: item.networkObserved,
                output: item.output
              }))
            }, null, 2));
            if (collected?.ok !== true || collected?.requirementsMet !== true || (collected?.mediaAssets || []).length < 1) {
              process.exitCode = 3;
            }
          }
          NODE

name: v135 exact TikTok primary media diagnostic

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v135-uber-browser-network-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          git diff --quiet HEAD^ HEAD -- functions/
      - name: Install root dependencies
        run: npm ci
      - name: Prove exact post provenance and primary MP4 capture
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { captureBrowserNetworkMedia } from './jarvis-fs-bridge.js';
          import { collectNexoRealWebMedia } from './nexo-web-media-bridge.js';

          const post = 'https://www.tiktok.com/@taqueria.eldorado/video/7629216747131850004';
          const oembedUrl = `https://www.tiktok.com/oembed?url=${encodeURIComponent(post)}`;
          const oembedResponse = await fetch(oembedUrl, { redirect: 'follow' });
          const oembed = await oembedResponse.json();
          if (!oembedResponse.ok) throw new Error(`TIKTOK_OEMBED_HTTP_${oembedResponse.status}`);
          if (String(oembed?.author_url || '') !== 'https://www.tiktok.com/@taqueria.eldorado') {
            throw new Error(`TIKTOK_AUTHOR_MISMATCH:${oembed?.author_url || ''}`);
          }
          console.log('V135_EXACT_POST_PROVENANCE', JSON.stringify({
            authorName: oembed.author_name,
            authorUrl: oembed.author_url,
            title: String(oembed.title || '').slice(0, 220),
            thumbnailWidth: oembed.thumbnail_width,
            thumbnailHeight: oembed.thumbnail_height
          }, null, 2));

          const observed = await captureBrowserNetworkMedia({
            url: post,
            timeoutMs: 45000,
            root: process.cwd()
          });
          const videos = (observed?.media || [])
            .filter(item => item.kind === 'video')
            .sort((left, right) =>
              Math.max(Number(right.bodyBytes || 0), Number(right.declaredBytes || 0)) -
              Math.max(Number(left.bodyBytes || 0), Number(left.declaredBytes || 0))
            );
          console.log('V135_EXACT_POST_OBSERVED', JSON.stringify({
            ok: observed?.ok === true,
            status: observed?.status,
            candidateCount: observed?.candidateCount || 0,
            bodyCapturedCount: observed?.bodyCapturedCount || 0,
            bodyCapturedBytes: observed?.bodyCapturedBytes || 0,
            counts: observed?.counts || null,
            videos: videos.map(item => ({
              mimeType: item.mimeType,
              resourceType: item.resourceType,
              declaredBytes: item.declaredBytes,
              bodyCaptured: item.bodyCaptured === true,
              bodyBytes: item.bodyBytes || 0,
              bodyCaptureError: item.bodyCaptureError || null,
              host: (() => { try { return new URL(item.url).hostname; } catch { return ''; } })(),
              path: (() => { try { return new URL(item.url).pathname.slice(0, 180); } catch { return ''; } })()
            }))
          }, null, 2));
          if (observed?.ok !== true || videos.length < 1) throw new Error('TIKTOK_PRIMARY_VIDEO_NOT_OBSERVED');

          const primary = videos[0];
          const primarySize = Math.max(Number(primary.bodyBytes || 0), Number(primary.declaredBytes || 0));
          if (primarySize < 300000) throw new Error(`TIKTOK_PRIMARY_VIDEO_TOO_SMALL:${primarySize}`);
          if (primary.bodyCaptured !== true) throw new Error(`TIKTOK_PRIMARY_VIDEO_BODY_NOT_CAPTURED:${primary.bodyCaptureError || 'unknown'}`);

          const collected = await collectNexoRealWebMedia({
            url: post,
            discoveredMedia: observed.media,
            requireAnyVisual: true,
            maxImages: 6,
            maxVideos: 4,
            timeoutMs: 30000,
            root: process.cwd()
          });
          const assets = collected?.mediaAssets || [];
          console.log('V135_EXACT_POST_COLLECTED', JSON.stringify({
            ok: collected?.ok === true,
            status: collected?.status,
            requirementsMet: collected?.requirementsMet === true,
            discoveryMode: collected?.discoveryMode,
            counts: collected?.counts || null,
            assets: assets.map(item => ({
              kind: item.kind,
              mimeType: item.mimeType,
              bytes: item.bytes,
              sha256: item.sha256,
              sourceTag: item.sourceTag,
              networkObserved: item.networkObserved,
              bodyCaptured: item.bodyCaptured,
              sourceHost: (() => { try { return new URL(item.sourceUrl).hostname; } catch { return ''; } })(),
              sourcePath: (() => { try { return new URL(item.sourceUrl).pathname.slice(0, 180); } catch { return ''; } })(),
              output: item.output
            }))
          }, null, 2));

          if (collected?.ok !== true || collected?.requirementsMet !== true) throw new Error('TIKTOK_PRIMARY_COLLECT_FAILED');
          if (collected?.counts?.videos !== 1 || collected?.counts?.images !== 0 || assets.length !== 1) {
            throw new Error(`TIKTOK_PRIMARY_SELECTION_INVALID:${JSON.stringify(collected?.counts || {})}`);
          }
          const asset = assets[0];
          if (asset.kind !== 'video' || asset.mimeType !== 'video/mp4') throw new Error('TIKTOK_PRIMARY_ASSET_NOT_MP4');
          if (asset.bodyCaptured !== true) throw new Error('TIKTOK_PRIMARY_ASSET_NOT_SESSION_CAPTURED');
          if (asset.sourceUrl !== primary.url) throw new Error('TIKTOK_PRIMARY_SOURCE_MISMATCH');
          if (String(asset.sourceUrl).includes('/playback1.mp4')) throw new Error('TIKTOK_GENERIC_PLAYBACK_SELECTED');
          if (asset.bytes < 300000) throw new Error(`TIKTOK_PRIMARY_ASSET_TOO_SMALL:${asset.bytes}`);
          if (!/^[a-f0-9]{64}$/.test(String(asset.sha256 || ''))) throw new Error('TIKTOK_PRIMARY_SHA_INVALID');
          const absolute = path.resolve(process.cwd(), asset.output);
          if (!fs.existsSync(absolute) || fs.statSync(absolute).size !== asset.bytes) throw new Error('TIKTOK_PRIMARY_ARTIFACT_NOT_PHYSICAL');
          console.log('V135_EXACT_TIKTOK_PRIMARY_MEDIA_VERIFIED');
          NODE

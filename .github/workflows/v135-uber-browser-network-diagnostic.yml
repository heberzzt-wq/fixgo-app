name: v135 dynamic browser media diagnostic

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v135-uber-browser-network-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          git diff --quiet HEAD^ HEAD -- functions/
      - name: Install root dependencies
        run: npm ci
      - name: Compare browser-network sources
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { captureBrowserNetworkMedia } from './jarvis-fs-bridge.js';
          import { collectNexoRealWebMedia } from './nexo-web-media-bridge.js';

          const sources = [
            ['CONTROL_SITE', 'https://taqueriaeldorado.com/'],
            ['UBER_EATS', 'https://www.ubereats.com/mx/store/takos-el-dorado-cancun/DmKfCVrVW9W46Zx3LBI8jw'],
            ['TIKTOK_POST', 'https://www.tiktok.com/@taqueria.eldorado/video/7629216747131850004'],
            ['TIKTOK_PLAYER', 'https://www.tiktok.com/player/v1/7629216747131850004']
          ];
          let controlSucceeded = false;
          for (const [label, url] of sources) {
            const observed = await captureBrowserNetworkMedia({ url, timeoutMs: 45000, root: process.cwd() });
            console.log(`V135_${label}_OBSERVED`, JSON.stringify({
              ok: observed?.ok === true,
              status: observed?.status,
              candidateCount: observed?.candidateCount || 0,
              counts: observed?.counts || null,
              engine: observed?.engine || null,
              sample: (observed?.media || []).slice(0, 10).map(item => ({
                kind: item.kind,
                mimeType: item.mimeType,
                resourceType: item.resourceType,
                declaredBytes: item.declaredBytes,
                host: (() => { try { return new URL(item.url).hostname; } catch { return ''; } })(),
                path: (() => { try { return new URL(item.url).pathname.slice(0, 140); } catch { return ''; } })()
              }))
            }, null, 2));
            if (observed?.ok !== true || Number(observed?.candidateCount || 0) < 1) continue;
            const collected = await collectNexoRealWebMedia({
              url,
              discoveredMedia: observed.media,
              requireImages: true,
              requireAnyVisual: true,
              maxImages: 6,
              maxVideos: 3,
              timeoutMs: 30000,
              root: process.cwd()
            });
            console.log(`V135_${label}_COLLECTED`, JSON.stringify({
              ok: collected?.ok === true,
              status: collected?.status,
              requirementsMet: collected?.requirementsMet === true,
              discoveryMode: collected?.discoveryMode,
              counts: collected?.counts || null,
              skipped: (collected?.skipped || []).slice(0, 8).map(item => ({
                kind: item.kind,
                sourceTag: item.sourceTag,
                reason: item.reason,
                host: (() => { try { return new URL(item.url).hostname; } catch { return ''; } })()
              })),
              assets: (collected?.mediaAssets || []).map(item => ({
                kind: item.kind,
                mimeType: item.mimeType,
                bytes: item.bytes,
                sha256: item.sha256,
                sourceTag: item.sourceTag,
                networkObserved: item.networkObserved,
                output: item.output
              }))
            }, null, 2));
            if (label === 'CONTROL_SITE' && collected?.requirementsMet === true && (collected?.mediaAssets || []).length > 0) {
              controlSucceeded = true;
            }
          }

          const post = 'https://www.tiktok.com/@taqueria.eldorado/video/7629216747131850004';
          const oembedUrl = `https://www.tiktok.com/oembed?url=${encodeURIComponent(post)}`;
          const oembedResponse = await fetch(oembedUrl, { redirect: 'follow' });
          const oembedText = await oembedResponse.text();
          let oembed = null;
          try { oembed = JSON.parse(oembedText); } catch {}
          console.log('V135_TIKTOK_OEMBED', JSON.stringify({
            status: oembedResponse.status,
            ok: oembedResponse.ok,
            authorName: oembed?.author_name || null,
            authorUrl: oembed?.author_url || null,
            title: String(oembed?.title || '').slice(0, 240),
            thumbnailUrl: oembed?.thumbnail_url || null,
            thumbnailWidth: oembed?.thumbnail_width || null,
            thumbnailHeight: oembed?.thumbnail_height || null
          }, null, 2));
          if (!controlSucceeded) process.exitCode = 4;
          NODE

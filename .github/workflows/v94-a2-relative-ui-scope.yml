name: V94 A2 relative UI scope grounding

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-a2-relative-ui-scope.yml

permissions:
  contents: write

jobs:
  certify-deploy-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Verify clean base ancestry
        run: git merge-base --is-ancestor 1ec3e88adb7c9dd437a06c60b1dd6e7a1925217c HEAD

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Patch relative UI scope claims and regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing anchor: {label}")
              return text.replace(old, new, 1)

          pack_path = Path("gestia-core/jarvis/jarvis.multitool.pack.js")
          pack = pack_path.read_text(encoding="utf-8")

          pack = replace_once(
              pack,
              'const MEDIA_UNSUPPORTED_CONTRADICTION_META_PATTERN = /\\b(?:contradict(?:s|ed|ing)?|contradiction|inconsisten(?:cy|t))\\b/i;',
              'const MEDIA_UNSUPPORTED_RELATIVE_UI_SCOPE_PATTERN = /\\b(?:fewer\\s+(?:menu\\s+)?(?:options?|items?|entries?|actions?)|more\\s+(?:menu\\s+)?(?:options?|items?|entries?|actions?)|more\\s+limited\\s+(?:menu|options?|interface)|less\\s+complete\\s+(?:menu|options?|interface)|(?:broader|narrower)\\s+(?:menu|set\\s+of\\s+options)|(?:menos|mas|más)\\s+(?:opciones|elementos|acciones)|(?:menu|menú)\\s+(?:mas|más)\\s+(?:limitado|limitada|amplio|amplia|reducido|reducida))\\b/i;\nconst MEDIA_UNSUPPORTED_CONTRADICTION_META_PATTERN = /\\b(?:contradict(?:s|ed|ing)?|contradiction|inconsisten(?:cy|t))\\b/i;',
              "pack relative UI constant"
          )

          pack = replace_once(
              pack,
              '''    if (typeof value === "string") {\n        if (!MEDIA_UNSUPPORTED_NEGATIVE_VISUAL_CLAIM_PATTERN.test(value)) {\n            return false;\n        }\n''',
              '''    if (typeof value === "string") {\n        if (MEDIA_UNSUPPORTED_RELATIVE_UI_SCOPE_PATTERN.test(value)) {\n            return true;\n        }\n        if (!MEDIA_UNSUPPORTED_NEGATIVE_VISUAL_CLAIM_PATTERN.test(value)) {\n            return false;\n        }\n''',
              "pack negative claim helper"
          )

          pack = replace_once(
              pack,
              '        "Formula las diferencias como afirmaciones positivas verificadas por fuente; sin evidencia negativa estructurada, la ausencia debe permanecer desconocida.",\n',
              '        "Formula las diferencias como afirmaciones positivas verificadas por fuente; sin evidencia negativa estructurada, la ausencia debe permanecer desconocida.",\n        "No afirmes que un menu tiene mas o menos opciones, es mas limitado o amplio, o cubre mas o menos funciones salvo que exista evidencia estructurada y exhaustiva de cardinalidad para ambas fuentes; si no existe, describe solo lo positivamente verificado en cada fuente.",\n',
              "audit relative UI scope instruction"
          )
          pack_path.write_text(pack, encoding="utf-8")

          composer_path = Path("gestia-core/jarvis/jarvis.conversation.composer.js")
          composer = composer_path.read_text(encoding="utf-8")
          composer = replace_once(
              composer,
              'const RENDER_UNSUPPORTED_CONTRADICTION_META_PATTERN = /\\b(?:contradict(?:s|ed|ing)?|contradiction|inconsisten(?:cy|t))\\b/i;',
              'const RENDER_UNSUPPORTED_RELATIVE_UI_SCOPE_PATTERN = /\\b(?:fewer\\s+(?:menu\\s+)?(?:options?|items?|entries?|actions?)|more\\s+(?:menu\\s+)?(?:options?|items?|entries?|actions?)|more\\s+limited\\s+(?:menu|options?|interface)|less\\s+complete\\s+(?:menu|options?|interface)|(?:broader|narrower)\\s+(?:menu|set\\s+of\\s+options)|(?:menos|mas|más)\\s+(?:opciones|elementos|acciones)|(?:menu|menú)\\s+(?:mas|más)\\s+(?:limitado|limitada|amplio|amplia|reducido|reducida))\\b/i;\nconst RENDER_UNSUPPORTED_CONTRADICTION_META_PATTERN = /\\b(?:contradict(?:s|ed|ing)?|contradiction|inconsisten(?:cy|t))\\b/i;',
              "renderer relative UI constant"
          )
          composer = replace_once(
              composer,
              '''    const narrative = String(value || "");\n    if (!RENDER_UNSUPPORTED_NEGATIVE_VISUAL_CLAIM_PATTERN.test(narrative)) {\n        return false;\n    }\n''',
              '''    const narrative = String(value || "");\n    if (RENDER_UNSUPPORTED_RELATIVE_UI_SCOPE_PATTERN.test(narrative)) {\n        return true;\n    }\n    if (!RENDER_UNSUPPORTED_NEGATIVE_VISUAL_CLAIM_PATTERN.test(narrative)) {\n        return false;\n    }\n''',
              "renderer negative claim helper"
          )
          composer_path.write_text(composer, encoding="utf-8")

          browser_path = Path("tests/v94-media-browser-precision-contract.test.mjs")
          browser = browser_path.read_text(encoding="utf-8").rstrip() + "\n\n"
          marker = 'strict visual reconciliation suppresses unsupported relative menu scope claims'
          if marker not in browser:
              browser += r'''test("strict visual reconciliation suppresses unsupported relative menu scope claims", () => {
              const initial = baseResult();
              const audited = baseResult();
              const source1Data = [
                  { kind: "text", value: "ChatGPT Plus", page: 1, confidence: 1, evidence: "title", legibility: "VERIFIED" },
                  { kind: "text", value: "Añadir fotos y archivos", page: 1, confidence: 1, evidence: "menu", legibility: "VERIFIED" },
                  { kind: "text", value: "Búsqueda en Internet", page: 1, confidence: 1, evidence: "menu", legibility: "VERIFIED" }
              ];
              const source2Data = [
                  { kind: "text", value: "Terminal Heberto", page: 1, confidence: 1, evidence: "title", legibility: "VERIFIED" },
                  { kind: "text", value: "Añadir fotos y archivos", page: 1, confidence: 1, evidence: "menu", legibility: "VERIFIED" },
                  { kind: "text", value: "Crear una imagen", page: 1, confidence: 1, evidence: "menu", legibility: "VERIFIED" },
                  { kind: "text", value: "Búsqueda en Internet", page: 1, confidence: 1, evidence: "menu", legibility: "VERIFIED" }
              ];
              initial.sources[0].visibleData = source1Data;
              audited.sources[0].visibleData = source1Data;
              initial.sources[1].visibleData = source2Data;
              audited.sources[1].visibleData = source2Data;
              audited.sources[1].observations = [
                  "An open menu displays fewer options compared to SOURCE_1: 'Añadir fotos y archivos', 'Crear una imagen', and 'Búsqueda en Internet'."
              ];
              audited.comparison = {
                  beforeAfter: false,
                  differences: [
                      "SOURCE_2 (Terminal Heberto) has a more limited menu for content input, primarily 'Añadir fotos y archivos', 'Crear una imagen', and 'Búsqueda en Internet'."
                  ],
                  confidence: 0.95
              };

              const reconciled = reconcileIndependentMediaAnalysis(
                  initial,
                  audited,
                  files,
                  "Compara solamente lo visible."
              );

              assert.deepEqual(reconciled.result.sources[1].observations, []);
              assert.deepEqual(reconciled.result.comparison.differences, []);
              assert.equal(reconciled.suppressedUnsupportedNegativeVisualClaimCount, 2);
          });
          '''
          browser_path.write_text(browser, encoding="utf-8")

          composer_test_path = Path("tests/jarvis-conversation-composer.test.mjs")
          composer_tests = composer_test_path.read_text(encoding="utf-8").rstrip() + "\n\n"
          composer_marker = 'precision renderer suppresses unsupported relative menu scope claims'
          if composer_marker not in composer_tests:
              composer_tests += r'''test("precision renderer suppresses unsupported relative menu scope claims", async () => {
              const result = await composeEvidenceGroundedConversation({
                  instruction: "Compara solamente lo visible.",
                  evidenceItems: [{
                      name: "media.analyze",
                      observation: {
                          ok: true,
                          status: "MEDIA_ANALYSIS_GROUNDED",
                          version: "1.4.0-verified-visual-claims",
                          expectedSources: 2,
                          receivedSources: 2,
                          sources: [
                              {
                                  sourceId: "SOURCE_1",
                                  fileName: "one.png",
                                  sha256: "a".repeat(64),
                                  observations: ["The interface is branded as 'ChatGPT Plus'."],
                                  visibleData: [
                                      { kind: "text", value: "ChatGPT Plus", page: 1, confidence: 1, evidence: "title", legibility: "VERIFIED" }
                                  ],
                                  uncertainty: []
                              },
                              {
                                  sourceId: "SOURCE_2",
                                  fileName: "two.png",
                                  sha256: "b".repeat(64),
                                  observations: [
                                      "An open menu displays fewer options compared to SOURCE_1: 'Añadir fotos y archivos', 'Crear una imagen', and 'Búsqueda en Internet'."
                                  ],
                                  visibleData: [
                                      { kind: "text", value: "Terminal Heberto", page: 1, confidence: 1, evidence: "title", legibility: "VERIFIED" },
                                      { kind: "text", value: "Añadir fotos y archivos", page: 1, confidence: 1, evidence: "menu", legibility: "VERIFIED" },
                                      { kind: "text", value: "Crear una imagen", page: 1, confidence: 1, evidence: "menu", legibility: "VERIFIED" },
                                      { kind: "text", value: "Búsqueda en Internet", page: 1, confidence: 1, evidence: "menu", legibility: "VERIFIED" }
                                  ],
                                  uncertainty: []
                              }
                          ],
                          comparison: {
                              differences: [
                                  "SOURCE_2 (Terminal Heberto) has a more limited menu for content input."
                              ]
                          },
                          recommendations: [],
                          policy: {
                              negativeVisualClaimsRequireStructuredEvidence: true
                          },
                          precisionAudit: {
                              ok: true,
                              status: "MEDIA_ANALYSIS_PRECISION_VERIFIED",
                              providerPasses: 2,
                              effectiveToolExecutions: 1,
                              sourceIdentityVerified: true,
                              exactTextRequiresConfidence: 0.98
                          }
                      }
                  }],
                  executeConversation: async () => {
                      throw new Error("semantic composer must not run");
                  }
              });

              assert.equal(result.ok, true);
              assert.doesNotMatch(result.text, /fewer options|more limited menu/i);
              assert.match(result.text, /ChatGPT Plus/);
              assert.match(result.text, /Terminal Heberto/);
          });
          '''
          composer_test_path.write_text(composer_tests, encoding="utf-8")

          mf_path = Path("tests/jarvis-multifunction-tools.test.mjs")
          mf = mf_path.read_text(encoding="utf-8")
          mf = replace_once(
              mf,
              '        assert.match(precisionAuditQuestion, /recommendations=\\[\\]/);\n',
              '        assert.match(precisionAuditQuestion, /recommendations=\\[\\]/);\n        assert.match(precisionAuditQuestion, /evidencia estructurada y exhaustiva de cardinalidad/i);\n',
              "audit prompt regression"
          )
          mf_path.write_text(mf, encoding="utf-8")
          PY

      - name: Verify focused syntax and regressions
        run: |
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.conversation.composer.js
          node --test tests/v94-media-browser-precision-contract.test.mjs tests/jarvis-conversation-composer.test.mjs tests/jarvis-multifunction-tools.test.mjs
          git diff --check

      - name: Run complete CI contract
        run: npm run ci:test

      - name: Commit certified patch and remove temporary workflow
        run: |
          git config user.name "OpenAI V94 Handoff"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v94-a2-relative-ui-scope.yml
          git add gestia-core/jarvis/jarvis.multitool.pack.js gestia-core/jarvis/jarvis.conversation.composer.js tests/v94-media-browser-precision-contract.test.mjs tests/jarvis-conversation-composer.test.mjs tests/jarvis-multifunction-tools.test.mjs
          git commit -m "[v94-media-v4n] fix(jarvis): ground relative UI scope comparisons"
          git push origin HEAD:v94-media-v4n-negative-claims

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.10.1

      - name: Deploy primary Hosting only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          test -n "$FIREBASE_TOKEN"
          firebase deploy --only hosting:fixgo-44e4d --project fixgo-44e4d --token "$FIREBASE_TOKEN" --non-interactive

      - name: Verify production bytes exactly
        run: |
          ok=0
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location "https://fixgo-44e4d.web.app/gestia-core/jarvis/jarvis.multitool.pack.js?v=relative-ui-$attempt" -o /tmp/live-multitool.js
            curl --fail --silent --show-error --location "https://fixgo-44e4d.web.app/gestia-core/jarvis/jarvis.conversation.composer.js?v=relative-ui-$attempt" -o /tmp/live-composer.js
            if cmp -s gestia-core/jarvis/jarvis.multitool.pack.js /tmp/live-multitool.js && cmp -s gestia-core/jarvis/jarvis.conversation.composer.js /tmp/live-composer.js; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          sha256sum gestia-core/jarvis/jarvis.multitool.pack.js /tmp/live-multitool.js
          sha256sum gestia-core/jarvis/jarvis.conversation.composer.js /tmp/live-composer.js
          grep -q "MEDIA_UNSUPPORTED_RELATIVE_UI_SCOPE_PATTERN" /tmp/live-multitool.js
          grep -q "RENDER_UNSUPPORTED_RELATIVE_UI_SCOPE_PATTERN" /tmp/live-composer.js

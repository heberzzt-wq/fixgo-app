name: V94 media precision hotfix

on:
  push:
    branches:
      - v94-handoff-ee6d8cfe
    paths:
      - .github/workflows/v94-media-precision-hotfix.yml

permissions:
  contents: write

jobs:
  repair-test-deploy:
    if: github.event.head_commit.message == 'ci(v94): run media precision hotfix'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated V94 handoff
        uses: actions/checkout@v4
        with:
          ref: v94-handoff-ee6d8cfe
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Apply precision and deterministic-composer repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          media_path = Path('functions/jarvis-media-analysis.js')
          media = media_path.read_text(encoding='utf-8')

          needle = 'const MAX_REPAIR_ATTEMPTS = 1;\n'
          addition = '''const MAX_REPAIR_ATTEMPTS = 1;\nconst SENSITIVE_NARRATIVE_LITERAL_PATTERN = /(?:https?:\\/\\/[^\\s"'<>]+|www\\.[^\\s"'<>]+|\\b\\d{1,2}[\\/.-]\\d{1,2}[\\/.-]\\d{2,4}\\b|\\b(?:19|20)\\d{2}\\b|\\b\\d{1,2}:\\d{2}(?::\\d{2})?\\b)/i;\n'''
          if 'SENSITIVE_NARRATIVE_LITERAL_PATTERN' not in media:
              assert needle in media, 'media constants anchor not found'
              media = media.replace(needle, addition, 1)

          helper_anchor = 'function validateAnalysis(parsed, files) {\n'
          helpers = r'''function containsSensitiveNarrativeLiteral(value) {
    if (value == null) return false;
    if (typeof value === "string") {
        return SENSITIVE_NARRATIVE_LITERAL_PATTERN.test(value);
    }
    if (Array.isArray(value)) {
        return value.some(containsSensitiveNarrativeLiteral);
    }
    if (typeof value !== "object") return false;
    return Object.values(value).some(containsSensitiveNarrativeLiteral);
}

function assertNoSensitiveNarrativeLiteralLeaks(parsed, files, sources) {
    const candidates = [];

    for (const source of sources) {
        candidates.push(
            source?.description,
            source?.observations,
            source?.inferences,
            source?.objects,
            source?.composition,
            source?.pages,
            source?.marketingUse,
            source?.quality,
            source?.uncertainty,
            source?.evidence
        );
    }

    candidates.push(
        parsed?.comparison,
        parsed?.recommendations
    );

    if (candidates.some(containsSensitiveNarrativeLiteral)) {
        throw createAnalysisError(
            "MEDIA_ANALYSIS_PRECISION_LITERAL_LEAK",
            files,
            sources
        );
    }
}

'''
          if 'function assertNoSensitiveNarrativeLiteralLeaks' not in media:
              assert helper_anchor in media, 'media validation anchor not found'
              media = media.replace(helper_anchor, helpers + helper_anchor, 1)

          identity_anchor = '''    const orderedSources =\n        resolveSourcesByIdentity(sources, files);\n\n    return {\n'''
          identity_replacement = '''    const orderedSources =\n        resolveSourcesByIdentity(sources, files);\n\n    assertNoSensitiveNarrativeLiteralLeaks(\n        parsed,\n        files,\n        orderedSources\n    );\n\n    return {\n'''
          if 'assertNoSensitiveNarrativeLiteralLeaks(\n        parsed,' not in media:
              assert identity_anchor in media, 'media identity validation anchor not found'
              media = media.replace(identity_anchor, identity_replacement, 1)

          repair_anchor = '''        "MEDIA_ANALYSIS_SOURCE_IDENTITY_DUPLICATE"\n    ]).has(error?.message);\n'''
          repair_replacement = '''        "MEDIA_ANALYSIS_SOURCE_IDENTITY_DUPLICATE",\n        "MEDIA_ANALYSIS_PRECISION_LITERAL_LEAK"\n    ]).has(error?.message);\n'''
          if '"MEDIA_ANALYSIS_PRECISION_LITERAL_LEAK"\n    ]).has' not in media:
              assert repair_anchor in media, 'repairable error anchor not found'
              media = media.replace(repair_anchor, repair_replacement, 1)

          prompt_anchor = '        "Fuera de visibleData, ninguna propiedad de la respuesta debe contener transcripciones literales, URLs, fechas, horas, anos, cifras ni identificadores.",\n'
          prompt_extra = prompt_anchor + '''        "No uses la instruccion del usuario como evidencia visual; una palabra mencionada en la solicitud no demuestra que ese elemento aparezca en los pixeles.",\n        "Si la solicitud compara un menu, panel, boton o control que no esta abierto o visible en una fuente, declara que esa parte de la comparacion no es verificable y no infieras sus opciones ni funciones.",\n        "Description, observations, inferences, objects, pages, evidence, comparison y recommendations no deben repetir fechas, horas, anos, URLs o identificadores; esas lecturas solo pueden existir en visibleData.",\n'''
          if 'No uses la instruccion del usuario como evidencia visual' not in media:
              assert prompt_anchor in media, 'media prompt anchor not found'
              media = media.replace(prompt_anchor, prompt_extra, 1)

          media_path.write_text(media, encoding='utf-8')

          composer_path = Path('gestia-core/jarvis/jarvis.conversation.composer.js')
          composer = composer_path.read_text(encoding='utf-8')
          old = '''    if (operational.length !== 1) return null;\n\n    const item = operational[0];\n    if (String(item?.name || item?.tool || "") !== "media.analyze") {\n        return null;\n    }\n'''
          new = '''    const mediaItems = operational.filter(item =>\n        String(item?.name || item?.tool || "") === "media.analyze"\n    );\n    const allowedCompanionTools = new Set([\n        "system.certify"\n    ]);\n    const unsupportedCompanions = operational.filter(item => {\n        const toolName = String(item?.name || item?.tool || "");\n        return toolName !== "media.analyze" &&\n            !allowedCompanionTools.has(toolName);\n    });\n\n    if (\n        mediaItems.length !== 1 ||\n        unsupportedCompanions.length > 0\n    ) {\n        return null;\n    }\n\n    const item = mediaItems[0];\n'''
          if 'const allowedCompanionTools = new Set([' not in composer:
              assert old in composer, 'composer media singleton anchor not found'
              composer = composer.replace(old, new, 1)
          composer_path.write_text(composer, encoding='utf-8')

          media_test_path = Path('tests/jarvis-media-analysis.test.cjs')
          media_test = media_test_path.read_text(encoding='utf-8')
          marker = 'test("production incident repairs a sensitive literal leaked outside visibleData"'
          if marker not in media_test:
              media_test += r'''

test("production incident repairs a sensitive literal leaked outside visibleData", async () => {
    let calls = 0;
    const result = await runJarvisMediaAnalysis({
        ai: {
            models: {
                generateContent: async request => {
                    calls += 1;
                    if (calls === 1) {
                        return {
                            text: JSON.stringify({
                                sources: [{
                                    sourceId: "SOURCE_1",
                                    fileName: "terminal.png",
                                    mimeType: "image/png",
                                    description: "Interfaz de terminal.",
                                    observations: ["La fecha mostrada es 07/08/2023."],
                                    inferences: [],
                                    objects: ["Una interfaz web."],
                                    composition: {},
                                    visibleData: [],
                                    pages: [],
                                    marketingUse: [],
                                    quality: {},
                                    uncertainty: [],
                                    evidence: []
                                }]
                            })
                        };
                    }
                    assert.match(
                        request.contents[0].parts[0],
                        /MEDIA_ANALYSIS_PRECISION_LITERAL_LEAK/
                    );
                    return {
                        text: JSON.stringify({
                            sources: [{
                                sourceId: "SOURCE_1",
                                fileName: "terminal.png",
                                mimeType: "image/png",
                                description: "Interfaz de terminal.",
                                observations: ["Se observa una barra inferior, sin transcribir datos sensibles fuera de visibleData."],
                                inferences: [],
                                objects: ["Una interfaz web."],
                                composition: {},
                                visibleData: [],
                                pages: [],
                                marketingUse: [],
                                quality: {},
                                uncertainty: ["La fecha visible no se transcribe porque no fue solicitada como lectura literal."],
                                evidence: []
                            }]
                        })
                    };
                }
            }
        },
        input: {
            files: [{
                name: "terminal.png",
                mimeType: "image/png",
                dataBase64: tinyPng
            }],
            question: "Describe solamente lo verificable."
        }
    });

    assert.equal(calls, 2);
    assert.equal(result.repairCount, 1);
    assert.equal(result.status, "MEDIA_ANALYSIS_GROUNDED");
    assert.doesNotMatch(JSON.stringify(result), /07\/08\/2023|2023/);
});
'''
          media_test_path.write_text(media_test, encoding='utf-8')

          composer_test_path = Path('tests/jarvis-conversation-composer.test.mjs')
          composer_test = composer_test_path.read_text(encoding='utf-8')
          marker = 'test("system certification companion cannot force semantic rewriting of verified media"'
          if marker not in composer_test:
              composer_test += r'''

test("system certification companion cannot force semantic rewriting of verified media", async () => {
    let semanticCalls = 0;
    const result = await composeEvidenceGroundedConversation({
        instruction: "Compara estas dos capturas sin inventar texto.",
        evidenceItems: [
            {
                name: "media.analyze",
                observation: {
                    ok: true,
                    status: "MEDIA_ANALYSIS_GROUNDED",
                    version: "1.4.0-verified-visual-claims",
                    expectedSources: 2,
                    receivedSources: 2,
                    sources: [
                        {
                            sourceId: "SOURCE_1",
                            fileName: "chatgpt.png",
                            sha256: "1".repeat(64),
                            objects: ["Una interfaz web."],
                            visibleData: [],
                            uncertainty: ["El menu de adjuntos no esta abierto en esta captura."]
                        },
                        {
                            sourceId: "SOURCE_2",
                            fileName: "terminal.png",
                            sha256: "2".repeat(64),
                            objects: ["Una terminal web."],
                            visibleData: [{
                                kind: "text",
                                value: "NEXO listo",
                                page: 1,
                                confidence: 0.99,
                                evidence: "Tarjeta central visible.",
                                legibility: "VERIFIED"
                            }],
                            uncertainty: []
                        }
                    ],
                    comparison: {
                        differences: [
                            "No se puede verificar el menu de adjuntos de ChatGPT porque no esta abierto en SOURCE_1."
                        ]
                    },
                    recommendations: [],
                    precisionAudit: {
                        ok: true,
                        status: "MEDIA_ANALYSIS_PRECISION_VERIFIED",
                        providerPasses: 2,
                        effectiveToolExecutions: 1,
                        sourceIdentityVerified: true,
                        exactTextRequiresConfidence: 0.98
                    }
                }
            },
            {
                name: "system.certify",
                observation: {
                    ok: true,
                    status: "CERTIFICATION_INCOMPLETE",
                    certified: false
                }
            }
        ],
        executeConversation: async () => {
            semanticCalls += 1;
            return {
                ok: true,
                data: {
                    message: "La fecha mostrada es 07/08/2023."
                }
            };
        }
    });

    assert.equal(result.ok, true);
    assert.equal(result.status, "MEDIA_ANALYSIS_RESPONSE_VERIFIED");
    assert.equal(result.provider, "deterministic-grounded-media");
    assert.equal(semanticCalls, 0);
    assert.match(result.text, /NEXO listo/);
    assert.doesNotMatch(result.text, /07\/08\/2023|2023/);
});
'''
          composer_test_path.write_text(composer_test, encoding='utf-8')
          PY

      - name: Diff integrity
        run: |
          git diff --check
          git status --short

      - name: Focused syntax and tests
        run: |
          node --check functions/jarvis-media-analysis.js
          node --check gestia-core/jarvis/jarvis.conversation.composer.js
          node --test tests/jarvis-media-analysis.test.cjs tests/jarvis-conversation-composer.test.mjs
          npm run check:nexo:contracts

      - name: Full CI
        run: npm run ci:test

      - name: Commit certified repair on handoff branch
        run: |
          git config user.name "OpenAI V94 Handoff"
          git config user.email "actions@users.noreply.github.com"
          git add functions/jarvis-media-analysis.js gestia-core/jarvis/jarvis.conversation.composer.js tests/jarvis-media-analysis.test.cjs tests/jarvis-conversation-composer.test.mjs
          git commit -m "[v94-media-precision-hotfix] fix(jarvis): fail closed on visual literal leaks"
          git push origin HEAD:v94-handoff-ee6d8cfe
          echo "PATCH_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.10.1

      - name: Narrow deploy function and primary Hosting only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          test -n "$FIREBASE_TOKEN"
          firebase deploy --only functions:jarvisMediaAnalyze,hosting:fixgo-44e4d --project fixgo-44e4d --token "$FIREBASE_TOKEN" --non-interactive

      - name: Verify production composer bytes
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            "https://fixgo-44e4d.web.app/gestia-core/jarvis/jarvis.conversation.composer.js?v=${PATCH_HEAD}" \
            -o /tmp/composer.js
          grep -q "allowedCompanionTools" /tmp/composer.js
          grep -q "system.certify" /tmp/composer.js
          echo "V94_MEDIA_PRECISION_HOTFIX_DEPLOYED=${PATCH_HEAD}"

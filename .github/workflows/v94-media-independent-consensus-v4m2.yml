name: V94 media independent consensus v4m2

on:
  push:
    branches:
      - v94-handoff-ee6d8cfe
    paths:
      - .github/workflows/v94-media-independent-consensus-v4m2.yml

permissions:
  contents: write

jobs:
  repair-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated V94 handoff
        uses: actions/checkout@v4
        with:
          ref: v94-handoff-ee6d8cfe
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Apply independent media consensus repair v4m2
        run: python3 .github/scripts/v94-media-independent-consensus-v4m2.py

      - name: Diff integrity
        run: |
          git diff --check
          git status --short

      - name: Focused media consensus regressions
        run: |
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --test tests/v94-media-browser-precision-contract.test.mjs tests/v94-media-evidence-render.test.cjs tests/jarvis-multifunction-tools.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Commit certified consensus repair
        run: |
          git config user.name "OpenAI V94 Handoff"
          git config user.email "actions@users.noreply.github.com"
          git add gestia-core/jarvis/jarvis.multitool.pack.js gestia-terminal.html tests/v94-media-browser-precision-contract.test.mjs tests/v94-media-evidence-render.test.cjs
          git diff --cached --quiet && { echo "Expected media consensus repair produced no code diff"; exit 1; }
          git commit -m "[v94-media-v4m2] fix(jarvis): independently reconcile visual literals across passes"
          git push origin HEAD:v94-handoff-ee6d8cfe
          echo "PATCH_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.10.1

      - name: Deploy only primary Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          test -n "$FIREBASE_TOKEN"
          firebase deploy --only hosting:fixgo-44e4d --project fixgo-44e4d --token "$FIREBASE_TOKEN" --non-interactive

      - name: Verify deployed consensus markers
        run: |
          curl -fsSL "https://fixgo-44e4d.web.app/gestia-core/jarvis/jarvis.multitool.pack.js?v=${PATCH_HEAD}" > /tmp/pack.js
          curl -fsSL "https://fixgo-44e4d.web.app/gestia-terminal.html?v=${PATCH_HEAD}" > /tmp/terminal.html
          grep -q "independentPassLiteralConsensusRequired" /tmp/pack.js
          grep -q "suppressedPeripheralLiteralCount" /tmp/pack.js
          grep -q "carencias concretas de la experiencia de adjuntos" /tmp/pack.js
          grep -q "precisionAudit:" /tmp/terminal.html
          echo "V94_MEDIA_INDEPENDENT_CONSENSUS_V4M2_DEPLOYED=${PATCH_HEAD}"

name: V94 V125 Marketing production intent

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - scripts/v125-marketing-production-intent.py
      - .github/workflows/v94-v125-marketing-production-intent.yml

permissions:
  contents: write

concurrency:
  group: v94-v125-marketing-production-intent
  cancel-in-progress: false

env:
  BRANCH: v94-media-v4n-negative-claims
  PRODUCT_BASE_SHA: 9046a7c9ae3c46ec96800ec887fb8c97883a105e
  MAIN_SHA: f3fa8e1806b681e860875afd4ce8183d27864873
  POLISH_SHA: 2ae85e670505c5d425a5a0334e99c45168054bb8

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Guard isolated staging and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          git merge-base --is-ancestor "$PRODUCT_BASE_SHA" HEAD
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          test -z "$(git diff --name-only "$PRODUCT_BASE_SHA" HEAD -- functions/)"
          unexpected="$(git diff --name-only "$PRODUCT_BASE_SHA" HEAD | grep -Ev '^(scripts/v125-marketing-production-intent\.py|\.github/workflows/v94-v125-marketing-production-intent\.yml)$' || true)"
          test -z "$unexpected"
          echo "V125_STAGING_ISOLATED=true"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Functions dependencies for tests only
        run: npm --prefix functions ci --ignore-scripts

      - name: Apply v125 production-intent patch
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/v125-marketing-production-intent.py 2>&1 | tee v125-patch.log

      - name: Prove patch excludes Functions
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$PRODUCT_BASE_SHA" -- functions/)"
          git diff --check
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/tools.runtime.js
          node --check gestia-core/gestia-core.js
          echo "V125_FUNCTIONS_SOURCE_UNCHANGED=true"

      - name: Focused marketing production regression
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/jarvis-marketing-production-intent-v125.test.mjs \
            tests/jarvis-marketing-real-delivery.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-generalist-execution-contract-v122.test.mjs \
            2>&1 | tee v125-focal.log

      - name: Upload focal diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v125-marketing-production-focal
          path: v125-focal.log
          if-no-files-found: warn
          retention-days: 1

      - name: Full CI
        shell: bash
        run: |
          set -o pipefail
          npm run ci:test 2>&1 | tee v125-full-ci.log

      - name: Upload Full CI diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v125-marketing-production-full-ci
          path: v125-full-ci.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit certified product and remove staging machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/v125-marketing-production-intent.py
          rm -f .github/workflows/v94-v125-marketing-production-intent.yml
          rm -f v125-patch.log v125-focal.log v125-full-ci.log
          git config user.name "heberzzt-wq"
          git config user.email "heberzzt@gmail.com"
          git add -A
          test -z "$(git diff --cached --name-only | grep -E '^functions/' || true)"
          git diff --cached --check
          git commit -m "[v94] fix(adj): preserve semantic marketing production intent v125"
          PRODUCT_SHA="$(git rev-parse HEAD)"
          echo "PRODUCT_SHA=$PRODUCT_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:"$BRANCH"
          echo "V125_PRODUCT_COMMITTED=$PRODUCT_SHA"

      - name: Final protected refs and Functions proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          test "$(git ls-remote origin refs/heads/$BRANCH | awk '{print $1}')" = "$PRODUCT_SHA"
          test -z "$(git diff --name-only "$PRODUCT_BASE_SHA" "$PRODUCT_SHA" -- functions/)"
          echo "V125_CERTIFIED=$PRODUCT_SHA"
          echo "V125_FUNCTIONS_UNCHANGED=true"

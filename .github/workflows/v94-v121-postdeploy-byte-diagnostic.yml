name: V94 v121 postdeploy byte diagnostic

on:
  push:
    branches: [v94-media-v4n-negative-claims]
    paths: [.github/workflows/v94-v121-postdeploy-byte-diagnostic.yml]

permissions:
  contents: read

env:
  BASELINE: fc021b3112542dbcdb9d236a17e0b71ee547463b
  PRODUCT_SHA: db00b4fb090b311e102409c91eb6e4a078f5435b
  EXPECTED_MAIN: f3fa8e1806b681e860875afd4ce8183d27864873
  EXPECTED_POLISH: 2ae85e670505c5d425a5a0334e99c45168054bb8

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Guard branch product Functions and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          git cat-file -e "$PRODUCT_SHA^{commit}"
          git diff --quiet "$PRODUCT_SHA" HEAD -- \
            gestia-terminal.html \
            gestia-terminal.js \
            gestia-core/gestia-core.js \
            gestia-core/gestia.runtime.v7.js \
            gestia-core/tools.runtime.js \
            gestia-core/jarvis/jarvis.multifunction.planner.js \
            gestia-core/jarvis/jarvis.multitool.pack.js \
            gestia-core/jarvis/jarvis.page.creator.js \
            gestia-core/jarvis/jarvis.identity.integrity.js \
            gestia-core/jarvis/jarvis.page.factual.integrity.js \
            gestia-core/jarvis/jarvis.actuator.pack.js \
            jarvis-page-artifact.js
          git diff --quiet "$BASELINE" HEAD -- functions
          git fetch origin main v5.9-polish --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/v5.9-polish)" = "$EXPECTED_POLISH"

      - name: Capture every live byte comparison
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/live-verify.txt"
          : > "$report"
          critical=(
            gestia-terminal.html
            gestia-terminal.js
            gestia-core/gestia-core.js
            gestia-core/gestia.runtime.v7.js
            gestia-core/tools.runtime.js
            gestia-core/jarvis/jarvis.multifunction.planner.js
            gestia-core/jarvis/jarvis.multitool.pack.js
            gestia-core/jarvis/jarvis.page.creator.js
            gestia-core/jarvis/jarvis.identity.integrity.js
            gestia-core/jarvis/jarvis.page.factual.integrity.js
            gestia-core/jarvis/jarvis.actuator.pack.js
            jarvis-page-artifact.js
          )
          bases=(
            https://fixgo-44e4d.web.app
            https://fixgo-44e4d.firebaseapp.com
          )
          mismatches=0
          printf 'PRODUCT_SHA=%s\n' "$PRODUCT_SHA" | tee -a "$report"
          printf 'CHECKED_AT=%s\n' "$(date -u +%FT%TZ)" | tee -a "$report"
          printf 'FIREBASE_PUBLIC=.\n\n' | tee -a "$report"

          for p in "${critical[@]}"; do
            git show "$PRODUCT_SHA:$p" > "$RUNNER_TEMP/expected.bin"
            expected_sha="$(sha256sum "$RUNNER_TEMP/expected.bin" | awk '{print $1}')"
            expected_bytes="$(wc -c < "$RUNNER_TEMP/expected.bin" | tr -d ' ')"
            printf 'FILE=%s EXPECTED_SHA=%s EXPECTED_BYTES=%s\n' "$p" "$expected_sha" "$expected_bytes" | tee -a "$report"

            for base in "${bases[@]}"; do
              rm -f "$RUNNER_TEMP/live.bin" "$RUNNER_TEMP/headers.txt"
              url="$base/$p?product=$PRODUCT_SHA&probe=$(date +%s%N)"
              http="$(curl -sS -L --retry 3 --retry-delay 1 -D "$RUNNER_TEMP/headers.txt" -o "$RUNNER_TEMP/live.bin" -w '%{http_code}' "$url" || printf 'CURL_ERROR')"
              if test -f "$RUNNER_TEMP/live.bin"; then
                live_sha="$(sha256sum "$RUNNER_TEMP/live.bin" | awk '{print $1}')"
                live_bytes="$(wc -c < "$RUNNER_TEMP/live.bin" | tr -d ' ')"
              else
                live_sha="NO_BODY"
                live_bytes="0"
              fi
              content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); value=$0} END{print value}' "$RUNNER_TEMP/headers.txt" 2>/dev/null)"
              content_encoding="$(awk 'BEGIN{IGNORECASE=1} /^content-encoding:/ {sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); value=$0} END{print value}' "$RUNNER_TEMP/headers.txt" 2>/dev/null)"
              cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); value=$0} END{print value}' "$RUNNER_TEMP/headers.txt" 2>/dev/null)"
              match="NO"
              if test "$http" = "200" && test "$expected_sha" = "$live_sha"; then
                match="YES"
              else
                mismatches=$((mismatches + 1))
              fi
              printf '  BASE=%s HTTP=%s TYPE=%q ENCODING=%q CACHE=%q LIVE_SHA=%s LIVE_BYTES=%s MATCH=%s\n' \
                "$base" "$http" "$content_type" "$content_encoding" "$cache_control" "$live_sha" "$live_bytes" "$match" | tee -a "$report"
            done
            printf '\n' | tee -a "$report"
          done

          printf 'TOTAL_MISMATCHES=%s\n' "$mismatches" | tee -a "$report"
          cp "$report" live-verify.txt
          echo "Diagnostic intentionally does not fail on mismatches."

      - name: Upload byte diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v121-postdeploy-byte-diagnostic
          path: live-verify.txt
          if-no-files-found: error
          retention-days: 7

      - name: Recheck no product or Functions mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$PRODUCT_SHA" HEAD -- \
            gestia-terminal.html \
            gestia-terminal.js \
            gestia-core/gestia-core.js \
            gestia-core/gestia.runtime.v7.js \
            gestia-core/tools.runtime.js \
            gestia-core/jarvis/jarvis.multifunction.planner.js \
            gestia-core/jarvis/jarvis.multitool.pack.js \
            gestia-core/jarvis/jarvis.page.creator.js \
            gestia-core/jarvis/jarvis.identity.integrity.js \
            gestia-core/jarvis/jarvis.page.factual.integrity.js \
            gestia-core/jarvis/jarvis.actuator.pack.js \
            jarvis-page-artifact.js
          git diff --quiet "$BASELINE" HEAD -- functions

name: v131-reel-semantic-media-binding-cert-close

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v131-reel-semantic-media-binding-cert-close.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Guard isolated branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          if git diff --name-only 9dd4dff72434fed84bfe66e7e313681574a3b3b7..HEAD | grep -E '^functions/'; then
            echo "Functions changed during v131 certification closure" >&2
            exit 1
          fi

      - name: Fix the single stale health-version expectation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/jarvis-multifunction-tools.test.mjs')
          source = path.read_text(encoding='utf-8')
          old = '"1.54.0-marketing-actuator-bridge-v126"'
          new = '"1.55.0-reel-semantic-media-binding-v131"'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'V131_STALE_HEALTH_VERSION_MATCH_COUNT={count}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          print('V131_STALE_HEALTH_VERSION_FIXED=true')
          PY

      - name: Verify exact scope and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "tests/jarvis-multifunction-tools.test.mjs"
          ! git diff --name-only | grep -E '^functions/'

      - name: Commit and push test-only closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/jarvis-multifunction-tools.test.mjs
          git commit -m "[v131] test: align health version expectation"
          git push origin HEAD:v94-media-v4n-negative-claims

name: v131-reel-semantic-media-binding-cert-close

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v131-reel-semantic-media-binding-cert-close.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Guard isolated branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          if git diff --name-only 9dd4dff72434fed84bfe66e7e313681574a3b3b7..HEAD | grep -E '^functions/'; then
            echo "Functions changed during v131 certification closure" >&2
            exit 1
          fi

      - name: Apply exact certification-only patch
        run: python .github/scripts/v131-reel-semantic-media-binding-cert-close.py

      - name: Verify exact scope and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/v131-reel-semantic-media-binding-cert.yml' 'tests/jarvis-multifunction-tools.test.mjs' | sort)"
          test "${changed}" = "${expected}"
          ! git diff --name-only | grep -E '^functions/'

      - name: Commit and push certification closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/v131-reel-semantic-media-binding-cert.yml tests/jarvis-multifunction-tools.test.mjs
          git commit -m "[v131] test: align health version and certification scope"
          git push origin HEAD:v94-media-v4n-negative-claims

name: V94 single-brain and grounded-mission maintenance

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-single-brain-wave5-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v94-single-brain-maintenance
  cancel-in-progress: false

jobs:
  maintain-single-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard branch and clean protected products
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          test -z "$(git status --porcelain -- functions/ multiservicios-web/)"

      - name: Install root dependencies only
        run: npm ci

      - name: Preserve certified single-brain convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v94_single_brain_prune.py | tee /tmp/v94-single-brain-maintenance.log
          git diff --check
          test -z "$(git diff --name-only -- functions/)"
          test -z "$(git diff --name-only -- multiservicios-web/)"

      - name: Converge verified marketing files into existing download renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          terminal_path = Path("gestia-terminal.html")
          terminal = terminal_path.read_text(encoding="utf-8")
          delivery_marker = "const verifiedProducedArtifacts ="
          if delivery_marker not in terminal:
              pending_pos = terminal.find("?.renderPendingArtifacts?.()")
              if pending_pos < 0:
                  raise SystemExit("MARKETING_DOWNLOAD_PENDING_RENDERER_MISSING")
              owner_pos = terminal.rfind("window.JarvisAttachments", 0, pending_pos)
              if owner_pos < 0:
                  raise SystemExit("MARKETING_DOWNLOAD_RENDERER_OWNER_MISSING")
              line_start = terminal.rfind("\n", 0, owner_pos) + 1
              indent = terminal[line_start:owner_pos]
              lines = [
                  "const verifiedProducedArtifacts =",
                  "    (Array.isArray(finalResponse?.producedArtifacts)",
                  "        ? finalResponse.producedArtifacts",
                  "        : [])",
                  "        .filter(item =>",
                  "            typeof item?.output === \"string\" &&",
                  "            item.output.startsWith(\".jarvis-artifacts/\")",
                  "        )",
                  "        .filter((item, index, items) =>",
                  "            items.findIndex(candidate => candidate.output === item.output) === index",
                  "        );",
                  "",
                  "if (",
                  "    verifiedProducedArtifacts.length > 0 &&",
                  "    typeof window.JarvisAttachments?.renderArtifact === \"function\"",
                  ") {",
                  "    for (const artifact of verifiedProducedArtifacts) {",
                  "        try {",
                  "            await window.JarvisAttachments.renderArtifact(",
                  "                artifact.output,",
                  "                \"\",",
                  "                artifact.label || \"archivo producido\"",
                  "            );",
                  "        }",
                  "        catch(error) {",
                  "            console.warn(",
                  "                \"[JARVIS_FINAL_ARTIFACT_RENDER_FAILED]\",",
                  "                { output: artifact.output, error: error?.message || String(error) }",
                  "            );",
                  "        }",
                  "    }",
                  "}",
                  ""
              ]
              block = "\n".join((indent + line if line else "") for line in lines) + "\n"
              terminal = terminal[:line_start] + block + terminal[line_start:]
              terminal_path.write_text(terminal, encoding="utf-8")
          test_path = Path("tests/jarvis-marketing-terminal-delivery.e2e.test.mjs")
          tests = test_path.read_text(encoding="utf-8")
          test_name = 'test("Terminal renders verified marketing producedArtifacts through the existing download renderer"'
          if test_name not in tests:
              marker = 'test("completed marketing plan content is injected into MD and PDF artifact creation", () => {'
              if marker not in tests:
                  raise SystemExit("MARKETING_DOWNLOAD_TEST_ANCHOR_MISSING")
              regression_lines = [
                  'test("Terminal renders verified marketing producedArtifacts through the existing download renderer", () => {',
                  '    const terminal = fs.readFileSync(path.join(process.cwd(), "gestia-terminal.html"), "utf8");',
                  '    assert.match(terminal, /const verifiedProducedArtifacts =/);',
                  '    assert.match(terminal, /finalResponse\\?\\.producedArtifacts/);',
                  '    assert.match(terminal, /item\\.output\\.startsWith\\("\\.jarvis-artifacts\\/"\\)/);',
                  '    assert.match(terminal, /JarvisAttachments\\.renderArtifact\\(/);',
                  '    assert.match(terminal, /JARVIS_FINAL_ARTIFACT_RENDER_FAILED/);',
                  '});',
                  ''
              ]
              regression = "\n".join(regression_lines) + "\n"
              tests = tests.replace(marker, regression + marker, 1)
              test_path.write_text(tests, encoding="utf-8")
          terminal = terminal_path.read_text(encoding="utf-8")
          tests = test_path.read_text(encoding="utf-8")
          required_markers = [
              delivery_marker,
              "finalResponse?.producedArtifacts",
              'item.output.startsWith(".jarvis-artifacts/")',
              "JarvisAttachments.renderArtifact(",
              "JARVIS_FINAL_ARTIFACT_RENDER_FAILED"
          ]
          for required in required_markers:
              if required not in terminal:
                  raise SystemExit("MARKETING_DOWNLOAD_MARKER_MISSING:" + required)
          if test_name not in tests:
              raise SystemExit("MARKETING_DOWNLOAD_REGRESSION_MISSING")
          PY
          git diff --check
          test -z "$(git diff --name-only -- functions/)"
          test -z "$(git diff --name-only -- multiservicios-web/)"

      - name: Verify single brain grounded research and downloadable delivery
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          node --test tests/single-semantic-authority.test.mjs | tee /tmp/v94-single-brain-focused.log
          node --test tests/jarvis-source-grounded-research-v124.test.mjs | tee /tmp/v94-grounded-research-focused.log
          node --test tests/jarvis-marketing-terminal-delivery.e2e.test.mjs | tee /tmp/v94-marketing-download-focused.log
          ! grep -Fq 'routeTerminalNaturalIntent' gestia-terminal.html
          ! grep -Fq 'TERMINAL_BRAIN_ROUTER_41_42' gestia-terminal.html
          ! grep -Fq 'GestiaCore?.analizarIntencionLigera' gestia-terminal.html
          ! grep -Fq 'runtime.register({' gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          grep -Fq 'JarvisToolRuntime.execute' gestia-terminal.html
          grep -Fq 'researchGoalHasSatisfiedExplicitAnchor' gestia-core/jarvis/jarvis.multifunction.planner.js
          grep -Fq 'const verifiedProducedArtifacts =' gestia-terminal.html
          grep -Fq 'JarvisAttachments.renderArtifact(' gestia-terminal.html
          test -z "$(git diff --name-only -- functions/)"
          test -z "$(git diff --name-only -- multiservicios-web/)"

      - name: Run complete CI
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:test 2>&1 | tee /tmp/v94-single-brain-ci.log
          git diff --check
          test -z "$(git diff --name-only -- functions/)"
          test -z "$(git diff --name-only -- multiservicios-web/)"

      - name: Materialize downloadable grounded single flow
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'DOWNLOADABLE_SINGLE_FLOW_ALREADY_MATERIALIZED=true'
            exit 0
          fi
          allowed='^(gestia-terminal\.html|tests/jarvis-marketing-terminal-delivery\.e2e\.test\.mjs)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            echo 'DOWNLOADABLE_SINGLE_FLOW_UNEXPECTED_DIFF=true'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gestia-terminal.html tests/jarvis-marketing-terminal-delivery.e2e.test.mjs
          git commit -m 'fix(jarvis): render verified marketing deliverables for download'
          git push origin HEAD:v94-media-v4n-negative-claims
          echo 'DOWNLOADABLE_SINGLE_FLOW_MATERIALIZED=true'

      - name: Upload maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v94-single-brain-maintenance-evidence
          path: |
            /tmp/v94-single-brain-maintenance.log
            /tmp/v94-single-brain-focused.log
            /tmp/v94-grounded-research-focused.log
            /tmp/v94-marketing-download-focused.log
            /tmp/v94-single-brain-ci.log
          if-no-files-found: ignore
          retention-days: 14

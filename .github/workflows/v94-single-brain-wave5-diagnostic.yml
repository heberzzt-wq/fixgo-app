name: V94 single-brain crash and latency maintenance

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-single-brain-wave5-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v94-single-brain-maintenance
  cancel-in-progress: false

jobs:
  maintain-single-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard branch and protected products
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          test -z "$(git status --porcelain -- functions/ multiservicios-web/)"

      - name: Install root dependencies only
        run: npm ci

      - name: Close orphan terminal route and bound semantic latency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once_if_needed(text, old, new, code):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(code)
              return text.replace(old, new, 1)

          terminal_path = Path("gestia-terminal.html")
          terminal = terminal_path.read_text(encoding="utf-8")

          stale_token = 'terminalBrainRoute?.mode !== "PROPOSAL_ADJUSTMENT"'
          if stale_token in terminal:
              token_pos = terminal.index(stale_token)
              start = terminal.rfind("                if (", 0, token_pos)
              end_marker = "                        const adjustmentTargetFile ="
              end = terminal.find(end_marker, token_pos)
              if start < 0 or end < 0:
                  raise SystemExit("TERMINAL_STALE_ROUTE_BLOCK_ANCHOR_MISSING")
              terminal = terminal[:start] + terminal[end:]

          route_patch_start = "        const activePatchProposal =\n            terminalBrainRoute?.mode === \"PROPOSAL_ADJUSTMENT\""
          if route_patch_start in terminal:
              start = terminal.index(route_patch_start)
              end_marker = "                const lockedAdjustmentFile ="
              end = terminal.find(end_marker, start)
              if end < 0:
                  raise SystemExit("TERMINAL_ACTIVE_PROPOSAL_ROUTE_END_MISSING")
              deterministic_block = "\n".join([
                  "        const activePatchProposal =",
                  "            activeSharedPatchProposal ||",
                  "            activeVisualPatchProposal ||",
                  "            null;",
                  "",
                  "        const shouldBuildProposalAdjustmentInput =",
                  "            false;",
                  "",
              ])
              terminal = terminal[:start] + deterministic_block + terminal[end:]

          terminal = terminal.replace("                    terminalBrainRoute,\n", "")

          if "terminalBrainRoute" in terminal:
              raise SystemExit("TERMINAL_ORPHAN_BRAIN_ROUTE_REMAINS")
          if "routeTerminalNaturalIntent" in terminal:
              raise SystemExit("TERMINAL_SEMANTIC_ROUTER_REAPPEARED")
          if "TERMINAL_BRAIN_ROUTER_41_42" in terminal:
              raise SystemExit("TERMINAL_BRAIN_ROUTER_MARKER_REAPPEARED")

          terminal_path.write_text(terminal, encoding="utf-8")

          planner_path = Path("gestia-core/jarvis/jarvis.multifunction.planner.js")
          planner = planner_path.read_text(encoding="utf-8")
          planner_old = "\n".join([
              "const CLOUD_MISSION_CONTRACT_TIMEOUT_MS =",
              "    45000;",
              "",
              "const BROWSER_MISSION_ATTEMPT_TIMEOUT_MS =",
              "    20000;",
              "",
              "const BROWSER_PLAN_ATTEMPT_TIMEOUT_MS =",
              "    15000;"
          ])
          planner_new = "\n".join([
              "const CLOUD_MISSION_CONTRACT_TIMEOUT_MS =",
              "    12000;",
              "",
              "const BROWSER_MISSION_ATTEMPT_TIMEOUT_MS =",
              "    6000;",
              "",
              "const BROWSER_PLAN_ATTEMPT_TIMEOUT_MS =",
              "    5000;"
          ])
          planner = replace_once_if_needed(
              planner,
              planner_old,
              planner_new,
              "PLANNER_TIMEOUT_CONSTANTS_ANCHOR_MISSING"
          )
          planner = replace_once_if_needed(
              planner,
              "            : 110000;",
              "            : 12000;",
              "PLANNER_LONG_TIMEOUT_ANCHOR_MISSING"
          )
          planner_path.write_text(planner, encoding="utf-8")

          multitool_path = Path("gestia-core/jarvis/jarvis.multitool.pack.js")
          multitool = multitool_path.read_text(encoding="utf-8")
          response_old = "\n".join([
              "const responseTimeoutMs =",
              "        Number(maxOutputTokens) >= 6000",
              "            ? 130000",
              "            : 55000;"
          ])
          response_new = "\n".join([
              "const responseTimeoutMs =",
              "        Number(maxOutputTokens) >= 6000",
              "            ? 30000",
              "            : 18000;"
          ])
          multitool = replace_once_if_needed(
              multitool,
              response_old,
              response_new,
              "CONVERSATION_RESPONSE_TIMEOUT_ANCHOR_MISSING"
          )
          multitool_path.write_text(multitool, encoding="utf-8")

          core_path = Path("gestia-core/gestia-core.js")
          core = core_path.read_text(encoding="utf-8")
          retry_start = core.find("    const buildMissionToolCallsWithTransientRetry =")
          retry_end = core.find("    const missionResult =", retry_start)
          if retry_start < 0 or retry_end < 0:
              raise SystemExit("CORE_PLANNER_RETRY_ANCHOR_MISSING")
          if "providerFallbackExhausted" not in core[retry_start:retry_end]:
              retry_lines = [
                  "    const buildMissionToolCallsWithTransientRetry =",
                  "        async (plannerInstruction, plannerOptions) => {",
                  "            let lastPlannerError = null;",
                  "            for (let attempt = 1; attempt <= 2; attempt += 1) {",
                  "                try {",
                  "                    return await buildJarvisMultifunctionToolCalls(",
                  "                        plannerInstruction,",
                  "                        plannerOptions",
                  "                    );",
                  "                }",
                  "                catch (error) {",
                  "                    lastPlannerError = error;",
                  "                    const message = String(error?.message || \"SEMANTIC_PLANNER_UNAVAILABLE\");",
                  "                    const providerFallbackExhausted =",
                  "                        message.includes(\"__BROWSER_\") ||",
                  "                        message.includes(\"TIMEOUT_\") ||",
                  "                        message.includes(\"AUTH_REQUIRED\");",
                  "                    if (attempt >= 2 || providerFallbackExhausted) {",
                  "                        throw error;",
                  "                    }",
                  "                    console.warn(",
                  "                        \"[MISSION_SEMANTIC_PLANNER_TRANSIENT_RETRY]\",",
                  "                        attempt,",
                  "                        message",
                  "                    );",
                  "                    await new Promise(resolve => setTimeout(resolve, 350));",
                  "                }",
                  "            }",
                  "            throw lastPlannerError || new Error(\"SEMANTIC_PLANNER_UNAVAILABLE\");",
                  "        };",
                  ""
              ]
              core = core[:retry_start] + "\n".join(retry_lines) + core[retry_end:]
          core_path.write_text(core, encoding="utf-8")

          test_path = Path("tests/jarvis-multifunction-tools.test.mjs")
          tests = test_path.read_text(encoding="utf-8")
          test_name = 'test("terminal core-first has no orphan brain route and semantic latency is bounded"'
          if test_name not in tests:
              tests += "\n" + "\n".join([
                  "test(\"terminal core-first has no orphan brain route and semantic latency is bounded\", () => {",
                  "    const terminalSource = fs.readFileSync(path.resolve(\"gestia-terminal.html\"), \"utf8\");",
                  "    const plannerSource = fs.readFileSync(path.resolve(\"gestia-core/jarvis/jarvis.multifunction.planner.js\"), \"utf8\");",
                  "    const coreSource = fs.readFileSync(path.resolve(\"gestia-core/gestia-core.js\"), \"utf8\");",
                  "    const multitoolSource = fs.readFileSync(path.resolve(\"gestia-core/jarvis/jarvis.multitool.pack.js\"), \"utf8\");",
                  "    assert.doesNotMatch(terminalSource, /terminalBrainRoute/);",
                  "    assert.doesNotMatch(terminalSource, /routeTerminalNaturalIntent/);",
                  "    assert.match(terminalSource, /await window\\.GestiaCore\\.procesarIntencion/);",
                  "    assert.match(plannerSource, /CLOUD_MISSION_CONTRACT_TIMEOUT_MS\\s*=\\s*\\n\\s*12000/);",
                  "    assert.match(plannerSource, /BROWSER_MISSION_ATTEMPT_TIMEOUT_MS\\s*=\\s*\\n\\s*6000/);",
                  "    assert.match(plannerSource, /BROWSER_PLAN_ATTEMPT_TIMEOUT_MS\\s*=\\s*\\n\\s*5000/);",
                  "    assert.doesNotMatch(plannerSource, /:\\s*110000;/);",
                  "    assert.match(coreSource, /providerFallbackExhausted/);",
                  "    assert.match(multitoolSource, /\\?\\s*30000[\\s\\S]{0,80}?:\\s*18000/);",
                  "});",
                  ""
              ])
          test_path.write_text(tests, encoding="utf-8")
          PY

          git diff --check
          test -z "$(git diff --name-only -- functions/)"
          test -z "$(git diff --name-only -- multiservicios-web/)"

      - name: Verify focused crash latency and single-brain contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/gestia-core.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          node --test tests/single-semantic-authority.test.mjs
          node --test tests/jarvis-multifunction-tools.test.mjs
          node --test tests/jarvis-source-grounded-research-v124.test.mjs
          ! grep -Fq 'terminalBrainRoute' gestia-terminal.html
          ! grep -Fq 'routeTerminalNaturalIntent' gestia-terminal.html
          ! grep -Fq 'TERMINAL_BRAIN_ROUTER_41_42' gestia-terminal.html
          grep -Fq 'await window.GestiaCore.procesarIntencion' gestia-terminal.html
          grep -Fq 'providerFallbackExhausted' gestia-core/gestia-core.js
          grep -Fq '    12000;' gestia-core/jarvis/jarvis.multifunction.planner.js

      - name: Run complete CI
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:test 2>&1 | tee /tmp/v94-core-first-latency-ci.log
          git diff --check
          test -z "$(git diff --name-only -- functions/)"
          test -z "$(git diff --name-only -- multiservicios-web/)"

      - name: Materialize crash and latency fix
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'CORE_FIRST_CRASH_LATENCY_ALREADY_MATERIALIZED=true'
            exit 0
          fi
          allowed='^(gestia-terminal\.html|gestia-core/gestia-core\.js|gestia-core/jarvis/jarvis\.multifunction\.planner\.js|gestia-core/jarvis/jarvis\.multitool\.pack\.js|tests/jarvis-multifunction-tools\.test\.mjs)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            echo 'CORE_FIRST_CRASH_LATENCY_UNEXPECTED_DIFF=true'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            gestia-terminal.html \
            gestia-core/gestia-core.js \
            gestia-core/jarvis/jarvis.multifunction.planner.js \
            gestia-core/jarvis/jarvis.multitool.pack.js \
            tests/jarvis-multifunction-tools.test.mjs
          git commit -m 'fix(jarvis): remove orphan terminal route and bound semantic latency'
          git push origin HEAD:v94-media-v4n-negative-claims
          echo 'CORE_FIRST_CRASH_LATENCY_MATERIALIZED=true'

      - name: Upload maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v94-core-first-crash-latency-evidence
          path: /tmp/v94-core-first-latency-ci.log
          if-no-files-found: ignore
          retention-days: 14

name: V94 single-brain maintenance

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-single-brain-wave5-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v94-single-brain-maintenance
  cancel-in-progress: false

jobs:
  maintain-single-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard branch and clean protected products
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          test -z "$(git status --porcelain -- functions/ multiservicios-web/)"

      - name: Install root dependencies only
        run: npm ci

      - name: Apply existing single-brain maintenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v94_single_brain_prune.py | tee /tmp/v94-single-brain-maintenance.log
          git diff --check
          test -z "$(git diff --name-only -- functions/)"
          test -z "$(git diff --name-only -- multiservicios-web/)"

      - name: Verify one semantic authority and one tool registry
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          node --check tests/single-semantic-authority.test.mjs
          node --test tests/single-semantic-authority.test.mjs | tee /tmp/v94-single-brain-focused.log
          ! grep -Fq 'routeTerminalNaturalIntent' gestia-terminal.html
          ! grep -Fq 'TERMINAL_BRAIN_ROUTER_41_42' gestia-terminal.html
          ! grep -Fq 'GestiaCore?.analizarIntencionLigera' gestia-terminal.html
          ! grep -Fq 'runtime.register({' gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          grep -Fq 'JarvisToolRuntime.execute' gestia-terminal.html
          grep -Fq 'collectorDefinition.execute = async' gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          grep -Fq 'reelDefinition.execute = async' gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          test -z "$(git diff --name-only -- functions/)"
          test -z "$(git diff --name-only -- multiservicios-web/)"

      - name: Run complete CI
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:test 2>&1 | tee /tmp/v94-single-brain-ci.log
          git diff --check
          test -z "$(git diff --name-only -- functions/)"
          test -z "$(git diff --name-only -- multiservicios-web/)"

      - name: Materialize current single flow
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'SINGLE_BRAIN_ALREADY_MATERIALIZED=true'
            exit 0
          fi
          allowed='^(gestia-terminal\.html|gestia-core/nexo/nexo\.real-media\.runtime-guard-v128\.js|tests/single-semantic-authority\.test\.mjs|tests/jarvis-multifunction-tools\.test\.mjs)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            echo 'SINGLE_BRAIN_UNEXPECTED_DIFF=true'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gestia-terminal.html gestia-core/nexo/nexo.real-media.runtime-guard-v128.js tests/single-semantic-authority.test.mjs tests/jarvis-multifunction-tools.test.mjs
          git commit -m 'refactor(single-brain): converge terminal and tool authority'
          git push origin HEAD:v94-media-v4n-negative-claims
          echo 'SINGLE_BRAIN_MATERIALIZED=true'

      - name: Upload maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v94-single-brain-maintenance-evidence
          path: |
            /tmp/v94-single-brain-maintenance.log
            /tmp/v94-single-brain-focused.log
            /tmp/v94-single-brain-ci.log
          if-no-files-found: ignore
          retention-days: 14

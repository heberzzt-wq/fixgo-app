name: v140 patch observer

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v140-patch-observer.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  expose-patch-run:
    runs-on: ubuntu-latest
    steps:
      - name: Find patch workflow run and publish observable status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          patch_run=""
          patch_status=""
          patch_conclusion=""
          for attempt in $(seq 1 12); do
            response=$(curl --fail-with-body --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/v140-core-presentation-patch.yml/runs?branch=v94-media-v4n-negative-claims&event=push&per_page=10")
            patch_run=$(echo "$response" | jq -r '.workflow_runs | map(select(.head_sha == "2fcb4734ba45dc41b3dd0db5a4db284f7418908b")) | .[0].id // empty')
            patch_status=$(echo "$response" | jq -r '.workflow_runs | map(select(.head_sha == "2fcb4734ba45dc41b3dd0db5a4db284f7418908b")) | .[0].status // empty')
            patch_conclusion=$(echo "$response" | jq -r '.workflow_runs | map(select(.head_sha == "2fcb4734ba45dc41b3dd0db5a4db284f7418908b")) | .[0].conclusion // empty')
            if [ -n "$patch_run" ]; then break; fi
            sleep 5
          done
          test -n "$patch_run"
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${patch_run}"
          state=pending
          if [ "$patch_status" = completed ]; then
            if [ "$patch_conclusion" = success ]; then state=success; else state=failure; fi
          fi
          description="patch_run=${patch_run} status=${patch_status} conclusion=${patch_conclusion:-none}"
          payload=$(jq -n --arg state "$state" --arg context 'v140-patch-observer' --arg description "$description" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
          echo "$description"

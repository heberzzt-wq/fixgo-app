name: v133-full-ci-diagnostic

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v133-full-ci-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose-v133-full-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions test dependencies without modifying source
        run: npm ci --prefix functions

      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          ! git diff --name-only a09d76c5d42117aa88630f7b0d5fee75290525b2..HEAD | grep -E '^functions/'

      - name: CI segment 1 mission contracts
        run: node --test tests/response-composer-semantic-contract.test.mjs tests/jarvis-mission-contract-accounting.test.mjs tests/jarvis-mission-failure-precedence.test.mjs tests/jarvis-mission-orchestrator.test.mjs

      - name: CI segment 2 check nexo
        run: npm run check:nexo

      - name: CI segment 3 entry syntax
        run: npm run check:entry-syntax

      - name: CI segment 4 syntax
        run: npm run check:syntax

      - name: CI segment 5 multifunction
        run: npm run test:multifunction

      - name: CI segment 6 root test
        run: npm test

      - name: Diagnostic marker
        run: echo "V133_FULL_CI_SEGMENTS_ALL_GREEN=true"

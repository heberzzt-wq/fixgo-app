name: ChatGPT commit safe expansion v12

on:
  push:
    branches:
      - chatgpt/jarvis-v12-marketing-handoff

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/jarvis-v12-marketing-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply coupled orchestrator and presenter patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('gestia-core/jarvis/jarvis.mission.orchestrator.js')
          s = p.read_text(encoding='utf-8')
          old = '''        if (text(task?.args?.format, 40).toLowerCase() !== requiredFormat) return false;\n        if (["md", "pdf", "xlsx"].includes(requiredFormat) && task?.args?.contentSource !== "marketing.plan") return false;'''
          new = '''        if (text(task?.args?.format, 40).toLowerCase() !== requiredFormat) return false;'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('orchestrator matcher marker unavailable')

          old = '''        missingCalls.push({\n            name: requirement.toolName,\n            args: requiredArgs,\n            approved: false,\n            reason: "MARKETING_DECLARED_PHYSICAL_REQUIREMENT"\n        });'''
          new = '''        if (requirement.toolName === "document.create") {\n            missingCalls.push({\n                name: requirement.toolName,\n                args: requiredArgs,\n                approved: false,\n                reason: "MARKETING_DECLARED_PHYSICAL_REQUIREMENT"\n            });\n        }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('orchestrator expansion marker unavailable')
          s = s.replace('"1.17.0-marketing-declared-artifact-expansion-v12"', '"1.18.0-safe-marketing-artifact-expansion-v12"', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('gestia-core/jarvis/jarvis.marketing.presenter.js')
          s = p.read_text(encoding='utf-8')
          old = '''        if (format && String(item?.args?.format || "").toLowerCase() !== format) return false;\n        if (requirement.legacy !== true && ["md", "pdf", "xlsx"].includes(format) && item?.args?.contentSource !== "marketing.plan") return false;'''
          new = '''        if (format && String(item?.args?.format || "").toLowerCase() !== format) return false;'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('presenter matcher marker unavailable')
          p.write_text(s, encoding='utf-8')
          PY
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.marketing.presenter.js
          git diff --check
      - name: Commit coupled patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gestia-core/jarvis/jarvis.mission.orchestrator.js \
            gestia-core/jarvis/jarvis.marketing.presenter.js
          git commit -m "jarvis: defer incomplete marketing actuators and preserve verified formats"
          git pull --rebase origin chatgpt/jarvis-v12-marketing-handoff
          git push origin HEAD:chatgpt/jarvis-v12-marketing-handoff

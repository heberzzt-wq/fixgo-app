name: inspect current semantic production

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/inspect-current-semantic-production.yml'

permissions:
  contents: read

env:
  BASE_SHA: 8de46c00565b041b006f6a33d81ff6c22a616846
  HANDOFF_PATCH_SHA256: 0b357d2cb607276cf9ec9b65a66a23caf05379cdaaab22972bc9764f9407a98a
  CERTIFIED_CARRIER_SHA: cebe6f399d4edf4f234e584e0a42cf980b3a404d

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct served candidate
        shell: bash
        run: |
          set -euo pipefail
          git show "${CERTIFIED_CARRIER_SHA}:.github/workflows/contract-audit-provider-outage-v3.yml" > /tmp/certified.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/certified.yml').read_text()
          def extract(a,b,o):
              s=text.index(f'      - name: {a}\n')
              rs=text.index('        run: |\n',s)+len('        run: |\n')
              e=text.index(f'\n      - name: {b}\n',rs)
              lines=[]
              for line in text[rs:e].splitlines():
                  if line.startswith('          '): lines.append(line[10:])
                  elif not line.strip(): lines.append('')
                  else: raise SystemExit(f'INDENT:{a}:{line!r}')
              Path(o).write_text('\n'.join(lines)+'\n')
          extract('Restore previously certified invariants','Harden existing planner and fail-closed presentation','/tmp/restore.sh')
          extract('Harden existing planner and fail-closed presentation','Contract and authority assertions','/tmp/harden.sh')
          PY
          mkdir -p /tmp/contract-audit
          for part in chunk-00.txt chunk-01.txt chunk-02.txt segment-05.txt segment-06.txt segment-07.txt chunk-04.txt; do
            git show "${CERTIFIED_CARRIER_SHA}:.github/candidates/contract-audit/${part}" >> /tmp/contract-audit/handoff.patch.gz.b64
          done
          base64 -d /tmp/contract-audit/handoff.patch.gz.b64 | gzip -d > /tmp/contract-audit/handoff.patch
          echo "$HANDOFF_PATCH_SHA256  /tmp/contract-audit/handoff.patch" | sha256sum -c -
          git checkout --detach "$BASE_SHA"
          git apply /tmp/contract-audit/handoff.patch
          bash /tmp/restore.sh
          bash /tmp/harden.sh
      - name: Inspect semantic plan and production metadata
        shell: bash
        run: |
          set -euo pipefail
          echo '=== productionRequested references ==='
          grep -R -n -C 8 'productionRequested\|productionArtifacts\|factsOnly' gestia-core/jarvis gestia-core/gestia-core.js | head -n 1400 || true
          echo '=== trustedPlanCalls / metadata ==='
          sed -n '1320,1465p' gestia-core/jarvis/jarvis.multifunction.planner.js
          sed -n '1600,1810p' gestia-core/jarvis/jarvis.multifunction.planner.js
          sed -n '1960,2035p' gestia-core/jarvis/jarvis.multifunction.planner.js
          sed -n '2170,2405p' gestia-core/jarvis/jarvis.multifunction.planner.js
          echo '=== core contract bridge ==='
          sed -n '4190,4380p' gestia-core/gestia-core.js
          echo '=== marketing scope ==='
          sed -n '150,285p' gestia-core/jarvis/jarvis.multitool.pack.js
          echo '=== dependency graph ==='
          sed -n '1,270p' gestia-core/jarvis/jarvis.mission.dependencies.js

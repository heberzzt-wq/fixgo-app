name: V94 A2 unrequested recommendation guard

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-a2-unrequested-recommendations.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Verify base ancestry
        run: git merge-base --is-ancestor 295b2971b8be8d06dbd431620d035d11199ae920 HEAD

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Apply recommendation guard patch
        run: |
          python3 scripts/v94-a2-unrequested-recommendations-patch.py
          python3 scripts/v94-a2-unrequested-recommendations-ci-compat.py

      - name: Verify focused syntax and regressions
        run: |
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.conversation.composer.js
          node --test tests/v94-media-browser-precision-contract.test.mjs tests/jarvis-conversation-composer.test.mjs tests/jarvis-multifunction-tools.test.mjs
          git diff --check

      - name: Run complete CI contract
        run: npm run ci:test

      - name: Commit certified patch and remove temporary tooling
        run: |
          git config user.name "OpenAI V94 Handoff"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/v94-a2-unrequested-recommendations-patch.py
          git rm scripts/v94-a2-unrequested-recommendations-ci-compat.py
          git rm .github/workflows/v94-a2-unrequested-recommendations.yml
          git add gestia-core/jarvis/jarvis.multitool.pack.js gestia-core/jarvis/jarvis.conversation.composer.js tests/v94-media-browser-precision-contract.test.mjs tests/jarvis-conversation-composer.test.mjs tests/jarvis-multifunction-tools.test.mjs
          git commit -m "[v94-media-v4n] fix(jarvis): suppress unrequested strict visual recommendations"
          git push origin HEAD:v94-media-v4n-negative-claims

name: v133-planner-version-expectation-apply

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/scripts/v133-planner-version-expectation.py
      - .github/workflows/v133-planner-version-expectation-apply.yml

permissions:
  contents: write

jobs:
  apply-v133-version-expectation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v94-media-v4n-negative-claims

      - name: Guard branch and Functions baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          ! git diff --name-only a09d76c5d42117aa88630f7b0d5fee75290525b2..HEAD | grep -E '^functions/'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align exact planner version expectation
        run: python .github/scripts/v133-planner-version-expectation.py

      - name: Assert only expected test changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "tests/jarvis-multifunction-tools.test.mjs"
          ! git diff --name-only | grep -E '^functions/'

      - name: Focal descriptor and v133
        run: |
          node --test \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-reel-mission-fidelity-v133.test.mjs \
            tests/single-semantic-authority.test.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit one-line expectation alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/jarvis-multifunction-tools.test.mjs
          git commit -m "[v133] test: align planner descriptor release identity"
          git push origin HEAD:v94-media-v4n-negative-claims

      - name: Alignment marker
        run: |
          echo "V133_PLANNER_VERSION_EXPECTATION_ALIGNED=true"
          echo "V133_FULL_MULTIFUNCTION_SUITE_PRESERVED=true"
          echo "V133_FUNCTIONS_UNCHANGED=true"

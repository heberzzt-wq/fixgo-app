name: V139 safe local artifact release-skew fix

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v139-release-skew-safe-artifacts-fix.yml'

permissions:
  contents: write

env:
  TARGET_BRANCH: v94-media-v4n-negative-claims

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Guard branch and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test -z "$(git diff --name-only HEAD^..HEAD | grep -E '^(functions/|multiservicios-web/)' || true)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize release-skew-safe artifact routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('gestia-core/tools.runtime.js')
          source = runtime_path.read_text(encoding='utf-8')

          anchor = '''const JARVIS_REQUIRED_LOCAL_BRIDGE_VERSION =
              "2.38.0-page-no-contact-route";
          '''
          replacement = anchor + '''
          const JARVIS_RELEASE_SKEW_SAFE_MIN_BRIDGE_VERSION =
              "2.45.0-native-mp4-reel-export-v138";

          const JARVIS_RELEASE_SKEW_SAFE_PATHS =
              new Set([
                  "/research",
                  "/web/media/collect",
                  "/speech/synthesize",
                  "/reel/create",
                  "/artifact/read"
              ]);
          '''
          if source.count(anchor) != 1:
              raise SystemExit(f'bridge version anchor count={source.count(anchor)}')
          source = source.replace(anchor, replacement, 1)

          old_identity = '''        const identityCompatible =
              expectedResponse.ok === true &&
              bridgeResponse.ok === true &&
              actual?.ok === true &&
              actual?.contract?.projectId === expected.projectId &&
              actual?.contract?.releaseId === expected.releaseId &&
              actual?.contract?.branch === expected.branch &&
              actual?.git?.branch === expected.branch;
          const compatible =
              identityCompatible &&
              bridgeVersionCompatible;
          '''
          new_identity = '''        const lineageCompatible =
              expectedResponse.ok === true &&
              bridgeResponse.ok === true &&
              actual?.ok === true &&
              actual?.contract?.projectId === expected.projectId &&
              actual?.contract?.branch === expected.branch &&
              actual?.git?.branch === expected.branch;
          const releaseCompatible =
              lineageCompatible &&
              actual?.contract?.releaseId === expected.releaseId;
          const identityCompatible =
              releaseCompatible;
          const releaseSkewBridgeVersionCompatible =
              jarvisBridgeVersionAtLeast(
                  bridgeVersion,
                  JARVIS_RELEASE_SKEW_SAFE_MIN_BRIDGE_VERSION
              );
          const compatible =
              releaseCompatible &&
              bridgeVersionCompatible;
          '''
          if source.count(old_identity) != 1:
              raise SystemExit(f'identity block count={source.count(old_identity)}')
          source = source.replace(old_identity, new_identity, 1)

          old_fields = '''            bridgeVersionCompatible,
              expected,
              actual,
          '''
          new_fields = '''            bridgeVersionCompatible,
              lineageCompatible,
              releaseCompatible,
              releaseSkewBridgeVersionCompatible,
              releaseSkewSafeMinBridgeVersion:
                  JARVIS_RELEASE_SKEW_SAFE_MIN_BRIDGE_VERSION,
              expected,
              actual,
          '''
          if source.count(old_fields) != 1:
              raise SystemExit(f'identity result fields count={source.count(old_fields)}')
          source = source.replace(old_fields, new_fields, 1)

          old_gate = '''    if (identity.ok !== true) {
              return {
                  ...identity,
                  ok: false,
                  success: false,
                  error:
                      identity.status,
                  path
              };
          }

          const timeoutMs =
          '''
          new_gate = '''    const normalizedPath =
              String(path || "").trim();
          const releaseSkewAllowed =
              identity.ok !== true &&
              identity.lineageCompatible === true &&
              identity.releaseCompatible === false &&
              identity.releaseSkewBridgeVersionCompatible === true &&
              JARVIS_RELEASE_SKEW_SAFE_PATHS.has(normalizedPath);

          if (
              identity.ok !== true &&
              releaseSkewAllowed !== true
          ) {
              return {
                  ...identity,
                  ok: false,
                  success: false,
                  error:
                      identity.status,
                  path:
                      normalizedPath
              };
          }

          const selectedReleaseId =
              releaseSkewAllowed
                  ? String(identity.actual?.contract?.releaseId || "")
                  : String(identity.expected?.releaseId || "");

          if (!selectedReleaseId) {
              return {
                  ...identity,
                  ok: false,
                  success: false,
                  status: "BRIDGE_RELEASE_ID_REQUIRED",
                  error: "BRIDGE_RELEASE_ID_REQUIRED",
                  path: normalizedPath
              };
          }

          const timeoutMs =
          '''
          if source.count(old_gate) != 1:
              raise SystemExit(f'request gate count={source.count(old_gate)}')
          source = source.replace(old_gate, new_gate, 1)

          old_header = '''                        "X-Jarvis-Release-Id":
                              identity.expected.releaseId
          '''
          new_header = '''                        "X-Jarvis-Release-Id":
                              selectedReleaseId
          '''
          if source.count(old_header) != 1:
              raise SystemExit(f'release header count={source.count(old_header)}')
          source = source.replace(old_header, new_header, 1)

          old_return = '''            bridgeIdentity:
                  identity
          '''
          new_return = '''            bridgeIdentity:
                  identity,
              releaseSkewAllowed,
              selectedReleaseId
          '''
          if source.count(old_return) < 1:
              raise SystemExit('bridgeIdentity return anchor missing')
          source = source.replace(old_return, new_return, 1)

          runtime_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/jarvis-v139-release-skew-safe-artifacts.test.mjs')
          test_path.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const runtime = fs.readFileSync("gestia-core/tools.runtime.js", "utf8");

          test("v139 tolerates release skew only for current local artifact routes", () => {
              assert.match(runtime, /JARVIS_RELEASE_SKEW_SAFE_MIN_BRIDGE_VERSION\s*=\s*\n\s*"2\.45\.0-native-mp4-reel-export-v138"/);
              assert.match(runtime, /const JARVIS_RELEASE_SKEW_SAFE_PATHS\s*=\s*\n\s*new Set\(\[/);
              for (const path of [
                  "/research",
                  "/web/media/collect",
                  "/speech/synthesize",
                  "/reel/create",
                  "/artifact/read"
              ]) {
                  assert.equal(runtime.includes(`"${path}"`), true, path);
              }
              const allowlist = runtime.match(/const JARVIS_RELEASE_SKEW_SAFE_PATHS[\s\S]*?\]\);/)?.[0] || "";
              for (const forbidden of ["/write", "/write/prepare", "/write/authorize", "/git", "/run"]) {
                  assert.equal(allowlist.includes(`"${forbidden}"`), false, forbidden);
              }
          });

          test("v139 release skew requires same project and branch lineage plus bridge 2.45+", () => {
              assert.match(runtime, /const lineageCompatible =[\s\S]*?actual\?\.contract\?\.projectId === expected\.projectId[\s\S]*?actual\?\.contract\?\.branch === expected\.branch[\s\S]*?actual\?\.git\?\.branch === expected\.branch/);
              assert.match(runtime, /const releaseCompatible =\s*\n\s*lineageCompatible &&\s*\n\s*actual\?\.contract\?\.releaseId === expected\.releaseId/);
              assert.match(runtime, /identity\.releaseSkewBridgeVersionCompatible === true/);
              assert.match(runtime, /JARVIS_RELEASE_SKEW_SAFE_PATHS\.has\(normalizedPath\)/);
          });

          test("v139 release skew uses local release only on the safe path while strict identity remains default", () => {
              assert.match(runtime, /const selectedReleaseId =\s*\n\s*releaseSkewAllowed\s*\n\s*\? String\(identity\.actual\?\.contract\?\.releaseId \|\| ""\)\s*\n\s*: String\(identity\.expected\?\.releaseId \|\| ""\)/);
              assert.match(runtime, /"X-Jarvis-Release-Id":\s*\n\s*selectedReleaseId/);
              assert.match(runtime, /if \(\s*identity\.ok !== true &&\s*releaseSkewAllowed !== true\s*\)/);
          });
          ''', encoding='utf-8')
          PY

      - name: Syntax and targeted regression
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/tools.runtime.js
          node --test tests/jarvis-v139-release-skew-safe-artifacts.test.mjs
          node --test \
            tests/jarvis-live-human-reds-v113.test.mjs \
            tests/jarvis-source-grounded-research-v124.test.mjs \
            tests/jarvis-reel-speech-v137.test.mjs \
            tests/jarvis-reel-real-production-v134.test.mjs \
            tests/jarvis-reel-native-mp4-v138.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Guard protected surfaces after patch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only | grep -E '^(functions/|multiservicios-web/)' || true)"
          git diff --check

      - name: Commit fix and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v139-release-skew-safe-artifacts-fix.yml
          git add gestia-core/tools.runtime.js tests/jarvis-v139-release-skew-safe-artifacts.test.mjs
          git commit -m "fix(v139): tolerate safe local artifact release skew"
          git push origin HEAD:"$TARGET_BRANCH"

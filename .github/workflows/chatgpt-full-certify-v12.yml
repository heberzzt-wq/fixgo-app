name: ChatGPT full certify v12

on:
  push:
    branches:
      - chatgpt/jarvis-v12-marketing-handoff

permissions:
  contents: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/jarvis-v12-marketing-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full Jarvis regression and sovereign deploy-gate assertion
        shell: bash
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
        run: |
          set +e
          npm run ci:test 2>&1 | tee /tmp/full-v12-tests.log
          test_code=${PIPESTATUS[0]}

          node scripts/jarvis-deploy-gate.mjs > /tmp/full-v12-gate.log 2>&1
          gate_code=$?
          cat /tmp/full-v12-gate.log

          gate_expected=0
          if [ "$gate_code" -ne 0 ] && grep -q 'DEPLOY_BRANCH_NOT_ALLOWED' /tmp/full-v12-gate.log; then
            gate_expected=1
          fi

          final_code=0
          if [ "$test_code" -ne 0 ] || [ "$gate_expected" -ne 1 ]; then
            final_code=1
          fi

          mkdir -p docs
          {
            echo "CHATGPT_JARVIS_V12_FULL_CERTIFICATION=true"
            echo "source_sha=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "tests_exit_code=${test_code}"
            echo "deploy_gate_exit_code=${gate_code}"
            echo "deploy_branch_block_verified=${gate_expected}"
            echo "exit_code=${final_code}"
            echo "--- tests tail ---"
            tail -n 180 /tmp/full-v12-tests.log
            echo "--- deploy gate ---"
            cat /tmp/full-v12-gate.log
          } > docs/chatgpt-jarvis-v12-full-certification.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chatgpt-jarvis-v12-full-certification.txt
          git commit -m "ci: persist Jarvis v12 full certification"
          git pull --rebase origin chatgpt/jarvis-v12-marketing-handoff
          git push origin HEAD:chatgpt/jarvis-v12-marketing-handoff
          exit "$final_code"

name: ChatGPT CI failure diagnostic v12

on:
  push:
    branches:
      - chatgpt/jarvis-v12-marketing-handoff

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/jarvis-v12-marketing-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run canonical CI and persist failures
        shell: bash
        run: |
          set +e
          npm run ci:test > /tmp/ci-v12.log 2>&1
          code=$?
          mkdir -p docs
          {
            echo "CHATGPT_V12_CI_DIAGNOSTIC=true"
            echo "source_sha=${GITHUB_SHA}"
            echo "exit_code=${code}"
            echo "--- failures ---"
            grep -n -C 12 -E 'not ok|ERR_ASSERTION|AssertionError|npm error|Process completed|# fail [1-9]|failed [1-9]' /tmp/ci-v12.log | tail -n 500 || true
            echo "--- npm phase markers ---"
            grep -n -E '^> gestia-premium@|^> npm run|^> node --test' /tmp/ci-v12.log | tail -n 100 || true
          } > docs/chatgpt-v12-ci-failures.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chatgpt-v12-ci-failures.txt
          git commit -m "ci: capture remaining Jarvis v12 failures"
          git pull --rebase origin chatgpt/jarvis-v12-marketing-handoff
          git push origin HEAD:chatgpt/jarvis-v12-marketing-handoff
          exit 0

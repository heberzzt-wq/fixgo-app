name: v133-full-ci-monolithic-diagnostic

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v133-full-ci-monolithic-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose-monolithic-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions test dependencies without modifying source
        run: npm ci --prefix functions

      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          ! git diff --name-only a09d76c5d42117aa88630f7b0d5fee75290525b2..HEAD | grep -E '^functions/'

      - name: Capture exact monolithic ci:test
        id: monolithic
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/v133-ci-test.log"
          npm run ci:test >"$log" 2>&1
          status=$?
          echo "V133_MONOLITHIC_CI_EXIT=$status"
          echo "V133_MONOLITHIC_CI_LOG_BYTES=$(wc -c < "$log")"
          echo "----- LAST 500 LINES -----"
          tail -n 500 "$log" || true
          echo "----- END LAST 500 LINES -----"
          cp "$log" ./v133-ci-test.log
          exit "$status"

      - name: Upload monolithic CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v133-monolithic-ci-log
          path: v133-ci-test.log
          if-no-files-found: error
          retention-days: 1

name: V94 v122 single media route authority

on:
  push:
    branches: [v94-media-v4n-negative-claims]
    paths:
      - .github/workflows/v94-v122-single-media-route-authority.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BRANCH: v94-media-v4n-negative-claims
      BASE_PRODUCT: 74a418c0398e52d8fcf1629b8d9feddc54cba8ef
      MAIN_SHA: f3fa8e1806b681e860875afd4ce8183d27864873
      POLISH_SHA: 2ae85e670505c5d425a5a0334e99c45168054bb8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0
      - name: Guard isolated staging only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          git fetch origin main v5.9-polish "$BRANCH"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/v5.9-polish)" = "$POLISH_SHA"
          test -z "$(git diff --name-only "$BASE_PRODUCT"..HEAD -- functions/)"
          unexpected="$(git diff --name-only "$BASE_PRODUCT"..HEAD | grep -Ev '^(scripts/v122-single-media-route-authority.py|\.github/workflows/v94-v122-single-media-route-authority.yml)$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: |
          npm ci
          npm --prefix functions ci --ignore-scripts
      - name: Apply route authority cleanup
        run: python3 scripts/v122-single-media-route-authority.py
      - name: Source invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check jarvis-upload-bridge.js
          node --check jarvis-fs-bridge.js
          ! grep -q 'registerNexoWebMediaRoutes' jarvis-upload-bridge.js
          grep -q 'registerNexoWebMediaRoutes(app, { root })' jarvis-fs-bridge.js
          grep -q '1.2.0-fs-media-route-authority-v122' jarvis-upload-bridge.js
          test -z "$(git diff --name-only "$BASE_PRODUCT" -- functions/)"
      - name: Focused bridge and v122 regressions
        run: >-
          node --test
          tests/jarvis-generalist-execution-contract-v122.test.mjs
          tests/jarvis-upload-bridge.test.mjs
          tests/nexo-web-media-bridge.test.mjs
          tests/nexo-real-media-tools.test.mjs
          tests/jarvis-fs-bridge-v2.test.mjs
      - name: Full CI
        run: npm run ci:test
      - name: Final product proof
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$BASE_PRODUCT" -- functions/)"
          git diff --check
      - name: Commit product and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/v122-single-media-route-authority.py
          rm -f .github/workflows/v94-v122-single-media-route-authority.yml
          git config user.name "heberzzt-wq"
          git config user.email "heberzzt@gmail.com"
          git add -A
          test -z "$(git diff --cached --name-only | grep -E '^functions/' || true)"
          git commit -m "[v94] fix(adj): centralize real-media route authority"
          git push origin HEAD:"$BRANCH"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Final protected refs Functions and no-deploy proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main v5.9-polish "$BRANCH"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/v5.9-polish)" = "$POLISH_SHA"
          test "$(git rev-parse origin/$BRANCH)" = "$PRODUCT_SHA"
          test -z "$(git diff --name-only "$BASE_PRODUCT" "$PRODUCT_SHA" -- functions/)"
          test ! -e scripts/v122-single-media-route-authority.py
          test ! -e .github/workflows/v94-v122-single-media-route-authority.yml
          echo "V122_SINGLE_MEDIA_AUTHORITY_CERTIFIED=$PRODUCT_SHA"

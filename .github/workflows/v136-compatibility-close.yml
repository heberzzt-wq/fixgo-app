name: v136 compatibility close

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/scripts/v136-slash-branch-resolver-fix.py'
      - '.github/scripts/v136-marketing-media-fixture-align.py'
      - '.github/workflows/v136-compatibility-close.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guard isolated branch and untouched Functions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          git diff --quiet HEAD^ HEAD -- functions/
      - name: Install root dependencies
        run: npm ci
      - name: Install Functions test dependencies without modifying source
        run: npm ci --prefix functions
      - name: Apply slash-branch resolver repair
        run: python .github/scripts/v136-slash-branch-resolver-fix.py
      - name: Apply proven marketing fixture alignment
        run: python .github/scripts/v136-marketing-media-fixture-align.py
      - name: Guard exact compatibility surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet HEAD -- functions/
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          printf '%s\n' "${changed[@]}"
          expected=$'jarvis-fs-bridge.js\ntests/jarvis-marketing-real-delivery.test.mjs\ntests/jarvis-marketing-terminal-delivery.e2e.test.mjs'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
      - name: Syntax bridge
        run: node --check jarvis-fs-bridge.js
      - name: Targeted repo and reel compatibility
        run: >-
          node --test
          tests/jarvis-repo-target-runtime.test.mjs
          tests/jarvis-marketing-real-delivery.test.mjs
          tests/jarvis-marketing-terminal-delivery.e2e.test.mjs
          tests/jarvis-reel-media-source-recovery-v136.test.mjs
          tests/nexo-browser-media-fallback-v135.test.mjs
          tests/jarvis-reel-real-production-v134.test.mjs
          tests/single-semantic-authority.test.mjs
      - name: Full CI
        run: npm run ci:test
      - name: Whitespace guard
        run: git diff --check
      - name: Commit compatibility closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jarvis-fs-bridge.js \
            tests/jarvis-marketing-real-delivery.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs
          git diff --cached --quiet && { echo 'NO_V136_COMPATIBILITY_CHANGE'; exit 1; }
          git commit -m '[v136] fix(adj): preserve repo refs and real reel fixtures'
          git push origin HEAD:v94-media-v4n-negative-claims

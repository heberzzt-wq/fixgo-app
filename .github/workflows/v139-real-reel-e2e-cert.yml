name: v139 real reel e2e cert
# final-canonical-trigger: core-first crash latency fix 4dea903f 2026-08-17

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v139-real-reel-e2e-cert.yml'
      - '.github/scripts/v139-canonical-real-reel.mjs'
      - 'gestia-terminal.html'
      - 'gestia-core/gestia-core.js'
      - 'gestia-core/tools.runtime.js'
      - 'gestia-core/tools.bridge.js'
      - 'gestia-core/jarvis/jarvis.mission.orchestrator.js'
      - 'gestia-core/jarvis/jarvis.multifunction.planner.js'
      - 'gestia-core/jarvis/jarvis.multitool.pack.js'
      - 'gestia-core/jarvis/jarvis.actuator.pack.js'
      - 'gestia-core/nexo/nexo.real-media.tools.js'
      - 'gestia-core/nexo/nexo.real-media.runtime-guard-v128.js'
      - 'jarvis-fs-bridge.js'
      - 'jarvis-reel-artifact.js'
      - 'jarvis-speech-artifact.js'
      - 'nexo-web-media-bridge.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/jarvis-reel-live-cache-v139.test.mjs'
      - 'tests/jarvis-reel-media-source-recovery-v136.test.mjs'
      - 'tests/jarvis-multifunction-tools.test.mjs'
      - 'tests/jarvis-semantic-memory-integrity.test.mjs'
  workflow_dispatch:
    inputs:
      external_reel:
        description: 'Run authenticated external reel E2E'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  certify-v139:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Guard branch and Functions unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          ! git diff --name-only 45c9231715ad1d8f50756328c6e4128deebba581..HEAD | grep -E '^functions/'

      - name: Focal syntax contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/gestia-core.js
          node --check gestia-core/tools.runtime.js
          node --check gestia-core/tools.bridge.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.actuator.pack.js
          node --check gestia-core/nexo/nexo.real-media.tools.js
          node --check jarvis-fs-bridge.js
          node --check jarvis-reel-artifact.js
          node --check jarvis-speech-artifact.js

      - name: Reel live cache v139
        run: node --test tests/jarvis-reel-live-cache-v139.test.mjs
      - name: Reel native mp4 v138
        run: node --test tests/jarvis-reel-native-mp4-v138.test.mjs
      - name: Reel speech v137
        run: node --test tests/jarvis-reel-speech-v137.test.mjs
      - name: Reel media source recovery v136
        run: node --test tests/jarvis-reel-media-source-recovery-v136.test.mjs
      - name: NEXO browser media fallback v135
        run: node --test tests/nexo-browser-media-fallback-v135.test.mjs
      - name: Reel real production v134
        run: node --test tests/jarvis-reel-real-production-v134.test.mjs
      - name: Reel mission fidelity v133
        run: node --test tests/jarvis-reel-mission-fidelity-v133.test.mjs
      - name: Reel researched media v132
        run: node --test tests/jarvis-reel-researched-media-v132.test.mjs
      - name: NEXO real media tools
        run: node --test tests/nexo-real-media-tools.test.mjs
      - name: Jarvis actuator pack
        run: node --test tests/jarvis-actuator-pack.test.mjs
      - name: Jarvis fs bridge v2
        run: node --test tests/jarvis-fs-bridge-v2.test.mjs
      - name: Jarvis reel artifact
        run: node --test tests/jarvis-reel-artifact.test.mjs

      - name: Focal mission semantic latency contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/single-semantic-authority.test.mjs \
            tests/jarvis-source-grounded-research-v124.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs

      - name: Focal business delivery contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            tests/jarvis-marketing-real-delivery.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs \
            tests/jarvis-page-artifact.test.mjs \
            tests/jarvis-docx-artifact.test.mjs

      - name: Full CI
        run: npm run ci:test
      - name: Reject whitespace errors
        run: git diff --check
      - name: Certification marker
        run: |
          echo 'V139_FUNCTIONS_UNCHANGED=true'
          echo 'V139_FOCAL_GREEN=true'
          echo 'V139_FULL_CI_GREEN=true'
          echo 'V139_GROUNDED_BUSINESS_CHAIN_GREEN=true'
          echo 'V139_BOUNDED_LATENCY_PRESENTATION_GREEN=true'

  real-reel-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_reel == true }}
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Guard branch and Functions unchanged
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne 'v94-media-v4n-negative-claims') { throw 'WRONG_BRANCH' }
          $changed = git diff --name-only ffb83de3360b64a07655fb8d01bb26caae8998e4..HEAD
          if ($changed -match '^functions/') { throw 'FUNCTIONS_CHANGED' }
      - name: Start bridge and run canonical real-reel mission in same step
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'v139-bridge.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'v139-bridge.stderr.log'
          $process = Start-Process -FilePath node -ArgumentList 'jarvis-fs-bridge.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              $probe = Test-NetConnection -ComputerName 127.0.0.1 -Port 3344 -WarningAction SilentlyContinue
              if ($probe.TcpTestSucceeded) { $ready = $true; break }
              if ($process.HasExited) { break }
            }
            if (-not $ready) {
              Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
              throw 'V139_LOCAL_BRIDGE_NOT_READY'
            }
            Write-Host "V139_BRIDGE_PID=$($process.Id)"
            & node '.github/scripts/v139-canonical-real-reel.mjs'
            if ($LASTEXITCODE -ne 0) { throw "V139_CANONICAL_MISSION_FAILED:$LASTEXITCODE" }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue | Select-Object -Last 120
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue | Select-Object -Last 120
          }
      - name: Windows certification marker
        run: |
          echo V139_CANONICAL_REAL_REEL_E2E_GREEN=true

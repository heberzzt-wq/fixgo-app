name: v129-reel-quality-gate-cert

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v129-reel-quality-gate-cert.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions test dependencies without modifying source
        run: npm ci --prefix functions

      - name: Guard isolated branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          if git diff --name-only 88572468b4a910af8f03c8ce23e22f69aaa72aa2..HEAD | grep -E '^functions/'; then
            echo "Functions changed in v129" >&2
            exit 1
          fi
          echo "V129_FUNCTIONS_UNCHANGED=true"

      - name: Syntax focal v129
        run: |
          node --check jarvis-reel-artifact.js
          node --check gestia-core/nexo/nexo.real-media.tools.js
          node --check gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          node --check modules/terminal/nexo-bootstrap.js
          node --check modules/terminal/proposal-state.js

      - name: Focal v129 tests
        run: node --test tests/jarvis-reel-artifact.test.mjs tests/jarvis-real-media-reel-hydration-v127.test.mjs tests/nexo-real-media-tools.test.mjs tests/nexo-real-media-runtime-guard-v128.test.mjs tests/nexo-web-media-bridge.test.mjs tests/jarvis-fs-bridge-v2.test.mjs tests/proposal-state.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Reject whitespace errors
        run: git diff --check

      - name: Certification marker
        run: |
          echo "V129_REEL_QUALITY_GATE_CERTIFIED=true"
          echo "V129_FUNCTIONS_UNCHANGED=true"
          echo "V129_AUDIO_POLICY=ARTIFACT_ONLY_NO_TTS"

name: Jarvis web + planner recovery

on:
  pull_request:
    paths:
      - "functions/jarvis-genai-provider-chain.js"
      - "jarvis-local-web-research.js"
      - "jarvis-upload-bridge.js"
      - "tests/jarvis-genai-provider-chain.test.cjs"
      - "tests/jarvis-genai-grounding-canonicalization.test.cjs"
      - "tests/jarvis-local-web-research.test.mjs"
      - "tests/jarvis-upload-research-route.test.mjs"
      - "package.json"
      - ".github/workflows/jarvis-web-planner-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify recovery syntax
        run: |
          node --check functions/jarvis-genai-provider-chain.js
          node --check jarvis-local-web-research.js
          node --check jarvis-upload-bridge.js

      - name: Run focused recovery tests
        run: |
          node --test \
            tests/jarvis-genai-provider-chain.test.cjs \
            tests/jarvis-genai-grounding-canonicalization.test.cjs \
            tests/jarvis-local-web-research.test.mjs \
            tests/jarvis-upload-research-route.test.mjs

      - name: Reject whitespace errors
        run: git diff --check

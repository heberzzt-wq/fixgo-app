name: V94 v121 final live verification and cleanup

on:
  push:
    branches: [v94-media-v4n-negative-claims]
    paths: [.github/workflows/v94-v121-final-live-cleanup.yml]

permissions:
  contents: write

env:
  BASELINE: fc021b3112542dbcdb9d236a17e0b71ee547463b
  PRODUCT_SHA: db00b4fb090b311e102409c91eb6e4a078f5435b
  EXPECTED_MAIN: f3fa8e1806b681e860875afd4ce8183d27864873
  EXPECTED_POLISH: 2ae85e670505c5d425a5a0334e99c45168054bb8
  RELEASE_TOKEN: v94-generalist-production-integrity-v121-20260810

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Guard certified product Functions and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          git cat-file -e "$PRODUCT_SHA^{commit}"
          critical=(
            gestia-terminal.html
            gestia-terminal.js
            gestia-core/gestia-core.js
            gestia-core/gestia.runtime.v7.js
            gestia-core/tools.runtime.js
            gestia-core/jarvis/jarvis.multifunction.planner.js
            gestia-core/jarvis/jarvis.multitool.pack.js
            gestia-core/jarvis/jarvis.page.creator.js
            gestia-core/jarvis/jarvis.identity.integrity.js
            gestia-core/jarvis/jarvis.page.factual.integrity.js
            gestia-core/jarvis/jarvis.actuator.pack.js
            jarvis-page-artifact.js
          )
          git diff --quiet "$PRODUCT_SHA" HEAD -- "${critical[@]}"
          git diff --quiet "$BASELINE" HEAD -- functions
          git fetch origin main v5.9-polish --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/v5.9-polish)" = "$EXPECTED_POLISH"

      - name: Final exact live byte verification
        shell: bash
        run: |
          set -euo pipefail
          critical=(
            gestia-terminal.html
            gestia-terminal.js
            gestia-core/gestia-core.js
            gestia-core/gestia.runtime.v7.js
            gestia-core/tools.runtime.js
            gestia-core/jarvis/jarvis.multifunction.planner.js
            gestia-core/jarvis/jarvis.multitool.pack.js
            gestia-core/jarvis/jarvis.page.creator.js
            gestia-core/jarvis/jarvis.identity.integrity.js
            gestia-core/jarvis/jarvis.page.factual.integrity.js
            gestia-core/jarvis/jarvis.actuator.pack.js
            jarvis-page-artifact.js
          )
          for base in https://fixgo-44e4d.web.app https://fixgo-44e4d.firebaseapp.com; do
            for p in "${critical[@]}"; do
              git show "$PRODUCT_SHA:$p" > /tmp/expected.bin
              expected="$(sha256sum /tmp/expected.bin | awk '{print $1}')"
              curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
                "$base/$p?product=$PRODUCT_SHA&final=$(date +%s%N)" -o /tmp/live.bin
              live="$(sha256sum /tmp/live.bin | awk '{print $1}')"
              echo "$base/$p expected=$expected live=$live"
              test "$expected" = "$live"
            done
          done

      - name: Final live semantic invariants
        shell: bash
        run: |
          set -euo pipefail
          base='https://fixgo-44e4d.web.app'
          curl -fsSL --retry 5 "$base/gestia-terminal.html?final=$PRODUCT_SHA" -o /tmp/terminal.html
          test "$(grep -Fc "$RELEASE_TOKEN" /tmp/terminal.html)" = "4"
          ! grep -Fq 'v94-runtime-health-truth-v116-20260809' /tmp/terminal.html
          ! grep -Fq 'v94-secure-session-v117-20260810' /tmp/terminal.html

          curl -fsSL --retry 5 "$base/gestia-core/gestia-core.js?final=$PRODUCT_SHA" -o /tmp/core.js
          ! grep -Fq 'semanticMemory: semanticMemoryContext' /tmp/core.js
          test "$(grep -Fc 'semanticMemoryAvailable: Boolean(semanticMemoryContext)' /tmp/core.js)" = "3"
          grep -Fq 'semanticMemoryAvailable: Boolean(semanticMemory)' /tmp/core.js
          grep -Fq 'memoryContext: semanticMemoryContext' /tmp/core.js
          grep -Fq "$RELEASE_TOKEN" /tmp/core.js

          curl -fsSL --retry 5 "$base/gestia-core/jarvis/jarvis.multifunction.planner.js?final=$PRODUCT_SHA" -o /tmp/planner.js
          grep -Fq 'rejectCorruptedIdentityArgs' /tmp/planner.js

          curl -fsSL --retry 5 "$base/gestia-core/jarvis/jarvis.multitool.pack.js?final=$PRODUCT_SHA" -o /tmp/multitool.js
          grep -Fq 'identityPreserved' /tmp/multitool.js
          grep -Fq 'AUDITORIA_FACTUAL_DE_PAGINA' /tmp/multitool.js
          grep -Fq 'PAGE_FACTUAL_INTEGRITY_INCOMPLETE' /tmp/multitool.js
          ! grep -Fq 'Multiservicios Peninsulares HMH' /tmp/multitool.js
          ! grep -Fq 'Multiservicios Peninsulares SMH' /tmp/multitool.js

          curl -fsSL --retry 5 "$base/gestia-core/jarvis/jarvis.page.creator.js?final=$PRODUCT_SHA" -o /tmp/page-creator.js
          grep -Fq 'sections: Array.isArray(input.sections)' /tmp/page-creator.js
          ! grep -Fq '"como_funciona"' /tmp/page-creator.js

          curl -fsSL --retry 5 "$base/gestia-core/jarvis/jarvis.identity.integrity.js?final=$PRODUCT_SHA" -o /tmp/identity.js
          ! grep -Fq 'Multiservicios Peninsulares HMH' /tmp/identity.js
          ! grep -Fq 'Multiservicios Peninsulares SMH' /tmp/identity.js

          curl -fsSL --retry 5 "$base/jarvis-page-artifact.js?final=$PRODUCT_SHA" -o /tmp/page-artifact.js
          grep -Fq 'requestedSections: requestedSectionsSatisfied' /tmp/page-artifact.js
          ! grep -Fq '? "https://wa.me/"' /tmp/page-artifact.js
          echo "V121_FINAL_LIVE_INVARIANTS_GREEN=$PRODUCT_SHA"

      - name: Recheck protected boundaries before cleanup
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main v5.9-polish --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/v5.9-polish)" = "$EXPECTED_POLISH"
          git diff --quiet "$BASELINE" HEAD -- functions

      - name: Remove all v119-v121 temporary certification workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/v94-current-turn-freshness-v119.yml \
            .github/workflows/v94-current-turn-freshness-v119-r2.yml \
            .github/workflows/v94-v119-diagnostic.yml \
            .github/workflows/v94-v119-failing-test-log.yml \
            .github/workflows/v94-v119-step1-memory-boundary.yml \
            .github/workflows/v94-v120-step2-generalist-page-integrity.yml \
            .github/workflows/v94-v121-step3-page-factual-integrity.yml \
            .github/workflows/v94-v121-step4-production-regression.yml \
            .github/workflows/v94-v121-step5-certify-hosting.yml \
            .github/workflows/v94-v121-postdeploy-byte-diagnostic.yml \
            .github/workflows/v94-v121-final-live-cleanup.yml
          unexpected="$(git diff --cached --name-only | grep -v '^.github/workflows/' || true)"
          test -z "$unexpected"
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- functions)"
          git commit -m "[v94] chore: remove v119-v121 certification workflows"
          cleanup_sha="$(git rev-parse HEAD)"
          git push origin HEAD:v94-media-v4n-negative-claims
          remote_sha="$(git ls-remote origin refs/heads/v94-media-v4n-negative-claims | awk '{print $1}')"
          test "$cleanup_sha" = "$remote_sha"
          echo "FINAL_CLEANUP_SHA=$cleanup_sha"

      - name: Final local product and Functions proof
        shell: bash
        run: |
          set -euo pipefail
          critical=(
            gestia-terminal.html
            gestia-terminal.js
            gestia-core/gestia-core.js
            gestia-core/gestia.runtime.v7.js
            gestia-core/tools.runtime.js
            gestia-core/jarvis/jarvis.multifunction.planner.js
            gestia-core/jarvis/jarvis.multitool.pack.js
            gestia-core/jarvis/jarvis.page.creator.js
            gestia-core/jarvis/jarvis.identity.integrity.js
            gestia-core/jarvis/jarvis.page.factual.integrity.js
            gestia-core/jarvis/jarvis.actuator.pack.js
            jarvis-page-artifact.js
          )
          git diff --quiet "$PRODUCT_SHA" HEAD -- "${critical[@]}"
          git diff --quiet "$BASELINE" HEAD -- functions
          echo "V121_GENERALIST_PRODUCTION_CLOSED=$PRODUCT_SHA"

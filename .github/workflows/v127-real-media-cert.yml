name: v127-real-media-cert

on:
  push:
    branches:
      - v94-media-v4n-negative-claims

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions test dependencies without modifying source
        run: npm ci --prefix functions

      - name: Guard protected branches and Functions
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          if git diff --name-only de1d6e9ad038409e2de392c7deb80dcd14b5ca4f..HEAD | grep -E '^functions/'; then
            echo "Functions changed in v127" >&2
            exit 1
          fi
          echo "V127_FUNCTIONS_UNCHANGED=true"

      - name: Syntax focal v127
        run: |
          node --check gestia-core/jarvis/jarvis.mission.planner-state.js
          node --check gestia-core/nexo/nexo.real-media.tools.js
          node --check nexo-web-media-bridge.js
          node --check jarvis-reel-artifact.js
          node --check modules/terminal/nexo-bootstrap.js
          node --check modules/terminal/proposal-state.js

      - name: Focal v127 tests
        run: node --test tests/jarvis-real-media-reel-hydration-v127.test.mjs tests/nexo-real-media-tools.test.mjs tests/nexo-web-media-bridge.test.mjs tests/jarvis-reel-artifact.test.mjs tests/jarvis-fs-bridge-v2.test.mjs tests/proposal-state.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Certification marker
        run: |
          echo "V127_REAL_MEDIA_REEL_HYDRATION_CERTIFIED=true"
          echo "V127_FUNCTIONS_UNCHANGED=true"

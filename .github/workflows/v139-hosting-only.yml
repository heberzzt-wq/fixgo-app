name: v139 hosting only

on:
  workflow_dispatch:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v139-hosting-only.yml'

permissions:
  contents: read

env:
  CERTIFIED_SHA: c9ab09c064ce7db3337592fdca2d92607203c9fd
  CERTIFIED_TREE: 40835625ed507a2f576ff4999cf3a79c4a6d066c
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  recertify-exact-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact corrected certification SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          fetch-depth: 0

      - name: Guard exact corrected tree and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CERTIFIED_TREE"
          ! git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817.."$CERTIFIED_SHA" | grep -E '^functions/'
          ! git diff --name-only 2d58a795a1e81a0adc5301bf958f80c604f8ef52.."$CERTIFIED_SHA" | grep -E '^multiservicios-web/'
          echo "V139_RECERT_SHA=$CERTIFIED_SHA"
          echo "V139_RECERT_TREE=$CERTIFIED_TREE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Focal syntax contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/gestia-core.js
          node --check gestia-core/tools.runtime.js
          node --check gestia-core/tools.bridge.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.actuator.pack.js
          node --check gestia-core/nexo/nexo.real-media.tools.js
          node --check jarvis-fs-bridge.js
          node --check jarvis-reel-artifact.js
          node --check jarvis-speech-artifact.js

      - name: Legacy reel focal contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/jarvis-reel-live-cache-v139.test.mjs
          node --test tests/jarvis-reel-native-mp4-v138.test.mjs
          node --test tests/jarvis-reel-speech-v137.test.mjs
          node --test tests/jarvis-reel-media-source-recovery-v136.test.mjs
          node --test tests/nexo-browser-media-fallback-v135.test.mjs
          node --test tests/jarvis-reel-real-production-v134.test.mjs
          node --test tests/jarvis-reel-mission-fidelity-v133.test.mjs
          node --test tests/jarvis-reel-researched-media-v132.test.mjs
          node --test tests/nexo-real-media-tools.test.mjs
          node --test tests/jarvis-actuator-pack.test.mjs
          node --test tests/jarvis-fs-bridge-v2.test.mjs
          node --test tests/jarvis-reel-artifact.test.mjs

      - name: Focal mission semantic latency contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/single-semantic-authority.test.mjs \
            tests/jarvis-source-grounded-research-v124.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs

      - name: Focal business delivery contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            tests/jarvis-marketing-real-delivery.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs \
            tests/jarvis-page-artifact.test.mjs \
            tests/jarvis-docx-artifact.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Reject whitespace errors
        run: git diff --check

      - name: Exact Linux certification marker
        run: |
          echo 'V139_EXACT_LINUX_RECERT_GREEN=true'
          echo 'V139_FUNCTIONS_UNCHANGED=true'
          echo 'V139_MULTISERVICIOS_UNCHANGED=true'
          echo 'V139_BOUNDED_LATENCY_PRESENTATION_GREEN=true'

  recertify-exact-windows:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact corrected certification SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          fetch-depth: 0

      - name: Guard exact corrected tree and protected surfaces
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne 'v94-media-v4n-negative-claims') { throw 'WRONG_BRANCH' }
          if ((git rev-parse HEAD).Trim() -ne $env:CERTIFIED_SHA) { throw 'WRONG_CERTIFIED_SHA' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:CERTIFIED_TREE) { throw 'WRONG_CERTIFIED_TREE' }
          $functionsChanged = git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817..$env:CERTIFIED_SHA
          if ($functionsChanged -match '^functions/') { throw 'FUNCTIONS_CHANGED' }
          $multiserviciosChanged = git diff --name-only 2d58a795a1e81a0adc5301bf958f80c604f8ef52..$env:CERTIFIED_SHA
          if ($multiserviciosChanged -match '^multiservicios-web/') { throw 'MULTISERVICIOS_CHANGED' }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Start bridge and run canonical real-reel mission in same step
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'v139-bridge.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'v139-bridge.stderr.log'
          $process = Start-Process -FilePath node -ArgumentList 'jarvis-fs-bridge.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              $probe = Test-NetConnection -ComputerName 127.0.0.1 -Port 3344 -WarningAction SilentlyContinue
              if ($probe.TcpTestSucceeded) { $ready = $true; break }
              if ($process.HasExited) { break }
            }
            if (-not $ready) {
              Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
              throw 'V139_LOCAL_BRIDGE_NOT_READY'
            }
            Write-Host "V139_BRIDGE_PID=$($process.Id)"
            & node '.github/scripts/v139-canonical-real-reel.mjs'
            if ($LASTEXITCODE -ne 0) { throw "V139_CANONICAL_MISSION_FAILED:$LASTEXITCODE" }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue | Select-Object -Last 120
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue | Select-Object -Last 120
          }

      - name: Exact Windows certification marker
        run: |
          echo V139_EXACT_WINDOWS_REAL_REEL_RECERT_GREEN=true

  deploy-hosting-only:
    needs:
      - recertify-exact-linux
      - recertify-exact-windows
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact certified product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          fetch-depth: 0

      - name: Guard exact certified tree and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CERTIFIED_TREE"
          ! git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817.."$CERTIFIED_SHA" | grep -E '^functions/'
          ! git diff --name-only 2d58a795a1e81a0adc5301bf958f80c604f8ef52.."$CERTIFIED_SHA" | grep -E '^multiservicios-web/'
          echo "V139_CERTIFIED_SHA=$CERTIFIED_SHA"
          echo "V139_CERTIFIED_TREE=$CERTIFIED_TREE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build single-site Hosting config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const hosting = Array.isArray(source.hosting) ? source.hosting : [source.hosting].filter(Boolean);
          const selected = hosting.filter(item => item && item.site === process.env.FIREBASE_SITE_ID);
          if (selected.length !== 1) {
            throw new Error(`V139_HOSTING_SITE_SELECTION_INVALID:${selected.length}`);
          }
          if (selected[0].target) {
            throw new Error(`V139_HOSTING_TARGET_FORBIDDEN:${selected[0].target}`);
          }
          const isolated = { hosting: selected[0] };
          fs.writeFileSync('.firebase-v139-hosting-only.json', JSON.stringify(isolated, null, 2));
          NODE
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('.firebase-v139-hosting-only.json', 'utf8'));
          if (config.functions) throw new Error('V139_FUNCTIONS_CONFIG_PRESENT');
          if (Array.isArray(config.hosting)) throw new Error('V139_MULTISITE_CONFIG_PRESENT');
          if (config.hosting?.site !== process.env.FIREBASE_SITE_ID) throw new Error('V139_WRONG_HOSTING_SITE');
          if (config.hosting?.target) throw new Error('V139_MULTISERVICIOS_TARGET_PRESENT');
          console.log('V139_HOSTING_CONFIG_ISOLATED=true');
          console.log(`V139_HOSTING_SITE=${config.hosting.site}`);
          NODE

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy certified ADJUNTO Hosting only
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy \
            --config .firebase-v139-hosting-only.json \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive
          echo 'V139_HOSTING_ONLY_DEPLOYED=true'
          echo "V139_DEPLOYED_CERTIFIED_SHA=$CERTIFIED_SHA"

      - name: Verify deployed web bytes runtime guard downloadable delivery and bounded latency
        shell: bash
        run: |
          set -euo pipefail
          url="https://${FIREBASE_SITE_ID}.web.app/gestia-terminal.html?v139_sha=${CERTIFIED_SHA}"
          core_url="https://${FIREBASE_SITE_ID}.web.app/gestia-core/gestia-core.js?v139_sha=${CERTIFIED_SHA}"
          guard_url="https://${FIREBASE_SITE_ID}.web.app/gestia-core/nexo/nexo.real-media.runtime-guard-v128.js?v139_sha=${CERTIFIED_SHA}"
          planner_url="https://${FIREBASE_SITE_ID}.web.app/gestia-core/jarvis/jarvis.multifunction.planner.js?v139_sha=${CERTIFIED_SHA}"
          multitool_url="https://${FIREBASE_SITE_ID}.web.app/gestia-core/jarvis/jarvis.multitool.pack.js?v139_sha=${CERTIFIED_SHA}"
          attachments_url="https://${FIREBASE_SITE_ID}.web.app/modules/terminal/jarvis-attachments.js?v139_sha=${CERTIFIED_SHA}"
          ok=false
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --location "$url" -o /tmp/v139-terminal.html \
              && curl --fail --silent --show-error --location "$core_url" -o /tmp/v139-core.js \
              && curl --fail --silent --show-error --location "$guard_url" -o /tmp/v139-runtime-guard.js \
              && curl --fail --silent --show-error --location "$planner_url" -o /tmp/v139-planner.js \
              && curl --fail --silent --show-error --location "$multitool_url" -o /tmp/v139-multitool.js \
              && curl --fail --silent --show-error --location "$attachments_url" -o /tmp/v139-attachments.js \
              && grep -Fq 'gestia-core/gestia-core.js?v=v139-real-reel-e2e-20260812' /tmp/v139-terminal.html \
              && grep -Fq 'MISSION_SEMANTIC_PLANNER_TRANSIENT_RETRY' /tmp/v139-core.js \
              && grep -Fq 'providerFallbackExhausted' /tmp/v139-core.js \
              && grep -Fq 'Boolean(missionResult.reason)' /tmp/v139-core.js \
              && grep -Fq 'NEXO_REAL_MEDIA_TOOLS_VERSION' /tmp/v139-runtime-guard.js \
              && grep -Fq 'realMediaToolsReady' /tmp/v139-runtime-guard.js \
              && ! grep -Fq 'runtime.register({' /tmp/v139-runtime-guard.js \
              && grep -Fq 'researchGoalHasSatisfiedExplicitAnchor' /tmp/v139-planner.js \
              && grep -Fq 'CLOUD_MISSION_CONTRACT_TIMEOUT_MS =' /tmp/v139-planner.js \
              && grep -Fq '    12000;' /tmp/v139-planner.js \
              && grep -Fq '    6000;' /tmp/v139-planner.js \
              && grep -Fq '    5000;' /tmp/v139-planner.js \
              && ! grep -Fq ': 110000;' /tmp/v139-planner.js \
              && grep -Fq 'const responseTimeoutMs =' /tmp/v139-multitool.js \
              && grep -Fq '? 30000' /tmp/v139-multitool.js \
              && grep -Fq ': 18000;' /tmp/v139-multitool.js \
              && ! grep -Fq '? 130000' /tmp/v139-multitool.js \
              && ! grep -Fq ': 55000;' /tmp/v139-multitool.js \
              && ! grep -Fq 'terminalBrainRoute' /tmp/v139-terminal.html \
              && ! grep -Fq 'routeTerminalNaturalIntent' /tmp/v139-terminal.html \
              && ! grep -Fq 'TERMINAL_BRAIN_ROUTER_41_42' /tmp/v139-terminal.html \
              && grep -Fq 'await window.GestiaCore.procesarIntencion' /tmp/v139-terminal.html \
              && grep -Fq 'TERMINAL_UNIVERSAL_CORE_FINAL_RESPONSE' /tmp/v139-terminal.html \
              && grep -Fq 'preferredAgentFinalResponse.text' /tmp/v139-terminal.html \
              && grep -Fq 'const verifiedProducedArtifacts =' /tmp/v139-terminal.html \
              && grep -Fq 'finalResponse?.producedArtifacts' /tmp/v139-terminal.html \
              && grep -Fq 'JarvisAttachments.renderArtifact(' /tmp/v139-terminal.html \
              && grep -Fq '/artifact/read' /tmp/v139-attachments.js \
              && grep -Fq 'jarvis-artifact-download' /tmp/v139-attachments.js \
              && grep -Fq 'renderArtifact' /tmp/v139-attachments.js; then
              ok=true
              break
            fi
            sleep 4
          done
          test "$ok" = true
          echo 'V139_HOSTING_WEB_VERIFIED=true'
          echo 'V139_NEXO_RUNTIME_GUARD_CONTRACT_VERIFIED=true'
          echo 'V139_SINGLE_BRAIN_SERVED=true'
          echo 'V139_GROUNDED_RESEARCH_SERVED=true'
          echo 'V139_DOWNLOADABLE_DELIVERY_SERVED=true'
          echo 'V139_BOUNDED_LATENCY_PRESENTATION_SERVED=true'
          echo 'V139_TERMINAL_ORPHAN_ROUTE_ABSENT_SERVED=true'
          echo "V139_WEB_URL=https://${FIREBASE_SITE_ID}.web.app/gestia-terminal.html"
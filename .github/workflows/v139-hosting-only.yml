name: Jarvis V142 hosting only

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v139-hosting-only.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CERTIFIED_SHA: eb089b176715b03b68ce93bb895d32899dc10b79
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  recertify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Jarvis candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          fetch-depth: 0

      - name: Guard exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jarvis local-only syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check modules/terminal/nexo-bootstrap.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check jarvis-fs-bridge.js
          node --check jarvis-upload-bridge.js
          node --check jarvis-github-worker.js

      - name: Jarvis local-only focal contracts
        run: |
          node --test --test-concurrency=1             tests/nexo-terminal-bootstrap.test.mjs             tests/jarvis-multifunction-tools.test.mjs             tests/single-semantic-authority.test.mjs             tests/jarvis-fs-bridge-v2.test.mjs             tests/jarvis-upload-bridge.test.mjs

      - name: Assert conversation composition has no cloud semantic fallback
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('gestia-core/jarvis/jarvis.multitool.pack.js','utf8');
          const start = source.indexOf('async function fetchSemanticConversation(');
          const end = source.indexOf('\nfunction clean(', start);
          if (start < 0 || end <= start) throw new Error('SEMANTIC_CONVERSATION_BLOCK_MISSING');
          const block = source.slice(start, end);
          for (const marker of [
            '/semantic/respond',
            'localOnly: true',
            'fallbackAllowed: false',
            'externalApiUsed: false',
            'cloudSemanticInferenceUsed: false'
          ]) {
            if (!block.includes(marker)) throw new Error('LOCAL_ONLY_MARKER_MISSING:' + marker);
          }
          if (block.includes('jarvisSemanticRespond') || block.includes('cloudfunctions.net')) {
            throw new Error('CLOUD_SEMANTIC_FALLBACK_PRESENT');
          }
          const bootstrap = fs.readFileSync('modules/terminal/nexo-bootstrap.js','utf8');
          if (!bootstrap.includes('maximumAttempts = 3')) throw new Error('LOOPBACK_RETRY_COUNT_MISSING');
          if (!bootstrap.includes('JARVIS_LOCAL_BRIDGE_TRANSIENT_RETRY')) throw new Error('LOOPBACK_RETRY_MARKER_MISSING');
          const terminal = fs.readFileSync('gestia-terminal.html','utf8');
          if (!terminal.includes('TERMINAL_LOCAL_SEMANTIC_AUTHORITY_UNAVAILABLE')) throw new Error('TERMINAL_FAIL_CLOSED_MARKER_MISSING');
          console.log('JARVIS_V142_HOSTING_CANDIDATE_CERTIFIED=true');
          NODE

  recertify-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Jarvis candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          fetch-depth: 0

      - name: Guard exact candidate
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CERTIFIED_SHA) { throw 'WRONG_CERTIFIED_SHA' }
          if ($env:GITHUB_REF_NAME -ne 'v94-media-v4n-negative-claims') { throw 'WRONG_BRANCH' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Windows local-only focal contracts
        shell: pwsh
        run: |
          node --test --test-concurrency=1 tests/nexo-terminal-bootstrap.test.mjs tests/jarvis-multifunction-tools.test.mjs tests/single-semantic-authority.test.mjs tests/jarvis-fs-bridge-v2.test.mjs tests/jarvis-upload-bridge.test.mjs tests/repo-source-structure.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_JARVIS_LOCAL_ONLY_CONTRACTS_FAILED' }

  deploy-hosting-only:
    needs:
      - recertify-linux
      - recertify-windows
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact certified Jarvis candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          fetch-depth: 0

      - name: Guard exact release SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"

      - name: Build isolated single-site Hosting config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('firebase.json','utf8'));
          const hosting = Array.isArray(source.hosting) ? source.hosting : [source.hosting].filter(Boolean);
          const selected = hosting.filter(item => item && item.site === process.env.FIREBASE_SITE_ID);
          if (selected.length !== 1) throw new Error('HOSTING_SITE_SELECTION_INVALID:' + selected.length);
          if (selected[0].target) throw new Error('HOSTING_TARGET_FORBIDDEN');
          fs.writeFileSync('.firebase-jarvis-v142-hosting-only.json', JSON.stringify({hosting:selected[0]}, null, 2));
          const isolated = JSON.parse(fs.readFileSync('.firebase-jarvis-v142-hosting-only.json','utf8'));
          if (isolated.functions || isolated.firestore || isolated.storage) throw new Error('NON_HOSTING_CONFIG_PRESENT');
          if (Array.isArray(isolated.hosting)) throw new Error('MULTISITE_CONFIG_PRESENT');
          if (isolated.hosting.site !== process.env.FIREBASE_SITE_ID) throw new Error('WRONG_HOSTING_SITE');
          console.log('JARVIS_V142_HOSTING_CONFIG_ISOLATED=true');
          NODE

      - name: Install pinned Firebase CLI
        run: npm install -g firebase-tools@15.10.1

      - name: Deploy ADJUNTO Hosting only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy             --config .firebase-jarvis-v142-hosting-only.json             --only hosting             --project "$FIREBASE_PROJECT_ID"             --token "$FIREBASE_TOKEN"             --non-interactive
          echo 'JARVIS_V142_HOSTING_ONLY_DEPLOYED=true'

      - name: Verify production serves local-only Jarvis bytes
        shell: bash
        run: |
          set -euo pipefail
          base="https://${FIREBASE_SITE_ID}.web.app"
          ok=false
          for attempt in $(seq 1 18); do
            curl --fail --silent --show-error --location "$base/modules/terminal/nexo-bootstrap.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/bootstrap.js || true
            curl --fail --silent --show-error --location "$base/gestia-core/jarvis/jarvis.multitool.pack.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/multitool.js || true
            curl --fail --silent --show-error --location "$base/gestia-core/jarvis/jarvis.conversation.composer.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/composer.js || true
            curl --fail --silent --show-error --location "$base/gestia-core/gestia-core.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/core.js || true
            curl --fail --silent --show-error --location "$base/gestia-terminal.html?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/terminal.html || true
            if grep -Fq '1.13.0-jarvis-single-authority-local-first' /tmp/bootstrap.js               && grep -Fq 'maximumAttempts = 3' /tmp/bootstrap.js               && grep -Fq 'JARVIS_LOCAL_BRIDGE_TRANSIENT_RETRY' /tmp/bootstrap.js               && grep -Fq 'LOCAL_SEMANTIC_RESPONSE_UNAVAILABLE' /tmp/multitool.js               && grep -Fq 'fallbackAllowed: false' /tmp/multitool.js               && grep -Fq 'const MAX_EVIDENCE_LENGTH = 8000' /tmp/composer.js               && grep -Fq 'payload?.candidates' /tmp/composer.js               && grep -Fq 'maxOutputTokens:' /tmp/core.js               && grep -Fq '160' /tmp/core.js               && grep -Fq 'TERMINAL_LOCAL_SEMANTIC_AUTHORITY_UNAVAILABLE' /tmp/terminal.html; then
              ok=true
              break
            fi
            sleep 4
          done
          test "$ok" = true
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('/tmp/multitool.js','utf8');
          const start = source.indexOf('async function fetchSemanticConversation(');
          const end = source.indexOf('\nfunction clean(', start);
          if (start < 0 || end <= start) throw new Error('DEPLOYED_SEMANTIC_BLOCK_MISSING');
          const block = source.slice(start,end);
          if (block.includes('jarvisSemanticRespond') || block.includes('cloudfunctions.net')) throw new Error('DEPLOYED_CLOUD_SEMANTIC_FALLBACK_PRESENT');
          console.log('JARVIS_V142_PRODUCTION_LOCAL_ONLY_VERIFIED=true');
          NODE

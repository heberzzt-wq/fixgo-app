name: Jarvis V142 hosting only

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v139-hosting-only.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CERTIFIED_SHA: ad2a9a5a13c4f9d4437dba6f8384d2ae94f758bd
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  recertify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Jarvis candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          fetch-depth: 0

      - name: Guard exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jarvis local-only syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check modules/terminal/nexo-bootstrap.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.semantic.memory.js
          node --check gestia-core/tools.runtime.js
          node --check modules/terminal/runtime-governance.js
          node --check jarvis-fs-bridge.js
          node --check jarvis-upload-bridge.js
          node --check jarvis-github-worker.js

      - name: Jarvis local-only focal contracts
        run: |
          node --test --test-concurrency=1             tests/nexo-terminal-bootstrap.test.mjs             tests/jarvis-multifunction-tools.test.mjs             tests/jarvis-semantic-planner.test.cjs tests/jarvis-current-turn-production-regressions.test.mjs tests/jarvis-mission-orchestrator.test.mjs             tests/response-composer-semantic-contract.test.mjs             tests/jarvis-runtime-idle-cognition-v142.test.mjs             tests/jarvis-semantic-memory-integrity.test.mjs             tests/single-semantic-authority.test.mjs             tests/jarvis-fs-bridge-v2.test.mjs             tests/jarvis-upload-bridge.test.mjs             tests/b2c-platform-authority.test.mjs
          node --test --test-name-pattern "governed repo commit requires post-write" tests/repo-authority-v2.test.cjs

      - name: Assert conversation composition has no cloud semantic fallback
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('gestia-core/jarvis/jarvis.multitool.pack.js','utf8');
          const start = source.indexOf('async function fetchSemanticConversation(');
          const end = source.indexOf('\nfunction clean(', start);
          if (start < 0 || end <= start) throw new Error('SEMANTIC_CONVERSATION_BLOCK_MISSING');
          const block = source.slice(start, end);
          for (const marker of [
            '/semantic/respond',
            'localOnly: true',
            'fallbackAllowed: false',
            'externalApiUsed: false',
            'cloudSemanticInferenceUsed: false'
          ]) {
            if (!block.includes(marker)) throw new Error('LOCAL_ONLY_MARKER_MISSING:' + marker);
          }
          if (block.includes('jarvisSemanticRespond') || block.includes('cloudfunctions.net')) {
            throw new Error('CLOUD_SEMANTIC_FALLBACK_PRESENT');
          }
          const bootstrap = fs.readFileSync('modules/terminal/nexo-bootstrap.js','utf8');
          if (!bootstrap.includes('maximumAttempts = 3')) throw new Error('LOOPBACK_RETRY_COUNT_MISSING');
          if (!bootstrap.includes('JARVIS_LOCAL_BRIDGE_TRANSIENT_RETRY')) throw new Error('LOOPBACK_RETRY_MARKER_MISSING');
          const terminal = fs.readFileSync('gestia-terminal.html','utf8');
          if (!terminal.includes('TERMINAL_LOCAL_SEMANTIC_AUTHORITY_UNAVAILABLE')) throw new Error('TERMINAL_FAIL_CLOSED_MARKER_MISSING');
          console.log('JARVIS_V142_HOSTING_CANDIDATE_CERTIFIED=true');
          NODE

  recertify-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Jarvis candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          fetch-depth: 0

      - name: Guard exact candidate
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CERTIFIED_SHA) { throw 'WRONG_CERTIFIED_SHA' }
          if ($env:GITHUB_REF_NAME -ne 'v94-media-v4n-negative-claims') { throw 'WRONG_BRANCH' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Windows local-only focal contracts
        shell: pwsh
        run: |
          node --test --test-concurrency=1 tests/nexo-terminal-bootstrap.test.mjs tests/jarvis-multifunction-tools.test.mjs tests/jarvis-semantic-planner.test.cjs tests/jarvis-current-turn-production-regressions.test.mjs tests/jarvis-mission-orchestrator.test.mjs tests/response-composer-semantic-contract.test.mjs tests/jarvis-runtime-idle-cognition-v142.test.mjs tests/jarvis-semantic-memory-integrity.test.mjs tests/single-semantic-authority.test.mjs tests/jarvis-fs-bridge-v2.test.mjs tests/jarvis-upload-bridge.test.mjs tests/repo-source-structure.test.mjs tests/b2c-platform-authority.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_JARVIS_LOCAL_ONLY_CONTRACTS_FAILED' }
          node --test --test-name-pattern "governed repo commit requires post-write" tests/repo-authority-v2.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_JARVIS_POST_WRITE_CONTRACT_FAILED' }

  deploy-hosting-only:
    needs:
      - recertify-linux
      - recertify-windows
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact certified Jarvis candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          fetch-depth: 0

      - name: Guard exact release SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"

      - name: Require the exact V142 full certification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/actions/runs/37541030852';
          (async () => {
            for (let attempt = 0; attempt < 60; attempt++) {
              const response = await fetch(endpoint, {headers: {Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json'}});
              if (!response.ok) throw Error('V142_CERTIFICATION_READ_' + response.status);
              const run = await response.json();
              if (run.head_sha !== process.env.CERTIFIED_SHA || run.path !== '.github/workflows/v142-mobile-web-research-recovery.yml') throw Error('V142_CERTIFICATION_IDENTITY_MISMATCH');
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') throw Error('V142_FULL_CERTIFICATION_REQUIRED:' + run.conclusion);
                console.log('EXACT_V142_FULL_CERTIFICATION_CONFIRMED'); return;
              }
              console.log('WAITING_FOR_EXACT_V142_CERTIFICATION', run.status);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw Error('V142_FULL_CERTIFICATION_NOT_FINISHED');
          })().catch(error => {console.error(error.message);process.exit(1)});
          NODE

      - name: Prepare exact Hosting release manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-platform-release.mjs
          test "$(jq -r '.git_sha' release-manifest.json)" = "$CERTIFIED_SHA"
          git diff --exit-code

      - name: Build isolated single-site Hosting config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('firebase.json','utf8'));
          const hosting = Array.isArray(source.hosting) ? source.hosting : [source.hosting].filter(Boolean);
          const selected = hosting.filter(item => item && item.site === process.env.FIREBASE_SITE_ID);
          if (selected.length !== 1) throw new Error('HOSTING_SITE_SELECTION_INVALID:' + selected.length);
          if (selected[0].target) throw new Error('HOSTING_TARGET_FORBIDDEN');
          fs.writeFileSync('.firebase-jarvis-v142-hosting-only.json', JSON.stringify({hosting:selected[0]}, null, 2));
          const isolated = JSON.parse(fs.readFileSync('.firebase-jarvis-v142-hosting-only.json','utf8'));
          if (isolated.functions || isolated.firestore || isolated.storage) throw new Error('NON_HOSTING_CONFIG_PRESENT');
          if (Array.isArray(isolated.hosting)) throw new Error('MULTISITE_CONFIG_PRESENT');
          if (isolated.hosting.site !== process.env.FIREBASE_SITE_ID) throw new Error('WRONG_HOSTING_SITE');
          console.log('JARVIS_V142_HOSTING_CONFIG_ISOLATED=true');
          NODE

      - name: Install pinned Firebase CLI
        run: npm install -g firebase-tools@15.10.1

      - name: Deploy ADJUNTO Hosting only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy             --config .firebase-jarvis-v142-hosting-only.json             --only hosting             --project "$FIREBASE_PROJECT_ID"             --token "$FIREBASE_TOKEN"             --non-interactive
          echo 'JARVIS_V142_HOSTING_ONLY_DEPLOYED=true'

      - name: Verify production serves local-only Jarvis bytes
        shell: bash
        run: |
          set -euo pipefail
          base="https://${FIREBASE_SITE_ID}.web.app"
          ok=false
          for attempt in $(seq 1 45); do
            curl --fail --silent --show-error --location "$base/modules/terminal/nexo-bootstrap.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/bootstrap.js || true
            curl --fail --silent --show-error --location "$base/gestia-core/jarvis/jarvis.multitool.pack.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/multitool.js || true
            curl --fail --silent --show-error --location "$base/gestia-core/jarvis/jarvis.conversation.composer.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/composer.js || true
            curl --fail --silent --show-error --location "$base/gestia-core/jarvis/jarvis.multifunction.planner.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/planner.js || true
            curl --fail --silent --show-error --location "$base/gestia-core/gestia-core.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/core.js || true
            curl --fail --silent --show-error --location "$base/gestia-core/tools.bridge.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/tools-bridge.js || true
            curl --fail --silent --show-error --location "$base/gestia-core/response.composer.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/response-composer.js || true
            curl --fail --silent --show-error --location "$base/modules/terminal/runtime-event-bus.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/runtime-event-bus.js || true
            curl --fail --silent --show-error --location "$base/modules/terminal/repo-cognition.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/repo-cognition.js || true
            curl --fail --silent --show-error --location "$base/modules/terminal/runtime-governance.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/runtime-governance.js || true
            curl --fail --silent --show-error --location "$base/modules/terminal/runtime-repair-health.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/runtime-repair-health.js || true
            curl --fail --silent --show-error --location "$base/modules/terminal/runtime-persistence.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/runtime-persistence.js || true
            curl --fail --silent --show-error --location "$base/modules/terminal/runtime-snapshot-daemon.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/runtime-snapshot-daemon.js || true
            curl --fail --silent --show-error --location "$base/gestia-core/jarvis/jarvis.memory.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/jarvis-memory.js || true
            curl --fail --silent --show-error --location "$base/gestia-core/jarvis/jarvis.semantic.memory.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/semantic-memory.js || true
            curl --fail --silent --show-error --location "$base/gestia-core/tools.runtime.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/tools-runtime.js || true
            curl --fail --silent --show-error --location "$base/gestia-core/operations-executor.engine.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/operations-executor.js || true
            curl --fail --silent --show-error --location "$base/crm.html?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/crm.html || true
            curl --fail --silent --show-error --location "$base/gestia-terminal.js?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/terminal-runtime.js || true
            curl --fail --silent --show-error --location "$base/gestia-terminal.html?sha=$CERTIFIED_SHA&attempt=$attempt" -o /tmp/terminal.html || true
            if grep -Fq '1.16.0-semantic-no-artificial-deadline' /tmp/bootstrap.js               && grep -Fq 'maximumAttempts = 3' /tmp/bootstrap.js               && grep -Fq 'JARVIS_LOCAL_BRIDGE_TRANSIENT_RETRY' /tmp/bootstrap.js               && grep -Fq 'LOCAL_SEMANTIC_RESPONSE_UNAVAILABLE' /tmp/multitool.js               && grep -Fq 'fallbackAllowed: false' /tmp/multitool.js               && grep -Fq 'Number(maxOutputTokens) <= 1200' /tmp/multitool.js               && grep -Fq 'const MAX_EVIDENCE_LENGTH = 8000' /tmp/composer.js               && grep -Fq 'payload?.candidates' /tmp/composer.js               && grep -Fq 'maxOutputTokens:' /tmp/core.js               && grep -Fq '256' /tmp/core.js               && grep -Fq 'DIRECT_CONVERSATION' /tmp/core.js               && grep -Fq 'const registeredCurrentTurnTools =' /tmp/core.js               && grep -Fq 'tool?.name === "conversation.respond"' /tmp/core.js               && grep -Fq 'allowCurrentTurnDelegationOnEmpty: true' /tmp/core.js               && grep -Fq 'conversationalGate: true' /tmp/core.js               && grep -Fq 'CURRENT_TURN_CONVERSATION_TOOL_EXECUTION' /tmp/core.js               && grep -Fq 'precomposedSemanticResponse:' /tmp/core.js               && grep -Fq 'SEMANTIC_PLANNER_DIRECT_RESPONSE' /tmp/multitool.js               && grep -Fq 'JARVIS_CONVERSATIONAL_RESPONSE' /tmp/response-composer.js               && grep -Fq 'response?.type === "JARVIS_CONVERSATIONAL_RESPONSE"' /tmp/response-composer.js               && grep -Fq 'toolCatalog: registeredCurrentTurnTools' /tmp/core.js               && grep -Fq 'attempt <= 2' /tmp/core.js               && grep -Fq 'SEMANTIC_CURRENT_TURN_COMPLETE' /tmp/planner.js               && grep -Fq 'allowCurrentTurnDelegationOnEmpty === true' /tmp/planner.js               && grep -Fq 'plan?.missionComplete === true' /tmp/planner.js               && grep -Fq 'maxOutputTokens:' /tmp/core.js               && grep -Fq '96' /tmp/core.js               && grep -Fq 'advisorySemanticContext:' /tmp/core.js               && grep -Fq 'compactJarvisSemanticMemoryForPlanner(' /tmp/core.js               && grep -Fq 'durableArchiveAppendOnly: true' /tmp/semantic-memory.js               && grep -Fq 'recallRelevant' /tmp/semantic-memory.js               && grep -Fq '1.2.0-semantic-repair-recall' /tmp/semantic-memory.js               && grep -Fq '"/memory/append"' /tmp/semantic-memory.js               && grep -Fq 'durableLessons:' /tmp/operations-executor.js               && grep -Fq 'recallRelevant' /tmp/operations-executor.js               && grep -Fq 'testWriteReceipts' /tmp/tools-runtime.js               && grep -Fq 'POST_WRITE_TEST_BRIDGE_REQUIRED' /tmp/tools-runtime.js               && grep -Fq 'requestIdleCallback' /tmp/runtime-event-bus.js               && grep -Fq 'gestiaBootLog?.(' /tmp/repo-cognition.js               && grep -Fq 'ON_DEMAND_NO_BACKGROUND_COGNITION' /tmp/runtime-governance.js               && grep -Fq 'executeRuntimePredictionAnalysis' /tmp/runtime-governance.js               && grep -Fq 'analyzeRuntimeRecoveryNeeds' /tmp/runtime-governance.js               && grep -Fq 'gestiaBootLog?.(' /tmp/runtime-governance.js               && grep -Fq 'gestiaBootLog?.(' /tmp/runtime-repair-health.js               && grep -Fq 'RUNTIME_SNAPSHOT_START' /tmp/runtime-persistence.js               && grep -Fq 'gestiaBootLog?.(' /tmp/runtime-persistence.js               && grep -Fq 'SNAPSHOT_DAEMON_BOOT' /tmp/runtime-snapshot-daemon.js               && grep -Fq 'gestiaBootLog?.(' /tmp/runtime-snapshot-daemon.js               && grep -Fq '[SNAPSHOT] Punto de control creado' /tmp/jarvis-memory.js               && grep -Fq 'gestiaBootLog?.(' /tmp/jarvis-memory.js               && grep -Fq 'COGNITIVE_RUNTIME_RESTORED' /tmp/terminal-runtime.js               && grep -Fq 'gestiaBootLog?.(' /tmp/terminal-runtime.js               && grep -Fq 'coreResult ||' /tmp/terminal.html               && grep -Fq 'conversationObservation &&' /tmp/terminal.html               && grep -Fq 'String(finalResponse.text).trim()' /tmp/terminal.html               && grep -Fq 'TERMINAL_LOCAL_SEMANTIC_AUTHORITY_UNAVAILABLE' /tmp/terminal.html               && grep -Fq 'actualizarPermisosPagoB2C' /tmp/crm.html               && ! grep -Fq 'updateDoc(doc(db, "users", uid), { efectivo_autorizado' /tmp/crm.html; then
              ok=true
              break
            fi
            sleep 5
          done
          test "$ok" = true
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('/tmp/multitool.js','utf8');
          const start = source.indexOf('async function fetchSemanticConversation(');
          const end = source.indexOf('\nfunction clean(', start);
          if (start < 0 || end <= start) throw new Error('DEPLOYED_SEMANTIC_BLOCK_MISSING');
          const block = source.slice(start,end);
          if (block.includes('jarvisSemanticRespond') || block.includes('cloudfunctions.net')) throw new Error('DEPLOYED_CLOUD_SEMANTIC_FALLBACK_PRESENT');
          console.log('JARVIS_V142_PRODUCTION_LOCAL_ONLY_VERIFIED=true');
          NODE

      - name: Verify exact published geometry and orchestration bytes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const hash = value => crypto.createHash('sha256').update(value).digest('hex');
          (async () => {
            const origin = 'https://' + process.env.FIREBASE_SITE_ID + '.web.app';
            const manifestResponse = await fetch(origin + '/release-manifest.json?sha=' + process.env.CERTIFIED_SHA);
            if (!manifestResponse.ok) throw Error('HOSTING_MANIFEST_UNAVAILABLE');
            const manifest = await manifestResponse.json();
            if (manifest.git_sha !== process.env.CERTIFIED_SHA) throw Error('HOSTING_MANIFEST_SHA_MISMATCH');
            for (const file of ["gestia-terminal.html","assets/gestia-terminal.tailwind.css","gestia-core/jarvis/jarvis.browser.grounding.js","gestia-core/jarvis/jarvis.mission.orchestrator.js","gestia-core/jarvis/jarvis.conversation.composer.js","gestia-core/jarvis/jarvis.mission.planner-state.js","gestia-core/jarvis/jarvis.actuator.pack.js","gestia-core/jarvis/jarvis.autopatch.engine.js","gestia-core/jarvis/jarvis.multifunction.planner.js","gestia-core/tools.runtime.js","gestia-core/gestia-core.js","modules/terminal/proposal-state.js"]) {
              const response = await fetch(origin + '/' + file + '?sha=' + process.env.CERTIFIED_SHA);
              if (!response.ok) throw Error('SERVED_FILE_UNAVAILABLE:' + file);
              const served = Buffer.from(await response.arrayBuffer());
              if (hash(served) !== hash(fs.readFileSync(file))) throw Error('SERVED_BYTES_MISMATCH:' + file);
              console.log('SERVED_BYTES_VERIFIED', file, hash(served));
            }
          })().catch(error => {console.error(error.message);process.exit(1)});
          NODE

name: ChatGPT focal certify v12

on:
  push:
    branches:
      - chatgpt/jarvis-v12-marketing-handoff

permissions:
  contents: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/jarvis-v12-marketing-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check gestia-core/jarvis/jarvis.mission.dependencies.js
          node --check gestia-core/jarvis/jarvis.marketing.presenter.js
          node --check gestia-core/jarvis/jarvis.reel.presenter.js
          node --check gestia-core/jarvis/jarvis.image.adapter.js
          node --check gestia-core/jarvis/jarvis.marketing.engine.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check gestia-core/jarvis/jarvis.actuator.pack.js
          node --check gestia-core/gestia-core.js
          node --check gestia-core/tools.runtime.js
      - name: Focal regression
        run: |
          node --test --test-concurrency=1 \
            tests/jarvis-marketing-handoff-v12.test.mjs \
            tests/jarvis-marketing-expansion-v12.test.mjs \
            tests/jarvis-marketing-artifact-uniqueness-v12.test.mjs \
            tests/jarvis-brand-logo-overlay-v12.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-actuator-pack.test.mjs \
            tests/jarvis-image-adapter.test.mjs \
            tests/v94-marketing-artifact-delivery.test.mjs
          git diff --check
      - name: Persist success receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/chatgpt-marketing-handoff-v12-certification.txt <<EOF
          CHATGPT_MARKETING_HANDOFF_V12_CERTIFIED=true
          source_sha=${GITHUB_SHA}
          workflow_run=${GITHUB_RUN_ID}
          syntax=pass
          focal_regression=pass
          official_brand_logo_overlay=pass
          unique_physical_artifacts=pass
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chatgpt-marketing-handoff-v12-certification.txt
          git commit -m "ci: certify marketing handoff v12"
          git pull --rebase origin chatgpt/jarvis-v12-marketing-handoff
          git push origin HEAD:chatgpt/jarvis-v12-marketing-handoff

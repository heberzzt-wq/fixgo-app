name: contract-audit handoff state

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/contract-audit-handoff-state.yml'

permissions:
  contents: write

concurrency:
  group: gemini-35-migration-v94
  cancel-in-progress: false

jobs:
  migrate-certify-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: v94-media-v4n-negative-claims

      - name: Assert migration trigger is isolated
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          git status --short

      - name: Patch Gemini runtime deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          runtime_files = [
              p for p in Path('functions').rglob('*')
              if p.is_file() and p.suffix in {'.js', '.cjs', '.mjs'}
          ]
          test_files = [
              p for p in Path('tests').rglob('*')
              if p.is_file() and p.suffix in {'.js', '.cjs', '.mjs'}
          ]

          for path in runtime_files + test_files:
              text = path.read_text(encoding='utf-8')
              updated = text.replace('gemini-3.6-flash', 'gemini-3.5-flash')
              updated = updated.replace('gemini-2.5-flash', 'gemini-3.5-flash')
              if path == Path('functions/index.js'):
                  updated = updated.replace('Gemini 2.5 Flash', 'Gemini 3.5 Flash')
                  updated = re.sub(r'(?m)^\s*temperature:\s*[^,\n]+,\n', '', updated)
              if path == Path('functions/jarvis-semantic-planner.js'):
                  updated = re.sub(r'(?m)^\s*temperature:\s*[^,\n]+,\n', '', updated)
                  updated = re.sub(r'thinkingBudget:\s*0', 'thinkingLevel: "MINIMAL"', updated)
                  updated = re.sub(r'thinkingBudget:\s*[1-9][0-9]*', 'thinkingLevel: "LOW"', updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          provider_path = Path('functions/jarvis-genai-provider-chain.js')
          provider = provider_path.read_text(encoding='utf-8')
          old_block = '''function sanitizeGenerateContentRequest(request) {
              const guardedRequest = applyFreshnessGuardToGroundedRequest(request);
              const sourceConfig = guardedRequest?.config && typeof guardedRequest.config === "object" ? guardedRequest.config : null;
              let sanitizedConfig = sourceConfig;
              if (sourceConfig && String(guardedRequest?.model || "").startsWith("gemini-3.")) {
                  const { temperature: _temperature, topP: _topP, topK: _topK, frequencyPenalty: _frequencyPenalty, presencePenalty: _presencePenalty, ...supported } = sourceConfig;
                  sanitizedConfig = supported;
              }
              const tools = sanitizedConfig?.tools;
              if (!Array.isArray(tools)) return sanitizedConfig === sourceConfig ? guardedRequest : { ...guardedRequest, config: sanitizedConfig };
              let changed = sanitizedConfig !== sourceConfig;
              const compactTools = tools.map(tool => {
                  const declarations = tool?.functionDeclarations;
                  if (!Array.isArray(declarations)) return tool;
                  changed = true;
                  return { ...tool, functionDeclarations: declarations.map(compactFunctionDeclaration) };
              });
              if (!changed) return guardedRequest;
              return { ...guardedRequest, config: { ...(sanitizedConfig || {}), tools: compactTools } };
          }
          '''
          new_block = '''function normalizeGeminiModel(model = "") {
              const value = String(model || "").trim();
              if (
                  value === "gemini-2.5-flash" ||
                  value === "gemini-3.6-flash"
              ) {
                  return "gemini-3.5-flash";
              }
              return value;
          }

          function sanitizeGenerateContentRequest(request) {
              const guardedRequest = applyFreshnessGuardToGroundedRequest(request);
              const normalizedModel = normalizeGeminiModel(guardedRequest?.model);
              const modelRequest =
                  normalizedModel && normalizedModel !== guardedRequest?.model
                      ? { ...guardedRequest, model: normalizedModel }
                      : guardedRequest;
              const sourceConfig = modelRequest?.config && typeof modelRequest.config === "object"
                  ? modelRequest.config
                  : null;
              let sanitizedConfig = sourceConfig;
              if (sourceConfig && String(modelRequest?.model || "").startsWith("gemini-3.")) {
                  const {
                      temperature: _temperature,
                      topP: _topP,
                      topK: _topK,
                      frequencyPenalty: _frequencyPenalty,
                      presencePenalty: _presencePenalty,
                      thinkingConfig: sourceThinkingConfig,
                      ...supported
                  } = sourceConfig;
                  let normalizedThinkingConfig = sourceThinkingConfig;
                  if (
                      sourceThinkingConfig &&
                      typeof sourceThinkingConfig === "object" &&
                      !Array.isArray(sourceThinkingConfig)
                  ) {
                      const {
                          thinkingBudget: legacyThinkingBudget,
                          ...thinkingConfigRest
                      } = sourceThinkingConfig;
                      normalizedThinkingConfig =
                          legacyThinkingBudget === undefined
                              ? sourceThinkingConfig
                              : {
                                  ...thinkingConfigRest,
                                  thinkingLevel:
                                      Number(legacyThinkingBudget) > 0
                                          ? "LOW"
                                          : "MINIMAL"
                              };
                  }
                  sanitizedConfig = {
                      ...supported,
                      ...(normalizedThinkingConfig
                          ? { thinkingConfig: normalizedThinkingConfig }
                          : {})
                  };
              }
              const tools = sanitizedConfig?.tools;
              if (!Array.isArray(tools)) {
                  return sanitizedConfig === sourceConfig
                      ? modelRequest
                      : { ...modelRequest, config: sanitizedConfig };
              }
              let changed =
                  sanitizedConfig !== sourceConfig ||
                  modelRequest !== guardedRequest;
              const compactTools = tools.map(tool => {
                  const declarations = tool?.functionDeclarations;
                  if (!Array.isArray(declarations)) return tool;
                  changed = true;
                  return { ...tool, functionDeclarations: declarations.map(compactFunctionDeclaration) };
              });
              if (!changed) return modelRequest;
              return { ...modelRequest, config: { ...(sanitizedConfig || {}), tools: compactTools } };
          }
          '''
          if old_block not in provider:
              raise SystemExit('EXPECTED_SANITIZER_BLOCK_NOT_FOUND')
          provider = provider.replace(old_block, new_block, 1)
          export_marker = '    normalizeProviders,\n    requestNeedsFreshness,'
          if export_marker not in provider:
              raise SystemExit('EXPECTED_PROVIDER_EXPORT_MARKER_NOT_FOUND')
          provider = provider.replace(
              export_marker,
              '    normalizeGeminiModel,\n    normalizeProviders,\n    requestNeedsFreshness,',
              1
          )
          provider_path.write_text(provider, encoding='utf-8')

          planner_test_path = Path('tests/jarvis-semantic-planner.test.cjs')
          planner_test = planner_test_path.read_text(encoding='utf-8')
          old_assert = '''                    assert.equal(
                              request.config.thinkingConfig
                                  .thinkingBudget,
                              0
                          );'''
          new_assert = '''                    assert.equal(
                              request.config.thinkingConfig
                                  .thinkingLevel,
                              "MINIMAL"
                          );'''
          if old_assert not in planner_test:
              compact_old = '''                    assert.equal(
                              request.config.thinkingConfig
                                  .thinkingBudget,
                              0
                          );'''
              if compact_old not in planner_test:
                  raise SystemExit('EXPECTED_SEMANTIC_THINKING_ASSERT_NOT_FOUND')
          planner_test = planner_test.replace(old_assert, new_assert, 1)
          planner_test_path.write_text(planner_test, encoding='utf-8')

          chain_test_path = Path('tests/jarvis-genai-provider-chain.test.cjs')
          chain_test = chain_test_path.read_text(encoding='utf-8')
          import_marker = '    normalizeProviders,\n    requestNeedsFreshness,'
          if import_marker not in chain_test:
              raise SystemExit('EXPECTED_CHAIN_TEST_IMPORT_MARKER_NOT_FOUND')
          chain_test = chain_test.replace(
              import_marker,
              '    normalizeGeminiModel,\n    normalizeProviders,\n    requestNeedsFreshness,',
              1
          )
          insertion_marker = 'test("provider chain falls back to JSON planning when Vertex rejects function schema state size", async () => {'
          if insertion_marker not in chain_test:
              raise SystemExit('EXPECTED_CHAIN_TEST_INSERTION_MARKER_NOT_FOUND')
          migration_test = r'''test("Gemini migration normalizes retired models, thinking config, and preserves thought signatures", () => {
              assert.equal(normalizeGeminiModel("gemini-2.5-flash"), "gemini-3.5-flash");
              assert.equal(normalizeGeminiModel("gemini-3.6-flash"), "gemini-3.5-flash");
              assert.equal(normalizeGeminiModel("gemini-3.5-flash"), "gemini-3.5-flash");

              const request = {
                  model: "gemini-3.6-flash",
                  contents: [{
                      role: "model",
                      parts: [{
                          thoughtSignature: "opaque-thought-signature",
                          functionCall: {
                              id: "call_1",
                              name: "jarvis_tool_0",
                              args: { query: "status" }
                          }
                      }]
                  }, {
                      role: "user",
                      parts: [{
                          functionResponse: {
                              id: "call_1",
                              name: "jarvis_tool_0",
                              response: { ok: true }
                          }
                      }]
                  }],
                  config: {
                      temperature: 0.2,
                      thinkingConfig: {
                          thinkingBudget: 0,
                          includeThoughts: true
                      }
                  }
              };

              const sanitized = sanitizeGenerateContentRequest(request);
              assert.equal(sanitized.model, "gemini-3.5-flash");
              assert.equal(sanitized.config.temperature, undefined);
              assert.equal(sanitized.config.thinkingConfig.thinkingBudget, undefined);
              assert.equal(sanitized.config.thinkingConfig.thinkingLevel, "MINIMAL");
              assert.equal(sanitized.config.thinkingConfig.includeThoughts, true);
              assert.equal(
                  sanitized.contents[0].parts[0].thoughtSignature,
                  "opaque-thought-signature"
              );
              assert.equal(
                  sanitized.contents[1].parts[0].functionResponse.id,
                  "call_1"
              );
          });

          '''
          chain_test = chain_test.replace(insertion_marker, migration_test + insertion_marker, 1)
          chain_test_path.write_text(chain_test, encoding='utf-8')

          # Runtime gates: only the compatibility normalizer may contain legacy model IDs.
          old_runtime_refs = []
          for path in runtime_files:
              text = path.read_text(encoding='utf-8')
              for legacy in ('gemini-2.5-flash', 'gemini-3.6-flash'):
                  if legacy in text and path != provider_path:
                      old_runtime_refs.append(f'{path}:{legacy}')
          if old_runtime_refs:
              raise SystemExit('LEGACY_RUNTIME_MODEL_REFERENCES=' + ','.join(old_runtime_refs))

          provider_text = provider_path.read_text(encoding='utf-8')
          if provider_text.count('gemini-2.5-flash') != 1 or provider_text.count('gemini-3.6-flash') != 1:
              raise SystemExit('COMPATIBILITY_MODEL_REFERENCE_COUNT_INVALID')

          planner_text = Path('functions/jarvis-semantic-planner.js').read_text(encoding='utf-8')
          if 'thinkingBudget:' in planner_text:
              raise SystemExit('LEGACY_THINKING_BUDGET_REMAINS_IN_PLANNER')
          if re.search(r'(?m)^\s*temperature:', planner_text):
              raise SystemExit('SAMPLING_TEMPERATURE_REMAINS_IN_PLANNER')

          print('GEMINI_MIGRATION_PATCH_OK')
          print('runtime_files_checked=', len(runtime_files))
          print('test_files_checked=', len(test_files))
          PY

      - name: Inspect function-calling continuity surface
        shell: bash
        run: |
          set -euo pipefail
          echo '--- native function-response / thought-signature references ---'
          grep -RInE --include='*.js' --include='*.cjs' --include='*.mjs' \
            'functionResponse|function_response|thoughtSignature|thought_signature' \
            functions tests || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Syntax gates
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/index.js
          node --check functions/jarvis-semantic-planner.js
          node --check functions/jarvis-genai-provider-chain.js

      - name: Targeted Gemini migration tests
        run: node --test tests/jarvis-semantic-planner.test.cjs tests/jarvis-genai-provider-chain.test.cjs

      - name: Full CI certification
        run: npm run ci:test

      - name: Restore helper workflow and commit certified source only
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD^ -- .github/workflows/contract-audit-handoff-state.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions tests .github/workflows/contract-audit-handoff-state.yml
          git diff --cached --check
          git commit -m 'fix(jarvis): migrate Gemini runtime to 3.5 Flash'
          git push origin HEAD:v94-media-v4n-negative-claims

name: contract-audit handoff state

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/contract-audit-handoff-state.yml'

permissions:
  contents: write

concurrency:
  group: v139-authenticated-planner-repair-v142
  cancel-in-progress: false

jobs:
  repair-certify-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v94-media-v4n-negative-claims

      - name: Patch existing V139 and SIA7 relay deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          v139_path = Path('.github/scripts/v139-canonical-real-reel.mjs')
          v139 = v139_path.read_text(encoding='utf-8')
          old_import = """const require = createRequire(import.meta.url);\nconst { runJarvisSemanticPlanner } = require('../../functions/jarvis-semantic-planner.js');\n"""
          new_import = """const require = createRequire(import.meta.url);\nconst functionsRequire = createRequire(new URL('../../functions/package.json', import.meta.url));\nconst { GoogleGenAI } = functionsRequire('@google/genai');\nconst functionsRuntime = functionsRequire('firebase-functions/v1');\nconst { runJarvisSemanticPlanner } = require('../../functions/jarvis-semantic-planner.js');\nconst { createJarvisGenAIProviderChain } = require('../../functions/jarvis-genai-provider-chain.js');\n"""
          if v139.count(old_import) != 1:
              raise SystemExit(f'V139_IMPORT_ANCHOR_COUNT={v139.count(old_import)}')
          v139 = v139.replace(old_import, new_import, 1)

          old_planner = """const canonicalSemanticPlanner = ({ input, catalog, missionState }) =>\n  runJarvisSemanticPlanner({\n    fetchImpl: fetch,\n    simpleFetchImpl: null,\n    input,\n    catalog,\n    missionState,\n    timeoutMs: 60000\n  });\n"""
          new_planner = """function createAuthenticatedPlannerAI() {\n  let runtimeConfig = {};\n  try { runtimeConfig = functionsRuntime.config?.() || {}; } catch {}\n  const apiKey = String(\n    process.env.GEMINI_KEY ||\n    process.env.GEMINI_API_KEY ||\n    runtimeConfig?.gemini?.key ||\n    runtimeConfig?.gemini?.api_key ||\n    runtimeConfig?.google?.gemini_key ||\n    ''\n  ).trim();\n  const providers = [];\n  if (apiKey) {\n    providers.push({ name: 'gemini-developer', ai: new GoogleGenAI({ apiKey }) });\n  }\n  providers.push({\n    name: 'vertex-adc',\n    ai: new GoogleGenAI({\n      vertexai: true,\n      project: process.env.GCLOUD_PROJECT || process.env.GOOGLE_CLOUD_PROJECT || 'fixgo-44e4d',\n      location: 'global',\n      apiVersion: 'v1'\n    })\n  });\n  return createJarvisGenAIProviderChain({ providers });\n}\n\nconst plannerAI = createAuthenticatedPlannerAI();\nconst canonicalSemanticPlanner = ({ input, catalog, missionState }) =>\n  runJarvisSemanticPlanner({\n    fetchImpl: fetch,\n    simpleFetchImpl: null,\n    ai: plannerAI,\n    input,\n    catalog,\n    missionState,\n    timeoutMs: 60000\n  });\n"""
          if v139.count(old_planner) != 1:
              raise SystemExit(f'V139_PLANNER_ANCHOR_COUNT={v139.count(old_planner)}')
          v139 = v139.replace(old_planner, new_planner, 1)
          v139_path.write_text(v139, encoding='utf-8')

          worker_path = Path('jarvis-github-worker.js')
          worker = worker_path.read_text(encoding='utf-8')
          old_headers = """    const response = await fetch(`${BRIDGE_URL}${endpoint}`, {\n        method,\n        headers:\n            method === \"POST\"\n                ? { \"content-type\": \"application/json\" }\n                : undefined,\n"""
          new_headers = """    const releaseId = JSON.parse(\n        fs.readFileSync(path.resolve(REPO_ROOT, \"jarvis-runtime-contract.json\"), \"utf8\")\n    ).releaseId;\n\n    const response = await fetch(`${BRIDGE_URL}${endpoint}`, {\n        method,\n        headers:\n            method === \"POST\"\n                ? {\n                    \"content-type\": \"application/json\",\n                    \"x-jarvis-release-id\": releaseId\n                }\n                : undefined,\n"""
          if worker.count(old_headers) != 1:
              raise SystemExit(f'WORKER_HEADER_ANCHOR_COUNT={worker.count(old_headers)}')
          worker = worker.replace(old_headers, new_headers, 1)
          worker_path.write_text(worker, encoding='utf-8')

          if 'ai: plannerAI' not in v139:
              raise SystemExit('V139_AUTHENTICATED_AI_INJECTION_MISSING')
          if 'x-jarvis-release-id' not in worker:
              raise SystemExit('SIA7_RELEASE_HEADER_MISSING')
          print('V139_AUTHENTICATED_PLANNER_PATCH_OK')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Syntax and focused gates
        run: |
          node --check .github/scripts/v139-canonical-real-reel.mjs
          node --check jarvis-github-worker.js
          node --check functions/jarvis-semantic-planner.js
          node --check functions/jarvis-genai-provider-chain.js
          npm run worker:smoke
          node --test tests/jarvis-semantic-planner.test.cjs tests/jarvis-genai-provider-chain.test.cjs

      - name: Full CI certification
        run: npm run ci:test

      - name: Restore helper workflow and commit repaired source only
        shell: bash
        run: |
          set -euo pipefail
          git checkout 3ae2c74a11536bebafaaa4246dbc3efbb6b26605 -- .github/workflows/contract-audit-handoff-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/v139-canonical-real-reel.mjs jarvis-github-worker.js .github/workflows/contract-audit-handoff-state.yml
          git diff --cached --check
          git status --short
          git commit -m 'fix(jarvis): inject authenticated planner into V139'
          git push origin HEAD:v94-media-v4n-negative-claims

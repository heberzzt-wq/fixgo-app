name: Jarvis V146 source freshness verification

on:
  pull_request:
    paths:
      - '.github/scripts/v146-source-freshness-verification.mjs'
      - '.github/workflows/v146-source-freshness-verification.yml'
      - 'tests/jarvis-source-freshness-verification-v146.test.cjs'
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/scripts/v146-source-freshness-verification.mjs'
      - '.github/workflows/v146-source-freshness-verification.yml'
      - 'tests/jarvis-source-freshness-verification-v146.test.cjs'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: v94-media-v4n-negative-claims

jobs:
  certify-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply deterministic V146 product patch
        run: node .github/scripts/v146-source-freshness-verification.mjs

      - name: Verify patched syntax
        run: |
          node --check functions/jarvis-genai-provider-chain.js
          node --check functions/jarvis-web-research.js

      - name: Run freshness and provider contracts
        run: |
          node --test \
            tests/jarvis-source-freshness-verification-v146.test.cjs \
            tests/jarvis-genai-provider-chain.test.cjs \
            tests/jarvis-genai-grounding-canonicalization.test.cjs

      - name: Guard exact product delta
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test -n "$changed"
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^(functions/jarvis-genai-provider-chain.js|functions/jarvis-web-research.js)$' || true)
          test -z "$unexpected"
          grep -Fq 'inspectGroundingFreshness' functions/jarvis-genai-provider-chain.js
          grep -Fq 'DIRECT_RESEARCH_STALE_OR_UNDATED_PAGE' functions/jarvis-web-research.js
          git diff --check

      - name: Materialize certified product bytes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/jarvis-genai-provider-chain.js functions/jarvis-web-research.js
          git commit -m 'fix(jarvis): verify source publication freshness'
          product_sha=$(git rev-parse HEAD)
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "V146_PRODUCT_SHA=$product_sha"

name: contract-audit provider outage

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/contract-audit-provider-outage.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 8de46c00565b041b006f6a33d81ff6c22a616846
  HANDOFF_PATCH_SHA256: 0b357d2cb607276cf9ec9b65a66a23caf05379cdaaab22972bc9764f9407a98a

jobs:
  audit-provider-outage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct certified product handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/contract-audit
          echo 'd1b2e6e6a64f07ba2a19ae6cb36fd5d67153007dd771ce92ed295043dee5feb9  .github/candidates/contract-audit/chunk-00.txt' | sha256sum -c -
          echo 'f001cb84b33961031a2f4f8936040082aa11666eae4828d8ca13b42d18f1c1ad  .github/candidates/contract-audit/chunk-01.txt' | sha256sum -c -
          echo 'fdcc344cb3759f40fa05c94b17371f9f7dd7b9690490ea81f3f9a00477ec8e68  .github/candidates/contract-audit/chunk-02.txt' | sha256sum -c -
          echo 'dc7fdf37fc8563028ca2003d0083d35a314c2ea4e250ed8ddf70e1e7325fb92c  .github/candidates/contract-audit/segment-05.txt' | sha256sum -c -
          echo 'e7941063664bde2f3336657250367fc9cc434d560f7f0353c0cf126e7ec6efee  .github/candidates/contract-audit/segment-06.txt' | sha256sum -c -
          echo '27a9be7862fda074c444dcee94d2e1b044cba215038102c1d90a69738d4ad556  .github/candidates/contract-audit/segment-07.txt' | sha256sum -c -
          echo 'd0461f8bccfcb757e522df0f7e51ff72e39fab493bd50490e13a81618a4376e6  .github/candidates/contract-audit/chunk-04.txt' | sha256sum -c -
          cat .github/candidates/contract-audit/chunk-00.txt .github/candidates/contract-audit/chunk-01.txt .github/candidates/contract-audit/chunk-02.txt .github/candidates/contract-audit/segment-05.txt .github/candidates/contract-audit/segment-06.txt .github/candidates/contract-audit/segment-07.txt .github/candidates/contract-audit/chunk-04.txt > /tmp/contract-audit/handoff.patch.gz.b64
          echo '07cadc45fbec00cb11b49682b8036a62c3c33cf9a1f2d669b1c9c1c30a73e258  /tmp/contract-audit/handoff.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/contract-audit/handoff.patch.gz.b64 | gzip -d > /tmp/contract-audit/handoff.patch
          echo "$HANDOFF_PATCH_SHA256  /tmp/contract-audit/handoff.patch" | sha256sum -c -
          git checkout --detach "$BASE_SHA"
          git apply --check /tmp/contract-audit/handoff.patch
          git apply /tmp/contract-audit/handoff.patch
          git diff --check
          echo 'HANDOFF_RECONSTRUCTED=true'

      - name: Reapply already-certified same-contract invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('gestia-core/response.composer.js')
          t = p.read_text()
          old = '''        !layers.some(layer => layer?.requirementsMet === false) &&
                  !layers.some(layer => layer?.readyForProduction === false) &&
                  (
                      explicitObjectiveSatisfied !== null
                          ? explicitObjectiveSatisfied
                          : true
                  );'''
          new = '''        !layers.some(layer => layer?.requirementsMet === false) &&
                  (
                      explicitObjectiveSatisfied !== null
                          ? explicitObjectiveSatisfied
                          : !layers.some(layer => layer?.readyForProduction === false)
                  );'''
          if old not in t: raise SystemExit('TARGET_SEMANTICS_BLOCK_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))

          p = Path('jarvis-speech-artifact.js')
          t = p.read_text()
          old = '''    const platform = options.platform || process.platform;
              if (platform !== "win32" && typeof options.synthesizeImpl !== "function") {
                  throw new Error("SPEECH_SYNTHESIS_PLATFORM_UNSUPPORTED");
              }
              const output = speechOutputPath(input.root || options.root || process.cwd(), input.output);'''
          new = '''    const output = speechOutputPath(input.root || options.root || process.cwd(), input.output);
              const platform = options.platform || process.platform;
              if (platform !== "win32" && typeof options.synthesizeImpl !== "function") {
                  throw new Error("SPEECH_SYNTHESIS_PLATFORM_UNSUPPORTED");
              }'''
          if old not in t: raise SystemExit('SPEECH_OUTPUT_VALIDATION_BOUNDARY_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))

          p = Path('tests/jarvis-real-media-reel-hydration-v127.test.mjs')
          t = p.read_text()
          old = '''    sourceUrl: "https://cdn.example/cover.jpg",
              sourceTag: "og:image",
              alt: "Imagen verificada"'''
          new = '''    sourceUrl: "https://cdn.example/cover.jpg",
              sourceTag: "og:image",
              sourceDeclared: true,
              alt: "Imagen verificada"'''
          if old not in t: raise SystemExit('V127_IMAGE_FIXTURE_NOT_FOUND')
          t = t.replace(old, new, 1)
          old = '''    sourceUrl: "https://cdn.example/source.mp4",
              sourceTag: "og:video"'''
          new = '''    sourceUrl: "https://cdn.example/source.mp4",
              sourceTag: "og:video",
              sourceDeclared: true'''
          if old not in t: raise SystemExit('V127_VIDEO_FIXTURE_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))

          p = Path('tests/nexo-real-media-semantic-binding-v131.test.mjs')
          t = p.read_text()
          old = '''    sourceUrl: "https://cdn.example/a.jpg",
              sourceTag: "og:image",
              mediaRole: "scene"'''
          new = '''    sourceUrl: "https://cdn.example/a.jpg",
              sourceTag: "og:image",
              sourceDeclared: true,
              mediaRole: "scene"'''
          if old not in t: raise SystemExit('V131_PROVENANCE_FIXTURE_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))

          p = Path('tests/jarvis-reel-media-source-recovery-v136.test.mjs')
          t = p.read_text()
          old = '''    assert.match(core, /jarvis\\.mission\\.orchestrator\\.js\\?v=v137-local-speech-synthesis-20260812/);'''
          new = '''    assert.match(core, /jarvis\\.mission\\.orchestrator\\.js["']/);
              assert.doesNotMatch(core, /jarvis\\.mission\\.orchestrator\\.js\\?v=v137-local-speech-synthesis-20260812/);'''
          if old not in t: raise SystemExit('V136_STALE_CACHE_ASSERTION_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))
          PY

      - name: Reapply certified complete production-chain invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gestia-core/jarvis/jarvis.multifunction.planner.js')
          t = p.read_text()
          old = 'Las HERRAMIENTAS_INICIALES son un borrador semantico ya seleccionado para la misma instruccion. Conserva sus entregables y agrega solamente una herramienta que cubra un objetivo independiente pedido de forma explicita y no cubierto por ese borrador. No agregues diagnostico, supervision, forense, repositorio, navegador, conectores, investigacion ni otros artefactos solo porque existan en el catalogo.'
          new = 'Las HERRAMIENTAS_INICIALES son un borrador semantico ya seleccionado para la misma instruccion. Conserva todos sus objetivos y entregables. Si un entregable explicito requiere una cadena de herramientas dependientes, agrega TODAS las herramientas necesarias para satisfacer ese mismo entregable; por ejemplo, cuando corresponda a una produccion real de reel incluye la cadena reel.plan, speech.synthesize si hay narracion o voz solicitada, y reel.create. La restriccion de no inventar objetivos nuevos se refiere a objetivos independientes, no a dependencias necesarias de ejecucion. No agregues diagnostico, supervision, forense, repositorio, navegador, conectores, investigacion ni otros artefactos solo porque existan en el catalogo.'
          if old not in t: raise SystemExit('INITIAL_TOOLS_SINGLE_TOOL_CONTRADICTION_NOT_FOUND')
          t = t.replace(old, new, 1)
          old = 'MARKETING: marketing.plan produce estrategia y brief, nunca cuenta como archivo producido. Decide semánticamente la solicitud actual: si el usuario sólo pide plan o asesoría, usa productionRequested=false. Si pide ejecutar, producir, entregar piezas reales o una misión de punta a punta, usa productionRequested=true y productionArtifacts con type, toolName exacto, format cuando corresponda y label humano; además incluye en toolCalls las herramientas reales de creación que satisfacen cada productionArtifact. Si un documento toma el plan como contenido usa document.create con contentSource=marketing.plan. No declares missionComplete mientras falte una salida verificable de cualquiera de los MARKETING_PRODUCTION_REQUIREMENTS.'
          new = 'MARKETING: marketing.plan produce estrategia y brief, nunca cuenta como archivo producido. Decide semánticamente la solicitud actual: si el usuario sólo pide plan o asesoría, usa productionRequested=false. Si pide ejecutar, producir, entregar piezas reales o una misión de punta a punta, usa productionRequested=true y productionArtifacts con type, toolName exacto, format cuando corresponda y label humano; además incluye en toolCalls TODA la cadena real de creación necesaria para satisfacer cada productionArtifact, no sólo el primer paso disponible. Para una producción real de reel o video, declara reel.create como productionArtifact y conserva sus dependencias de planificación, voz cuando haya narración solicitada y medios reales cuando la instrucción los exija. Si un documento toma el plan como contenido usa document.create con contentSource=marketing.plan. No declares missionComplete mientras falte una salida verificable de cualquiera de los MARKETING_PRODUCTION_REQUIREMENTS.'
          if old not in t: raise SystemExit('MARKETING_PRODUCTION_RULE_NOT_FOUND')
          p.write_text(t.replace(old, new, 1))
          PY

      - name: Harden current semantic authority against transient provider outages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          planner = Path('gestia-core/jarvis/jarvis.multifunction.planner.js')
          t = planner.read_text()

          anchor = '''async function callBrowserMissionContract(
    input = "",
    catalog = [],
    missionState = null
) {'''
          helper = '''function semanticProviderRetryableStatus(status = 0) {
    const value = Number(status || 0);
    return value === 429 || value >= 500;
}

function semanticProviderRetryDelayMs(response = null, attempt = 1) {
    const retryAfterSeconds = Number(response?.headers?.get?.("retry-after"));
    if (Number.isFinite(retryAfterSeconds) && retryAfterSeconds > 0) {
        return Math.min(retryAfterSeconds * 1000, 5000);
    }
    return Math.min(Math.max(Number(attempt) || 1, 1) * 750, 3000);
}

async function waitForSemanticProviderRetry(response = null, attempt = 1) {
    await new Promise(resolve =>
        setTimeout(resolve, semanticProviderRetryDelayMs(response, attempt))
    );
}

async function callBrowserMissionContract(
    input = "",
    catalog = [],
    missionState = null
) {'''
          if anchor not in t: raise SystemExit('BROWSER_MISSION_CONTRACT_ANCHOR_NOT_FOUND')
          t = t.replace(anchor, helper, 1)

          t, count = re.subn(
              r'''if \(!response\.ok\) \{\n\s+throw new Error\(\n\s+`CLIENT_MISSION_CONTRACT_HTTP_\$\{response\.status\}`\n\s+\);\n\s+\}''',
              '''if (!response.ok) {
                    if (semanticProviderRetryableStatus(response.status)) {
                        await waitForSemanticProviderRetry(response, seed - 83);
                    }
                    throw new Error(
                        `CLIENT_MISSION_CONTRACT_HTTP_${response.status}`
                    );
                }''',
              t,
              count=1
          )
          if count != 1: raise SystemExit('MISSION_CONTRACT_HTTP_RETRY_BLOCK_NOT_FOUND')

          t, count = re.subn(
              r'''if \(!response\.ok\) \{\n\s+throw new Error\(\n\s+`CLIENT_SEMANTIC_PLAN_HTTP_\$\{response\.status\}`\n\s+\);\n\s+\}''',
              '''if (!response.ok) {
                    if (semanticProviderRetryableStatus(response.status)) {
                        await waitForSemanticProviderRetry(response, seed - 41);
                    }
                    throw new Error(
                        `CLIENT_SEMANTIC_PLAN_HTTP_${response.status}`
                    );
                }''',
              t,
              count=1
          )
          if count != 1: raise SystemExit('BROWSER_SEMANTIC_HTTP_RETRY_BLOCK_NOT_FOUND')

          pattern = re.compile(r'''async function callSemanticPlanner\(input = "", catalog = \[\], missionState = null\) \{.*?\n\}\n\nfunction planCacheKey''', re.S)
          replacement = '''async function callSemanticPlanner(input = "", catalog = [], missionState = null) {
    const user = globalThis?.auth?.currentUser || globalThis?.window?.auth?.currentUser || null;
    if (!user) {
        throw new Error("SEMANTIC_PLANNER_AUTH_REQUIRED");
    }

    const token = await user.getIdToken();
    const timeoutMs =
        missionState?.phase === "MISSION_CONTRACT"
            ? CLOUD_MISSION_CONTRACT_TIMEOUT_MS
            : 110000;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    let lastError = null;

    try {
        for (let attempt = 1; attempt <= 3; attempt += 1) {
            const response = await fetch(ENDPOINT, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ data: { input, catalog, missionState } }),
                signal: controller.signal
            });
            const text = await response.text();
            let payload = null;
            try {
                payload = JSON.parse(text);
            } catch {
                payload = null;
            }
            const result = payload?.result || payload?.data;

            if (response.ok && result?.ok) {
                return result;
            }

            lastError = new Error(
                payload?.error?.message ||
                result?.error ||
                (payload ? `SEMANTIC_PLANNER_HTTP_${response.status}` : `SEMANTIC_PLANNER_INVALID_RESPONSE_${response.status}`)
            );

            if (
                semanticProviderRetryableStatus(response.status) &&
                attempt < 3
            ) {
                await waitForSemanticProviderRetry(response, attempt);
                continue;
            }
            throw lastError;
        }

        throw lastError || new Error("SEMANTIC_PLANNER_RETRY_EXHAUSTED");
    }
    catch(error) {
        if (controller.signal.aborted) {
            throw new Error(`SEMANTIC_PLANNER_TIMEOUT_${timeoutMs}`);
        }
        throw error;
    }
    finally {
        clearTimeout(timer);
    }
}

function planCacheKey'''
          t, count = pattern.subn(replacement, t, count=1)
          if count != 1: raise SystemExit('CLOUD_SEMANTIC_PLANNER_FUNCTION_NOT_FOUND')
          planner.write_text(t)

          core = Path('gestia-core/gestia-core.js')
          c = core.read_text()
          old = '''                return {
                    status:
                        "halted",
                    reason:
                        atomicState.haltReason
                };'''
          new = '''                return {
                    status:
                        "halted",
                    reason:
                        atomicState.haltReason,
                    result:
                        atomicState.agentResult ||
                        null,
                    finalResponse:
                        atomicState.agentResult?.finalResponse ||
                        null
                };'''
          if old not in c: raise SystemExit('GENERIC_HALT_ENVELOPE_NOT_FOUND')
          core.write_text(c.replace(old, new, 1))

          terminal = Path('gestia-terminal.html')
          h = terminal.read_text()
          anchor = '''            const shouldPreferAgentFinalResponse =
                typeof preferredAgentFinalResponse?.text === "string" &&
                preferredAgentFinalResponse.text.trim().length > 0;

            if (
                shouldPreferAgentFinalResponse
            ) {'''
          if anchor not in h: raise SystemExit('TERMINAL_PREFERRED_RESPONSE_ANCHOR_NOT_FOUND')
          # Insert the generic-envelope renderer after the existing diagnostic log block.
          marker = '''            const extractDiagnoseSummary =
    function(result = {}) {'''
          insert = '''            if (
                shouldPreferAgentFinalResponse &&
                coreResult?.type !== "AGENT_TOOL_RESULT"
            ) {
                activeWorkTracker?.complete(
                    "evidence",
                    "Resultado verificable integrado"
                );
                activeWorkTracker?.activate(
                    "response",
                    "Preparando la respuesta"
                );
                window.renderJarvisResponse?.(
                    preferredAgentFinalResponse?.title || "Jarvis",
                    preferredAgentFinalResponse.text,
                    preferredAgentFinalResponse?.ok === false
                        ? "warning"
                        : "info"
                );
                activeWorkTracker?.complete(
                    "response",
                    "Respuesta preparada"
                );
                activeWorkTracker?.finish(
                    preferredAgentFinalResponse?.ok === false
                        ? "Trabajo detenido con diagnóstico verificable"
                        : "Trabajo completado"
                );
                handled = true;
                return;
            }

            const extractDiagnoseSummary =
    function(result = {}) {'''
          if marker not in h: raise SystemExit('TERMINAL_DIAGNOSE_MARKER_NOT_FOUND')
          terminal.write_text(h.replace(marker, insert, 1))
          PY

          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/gestia-core.js
          python3 - <<'PY'
          from pathlib import Path
          planner = Path('gestia-core/jarvis/jarvis.multifunction.planner.js').read_text()
          core = Path('gestia-core/gestia-core.js').read_text()
          terminal = Path('gestia-terminal.html').read_text()
          assert 'semanticProviderRetryableStatus' in planner
          assert 'waitForSemanticProviderRetry' in planner
          assert 'attempt < 3' in planner
          assert 'atomicState.agentResult?.finalResponse' in core
          assert 'coreResult?.type !== "AGENT_TOOL_RESULT"' in terminal
          assert 'TERMINAL_CORE_RESPONSE_NOT_PRESENTED' in terminal
          assert '1.2.0-stable-research-objectives' in core
          print('TRANSIENT_PROVIDER_RETRY=true')
          print('FAIL_CLOSED_RESPONSE_PRESERVED=true')
          print('NO_NEW_BRAIN=true')
          print('NO_NEW_CONTRACT=true')
          print('NO_NEW_CONTRACT_VERSION=true')
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Focal provider-outage and contract regressions
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/provider-outage-regression.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { __test } from '${{ github.workspace }}/gestia-core/jarvis/jarvis.multifunction.planner.js';

          test('browser semantic fallback waits through a transient 429 and keeps the same planner', async () => {
            const originalFetch = globalThis.fetch;
            let attempts = 0;
            globalThis.fetch = async () => {
              attempts += 1;
              if (attempts === 1) {
                return {
                  ok: false,
                  status: 429,
                  headers: { get: () => null },
                  text: async () => ''
                };
              }
              return {
                ok: true,
                status: 200,
                headers: { get: () => null },
                text: async () => JSON.stringify({
                  toolCalls: [{ name: 'conversation.respond', args: { message: 'ok' } }],
                  missionComplete: false
                })
              };
            };
            try {
              const plan = await __test.callBrowserSemanticPlan(
                'responde esta instruccion',
                [{ name: 'conversation.respond' }],
                null
              );
              assert.equal(plan.ok, true);
              assert.equal(attempts, 2);
            } finally {
              globalThis.fetch = originalFetch;
            }
          });

          test('semantic fail-closed envelope survives GestiaCore and Terminal presents it', () => {
            const core = fs.readFileSync('${{ github.workspace }}/gestia-core/gestia-core.js', 'utf8');
            const terminal = fs.readFileSync('${{ github.workspace }}/gestia-terminal.html', 'utf8');
            assert.match(core, /finalResponse:\s*atomicState\.agentResult\?\.finalResponse/);
            assert.match(core, /SEMANTIC_PLANNER_NO_EXECUTABLE_PLAN/);
            assert.match(terminal, /coreResult\?\.type !== "AGENT_TOOL_RESULT"/);
            assert.match(terminal, /preferredAgentFinalResponse\.text/);
          });
          EOF
          node --test /tmp/provider-outage-regression.test.mjs
          node --test \
            tests/jarvis-mission-contract-accounting.test.mjs \
            tests/jarvis-reel-dependency-recovery-v140.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-single-contract-authority.test.mjs \
            tests/single-semantic-authority.test.mjs

      - name: Full CI once on final candidate
        run: npm run ci:test

      - name: Protected surface audit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" -- .)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(functions/|multiservicios-web/|.*Multiservicios)' ; then
            echo 'PROTECTED_SURFACE_TOUCHED=true' >&2
            exit 1
          fi
          git diff --check
          echo 'FUNCTIONS_UNTOUCHED=true'
          echo 'MULTISERVICIOS_UNTOUCHED=true'
          echo 'NO_DEPLOY=true'
          echo 'NO_NEW_BRAIN=true'
          echo 'NO_NEW_CONTRACT=true'
          echo 'NO_NEW_CONTRACT_VERSION=true'

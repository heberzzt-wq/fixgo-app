name: v138 reel mp4 audio diagnostic

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v138-reel-mp4-audio-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-audio-mp4:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard isolated branch and untouched Functions
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne 'v94-media-v4n-negative-claims') { throw 'WRONG_BRANCH' }
          git diff --quiet HEAD^ HEAD -- functions/
          if ($LASTEXITCODE -ne 0) { throw 'FUNCTIONS_CHANGED' }
      - name: Locate Chrome
        id: chrome
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw 'CHROME_NOT_FOUND' }
          "path=$chrome" >> $env:GITHUB_OUTPUT
          & $chrome --version
      - name: Record and replay H264 AAC MP4 with resumed AudioContext
        shell: pwsh
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          $html = @'
          <!doctype html><meta charset="utf-8"><body><pre id="result">PENDING</pre><canvas id="c" width="320" height="568"></canvas><script>
          (async()=>{
            const result=document.querySelector('#result'),canvas=document.querySelector('#c'),ctx=canvas.getContext('2d');
            const mime='video/mp4;codecs=avc1.42E01E,mp4a.40.2';
            if(!MediaRecorder.isTypeSupported(mime))throw new Error('MP4_AAC_NOT_SUPPORTED');
            const stream=canvas.captureStream(30),AudioCtor=window.AudioContext||window.webkitAudioContext,ac=new AudioCtor(),destination=ac.createMediaStreamDestination(),oscillator=ac.createOscillator(),gain=ac.createGain();
            oscillator.frequency.value=440;gain.gain.value=.08;oscillator.connect(gain);gain.connect(destination);
            const audioTrack=destination.stream.getAudioTracks()[0];if(!audioTrack)throw new Error('AUDIO_TRACK_MISSING');stream.addTrack(audioTrack);
            if(ac.state==='suspended')await ac.resume();
            const recorder=new MediaRecorder(stream,{mimeType:mime}),chunks=[];recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
            oscillator.start();recorder.start(100);
            const start=performance.now();while(performance.now()-start<1500){const t=(performance.now()-start)/1500;ctx.fillStyle=`rgb(${Math.floor(30+200*t)},50,130)`;ctx.fillRect(0,0,320,568);ctx.fillStyle='#fff';ctx.font='bold 32px sans-serif';ctx.fillText('ADJUNTO AUDIO',25,285);await new Promise(r=>setTimeout(r,30))}
            recorder.stop();oscillator.stop();await new Promise(resolve=>recorder.addEventListener('stop',resolve,{once:true}));
            const blob=new Blob(chunks,{type:recorder.mimeType||mime}),bytes=new Uint8Array(await blob.arrayBuffer()),ascii=Array.from(bytes).map(v=>v>=32&&v<=126?String.fromCharCode(v):'.').join('');
            const playback=document.createElement('video');playback.muted=true;playback.playsInline=true;playback.src=URL.createObjectURL(blob);document.body.appendChild(playback);
            await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('PLAYBACK_METADATA_TIMEOUT')),5000);playback.onloadedmetadata=()=>{clearTimeout(timer);resolve()};playback.onerror=()=>{clearTimeout(timer);reject(new Error('PLAYBACK_LOAD_FAILED'))}});
            await playback.play();await new Promise(r=>setTimeout(r,350));
            let playbackAudioTracks=-1;if(typeof playback.captureStream==='function'){playbackAudioTracks=playback.captureStream().getAudioTracks().length}
            const decodedAudioBytes=Number(playback.webkitAudioDecodedByteCount||0);
            const payload={actual:recorder.mimeType||'',bytes:blob.size,audioContextState:ac.state,inputAudioTracks:stream.getAudioTracks().length,hasFtyp:ascii.includes('ftyp'),hasAvc1:ascii.includes('avc1'),hasSoundHandler:ascii.includes('soun'),hasMp4a:ascii.includes('mp4a'),playbackDuration:Number(playback.duration||0),playbackAudioTracks,decodedAudioBytes};
            result.textContent='V138_AUDIO_RESULT='+JSON.stringify(payload);document.title='DONE';
            try{stream.getTracks().forEach(track=>track.stop());playback.pause();URL.revokeObjectURL(playback.src);await ac.close()}catch{}
          })().catch(error=>{document.querySelector('#result').textContent='V138_AUDIO_ERROR='+(error?.stack||error);document.title='ERROR'});
          </script></body>
          '@
          $probe = Join-Path $env:RUNNER_TEMP 'v138-audio-resume.html'
          $out = Join-Path $env:RUNNER_TEMP 'v138-audio-resume-dom.txt'
          Set-Content -LiteralPath $probe -Value $html -Encoding UTF8
          $uri = ([System.Uri]$probe).AbsoluteUri
          & $env:CHROME --headless=new --disable-gpu --disable-dev-shm-usage --autoplay-policy=no-user-gesture-required --virtual-time-budget=12000 --dump-dom $uri 2>$null | Set-Content -LiteralPath $out -Encoding UTF8
          $raw=Get-Content -Raw -LiteralPath $out
          $match=[regex]::Match($raw,'V138_AUDIO_RESULT=(\{.*?\})</pre>')
          if(-not $match.Success){Write-Host $raw;throw 'V138_AUDIO_RESULT_MISSING'}
          $json=[System.Net.WebUtility]::HtmlDecode($match.Groups[1].Value);Write-Host "V138_AUDIO_RESULT=$json";$data=$json|ConvertFrom-Json
          if([int64]$data.bytes -le 0 -or -not $data.hasFtyp -or -not $data.hasAvc1){throw 'V138_MP4_VIDEO_INVALID'}
          $audioProven = (($data.hasSoundHandler -and $data.hasMp4a) -or [int]$data.playbackAudioTracks -gt 0 -or [int64]$data.decodedAudioBytes -gt 0)
          if(-not $audioProven){throw 'V138_MP4_AUDIO_NOT_PROVEN'}
          Write-Host 'V138_NATIVE_MP4_WITH_AUDIO_FEASIBLE=true'

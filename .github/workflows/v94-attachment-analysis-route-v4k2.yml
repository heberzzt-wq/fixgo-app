name: V94 attachment analysis route v4k2

on:
  push:
    branches:
      - v94-handoff-ee6d8cfe
    paths:
      - .github/workflows/v94-attachment-analysis-route-v4k2.yml

permissions:
  contents: write

jobs:
  repair-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated V94 handoff
        uses: actions/checkout@v4
        with:
          ref: v94-handoff-ee6d8cfe
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Apply refined deterministic attachment route repair
        run: python3 .github/scripts/v94-attachment-analysis-route-v4k2.py

      - name: Diff integrity
        run: |
          git diff --check
          git status --short

      - name: Focused planner and multimodal regressions
        run: |
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --test tests/jarvis-multifunction-tools.test.mjs tests/jarvis-mission-orchestrator.test.mjs tests/jarvis-conversation-composer.test.mjs
          npm run check:nexo:contracts

      - name: Full CI
        run: npm run ci:test

      - name: Commit certified source repair
        run: |
          git config user.name "OpenAI V94 Handoff"
          git config user.email "actions@users.noreply.github.com"
          git add gestia-core/jarvis/jarvis.multifunction.planner.js tests/jarvis-multifunction-tools.test.mjs
          git diff --cached --quiet && { echo "Expected refined attachment route repair produced no source diff"; exit 1; }
          git commit -m "[v94-route-v4k2] fix(jarvis): isolate pure attachment analysis from stale tools"
          git push origin HEAD:v94-handoff-ee6d8cfe
          echo "PATCH_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.10.1

      - name: Deploy only primary Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          test -n "$FIREBASE_TOKEN"
          firebase deploy --only hosting:fixgo-44e4d --project fixgo-44e4d --token "$FIREBASE_TOKEN" --non-interactive
          echo "V94_ATTACHMENT_ROUTE_V4K2_DEPLOYED=${PATCH_HEAD}"

      - name: Verify deployed planner bytes and route markers
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-all-errors \
            "https://fixgo-44e4d.web.app/gestia-core/jarvis/jarvis.multifunction.planner.js?v=v94-route-${PATCH_HEAD}" \
            -o /tmp/planner.js
          cmp gestia-core/jarvis/jarvis.multifunction.planner.js /tmp/planner.js
          grep -q '4.15.0-attachment-analysis-route' /tmp/planner.js
          grep -q 'ATTACHMENT_ANALYSIS_ROUTE_ENFORCED' /tmp/planner.js
          grep -q 'requestsAdditionalDeliverableBeyondAttachmentAnalysis' /tmp/planner.js
          if grep -q '\.test(' /tmp/planner.js; then
            echo 'FORBIDDEN_PHRASE_GATE_TEST_CALL_FOUND' >&2
            exit 1
          fi
          echo "V94_ATTACHMENT_ANALYSIS_ROUTE_V4K2_PRODUCTION=PASS"

name: V94 v119 focused diagnostic

on:
  push:
    branches: [v94-media-v4n-negative-claims]
    paths: [.github/workflows/v94-v119-diagnostic.yml]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/jarvis-current-turn-freshness-v119.test.mjs
          - tests/jarvis-page-request-contract-v118.test.mjs
          - tests/jarvis-generalist-current-turn.test.mjs
          - tests/jarvis-semantic-memory-integrity.test.mjs
          - tests/jarvis-page-artifact.test.mjs
          - tests/jarvis-page-browser-fallback-v115.test.mjs
          - tests/jarvis-live-human-reds-v113.test.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Guard isolated branch and Functions
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          git diff --quiet fc021b3112542dbcdb9d236a17e0b71ee547463b HEAD -- functions
      - name: Install
        run: npm ci
      - name: Apply v119
        run: python scripts/v119-current-turn-freshness-fix.py
      - name: Run focused test
        run: node --test "${{ matrix.test }}"
      - name: Recheck Functions untouched
        if: always()
        run: git diff --quiet fc021b3112542dbcdb9d236a17e0b71ee547463b HEAD -- functions

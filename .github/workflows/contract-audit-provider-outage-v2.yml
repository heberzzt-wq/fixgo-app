name: contract-audit provider outage v2

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/contract-audit-provider-outage-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 8de46c00565b041b006f6a33d81ff6c22a616846
  HANDOFF_PATCH_SHA256: 0b357d2cb607276cf9ec9b65a66a23caf05379cdaaab22972bc9764f9407a98a

jobs:
  audit-provider-outage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct product handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/contract-audit
          cat \
            .github/candidates/contract-audit/chunk-00.txt \
            .github/candidates/contract-audit/chunk-01.txt \
            .github/candidates/contract-audit/chunk-02.txt \
            .github/candidates/contract-audit/segment-05.txt \
            .github/candidates/contract-audit/segment-06.txt \
            .github/candidates/contract-audit/segment-07.txt \
            .github/candidates/contract-audit/chunk-04.txt \
            > /tmp/contract-audit/handoff.patch.gz.b64
          echo '07cadc45fbec00cb11b49682b8036a62c3c33cf9a1f2d669b1c9c1c30a73e258  /tmp/contract-audit/handoff.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/contract-audit/handoff.patch.gz.b64 | gzip -d > /tmp/contract-audit/handoff.patch
          echo "$HANDOFF_PATCH_SHA256  /tmp/contract-audit/handoff.patch" | sha256sum -c -
          git checkout --detach "$BASE_SHA"
          git apply --check /tmp/contract-audit/handoff.patch
          git apply /tmp/contract-audit/handoff.patch
          git diff --check

      - name: Apply certified invariants and provider-outage fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(label)
              p.write_text(text.replace(old, new, 1))

          old = "\n".join([
              "        !layers.some(layer => layer?.requirementsMet === false) &&",
              "                  !layers.some(layer => layer?.readyForProduction === false) &&",
              "                  (",
              "                      explicitObjectiveSatisfied !== null",
              "                          ? explicitObjectiveSatisfied",
              "                          : true",
              "                  );",
          ])
          new = "\n".join([
              "        !layers.some(layer => layer?.requirementsMet === false) &&",
              "                  (",
              "                      explicitObjectiveSatisfied !== null",
              "                          ? explicitObjectiveSatisfied",
              "                          : !layers.some(layer => layer?.readyForProduction === false)",
              "                  );",
          ])
          replace_once('gestia-core/response.composer.js', old, new, 'TARGET_SEMANTICS_BLOCK_NOT_FOUND')

          old = "\n".join([
              "    const platform = options.platform || process.platform;",
              "              if (platform !== \"win32\" && typeof options.synthesizeImpl !== \"function\") {",
              "                  throw new Error(\"SPEECH_SYNTHESIS_PLATFORM_UNSUPPORTED\");",
              "              }",
              "              const output = speechOutputPath(input.root || options.root || process.cwd(), input.output);",
          ])
          new = "\n".join([
              "    const output = speechOutputPath(input.root || options.root || process.cwd(), input.output);",
              "              const platform = options.platform || process.platform;",
              "              if (platform !== \"win32\" && typeof options.synthesizeImpl !== \"function\") {",
              "                  throw new Error(\"SPEECH_SYNTHESIS_PLATFORM_UNSUPPORTED\");",
              "              }",
          ])
          replace_once('jarvis-speech-artifact.js', old, new, 'SPEECH_OUTPUT_VALIDATION_BOUNDARY_NOT_FOUND')

          replace_once(
              'tests/jarvis-real-media-reel-hydration-v127.test.mjs',
              '    sourceUrl: "https://cdn.example/cover.jpg",\n              sourceTag: "og:image",\n              alt: "Imagen verificada"',
              '    sourceUrl: "https://cdn.example/cover.jpg",\n              sourceTag: "og:image",\n              sourceDeclared: true,\n              alt: "Imagen verificada"',
              'V127_IMAGE_FIXTURE_NOT_FOUND'
          )
          replace_once(
              'tests/jarvis-real-media-reel-hydration-v127.test.mjs',
              '    sourceUrl: "https://cdn.example/source.mp4",\n              sourceTag: "og:video"',
              '    sourceUrl: "https://cdn.example/source.mp4",\n              sourceTag: "og:video",\n              sourceDeclared: true',
              'V127_VIDEO_FIXTURE_NOT_FOUND'
          )
          replace_once(
              'tests/nexo-real-media-semantic-binding-v131.test.mjs',
              '    sourceUrl: "https://cdn.example/a.jpg",\n              sourceTag: "og:image",\n              mediaRole: "scene"',
              '    sourceUrl: "https://cdn.example/a.jpg",\n              sourceTag: "og:image",\n              sourceDeclared: true,\n              mediaRole: "scene"',
              'V131_PROVENANCE_FIXTURE_NOT_FOUND'
          )
          replace_once(
              'tests/jarvis-reel-media-source-recovery-v136.test.mjs',
              '    assert.match(core, /jarvis\\.mission\\.orchestrator\\.js\\?v=v137-local-speech-synthesis-20260812/);',
              '    assert.match(core, /jarvis\\.mission\\.orchestrator\\.js["\\\']/);\n              assert.doesNotMatch(core, /jarvis\\.mission\\.orchestrator\\.js\\?v=v137-local-speech-synthesis-20260812/);',
              'V136_STALE_CACHE_ASSERTION_NOT_FOUND'
          )

          planner_path = Path('gestia-core/jarvis/jarvis.multifunction.planner.js')
          planner = planner_path.read_text()
          old_initial = 'Las HERRAMIENTAS_INICIALES son un borrador semantico ya seleccionado para la misma instruccion. Conserva sus entregables y agrega solamente una herramienta que cubra un objetivo independiente pedido de forma explicita y no cubierto por ese borrador. No agregues diagnostico, supervision, forense, repositorio, navegador, conectores, investigacion ni otros artefactos solo porque existan en el catalogo.'
          new_initial = 'Las HERRAMIENTAS_INICIALES son un borrador semantico ya seleccionado para la misma instruccion. Conserva todos sus objetivos y entregables. Si un entregable explicito requiere una cadena de herramientas dependientes, agrega TODAS las herramientas necesarias para satisfacer ese mismo entregable; por ejemplo, cuando corresponda a una produccion real de reel incluye la cadena reel.plan, speech.synthesize si hay narracion o voz solicitada, y reel.create. La restriccion de no inventar objetivos nuevos se refiere a objetivos independientes, no a dependencias necesarias de ejecucion. No agregues diagnostico, supervision, forense, repositorio, navegador, conectores, investigacion ni otros artefactos solo porque existan en el catalogo.'
          if old_initial not in planner:
              raise SystemExit('INITIAL_TOOLS_SINGLE_TOOL_CONTRADICTION_NOT_FOUND')
          planner = planner.replace(old_initial, new_initial, 1)
          old_marketing = 'MARKETING: marketing.plan produce estrategia y brief, nunca cuenta como archivo producido. Decide semánticamente la solicitud actual: si el usuario sólo pide plan o asesoría, usa productionRequested=false. Si pide ejecutar, producir, entregar piezas reales o una misión de punta a punta, usa productionRequested=true y productionArtifacts con type, toolName exacto, format cuando corresponda y label humano; además incluye en toolCalls las herramientas reales de creación que satisfacen cada productionArtifact. Si un documento toma el plan como contenido usa document.create con contentSource=marketing.plan. No declares missionComplete mientras falte una salida verificable de cualquiera de los MARKETING_PRODUCTION_REQUIREMENTS.'
          new_marketing = 'MARKETING: marketing.plan produce estrategia y brief, nunca cuenta como archivo producido. Decide semánticamente la solicitud actual: si el usuario sólo pide plan o asesoría, usa productionRequested=false. Si pide ejecutar, producir, entregar piezas reales o una misión de punta a punta, usa productionRequested=true y productionArtifacts con type, toolName exacto, format cuando corresponda y label humano; además incluye en toolCalls TODA la cadena real de creación necesaria para satisfacer cada productionArtifact, no sólo el primer paso disponible. Para una producción real de reel o video, declara reel.create como productionArtifact y conserva sus dependencias de planificación, voz cuando haya narración solicitada y medios reales cuando la instrucción los exija. Si un documento toma el plan como contenido usa document.create con contentSource=marketing.plan. No declares missionComplete mientras falte una salida verificable de cualquiera de los MARKETING_PRODUCTION_REQUIREMENTS.'
          if old_marketing not in planner:
              raise SystemExit('MARKETING_PRODUCTION_RULE_NOT_FOUND')
          planner = planner.replace(old_marketing, new_marketing, 1)

          anchor = "\n".join([
              'async function callBrowserMissionContract(',
              '    input = "",',
              '    catalog = [],',
              '    missionState = null',
              ') {',
          ])
          helper = "\n".join([
              'function semanticProviderRetryableStatus(status = 0) {',
              '    const value = Number(status || 0);',
              '    return value === 429 || value >= 500;',
              '}',
              '',
              'function semanticProviderRetryDelayMs(response = null, attempt = 1) {',
              '    const retryAfterSeconds = Number(response?.headers?.get?.("retry-after"));',
              '    if (Number.isFinite(retryAfterSeconds) && retryAfterSeconds > 0) {',
              '        return Math.min(retryAfterSeconds * 1000, 5000);',
              '    }',
              '    return Math.min(Math.max(Number(attempt) || 1, 1) * 750, 3000);',
              '}',
              '',
              'async function waitForSemanticProviderRetry(response = null, attempt = 1) {',
              '    await new Promise(resolve =>',
              '        setTimeout(resolve, semanticProviderRetryDelayMs(response, attempt))',
              '    );',
              '}',
              '',
              'async function callBrowserMissionContract(',
              '    input = "",',
              '    catalog = [],',
              '    missionState = null',
              ') {',
          ])
          if anchor not in planner:
              raise SystemExit('BROWSER_MISSION_CONTRACT_ANCHOR_NOT_FOUND')
          planner = planner.replace(anchor, helper, 1)

          mission_http = "\n".join([
              '                if (!response.ok) {',
              '                    throw new Error(',
              '                        `CLIENT_MISSION_CONTRACT_HTTP_${response.status}`',
              '                    );',
              '                }',
          ])
          mission_http_new = "\n".join([
              '                if (!response.ok) {',
              '                    if (semanticProviderRetryableStatus(response.status)) {',
              '                        await waitForSemanticProviderRetry(response, seed - 83);',
              '                    }',
              '                    throw new Error(',
              '                        `CLIENT_MISSION_CONTRACT_HTTP_${response.status}`',
              '                    );',
              '                }',
          ])
          if mission_http not in planner:
              raise SystemExit('MISSION_CONTRACT_HTTP_RETRY_BLOCK_NOT_FOUND')
          planner = planner.replace(mission_http, mission_http_new, 1)

          semantic_http = "\n".join([
              '                if (!response.ok) {',
              '                    throw new Error(',
              '                        `CLIENT_SEMANTIC_PLAN_HTTP_${response.status}`',
              '                    );',
              '                }',
          ])
          semantic_http_new = "\n".join([
              '                if (!response.ok) {',
              '                    if (semanticProviderRetryableStatus(response.status)) {',
              '                        await waitForSemanticProviderRetry(response, seed - 41);',
              '                    }',
              '                    throw new Error(',
              '                        `CLIENT_SEMANTIC_PLAN_HTTP_${response.status}`',
              '                    );',
              '                }',
          ])
          if semantic_http not in planner:
              raise SystemExit('BROWSER_SEMANTIC_HTTP_RETRY_BLOCK_NOT_FOUND')
          planner = planner.replace(semantic_http, semantic_http_new, 1)

          cloud_pattern = re.compile(r'async function callSemanticPlanner\(input = "", catalog = \[\], missionState = null\) \{.*?\n\}\n\nfunction planCacheKey', re.S)
          cloud_lines = [
              'async function callSemanticPlanner(input = "", catalog = [], missionState = null) {',
              '    const user = globalThis?.auth?.currentUser || globalThis?.window?.auth?.currentUser || null;',
              '    if (!user) throw new Error("SEMANTIC_PLANNER_AUTH_REQUIRED");',
              '    const token = await user.getIdToken();',
              '    const timeoutMs = missionState?.phase === "MISSION_CONTRACT" ? CLOUD_MISSION_CONTRACT_TIMEOUT_MS : 110000;',
              '    const controller = new AbortController();',
              '    const timer = setTimeout(() => controller.abort(), timeoutMs);',
              '    let lastError = null;',
              '    try {',
              '        for (let attempt = 1; attempt <= 3; attempt += 1) {',
              '            const response = await fetch(ENDPOINT, {',
              '                method: "POST",',
              '                headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },',
              '                body: JSON.stringify({ data: { input, catalog, missionState } }),',
              '                signal: controller.signal',
              '            });',
              '            const text = await response.text();',
              '            let payload = null;',
              '            try { payload = JSON.parse(text); } catch { payload = null; }',
              '            const result = payload?.result || payload?.data;',
              '            if (response.ok && result?.ok) return result;',
              '            lastError = new Error(payload?.error?.message || result?.error || (payload ? `SEMANTIC_PLANNER_HTTP_${response.status}` : `SEMANTIC_PLANNER_INVALID_RESPONSE_${response.status}`));',
              '            if (semanticProviderRetryableStatus(response.status) && attempt < 3) {',
              '                await waitForSemanticProviderRetry(response, attempt);',
              '                continue;',
              '            }',
              '            throw lastError;',
              '        }',
              '        throw lastError || new Error("SEMANTIC_PLANNER_RETRY_EXHAUSTED");',
              '    } catch (error) {',
              '        if (controller.signal.aborted) throw new Error(`SEMANTIC_PLANNER_TIMEOUT_${timeoutMs}`);',
              '        throw error;',
              '    } finally {',
              '        clearTimeout(timer);',
              '    }',
              '}',
              '',
              'function planCacheKey',
          ]
          planner, count = cloud_pattern.subn("\n".join(cloud_lines), planner, count=1)
          if count != 1:
              raise SystemExit('CLOUD_SEMANTIC_PLANNER_FUNCTION_NOT_FOUND')
          planner_path.write_text(planner)

          core_path = Path('gestia-core/gestia-core.js')
          core = core_path.read_text()
          old_halt = "\n".join([
              '                return {',
              '                    status:',
              '                        "halted",',
              '                    reason:',
              '                        atomicState.haltReason',
              '                };',
          ])
          new_halt = "\n".join([
              '                return {',
              '                    status:',
              '                        "halted",',
              '                    reason:',
              '                        atomicState.haltReason,',
              '                    result:',
              '                        atomicState.agentResult ||',
              '                        null,',
              '                    finalResponse:',
              '                        atomicState.agentResult?.finalResponse ||',
              '                        null',
              '                };',
          ])
          if old_halt not in core:
              raise SystemExit('GENERIC_HALT_ENVELOPE_NOT_FOUND')
          core_path.write_text(core.replace(old_halt, new_halt, 1))

          terminal_path = Path('gestia-terminal.html')
          terminal = terminal_path.read_text()
          marker = "\n".join([
              '            const extractDiagnoseSummary =',
              '    function(result = {}) {',
          ])
          renderer = "\n".join([
              '            if (',
              '                shouldPreferAgentFinalResponse &&',
              '                coreResult?.type !== "AGENT_TOOL_RESULT"',
              '            ) {',
              '                activeWorkTracker?.complete("evidence", "Resultado verificable integrado");',
              '                activeWorkTracker?.activate("response", "Preparando la respuesta");',
              '                window.renderJarvisResponse?.(',
              '                    preferredAgentFinalResponse?.title || "Jarvis",',
              '                    preferredAgentFinalResponse.text,',
              '                    preferredAgentFinalResponse?.ok === false ? "warning" : "info"',
              '                );',
              '                activeWorkTracker?.complete("response", "Respuesta preparada");',
              '                activeWorkTracker?.finish(preferredAgentFinalResponse?.ok === false ? "Trabajo detenido con diagnóstico verificable" : "Trabajo completado");',
              '                handled = true;',
              '                return;',
              '            }',
              '',
              '            const extractDiagnoseSummary =',
              '    function(result = {}) {',
          ])
          if marker not in terminal:
              raise SystemExit('TERMINAL_DIAGNOSE_MARKER_NOT_FOUND')
          terminal_path.write_text(terminal.replace(marker, renderer, 1))
          PY
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/gestia-core.js
          git diff --check

      - name: Static authority and outage assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          planner = Path('gestia-core/jarvis/jarvis.multifunction.planner.js').read_text()
          core = Path('gestia-core/gestia-core.js').read_text()
          terminal = Path('gestia-terminal.html').read_text()
          assert 'semanticProviderRetryableStatus' in planner
          assert 'attempt <= 3' in planner
          assert 'agrega TODAS las herramientas necesarias' in planner
          assert 'agrega solamente una herramienta' not in planner
          assert 'finalResponse:\n                        atomicState.agentResult?.finalResponse' in core
          assert 'coreResult?.type !== "AGENT_TOOL_RESULT"' in terminal
          assert '1.2.0-stable-research-objectives' in core
          print('TRANSIENT_PROVIDER_RETRY=true')
          print('FAIL_CLOSED_RESPONSE_PRESERVED=true')
          print('NO_NEW_BRAIN=true')
          print('NO_NEW_CONTRACT=true')
          print('NO_NEW_CONTRACT_VERSION=true')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Focal regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/jarvis-mission-contract-accounting.test.mjs \
            tests/jarvis-reel-dependency-recovery-v140.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs \
            tests/jarvis-single-contract-authority.test.mjs \
            tests/single-semantic-authority.test.mjs

      - name: Full CI once
        run: npm run ci:test

      - name: Protected surface audit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" -- .)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(functions/|multiservicios-web/|.*Multiservicios)' ; then
            echo 'PROTECTED_SURFACE_TOUCHED=true' >&2
            exit 1
          fi
          git diff --check
          echo 'FUNCTIONS_UNTOUCHED=true'
          echo 'MULTISERVICIOS_UNTOUCHED=true'
          echo 'NO_DEPLOY=true'
          echo 'NO_NEW_BRAIN=true'
          echo 'NO_NEW_CONTRACT=true'
          echo 'NO_NEW_CONTRACT_VERSION=true'

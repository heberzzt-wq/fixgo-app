name: V94 V126 Marketing actuator bridge

on:
  push:
    branches: [v94-media-v4n-negative-claims]
    paths:
      - '.github/workflows/v94-v126-marketing-actuator-bridge.yml'

permissions:
  contents: write

jobs:
  certify-v126:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Guard isolated branch and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "f3fa8e1806b681e860875afd4ce8183d27864873"
          test "$(git ls-remote origin refs/heads/v5.9-polish | cut -f1)" = "2ae85e670505c5d425a5a0334e99c45168054bb8"
          if git diff --name-only 48d39848179af2650ba77d11cf434e6605ffa2c2...HEAD | grep -q '^functions/'; then
            echo 'Functions diff detected before v126 patch' >&2
            exit 1
          fi

      - name: Apply v126 product patch
        shell: python
        run: |
          from pathlib import Path

          pack = Path('gestia-core/jarvis/jarvis.multitool.pack.js')
          text = pack.read_text(encoding='utf-8')

          old_map = '''const MARKETING_PRODUCTION_TOOL_TYPES = Object.freeze({
              "document.create": "document",
              "page.create": "page",
              "image.generate": "image",
              "image.edit": "image",
              "reel.create": "reel",
              "marketing.package.real-media": "campaign_package"
          });'''
          new_map = old_map + '''\n\nconst MARKETING_PLANNING_TO_PRODUCTION_TOOL = Object.freeze({
              "page.plan": "page.create",
              "image.plan": "image.generate",
              "reel.plan": "reel.create"
          });'''
          if old_map not in text:
              raise SystemExit('MARKETING_PRODUCTION_TOOL_TYPES anchor not found')
          text = text.replace(old_map, new_map, 1)

          declared_anchor = '    const declaredArtifacts =\n'
          if declared_anchor not in text:
              raise SystemExit('declaredArtifacts anchor not found')
          planned_block = '''    const plannedProductionToolNames =
              [...new Set(
                  requiredToolNames
                      .map(name => MARKETING_PLANNING_TO_PRODUCTION_TOOL[name])
                      .filter(Boolean)
              )];
          '''
          text = text.replace(declared_anchor, planned_block + declared_anchor, 1)

          semantic_anchor = '''    const semanticProductionRequested =
              current.productionRequested === true;
          '''
          if semantic_anchor not in text:
              raise SystemExit('semanticProductionRequested anchor not found')
          effective_block = semantic_anchor + '''    const effectiveProductionToolNames =
              [...new Set([
                  ...contractedProductionToolNames,
                  ...(semanticProductionRequested
                      ? plannedProductionToolNames
                      : [])
              ])];
          '''
          text = text.replace(semantic_anchor, effective_block, 1)

          if 'contractedProductionToolNames.length > 0' not in text:
              raise SystemExit('productionRequested force anchor not found')
          text = text.replace(
              'contractedProductionToolNames.length > 0',
              'effectiveProductionToolNames.length > 0',
              1
          )
          if 'contractedProductionToolNames.map(toolName => ({' not in text:
              raise SystemExit('productionArtifacts derivation anchor not found')
          text = text.replace(
              'contractedProductionToolNames.map(toolName => ({',
              'effectiveProductionToolNames.map(toolName => ({',
              1
          )
          text = text.replace(
              '1.53.0-marketing-production-intent-v125',
              '1.54.0-marketing-actuator-bridge-v126'
          )
          pack.write_text(text, encoding='utf-8')

          old_token = 'v94-marketing-production-intent-v125-20260810'
          new_token = 'v94-marketing-actuator-bridge-v126-20260810'
          old_version = '1.53.0-marketing-production-intent-v125'
          new_version = '1.54.0-marketing-actuator-bridge-v126'
          for root in [Path('gestia-core'), Path('tests'), Path('gestia-terminal.html')]:
              paths = [root] if root.is_file() else list(root.rglob('*'))
              for path in paths:
                  if not path.is_file() or 'functions' in path.parts:
                      continue
                  try:
                      src = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  dst = src.replace(old_token, new_token).replace(old_version, new_version)
                  if dst != src:
                      path.write_text(dst, encoding='utf-8')

          Path('tests/jarvis-marketing-actuator-bridge-v126.test.mjs').write_text('''import assert from "node:assert/strict";\nimport { test } from "node:test";\n\nimport { resolveMarketingMissionProductionScope } from "../gestia-core/jarvis/jarvis.multitool.pack.js";\n\ntest("production intent promotes a planned reel to the real reel actuator", () => {\n  const result = resolveMarketingMissionProductionScope(\n    { productionRequested: true, productionArtifacts: [] },\n    { requiredToolNames: ["web.research", "marketing.plan", "reel.plan"] }\n  );\n  assert.equal(result.productionRequested, true);\n  assert.deepEqual(result.productionArtifacts.map(item => item.toolName), ["reel.create"]);\n});\n\ntest("planning-only reel requests remain planning-only", () => {\n  const result = resolveMarketingMissionProductionScope(\n    { productionRequested: false, productionArtifacts: [] },\n    { requiredToolNames: ["web.research", "marketing.plan", "reel.plan"] }\n  );\n  assert.equal(result.productionRequested, false);\n  assert.deepEqual(result.productionArtifacts, []);\n});\n\ntest("explicit semantic artifacts remain authoritative over derived actuators", () => {\n  const result = resolveMarketingMissionProductionScope(\n    { productionRequested: true, productionArtifacts: [{ id: "custom", type: "reel", toolName: "reel.create", label: "Reel final" }] },\n    { requiredToolNames: ["marketing.plan", "reel.plan"] }\n  );\n  assert.deepEqual(result.productionArtifacts.map(item => item.id), ["custom"]);\n});\n''', encoding='utf-8')

      - name: Prove Functions untouched after patch
        shell: bash
        run: |
          set -euo pipefail
          if git status --short | grep -E '(^| )functions/'; then
            echo 'Functions source changed by v126 patch' >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run focal v126 regression
        shell: bash
        run: |
          set -o pipefail
          node --test tests/jarvis-marketing-production-intent-v125.test.mjs tests/jarvis-marketing-actuator-bridge-v126.test.mjs tests/jarvis-multifunction-tools.test.mjs tests/jarvis-semantic-memory-integrity.test.mjs 2>&1 | tee v126-focal.log

      - name: Run full CI
        shell: bash
        run: |
          set -o pipefail
          npm run ci:test 2>&1 | tee v126-full-ci.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v126-marketing-actuator-bridge-diagnostic
          path: |
            v126-focal.log
            v126-full-ci.log
          if-no-files-found: ignore

      - name: Commit certified product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'heberzzt-wq'
          git config user.email 'heberzzt@gmail.com'
          git add gestia-core gestia-terminal.html tests
          if git diff --cached --name-only | grep -q '^functions/'; then
            echo 'Functions staged unexpectedly' >&2
            exit 1
          fi
          git commit -m '[v94] fix(adj): promote marketing plans to real actuators v126'
          git push origin HEAD:v94-media-v4n-negative-claims
          echo "V126_PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "V126_PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Remove temporary certification workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v94-v126-marketing-actuator-bridge.yml
          git commit -m '[v126] chore(ci): remove temporary certification workflow'
          git push origin HEAD:v94-media-v4n-negative-claims

      - name: Final protected refs and no-Functions proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "f3fa8e1806b681e860875afd4ce8183d27864873"
          test "$(git ls-remote origin refs/heads/v5.9-polish | cut -f1)" = "2ae85e670505c5d425a5a0334e99c45168054bb8"
          if git diff --name-only 48d39848179af2650ba77d11cf434e6605ffa2c2...HEAD | grep -q '^functions/'; then
            echo 'Functions diff detected in final v126 branch' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD^{tree})" = "$V126_PRODUCT_TREE"
          echo "V126_CERTIFIED_PRODUCT_SHA=$V126_PRODUCT_SHA"
          echo 'V126_FUNCTIONS_UNCHANGED=true'

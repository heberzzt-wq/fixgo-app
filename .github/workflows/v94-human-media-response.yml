name: V94 human multimodal response surface

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-human-media-response.yml

permissions:
  contents: write

jobs:
  certify-deploy-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Verify certified parent ancestry
        run: git merge-base --is-ancestor 8bc88ecb3986f43ec2be8db4f767e448c61c2d5d HEAD

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Patch human multimodal response surface
        run: python3 tools/v94_human_media_response_patch.py

      - name: Verify focused syntax and regressions
        run: |
          node --check gestia-core/jarvis/jarvis.conversation.composer.js
          node --test tests/jarvis-conversation-composer.test.mjs
          git diff --check

      - name: Run complete CI contract
        run: npm run ci:test

      - name: Commit certified patch and remove temporary tooling
        run: |
          git config user.name "OpenAI V94 Handoff"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v94-human-media-response.yml tools/v94_human_media_response_patch.py
          git add gestia-terminal.html gestia-core/jarvis/jarvis.conversation.composer.js tests/jarvis-conversation-composer.test.mjs
          git commit -m "[v94-media-v4n] feat(jarvis): present multimodal results conversationally"
          git push origin HEAD:v94-media-v4n-negative-claims

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.10.1

      - name: Deploy primary Hosting only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          test -n "$FIREBASE_TOKEN"
          firebase deploy --only hosting:fixgo-44e4d --project fixgo-44e4d --token "$FIREBASE_TOKEN" --non-interactive

      - name: Verify production bytes exactly
        run: |
          ok=0
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location "https://fixgo-44e4d.web.app/gestia-terminal.html?v=human-media-$attempt" -o /tmp/live-terminal.html
            curl --fail --silent --show-error --location "https://fixgo-44e4d.web.app/gestia-core/jarvis/jarvis.conversation.composer.js?v=human-media-$attempt" -o /tmp/live-composer.js
            if cmp -s gestia-terminal.html /tmp/live-terminal.html && cmp -s gestia-core/jarvis/jarvis.conversation.composer.js /tmp/live-composer.js; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = "1"
          sha256sum gestia-terminal.html /tmp/live-terminal.html gestia-core/jarvis/jarvis.conversation.composer.js /tmp/live-composer.js

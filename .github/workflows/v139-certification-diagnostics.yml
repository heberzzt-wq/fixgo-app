name: v139 certification diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-materialized-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Guard branch and Functions unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          ! git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817..HEAD | grep -E '^functions/'
      - name: Verify materialized v139 fixes read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          multi = Path('tests/jarvis-multifunction-tools.test.mjs').read_text()
          stale_v115 = 'v94-page-browser-fallback-v115-20260809'
          if stale_v115 in multi:
              raise SystemExit('V139_STALE_V115_ASSERTION_PRESENT')

          memory = Path('tests/jarvis-semantic-memory-integrity.test.mjs').read_text()
          stale_v126 = 'tools.runtime.js?v=v94-marketing-actuator-bridge-v126-20260810'
          if stale_v126 in memory:
              raise SystemExit('V139_STALE_V126_ASSERTION_PRESENT')

          reel = Path('jarvis-reel-artifact.js').read_text()
          required = (
              'const semanticText = [',
              '!/\\bTODO\\b/i.test(semanticText)',
              '!/Lorem ipsum/i.test(semanticText)',
          )
          missing = [item for item in required if item not in reel]
          if missing:
              raise SystemExit('V139_REEL_POST_VERIFY_NOT_MATERIALIZED:' + ','.join(missing))

          print('V139_MATERIALIZED_FIXES_VERIFIED=true')
          PY
          git diff --exit-code
          git diff --check
      - name: Regression test for binary TODO false positive
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { buildReelStudioHtml, describeReelStudio } from './jarvis-reel-artifact.js';
          const input={brandName:'Taquería El Dorado',title:'Reel real',cta:'Ven por los tuyos',durationSeconds:30,scenes:[
            {durationSeconds:10,overlay:'Uno',subtitle:'Sabor real',visualDescription:'Video real',assetDataUrl:'data:video/mp4;base64,TODO',mediaType:'video'},
            {durationSeconds:10,overlay:'Dos',subtitle:'Preparación',visualDescription:'Continuación'},
            {durationSeconds:10,overlay:'Tres',subtitle:'Cierre',visualDescription:'Mejor encuadre'}
          ]};
          const html=buildReelStudioHtml(input); const report=describeReelStudio(input,html);
          if (!html.includes('TODO')) throw new Error('V139_BINARY_TODO_FIXTURE_MISSING');
          if (report.checks.noPlaceholders !== true) throw new Error('V139_BINARY_TODO_FALSE_POSITIVE_NOT_FIXED');
          console.log('V139_BINARY_TODO_FALSE_POSITIVE_FIXED=true');
          NODE
      - name: Focused tests
        run: node --test tests/jarvis-reel-artifact.test.mjs tests/jarvis-multifunction-tools.test.mjs tests/jarvis-semantic-memory-integrity.test.mjs tests/repo-authority-v2.test.cjs
      - name: Full CI
        run: npm run ci:test
      - name: Linux certification marker
        run: |
          echo 'V139_FUNCTIONS_UNCHANGED=true'
          echo 'V139_MATERIALIZED_FIXES_VERIFIED=true'
          echo 'V139_FOCUSED_GREEN=true'
          echo 'V139_FULL_CI_GREEN=true'

  windows-canonical-reel:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Guard branch and Functions unchanged
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne 'v94-media-v4n-negative-claims') { throw 'WRONG_BRANCH' }
          $changed = git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817..HEAD
          if ($changed -match '^functions/') { throw 'FUNCTIONS_CHANGED' }
      - name: Verify reel fix materialized read-only
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          reel = Path('jarvis-reel-artifact.js').read_text()
          required = (
              'const semanticText = [',
              '!/\\bTODO\\b/i.test(semanticText)',
              '!/Lorem ipsum/i.test(semanticText)',
          )
          missing = [item for item in required if item not in reel]
          if missing:
              raise SystemExit('V139_REEL_POST_VERIFY_NOT_MATERIALIZED:' + ','.join(missing))
          print('V139_REEL_POST_VERIFY_MATERIALIZED=true')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "V139_READ_ONLY_VERIFY_FAILED:$LASTEXITCODE" }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'V139_WORKTREE_MUTATED_DURING_VERIFY' }
      - name: Start bridge and execute exact canonical mission
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'v139-bridge.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'v139-bridge.stderr.log'
          $process = Start-Process -FilePath node -ArgumentList 'jarvis-fs-bridge.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              $probe = Test-NetConnection -ComputerName 127.0.0.1 -Port 3344 -WarningAction SilentlyContinue
              if ($probe.TcpTestSucceeded) { $ready = $true; break }
              if ($process.HasExited) { break }
            }
            if (-not $ready) {
              Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
              throw 'V139_LOCAL_BRIDGE_NOT_READY'
            }
            Write-Host "V139_BRIDGE_PID=$($process.Id)"
            & node '.github/scripts/v139-canonical-real-reel.mjs'
            if ($LASTEXITCODE -ne 0) { throw "V139_CANONICAL_MISSION_FAILED:$LASTEXITCODE" }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue | Select-Object -Last 120
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue | Select-Object -Last 120
          }
      - name: Windows certification marker
        run: |
          echo V139_CANONICAL_REAL_REEL_E2E_GREEN=true

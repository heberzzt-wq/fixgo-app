name: V139 browser media release-skew fix

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v139-browser-media-release-skew-fix.yml'

permissions:
  contents: write

env:
  TARGET_BRANCH: v94-media-v4n-negative-claims

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Guard branch and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test -z "$(git diff --name-only HEAD^..HEAD | grep -E '^(functions/|multiservicios-web/)' || true)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize browser media-only release-skew compatibility
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/v139_patch.py
          python /tmp/v139_patch.py

      - name: Syntax and media fallback regression
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/tools.runtime.js
          node --test \
            tests/jarvis-v139-browser-media-release-skew.test.mjs \
            tests/jarvis-v139-release-skew-safe-artifacts.test.mjs \
            tests/nexo-browser-media-fallback-v135.test.mjs \
            tests/jarvis-reel-media-source-recovery-v136.test.mjs

      - name: Full CI
        run: npm run ci:test

      - name: Guard protected surfaces after patch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only | grep -E '^(functions/|multiservicios-web/)' || true)"
          git diff --check

      - name: Commit fix and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v139-browser-media-release-skew-fix.yml
          git add gestia-core/tools.runtime.js tests/jarvis-v139-browser-media-release-skew.test.mjs
          git commit -m "fix(v139): allow release-skew browser media fallback"
          git push origin HEAD:"$TARGET_BRANCH"

name: contract-audit mission-contract authority closeout

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/contract-audit-mission-contract-authority-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLOW_V2_CARRIER_SHA: 8ef564d954de07a3b63d8a117ada4c2bcf40e3b4
  FINAL_V3_CARRIER_SHA: 71e4b1f847640dd9d3d9b142b0158073f5451336
  FINAL_V2_CARRIER_SHA: 21d1fc513d7817e7bfd9913ec113bd7923f3bb10
  FAILED_FINAL_CARRIER_SHA: b6dd83bc03bebc8cc66b790a38404fa48db3f395
  V3_CARRIER_SHA: e32b68752e452ef1d4f3eb6ba8fa375cce5787ab
  PRIOR_V2_CARRIER_SHA: 1892d5f7726ce41402600d49b22fb1cf62e830fb
  PRIOR_CARRIER_SHA: 2a51c1c349edac309465a22fd73c5b157dbaccd9
  BASE_SHA: 8de46c00565b041b006f6a33d81ff6c22a616846
  HANDOFF_PATCH_SHA256: 0b357d2cb607276cf9ec9b65a66a23caf05379cdaaab22972bc9764f9407a98a
  CERTIFIED_CARRIER_SHA: cebe6f399d4edf4f234e584e0a42cf980b3a404d
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  certify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct certified mission-flow v2 candidate
        shell: bash
        run: |
          set -euo pipefail
          git show "${FLOW_V2_CARRIER_SHA}:.github/workflows/contract-audit-mission-flow-closeout-v2.yml" > /tmp/flow-v2.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/flow-v2.yml').read_text()
          pairs=[
            ('Reconstruct certified final-v3 candidate','Preserve complete semantic mission flow','/tmp/authority-reconstruct.sh'),
            ('Preserve complete semantic mission flow','Install dependencies','/tmp/authority-flow.sh')
          ]
          for a,b,out in pairs:
              s=text.index(f'      - name: {a}\n')
              rs=text.index('        run: |\n',s)+len('        run: |\n')
              e=text.index(f'\n      - name: {b}\n',rs)
              lines=[]
              for line in text[rs:e].splitlines():
                  if line.startswith('          '): lines.append(line[10:])
                  elif not line.strip(): lines.append('')
                  else: raise SystemExit(f'EXTRACT_INDENT:{a}:{line!r}')
              Path(out).write_text('\n'.join(lines)+'\n')
          PY
          bash /tmp/authority-reconstruct.sh
          bash /tmp/authority-flow.sh
          echo 'CERTIFIED_MISSION_FLOW_V2_RECONSTRUCTED=true'

      - name: Restore cloud audited contract authority and semantic close gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('gestia-core/jarvis/jarvis.multifunction.planner.js')
          t=p.read_text()
          old='''async function callMissionContractCoverageAuthority(input = "", catalog = [], missionState = null) {
              try {
                  return await callBrowserMissionContract(
                      input,
                      catalog,
                      missionState
                  );
              }
              catch (error) {
                  throw new Error(
                      `MISSION_CONTRACT_CLIENT_COVERAGE_REQUIRED_${error?.message || "UNAVAILABLE"}`
                  );
              }
          }

          '''
          new='''async function callMissionContractCoverageAuthority(input = "", catalog = [], missionState = null) {
              let cloudError = null;
              try {
                  return await callSemanticPlanner(
                      input,
                      catalog,
                      missionState
                  );
              }
              catch (error) {
                  cloudError = error;
              }

              try {
                  const browserPlan = await callBrowserMissionContract(
                      input,
                      catalog,
                      missionState
                  );
                  return {
                      ...browserPlan,
                      recoveredFromCloudError:
                          cloudError?.message ||
                          "SEMANTIC_PLANNER_UNAVAILABLE"
                  };
              }
              catch (browserError) {
                  throw new Error(
                      `MISSION_CONTRACT_COVERAGE_UNAVAILABLE_CLOUD_${cloudError?.message || "FAILED"}__BROWSER_${browserError?.message || "FAILED"}`
                  );
              }
          }

          '''
          if old not in t:
              raise SystemExit('FLOW_V2_AUTHORITY_HELPER_NOT_FOUND')
          t=t.replace(old,new,1)
          p.write_text(t)

          p=Path('gestia-core/gestia-core.js')
          t=p.read_text()
          old='''    } catch (contractError) {
        console.warn("[MISSION_CONTRACT_RECOVERED_FROM_INITIAL_PLAN]", contractError);
        const allowedMissionTools = new Set(missionToolCatalog.map(tool => tool.name));
        missionContractToolCalls = operationalInitialToolCalls.filter(
            call => allowedMissionTools.has(call?.name)
        );
        if (missionContractToolCalls.length === 0) throw contractError;
    }
'''
          new='''    } catch (contractError) {
        console.error("[MISSION_CONTRACT_UNAVAILABLE]", contractError);
        throw contractError;
    }
'''
          if old not in t:
              raise SystemExit('INITIAL_PLAN_RECOVERY_BLOCK_NOT_FOUND')
          t=t.replace(old,new,1)
          p.write_text(t)

          p=Path('gestia-core/jarvis/jarvis.mission.orchestrator.js')
          t=p.read_text()
          old='''                const verifiedContractSatisfied =
                    contractSatisfied &&
                    mission.requiredToolNames.length > 0 &&
                    mission.completedTasks.length > 0;
                mission.reason = (
                    plan?.missionComplete === true ||
                    verifiedContractSatisfied
                ) && contractSatisfied
                    ? mission.blockedTasks.length > 0
                        ? "PARTIAL_CAPABILITY_BLOCKED"
                        : "ALL_EXECUTABLE_TASKS_COMPLETED"
                    : contractSatisfied
                        ? "PLANNER_NO_EXECUTABLE_PLAN"
                        : "MISSION_CONTRACT_INCOMPLETE";
'''
          new='''                mission.reason =
                    plan?.missionComplete === true &&
                    contractSatisfied
                        ? mission.blockedTasks.length > 0
                            ? "PARTIAL_CAPABILITY_BLOCKED"
                            : "ALL_EXECUTABLE_TASKS_COMPLETED"
                        : contractSatisfied
                            ? "SEMANTIC_COMPLETION_AUDIT_REQUIRED"
                            : "MISSION_CONTRACT_INCOMPLETE";
'''
          if old not in t:
              raise SystemExit('VERIFIED_CONTRACT_SHORTCUT_NOT_FOUND')
          t=t.replace(old,new,1)
          p.write_text(t)

          test=Path('tests/jarvis-mission-contract-authority-closeout.test.mjs')
          test.write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { __test as plannerTest } from '../gestia-core/jarvis/jarvis.multifunction.planner.js';
          import { runJarvisMission } from '../gestia-core/jarvis/jarvis.mission.orchestrator.js';

          const exact='https://www.tiktok.com/@taqueria.eldorado/video/7629216747131850004';

          function jsonResponse(status, body){
            return {
              ok:status>=200 && status<300,
              status,
              headers:{get(){return null;}},
              async text(){return JSON.stringify(body);}
            };
          }

          test('MISSION_CONTRACT uses the audited cloud planner before browser fallback',async()=>{
            const oldAuth=globalThis.auth;
            const oldFetch=globalThis.fetch;
            const urls=[];
            globalThis.auth={currentUser:{async getIdToken(){return 'token';}}};
            globalThis.fetch=async url=>{
              urls.push(String(url));
              assert.match(String(url),/jarvisSemanticPlan/);
              return jsonResponse(200,{result:{
                ok:true,
                status:'SEMANTIC_PLAN_READY',
                provider:'vertex-adc',
                model:'gemini-2.5-flash',
                planKind:'MISSION_CONTRACT_AUDITED',
                missionComplete:false,
                toolCalls:[
                  {name:'web.research',args:{query:'Taquería El Dorado Cancún',researchGoal:'RESEARCH_1'}},
                  {name:'web.media.collect',args:{url:exact}},
                  {name:'marketing.plan',args:{productionRequested:false}}
                ]
              }});
            };
            try{
              const plan=await plannerTest.callMissionContractCoverageAuthority(
                'Investiga la publicación exacta y después crea una propuesta de marketing basada únicamente en hechos verificados.',
                [],
                {phase:'MISSION_CONTRACT',existingInitialTools:['web.research']}
              );
              assert.deepEqual(plan.toolCalls.map(x=>x.name),['web.research','web.media.collect','marketing.plan']);
              assert.equal(urls.length,1);
              assert.equal(urls.some(url=>url.includes('text.pollinations.ai')),false);
            } finally {
              globalThis.auth=oldAuth;
              globalThis.fetch=oldFetch;
            }
          });

          test('browser planner is only fallback when audited cloud planner is unavailable',async()=>{
            const oldAuth=globalThis.auth;
            const oldFetch=globalThis.fetch;
            let cloudCalls=0;
            let browserCalls=0;
            globalThis.auth={currentUser:{async getIdToken(){return 'token';}}};
            globalThis.fetch=async url=>{
              const value=String(url);
              if(value.includes('jarvisSemanticPlan')){
                cloudCalls+=1;
                return jsonResponse(400,{error:{message:'cloud unavailable'}});
              }
              if(value.includes('text.pollinations.ai')){
                browserCalls+=1;
                if(browserCalls===1){
                  return jsonResponse(200,{
                    toolCalls:[
                      {name:'web.research',args:{query:'Taquería El Dorado Cancún',researchGoal:'RESEARCH_1'}},
                      {name:'web.media.collect',args:{url:exact}},
                      {name:'marketing.plan',args:{productionRequested:false}}
                    ],
                    missionComplete:false
                  });
                }
                return jsonResponse(200,{toolCalls:[],missionComplete:false});
              }
              throw new Error(`UNEXPECTED_URL:${value}`);
            };
            const catalog=[
              {name:'web.research',inputSchema:{type:'object',required:['query','researchGoal'],properties:{query:{type:'string'},researchGoal:{type:'string'}}}},
              {name:'web.media.collect',inputSchema:{type:'object',properties:{url:{type:'string'}}}},
              {name:'marketing.plan',inputSchema:{type:'object',properties:{productionRequested:{type:'boolean'}}}}
            ];
            try{
              const plan=await plannerTest.callMissionContractCoverageAuthority(
                'Investiga la publicación exacta y crea una propuesta de marketing.',
                catalog,
                {phase:'MISSION_CONTRACT',existingInitialTools:['web.research']}
              );
              assert.equal(cloudCalls,1);
              assert.equal(browserCalls,2);
              assert.deepEqual(plan.toolCalls.map(x=>x.name),['web.research','web.media.collect','marketing.plan']);
              assert.match(plan.recoveredFromCloudError,/cloud unavailable/i);
            } finally {
              globalThis.auth=oldAuth;
              globalThis.fetch=oldFetch;
            }
          });

          test('finishing a reduced required list cannot self-certify the original mission',async()=>{
            const result=await runJarvisMission({
              instruction:'Investigación compleja que necesita auditoría semántica final.',
              initialToolCalls:[{name:'web.research',args:{query:'entidad',researchGoal:'RESEARCH_1'}}],
              requiredToolNames:['web.research'],
              maximumSteps:4,
              timeoutMs:5000,
              execute:async()=>({
                ok:true,
                executionOk:true,
                objectiveSatisfied:true,
                blocked:false,
                retryable:false,
                requiresInput:false,
                requiresApproval:false,
                status:'GROUNDED',
                validSources:[{title:'Fuente',url:'https://example.com'}]
              }),
              planner:async()=>({toolCalls:[],missionComplete:false})
            });
            assert.equal(result.status,'PARTIAL');
            assert.equal(result.reason,'SEMANTIC_COMPLETION_AUDIT_REQUIRED');
          });

          test('semantic completion audit can explicitly certify a satisfied contract',async()=>{
            const result=await runJarvisMission({
              instruction:'Investigación simple certificada semánticamente.',
              initialToolCalls:[{name:'web.research',args:{query:'entidad',researchGoal:'RESEARCH_1'}}],
              requiredToolNames:['web.research'],
              maximumSteps:4,
              timeoutMs:5000,
              execute:async()=>({
                ok:true,
                executionOk:true,
                objectiveSatisfied:true,
                blocked:false,
                retryable:false,
                requiresInput:false,
                requiresApproval:false,
                status:'GROUNDED',
                validSources:[{title:'Fuente',url:'https://example.com'}]
              }),
              planner:async()=>({toolCalls:[],missionComplete:true})
            });
            assert.equal(result.status,'COMPLETED');
            assert.equal(result.reason,'ALL_EXECUTABLE_TASKS_COMPLETED');
          });

          test('runtime no longer recovers a failed mission contract from the initial seed',()=>{
            const core=fs.readFileSync(new URL('../gestia-core/gestia-core.js',import.meta.url),'utf8');
            assert.doesNotMatch(core,/MISSION_CONTRACT_RECOVERED_FROM_INITIAL_PLAN/);
            assert.match(core,/MISSION_CONTRACT_UNAVAILABLE/);
            const orchestrator=fs.readFileSync(new URL('../gestia-core/jarvis/jarvis.mission.orchestrator.js',import.meta.url),'utf8');
            assert.doesNotMatch(orchestrator,/verifiedContractSatisfied/);
            assert.match(orchestrator,/SEMANTIC_COMPLETION_AUDIT_REQUIRED/);
          });
          ''')
          PY

          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/gestia-core.js
          node --check gestia-core/jarvis/jarvis.mission.orchestrator.js
          node --check tests/jarvis-mission-contract-authority-closeout.test.mjs
          git diff --check
          echo 'CLOUD_AUDITED_MISSION_CONTRACT_PRIMARY=true'
          echo 'BROWSER_CONTRACT_FALLBACK_ONLY=true'
          echo 'INITIAL_SEED_RECOVERY_REMOVED=true'
          echo 'SEMANTIC_COMPLETION_AUDIT_REQUIRED=true'
          echo 'NO_NEW_BRAIN=true'
          echo 'NO_NEW_CONTRACT_VERSION=true'

      - name: Install dependencies
        run: npm ci

      - name: Focal mission-contract authority regression
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/jarvis-mission-contract-authority-closeout.test.mjs \
            tests/jarvis-mission-flow-contract-closeout.test.mjs \
            tests/jarvis-mission-contract-preserves-initial-production.test.mjs \
            tests/jarvis-human-regression-closeout.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-mission-contract-accounting.test.mjs \
            tests/jarvis-single-contract-authority.test.mjs
          echo 'FOCAL_MISSION_CONTRACT_AUTHORITY_GREEN=true'

      - name: Full CI once
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/final-step-5.sh
          echo 'FULL_CI_MISSION_CONTRACT_AUTHORITY_GREEN=true'

      - name: Protected surface audit
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/final-step-6.sh
          ! git diff --name-only "$BASE_SHA" -- . | grep -E '^(functions/|multiservicios-web/|.*Multiservicios)'
          grep -q '1.2.0-stable-research-objectives' gestia-core/gestia-core.js
          ! grep -q 'MISSION_CONTRACT_RECOVERED_FROM_INITIAL_PLAN' gestia-core/gestia-core.js
          grep -q 'MISSION_CONTRACT_UNAVAILABLE' gestia-core/gestia-core.js
          ! grep -q 'verifiedContractSatisfied' gestia-core/jarvis/jarvis.mission.orchestrator.js
          grep -q 'SEMANTIC_COMPLETION_AUDIT_REQUIRED' gestia-core/jarvis/jarvis.mission.orchestrator.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('gestia-core/jarvis/jarvis.multifunction.planner.js','utf8');
          const a=s.indexOf('async function callMissionContractCoverageAuthority');
          const b=s.indexOf('async function callBrowserSemanticPlan',a);
          const h=s.slice(a,b);
          if(a<0 || b<=a) process.exit(11);
          if(h.indexOf('callSemanticPlanner')<0 || h.indexOf('callBrowserMissionContract')<0) process.exit(12);
          if(h.indexOf('callSemanticPlanner')>h.indexOf('callBrowserMissionContract')) process.exit(13);
          NODE
          echo 'FUNCTIONS_UNTOUCHED=true'
          echo 'MULTISERVICIOS_UNTOUCHED=true'
          echo 'MISSION_CONTRACT_STABLE=true'
          echo 'NO_NEW_BRAIN=true'

      - name: Build isolated Hosting-only config
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/final-step-7.sh
          node <<'NODE'
          const fs=require('fs');
          const path='contract-audit-production-chain.json';
          const value=JSON.parse(fs.readFileSync(path,'utf8'));
          value.candidate='ADJUNTO_MISSION_CONTRACT_AUTHORITY_CLOSEOUT';
          value.cloudAuditedMissionContractPrimary=true;
          value.browserMissionContractFallbackOnly=true;
          value.initialSeedRecoveryRemoved=true;
          value.semanticCompletionAuditRequired=true;
          value.collectIsNotAnalyze=true;
          value.exactWebMediaAttribution=true;
          value.canonicalMissionContract='1.2.0-stable-research-objectives';
          value.untouchedSurfaces=['Functions','Multiservicios'];
          fs.writeFileSync(path,JSON.stringify(value,null,2));
          NODE

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting only
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/final-step-9.sh

      - name: Verify served bytes
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/final-step-10.sh
          base="https://${FIREBASE_SITE_ID}.web.app"
          ok=false
          for attempt in $(seq 1 20); do
            if curl -fsSL "${base}/gestia-core/jarvis/jarvis.multifunction.planner.js?authority=${GITHUB_RUN_ID}" -o /tmp/planner.js \
              && curl -fsSL "${base}/gestia-core/gestia-core.js?authority=${GITHUB_RUN_ID}" -o /tmp/core.js \
              && curl -fsSL "${base}/gestia-core/jarvis/jarvis.mission.orchestrator.js?authority=${GITHUB_RUN_ID}" -o /tmp/orchestrator.js \
              && curl -fsSL "${base}/contract-audit-production-chain.json?authority=${GITHUB_RUN_ID}" -o /tmp/authority-marker.json \
              && grep -q 'async function callMissionContractCoverageAuthority' /tmp/planner.js \
              && grep -q 'callSemanticPlanner' /tmp/planner.js \
              && grep -q 'callBrowserMissionContract' /tmp/planner.js \
              && grep -q 'MISSION_CONTRACT_UNAVAILABLE' /tmp/core.js \
              && ! grep -q 'MISSION_CONTRACT_RECOVERED_FROM_INITIAL_PLAN' /tmp/core.js \
              && grep -q 'SEMANTIC_COMPLETION_AUDIT_REQUIRED' /tmp/orchestrator.js \
              && ! grep -q 'verifiedContractSatisfied' /tmp/orchestrator.js \
              && grep -q 'ADJUNTO_MISSION_CONTRACT_AUTHORITY_CLOSEOUT' /tmp/authority-marker.json \
              && grep -q '"cloudAuditedMissionContractPrimary": true' /tmp/authority-marker.json \
              && grep -q '"initialSeedRecoveryRemoved": true' /tmp/authority-marker.json \
              && grep -q '"semanticCompletionAuditRequired": true' /tmp/authority-marker.json; then
              ok=true
              break
            fi
            sleep 4
          done
          test "$ok" = true
          echo 'CERTIFIED_MISSION_CONTRACT_AUTHORITY_BYTES_VERIFIED=true'
          echo "WEB_URL=${base}/gestia-terminal.html"

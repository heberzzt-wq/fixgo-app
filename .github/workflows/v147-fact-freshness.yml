name: Jarvis V147 fact-level freshness

on:
  pull_request:
    paths:
      - 'functions/jarvis-web-fact-freshness.js'
      - 'tests/jarvis-web-fact-freshness-v147.test.cjs'
      - '.github/scripts/v147-fact-freshness-patch.mjs'
      - '.github/workflows/v147-fact-freshness.yml'
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - 'functions/jarvis-web-fact-freshness.js'
      - 'tests/jarvis-web-fact-freshness-v147.test.cjs'
      - '.github/scripts/v147-fact-freshness-patch.mjs'
      - '.github/workflows/v147-fact-freshness.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  TARGET_BRANCH: v94-media-v4n-negative-claims
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  certify-materialize-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Apply deterministic V147 product patch
        run: node .github/scripts/v147-fact-freshness-patch.mjs

      - name: Verify affected syntax
        run: |
          node --check functions/jarvis-web-fact-freshness.js
          node --check functions/jarvis-genai-provider-chain.js
          node --check functions/jarvis-web-research.js

      - name: Run fact freshness and regression contracts
        run: |
          node --test \
            tests/jarvis-web-fact-freshness-v147.test.cjs \
            tests/jarvis-source-freshness-verification-v146.test.cjs \
            tests/jarvis-genai-provider-chain.test.cjs \
            tests/jarvis-genai-grounding-canonicalization.test.cjs \
            tests/jarvis-web-research.test.cjs

      - name: Guard exact product delta
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test -n "$changed"
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^(functions/jarvis-genai-provider-chain.js|functions/jarvis-web-research.js)$' || true)
          test -z "$unexpected"
          grep -Fq 'assessGroundingSupportFreshness' functions/jarvis-genai-provider-chain.js
          grep -Fq 'filterGroundingSupportsByFreshness' functions/jarvis-web-research.js
          grep -Fq 'staleFactsFiltered' functions/jarvis-web-research.js
          git diff --check

      - name: Materialize certified product bytes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/jarvis-genai-provider-chain.js functions/jarvis-web-research.js
          git commit -m 'fix(jarvis): enforce fact-level web freshness'
          product_sha=$(git rev-parse HEAD)
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "V147_PRODUCT_SHA=$product_sha"

      - name: Install functions dependencies
        if: github.event_name == 'push'
        run: npm ci --prefix functions

      - name: Install Firebase CLI
        if: github.event_name == 'push'
        run: npm install -g firebase-tools

      - name: Deploy affected Jarvis functions only
        if: github.event_name == 'push'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy \
            --only functions:jarvisWebResearch,functions:jarvisSemanticPlan,functions:jarvisSemanticRespond \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      - name: Smoke Hosting and callable endpoints
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          base="https://${FIREBASE_SITE_ID}.web.app"
          curl --fail --silent --show-error --location "$base/gestia-terminal.html?v147=${GITHUB_SHA}" -o /tmp/terminal.html
          test "$(wc -c < /tmp/terminal.html)" -gt 1000
          for fn in jarvisWebResearch jarvisSemanticPlan jarvisSemanticRespond; do
            url="https://us-central1-${FIREBASE_PROJECT_ID}.cloudfunctions.net/${fn}"
            code=$(curl --silent --show-error --output "/tmp/${fn}.json" --write-out '%{http_code}' \
              -X POST -H 'Content-Type: application/json' --data '{"data":{}}' "$url" || true)
            echo "$fn HTTP=$code"
            test "$code" != "000"
            test "$code" != "404"
            test "$code" != "502"
            test "$code" != "503"
          done
          echo 'V147_FACT_FRESHNESS_SMOKE_VERIFIED=true'

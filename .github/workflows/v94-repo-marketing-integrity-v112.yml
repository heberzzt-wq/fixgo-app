name: V94 repo marketing integrity v112

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-repo-marketing-integrity-v112.yml

permissions:
  contents: write

jobs:
  repair-certify-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Assert branch and Functions boundary
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"
          test -z "$(git status --porcelain -- functions)"
          git merge-base --is-ancestor 46c1a4c9a4d69af87b368fe085cc2d7de06243d5 HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm --prefix functions ci
          test -z "$(git status --porcelain -- functions)"

      - name: Apply fail-closed repo and marketing dependency repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          release_old = 'v94-semantic-memory-repo-v111-20260809'
          release_new = 'v94-repo-marketing-integrity-v112-20260809'

          # 1) ResponseComposer: an empty repository audit is a failure, never a completed audit.
          p = Path('gestia-core/response.composer.js')
          s = p.read_text(encoding='utf-8')
          old = '''        const files =\n            scan?.files || [];\n\n        const modules =\n            scan?.modules || [];\n\n        const moduleNames ='''
          new = '''        const files =\n            Array.isArray(scan?.files)\n                ? scan.files\n                : [];\n\n        const modules =\n            Array.isArray(scan?.modules)\n                ? scan.modules\n                : [];\n\n        const totalFiles =\n            Number.isFinite(Number(scan?.total))\n                ? Number(scan.total)\n                : files.length;\n\n        if (totalFiles < 1 || files.length < 1) {\n            return this.error(\n                "La auditoría no recibió evidencia verificable de archivos del repositorio. No se declarará completada.",\n                "REPO_AUDIT_EMPTY_EVIDENCE",\n                {\n                    rawInput,\n                    status: scan?.status || null,\n                    source,\n                    totalFiles,\n                    fileEvidenceCount: files.length\n                }\n            );\n        }\n\n        const moduleNames ='''
          if s.count(old) != 1:
              raise SystemExit(f'response composer anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          s = s.replace('`El scanner recorrió **${scan?.total || files.length || 0} archivos** del repositorio.`', '`El scanner recorrió **${totalFiles} archivos** del repositorio.`', 1)
          s = s.replace('files:\n                        scan?.total || files.length || 0,', 'files:\n                        totalFiles,', 1)
          p.write_text(s, encoding='utf-8')

          # 2) Core: a marketing document can only be hydrated from a completed marketing.plan.
          p = Path('gestia-core/gestia-core.js')
          s = p.read_text(encoding='utf-8')
          old = '''                    if (marketingArtifactArgs) {\n                        executionCall.args = marketingArtifactArgs;\n                        argumentGrounded = true;\n                    }\n\n                    const blueprintTask ='''
          new = '''                    if (marketingArtifactArgs) {\n                        executionCall.args = marketingArtifactArgs;\n                        argumentGrounded = true;\n                    }\n\n                    const marketingDocumentRequiresPlan =\n                        executionCall.args?.contentSource ===\n                        "marketing.plan";\n\n                    if (\n                        marketingDocumentRequiresPlan &&\n                        !marketingArtifactArgs\n                    ) {\n                        const marketingDependencyTask =\n                            [\n                                ...(Array.isArray(missionContext?.blockedTasks)\n                                    ? missionContext.blockedTasks\n                                    : []),\n                                ...(Array.isArray(missionContext?.pendingTasks)\n                                    ? missionContext.pendingTasks\n                                    : [])\n                            ].find(item =>\n                                item?.name === "marketing.plan"\n                            ) || null;\n\n                        return {\n                            ok: false,\n                            executionOk: false,\n                            objectiveSatisfied: false,\n                            blocked: true,\n                            retryable: false,\n                            status: "MARKETING_PLAN_DEPENDENCY_UNSATISFIED",\n                            error: "MARKETING_PLAN_CONTENT_REQUIRED",\n                            message: "No se creó el documento porque marketing.plan no produjo un plan completo y verificado. document.compose no puede sustituir esa dependencia.",\n                            dependency: "marketing.plan",\n                            dependencyStatus:\n                                marketingDependencyTask?.observation?.status ||\n                                marketingDependencyTask?.reason ||\n                                null,\n                            missionExecution: {\n                                name: call.name,\n                                args: executionCall.args\n                            }\n                        };\n                    }\n\n                    const blueprintTask ='''
          if s.count(old) != 1:
              raise SystemExit(f'core marketing dependency anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          s = s.replace('/gestia-core/jarvis/jarvis.marketing.presenter.js?v=v94-marketing-real-delivery-v109-20260809', f'/gestia-core/jarvis/jarvis.marketing.presenter.js?v={release_new}', 1)
          s = s.replace('/gestia-core/tools.runtime.js?v=v94-semantic-memory-repo-v111-20260809', f'/gestia-core/tools.runtime.js?v={release_new}', 1)
          s = s.replace('/gestia-core/response.composer.js?v=jarvis-tools-v7-20260725-semantic-envelope-v64', f'/gestia-core/response.composer.js?v={release_new}', 1)
          s = s.replace('/gestia-core/tools.bridge.js?v=jarvis-tools-bridge-v7-20260726-chief-review-response-v93', f'/gestia-core/tools.bridge.js?v={release_new}', 1)
          p.write_text(s, encoding='utf-8')

          # 3) Actuator: direct document.create calls cannot bypass the marketing dependency.
          p = Path('gestia-core/jarvis/jarvis.actuator.pack.js')
          s = p.read_text(encoding='utf-8')
          old = '''            execute: async (args = {}, context = {}) =>\n                await bridgeRequest("/document", {\n                    format: args.format || "html",\n                    output:\n                        args.output ||\n                        undefined,\n                    title: args.title,\n                    content: args.content,\n                    rows: args.rows,\n                    sheets: args.sheets,\n                    requireFormulas:\n                        args.requireFormulas ===\n                        true,\n                    requireDocumentValidation:\n                        args\n                            .requireDocumentValidation ===\n                        true,\n                    documentContract:\n                        args.documentContract ||\n                        {},\n                    documentValidation:\n                        args.documentValidation ||\n                        {},\n                    slides: args.slides,\n                    caseId: args.caseId || context.caseId || "",\n                    objectiveId: args.objectiveId || context.objectiveId || ""\n                })'''
          new = '''            execute: async (args = {}, context = {}) => {\n                const contentSource =\n                    String(args.contentSource || "")\n                        .trim();\n                const hasDocumentContent =\n                    typeof args.content === "string" &&\n                    args.content.trim().length > 0;\n\n                if (\n                    contentSource === "marketing.plan" &&\n                    !hasDocumentContent\n                ) {\n                    return {\n                        ok: false,\n                        executionOk: false,\n                        objectiveSatisfied: false,\n                        blocked: true,\n                        retryable: false,\n                        status: "MARKETING_DOCUMENT_SOURCE_UNAVAILABLE",\n                        error: "MARKETING_PLAN_CONTENT_REQUIRED",\n                        contentSource,\n                        format: String(args.format || "").toLowerCase()\n                    };\n                }\n\n                return await bridgeRequest("/document", {\n                    format: args.format || "html",\n                    output:\n                        args.output ||\n                        undefined,\n                    title: args.title,\n                    contentSource,\n                    content: args.content,\n                    rows: args.rows,\n                    sheets: args.sheets,\n                    requireFormulas:\n                        args.requireFormulas ===\n                        true,\n                    requireDocumentValidation:\n                        args\n                            .requireDocumentValidation ===\n                        true,\n                    documentContract:\n                        args.documentContract ||\n                        {},\n                    documentValidation:\n                        args.documentValidation ||\n                        {},\n                    slides: args.slides,\n                    caseId: args.caseId || context.caseId || "",\n                    objectiveId: args.objectiveId || context.objectiveId || ""\n                });\n            }'''
          if s.count(old) != 1:
              raise SystemExit(f'actuator document.create anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 4) Runtime internal imports: force the repaired tool pack/actuator bytes.
          p = Path('gestia-core/tools.runtime.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('./jarvis/jarvis.multitool.pack.js?v=v94-marketing-real-delivery-v109-20260809', f'./jarvis/jarvis.multitool.pack.js?v={release_new}', 1)
          s = s.replace('./jarvis/jarvis.actuator.pack.js?v=sia7-identity-fidelity-v106-20260728', f'./jarvis/jarvis.actuator.pack.js?v={release_new}', 1)
          p.write_text(s, encoding='utf-8')

          # 5) Terminal cache-bust only; no UI/design changes.
          p = Path('gestia-terminal.html')
          s = p.read_text(encoding='utf-8')
          if release_old not in s:
              raise SystemExit('terminal v111 release token missing')
          s = s.replace(release_old, release_new)
          p.write_text(s, encoding='utf-8')

          # 6) Align release assertions only.
          for p in Path('tests').rglob('*'):
              if not p.is_file() or p.suffix not in {'.mjs', '.cjs', '.js'}:
                  continue
              s = p.read_text(encoding='utf-8')
              if release_old in s:
                  p.write_text(s.replace(release_old, release_new), encoding='utf-8')

          # 7) Human regressions for the two live failures.
          p = Path('tests/response-composer-semantic-contract.test.mjs')
          s = p.read_text(encoding='utf-8')
          marker = 'repo audit fails closed when scan contains zero file evidence'
          if marker not in s:
              s += '''\n\ntest("repo audit fails closed when scan contains zero file evidence", () => {\n    const result = ResponseComposer.composeRepoAuditResult({\n        rawInput: "audita el repo",\n        scan: {\n            ok: true,\n            status: "REPO_AUDIT_READY",\n            total: 0,\n            files: [],\n            modules: []\n        },\n        source: { tool: "repo.audit" }\n    });\n\n    assert.equal(result.ok, false);\n    assert.equal(result.executionOk, false);\n    assert.equal(result.objectiveSatisfied, false);\n    assert.equal(result.error.code, "REPO_AUDIT_EMPTY_EVIDENCE");\n    assert.equal(result.error.context.totalFiles, 0);\n});\n\ntest("repo audit only reports completion when file evidence exists", () => {\n    const result = ResponseComposer.composeRepoAuditResult({\n        rawInput: "audita el repo",\n        scan: {\n            ok: true,\n            status: "REPO_AUDIT_READY",\n            total: 2,\n            files: [\n                { file: "gestia-core/gestia-core.js", module: "core" },\n                { file: "gestia-core/tools.runtime.js", module: "runtime" }\n            ],\n            modules: [{ name: "core" }, { name: "runtime" }]\n        },\n        source: { tool: "repo.audit" }\n    });\n\n    assert.equal(result.ok, true);\n    assert.match(result.text, /2 archivos/);\n});\n'''
              p.write_text(s, encoding='utf-8')

          p = Path('tests/jarvis-marketing-terminal-delivery.e2e.test.mjs')
          s = p.read_text(encoding='utf-8')
          marker = 'marketing document dependency cannot fall through to generic document composition'
          if marker not in s:
              s += '''\n\ntest("marketing document dependency cannot fall through to generic document composition", () => {\n    const core = fs.readFileSync(path.join(process.cwd(), "gestia-core", "gestia-core.js"), "utf8");\n    const guard = core.indexOf("MARKETING_PLAN_DEPENDENCY_UNSATISFIED");\n    const fallback = core.indexOf("const blueprintTask", guard);\n\n    assert.ok(guard > 0);\n    assert.ok(fallback > guard);\n    assert.match(core, /MARKETING_PLAN_CONTENT_REQUIRED/);\n    assert.match(core, /document\\.compose no puede sustituir esa dependencia/);\n});\n'''
              p.write_text(s, encoding='utf-8')

          p = Path('tests/jarvis-actuator-pack.test.mjs')
          s = p.read_text(encoding='utf-8')
          marker = 'document.create rejects an unresolved marketing.plan source before bridge write'
          if marker not in s:
              s += '''\n\ntest("document.create rejects an unresolved marketing.plan source before bridge write", async () => {\n    const runtime = createRuntime();\n    registerJarvisActuatorTools(runtime);\n    const previousBridge = globalThis.JarvisLocalBridge;\n    let bridgeCalls = 0;\n    globalThis.JarvisLocalBridge = {\n        async requestJson() {\n            bridgeCalls += 1;\n            return { ok: true, status: "DOCUMENT_ARTIFACT_CREATED_VERIFIED", output: ".jarvis-artifacts/documents/plan.pdf" };\n        }\n    };\n\n    try {\n        const blocked = await runtime.execute(\n            "document.create",\n            { format: "pdf", contentSource: "marketing.plan", title: "Plan" },\n            {}\n        );\n        assert.equal(blocked.data.ok, false);\n        assert.equal(blocked.data.status, "MARKETING_DOCUMENT_SOURCE_UNAVAILABLE");\n        assert.equal(blocked.data.error, "MARKETING_PLAN_CONTENT_REQUIRED");\n        assert.equal(bridgeCalls, 0);\n\n        const created = await runtime.execute(\n            "document.create",\n            { format: "pdf", contentSource: "marketing.plan", title: "Plan", content: "# Plan verificado\\nContenido real." },\n            {}\n        );\n        assert.equal(created.data.ok, true);\n        assert.equal(bridgeCalls, 1);\n    }\n    finally {\n        globalThis.JarvisLocalBridge = previousBridge;\n    }\n});\n'''
              p.write_text(s, encoding='utf-8')
          PY

          node --check gestia-core/response.composer.js
          node --check gestia-core/gestia-core.js
          node --check gestia-core/jarvis/jarvis.actuator.pack.js
          node --check gestia-core/tools.runtime.js
          test -z "$(git diff --name-only -- functions)"

      - name: Focused live-regression tests
        run: |
          set -euo pipefail
          node --test \
            tests/response-composer-semantic-contract.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs \
            tests/jarvis-actuator-pack.test.mjs \
            tests/jarvis-repo-target-runtime.test.mjs \
            tests/jarvis-repo-intelligence.test.mjs \
            tests/jarvis-semantic-memory-integrity.test.mjs

      - name: Full CI
        run: |
          set -euo pipefail
          npm run ci:test

      - name: Certify live invariants before commit
        run: |
          set -euo pipefail
          grep -q 'REPO_AUDIT_EMPTY_EVIDENCE' gestia-core/response.composer.js
          grep -q 'MARKETING_PLAN_DEPENDENCY_UNSATISFIED' gestia-core/gestia-core.js
          grep -q 'MARKETING_DOCUMENT_SOURCE_UNAVAILABLE' gestia-core/jarvis/jarvis.actuator.pack.js
          grep -q 'v94-repo-marketing-integrity-v112-20260809' gestia-terminal.html
          grep -q 'tools.runtime.js?v=v94-repo-marketing-integrity-v112-20260809' gestia-core/gestia-core.js
          grep -q 'jarvis.actuator.pack.js?v=v94-repo-marketing-integrity-v112-20260809' gestia-core/tools.runtime.js
          grep -q 'live_repo_ast_graph' gestia-core/tools.runtime.js
          grep -q 'REPOSITORY_REFERENCE_ANALYZED' gestia-core/tools.runtime.js
          ! grep -q 'Cada conversación empieza aislada' gestia-terminal.html
          ! grep -q 'jarvis.context.memory.v6.js' gestia-terminal.html
          ! grep -q 'from "./hubs/analysis.hub.js"' gestia-core/jarvis.kernel.js
          test "$(grep -c 'name: "repo.audit"' gestia-core/tools.runtime.js)" -eq 1
          test "$(grep -c 'name: "repo.scan"' gestia-core/tools.runtime.js)" -eq 1
          test -z "$(git diff --name-only -- functions)"

      - name: Verify slash branch resolution on real git remote
        run: |
          set -euo pipefail
          git fetch --quiet origin codex/jarvis-v8-runtime-foundation
          node --input-type=module <<'NODE'
          import { resolveBridgeRepositoryTarget } from './jarvis-fs-bridge.js';
          const result = resolveBridgeRepositoryTarget({
            target: 'https://github.com/heberzzt-wq/fixgo-app/blob/codex/jarvis-v8-runtime-foundation'
          }, process.cwd());
          console.log(JSON.stringify(result, null, 2));
          if (!result.ok) process.exit(1);
          if (result.ref !== 'codex/jarvis-v8-runtime-foundation') process.exit(1);
          if (result.path !== '') process.exit(1);
          if (!result.commit) process.exit(1);
          NODE

      - name: Verify deploy gate
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- functions)"
          node scripts/jarvis-deploy-gate.mjs

      - name: Commit certified product repair
        run: |
          set -euo pipefail
          git config user.name "heberzzt-wq"
          git config user.email "heberzzt@gmail.com"
          git add \
            gestia-terminal.html \
            gestia-core/gestia-core.js \
            gestia-core/response.composer.js \
            gestia-core/tools.runtime.js \
            gestia-core/jarvis/jarvis.actuator.pack.js \
            tests/response-composer-semantic-contract.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs \
            tests/jarvis-actuator-pack.test.mjs \
            tests/jarvis-multifunction-tools.test.mjs
          test -z "$(git diff --cached --name-only -- functions)"
          git commit -m "[v94] fix(adj): fail closed repo audit and marketing artifacts"
          git push origin HEAD:v94-media-v4n-negative-claims
          printf 'PRODUCT_COMMIT=%s\n' "$(git rev-parse HEAD)" | tee /tmp/v112-product-commit.txt

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          test -z "$(git status --porcelain -- functions)"
          firebase deploy --only hosting --project fixgo-44e4d --token "$FIREBASE_TOKEN"

      - name: Verify exact live bytes and v112 behavior contracts
        run: |
          set -euo pipefail
          paths=(
            gestia-terminal.html
            gestia-core/gestia-core.js
            gestia-core/response.composer.js
            gestia-core/tools.runtime.js
            gestia-core/tools.bridge.js
            gestia-core/jarvis/jarvis.actuator.pack.js
            gestia-core/jarvis/jarvis.marketing.engine.js
            gestia-core/jarvis/jarvis.marketing.presenter.js
            gestia-core/jarvis/jarvis.semantic.memory.js
            gestia-core/jarvis/jarvis.mission.orchestrator.js
            gestia-core/jarvis.kernel.js
            jarvis-fs-bridge.js
          )
          for path in "${paths[@]}"; do
            live="/tmp/live-$(echo "$path" | tr '/' '_')"
            curl -fsSL "https://fixgo-44e4d.web.app/$path?cert=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o "$live"
            local_sha="$(sha256sum "$path" | awk '{print $1}')"
            live_sha="$(sha256sum "$live" | awk '{print $1}')"
            printf '%s local=%s live=%s\n' "$path" "$local_sha" "$live_sha"
            test "$local_sha" = "$live_sha"
            cmp -s "$path" "$live"
          done

          html=/tmp/live-gestia-terminal.html
          core=/tmp/live-gestia-core_gestia-core.js
          composer=/tmp/live-gestia-core_response.composer.js
          runtime=/tmp/live-gestia-core_tools.runtime.js
          actuator=/tmp/live-gestia-core_jarvis_jarvis.actuator.pack.js
          kernel=/tmp/live-gestia-core_jarvis.kernel.js

          grep -q 'v94-repo-marketing-integrity-v112-20260809' "$html"
          grep -q 'MARKETING_PLAN_DEPENDENCY_UNSATISFIED' "$core"
          grep -q 'REPO_AUDIT_EMPTY_EVIDENCE' "$composer"
          grep -q 'MARKETING_DOCUMENT_SOURCE_UNAVAILABLE' "$actuator"
          grep -q 'live_repo_ast_graph' "$runtime"
          grep -q 'REPOSITORY_REFERENCE_ANALYZED' "$runtime"
          ! grep -q 'jarvis.context.memory.v6.js' "$html"
          ! grep -q 'from "./hubs/analysis.hub.js"' "$kernel"

      - name: Remove temporary V94 workflows and seal branch
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/v94-repo-marketing-integrity-v112.yml \
            .github/workflows/v94-full-ci-failure-extract.yml \
            .github/workflows/v94-full-ci-legacy-contract-fix.yml \
            .github/workflows/v94-semantic-memory-integrity-certify.yml
          git add -A
          test -z "$(git diff --cached --name-only -- functions)"
          if ! git diff --cached --quiet; then
            git commit -m "[v94] chore: close v112 certification workflows"
            git push origin HEAD:v94-media-v4n-negative-claims
          fi
          printf 'FINAL_HEAD=%s\n' "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain -- functions)"

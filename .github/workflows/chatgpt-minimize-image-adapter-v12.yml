name: ChatGPT minimize image adapter v12

on:
  push:
    branches:
      - chatgpt/jarvis-v12-marketing-handoff
  pull_request:
    branches:
      - v94-media-v4n-negative-claims

permissions:
  contents: write

jobs:
  minimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/jarvis-v12-marketing-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore baseline formatting and inject only official-logo compositor
        shell: bash
        run: |
          git show origin/v94-media-v4n-negative-claims:gestia-core/jarvis/jarvis.image.adapter.js > gestia-core/jarvis/jarvis.image.adapter.js
          python - <<'PY'
          from pathlib import Path
          p = Path('gestia-core/jarvis/jarvis.image.adapter.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'export const JARVIS_IMAGE_ADAPTER_VERSION = "1.1.0-identity-reference-sheet";',
              'export const JARVIS_IMAGE_ADAPTER_VERSION = "1.2.0-official-brand-logo-overlay-v12";',
              1
          )
          marker = 'function drawContainedImage(\n'
          addition = r'''function brandLogoPlacement(
    canvasWidth,
    canvasHeight,
    logoWidth,
    logoHeight,
    input = {}
) {
    const maxWidthRatio = Math.min(
        0.4,
        Math.max(
            0.08,
            Number(input.maxWidthRatio) || 0.22
        )
    );
    const maxHeightRatio = Math.min(
        0.35,
        Math.max(
            0.06,
            Number(input.maxHeightRatio) || 0.16
        )
    );
    const marginRatio = Math.min(
        0.12,
        Math.max(
            0.01,
            Number(input.marginRatio) || 0.035
        )
    );
    const maxWidth = canvasWidth * maxWidthRatio;
    const maxHeight = canvasHeight * maxHeightRatio;
    const scale = Math.min(
        maxWidth / logoWidth,
        maxHeight / logoHeight,
        1
    );
    const width = Math.max(1, logoWidth * scale);
    const height = Math.max(1, logoHeight * scale);
    const margin = Math.max(
        8,
        Math.round(Math.min(canvasWidth, canvasHeight) * marginRatio)
    );
    const position = String(input.position || "top-right")
        .trim()
        .toLowerCase();

    let x = margin;
    let y = margin;
    if (position.includes("right")) x = canvasWidth - width - margin;
    if (position.includes("bottom")) y = canvasHeight - height - margin;

    return {
        x: Math.max(0, x),
        y: Math.max(0, y),
        width,
        height,
        margin,
        position
    };
}

export async function overlayBrandLogo(input = {}) {
    if (typeof createImageBitmap !== "function") {
        throw new Error("IMAGE_BITMAP_UNAVAILABLE");
    }

    const imageBase64 = String(input.imageBase64 || "").trim();
    const imageMimeType = String(input.imageMimeType || "").trim().toLowerCase();
    const logoBase64 = String(input.logoBase64 || "").trim();
    const logoMimeType = String(input.logoMimeType || "").trim().toLowerCase();

    if (!imageBase64 || !imageMimeType.startsWith("image/")) {
        throw new Error("BRAND_IMAGE_SOURCE_REQUIRED");
    }
    if (!logoBase64 || !logoMimeType.startsWith("image/")) {
        throw new Error("BRAND_LOGO_SOURCE_REQUIRED");
    }

    const imageBitmap = await createImageBitmap(
        base64ImageBlob(imageBase64, imageMimeType)
    );
    const logoBitmap = await createImageBitmap(
        base64ImageBlob(logoBase64, logoMimeType)
    );

    try {
        if (
            !imageBitmap.width ||
            !imageBitmap.height ||
            !logoBitmap.width ||
            !logoBitmap.height
        ) {
            throw new Error("BRAND_LOGO_DIMENSIONS_INVALID");
        }

        const canvas = canvasFor(
            imageBitmap.width,
            imageBitmap.height
        );
        const exportMimeType = [
            "image/png",
            "image/jpeg",
            "image/webp"
        ].includes(imageMimeType)
            ? imageMimeType
            : "image/png";
        const context = canvas.getContext(
            "2d",
            { alpha: exportMimeType !== "image/jpeg" }
        );
        if (!context) {
            throw new Error("BRAND_LOGO_CANVAS_UNAVAILABLE");
        }

        context.drawImage(
            imageBitmap,
            0,
            0,
            imageBitmap.width,
            imageBitmap.height,
            0,
            0,
            imageBitmap.width,
            imageBitmap.height
        );

        const placement = brandLogoPlacement(
            imageBitmap.width,
            imageBitmap.height,
            logoBitmap.width,
            logoBitmap.height,
            input
        );
        context.drawImage(
            logoBitmap,
            0,
            0,
            logoBitmap.width,
            logoBitmap.height,
            placement.x,
            placement.y,
            placement.width,
            placement.height
        );

        const blob = await canvasBlob(
            canvas,
            exportMimeType,
            exportMimeType === "image/png" ? 1 : 0.94
        );
        if (!blob.size) {
            throw new Error("BRAND_LOGO_COMPOSITE_EMPTY");
        }

        return {
            ok: true,
            status: "OFFICIAL_BRAND_LOGO_OVERLAY_APPLIED",
            imageBase64: await blobToBase64(blob),
            mimeType: exportMimeType,
            bytes: blob.size,
            width: imageBitmap.width,
            height: imageBitmap.height,
            logoSourceWidth: logoBitmap.width,
            logoSourceHeight: logoBitmap.height,
            placement,
            logoOverlayApplied: true,
            logoPixelSource: "DECODED_OFFICIAL_SOURCE_BYTES",
            generatedLogoAllowed: false
        };
    }
    finally {
        imageBitmap.close?.();
        logoBitmap.close?.();
    }
}

'''
          if s.count(marker) != 1:
              raise SystemExit(f'insertion marker count={s.count(marker)}')
          s = s.replace(marker, addition + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check gestia-core/jarvis/jarvis.image.adapter.js
          node --test --test-concurrency=1 tests/jarvis-image-adapter.test.mjs tests/jarvis-brand-logo-overlay-v12.test.mjs tests/jarvis-actuator-pack.test.mjs
          git diff --check
      - name: Commit minimized adapter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gestia-core/jarvis/jarvis.image.adapter.js
          git commit -m "refactor: preserve v94 image adapter while adding official logo compositor"
          git pull --rebase origin chatgpt/jarvis-v12-marketing-handoff
          git push origin HEAD:chatgpt/jarvis-v12-marketing-handoff

name: V94 full CI legacy contract fix

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-full-ci-legacy-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm --prefix functions ci
          test -z "$(git status --porcelain -- functions)"

      - name: Align all v111 release tokens
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old='v94-marketing-real-delivery-v109-20260809'
          new='v94-semantic-memory-repo-v111-20260809'
          paths=[
              Path('tests/jarvis-marketing-terminal-delivery.e2e.test.mjs'),
              Path('tests/jarvis-multifunction-tools.test.mjs'),
          ]
          total=0
          for p in paths:
              s=p.read_text(encoding='utf-8')
              count=s.count(old)
              if count < 1:
                  raise SystemExit(f'{p}: no legacy release token found')
              total += count
              p.write_text(s.replace(old,new),encoding='utf-8')
              if old in p.read_text(encoding='utf-8'):
                  raise SystemExit(f'{p}: legacy token remained')
          print(f'replaced {total} legacy v109 release assertions')
          PY

      - name: Full CI
        run: |
          set -euo pipefail
          npm run ci:test

      - name: Guard product boundaries
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only HEAD -- functions)"
          actual="$(git diff --name-only HEAD | sort | tr '\n' ' ')"
          expected="tests/jarvis-marketing-terminal-delivery.e2e.test.mjs tests/jarvis-multifunction-tools.test.mjs "
          test "$actual" = "$expected"

      - name: Commit certified contract updates
        run: |
          set -euo pipefail
          git config user.name "heberzzt-wq"
          git config user.email "heberzzt@gmail.com"
          git add tests/jarvis-marketing-terminal-delivery.e2e.test.mjs tests/jarvis-multifunction-tools.test.mjs
          test -z "$(git diff --cached --name-only -- functions)"
          git commit -m "[v94] test(terminal): certify semantic repo release v111"
          git push origin HEAD:v94-media-v4n-negative-claims

name: Jarvis V146 deploy materialized freshness

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v146-deploy-materialized-freshness.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  FIREBASE_PROJECT_ID: fixgo-44e4d
  FIREBASE_SITE_ID: fixgo-44e4d

jobs:
  certify-deploy-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'v146-source-freshness-deploy' --arg description 'certifying V146 publication freshness runtime' --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Verify V146 materialized bytes
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/jarvis-genai-provider-chain.js
          node --check functions/jarvis-web-research.js
          grep -Fq 'inspectGroundingFreshness' functions/jarvis-genai-provider-chain.js
          grep -Fq 'DIRECT_RESEARCH_STALE_OR_UNDATED_PAGE' functions/jarvis-web-research.js
          node --test \
            tests/jarvis-source-freshness-verification-v146.test.cjs \
            tests/jarvis-genai-provider-chain.test.cjs \
            tests/jarvis-genai-grounding-canonicalization.test.cjs

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy affected Jarvis functions only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN"
          firebase deploy \
            --only functions:jarvisWebResearch,functions:jarvisSemanticPlan,functions:jarvisSemanticRespond \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      - name: Smoke Hosting and callable endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://${FIREBASE_SITE_ID}.web.app"
          curl --fail --silent --show-error --location "$base/gestia-terminal.html?v146=${GITHUB_SHA}" -o /tmp/terminal.html
          test "$(wc -c < /tmp/terminal.html)" -gt 1000
          for fn in jarvisWebResearch jarvisSemanticPlan jarvisSemanticRespond; do
            url="https://us-central1-${FIREBASE_PROJECT_ID}.cloudfunctions.net/${fn}"
            code=$(curl --silent --show-error --output "/tmp/${fn}.json" --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"data":{}}' "$url" || true)
            echo "$fn HTTP=$code"
            test "$code" != "000"
            test "$code" != "404"
            test "$code" != "500"
            test "$code" != "502"
            test "$code" != "503"
          done
          echo "V146_SOURCE_FRESHNESS_DEPLOY_SMOKE=true"

      - name: Publish final status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          description='V146 freshness runtime deployed and smoke verified'
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            description="V146 freshness deploy failed: ${JOB_STATUS}"
          fi
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state "$state" --arg context 'v146-source-freshness-deploy' --arg description "$description" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

name: V94 V124 Source-grounded research

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-v124-source-grounded-research.yml
      - scripts/v124-source-grounded-research.py

permissions:
  contents: write

concurrency:
  group: v94-v124-source-grounded-research
  cancel-in-progress: false

env:
  BRANCH: v94-media-v4n-negative-claims
  BASE_SHA: a40981bdf8d14424fd4f37440854ee2144be5a27
  MAIN_SHA: f3fa8e1806b681e860875afd4ce8183d27864873
  POLISH_SHA: 2ae85e670505c5d425a5a0334e99c45168054bb8
  RELEASE_ID: v94-source-grounded-research-v124-20260810

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout isolated v94 branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Guard staging and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          test -z "$(git diff --name-only "$BASE_SHA" HEAD -- functions/)"
          unexpected="$(git diff --name-only "$BASE_SHA" HEAD | grep -Ev '^(scripts/v124-source-grounded-research\.py|\.github/workflows/v94-v124-source-grounded-research\.yml)$' || true)"
          if test -n "$unexpected"; then
            echo "Unexpected pre-patch files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          echo "V124_STAGING_ISOLATED=true"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Functions dependencies for tests only
        run: npm --prefix functions ci --ignore-scripts

      - name: Apply generic v124 patch
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/v124-source-grounded-research.py 2>&1 | tee v124-patch.log

      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v124-patch-diagnostic
          path: v124-patch.log
          if-no-files-found: warn
          retention-days: 1

      - name: Prove product patch excludes Functions
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$BASE_SHA" -- functions/)"
          git diff --check
          echo "FUNCTIONS_SOURCE_UNCHANGED=true"

      - name: Syntax and source invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --check gestia-core/jarvis/jarvis.multitool.pack.js
          node --check gestia-core/nexo/nexo.real-media.tools.js
          node --check gestia-core/jarvis/jarvis.conversation.composer.js
          node --check gestia-core/jarvis/jarvis.marketing.presenter.js
          node --check jarvis-fs-bridge.js
          node --check gestia-core/gestia-core.js
          grep -Fq 'FUENTE ANCLA' gestia-core/jarvis/jarvis.multifunction.planner.js
          grep -Fq 'seedUrl' gestia-core/jarvis/jarvis.multifunction.planner.js
          grep -Fq 'buildLocalResearchQuery' jarvis-fs-bridge.js
          grep -Fq 'canonicalExecutorUsed' gestia-core/nexo/nexo.real-media.tools.js
          grep -Fq 'RESULTADOS_HERRAMIENTAS_AUTORITATIVOS' gestia-core/jarvis/jarvis.conversation.composer.js
          grep -Fq 'v94-source-grounded-research-v124-20260810' jarvis-runtime-contract.json
          echo "V124_SOURCE_INVARIANTS_OK=true"

      - name: Focused human-red regressions
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/jarvis-source-grounded-research-v124.test.mjs \
            tests/jarvis-generalist-execution-contract-v122.test.mjs \
            tests/jarvis-page-insufficient-evidence-v123.test.mjs \
            tests/jarvis-semantic-planner.test.cjs \
            tests/jarvis-conversation-composer.test.mjs \
            tests/nexo-real-media-tools.test.mjs \
            tests/jarvis-marketing-real-delivery.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/jarvis-fs-bridge-v2.test.mjs \
            2>&1 | tee v124-focal.log

      - name: Upload focal diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v124-focal-diagnostic
          path: v124-focal.log
          if-no-files-found: warn
          retention-days: 1

      - name: Full CI
        run: npm run ci:test

      - name: Final product proof before commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --name-only "$BASE_SHA" -- functions/)"
          test -f tests/jarvis-source-grounded-research-v124.test.mjs
          node -e 'const j=JSON.parse(require("fs").readFileSync("jarvis-runtime-contract.json","utf8")); if(j.releaseId!==process.env.RELEASE_ID) process.exit(1);'
          echo "V124_PRECOMMIT_GREEN=true"

      - name: Commit product and remove temporary staging machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/v124-source-grounded-research.py
          rm -f .github/workflows/v94-v124-source-grounded-research.yml
          rm -f v124-patch.log v124-focal.log
          git config user.name "heberzzt-wq"
          git config user.email "heberzzt@gmail.com"
          git add -A
          test -z "$(git diff --cached --name-only | grep -E '^functions/' || true)"
          test ! -e scripts/v124-source-grounded-research.py
          test ! -e .github/workflows/v94-v124-source-grounded-research.yml
          git diff --cached --check
          git commit -m "[v94] fix(adj): anchor research to user sources v124"
          PRODUCT_SHA="$(git rev-parse HEAD)"
          echo "PRODUCT_SHA=$PRODUCT_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:"$BRANCH"
          echo "V124_PRODUCT_COMMITTED=$PRODUCT_SHA"

      - name: Final protected refs Functions and no-deploy proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/v5.9-polish | awk '{print $1}')" = "$POLISH_SHA"
          test "$(git ls-remote origin refs/heads/$BRANCH | awk '{print $1}')" = "$PRODUCT_SHA"
          test -z "$(git diff --name-only "$BASE_SHA" "$PRODUCT_SHA" -- functions/)"
          echo "FINAL_PROTECTED_REFS_OK=true"
          echo "FINAL_FUNCTIONS_UNCHANGED=true"
          echo "NO_HOSTING_OR_FUNCTIONS_DEPLOY_PERFORMED=true"
          echo "V124_SOURCE_GROUNDED_RESEARCH_CERTIFIED=$PRODUCT_SHA"

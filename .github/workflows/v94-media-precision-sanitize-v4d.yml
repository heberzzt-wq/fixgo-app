name: V94 media precision sanitizer v4d

on:
  push:
    branches:
      - v94-handoff-ee6d8cfe
    paths:
      - .github/workflows/v94-media-precision-sanitize-v4d.yml

permissions:
  contents: write

jobs:
  repair-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated V94 handoff
        uses: actions/checkout@v4
        with:
          ref: v94-handoff-ee6d8cfe
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Apply deterministic precision sanitizer repair
        run: python3 .github/scripts/v94-media-precision-sanitize-v4d.py

      - name: Diff integrity
        run: |
          git diff --check
          git status --short

      - name: Focused syntax and tests
        run: |
          node --check functions/jarvis-media-analysis.js
          node --test tests/jarvis-media-analysis.test.cjs tests/jarvis-conversation-composer.test.mjs
          npm run check:nexo:contracts

      - name: Full CI
        run: npm run ci:test

      - name: Commit certified precision sanitizer on handoff branch
        run: |
          git config user.name "OpenAI V94 Handoff"
          git config user.email "actions@users.noreply.github.com"
          git add functions/jarvis-media-analysis.js tests/jarvis-media-analysis.test.cjs
          git diff --cached --quiet && { echo "Expected precision sanitizer repair produced no code diff"; exit 1; }
          git commit -m "[v94-media-v4d] fix(jarvis): sanitize residual ungrounded literals fail-closed"
          git push origin HEAD:v94-handoff-ee6d8cfe
          echo "PATCH_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.10.1

      - name: Deploy only media analysis function
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          test -n "$FIREBASE_TOKEN"
          firebase deploy --only functions:jarvisMediaAnalyze --project fixgo-44e4d --token "$FIREBASE_TOKEN" --non-interactive
          echo "V94_MEDIA_PRECISION_SANITIZER_DEPLOYED=${PATCH_HEAD}"

name: Deploy Gestia Hosting

on:
  push:
    branches:
      - main
      - v5.9-polish

permissions:
  contents: write
  statuses: write

concurrency:
  group: deploy-gestia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Publish deploy pending
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'deploy-v5.9-polish' --arg description 'Gestia deploy in progress' --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed runtime surfaces
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$before" HEAD)"
          else
            changed_files="$(git ls-tree -r --name-only HEAD)"
          fi

          if grep -Eq '^(functions/|firebase\.json$|\.firebaserc$|\.github/workflows/deploy\.yml$)' <<<"$changed_files"; then
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions_changed=false" >> "$GITHUB_OUTPUT"
          fi

          hosting_candidates="$(printf '%s\n' "$changed_files" | grep -Ev '^(functions/|tests/|\.github/)' || true)"
          if [ -n "$hosting_candidates" ]; then
            echo "hosting_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "hosting_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Align existing grounded freshness hydration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          runtime_path = Path('functions/jarvis-web-research.js')
          runtime = runtime_path.read_text(encoding='utf-8')
          direct_start = runtime.find('async function runJarvisDirectDomainResearch')
          web_start = runtime.find('async function runJarvisWebResearch', direct_start)
          assert direct_start >= 0 and web_start >= 0, 'EXISTING_DIRECT_RESEARCH_BLOCK_NOT_FOUND'
          if 'seedUrls = []' not in runtime[direct_start:web_start]:
              a = '    allowedDomain = "",\n'
              p = runtime.find(a, direct_start, web_start)
              assert p >= 0, 'EXISTING_DIRECT_RESEARCH_SIGNATURE_NOT_FOUND'
              p += len(a)
              runtime = runtime[:p] + '    seedUrls = [],\n' + runtime[p:]
              web_start = runtime.find('async function runJarvisWebResearch', direct_start)
          if 'const normalizedSeedUrls =' not in runtime[direct_start:web_start]:
              q = runtime.find('    if (entryUrls.length > 0) {', direct_start, web_start)
              p = runtime.find('    const pages = [];', q, web_start)
              assert q >= 0 and p >= 0, 'EXISTING_DIRECT_RESEARCH_QUEUE_NOT_FOUND'
              block = '    const normalizedSeedUrls =\n        Array.isArray(seedUrls)\n            ? seedUrls\n            : [];\n    normalizedSeedUrls\n        .slice(0, 12)\n        .forEach((seedValue, index) => {\n            const sourceHint =\n                seedValue &&\n                typeof seedValue === "object"\n                    ? seedValue\n                    : { url: String(seedValue || "") };\n            try {\n                const parsed =\n                    new URL(String(sourceHint.url || ""));\n                parsed.hash = "";\n                parsed.search = "";\n                if (\n                    parsed.protocol === "https:" &&\n                    sourceMatchesDomain(\n                        { ...sourceHint, url: parsed.href },\n                        domain\n                    )\n                ) {\n                    enqueue(\n                        parsed.href,\n                        Number.MAX_SAFE_INTEGER - index\n                    );\n                }\n            } catch {\n                return;\n            }\n        });\n    if (\n        queue.length === 0 &&\n        entryUrls.length > 0\n    ) {\n        enqueue(\n            entryUrls.shift(),\n            Number.MAX_SAFE_INTEGER\n        );\n    }\n\n'
              runtime = runtime[:q] + block + runtime[p:]
              web_start = runtime.find('async function runJarvisWebResearch', direct_start)
          if 'publishedAt: page.publishedAt || null,\n        sourceIds:' not in runtime[direct_start:web_start]:
              a = '        claim: [page.title, ...page.headings, ...page.paragraphs].filter(Boolean).join(" | ").slice(0, 2400),\n'
              p = runtime.find(a, direct_start, web_start)
              assert p >= 0, 'EXISTING_DIRECT_RESEARCH_FACT_NOT_FOUND'
              block = '        claim: [\n            page.publishedAt\n                ? `Fecha verificada: ${page.publishedAt}`\n                : "",\n            page.title,\n            ...page.headings,\n            ...page.paragraphs\n        ].filter(Boolean).join(" | ").slice(0, 2400),\n        publishedAt: page.publishedAt || null,\n'
              runtime = runtime[:p] + block + runtime[p + len(a):]
              web_start = runtime.find('async function runJarvisWebResearch', direct_start)
          direct = runtime[direct_start:web_start]
          s = direct.find('    const supports = facts.map')
          pol = direct.find('        policy: {', s)
          assert s >= 0 and pol >= 0, 'EXISTING_DIRECT_RESEARCH_SUCCESS_POLICY_NOT_FOUND'
          pol += direct_start
          f = runtime.find('            fallbackReason:', pol, web_start)
          assert f >= 0, 'EXISTING_DIRECT_RESEARCH_FALLBACK_POLICY_NOT_FOUND'
          if 'freshnessVerified:' not in runtime[pol:f]:
              runtime = runtime[:f] + '            freshnessVerified:\n                directFreshnessWindowDays\n                    ? true\n                    : null,\n' + runtime[f:]
              web_start = runtime.find('async function runJarvisWebResearch', direct_start)
          if 'google_search_grounding+direct_primary_domain_crawl' not in runtime[web_start:]:
              e = runtime.find('    const entityNotVerified =', web_start)
              r = runtime.find('\n\n    return {', e)
              assert e >= 0 and r >= 0, 'EXISTING_GROUNDED_FRESHNESS_HYDRATION_ANCHOR_NOT_FOUND'
              runtime = runtime[:r] + '\n\n    const freshnessWindowDays =\n        directResearchFreshnessWindowDays(normalizedQuery);\n\n    if (\n        freshnessWindowDays &&\n        requestedDomain &&\n        !entityNotVerified &&\n        sources.length > 0\n    ) {\n        let directVerification = null;\n        try {\n            directVerification =\n                await runJarvisDirectDomainResearch({\n                    fetchImpl: globalThis.fetch,\n                    query: normalizedQuery,\n                    allowedDomain: requestedDomain,\n                    seedUrls: sources,\n                    objectiveId,\n                    caseId,\n                    maximumPages:\n                        Math.min(6, Math.max(2, sources.length)),\n                    fallbackReason:\n                        "GROUNDED_SOURCE_FRESHNESS_VERIFICATION"\n                });\n        } catch {\n            directVerification = null;\n        }\n\n        if (\n            directVerification?.grounded &&\n            directVerification?.sourceCount > 0\n        ) {\n            return {\n                ...directVerification,\n                engine: "jarvis_grounded_web_research",\n                model,\n                query: groundedQuery,\n                provider:\n                    "google_search_grounding+direct_primary_domain_crawl",\n                searchQueries,\n                discardedSources: [\n                    ...discardedSources,\n                    ...(directVerification.discardedSources || [])\n                ],\n                policy: {\n                    ...directVerification.policy,\n                    googleGroundingUsed: true,\n                    freshnessVerified: true\n                }\n            };\n        }\n\n        return {\n            ok: false,\n            grounded: false,\n            engine: "jarvis_grounded_web_research",\n            model,\n            query: groundedQuery,\n            requestedDomain,\n            exactEntity: null,\n            objectiveId: String(objectiveId || ""),\n            caseId: String(caseId || ""),\n            researchedAt,\n            provider:\n                "google_search_grounding+direct_primary_domain_crawl",\n            answer: "",\n            sources,\n            discardedSources,\n            supports: [],\n            facts: [],\n            inferences: [],\n            searchQueries,\n            sourceCount: sources.length,\n            readOnly: true,\n            policy: {\n                citationsRequired: true,\n                consultedSourcesOnly: true,\n                requestedDomainEnforced: true,\n                exactEntityEnforced: false,\n                similarEntitiesDiscarded: false,\n                modelSynthesisFiltered: true,\n                factsSeparatedFromInference: true,\n                duplicatesRemoved: true,\n                codeWrite: false,\n                externalSideEffects: false,\n                googleGroundingUsed: true,\n                freshnessVerified: false\n            }\n        };\n    }\n' + runtime[r:]
          runtime_path.write_text(runtime, encoding='utf-8')
          test_path = Path('tests/jarvis-web-research.test.cjs')
          tests = test_path.read_text(encoding='utf-8')
          title = 'test("current domain research opens grounded sources and returns verified publication dates", async () => {'
          if title not in tests:
              marker = 'test("grounding maps duplicate chunks to one canonical source id", () => {'
              assert marker in tests, 'EXISTING_WEB_RESEARCH_TEST_ANCHOR_NOT_FOUND'
              tests = tests.replace(marker, 'test("current domain research opens grounded sources and returns verified publication dates", async () => {\n    const publishedAt = new Date().toISOString();\n    const sourceUrl =\n        "https://developers.openai.com/api/docs/changelog";\n    const response = {\n        text: "El changelog oficial contiene novedades de la API.",\n        candidates: [{\n            groundingMetadata: {\n                groundingChunks: [{\n                    web: {\n                        uri: sourceUrl,\n                        title: "developers.openai.com"\n                    }\n                }],\n                groundingSupports: [{\n                    segment: {\n                        text: "El changelog oficial contiene novedades de la API."\n                    },\n                    groundingChunkIndices: [0]\n                }],\n                webSearchQueries: ["site:openai.com API changelog"]\n            }\n        }]\n    };\n    const previousFetch = globalThis.fetch;\n    globalThis.fetch = async url => ({\n        ok: true,\n        url: String(url),\n        headers: {\n            get: name =>\n                name === "content-type"\n                    ? "text/html; charset=utf-8"\n                    : ""\n        },\n        text: async () =>\n            `<html><head><title>OpenAI API changelog</title><meta property="article:modified_time" content="${publishedAt}"></head><body><h1>API changelog</h1><p>La API publico una actualizacion verificable y fechada para desarrolladores.</p></body></html>`\n    });\n    try {\n        const result = await runJarvisWebResearch({\n            ai: {\n                models: {\n                    generateContent: async () => response\n                }\n            },\n            query:\n                "Investiga únicamente en openai.com las novedades actuales de la API de OpenAI"\n        });\n        assert.equal(result.grounded, true);\n        assert.equal(result.policy.freshnessVerified, true);\n        assert.match(result.provider, /direct_primary_domain_crawl/);\n        assert.equal(result.sources[0].publishedAt, publishedAt);\n        assert.equal(result.facts[0].publishedAt, publishedAt);\n        assert.match(result.facts[0].claim, /Fecha verificada:/);\n    } finally {\n        globalThis.fetch = previousFetch;\n    }\n});\n\n' + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate Jarvis runtime
        run: npm run ci:test

      - name: Verify sovereign deploy gate
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
        run: node scripts/jarvis-deploy-gate.mjs

      - name: Install Firebase CLI
        if: steps.changes.outputs.functions_changed == 'true' || steps.changes.outputs.hosting_changed == 'true'
        run: npm install -g firebase-tools

      - name: Sync Gemini secret when configured
        if: steps.changes.outputs.functions_changed == 'true'
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          secret_value="${GEMINI_KEY:-$GEMINI_API_KEY}"
          if [ -z "$secret_value" ]; then
            echo "::warning::Gemini credential is not configured; grounded web research remains fail-closed."
            exit 0
          fi

          secret_file="$RUNNER_TEMP/gemini-key"
          trap 'rm -f "$secret_file"' EXIT
          printf '%s' "$secret_value" > "$secret_file"
          chmod 600 "$secret_file"
          firebase functions:secrets:set GEMINI_KEY --data-file "$secret_file" --project fixgo-44e4d --token "$FIREBASE_TOKEN"
          echo "Gemini credential synchronized with Firebase Secret Manager."

      - name: Deploy Hosting
        if: steps.changes.outputs.hosting_changed == 'true'
        run: firebase deploy --only hosting --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Jarvis multifunction services
        if: steps.changes.outputs.functions_changed == 'true'
        run: firebase deploy --only functions:jarvisWebResearch,functions:jarvisSemanticPlan,functions:jarvisSemanticRespond,functions:jarvisImageGenerate,functions:jarvisMediaAnalyze --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Materialize aligned grounded freshness hydration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- functions/jarvis-web-research.js tests/jarvis-web-research.test.cjs; then
            echo 'GROUNDED_FRESHNESS_HYDRATION_ALREADY_MATERIALIZED=true'
            exit 0
          fi
          git diff --check -- functions/jarvis-web-research.js tests/jarvis-web-research.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/jarvis-web-research.js tests/jarvis-web-research.test.cjs
          git commit -m 'fix(jarvis): hydrate grounded sources with existing crawler'
          git push origin "HEAD:v5.9-polish"

      - name: Publish deploy result
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          description='Gestia deploy succeeded'
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            description="Gestia deploy $JOB_STATUS"
          fi
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state "$state" --arg context 'deploy-v5.9-polish' --arg description "$description" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
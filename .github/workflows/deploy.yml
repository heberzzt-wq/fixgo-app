name: Deploy Gestia Hosting

on:
  push:
    branches:
      - main
      - v5.9-polish

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Validate Jarvis runtime
        run: npm run ci:test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting and Jarvis supervision
        run: firebase deploy --only hosting,functions:jarvisDailySupervisor,functions:jarvisSupervisionStatus --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

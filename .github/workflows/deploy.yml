name: Deploy Gestia Hosting

on:
  push:
    branches:
      - main
      - v5.9-polish

permissions:
  contents: write
  statuses: write

concurrency:
  group: deploy-gestia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Publish deploy pending
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'deploy-v5.9-polish' --arg description 'Gestia deploy in progress' --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed runtime surfaces
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$before" HEAD)"
          else
            changed_files="$(git ls-tree -r --name-only HEAD)"
          fi

          if grep -Eq '^(functions/|firebase\.json$|\.firebaserc$|\.github/workflows/deploy\.yml$)' <<<"$changed_files"; then
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions_changed=false" >> "$GITHUB_OUTPUT"
          fi

          hosting_candidates="$(printf '%s\n' "$changed_files" | grep -Ev '^(functions/|tests/|\.github/)' || true)"
          if [ -n "$hosting_candidates" ]; then
            echo "hosting_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "hosting_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Align existing semantic argument completion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('functions/jarvis-semantic-planner.js')
          runtime = runtime_path.read_text(encoding='utf-8')
          marker = 'planKind: "GROUNDED_ARGUMENT_COMPLETION"'
          if marker not in runtime:
              anchor = '    if (missionState?.phase === "COMPLETION_AUDIT") {'
              pos = runtime.find(anchor)
              if pos < 0:
                  raise SystemExit('EXISTING_COMPLETION_AUDIT_ANCHOR_NOT_FOUND')
              block = r'''    if (
        missionState?.phase === "GROUNDED_ARGUMENT_COMPLETION" &&
        safeCatalog.length === 1
    ) {
        const targetTool = safeCatalog[0];
        let lastArgumentError = null;

        for (let attempt = 1; attempt <= 2; attempt += 1) {
            try {
                const argumentResponse = await ai.models.generateContent({
                    model,
                    contents: [
                        "COMPLETADO_DE_ARGUMENTOS_DE_HERRAMIENTA_EXISTENTE:",
                        "La herramienta objetivo ya fue seleccionada por Jarvis. No selecciones otra herramienta y no declares la mision completa.",
                        "Completa sus argumentos usando solamente la instruccion, los argumentos existentes y la evidencia verificable incluida. No inventes datos faltantes.",
                        "Devuelve solamente JSON valido con forma {\"toolCalls\":[{\"name\":\"nombre.exacto\",\"args\":{},\"reason\":\"\"}],\"missionComplete\":false}.",
                        `HERRAMIENTA_OBJETIVO=${JSON.stringify({
                            name: targetTool.name,
                            description: targetTool.description,
                            inputSchema: targetTool.inputSchema
                        })}`,
                        `INSTRUCCION_Y_EVIDENCIA=${instruction}`,
                        attempt > 1
                            ? "REINTENTO: la salida anterior no produjo argumentos ejecutables. Conserva exactamente la herramienta objetivo y completa todos los campos requeridos que la evidencia permita sustentar."
                            : ""
                    ].filter(Boolean).join("\n"),
                    config: {
                        temperature: 0,
                        maxOutputTokens: 3000,
                        thinkingConfig: {
                            thinkingBudget: 0
                        },
                        responseMimeType: "application/json"
                    }
                });
                const payload = extractJsonObject(
                    String(argumentResponse?.text || "")
                );
                const validated = validatePlan(
                    {
                        ...(payload || {}),
                        missionComplete: false
                    },
                    safeCatalog,
                    instruction
                );
                const selected = validated.toolCalls.find(
                    call => call.name === targetTool.name
                );
                if (
                    selected &&
                    hasRequiredToolArguments(
                        targetTool,
                        selected.args || {}
                    )
                ) {
                    return requireExecutablePlan({
                        ...validated,
                        missionComplete: false,
                        provider: String(ai.lastProvider || "gemini"),
                        model,
                        catalogSize: safeCatalog.length,
                        planKind: "GROUNDED_ARGUMENT_COMPLETION"
                    });
                }
                lastArgumentError = new Error(
                    "SEMANTIC_GROUNDED_ARGUMENTS_REQUIRED"
                );
            } catch (error) {
                lastArgumentError = error;
            }
        }

        throw lastArgumentError ||
            new Error("SEMANTIC_GROUNDED_ARGUMENTS_REQUIRED");
    }

'''
              runtime = runtime[:pos] + block + runtime[pos:]
              runtime_path.write_text(runtime, encoding='utf-8')

          test_path = Path('tests/jarvis-semantic-planner.test.cjs')
          tests = test_path.read_text(encoding='utf-8')
          title = 'test("grounded argument completion reuses authenticated Gemini JSON and never falls through to the public planner", async () => {'
          if title not in tests:
              anchor = 'test("semantic response uses the authenticated provider chain and reports provenance", async () => {'
              pos = tests.find(anchor)
              if pos < 0:
                  raise SystemExit('EXISTING_SEMANTIC_RESPONSE_TEST_ANCHOR_NOT_FOUND')
              regression = r'''test("grounded argument completion reuses authenticated Gemini JSON and never falls through to the public planner", async () => {
    const reelTool = {
        name: "reel.plan",
        description: "Completa un reel ya seleccionado.",
        mutates: false,
        requiresApproval: false,
        inputSchema: {
            type: "object",
            required: ["durationSeconds", "scenes"],
            properties: {
                durationSeconds: { type: "integer" },
                scenes: {
                    type: "array",
                    minItems: 1,
                    items: {
                        type: "object",
                        required: ["id", "durationSeconds"],
                        properties: {
                            id: { type: "string" },
                            durationSeconds: { type: "integer" }
                        }
                    }
                }
            },
            additionalProperties: false
        }
    };
    let attempts = 0;
    const result = await runJarvisSemanticPlanner({
        input: "Completa reel.plan con la evidencia actual.",
        catalog: [reelTool],
        missionState: {
            phase: "GROUNDED_ARGUMENT_COMPLETION",
            toolName: "reel.plan",
            sourceCount: 2,
            writeAllowed: false
        },
        ai: {
            lastProvider: "vertex-adc",
            models: {
                generateContent: async request => {
                    attempts += 1;
                    assert.equal(
                        request.config.responseMimeType,
                        "application/json"
                    );
                    assert.equal(
                        Object.prototype.hasOwnProperty.call(
                            request.config,
                            "tools"
                        ),
                        false
                    );
                    if (attempts === 1) {
                        return {
                            text: JSON.stringify({
                                toolCalls: [],
                                missionComplete: false
                            })
                        };
                    }
                    return {
                        text: JSON.stringify({
                            toolCalls: [{
                                name: "reel.plan",
                                args: {
                                    durationSeconds: 30,
                                    scenes: [{
                                        id: "scene-1",
                                        durationSeconds: 30
                                    }]
                                },
                                reason: "argumentos sustentados"
                            }],
                            missionComplete: false
                        })
                    };
                }
            }
        },
        simpleFetchImpl: async () => {
            throw new Error("SIMPLE_FALLBACK_MUST_NOT_RUN");
        },
        fetchImpl: async () => {
            throw new Error("PUBLIC_FALLBACK_MUST_NOT_RUN");
        }
    });

    assert.equal(attempts, 2);
    assert.equal(result.provider, "vertex-adc");
    assert.equal(result.planKind, "GROUNDED_ARGUMENT_COMPLETION");
    assert.equal(result.toolCalls[0].name, "reel.plan");
    assert.equal(result.toolCalls[0].args.durationSeconds, 30);
    assert.equal(result.toolCalls[0].args.scenes.length, 1);
});

'''
              tests = tests[:pos] + regression + tests[pos:]
              test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate Jarvis runtime
        run: npm run ci:test

      - name: Verify sovereign deploy gate
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
        run: node scripts/jarvis-deploy-gate.mjs

      - name: Install Firebase CLI
        if: steps.changes.outputs.functions_changed == 'true' || steps.changes.outputs.hosting_changed == 'true'
        run: npm install -g firebase-tools

      - name: Sync Gemini secret when configured
        if: steps.changes.outputs.functions_changed == 'true'
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          secret_value="${GEMINI_KEY:-$GEMINI_API_KEY}"
          if [ -z "$secret_value" ]; then
            echo "::warning::Gemini credential is not configured; authenticated provider chain will rely on its existing Vertex ADC path."
            exit 0
          fi
          secret_file="$RUNNER_TEMP/gemini-key"
          trap 'rm -f "$secret_file"' EXIT
          printf '%s' "$secret_value" > "$secret_file"
          chmod 600 "$secret_file"
          firebase functions:secrets:set GEMINI_KEY --data-file "$secret_file" --project fixgo-44e4d --token "$FIREBASE_TOKEN"

      - name: Deploy Hosting
        if: steps.changes.outputs.hosting_changed == 'true'
        run: firebase deploy --only hosting --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Jarvis multifunction services
        if: steps.changes.outputs.functions_changed == 'true'
        run: firebase deploy --only functions:jarvisWebResearch,functions:jarvisSemanticPlan,functions:jarvisSemanticRespond,functions:jarvisImageGenerate,functions:jarvisMediaAnalyze --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Materialize aligned semantic argument completion
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- functions/jarvis-semantic-planner.js tests/jarvis-semantic-planner.test.cjs
          if git diff --quiet -- functions/jarvis-semantic-planner.js tests/jarvis-semantic-planner.test.cjs; then
            echo 'SEMANTIC_ARGUMENT_COMPLETION_ALREADY_MATERIALIZED=true'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/jarvis-semantic-planner.js tests/jarvis-semantic-planner.test.cjs
          git commit -m 'fix(jarvis): reuse authenticated planner for grounded arguments'
          git push origin "HEAD:v5.9-polish"

      - name: Publish deploy result
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          description='Gestia deploy succeeded'
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            description="Gestia deploy $JOB_STATUS"
          fi
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state "$state" --arg context 'deploy-v5.9-polish' --arg description "$description" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

name: Deploy Gestia Hosting

on:
  push:
    branches:
      - main
      - v5.9-polish

permissions:
  contents: write
  statuses: write

concurrency:
  group: deploy-gestia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Publish deploy pending
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'deploy-v5.9-polish' --arg description 'Gestia deploy in progress' --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed runtime surfaces
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$before" HEAD)"
          else
            changed_files="$(git ls-tree -r --name-only HEAD)"
          fi

          if grep -Eq '^(functions/|firebase\.json$|\.firebaserc$|\.github/workflows/deploy\.yml$)' <<<"$changed_files"; then
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions_changed=false" >> "$GITHUB_OUTPUT"
          fi

          hosting_candidates="$(printf '%s\n' "$changed_files" | grep -Ev '^(functions/|tests/|\.github/)' || true)"
          if [ -n "$hosting_candidates" ]; then
            echo "hosting_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "hosting_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Align existing grounded freshness hydration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('functions/jarvis-web-research.js')
          runtime = runtime_path.read_text(encoding='utf-8')

          direct_start = runtime.find('async function runJarvisDirectDomainResearch')
          web_start = runtime.find('async function runJarvisWebResearch', direct_start)
          if direct_start < 0 or web_start < 0:
              raise SystemExit('EXISTING_DIRECT_RESEARCH_BLOCK_NOT_FOUND')

          if 'seedUrls = []' not in runtime[direct_start:web_start]:
              signature_anchor = '    allowedDomain = "",\n'
              signature_pos = runtime.find(signature_anchor, direct_start, web_start)
              if signature_pos < 0:
                  raise SystemExit('EXISTING_DIRECT_RESEARCH_SIGNATURE_NOT_FOUND')
              insertion_pos = signature_pos + len(signature_anchor)
              runtime = runtime[:insertion_pos] + '    seedUrls = [],\n' + runtime[insertion_pos:]
              web_start = runtime.find('async function runJarvisWebResearch', direct_start)

          if 'const normalizedSeedUrls =' not in runtime[direct_start:web_start]:
              queue_pos = runtime.find('    if (entryUrls.length > 0) {', direct_start, web_start)
              pages_pos = runtime.find('    const pages = [];', queue_pos, web_start)
              if queue_pos < 0 or pages_pos < 0:
                  raise SystemExit('EXISTING_DIRECT_RESEARCH_QUEUE_NOT_FOUND')
              seed_block = '''    const normalizedSeedUrls =
                  Array.isArray(seedUrls)
                      ? seedUrls
                      : [];
              normalizedSeedUrls
                  .slice(0, 12)
                  .forEach((seedUrl, index) => {
                      try {
                          const parsed =
                              new URL(String(seedUrl || ""));
                          parsed.hash = "";
                          parsed.search = "";
                          if (
                              parsed.protocol === "https:" &&
                              sourceMatchesDomain(
                                  { url: parsed.href },
                                  domain
                              )
                          ) {
                              enqueue(
                                  parsed.href,
                                  Number.MAX_SAFE_INTEGER - index
                              );
                          }
                      } catch {
                          return;
                      }
                  });
              if (
                  queue.length === 0 &&
                  entryUrls.length > 0
              ) {
                  enqueue(
                      entryUrls.shift(),
                      Number.MAX_SAFE_INTEGER
                  );
              }

              '''.replace('              ', '')
              runtime = runtime[:queue_pos] + seed_block + runtime[pages_pos:]
              web_start = runtime.find('async function runJarvisWebResearch', direct_start)

          if 'publishedAt: page.publishedAt || null' not in runtime[direct_start:web_start]:
              claim_line = '        claim: [page.title, ...page.headings, ...page.paragraphs].filter(Boolean).join(" | ").slice(0, 2400),\n'
              claim_pos = runtime.find(claim_line, direct_start, web_start)
              if claim_pos < 0:
                  raise SystemExit('EXISTING_DIRECT_RESEARCH_FACT_NOT_FOUND')
              claim_replacement = '''        claim: [
                  page.publishedAt
                      ? `Fecha verificada: ${page.publishedAt}`
                      : "",
                  page.title,
                  ...page.headings,
                  ...page.paragraphs
              ].filter(Boolean).join(" | ").slice(0, 2400),
              publishedAt: page.publishedAt || null,
              '''.replace('              ', '')
              runtime = runtime[:claim_pos] + claim_replacement + runtime[claim_pos + len(claim_line):]
              web_start = runtime.find('async function runJarvisWebResearch', direct_start)

          direct_block = runtime[direct_start:web_start]
          success_policy_pos = direct_block.find('        policy: {', direct_block.find('    const supports = facts.map'))
          if success_policy_pos < 0:
              raise SystemExit('EXISTING_DIRECT_RESEARCH_SUCCESS_POLICY_NOT_FOUND')
          absolute_policy_pos = direct_start + success_policy_pos
          fallback_pos = runtime.find('            fallbackReason:', absolute_policy_pos, web_start)
          freshness_pos = runtime.find('            freshnessVerified:', absolute_policy_pos, fallback_pos if fallback_pos > 0 else web_start)
          if freshness_pos < 0:
              if fallback_pos < 0:
                  raise SystemExit('EXISTING_DIRECT_RESEARCH_FALLBACK_POLICY_NOT_FOUND')
              policy_insert = '''            freshnessVerified:
                  directFreshnessWindowDays
                      ? true
                      : null,
              '''.replace('              ', '')
              runtime = runtime[:fallback_pos] + policy_insert + runtime[fallback_pos:]
              web_start = runtime.find('async function runJarvisWebResearch', direct_start)

          if 'google_search_grounding+direct_primary_domain_crawl' not in runtime[web_start:]:
              entity_pos = runtime.find('    const entityNotVerified =', web_start)
              return_pos = runtime.find('\n\n    return {', entity_pos)
              if entity_pos < 0 or return_pos < 0:
                  raise SystemExit('EXISTING_GROUNDED_FRESHNESS_HYDRATION_ANCHOR_NOT_FOUND')
              hydration = '''

    const freshnessWindowDays =
        directResearchFreshnessWindowDays(
            normalizedQuery
        );
    if (
        freshnessWindowDays &&
        requestedDomain &&
        !entityNotVerified &&
        sources.length > 0
    ) {
        let directVerification = null;
        try {
            directVerification =
                await runJarvisDirectDomainResearch({
                    fetchImpl:
                        globalThis.fetch,
                    query:
                        normalizedQuery,
                    allowedDomain:
                        requestedDomain,
                    seedUrls:
                        sources.map(source =>
                            source.url
                        ),
                    objectiveId,
                    caseId,
                    maximumPages:
                        Math.min(
                            6,
                            Math.max(
                                2,
                                sources.length
                            )
                        ),
                    fallbackReason:
                        "GROUNDED_SOURCE_FRESHNESS_VERIFICATION"
                });
        } catch {
            directVerification = null;
        }

        if (
            directVerification?.grounded &&
            directVerification?.sourceCount > 0
        ) {
            return {
                ...directVerification,
                engine:
                    "jarvis_grounded_web_research",
                model,
                query:
                    groundedQuery,
                provider:
                    "google_search_grounding+direct_primary_domain_crawl",
                searchQueries,
                discardedSources: [
                    ...discardedSources,
                    ...(
                        directVerification
                            .discardedSources ||
                        []
                    )
                ],
                policy: {
                    ...directVerification.policy,
                    googleGroundingUsed: true,
                    freshnessVerified: true
                }
            };
        }

        return {
            ok: false,
            grounded: false,
            engine:
                "jarvis_grounded_web_research",
            model,
            query:
                groundedQuery,
            requestedDomain,
            exactEntity: null,
            objectiveId:
                String(objectiveId || ""),
            caseId:
                String(caseId || ""),
            researchedAt,
            provider:
                "google_search_grounding+direct_primary_domain_crawl",
            answer: "",
            sources,
            discardedSources,
            supports: [],
            facts: [],
            inferences: [],
            searchQueries,
            sourceCount:
                sources.length,
            readOnly: true,
            policy: {
                citationsRequired: true,
                consultedSourcesOnly: true,
                requestedDomainEnforced: true,
                exactEntityEnforced: false,
                similarEntitiesDiscarded: false,
                modelSynthesisFiltered: true,
                factsSeparatedFromInference: true,
                duplicatesRemoved: true,
                codeWrite: false,
                externalSideEffects: false,
                googleGroundingUsed: true,
                freshnessVerified: false
            }
        };
    }'''
              runtime = runtime[:return_pos] + hydration + runtime[return_pos:]

          runtime_path.write_text(runtime, encoding='utf-8')

          test_path = Path('tests/jarvis-web-research.test.cjs')
          tests = test_path.read_text(encoding='utf-8')
          test_title = 'test("current domain research opens grounded sources and returns verified publication dates", async () => {'
          if test_title not in tests:
              marker = 'test("grounding maps duplicate chunks to one canonical source id", () => {'
              if marker not in tests:
                  raise SystemExit('EXISTING_WEB_RESEARCH_TEST_ANCHOR_NOT_FOUND')
              regression = (
                  'test("current domain research opens grounded sources and returns verified publication dates", async () => {\n'
                  '    const publishedAt = new Date().toISOString();\n'
                  '    const sourceUrl = "https://developers.openai.com/api/docs/changelog";\n'
                  '    const response = { text: "El changelog oficial contiene novedades de la API.", candidates: [{ groundingMetadata: { groundingChunks: [{ web: { uri: sourceUrl, title: "Changelog - OpenAI API" } }], groundingSupports: [{ segment: { text: "El changelog oficial contiene novedades de la API." }, groundingChunkIndices: [0] }], webSearchQueries: ["site:openai.com API changelog"] } }] };\n'
                  '    const previousFetch = globalThis.fetch;\n'
                  '    globalThis.fetch = async url => ({ ok: true, url: String(url), headers: { get: name => name === "content-type" ? "text/html; charset=utf-8" : "" }, text: async () => `<html><head><title>OpenAI API changelog</title><meta property="article:modified_time" content="${publishedAt}"></head><body><h1>API changelog</h1><p>La API publico una actualizacion verificable y fechada para desarrolladores.</p></body></html>` });\n'
                  '    try {\n'
                  '        const result = await runJarvisWebResearch({ ai: { models: { generateContent: async () => response } }, query: "Investiga únicamente en openai.com las novedades actuales de la API de OpenAI" });\n'
                  '        assert.equal(result.grounded, true);\n'
                  '        assert.equal(result.policy.freshnessVerified, true);\n'
                  '        assert.match(result.provider, /direct_primary_domain_crawl/);\n'
                  '        assert.equal(result.sources[0].publishedAt, publishedAt);\n'
                  '        assert.equal(result.facts[0].publishedAt, publishedAt);\n'
                  '        assert.match(result.facts[0].claim, /Fecha verificada:/);\n'
                  '    } finally {\n'
                  '        globalThis.fetch = previousFetch;\n'
                  '    }\n'
                  '});\n\n'
              )
              tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate Jarvis runtime
        run: npm run ci:test

      - name: Verify sovereign deploy gate
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
        run: node scripts/jarvis-deploy-gate.mjs

      - name: Install Firebase CLI
        if: steps.changes.outputs.functions_changed == 'true' || steps.changes.outputs.hosting_changed == 'true'
        run: npm install -g firebase-tools

      - name: Sync Gemini secret when configured
        if: steps.changes.outputs.functions_changed == 'true'
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          secret_value="${GEMINI_KEY:-$GEMINI_API_KEY}"
          if [ -z "$secret_value" ]; then
            echo "::warning::Gemini credential is not configured; grounded web research remains fail-closed."
            exit 0
          fi

          secret_file="$RUNNER_TEMP/gemini-key"
          trap 'rm -f "$secret_file"' EXIT
          printf '%s' "$secret_value" > "$secret_file"
          chmod 600 "$secret_file"
          firebase functions:secrets:set GEMINI_KEY --data-file "$secret_file" --project fixgo-44e4d --token "$FIREBASE_TOKEN"
          echo "Gemini credential synchronized with Firebase Secret Manager."

      - name: Deploy Hosting
        if: steps.changes.outputs.hosting_changed == 'true'
        run: firebase deploy --only hosting --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Jarvis multifunction services
        if: steps.changes.outputs.functions_changed == 'true'
        run: firebase deploy --only functions:jarvisWebResearch,functions:jarvisSemanticPlan,functions:jarvisSemanticRespond,functions:jarvisImageGenerate,functions:jarvisMediaAnalyze --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Materialize aligned grounded freshness hydration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- functions/jarvis-web-research.js tests/jarvis-web-research.test.cjs; then
            echo 'GROUNDED_FRESHNESS_HYDRATION_ALREADY_MATERIALIZED=true'
            exit 0
          fi
          git diff --check -- functions/jarvis-web-research.js tests/jarvis-web-research.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/jarvis-web-research.js tests/jarvis-web-research.test.cjs
          git commit -m 'fix(jarvis): hydrate grounded sources with existing crawler'
          git push origin "HEAD:v5.9-polish"

      - name: Publish deploy result
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          description='Gestia deploy succeeded'
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            description="Gestia deploy ${JOB_STATUS}"
          fi
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state "$state" --arg context 'deploy-v5.9-polish' --arg description "$description" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

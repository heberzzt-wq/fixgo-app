name: Deploy Gestia Hosting

on:
  push:
    branches:
      - main
      - v5.9-polish

permissions:
  contents: write
  statuses: write

concurrency:
  group: deploy-gestia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Publish deploy pending
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'deploy-v5.9-polish' --arg description 'Gestia deploy in progress' --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed runtime surfaces
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$before" HEAD)"
          else
            changed_files="$(git ls-tree -r --name-only HEAD)"
          fi

          if grep -Eq '^(functions/|firebase\.json$|\.firebaserc$|\.github/workflows/deploy\.yml$)' <<<"$changed_files"; then
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions_changed=false" >> "$GITHUB_OUTPUT"
          fi

          hosting_candidates="$(printf '%s\n' "$changed_files" | grep -Ev '^(functions/|tests/|\.github/)' || true)"
          if [ -n "$hosting_candidates" ]; then
            echo "hosting_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "hosting_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Apply bare-domain grounded research recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('functions/jarvis-web-research.js')
          runtime = runtime_path.read_text(encoding='utf-8')

          old_domain = '''function requestedDomainFromQuery(query = "", explicitDomain = "") {
              if (explicitDomain) {
                  try {
                      return cleanHost(new URL(explicitDomain.includes("://") ? explicitDomain : `https://${explicitDomain}`).hostname);
                  } catch {
                      return "";
                  }
              }

              const trailing = new Set([".", ",", ";", ":", ")", "]", "}", "!", "?", "\\\"", "'"]);
              for (const rawToken of String(query || "").split(" ")) {
                  let token = rawToken.trim();
                  while (token && trailing.has(token.at(-1))) token = token.slice(0, -1);
                  if (!token.includes("://")) continue;
                  try {
                      const parsed = new URL(token);
                      if (parsed.protocol === "https:" || parsed.protocol === "http:") return cleanHost(parsed.hostname);
                  } catch {
                      continue;
                  }
              }
              return "";
          }'''.replace('          ', '')

          new_domain = '''function requestedDomainFromQuery(query = "", explicitDomain = "") {
              const leading = new Set(["(", "[", "{", "<", "\\\"", "'"]);
              const trailing = new Set([".", ",", ";", ":", ")", "]", "}", ">", "!", "?", "\\\"", "'"]);
              const parseCandidate = value => {
                  let token = String(value || "").trim();
                  while (token && leading.has(token[0])) token = token.slice(1);
                  while (token && trailing.has(token.at(-1))) token = token.slice(0, -1);
                  if (!token || token.includes("@")) return "";
                  try {
                      const parsed = new URL(token.includes("://") ? token : `https://${token}`);
                      if (parsed.protocol !== "https:" && parsed.protocol !== "http:") return "";
                      const host = String(parsed.hostname || "").trim().toLowerCase();
                      if (!/^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$/i.test(host)) return "";
                      return cleanHost(host);
                  } catch {
                      return "";
                  }
              };

              if (explicitDomain) return parseCandidate(explicitDomain);

              for (const rawToken of String(query || "").split(/\\s+/)) {
                  const domain = parseCandidate(rawToken);
                  if (domain) return domain;
              }
              return "";
          }'''.replace('          ', '')

          if old_domain in runtime:
              runtime = runtime.replace(old_domain, new_domain, 1)
          elif new_domain not in runtime:
              raise SystemExit('BARE_DOMAIN_RUNTIME_ANCHOR_NOT_FOUND')

          old_host = '        if (token.includes("://")) addHost(token);'
          new_host = '''        if (
              requestedDomainFromQuery(token) === domain
          ) {
              addHost(token);
          }'''.replace('          ', '        ')
          if old_host in runtime:
              runtime = runtime.replace(old_host, new_host, 1)
          elif 'requestedDomainFromQuery(token) === domain' not in runtime:
              raise SystemExit('BARE_DOMAIN_HOST_ANCHOR_NOT_FOUND')

          runtime_path.write_text(runtime, encoding='utf-8')

          test_path = Path('tests/jarvis-web-research.test.cjs')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'test("grounding maps duplicate chunks to one canonical source id", () => {'
          regression = '''test("bare requested domains activate the primary-domain fallback without protocol", () => {
              const query =
                  "Investiga únicamente en openai.com las novedades actuales de la API de OpenAI";
              assert.equal(
                  requestedDomainFromQuery(query),
                  "openai.com"
              );
              assert.deepEqual(
                  requestedHostsFromQuery(query).slice(0, 2),
                  ["openai.com", "www.openai.com"]
              );
              assert.equal(
                  requestedDomainFromQuery("Escribe a soporte@openai.com"),
                  ""
              );
          });

          '''.replace('          ', '')
          if regression.strip() not in tests:
              if marker not in tests:
                  raise SystemExit('BARE_DOMAIN_TEST_ANCHOR_NOT_FOUND')
              tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate Jarvis runtime
        run: npm run ci:test

      - name: Verify sovereign deploy gate
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
        run: node scripts/jarvis-deploy-gate.mjs

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Sync Gemini secret when configured
        if: steps.changes.outputs.functions_changed == 'true'
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          secret_value="${GEMINI_KEY:-$GEMINI_API_KEY}"
          if [ -z "$secret_value" ]; then
            echo "::warning::Gemini credential is not configured; grounded web research remains fail-closed."
            exit 0
          fi

          secret_file="$RUNNER_TEMP/gemini-key"
          trap 'rm -f "$secret_file"' EXIT
          printf '%s' "$secret_value" > "$secret_file"
          chmod 600 "$secret_file"
          firebase functions:secrets:set GEMINI_KEY --data-file "$secret_file" --project fixgo-44e4d --token "$FIREBASE_TOKEN"
          echo "Gemini credential synchronized with Firebase Secret Manager."

      - name: Deploy Hosting
        if: steps.changes.outputs.hosting_changed == 'true'
        run: firebase deploy --only hosting --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Jarvis multifunction services
        if: steps.changes.outputs.functions_changed == 'true'
        run: firebase deploy --only functions:jarvisWebResearch,functions:jarvisSemanticPlan,functions:jarvisSemanticRespond,functions:jarvisImageGenerate,functions:jarvisMediaAnalyze --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Materialize bare-domain research recovery
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- functions/jarvis-web-research.js tests/jarvis-web-research.test.cjs; then
            echo 'BARE_DOMAIN_RECOVERY_ALREADY_MATERIALIZED=true'
            exit 0
          fi
          git diff --check -- functions/jarvis-web-research.js tests/jarvis-web-research.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/jarvis-web-research.js tests/jarvis-web-research.test.cjs
          git commit -m 'fix(jarvis): accept bare domains for grounded fallback'
          git push origin "HEAD:v5.9-polish"

      - name: Publish deploy result
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          description='Gestia deploy succeeded'
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            description="Gestia deploy ${JOB_STATUS}"
          fi
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state "$state" --arg context 'deploy-v5.9-polish' --arg description "$description" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

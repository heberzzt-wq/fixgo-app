name: Deploy Gestia Hosting

on:
  push:
    branches:
      - main
      - v5.9-polish

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-gestia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Publish deploy pending
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state pending --arg context 'deploy-v5.9-polish' --arg description 'Gestia deploy in progress' --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed runtime surfaces
        id: changes
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$before" HEAD)"
          else
            changed_files="$(git ls-tree -r --name-only HEAD)"
          fi

          if grep -Eq '^(functions/|firebase\.json$|\.firebaserc$|\.github/workflows/deploy\.yml$)' <<<"$changed_files"; then
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions_changed=false" >> "$GITHUB_OUTPUT"
          fi

          hosting_candidates="$(printf '%s\n' "$changed_files" | grep -Ev '^(functions/|\.github/workflows/deploy\.yml$)' || true)"
          if [ -n "$hosting_candidates" ]; then
            echo "hosting_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "hosting_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Validate Jarvis runtime
        run: npm run ci:test

      - name: Verify sovereign deploy gate
        env:
          JARVIS_CI_PASSED: "true"
          JARVIS_FIREBASE_PROJECT: fixgo-44e4d
        run: node scripts/jarvis-deploy-gate.mjs

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Sync Gemini secret when configured
        if: steps.changes.outputs.functions_changed == 'true'
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          secret_value="${GEMINI_KEY:-$GEMINI_API_KEY}"
          if [ -z "$secret_value" ]; then
            echo "::warning::Gemini credential is not configured; grounded web research remains fail-closed."
            exit 0
          fi

          secret_file="$RUNNER_TEMP/gemini-key"
          trap 'rm -f "$secret_file"' EXIT
          printf '%s' "$secret_value" > "$secret_file"
          chmod 600 "$secret_file"
          firebase functions:secrets:set GEMINI_KEY --data-file "$secret_file" --project fixgo-44e4d --token "$FIREBASE_TOKEN"
          echo "Gemini credential synchronized with Firebase Secret Manager."

      - name: Deploy Hosting
        if: steps.changes.outputs.hosting_changed == 'true'
        run: firebase deploy --only hosting --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Jarvis multifunction services
        if: steps.changes.outputs.functions_changed == 'true'
        run: firebase deploy --only functions:jarvisDailySupervisor,functions:jarvisSupervisionStatus,functions:jarvisSupervisionRunNow,functions:jarvisWebResearch,functions:jarvisImageGenerate,functions:jarvisMediaAnalyze,functions:jarvisSemanticPlan,functions:jarvisSemanticRespond --project fixgo-44e4d --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Publish deploy result
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          description='Gestia deploy succeeded'
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            description="Gestia deploy ${JOB_STATUS}"
          fi
          target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state "$state" --arg context 'deploy-v5.9-polish' --arg description "$description" --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

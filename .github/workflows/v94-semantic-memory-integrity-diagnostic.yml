name: V94 semantic memory and artifact integrity diagnostic

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v94-semantic-memory-integrity-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Establish branch and Functions isolation
        run: |
          set -euo pipefail
          {
            printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
            printf 'BRANCH=%s\n' "$(git branch --show-current)"
            git status --short
          } | tee /tmp/v94-branch.log
          test "$(git branch --show-current)" = "v94-media-v4n-negative-claims"

      - name: Locate semantic memory wiring
        run: |
          set -euo pipefail
          {
            echo '=== MEMORY FILES ==='
            grep -RInE 'createProjectMemory|JarvisContextMemory|resolveReferences|PUSH_HISTORY|jarvis\.missions|longTermPointers|HISTORY_TTL|MAX_HISTORY' \
              gestia-core gestia-terminal.js gestia-terminal.html modules tests 2>/dev/null | head -n 400 || true
            echo '=== PLANNER REQUEST / CONTEXT ==='
            grep -nE 'ENDPOINT|fetch\(|missionState|continuationContext|memory|conversationId|originalInstruction|body:' \
              gestia-core/jarvis/jarvis.multifunction.planner.js | head -n 350 || true
          } | tee /tmp/v94-memory-wiring.log

      - name: Inspect terminal startup and boot logs
        run: |
          set -euo pipefail
          {
            echo '=== HTML MODULE ORDER ==='
            grep -nE '<script|gestia-core|gestia-terminal|tools\.runtime|tools\.bridge|response\.composer|context\.memory|firebase\.js|gestia\.runtime' gestia-terminal.html || true
            echo '=== TERMINAL BOOT / AUTH / MEMORY ==='
            grep -nE 'JarvisMemory\.boot|DOMContentLoaded|onAuthStateChanged|restore[A-Za-z]*\(|boot\(|ONLINE|READY|INIT|KERNEL|cognitiveDB|PUSH_HISTORY|console\.(log|warn|error)' gestia-terminal.js | head -n 900 || true
            echo '=== CORE BOOT / RUNTIME REGISTRATION ==='
            grep -nE '^import |registerJarvis|JarvisToolRuntime|JarvisAutonomyEngine|console\.(log|warn|error)|ONLINE|READY|INIT' gestia-core/gestia-core.js | head -n 700 || true
            echo '=== DUPLICATE SCRIPT URL BASENAMES ==='
            python - <<'PY'
          from pathlib import Path
          import re
          text=Path('gestia-terminal.html').read_text(encoding='utf-8')
          srcs=re.findall(r'src=["\']([^"\']+)["\']', text)
          by={}
          for src in srcs:
              base=src.split('?',1)[0]
              by.setdefault(base,[]).append(src)
          for base,items in sorted(by.items()):
              if len(items)>1:
                  print(base, '=>', items)
          PY
          } | tee /tmp/v94-terminal-startup.log

      - name: Locate artifact generation and grounding boundaries
        run: |
          set -euo pipefail
          {
            echo '=== ARTIFACT TOOL REGISTRATION ==='
            grep -RInE 'document\.create|spreadsheet|workbook|presentation|pptx|PptxGenJS|page\.create|image\.generate|reel\.create|contentSource|SPREADSHEET_BLUEPRINT_READY|DOCUMENT_CONTENT_COMPOSED' \
              gestia-core jarvis-*.js nexo-*.js tests 2>/dev/null | head -n 900 || true
            echo '=== PLACEHOLDER / GENERIC MARKETING RESIDUE ==='
            grep -RInE 'placeholder|WHEN_INFRASTRUCTURE_AVAILABLE|instruction_inference|clientes potenciales relevantes|fricción entre una necesidad real|proveedores informales|presupuesto piloto por definir|Google My Business|técnicos certificados|Tecnicos certificados' \
              gestia-core/jarvis gestia-core/nexo tests 2>/dev/null | head -n 600 || true
          } | tee /tmp/v94-artifact-grounding.log

      - name: Locate existing learning persistence
        run: |
          set -euo pipefail
          grep -RInE 'LEARNING_INCIDENT|recordAgentLoopLearningIncident|recallAgentLoopLearningHints|JarvisAutonomyEngine|learning' \
            gestia-core gestia-terminal.js tests 2>/dev/null | head -n 600 | tee /tmp/v94-learning.log || true

      - name: Baseline focused tests
        run: |
          set -o pipefail
          node --test \
            tests/jarvis-marketing-real-delivery.test.mjs \
            tests/jarvis-marketing-terminal-delivery.e2e.test.mjs \
            tests/jarvis-marketing-engine-v2.test.mjs \
            tests/jarvis-mission-orchestrator.test.mjs \
            tests/single-semantic-authority.test.mjs \
            2>&1 | tee /tmp/v94-baseline-focused.log

      - name: Verify diagnostic made no product changes
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -z "$(git diff --name-only -- functions)"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v94-semantic-memory-integrity-diagnostic
          path: |
            /tmp/v94-branch.log
            /tmp/v94-memory-wiring.log
            /tmp/v94-terminal-startup.log
            /tmp/v94-artifact-grounding.log
            /tmp/v94-learning.log
            /tmp/v94-baseline-focused.log
          if-no-files-found: warn
          retention-days: 7

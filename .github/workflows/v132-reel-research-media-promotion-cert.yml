name: v132-reel-research-media-promotion-cert

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - .github/workflows/v132-reel-research-media-promotion-cert.yml
      - gestia-core/jarvis/jarvis.multifunction.planner.js
      - tests/jarvis-reel-researched-media-v132.test.mjs
      - package.json

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Functions test dependencies without modifying source
        run: npm ci --prefix functions
      - name: Guard branch and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v94-media-v4n-negative-claims"
          ! git diff --name-only a09d76c5d42117aa88630f7b0d5fee75290525b2..HEAD | grep -E '^functions/'
      - name: Confirm v132 staging cleanup
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/scripts/v132-reel-research-media-promotion.py
          test ! -e .github/workflows/v132-reel-research-media-promotion-apply.yml
      - name: Focal v132
        run: |
          node --check gestia-core/jarvis/jarvis.multifunction.planner.js
          node --test tests/jarvis-reel-researched-media-v132.test.mjs tests/jarvis-semantic-planner.test.cjs
      - name: Full CI
        run: npm run ci:test
      - name: Reject whitespace errors
        run: git diff --check
      - name: Certification marker
        run: |
          echo "V132_RESEARCH_MEDIA_PROMOTION_CERTIFIED=true"
          echo "V132_RESEARCH_SOURCE_POLICY=VERIFIED_EVIDENCE_ONLY"
          echo "V132_AMBIGUOUS_SOURCE_POLICY=FAIL_CLOSED"
          echo "V132_STAGING_CLEAN=true"
          echo "V132_FUNCTIONS_UNCHANGED=true"

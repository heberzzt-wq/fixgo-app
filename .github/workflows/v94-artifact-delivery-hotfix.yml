name: V94 Marketing Artifact Delivery Hotfix

on:
  push:
    branches:
      - v94-handoff-ee6d8cfe
    paths:
      - .github/workflows/v94-artifact-delivery-hotfix.yml

concurrency:
  group: v94-marketing-artifact-delivery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair-test-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FIREBASE_PROJECT: fixgo-44e4d
    steps:
      - name: Checkout handoff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v94-handoff-ee6d8cfe

      - name: Verify protected scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v94-handoff-ee6d8cfe"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 3943a0fb82e5347f3cac66a3f7ed5052b61157d4 HEAD
          test -f V95-multimodal-batch-integrity.patch || true

      - name: Apply marketing artifact delivery hotfix
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{label}: expected block not found in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          compiler = Path("gestia-core/nexo/nexo.mission.compiler.js")
          text = compiler.read_text(encoding="utf-8")
          text = text.replace(
              'export const NEXO_MISSION_COMPILER_VERSION = "1.0.0-one-instruction-artifacts";',
              'export const NEXO_MISSION_COMPILER_VERSION = "1.1.0-downloadable-marketing-artifacts";',
              1
          )
          old_infer = '''function inferBrand(instruction = "", context = {}) {
              const text = normalize(instruction);
              if (text.includes("peninsula tech") || text.includes("península tech")) {
                  return "Peninsula Tech";
              }
              if (text.includes("gestiapremium") || text.includes("gestia premium")) {
                  return "GestiaPremium";
              }
              if (text.includes("fixgo") || text.includes("fix go")) {
                  return "FixGo";
              }
              return clean(context.brandName || context.name, 120) || "Peninsula Tech";
          }
          '''
          new_infer = '''function inferBrand(instruction = "", context = {}) {
              const source = clean(instruction, 12000);
              const namedMarketingTarget = source.match(
                  /\\b(?:plan|programa)\\s+de\\s+marketing\\b.{0,160}?\\bpara\\s+(.+?)(?:[.,;]|$)/i
              )?.[1]?.trim() || "";
              if (namedMarketingTarget) {
                  return clean(namedMarketingTarget, 120);
              }

              const text = normalize(source);
              if (text.includes("peninsula tech") || text.includes("península tech")) {
                  return "Peninsula Tech";
              }
              if (text.includes("gestiapremium") || text.includes("gestia premium")) {
                  return "GestiaPremium";
              }
              if (text.includes("fixgo") || text.includes("fix go")) {
                  return "FixGo";
              }
              return clean(context.brandName || context.name, 120) || "Peninsula Tech";
          }
          '''
          if old_infer not in text:
              raise SystemExit("compiler inferBrand block not found")
          text = text.replace(old_infer, new_infer, 1)

          old_marketing = '''    if (deliverables.marketing) {
              calls.push(buildCall("marketing.plan", campaign));
              calls.push(buildCall("document.create", {
                  format: "json",
                  title: `${campaign.brandName} - Programa de marketing`,
                  content: marketingDocumentContent(instruction, context),
                  objectiveId: clean(context.objectiveId, 180),
                  caseId: clean(context.caseId, 180)
              }, "NEXO_MARKETING_PROGRAM_ARTIFACT"));
          }
          '''
          new_marketing = '''    if (deliverables.marketing) {
              calls.push(buildCall("marketing.plan", campaign));
              calls.push(buildCall("document.create", {
                  format: "md",
                  title: `Plan de marketing completo — ${campaign.brandName}`,
                  objectiveId: clean(context.objectiveId, 180),
                  caseId: clean(context.caseId, 180)
              }, "NEXO_MARKETING_MARKDOWN_ARTIFACT"));
              calls.push(buildCall("document.create", {
                  format: "pdf",
                  title: `Plan de marketing completo — ${campaign.brandName}`,
                  objectiveId: clean(context.objectiveId, 180),
                  caseId: clean(context.caseId, 180)
              }, "NEXO_MARKETING_PDF_ARTIFACT"));
          }
          '''
          if old_marketing not in text:
              raise SystemExit("compiler marketing artifact block not found")
          text = text.replace(old_marketing, new_marketing, 1)
          compiler.write_text(text, encoding="utf-8")

          presenter = Path("gestia-core/jarvis/jarvis.marketing.presenter.js")
          text = presenter.read_text(encoding="utf-8")
          old_presenter = '''export function marketingFinalResponseFromMission(missionResult = {}) {
              const completed = Array.isArray(missionResult?.completedTasks)
                  ? missionResult.completedTasks
                  : [];
              const marketing = [...completed].reverse().find(item =>
                  item?.name === "marketing.plan" &&
                  item?.observation?.status === "MARKETING_PACKAGE_READY" &&
                  typeof item?.observation?.userVisible === "string" &&
                  item.observation.userVisible.trim()
              );
              if (!marketing) return null;
              return {
                  ok: marketing.observation.objectiveSatisfied === true,
                  title: "Plan de marketing completo",
                  text: marketing.observation.userVisible,
                  source: "MARKETING_DELIVERABLE_DIRECT"
              };
          }
          '''
          new_presenter = '''function isMarketingDocumentTask(item = {}) {
              return (
                  item?.name === "document.create" &&
                  /plan de marketing completo/i.test(String(item?.args?.title || "")) &&
                  ["md", "pdf"].includes(String(item?.args?.format || "").trim().toLowerCase())
              );
          }

          function completedMarketingTask(completedTasks = []) {
              return [...(Array.isArray(completedTasks) ? completedTasks : [])]
                  .reverse()
                  .find(item =>
                      item?.name === "marketing.plan" &&
                      item?.observation?.status === "MARKETING_PACKAGE_READY" &&
                      item?.observation?.objectiveSatisfied === true &&
                      typeof item?.observation?.userVisible === "string" &&
                      item.observation.userVisible.trim()
                  ) || null;
          }

          export function marketingArtifactArgsFromCompletedTasks(completedTasks = [], requestedArgs = {}) {
              const format = String(requestedArgs?.format || "").trim().toLowerCase();
              const title = String(requestedArgs?.title || "").trim();
              if (!["md", "pdf"].includes(format) || !/plan de marketing completo/i.test(title)) {
                  return null;
              }
              const marketing = completedMarketingTask(completedTasks);
              if (!marketing) return null;
              return {
                  ...(requestedArgs || {}),
                  format,
                  title: title || "Plan de marketing completo",
                  content: marketing.observation.userVisible
              };
          }

          function marketingArtifactStatusLines(missionResult = {}) {
              const completed = Array.isArray(missionResult?.completedTasks)
                  ? missionResult.completedTasks.filter(isMarketingDocumentTask)
                  : [];
              const unresolved = [
                  ...(Array.isArray(missionResult?.blockedTasks) ? missionResult.blockedTasks : []),
                  ...(Array.isArray(missionResult?.pendingTasks) ? missionResult.pendingTasks : [])
              ].filter(isMarketingDocumentTask);
              const outputs = completed
                  .map(item => ({
                      format: String(item?.args?.format || "archivo").toUpperCase(),
                      output:
                          item?.observation?.artifact ||
                          item?.observation?.evidence?.output ||
                          item?.observation?.evidence?.artifact?.output ||
                          ""
                  }))
                  .filter(item => item.output);

              if (unresolved.length > 0) {
                  return [
                      "",
                      "## Archivos descargables",
                      "El plan está completo, pero la entrega de archivos todavía no terminó.",
                      `Pendientes: ${unresolved.map(item => String(item?.args?.format || "archivo").toUpperCase()).join(", ")}.`,
                      "No se declara la entrega documental como completada hasta que esos artefactos existan y puedan descargarse."
                  ];
              }
              if (outputs.length > 0) {
                  return [
                      "",
                      "## Archivos descargables",
                      ...outputs.map(item => `- ${item.format}: ${item.output}`)
                  ];
              }
              return [];
          }

          export function marketingFinalResponseFromMission(missionResult = {}) {
              const completed = Array.isArray(missionResult?.completedTasks)
                  ? missionResult.completedTasks
                  : [];
              const marketing = completedMarketingTask(completed);
              if (!marketing) return null;
              const unresolvedMarketingArtifacts = [
                  ...(Array.isArray(missionResult?.blockedTasks) ? missionResult.blockedTasks : []),
                  ...(Array.isArray(missionResult?.pendingTasks) ? missionResult.pendingTasks : [])
              ].filter(isMarketingDocumentTask);
              return {
                  ok:
                      marketing.observation.objectiveSatisfied === true &&
                      unresolvedMarketingArtifacts.length === 0,
                  title: "Plan de marketing completo",
                  text: [
                      marketing.observation.userVisible,
                      ...marketingArtifactStatusLines(missionResult)
                  ].join("\\n"),
                  source: "MARKETING_DELIVERABLE_DIRECT"
              };
          }
          '''
          if old_presenter not in text:
              raise SystemExit("marketing presenter function not found")
          presenter.write_text(text.replace(old_presenter, new_presenter, 1), encoding="utf-8")

          core = Path("gestia-core/gestia-core.js")
          text = core.read_text(encoding="utf-8")
          old_import = '''import {
              marketingFinalResponseFromMission
          } from '/gestia-core/jarvis/jarvis.marketing.presenter.js?v=sia7-marketing-deliverable-v1-20260805';'''
          new_import = '''import {
              marketingArtifactArgsFromCompletedTasks,
              marketingFinalResponseFromMission
          } from '/gestia-core/jarvis/jarvis.marketing.presenter.js?v=v94-marketing-artifact-delivery-20260807';'''
          if old_import not in text:
              raise SystemExit("core marketing presenter import not found")
          text = text.replace(old_import, new_import, 1)

          open_block = '''                    if (
                              call?.name === "document.create" &&
                              Array.isArray(missionContext?.completedTasks)
                          ) {
                              const blueprintTask ='''
          replacement = '''                    if (
                              call?.name === "document.create" &&
                              Array.isArray(missionContext?.completedTasks)
                          ) {
                              const marketingArtifactArgs =
                                  marketingArtifactArgsFromCompletedTasks(
                                      missionContext.completedTasks,
                                      executionCall.args
                                  );
                              if (marketingArtifactArgs) {
                                  executionCall.args = marketingArtifactArgs;
                                  argumentGrounded = true;
                              }

                              const blueprintTask ='''
          if open_block not in text:
              raise SystemExit("core document.create hydration block not found")
          text = text.replace(open_block, replacement, 1)

          first_blueprint = '''                        if (
                              blueprintTask?.name === "spreadsheet.compose" &&'''
          first_blueprint_new = '''                        if (
                              !argumentGrounded &&
                              blueprintTask?.name === "spreadsheet.compose" &&'''
          if first_blueprint not in text:
              raise SystemExit("spreadsheet blueprint condition not found")
          text = text.replace(first_blueprint, first_blueprint_new, 1)

          second_blueprint = '''                        else if (
                              blueprintTask?.name === "document.compose" &&'''
          second_blueprint_new = '''                        else if (
                              !argumentGrounded &&
                              blueprintTask?.name === "document.compose" &&'''
          if second_blueprint not in text:
              raise SystemExit("document blueprint condition not found")
          text = text.replace(second_blueprint, second_blueprint_new, 1)
          core.write_text(text, encoding="utf-8")

          attachments = Path("modules/terminal/jarvis-attachments.js")
          text = attachments.read_text(encoding="utf-8")
          text = text.replace(
              'const VERSION = "2.3.0-complete-batch-fail-closed";',
              'const VERSION = "2.4.0-user-artifact-preview-download";',
              1
          )
          old_html_preview = '''        else if ((payload.mimeType || mimeType) === "text/html") {
              const frame = document.createElement("iframe");
              frame.src = objectUrl;
              frame.title = payload.fileName || "Vista previa de página creada por Jarvis";
              frame.sandbox = "allow-forms allow-scripts allow-popups";
              frame.className = "w-full h-[32rem] rounded-lg bg-white mb-3 border border-slate-700";
              frame.dataset.testid = "jarvis-html-preview";
              card.appendChild(frame);
          }
          '''
          new_html_preview = '''        else if ((payload.mimeType || mimeType) === "text/html") {
              const frame = document.createElement("iframe");
              frame.src = objectUrl;
              frame.title = payload.fileName || "Vista previa de página creada por Jarvis";
              frame.sandbox = "allow-forms allow-scripts allow-popups";
              frame.className = "w-full h-[32rem] rounded-lg bg-white mb-3 border border-slate-700";
              frame.dataset.testid = "jarvis-html-preview";
              card.appendChild(frame);
          }
          else if ((payload.mimeType || mimeType) === "application/pdf") {
              const frame = document.createElement("iframe");
              frame.src = objectUrl;
              frame.title = payload.fileName || "Vista previa del PDF creado por NEXO";
              frame.className = "w-full h-[32rem] rounded-lg bg-white mb-3 border border-slate-700";
              frame.dataset.testid = "jarvis-pdf-preview";
              card.appendChild(frame);
          }
          '''
          if old_html_preview not in text:
              raise SystemExit("attachment HTML preview block not found")
          text = text.replace(old_html_preview, new_html_preview, 1)

          old_download = '''        const download = createElement("a", "shrink-0 inline-flex items-center gap-2 rounded-lg bg-blue-600 hover:bg-blue-500 px-3 py-2 text-xs font-semibold text-white", "Descargar");
              download.href = objectUrl;
              download.download = payload.fileName || "jarvis-artifact";
              download.dataset.testid = "jarvis-artifact-download";
              row.appendChild(download);
          '''
          new_download = '''        const actions = createElement("div", "shrink-0 flex items-center gap-2");
              const resolvedMimeType = String(payload.mimeType || mimeType || "").toLowerCase();
              const canOpen =
                  resolvedMimeType === "application/pdf" ||
                  resolvedMimeType === "text/html" ||
                  resolvedMimeType.startsWith("image/") ||
                  resolvedMimeType.startsWith("text/");
              if (canOpen) {
                  const open = createElement("a", "inline-flex items-center gap-2 rounded-lg border border-slate-500 hover:border-slate-300 px-3 py-2 text-xs font-semibold text-slate-100", "Abrir");
                  open.href = objectUrl;
                  open.target = "_blank";
                  open.rel = "noopener noreferrer";
                  open.dataset.testid = "jarvis-artifact-open";
                  actions.appendChild(open);
              }
              const download = createElement("a", "inline-flex items-center gap-2 rounded-lg bg-blue-600 hover:bg-blue-500 px-3 py-2 text-xs font-semibold text-white", "Descargar");
              download.href = objectUrl;
              download.download = payload.fileName || "jarvis-artifact";
              download.dataset.testid = "jarvis-artifact-download";
              actions.appendChild(download);
              row.appendChild(actions);
          '''
          if old_download not in text:
              raise SystemExit("attachment download block not found")
          attachments.write_text(text.replace(old_download, new_download, 1), encoding="utf-8")

          compiler_test = Path("tests/nexo-mission-compiler.test.mjs")
          text = compiler_test.read_text(encoding="utf-8")
          old_test = '''    assert.deepEqual(names(plan), [
              "marketing.plan",
              "document.create",
              "reel.plan",
              "reel.create",
              "image.generate"
          ]);
          '''
          new_test = '''    assert.deepEqual(names(plan), [
              "marketing.plan",
              "document.create",
              "document.create",
              "reel.plan",
              "reel.create",
              "image.generate"
          ]);
          '''
          if old_test not in text:
              raise SystemExit("compiler names expectation not found")
          text = text.replace(old_test, new_test, 1)
          old_program = '''    const program = plan.toolCalls.find(call =>
              call.name === "document.create" && call.args.format === "json"
          );
          const parsedProgram = JSON.parse(program.args.content);
          assert.equal(parsedProgram.engine, "NEXO");
          assert.equal(parsedProgram.sevenDayProgram.length, 7);
          '''
          new_program = '''    const marketingFiles = plan.toolCalls
              .filter(call => call.name === "document.create")
              .map(call => call.args.format);
          assert.deepEqual(marketingFiles, ["md", "pdf"]);
          assert.ok(plan.toolCalls
              .filter(call => call.name === "document.create")
              .every(call => /Plan de marketing completo/.test(call.args.title)));
          '''
          if old_program not in text:
              raise SystemExit("compiler JSON program expectation not found")
          text = text.replace(old_program, new_program, 1)
          marker = 'test("one document instruction selects directly executable PDF XLSX and PPTX"'
          explicit_test = '''test("named marketing target is preserved in downloadable artifact titles", () => {
              const plan = compileNexoMission({
                  input: "Crea un plan de marketing completo para Multiservicios Peninsulares HMH.",
                  catalog
              });
              const campaign = plan.toolCalls.find(call => call.name === "marketing.plan");
              const files = plan.toolCalls.filter(call => call.name === "document.create");
              assert.equal(campaign.args.brandName, "Multiservicios Peninsulares HMH");
              assert.deepEqual(files.map(call => call.args.format), ["md", "pdf"]);
              assert.ok(files.every(call => call.args.title.includes("Multiservicios Peninsulares HMH")));
              assert.ok(files.every(call => call.args.content === undefined));
          });

          '''
          if explicit_test.strip() not in text:
              if marker not in text:
                  raise SystemExit("compiler test insertion marker not found")
              text = text.replace(marker, explicit_test + marker, 1)
          compiler_test.write_text(text, encoding="utf-8")

          attachment_test = Path("tests/jarvis-attachments.test.mjs")
          text = attachment_test.read_text(encoding="utf-8")
          text = text.replace(
              'assert.equal(description.version, "2.3.0-complete-batch-fail-closed");',
              'assert.equal(description.version, "2.4.0-user-artifact-preview-download");',
              1
          )
          anchor = '    assert.match(attachments, /jarvis-artifact-download/);\n'
          if anchor not in text:
              raise SystemExit("attachment test download assertion not found")
          text = text.replace(
              anchor,
              anchor + '    assert.match(attachments, /jarvis-artifact-open/);\n    assert.match(attachments, /jarvis-pdf-preview/);\n',
              1
          )
          attachment_test.write_text(text, encoding="utf-8")

          marketing_test = Path("tests/jarvis-marketing-engine-v2.test.mjs")
          text = marketing_test.read_text(encoding="utf-8")
          text = text.replace(
              '''import {
              marketingFinalResponseFromMission,
              MARKETING_PLAN_SECTIONS
          } from "../gestia-core/jarvis/jarvis.marketing.presenter.js";''',
              '''import {
              marketingArtifactArgsFromCompletedTasks,
              marketingFinalResponseFromMission,
              MARKETING_PLAN_SECTIONS
          } from "../gestia-core/jarvis/jarvis.marketing.presenter.js";''',
              1
          )
          marker = 'test("company registry remains available during NEXO migration"'
          artifact_test = '''test("completed marketing package hydrates MD and PDF artifacts from the exact visible plan", () => {
              const result = planMarketingRequest(
                  "Crea un plan de marketing completo para Multiservicios Peninsulares HMH.",
                  {
                      brandName: "Multiservicios Peninsulares HMH",
                      campaignObjective: "Captar clientes y prestadores durante los primeros 90 días",
                      audience: "Propietarios, administradores, pequeños negocios y personas que necesitan técnicos confiables",
                      market: "Cancún, Quintana Roo",
                      offer: "Plataforma de multiservicios para hogares y negocios",
                      pain: "Dificultad para encontrar profesionales verificados, disponibles y con seguimiento",
                      promise: "Conexión rápida con profesionales y trazabilidad del servicio",
                      differentiator: "Profesionales verificados, seguimiento y experiencia digital",
                      budget: "escenario bajo",
                      mediumBudget: "escenario medio",
                      horizon: "90 días",
                      cta: "Solicitar servicio o registrarse como profesional",
                      channels: ["Meta Ads", "Google Ads", "WhatsApp", "referidos"]
                  }
              );
              const completedTasks = [{
                  name: "marketing.plan",
                  observation: {
                      status: result.status,
                      objectiveSatisfied: result.objectiveSatisfied,
                      userVisible: result.userVisible
                  }
              }];
              for (const format of ["md", "pdf"]) {
                  const args = marketingArtifactArgsFromCompletedTasks(completedTasks, {
                      format,
                      title: "Plan de marketing completo — Multiservicios Peninsulares HMH"
                  });
                  assert.equal(args.format, format);
                  assert.equal(args.content, result.userVisible);
                  assert.match(args.content, /25\\. Próximos pasos priorizados/i);
                  assert.match(args.content, /Multiservicios Peninsulares HMH/i);
              }
              assert.equal(marketingArtifactArgsFromCompletedTasks(completedTasks, {
                  format: "pdf",
                  title: "Contrato comercial"
              }), null);
          });

          test("marketing response reports real downloadable outputs or honest pending state", () => {
              const marketingTask = {
                  name: "marketing.plan",
                  observation: {
                      status: "MARKETING_PACKAGE_READY",
                      objectiveSatisfied: true,
                      userVisible: "# Plan de marketing completo — HMH\\n\\n## 1. Resumen ejecutivo\\nListo"
                  }
              };
              const ready = marketingFinalResponseFromMission({
                  completedTasks: [
                      marketingTask,
                      {
                          name: "document.create",
                          args: { format: "md", title: "Plan de marketing completo — HMH" },
                          observation: { artifact: ".jarvis-artifacts/documents/hmh.md" }
                      },
                      {
                          name: "document.create",
                          args: { format: "pdf", title: "Plan de marketing completo — HMH" },
                          observation: { artifact: ".jarvis-artifacts/documents/hmh.pdf" }
                      }
                  ],
                  blockedTasks: [],
                  pendingTasks: []
              });
              assert.equal(ready.ok, true);
              assert.match(ready.text, /Archivos descargables/);
              assert.match(ready.text, /hmh\\.md/);
              assert.match(ready.text, /hmh\\.pdf/);

              const pending = marketingFinalResponseFromMission({
                  completedTasks: [marketingTask],
                  blockedTasks: [{
                      name: "document.create",
                      args: { format: "pdf", title: "Plan de marketing completo — HMH" }
                  }],
                  pendingTasks: []
              });
              assert.equal(pending.ok, false);
              assert.match(pending.text, /entrega de archivos todavía no terminó/i);
              assert.match(pending.text, /PDF/);
          });

          '''
          if artifact_test.strip() not in text:
              if marker not in text:
                  raise SystemExit("marketing test insertion marker not found")
              text = text.replace(marker, artifact_test + marker, 1)
          text = text.replace(
              '    assert.match(core, /marketingFinalResponseFromMission\\(\\s*missionResult\\s*\\)/);',
              '    assert.match(core, /marketingFinalResponseFromMission\\(\\s*missionResult\\s*\\)/);\n    assert.match(core, /marketingArtifactArgsFromCompletedTasks/);',
              1
          )
          marketing_test.write_text(text, encoding="utf-8")

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Focused artifact and marketing regression
        run: |
          node --check gestia-core/nexo/nexo.mission.compiler.js
          node --check gestia-core/jarvis/jarvis.marketing.presenter.js
          node --check gestia-core/gestia-core.js
          node --check modules/terminal/jarvis-attachments.js
          node --test tests/nexo-mission-compiler.test.mjs tests/jarvis-marketing-engine-v2.test.mjs tests/jarvis-attachments.test.mjs tests/jarvis-mission-orchestrator.test.mjs tests/jarvis-multifunction-tools.test.mjs
          git diff --check

      - name: Complete certification suite
        run: npm run ci:test

      - name: Real bridge artifact roundtrip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .jarvis-artifacts/documents
          mkdir -p .jarvis-artifacts/documents
          node jarvis-upload-bridge.js > /tmp/jarvis-bridge.log 2>&1 &
          BRIDGE_PID=$!
          trap 'kill $BRIDGE_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3344/health >/tmp/bridge-health.json 2>/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3344/health >/tmp/bridge-health.json
          cat > /tmp/marketing-artifact-e2e.mjs <<'NODE'
          import { planMarketingRequest } from process.cwd() + '/gestia-core/jarvis/jarvis.marketing.engine.js';
          const result = planMarketingRequest(
            'Crea un plan de marketing completo para Multiservicios Peninsulares HMH.',
            {
              brandName: 'Multiservicios Peninsulares HMH',
              campaignObjective: 'Captar clientes y prestadores durante los primeros 90 días',
              audience: 'Propietarios, administradores, pequeños negocios y personas que necesitan técnicos confiables',
              market: 'Cancún, Quintana Roo',
              offer: 'Plataforma de multiservicios para hogares y negocios',
              pain: 'Dificultad para encontrar profesionales verificados, disponibles y con seguimiento',
              promise: 'Conexión rápida con profesionales y trazabilidad del servicio',
              differentiator: 'Profesionales verificados, seguimiento y experiencia digital',
              budget: 'escenario bajo',
              mediumBudget: 'escenario medio',
              horizon: '90 días',
              cta: 'Solicitar servicio o registrarse como profesional',
              channels: ['Meta Ads', 'Google Ads', 'contenido local', 'WhatsApp', 'referidos']
            }
          );
          if (result.status !== 'MARKETING_PACKAGE_READY') throw new Error(result.status);
          if (!/25\. Próximos pasos priorizados/i.test(result.userVisible)) throw new Error('MARKETING_25_SECTIONS_MISSING');
          const call = async body => {
            const response = await fetch('http://127.0.0.1:3344/document', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'origin': 'http://127.0.0.1:4173' },
              body: JSON.stringify(body)
            });
            const json = await response.json();
            if (!response.ok || json.ok !== true || !json.output || !json.bytes) {
              throw new Error(`DOCUMENT_CREATE_FAILED:${response.status}:${JSON.stringify(json)}`);
            }
            return json;
          };
          const md = await call({
            format: 'md',
            title: 'Plan de marketing completo — Multiservicios Peninsulares HMH',
            content: result.userVisible,
            caseId: 'CASE-HMH-ARTIFACT-E2E',
            objectiveId: 'OBJ-HMH-ARTIFACT-E2E'
          });
          const pdf = await call({
            format: 'pdf',
            title: 'Plan de marketing completo — Multiservicios Peninsulares HMH',
            content: result.userVisible,
            caseId: 'CASE-HMH-ARTIFACT-E2E',
            objectiveId: 'OBJ-HMH-ARTIFACT-E2E'
          });
          for (const artifact of [md, pdf]) {
            const response = await fetch('http://127.0.0.1:3344/artifact/read', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'origin': 'http://127.0.0.1:4173' },
              body: JSON.stringify({ output: artifact.output })
            });
            const json = await response.json();
            if (!response.ok || json.ok !== true || !json.dataBase64 || Number(json.bytes) <= 0) {
              throw new Error(`ARTIFACT_READ_FAILED:${artifact.output}`);
            }
          }
          console.log(JSON.stringify({
            status: 'MARKETING_ARTIFACT_ROUNDTRIP_OK',
            planSections: 25,
            artifacts: [
              { format: 'md', output: md.output, bytes: md.bytes },
              { format: 'pdf', output: pdf.output, bytes: pdf.bytes }
            ]
          }));
          NODE
          node /tmp/marketing-artifact-e2e.mjs
          kill $BRIDGE_PID
          wait $BRIDGE_PID 2>/dev/null || true
          trap - EXIT

      - name: Browser artifact card smoke test
        shell: bash
        run: |
          set -euo pipefail
          node jarvis-upload-bridge.js > /tmp/jarvis-bridge-browser.log 2>&1 &
          BRIDGE_PID=$!
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http-server.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $BRIDGE_PID $HTTP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3344/health >/dev/null 2>&1 && break
            sleep 1
          done
          cat > artifact-render-e2e.html <<'HTML'
          <!doctype html><html><body><div id="gestia-output"><div><div class="bg-gestia-panel"></div></div></div><script type="module">
          window.JarvisLocalBridge = { requestJson: async (route, payload) => {
            const response = await fetch(`http://127.0.0.1:3344${route}`, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(payload) });
            return await response.json();
          }};
          const { JarvisAttachments } = await import('/modules/terminal/jarvis-attachments.js?v=e2e-artifact-card');
          const list = await fetch('http://127.0.0.1:3344/artifact/list', {method:'POST',headers:{'content-type':'application/json'},body:'{}'}).then(r=>r.json());
          const artifacts = (list.artifacts || []).filter(item => /plan-de-marketing-completo/i.test(item.output || '') || /plan.*marketing/i.test(item.output || '')).slice(-2);
          for (const item of artifacts) await JarvisAttachments.renderArtifact(item.output, item.mimeType || '', 'document.create');
          const cards = document.querySelectorAll('[data-testid="jarvis-artifact-card"]').length;
          const downloads = document.querySelectorAll('[data-testid="jarvis-artifact-download"]').length;
          const opens = document.querySelectorAll('[data-testid="jarvis-artifact-open"]').length;
          document.body.dataset.e2e = `${cards}:${downloads}:${opens}`;
          document.body.insertAdjacentHTML('beforeend', `<pre id="e2e-result">E2E:${cards}:${downloads}:${opens}</pre>`);
          </script></body></html>
          HTML
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome executable unavailable; installing chromium via apt is intentionally avoided." >&2
            exit 1
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=8000 --dump-dom http://127.0.0.1:4173/artifact-render-e2e.html > /tmp/artifact-dom.html
          grep -q 'E2E:2:2:2' /tmp/artifact-dom.html
          grep -q 'jarvis-artifact-download' /tmp/artifact-dom.html
          grep -q 'jarvis-artifact-open' /tmp/artifact-dom.html
          rm -f artifact-render-e2e.html
          kill $BRIDGE_PID $HTTP_PID
          wait $BRIDGE_PID 2>/dev/null || true
          wait $HTTP_PID 2>/dev/null || true
          trap - EXIT


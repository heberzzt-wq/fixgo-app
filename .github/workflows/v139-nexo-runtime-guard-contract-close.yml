name: v139 nexo runtime guard contract close

on:
  push:
    branches:
      - v94-media-v4n-negative-claims
    paths:
      - '.github/workflows/v139-nexo-runtime-guard-contract-close.yml'

permissions:
  contents: write

jobs:
  close-runtime-guard-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v94-media-v4n-negative-claims
          fetch-depth: 0

      - name: Guard branch and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v94-media-v4n-negative-claims"
          git merge-base --is-ancestor 0286eecc567de7777ed9c825191cfbe15da48ed1 HEAD
          ! git diff --name-only 09d7333bc7b6f86d9698c0a69c8c94e1e0717817..HEAD | grep -E '^functions/'
          ! git diff --name-only 2d58a795a1e81a0adc5301bf958f80c604f8ef52..HEAD | grep -E '^multiservicios-web/'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize strict current runtime guard contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          guard_path = Path('gestia-core/nexo/nexo.real-media.runtime-guard-v128.js')
          test_path = Path('tests/nexo-real-media-runtime-guard-v128.test.mjs')

          guard = guard_path.read_text(encoding='utf-8')
          old_import = '''import {
              reelSceneMediaCoverage
          } from "../jarvis/jarvis.reel.media-binder.js?v=v131-semantic-scene-media-authority-20260811";
          '''
          new_import = old_import + '''import {
              NEXO_REAL_MEDIA_TOOLS_VERSION
          } from "./nexo.real-media.tools.js?v=v137-local-speech-synthesis-20260812";
          '''
          if old_import not in guard:
              raise SystemExit('GUARD_IMPORT_ANCHOR_NOT_FOUND')
          guard = guard.replace(old_import, new_import, 1)

          old_previous = '''function previousDefinition(runtime, name) {
              if (typeof runtime?.get === "function") return runtime.get(name);
              return runtime?._registry?.get?.(name) || null;
          }
          '''
          new_previous = old_previous + '''
          function realMediaToolsReady(runtime) {
              const collector = previousDefinition(runtime, "web.media.collect");
              const reel = previousDefinition(runtime, "reel.create");
              return (
                  typeof collector?.execute === "function" &&
                  typeof reel?.execute === "function" &&
                  String(collector?.version || "") === NEXO_REAL_MEDIA_TOOLS_VERSION &&
                  String(reel?.version || "") === NEXO_REAL_MEDIA_TOOLS_VERSION
              );
          }
          '''
          if old_previous not in guard:
              raise SystemExit('GUARD_PREVIOUS_ANCHOR_NOT_FOUND')
          guard = guard.replace(old_previous, new_previous, 1)

          old_ready = '''            const runtime = runtimeCandidate();
                      const collector = previousDefinition(runtime, "web.media.collect");
                      const reel = previousDefinition(runtime, "reel.create");
                      const realMediaReady =
                          typeof collector?.execute === "function" &&
                          typeof reel?.execute === "function" &&
                          String(collector?.version || "").includes("real-media-reel-hydration-v127") &&
                          String(reel?.version || "").includes("real-media-reel-hydration-v127");
                      if (realMediaReady) {
          '''
          new_ready = '''            const runtime = runtimeCandidate();
                      if (realMediaToolsReady(runtime)) {
          '''
          if old_ready not in guard:
              raise SystemExit('GUARD_READY_BLOCK_NOT_FOUND')
          guard = guard.replace(old_ready, new_ready, 1)

          old_test_export = '''    hasExplicitSceneMedia,
              hydrateReelArgs
          };'''
          new_test_export = '''    hasExplicitSceneMedia,
              hydrateReelArgs,
              realMediaToolsReady
          };'''
          if old_test_export not in guard:
              raise SystemExit('GUARD_TEST_EXPORT_ANCHOR_NOT_FOUND')
          guard = guard.replace(old_test_export, new_test_export, 1)
          guard_path.write_text(guard, encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          import_anchor = '''} from "../gestia-core/nexo/nexo.real-media.runtime-guard-v128.js";
          '''
          import_extra = import_anchor + '''import {
              NEXO_REAL_MEDIA_TOOLS_VERSION
          } from "../gestia-core/nexo/nexo.real-media.tools.js";
          '''
          if import_anchor not in test:
              raise SystemExit('TEST_IMPORT_ANCHOR_NOT_FOUND')
          test = test.replace(import_anchor, import_extra, 1)

          stale_literal = 'version: "1.3.0-real-media-reel-hydration-v127"'
          if test.count(stale_literal) != 2:
              raise SystemExit(f'EXPECTED_TWO_STALE_TEST_VERSIONS:{test.count(stale_literal)}')
          test = test.replace(stale_literal, 'version: NEXO_REAL_MEDIA_TOOLS_VERSION', 2)

          make_runtime_anchor = '''function makeRuntime() {
              const registry = new Map();
              return {
                  get(name) {
                      return registry.get(name) || null;
                  },
                  register(definition) {
                      registry.set(definition.name, definition);
                      return definition;
                  },
                  registry
              };
          }
          '''
          readiness_test = make_runtime_anchor + '''
          test("v139 runtime guard readiness follows current real-media tools contract and rejects stale v127", () => {
              const current = makeRuntime();
              current.register({
                  name: "web.media.collect",
                  version: NEXO_REAL_MEDIA_TOOLS_VERSION,
                  execute: async () => ({ ok: true })
              });
              current.register({
                  name: "reel.create",
                  version: NEXO_REAL_MEDIA_TOOLS_VERSION,
                  execute: async () => ({ ok: true })
              });
              assert.equal(runtimeGuardTest.realMediaToolsReady(current), true);

              const stale = makeRuntime();
              stale.register({
                  name: "web.media.collect",
                  version: "1.3.0-real-media-reel-hydration-v127",
                  execute: async () => ({ ok: true })
              });
              stale.register({
                  name: "reel.create",
                  version: "1.3.0-real-media-reel-hydration-v127",
                  execute: async () => ({ ok: true })
              });
              assert.equal(runtimeGuardTest.realMediaToolsReady(stale), false);
          });
          '''
          if make_runtime_anchor not in test:
              raise SystemExit('TEST_RUNTIME_ANCHOR_NOT_FOUND')
          test = test.replace(make_runtime_anchor, readiness_test, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          grep -q 'NEXO_REAL_MEDIA_TOOLS_VERSION' gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          ! grep -q 'includes("real-media-reel-hydration-v127")' gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          grep -q 'realMediaToolsReady' tests/nexo-real-media-runtime-guard-v128.test.mjs

      - name: Syntax and focused runtime guard regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check gestia-core/nexo/nexo.real-media.runtime-guard-v128.js
          node --test \
            tests/nexo-real-media-runtime-guard-v128.test.mjs \
            tests/nexo-real-media-tools.test.mjs \
            tests/nexo-real-media-semantic-binding-v131.test.mjs \
            tests/nexo-terminal-bootstrap.test.mjs \
            tests/jarvis-reel-speech-v137.test.mjs

      - name: Full CI because product JS changed
        run: npm run ci:test

      - name: Guard protected surfaces remain untouched
        shell: bash
        run: |
          set -euo pipefail
          ! git diff --name-only | grep -E '^functions/'
          ! git diff --name-only | grep -E '^multiservicios-web/'
          changed="$(git diff --name-only)"
          echo "$changed"
          echo "$changed" | grep -q '^gestia-core/nexo/nexo.real-media.runtime-guard-v128.js$'
          echo "$changed" | grep -q '^tests/nexo-real-media-runtime-guard-v128.test.mjs$'

      - name: Commit product fix and self-delete verifier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v139-nexo-runtime-guard-contract-close.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gestia-core/nexo/nexo.real-media.runtime-guard-v128.js tests/nexo-real-media-runtime-guard-v128.test.mjs .github/workflows/v139-nexo-runtime-guard-contract-close.yml
          git diff --cached --name-only
          ! git diff --cached --name-only | grep -E '^(functions/|multiservicios-web/)'
          git commit -m 'fix(v139): align nexo runtime guard readiness'
          git push origin HEAD:v94-media-v4n-negative-claims

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo | Únete a la Red</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
        }
        .uber-card {
            background: linear-gradient(145deg, #111111, #050505);
            border: 1px solid #222;
        }
        .btn-glow-blue:hover {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .btn-glow-white:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .transition-fixgo {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-center items-center p-4">

    <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg shadow-blue-900/20">
            <i class="fas fa-bolt text-3xl"></i>
        </div>
        <h1 class="text-4xl font-black italic tracking-tighter uppercase leading-none">
            FIX<span class="text-blue-500">GO</span>
        </h1>
        <p class="text-slate-500 text-[10px] font-bold tracking-[0.3em] mt-2 uppercase">
            Ecosistema de Servicios 2026
        </p>
    </div>

    <div class="w-full max-w-sm">
        <h2 class="text-xl font-bold text-center mb-8 text-slate-200">¿Cómo deseas empezar?</h2>

        <div class="space-y-4">
            
            <a href="registro-cliente.html?rol=cliente" 
               class="uber-card group block p-6 rounded-[2rem] transition-fixgo hover:border-blue-500 border-transparent relative overflow-hidden">
                <div class="flex items-center justify-between relative z-10">
                    <div>
                        <h3 class="text-2xl font-black text-white">CLIENTE</h3>
                        <p class="text-slate-400 text-sm">Necesito un servicio ahora.</p>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center group-hover:bg-blue-600 transition-fixgo">
                        <i class="fas fa-user text-lg"></i>
                    </div>
                </div>
                <div class="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-fixgo">
                    <i class="fas fa-map-marker-alt text-8xl"></i>
                </div>
            </a>

            <a href="registro-tecnico.html?rol=tecnico" 
               class="uber-card group block p-6 rounded-[2rem] transition-fixgo hover:border-emerald-500 border-transparent relative overflow-hidden">
                <div class="flex items-center justify-between relative z-10">
                    <div>
                        <h3 class="text-2xl font-black text-white">SOCIO</h3>
                        <p class="text-slate-400 text-sm">Quiero generar ingresos.</p>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center group-hover:bg-emerald-600 transition-fixgo">
                        <i class="fas fa-tools text-lg"></i>
                    </div>
                </div>
                <div class="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-fixgo">
                    <i class="fas fa-briefcase text-8xl"></i>
                </div>
            </a>

        </div>

        <div class="mt-12 text-center">
            <p class="text-slate-500 text-sm mb-6">¿Ya tienes una cuenta?</p>
            <a href="login.html" class="inline-block w-full py-4 bg-white text-black font-black rounded-2xl transition-fixgo hover:bg-slate-200 transform active:scale-95 shadow-xl">
                INICIAR SESIÓN
            </a>
        </div>
    </div>

    <footer class="mt-16 max-w-xs text-center">
        <p class="text-[9px] text-slate-600 leading-relaxed font-medium">
            Al registrarte, aceptas nuestros 
            <a href="#" class="text-slate-400 underline italic">Términos y Condiciones</a> 
            y la <a href="#" class="text-slate-400 underline italic">Política de Privacidad</a> de FixGo Sureste.
        </p>
    </footer>

</body>
</html>

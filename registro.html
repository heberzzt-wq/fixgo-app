<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FixGo | Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl grid md:grid-cols-2 gap-8">
        
        <div class="bg-zinc-900 p-8 rounded-3xl border border-zinc-800">
            <h2 class="text-2xl font-black mb-6">Soy Cliente</h2>
            <form id="formCliente" class="space-y-4">
                <input type="text" id="nombreC" placeholder="Nombre" class="w-full bg-black p-4 rounded-xl border border-zinc-700">
                <input type="email" id="emailC" placeholder="Correo" class="w-full bg-black p-4 rounded-xl border border-zinc-700">
                <input type="password" id="passC" placeholder="Contraseña" class="w-full bg-black p-4 rounded-xl border border-zinc-700">
                <input type="tel" id="telC" placeholder="Teléfono" class="w-full bg-black p-4 rounded-xl border border-zinc-700">
                <button type="submit" class="w-full bg-indigo-600 py-4 rounded-xl font-black mt-4">CREAR CUENTA</button>
            </form>
        </div>

        <div class="bg-zinc-900 p-8 rounded-3xl border border-zinc-800">
            <h2 class="text-2xl font-black mb-6">Soy Técnico</h2>
            <form id="formTecnico" class="space-y-4">
                <input type="text" id="nombreT" placeholder="Nombre" class="w-full bg-black p-4 rounded-xl border border-zinc-700">
                <input type="email" id="emailT" placeholder="Correo" class="w-full bg-black p-4 rounded-xl border border-zinc-700">
                <input type="password" id="passT" placeholder="Contraseña" class="w-full bg-black p-4 rounded-xl border border-zinc-700">
                <input type="tel" id="telT" placeholder="Teléfono" class="w-full bg-black p-4 rounded-xl border border-zinc-700">
                <button type="submit" class="w-full bg-emerald-600 py-4 rounded-xl font-black mt-4">UNIRME AL EQUIPO</button>
            </form>
        </div>

    </div>

    <script type="module">
        import { registrarUsuario } from './firebase.js';

        // CLIENTE
        document.getElementById('formCliente').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombreC').value;
            const email = document.getElementById('emailC').value;
            const pass = document.getElementById('passC').value;
            const tel = document.getElementById('telC').value;

            try {
                await registrarUsuario(email, pass, "cliente", { nombre, telefono: tel });
                alert("¡Cuenta creada! Redirigiendo...");
                window.location.href = "cliente.html";
            } catch (error) {
                alert("Error: " + error.message);
            }
        });

        // TECNICO
        document.getElementById('formTecnico').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombreT').value;
            const email = document.getElementById('emailT').value;
            const pass = document.getElementById('passT').value;
            const tel = document.getElementById('telT').value;

            try {
                await registrarUsuario(email, pass, "tecnico", { nombre, telefono: tel });
                alert("Registro exitoso. Completa tu perfil.");
                window.location.href = "tecnico.html";
            } catch (error) {
                alert("Error: " + error.message);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGo - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #050505; }
        .uber-card { background-color: #121212; border: 1px solid rgba(255,255,255,0.1); }
        .uber-input { background-color: #1e1e1e; border: none; color: white; }
        .uber-input:focus { outline: 2px solid #6366f1; }
    </style>
</head>
<body class="text-white min-h-screen">

<header class="max-w-4xl mx-auto flex justify-between items-center p-6">
    <h1 class="text-3xl font-black tracking-tighter italic text-white">FIXGO</h1>
    <a href="index.html" class="text-indigo-500 font-bold">Inicio</a>
</header>

<main class="max-w-4xl mx-auto px-4 py-12">
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Registro Cliente -->
        <div class="uber-card p-8 rounded-[2.5rem] shadow-2xl">
            <h2 class="text-2xl font-black mb-6">Registro Cliente</h2>
            <form id="formRegistroCliente" class="space-y-4">
                <input type="text" name="nombre" placeholder="Nombre completo" required class="uber-input w-full px-4 py-3 rounded-2xl">
                <input type="email" name="email" placeholder="Correo electrónico" required class="uber-input w-full px-4 py-3 rounded-2xl">
                <input type="password" name="password" placeholder="Contraseña" required class="uber-input w-full px-4 py-3 rounded-2xl">
                <input type="tel" name="telefono" placeholder="Teléfono" required class="uber-input w-full px-4 py-3 rounded-2xl">
                <button type="submit" id="btnRegistroCliente" class="w-full bg-indigo-500 py-4 rounded-2xl font-black hover:bg-indigo-600 transition-all">Registrarme</button>
            </form>
        </div>

        <!-- Registro Técnico -->
        <div class="uber-card p-8 rounded-[2.5rem] shadow-2xl">
            <h2 class="text-2xl font-black mb-6">Registro Técnico</h2>
            <form id="formRegistroTecnico" class="space-y-4">
                <input type="text" name="nombre" placeholder="Nombre completo" required class="uber-input w-full px-4 py-3 rounded-2xl">
                <input type="email" name="email" placeholder="Correo electrónico" required class="uber-input w-full px-4 py-3 rounded-2xl">
                <input type="password" name="password" placeholder="Contraseña" required class="uber-input w-full px-4 py-3 rounded-2xl">
                <input type="tel" name="telefono" placeholder="Teléfono" required class="uber-input w-full px-4 py-3 rounded-2xl">

                <div class="flex flex-col gap-2">
                    <label class="text-slate-400 text-sm">INE:</label>
                    <input type="file" id="inputINE" class="hidden">
                    <button type="button" id="btnSubirINE" class="bg-indigo-600 py-2 px-4 rounded-2xl font-black hover:bg-indigo-700 transition-all">Subir INE</button>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-slate-400 text-sm">CSF:</label>
                    <input type="file" id="inputCSF" class="hidden">
                    <button type="button" id="btnSubirCSF" class="bg-indigo-600 py-2 px-4 rounded-2xl font-black hover:bg-indigo-700 transition-all">Subir CSF</button>
                </div>

                <button type="submit" id="btnRegistroTecnico" class="w-full bg-emerald-500 py-4 rounded-2xl font-black hover:bg-emerald-600 transition-all">Registrarme</button>
            </form>
        </div>
    </section>
</main>

<script type="module" src="./app-registro.js"></script>
</body>
</html>
